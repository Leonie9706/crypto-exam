  function goto(i) {
    if (i < 0 || i >= P.list.length) return;
    P.idx = i;
    if (state.session) { state.session.idx = i; save(); }
    window.App.renderCurrent();
  }

  function next() { goto(P.idx + 1); }
  function prev() { goto(P.idx - 1); }

  /* 当前题的展示状态 */
  function statusOf(q) {
    const chosen = P.chosen[q.id];
    const revealed = P.revealed[q.id];
    // 多选题必须显式提交才判分；其余题型在即时模式下选完即判
    const autoJudge = state.prefs.instant && q.kind !== "multi";
    const judged = !!revealed || (autoJudge && chosen != null && chosen !== "");
    let ok = null;
    if (judged) ok = grade(q, chosen).ok;
    return { chosen, revealed: !!revealed, judged, ok };
  }

  function choose(key) {
    const q = current();
    if (!q) return;
    const st = statusOf(q);
    if (st.judged) return;                               // 已判分则锁定
    if (q.kind === "multi") {
      const set = new Set((P.chosen[q.id] || "").split(""));
      if (set.has(key)) set.delete(key); else set.add(key);
      P.chosen[q.id] = [...set].sort().join("");
    } else {
      if (P.chosen[q.id] === key && !state.prefs.instant) {
        // 再点一次取消（未开启即时判分时）
        delete P.chosen[q.id];
      } else {
        P.chosen[q.id] = key;
      }
    }
    if (state.prefs.instant && (q.kind !== "multi")) submit(true);
    else window.App.renderCurrent();
  }

  function inputBlank(val) {
    const q = current();
    if (!q) return;
    P.chosen[q.id] = val;
  }

  function submit(silent) {
    const q = current();
    if (!q) return;
    if (P.judgedOnce && P.judgedOnce[q.id]) return;      // 防止重复计分
    const ans = P.chosen[q.id];
    if (ans == null || ans === "") { if (!silent) window.Core.toast("先作答再提交"); return; }
    const g = grade(q, ans);
    P.revealed[q.id] = true;
    P.judgedOnce = P.judgedOnce || {};
    P.judgedOnce[q.id] = true;
    if (g.ok) {
      // 答对：只更新统计（若之前在错题本里，保留待用户手动移除）
      const s = state.stats[q.id] || (state.stats[q.id] = { r: 0, w: 0 });
      s.r += 1; s.last = Date.now(); s.lastOk = true;
      window.Core.save();
    } else {
      // 答错：统计 + 错题本计一次
      window.Core.trackAnswer(q, false);
    }
    window.App.renderCurrent();
    if (g.ok && state.prefs.autoNext) {
      setTimeout(() => { if (current() === q) next(); }, 420);
    }
  }

  function reveal() {
    const q = current();
    if (!q) return;
    P.revealed[q.id] = true;
    if (P.chosen[q.id] == null && !(P.judgedOnce && P.judgedOnce[q.id])) {
      P.judgedOnce = P.judgedOnce || {};
      P.judgedOnce[q.id] = true;
      window.Core.trackAnswer(q, false);
    }
    window.App.renderCurrent();
  }

  function fav() {
    const q = current();
    if (!q) return;
    window.Core.toast(toggleFav(q.id) ? "已收藏" : "已取消收藏");
    window.App.renderCurrent();
  }

  /* ---------- 答题卡 ---------- */
  function sheetHtml() {
    const cells = P.list.map((q, i) => {
      const s = state.stats[q.id];
      let cls = "";
      if (s && s.r > 0) cls = s.lastOk ? "done" : "bad";
      if (P.chosen[q.id] != null) {
        const g = grade(q, P.chosen[q.id]);
        cls = g.ok ? "done" : (P.revealed[q.id] || state.prefs.instant ? "bad" : "");
      }
      if (i === P.idx) cls += " cur";
      return `<button class="${cls}" data-jump="${i}" title="第 ${i + 1} 题">${i + 1}</button>`;
    });
    return `<div class="sheet">${cells.join("")}</div>`;
  }

  /* ---------- 主渲染 ---------- */
  function render() {
    const q = current();
    const total = P.list.length;
    const pr = window.Core.progressOf(P.list);
    const cats = window.BANK_META.tree;

    /* 左侧分类 */
    const left = [];
    left.push(`<div class="card"><h2>选择范围</h2><ul class="cat-list">`);
    const allActive = !P.filter.part && !P.filter.cat && !P.filter.type;
    left.push(`<li><button class="cat-item ${allActive ? "active" : ""}" data-scope="all">
      <span>全部题目</span><span class="n">${window.BANK_META.total}</span></button></li>`);
    Object.keys(cats).forEach((part) => {
      left.push(`<li><div class="cat-head">${esc(part)}</div><ul class="cat-list">`);
      Object.keys(cats[part]).forEach((cat) => {
        const counts = cats[part][cat];
        const n = Object.keys(counts).reduce((a, k) => a + counts[k], 0);
        const act = P.filter.part === part && P.filter.cat === cat && !P.filter.type;
        left.push(`<li><button class="cat-item ${act ? "active" : ""}" data-part="${esc(part)}" data-cat="${esc(cat)}">
          <span>${esc(cat.replace(/^[一二三四五六七八九十]+、/, ""))}</span><span class="n">${n}</span></button></li>`);
        if (act) {
          left.push(`<li><ul class="cat-list" style="margin:6px 0 0 10px">`);
          Object.keys(counts).forEach((t) => {
            const tact = P.filter.type === t;
            left.push(`<li><button class="cat-item ${tact ? "active" : ""}" data-part="${esc(part)}" data-cat="${esc(cat)}" data-type="${esc(t)}">
              <span>${esc(t)}</span><span class="n">${counts[t]}</span></button></li>`);
          });
          left.push(`</ul></li>`);
        }
        left.push(`</ul></li>`);
      });
      left.push(`</li>`);
    });
    left.push(`</ul></div>`);

    /* 中间题卡 */
    let mid;
    if (!q) {
      mid = `<div class="card"><div class="empty">当前范围没有题目</div></div>`;
    } else {
      const st = statusOf(q);
      const locked = st.judged;
      const multi = q.kind === "multi";
      let optsHtml = "";
      if (q.pairs && q.pairs.length) {
        optsHtml += `<table class="match-table">` + q.pairs.map((p) => {
          const parts = p.split("——");
          return `<tr><td>${esc(parts[0])}</td><td>${esc(parts[1] || "")}</td></tr>`;
        }).join("") + `</table>`;
      }
      if (q.options && q.options.length) {
        optsHtml += `<ul class="opts">` + q.options.map((o) => {
          const isChosen = (st.chosen || "").indexOf(o.key) >= 0;
          let cls = "opt" + (isChosen ? " chosen" : "");
          if (st.judged) {
            const isRight = q.answer.indexOf(o.key) >= 0;
            if (isRight) cls = "opt correct";
            else if (isChosen) cls = "opt wrong";
            cls += " locked";
          }
          return `<li class="${cls}" data-key="${o.key}">
            <span class="key">${o.key}</span><span class="txt">${esc(o.text)}</span></li>`;
        }).join("") + `</ul>`;
      } else if (q.kind === "blank") {
        optsHtml = `<div style="margin-top:16px">
          <input class="blank-input" id="blankInput" placeholder="在此输入答案后回车提交" value="${esc(st.chosen || "")}" ${locked ? "disabled" : ""}>
          <div class="muted" style="margin-top:6px">支持填写数字/文字（自动忽略大小写、空格与单位），回车提交</div></div>`;
      } else if (q.kind === "judge") {
        optsHtml = `<ul class="opts">
          ${["对", "错"].map((k) => {
            const isChosen = st.chosen === k;
            let cls = "opt" + (isChosen ? " chosen" : "");
            if (st.judged) {
              if (q.answer === k) cls = "opt correct";
              else if (isChosen) cls = "opt wrong";
              cls += " locked";
            }
            return `<li class="${cls}" data-key="${k}"><span class="key">${k === "对" ? "√" : "×"}</span><span class="txt">${k}</span></li>`;
          }).join("")}
        </ul>`;
      }

      let resultHtml = "";
      if (st.judged) {
        const g = grade(q, st.chosen);
        const rightTxt = q.kind === "judge" ? q.answer : (q.kind === "blank" ? q.answer : q.answer.split("").join(" "));
        resultHtml = `<div class="result ${g.ok ? "ok" : "bad"}">
          <div class="r-title">${g.ok ? "✓ 回答正确" : "✗ 回答错误"}　正确答案：${esc(rightTxt)}${st.chosen ? "　你的答案：" + esc(q.kind === "judge" ? st.chosen : (q.kind === "blank" ? st.chosen : st.chosen.split("").join(" "))) : "　（未作答）"}</div>
          ${g.partial ? `<div class="muted">评分说明：${esc(g.partial)}</div>` : ""}
          <div class="exp-block">
            <h4>为什么选它</h4><p>${esc(q.correctReason || q.analysis || "")}</p>
            ${q.wrongReason ? `<h4>其他选项为什么不对</h4><p>${esc(q.wrongReason)}</p>` : ""}
            ${q.analysis ? `<h4>解析</h4><p>${esc(q.analysis)}</p>` : ""}
            <h4>依据</h4><p>${esc(q.source || "—")}</p>
            <h4>考点</h4><p>${esc(q.keyPoint || "—")}</p>
            ${q.conflict ? `<p class="muted" style="margin-top:8px">⚠ ${esc(q.conflict)}</p>` : ""}
            ${q.note ? `<p class="muted" style="margin-top:6px">※ ${esc(q.note)}</p>` : ""}
          </div>
        </div>`;
      }

      mid = `<div class="card">
        <div class="q-head">
          <span class="pill">${esc(q.part)}</span>
          <span class="pill gray">${esc(q.cat)}</span>
          <span class="pill gray">${esc(q.type)}</span>
          ${multi ? `<span class="pill warn">多选</span>` : ""}
          <span class="spacer"></span>
          <span class="q-type">第 ${P.idx + 1} / ${total} 题　题号 ${q.no}</span>
          <button class="btn small" id="btnFav">${state.fav[q.id] ? "★ 已收藏" : "☆ 收藏"}</button>
        </div>
        <div class="q-stem">${esc(q.stem)}</div>
        ${optsHtml}
        ${resultHtml}
        <div class="q-foot">
          <button class="btn" id="btnPrev" ${P.idx === 0 ? "disabled" : ""}>← 上一题</button>
          ${!st.judged ? `<button class="btn primary" id="btnSubmit">提交答案</button>
            <button class="btn ghost" id="btnReveal">直接看答案</button>` : `<button class="btn" id="btnNext2">下一题 →</button>`}
          <span class="spacer"></span>
          <span class="muted">快捷键：<span class="kbd">A~D</span> 选项　<span class="kbd">Enter</span> 提交/下一题　<span class="kbd">←</span><span class="kbd">→</span> 翻题　<span class="kbd">F</span> 收藏</span>
          <button class="btn" id="btnNext" ${P.idx >= total - 1 ? "disabled" : ""}>下一题 →</button>
        </div>
      </div>`;
    }

    /* 右侧信息 */
    const right = `<div class="card">
      <h2>刷题进度</h2>
      <div class="progress-bar"><i style="width:${(pr.rate * 100).toFixed(1)}%"></i></div>
      <div class="muted" style="margin-top:8px">
        本范围 ${pr.total} 题：已做 <b class="num">${pr.done}</b>，最近一次做对 <b class="num">${pr.right}</b>，做错 <b class="num">${pr.wrongFlag}</b>
      </div>
      <div class="btn-row" style="margin-top:12px">
        <button class="btn small" id="btnGoWrong">只刷本范围错题</button>
        <button class="btn small" id="btnGoNew">只刷没做过的</button>
      </div>
    </div>
    <div class="card">
      <h2>答题卡</h2>
      ${sheetHtml()}
      <div class="legend">
        <span><i style="background:#e7f8ee;border:1px solid #b9e6cd"></i>已做对</span>
        <span><i style="background:#fdecea;border:1px solid #f2c6c2"></i>做错</span>
        <span><i style="background:#fff;border:1px solid #dde3ee"></i>未做</span>
      </div>
    </div>
    <div class="card">
      <h2>快捷操作</h2>
      <div class="btn-row">
        <button class="btn small" id="btnShuffle">打乱顺序重做</button>
        <button class="btn small" id="btnResetScope">清空本范围记录</button>
      </div>
    </div>`;

    $("#view").innerHTML = `<div class="practice-wrap">
      <div class="side">${left.join("")}</div>
      <div>${mid}</div>
      <div class="side">${right}</div>
    </div>`;

    bind();
  }

  function bind() {
    const view = $("#view");
    view.querySelectorAll("[data-scope]").forEach((b) => {
      b.onclick = () => { buildList({ force: true, filter: {} }); render(); };
    });
    view.querySelectorAll("[data-part]").forEach((b) => {
      b.onclick = () => {
        buildList({ force: true, filter: { part: b.dataset.part, cat: b.dataset.cat, type: b.dataset.type || "" } });
        render();
      };
    });
    view.querySelectorAll(".opt").forEach((li) => {
      li.onclick = () => { if (!li.classList.contains("locked")) choose(li.dataset.key); };
    });
    const bi = $("#blankInput");
    if (bi) {
      bi.oninput = () => inputBlank(bi.value);
      bi.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); submit(); } };
    }
    view.querySelectorAll("[data-jump]").forEach((b) => {
      b.onclick = () => goto(parseInt(b.dataset.jump, 10));
    });
    const on = (id, fn) => { const el = $("#" + id); if (el) el.onclick = fn; };
    on("btnPrev", prev);
    on("btnNext", next);
    on("btnNext2", next);
    on("btnSubmit", () => submit());
    on("btnReveal", reveal);
    on("btnFav", fav);
    on("btnGoWrong", () => { buildList({ force: true, filter: Object.assign({}, P.filter, { onlyWrong: true }) }); render(); });
    on("btnGoNew", () => { buildList({ force: true, filter: Object.assign({}, P.filter, { onlyNew: true }) }); render(); });
    on("btnShuffle", () => {
      P.list = window.Core.shuffle(P.list);
      P.idx = 0; render(); window.Core.toast("已打乱顺序");
    });
    on("btnResetScope", () => {
      window.Core.modal({
        title: "清空本范围答题记录",
        body: `<p>将清除当前范围 ${P.list.length} 道题的作答记录与错题标记，题目本身不受影响。</p>`,
        buttons: [{ text: "取消" }, {
          text: "确定清空", cls: "danger", onClick: () => {
            P.list.forEach((q) => { delete state.stats[q.id]; delete state.wrong[q.id]; delete P.chosen[q.id]; delete P.revealed[q.id]; });
            save(); render(); window.Core.toast("已清空本范围记录");
          }
        }],
      });
    });
  }

  /* 键盘 */
  function onKey(e) {
    if (window.App.view !== "practice") return;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
    if ($("#modalMask").hidden === false) return;
    const q = current();
    if (!q) return;
    const k = e.key.toUpperCase();
    if (["A", "B", "C", "D"].indexOf(k) >= 0 && q.options && q.options.length) {
      const has = q.options.some((o) => o.key === k);
      if (has) { e.preventDefault(); choose(k); }
      return;
    }
    if (q.kind === "judge" && (k === "1" || k === "2")) {
      e.preventDefault(); choose(k === "1" ? "对" : "错"); return;
    }
    if (e.key === "Enter") { e.preventDefault(); const st = statusOf(q); if (!st.judged) submit(); else next(); return; }
    if (e.key === "ArrowRight") { e.preventDefault(); next(); return; }
    if (e.key === "ArrowLeft") { e.preventDefault(); prev(); return; }
    if (k === "F") { e.preventDefault(); fav(); return; }
  }

  window.Practice = { render, buildList, resumeOrBuild, onKey, choose, submit, next, prev, get list() { return P.list; }, get idx() { return P.idx; } };
})();

/* ============ 模拟考试：80题 / 60分钟（40单选 + 20多选 + 20判断） ============ */
(function () {
  "use strict";
  const { $, esc, state, save, grade, fmtTime, fmtDate, shuffle, byId } = window.Core;

  const E = {
    qs: [], answers: {}, idx: 0, endAt: 0, started: 0, remain: 0, timer: null, finished: false, paper: null,
  };

  function pick(pool, n, used) {
    let cand = pool.filter((q) => !used.has(q.id));
    const fresh = cand.filter((q) => !state.stats[q.id] || !state.stats[q.id].r);
    if (fresh.length >= n) cand = fresh;
    const out = shuffle(cand).slice(0, n);
    out.forEach((q) => used.add(q.id));
    return out;
  }

  function start(cfg) {
    cfg = Object.assign({ single: 40, multi: 20, judge: 20, minutes: 60 }, cfg || {});
    const used = new Set();
    const single = pick(window.BANK.filter((q) => q.kind === "single"), cfg.single, used);
    const multi = pick(window.BANK.filter((q) => q.kind === "multi"), cfg.multi, used);
    const judge = pick(window.BANK.filter((q) => q.kind === "judge"), cfg.judge, used);
    E.qs = single.concat(multi, judge);
    if (state.prefs.examShuffle) E.qs = shuffle(E.qs);
    E.qs.forEach((q) => { q._kind = q.kind; });
    E.answers = {};
    E.idx = 0;
    E.finished = false;
    E.started = Date.now();
    E.endAt = E.started + cfg.minutes * 60 * 1000;
    E.paper = {
      single: single.length, multi: multi.length, judge: judge.length,
      minutes: cfg.minutes, total: E.qs.length,
    };
    state.examSession = { ids: E.qs.map((q) => q.id), answers: {}, idx: 0, endAt: E.endAt, paper: E.paper };
    save();
    tick(true);
    window.App.go("exam");
  }

  function resume() {
    const s = state.examSession;
    if (!s || !s.ids) return false;
    if (Date.now() >= s.endAt) { return false; }
    E.qs = s.ids.map((id) => byId[id]).filter(Boolean);
    if (!E.qs.length) return false;
    E.answers = s.answers || {};
    E.idx = s.idx || 0;
    E.endAt = s.endAt;
    E.paper = s.paper;
    E.started = s.endAt - (s.paper ? s.paper.minutes : 60) * 60000;
    E.finished = false;
    return true;
  }

  function persist() {
    if (!state.examSession) return;
    state.examSession.answers = E.answers;
    state.examSession.idx = E.idx;
    save();
  }

  function tick(silent) {
    const left = Math.max(0, Math.round((E.endAt - Date.now()) / 1000));
    E.remain = left;
    const el = $("#examTimer");
    if (el) {
      el.textContent = fmtTime(left);
      el.classList.toggle("danger", left <= 300);
    }
    if (left <= 0 && !E.finished) { submitPaper(true); return; }
    if (!silent) clearTimeout(E.timer);
    E.timer = setTimeout(() => tick(false), 1000);
  }

  function current() { return E.qs[E.idx]; }

  function choose(key) {
    const q = current();
    if (!q || E.finished) return;
    if (q.kind === "multi") {
      const set = new Set((E.answers[q.id] || "").split(""));
      if (set.has(key)) set.delete(key); else set.add(key);
      E.answers[q.id] = [...set].sort().join("");
    } else {
      E.answers[q.id] = key;
    }
    persist();
    window.Exam.render();
  }

  function inputBlank(v) {
    const q = current();
    if (!q) return;
    E.answers[q.id] = v;
    persist();
  }

  function goto(i) {
    if (i < 0 || i >= E.qs.length) return;
    E.idx = i; persist(); window.Exam.render();
  }

  function unanswered() {
    return E.qs.filter((q) => {
      const a = E.answers[q.id];
      return a == null || a === "";
    });
  }

  function repaper(h) {
    // 兼容历史里的脏记录（paper 缺失/为 null），从已有字段推算，避免渲染崩溃
    const p = h && h.paper;
    if (p && typeof p === "object") {
      return {
        single: p.single || 0, multi: p.multi || 0, judge: p.judge || 0,
        minutes: p.minutes || 0, total: p.total || (h.total || 0),
      };
    }
    const total = (h && h.total) || 0;
    return { single: 0, multi: 0, judge: 0, minutes: 0, total };
  }

  function submitPaper(auto) {
    if (E.finished) return;
    if (!E.qs || !E.qs.length) {          // 空试卷：不结算、不留记录
      clearTimeout(E.timer);
      E.finished = true;
      return;
    }
    if (state.examSession && state.examSession.answers) E.answers = state.examSession.answers;
    const left = unanswered();
    const doSubmit = () => {
      E.finished = true;
      clearTimeout(E.timer);
      let got = 0, full = 0, right = 0, wrong = 0, empty = 0, partRight = 0;
      const details = [];
      E.qs.forEach((q) => {
        const a = E.answers[q.id];
        const g = grade(q, a);
        full += 1;
        got += g.score;
        if (g.empty) empty++;
        else if (g.ok) right++;
        else { wrong++; if (g.score > 0) partRight++; }
        // 统计与错题本：统一走 Core.trackAnswer，避免重复累加
        window.Core.trackAnswer(q, g.ok);
        details.push({ id: q.id, chosen: a, ok: g.ok, score: g.score, kind: q.kind });
      });
      const score100 = full ? Math.round((got / full) * 100) : 0;
      // 停表时间：优先用试卷时长，且不允许出现负数或超大值
      let usedSec = Math.round((Date.now() - E.started) / 1000);
      const limitSec = ((E.paper && E.paper.minutes) || 60) * 60;
      if (!isFinite(usedSec) || usedSec < 0 || usedSec > limitSec) usedSec = limitSec;
      const rec = {
        at: Date.now(), usedSec,
        paper: E.paper, score: score100, right, wrong, empty,
        total: full, auto: !!auto,
      };
      state.history.unshift(rec);
      state.history = state.history.slice(0, 60);
      state.examSession = null;
      save();
      E.result = { rec, details };
      window.App.go("examResult");
    };
    if (auto) { doSubmit(); return; }
    window.Core.modal({
      title: "交卷确认",
      body: `<p>共 ${E.qs.length} 题，已作答 <b>${E.qs.length - left.length}</b> 题，未作答 <b>${left.length}</b> 题。</p>
             <p class="muted">交卷后立即评分，错题会自动进入错题本。</p>`,
      buttons: [
        { text: "继续答题" },
        { text: "确认交卷", cls: "primary", onClick: doSubmit },
      ],
    });
  }

  function sheetHtml() {
    return E.qs.map((q, i) => {
      const a = E.answers[q.id];
      let cls = "";
      if (a != null && a !== "") {
        if (E.finished || E.result) {
          const g = grade(q, a);
          cls = g.ok ? "done" : "bad";
        } else cls = "done";
      }
      if (i === E.idx) cls += " cur";
      return `<button class="${cls}" data-jump="${i}">${i + 1}</button>`;
    }).join("");
  }

    if (E.finished && E.result) { renderResult(); return; }

      }).join("") + `</table>`;

    if (q.options && q.options.length) {
      opts += `<ul class="opts">` + q.options.map((o) => {
        const isChosen = (E.answers[q.id] || "").indexOf(o.key) >= 0;
        return `<li class="opt ${isChosen ? "chosen" : ""}" data-key="${o.key}">
          <span class="key">${o.key}</span><span class="txt">${esc(o.text)}</span></li>`;
      }).join("") + `</ul>`;
    } else if (q.kind === "blank") {
      opts = `<div style="margin-top:16px"><input class="blank-input" id="blankInput" placeholder="输入答案" value="${esc(E.answers[q.id] || "")}"></div>`;

      opts = `<ul class="opts">` + ["对", "错"].map((k) => {

    $("#view").innerHTML = `

            <span class="pill">${q.kind === "single" ? "单选题" : q.kind === "multi" ? "多选题" : q.kind === "judge" ? "判断题" : "填空题"}</span>
            <span class="pill gray">${esc(q.cat)}</span>
            <span class="spacer"></span>
            <span class="q-type">第 ${E.idx + 1} / ${E.qs.length} 题</span>
          </div>
          <div class="q-stem">${esc(q.stem)}</div>
          ${opts}
          <div class="q-foot">
            <button class="btn" id="btnPrev" ${E.idx === 0 ? "disabled" : ""}>← 上一题</button>
            <button class="btn primary" id="btnNext" ${E.idx >= E.qs.length - 1 ? "disabled" : ""}>下一题 →</button>
            <span class="spacer"></span>
            <span class="muted">快捷键：<span class="kbd">A~D</span> 选项　<span class="kbd">←</span><span class="kbd">→</span> 翻题</span>
          </div>
        </div>
        <div class="side">
          <div class="card">
            <h2>答题卡</h2>

              <span><i style="background:#e7f8ee;border:1px solid #b9e6cd"></i>已作答</span>
              <span><i style="background:#fff;border:1px solid #dde3ee"></i>未作答</span>
            </div>
          </div>
          <div class="card">
            <h2>试卷构成</h2>
            <div class="muted">单选 ${E.paper.single} 题 · 多选 ${E.paper.multi} 题 · 判断 ${E.paper.judge} 题<br>限时 ${E.paper.minutes} 分钟，满分 100 分</div>
          </div>
        </div>
      </div>`;
    bind();
  }

  function bind() {
    const view = $("#view");
    view.querySelectorAll(".opt").forEach((li) => { li.onclick = () => choose(li.dataset.key); });
    const bi = $("#blankInput");
    if (bi) {
      bi.oninput = () => inputBlank(bi.value);
      bi.onfocus = () => bi.select();
    }
    view.querySelectorAll("[data-jump]").forEach((b) => { b.onclick = () => goto(parseInt(b.dataset.jump, 10)); });
    const on = (id, fn) => { const el = $("#" + id); if (el) el.onclick = fn; };
    on("btnPrev", () => goto(E.idx - 1));
    on("btnNext", () => goto(E.idx + 1));
    on("btnExamSubmit", () => submitPaper(false));
    on("btnExamQuit", () => {
      window.Core.modal({

  function onKey(e) {
    if (window.App.view !== "exam" || E.finished) return;

    const k = e.key.toUpperCase();
    if (["A", "B", "C", "D"].indexOf(k) >= 0) { e.preventDefault(); choose(k); return; }
    if (q.kind === "judge" && (k === "1" || k === "2")) { e.preventDefault(); choose(k === "1" ? "对" : "错"); return; }

  /* ---------------- 统计 ---------------- */
  function renderStats() {
    const pr = window.Core.progressOf(window.BANK);
    const rows = [];
    Object.keys(window.BANK_META.tree).forEach((part) => {
      Object.keys(window.BANK_META.tree[part]).forEach((cat) => {
        const list = window.BANK.filter((q) => q.part === part && q.cat === cat);
        const p = window.Core.progressOf(list);
        const types = {};
        list.forEach((q) => {
          const t = q.type;
          types[t] = types[t] || { n: 0, done: 0, ok: 0 };
          types[t].n++;
          const s = state.stats[q.id];
          if (s && s.r) { types[t].done++; if (s.lastOk) types[t].ok++; }
        });
        rows.push({ part, cat, p, types });
      });
    });
    const totalRight = window.BANK.filter((q) => state.stats[q.id] && state.stats[q.id].lastOk).length;
    const totalWrongFlag = window.BANK.filter((q) => state.stats[q.id] && state.stats[q.id].r && !state.stats[q.id].lastOk).length;

    $("#view").innerHTML = `
      <div class="grid c4">

      </div>
      <div class="card" style="margin-top:16px">
        <h2>分章节掌握情况</h2>
        <table class="tbl">
          <thead><tr><th>章节</th><th>题型构成</th><th style="width:180px">进度</th><th style="width:90px">正确率</th></tr></thead>
          <tbody>
          ${rows.map((r) => `<tr>
            <td>${esc(r.cat)}<div class="muted">${esc(r.part)}</div></td>
            <td class="muted">${Object.keys(r.types).map((t) => `${esc(t)} ${r.types[t].ok}/${r.types[t].done}·共${r.types[t].n}`).join("　")}</td>
            <td>
              <div class="progress-bar"><i style="width:${(r.p.rate * 100).toFixed(1)}%"></i></div>
              <div class="muted num">${r.p.done}/${r.p.total}</div>
            </td>
            <td class="num">${r.p.done ? Math.round(r.p.right / r.p.done * 100) + "%" : "—"}</td>
          </tr>`).join("")}
          </tbody>
        </table>
      </div>
      <div class="card">
        <h2>数据管理</h2>
        <p class="muted">作答记录保存在本机浏览器（localStorage）。换电脑、换浏览器或清理浏览器数据前，建议先导出备份。</p>
        <div class="btn-row" style="margin-top:10px">
          <button class="btn primary" id="btnExport">导出学习记录</button>
          <button class="btn" id="btnImport">导入学习记录</button>
          <button class="btn danger" id="btnReset">清空全部记录</button>
        </div>
      </div>`;
    const on = (id, fn) => { const el = $("#" + id); if (el) el.onclick = fn; };
    on("btnExport", () => window.App.downloadText(window.Core.exportData(), `密码竞赛刷题-学习记录-${new Date().toISOString().slice(0, 10)}.json`));
    on("btnImport", () => {
      const inp = document.createElement("input");
      inp.type = "file"; inp.accept = ".json,application/json";
      inp.onchange = () => {
        const f = inp.files[0];
        if (!f) return;
        const fr = new FileReader();
        fr.onload = () => {
          try { window.Core.importData(fr.result); window.Core.toast("导入成功"); renderStats(); }
          catch (e) { window.Core.toast("导入失败：" + e.message); }
        };
        fr.readAsText(f, "utf-8");
      };
      inp.click();
    });
    on("btnReset", () => {
      window.Core.modal({
        title: "清空全部记录",
        body: "<p>将清空所有作答记录、错题本、收藏与考试历史（题库本身不受影响）。此操作不可撤销。</p>",
        buttons: [{ text: "取消" }, { text: "确认清空", cls: "danger", onClick: () => { window.Core.resetAll(); window.Core.toast("已清空"); renderStats(); } }],
      });
    });
  }

  window.Pages = { renderHome, renderWrong, renderFav, renderPractical, renderStats };
})();

        <p style="margin:0 0 10px">做错的题自动进错题本，支持「重做全部错题」、查看解析、手动移除、导出清单；收藏用于标记需要反复看的题。</p>
        <h3 style="font-size:15px;margin-bottom:6px">实操题</h3>
        <p style="margin:0 0 10px">第三部分 12 道实操题（密码算法、逆向、流量分析、编码转换等），含题干、思路、参考脚本与 flag。</p>
        <h3 style="font-size:15px;margin-bottom:6px">快捷键</h3>
        <p style="margin:0 0 10px"><span class="kbd">A</span>~<span class="kbd">D</span> 选选项　<span class="kbd">Enter</span> 提交 / 下一题　<span class="kbd">←</span> <span class="kbd">→</span> 翻题　<span class="kbd">F</span> 收藏（刷题时）</p>
        <h3 style="font-size:15px;margin-bottom:6px">数据与备份</h3>
        <p style="margin:0">记录存在本机浏览器，不上传网络。到「统计」页可导出/导入学习记录；清理浏览器数据会丢失记录，建议定期导出备份。</p>
        <h3 style="font-size:15px;margin:10px 0 6px">题库说明</h3>
        <p style="margin:0">题目来自《附件3：2026年江苏省密码行业职业技能竞赛题库》（理论 1049 题 + 实操 12 题），全部题目与答案均按原卷录入。个别题目原卷本身存在题型与答案不一致或排版粘连，程序按原卷保留并在题目下方标注提示。</p>`,
      buttons: [{ text: "知道了", cls: "primary" }],
    });
  }

  /* ---------------- 启动 ---------------- */
  function boot() {
    /* 注意：Core 已在 core.js 加载时完成 load()，这里不能再次 load，否则会替换 state 对象，
       导致其它模块（practice/exam）持有的引用失效。 */
    if (!window.BANK || !window.BANK.length) {
      $("#view").innerHTML = `<div class="card"><div class="empty">题库数据未加载：请确认 data/bank.js 与 index.html 在同一目录结构中。</div></div>`;
      return;
    }
    $$("#tabs button").forEach((b) => { b.onclick = () => App.go(b.dataset.view); });
    $("#brandHome").onclick = () => App.go("home");
    $("#btnSettings").onclick = openSettings;
    $("#btnHelp").onclick = openHelp;
    $("#modalClose").onclick = window.Core.closeModal;
    $("#modalMask").onclick = (e) => { if (e.target.id === "modalMask") window.Core.closeModal(); };
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { window.Core.closeModal(); return; }
      window.Practice.onKey(e);
      window.Exam.onKey(e);
    });
    App.go("home");
  }

  window.App = App;
  document.addEventListener("DOMContentLoaded", boot);
  if (document.readyState !== "loading") boot();
})();

</script>
</body>
</html>
