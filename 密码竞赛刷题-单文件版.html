","options":[],"answer":"对","analysis":"CCM 是「Counter with CBC-MAC」的缩写，属于认证加密（AEAD）模式，做法是先用 CTR 模式把明文变成密文，保证机密性，同时用 CBC-MAC 对相关数据和明文计算出认证标签，保证完整性与真实性，两部分共用同一密钥，但要求输入互不重叠的随机数。工程上常在无线局域网等场景使用。需要区分的是 GCM 用 GHASH 做认证，CCM 用的是 CBC-MAC。","correctReason":"CCM 由 CTR 加密与 CBC-MAC 认证两部分组合而成，同时提供机密性和完整性保护，表述成立。","wrongReason":"","source":"NIST SP 800-38C 及 RFC 3610（CCM 模式规范）","keyPoint":"CCM＝CTR 保密＋CBC-MAC 认证，属 AEAD"},{"id":"第二部分专业题-一、密码学-判断题-40","no":40,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"我国被采纳为新一代宽带无线移动通信系统（LTE）国际标准的算法是SM2 算法。","options":[],"answer":"错","analysis":"被 3GPP 采纳为 LTE 国际标准的我国密码算法是 ZUC（祖冲之序列密码算法），它用于空口信令与数据的加密和完整性保护，是首个被纳入国际移动通信标准的中国商用密码算法。SM2 是椭圆曲线公钥密码算法，用途是签名、密钥交换和公钥加密，性质上属于非对称算法，并非用于 LTE 空口加密的标准算法。此处把两类算法张冠李戴。","correctReason":"被 LTE 国际标准采纳的是 ZUC 序列密码算法，而非公钥算法 SM2，故该表述不成立。","wrongReason":"","source":"GM/T 0001-2012《祖冲之序列密码算法》及 3GPP TS 35.221","keyPoint":"进 LTE 国际标准的是 ZUC，不是 SM2"},{"id":"第二部分专业题-一、密码学-判断题-41","no":41,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"密码系统的安全性不应取决于不易改变的算法，而应取决于可随时改变的密 钥。","options":[],"answer":"对","analysis":"这就是经典的柯克霍夫原则（Kerckhoffs's Principle）：密码系统的安全性必须只依赖于密钥的保密，算法本身应当公开、可以被任何人研究和检验。原因是算法一旦设计定型就很难更换，一旦依赖算法的保密，泄露就意味着整套系统失效；而密钥可以随时生成、更换和销毁，即使泄露也只影响有限的时空范围。现代商用密码算法公开征集、公开评审，正是遵循这一原则。","correctReason":"按柯克霍夫原则，安全性应建立在密钥保密之上，算法应当公开且可经受检验，故表述成立。","wrongReason":"","source":"柯克霍夫原则（Kerckhoffs's Principle）及 Shannon《Communication Theory of Secrecy Systems》（1949）","keyPoint":"安全靠密钥保密，算法公开可查（柯克霍夫原则）"},{"id":"第二部分专业题-一、密码学-判断题-42","no":42,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"对密码系统进行暴力破解的难度只取决于密钥长度，与算法无关。","options":[],"answer":"错","analysis":"暴力破解的难度主要由密钥空间决定，而密钥空间等于密钥长度与算法实际可用密钥数共同决定的量，并非只看长度。同样的长度下，弱密钥、等价密钥或密钥生成缺陷都会大幅缩小有效空间。此外算法结构也很关键：差分分析、线性分析、相关密钥攻击等可把复杂度降到远低于穷举，MD5、DES 都是结构被攻破的例子。算法的实现效率还直接决定单位时间能试多少密钥。","correctReason":"暴力破解难度取决于密钥空间大小与算法抗分析能力，密钥长度只是其中一个因素，故表述不成立。","wrongReason":"","source":"密码学基本原理（Shannon 1949；差分/线性密码分析相关经典文献）","keyPoint":"穷举难度看密钥空间与算法强度，不只看密钥长度"},{"id":"第二部分专业题-一、密码学-判断题-43","no":43,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"密钥派生函数可以从一个主密钥和安全参数派生出多个子密钥。","options":[],"answer":"对","analysis":"密钥派生函数（KDF）的作用正是从一份高熵的主密钥（或称种子密钥、共享秘密）出发，结合安全参数或公开的杂凑参数，确定性地派生出所需长度和数量的一个或多个子密钥，供加密、完整性、会话密钥等不同用途分别使用。这样做的价值在于密钥分离：一条密钥被攻破不会牵连其他用途的密钥，也便于密钥更新。SM2 密钥交换中就用 KDF 从共享点导出会话密钥。","correctReason":"KDF 以主密钥和公开参数为输入，可确定性派生出一个或多个子密钥，用于密钥分离与更新，表述成立。","wrongReason":"","source":"GB/T 32918.3-2016《SM2 椭圆曲线公钥密码算法 第3部分：密钥交换协议》中密钥派生函数的规定","keyPoint":"KDF：一主密钥派生多子密钥，实现密钥分离"},{"id":"第二部分专业题-一、密码学-判断题-44","no":44,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"SM2、SM4、ZUC 算法都是对称密码算法。","options":[],"answer":"错","analysis":"三个算法分属不同类别，不能一概而论。SM2 是基于椭圆曲线的非对称（公钥）密码算法，用于数字签名、密钥交换和公钥加密；SM4 是分组长度为 128 比特的分组密码算法，属于对称密码；ZUC 是面向字设计的序列（流）密码算法，加密时逐比特或逐字与密钥流异或，也属于对称密码。所以「都是对称密码算法」的说法因为 SM2 而被证伪。","correctReason":"SM2 是非对称公钥密码算法，只有 SM4 与 ZUC 属于对称密码，故该表述不成立。","wrongReason":"","source":"GM/T 0001-2012《祖冲之序列密码算法》、GM/T 0002-2012《SM4 分组密码算法》、GM/T 0003-2012《SM2 椭圆曲线公钥密码算法》","keyPoint":"SM2 非对称、SM4 分组对称、ZUC 序列对称"},{"id":"第二部分专业题-一、密码学-判断题-45","no":45,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"衡量一个密码系统的安全性中的无条件安全又称为可证明安全。","options":[],"answer":"错","analysis":"这是两套不同的安全度量，不能画等号。无条件安全（完善保密性）指即使攻击者拥有无限计算能力也无法破译，香农证明只有一次一密（密钥真随机、长度不短于明文、只用一次）才能达到。可证明安全则是把方案的安全性归约到某个公认的数学困难问题上，说明「攻破方案不亚于解决该难题」，它依赖计算假设，属于计算安全范畴。因此二者是并列概念，不是同一事物的两个名字。","correctReason":"无条件安全指无限算力下不可破译，可证明安全是归约到困难问题的计算安全，二者概念不同，故表述不成立。","wrongReason":"","source":"Shannon《Communication Theory of Secrecy Systems》（1949）关于完善保密性的论述","keyPoint":"无条件安全≠可证明安全，前者只有一次一密能做到"},{"id":"第二部分专业题-一、密码学-判断题-46","no":46,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"古典密码中的仿射密码是置换密码的一种。","options":[],"answer":"错","analysis":"仿射密码把明文字符 x 变换为 y=(ax+b) mod n，其中 a 必须与 n 互素以保证可逆。它改变的是字符本身的取值，一个明文字符固定对应某个密文字符，属于单表代换密码（代换密码的一种），密钥空间是满足条件的 (a,b) 组合数。置换密码则只重新排列字符的位置，字符本身不变。二者机制不同，仿射密码并不属于置换密码。","correctReason":"仿射密码对字符做线性变换，属于单表代换密码，而非只调换位置的置换密码，故表述不成立。","wrongReason":"","source":"古典密码学基本分类（代换密码与置换密码）","keyPoint":"仿射密码＝代换密码；只换位置才叫置换密码"},{"id":"第二部分专业题-一、密码学-判断题-47","no":47,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"散列函数的定义中的“任意消息长度”是指实际中存在的任意消息长度，而不 是理论上的任意消息长度。","options":[],"answer":"对","analysis":"这里强调的是「任意」的工程含义。从数学定义看，散列函数应能接受任意有限长的比特串作为输入；但在实际系统中，输入长度总受到可处理的明文规模、编码方式与计算资源限制，任何具体实现都无法接受真正无限长的输入。所以教材标注的「任意消息长度」应理解为实际中可能出现的任意长度，而不是理论意义上的无限。","correctReason":"实际实现能接受的输入长度始终有限，故「任意消息长度」指实际中可能的任意长度，而非理论上的无限长度，表述成立。","wrongReason":"","source":"GB/T 32905-2016《信息安全技术 SM3 密码杂凑算法》关于消息填充与输入长度字段的规定","keyPoint":"「任意长度」是工程含义，实际输入仍然有限"},{"id":"第二部分专业题-一、密码学-判断题-48","no":48,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"在 RSA 密码算法中，加密指数 e 和私钥指数 d 必须都小于模数 n 的欧拉 函数 φ（n）。","options":[],"answer":"对","analysis":"RSA 的密钥生成中，e 与 d 都是在模 φ(n)=(p-1)(q-1) 意义下取值的指数，标准做法要求两者均满足小于 φ(n) 且为正整数，并满足 ed≡1 mod φ(n)；若计算出的 d 超过 φ(n)，也可取它对 φ(n) 的模来得到等价的更小指数。符合官方答案的表述按此理解。实际应用中常用较小的 e（如 65537）配合与 n 同量级的大 d 使用，注意不要与中国剩余定理中分别对 p-1、q-1 作模的运算混为一谈。","correctReason":"按 RSA 密钥生成的通用约定，加密指数 e 与私钥指数 d 均在模 φ(n) 的范围内取值且小于 φ(n)，表述成立。","wrongReason":"","source":"RSA 算法密钥生成约定及 PKCS #1 标准（条号待核）","keyPoint":"e、d 都取在模 φ(n) 范围内，且 ed≡1 mod φ(n)"},{"id":"第二部分专业题-一、密码学-判断题-49","no":49,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"在分组密码的 CFB 模式下，解密过程与加密过程使用相同的分组密码操作， 但需要反序使用密钥。","options":[],"answer":"错","analysis":"CFB（密码反馈）属于流密码式的反馈模式，其做法是把前一段密文（首块用 IV）送入分组密码的加密函数，产生密钥流再与明文或密文异或。关键在于加密和解密调用的都是分组密码的加密运算，不需要解密函数，也完全不需要反序或反向使用密钥，收发双方使用同一密钥。题目有两处错：方向说反了（其实相同而非不同），并且凭空添加了「反序用密钥」这个并不存在的操作。","correctReason":"CFB 加解密都使用同一密钥和分组密码的加密运算，不存在反序使用密钥的要求，故该表述不成立。","wrongReason":"","source":"NIST SP 800-38A《Recommendation for Block Cipher Modes of Operation》","keyPoint":"CFB 加解密同一密钥、都调用加密函数，不反序"},{"id":"第二部分专业题-一、密码学-判断题-50","no":50,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"古典密码体制的统计分析法是指某种语言中各个字符出现的频率不一样，表 现出一定的统计规律。","options":[],"answer":"对","analysis":"统计分析法是破解古典密码的基本手段，其成立前提正是自然语言本身带有统计规律：不同字母的出现频率差异明显（如英文中 e 最高、中文里各字使用频度悬殊），双字母组合与重复模式也有固定特征。加密后这些规律虽被变形但仍会部分保留，攻击者通过频率统计、重合指数等手段即可推测密钥。单表代换密码最怕这类攻击，多表代换和一次一密则能把它打散。","correctReason":"自然语言中各字符出现频率不同、存在统计规律，这正是统计分析法得以奏效的依据，表述成立。","wrongReason":"","source":"古典密码学中统计分析法（频率分析）的基本原理","keyPoint":"统计分析法吃的是语言字频规律，单表代换最怕它"},{"id":"第二部分专业题-一、密码学-判断题-51","no":51,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"AES 算法的分组长度固定为 128 比特，密钥长度可以是 128、192 或 256 比特。","options":[],"answer":"对","analysis":"AES 由 NIST 以 FIPS 197 发布，属于分组密码，分组长度固定为 128 比特，不做可变；密钥长度支持 128、192、256 比特三种，对应轮数分别为 10、12、14 轮。算法在 4×4 字节状态矩阵上做 SubBytes、ShiftRows、MixColumns、AddRoundKey。要与 DES（分组 64 比特）、SM4（分组 128 比特、密钥固定 128 比特）对比记忆，重点记住 AES 分组长度不可变。","correctReason":"AES 分组长度固定为 128 比特，密钥长度可取 128/192/256 比特，与 FIPS 197 规定一致。","wrongReason":"","source":"FIPS 197《Advanced Encryption Standard (AES)》","keyPoint":"AES 分组恒 128 比特，密钥 128/192/256 三档"},{"id":"第二部分专业题-一、密码学-判断题-52","no":52,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"SM3 密码杂凑算法中的P 置换是非线性运算。","options":[],"answer":"错","analysis":"SM3 中的置换 P 实际写作 P0 和 P1，由循环左移与按位异或构成，例如 P0(x)=x⊕(x<<<9)⊕(x<<<17)，这类运算满足线性性质，属于线性（仿射）变换，只负责把比特充分打散、加快扩散。SM3 的非线性来源是布尔函数 FF、GG 以及 32 位模加运算。把 P 置换说成非线性，正好把线性与非线性部件搞反了。","correctReason":"SM3 的 P 置换（P0、P1）仅由异或与循环移位组成，是线性变换，故该表述不成立。","wrongReason":"","source":"GB/T 32905-2016《信息安全技术 SM3 密码杂凑算法》（亦见 GM/T 0004-2012）","keyPoint":"SM3 的 P 置换是线性的；非线性靠 FF、GG 和模加"},{"id":"第二部分专业题-一、密码学-判断题-53","no":53,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"数字信封技术使用发送者的私钥加密对称密钥，使用接收者的公钥加密消息。","options":[],"answer":"错","analysis":"数字信封的做法与题述正好相反：发送方随机生成一把对称密钥（会话密钥），用它加密消息正文，然后用接收方的公钥加密这把对称密钥，两者一起发送；接收方先用自己的私钥解出对称密钥，再解密消息。这样既利用对称算法的高效率处理长消息，又用公钥算法解决了密钥分发难题。题中说用发送者私钥加密对称密钥，那是签名的思路，而用接收者公钥加密消息则等于把长消息当短密钥做公钥运算，效率与逻辑都不对。","correctReason":"数字信封是用接收方的公钥保护对称密钥、用对称密钥加密消息，题述把两者弄反，故该表述不成立。","wrongReason":"","source":"公钥密码应用原理（数字信封机制），参见 GB/T 25069-2022《信息安全技术 术语》相关条目","keyPoint":"数字信封：对称密钥加密消息，接收方公钥加密该密钥"},{"id":"第二部分专业题-一、密码学-判断题-54","no":54,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"SM3 密码杂凑算法的消息扩展过程一共生成128 个消息字。","options":[],"answer":"错","analysis":"SM3 对一个 512 比特的消息分组先做消息扩展：把 16 个消息字 W0~W15 通过线性递推扩展为 68 个字 W0~W67，同时由 W 生成 64 个字 W′0~W′63。计算时压缩函数共 64 轮，每轮用到一个 W 和一个 W′。所以消息扩展生成的是 68 个字（另有 64 个 W′），题目说的 128 个消息字数量对不上。","correctReason":"SM3 消息扩展由 16 个字扩展为 68 个消息字，并非 128 个，故该表述不成立。","wrongReason":"","source":"GB/T 32905-2016《信息安全技术 SM3 密码杂凑算法》（亦见 GM/T 0004-2012）","keyPoint":"SM3 消息扩展：16→68 个 W，另生成 64 个 W′"},{"id":"第二部分专业题-一、密码学-判断题-55","no":55,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"生日攻击是一种密码学攻击手段，基于概率论中生日问题的数学原理。SM3 密码杂凑算法可以抵抗生日攻击。","options":[],"answer":"对","analysis":"生日攻击利用的是生日悖论：在一群人中找出两个生日相同的人，所需人数远少于找出与指定日期相同的人，反映到杂凑函数上就是找碰撞比找原像容易。对 n 比特输出的杂凑函数，碰撞攻击复杂度约为 2^(n/2)，原像攻击约为 2^n。按官方答案，SM3 输出 256 比特，碰撞攻击量级约为 2^128，目前没有公开的有效攻击方法，可以认为它能抵抗生日攻击。（该题答案以官方为准）","correctReason":"SM3 输出 256 比特杂凑值，生日攻击（碰撞攻击）复杂度约为 2^128，远超现有计算能力，故表述成立。","wrongReason":"","source":"GB/T 32905-2016《信息安全技术 SM3 密码杂凑算法》及生日攻击原理","keyPoint":"生日攻击打碰撞约 2^(n/2)，SM3 为 256 比特故约 2^128"},{"id":"第二部分专业题-一、密码学-判断题-56","no":56,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"对消息进行数字签名时，通常先对消息的哈希值进行签名，以提高效率。","options":[],"answer":"对","analysis":"数字签名本质上是基于数学难题的运算，直接对整条消息做签名会因消息过长导致运算量大、速度慢，因此通行做法是先对消息做杂凑，得到固定长度的摘要，再对摘要进行签名。这样无论消息多长，签名运算量都不变，效率大幅提升；同时杂凑的抗碰撞性也保证了对摘要签名等价于对消息签名，篡改消息会导致摘要不匹配而验签失败。这正是「先哈希后签名」的标准流程。","correctReason":"先对消息求杂凑再做签名，可把不定长消息压缩为定长摘要，显著降低签名运算开销，表述成立。","wrongReason":"","source":"GB/T 32918.2-2016《SM2 椭圆曲线公钥密码算法 第2部分：数字签名算法》（签名前对消息做杂凑）","keyPoint":"先哈希后签名：效率高且能防篡改"},{"id":"第二部分专业题-一、密码学-判断题-57","no":57,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"所有哈希函数都具有抗原像攻击、抗第二原像攻击和抗碰撞攻击的安全性。","options":[],"answer":"错","analysis":"三种安全性（抗原像、抗第二原像、抗碰撞）是理想杂凑函数应当具备的性质，但并不是随便一个哈希函数都自动拥有。安全性取决于具体设计与输出长度：MD5 已被成功构造碰撞，SHA-1 也已实用化破译，输出过短的杂凑算法在生日攻击面前同样不堪一击。所以「所有哈希函数都具有」这种全称表述无法成立，实际选型必须看算法是否通过评测、输出长度是否够用。","correctReason":"杂凑算法的抗攻击能力取决于具体设计与输出长度，MD5、SHA-1 等已被攻破，故该全称表述不成立。","wrongReason":"","source":"杂凑函数安全性要求，参见 GB/T 32905-2016《信息安全技术 SM3 密码杂凑算法》及密码学基本原理","keyPoint":"抗碰撞/抗原像是要求，不是所有哈希函数都天然具备"},{"id":"第二部分专业题-一、密码学-判断题-58","no":58,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"SM9 密码算法的标识可以是姓名、性别、年龄、身份证号、手机号码中的一 种。","options":[],"answer":"错","analysis":"SM9 标识密码中，用户的标识是一串可唯一确定其身份的可辨识信息（如邮箱地址、手机号等字符串），要求全局唯一且可公开获取。性别、年龄这类信息取值有限、大量用户重复，无法区分不同用户，自然不能作为标识；身份证号虽然唯一，但把它直接当标识公开使用会带来隐私与合规风险，通常也不用。题目用「张三种种之一」的枚举方式把不唯一的字段混进来，因此表述不成立。","correctReason":"标识必须能唯一确定用户身份，性别、年龄等取值重复的信息不具备唯一性，不能作为 SM9 标识，故该表述不成立。","wrongReason":"","source":"GM/T 0044-2016《SM9 标识密码算法》（标识应为唯一确定用户身份的可辨识信息）","keyPoint":"SM9 标识必须唯一可辨识，性别年龄不行"},{"id":"第二部分专业题-一、密码学-判断题-59","no":59,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"SM9 密码算法用户标识由KGC 生成。","options":[],"answer":"错","analysis":"SM9 的标识由用户身份信息决定，一般由用户自己选定或由系统按规则分配、登记，并不由密钥生成中心（KGC）生成；KGC 承担的是用系统主密钥为该标识计算并分发对应的用户私钥，同时对外公布系统参数和主公钥。也就是说，KGC 管的是「密钥」而非「标识」。如果标识都由 KGC 生成，标识密码「以身份为公钥、无需证书」的优势也就不存在了。","correctReason":"SM9 用户标识来自用户身份、由用户或系统确定，KGC 只负责据此生成用户私钥，故该表述不成立。","wrongReason":"","source":"GM/T 0044-2016《SM9 标识密码算法》（KGC 生成用户私钥）","keyPoint":"KGC 生成用户私钥，不生成用户标识"},{"id":"第二部分专业题-一、密码学-判断题-60","no":60,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"CBC 模式在加密时需要初始化向量 IV，且 IV 必须随机且不可预测。","options":[],"answer":"对","analysis":"CBC 模式在加密第一个分组时需要与明文异或，因此必须提供初始化向量 IV；IV 应当每次加密随机产生且不可预测，否则相同明文分组会产生相同密文，泄漏明文相等关系，可预测的 IV 还会带来选择明文攻击风险。IV 本身不必保密，可以随密文一起传输，解密方用同一个 IV 恢复明文。工程实现中常把 IV 与密文一起存放或由随机源现场生成。","correctReason":"CBC 加密必须使用 IV 与前一分组异或，且 IV 要求随机不可预测以防信息泄漏，表述成立。","wrongReason":"","source":"NIST SP 800-38A《Recommendation for Block Cipher Modes of Operation》","keyPoint":"CBC 必须有 IV，随机不可预测但无需保密"},{"id":"第二部分专业题-一、密码学-判断题-61","no":61,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"SM9 密码算法系统参数由KGC 选择。","options":[],"answer":"对","analysis":"SM9 是基于标识的密码体制（IBC），没有传统意义上的证书体系，取而代之的是密钥生成中心 KGC。系统参数（椭圆曲线、双线性对、杂凑函数等）以及主密钥对都由 KGC 选择并生成，主公钥可由 KGC 公布，用户私钥也由 KGC 用主私钥和用户标识派生。本题考的是 SM9 的信任模型与参数归属，易混点是把参数选择误认为由用户或第三方标准组织完成。","correctReason":"SM9 的系统参数与主密钥对均由 KGC 生成和保管，该表述成立。","wrongReason":"","source":"GB/T 38635.1-2020《信息安全技术 SM9 标识密码算法 第1部分：总则》","keyPoint":"SM9 参数与主密钥对由 KGC 生成并公布主公钥。"},{"id":"第二部分专业题-一、密码学-判断题-62","no":62,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"SM9 数字签名算法签名者使用主私钥生成签名，验证者使用主公钥进行验证。","options":[],"answer":"错","analysis":"SM9 签名中，签名者拿到的是 KGC 用主私钥和自己的标识派生出的用户私钥，签名用该用户私钥计算，验证则用 KGC 公布的主公钥加签名者标识进行双线性对运算。题干把「用户私钥」错写成「主私钥」，主私钥只用于生成用户私钥，绝不参与用户签名。本题考的是 SM9 签名密钥的层次关系，这正是标识密码最容易被绕晕的地方。","correctReason":"签名应使用与签名者标识对应的用户私钥，而非 KGC 的主私钥，故该表述不成立。","wrongReason":"","source":"GB/T 38635.2-2020《信息安全技术 SM9 标识密码算法 第2部分：数字签名算法》","keyPoint":"SM9 签名用用户私钥，主私钥只派生密钥、不签名。"},{"id":"第二部分专业题-一、密码学-判断题-63","no":63,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"在公钥密码中，加密和解密使用相同的密钥，因此称为对称密码。","options":[],"answer":"错","analysis":"公钥密码又叫非对称密码，其根本特征是加密密钥与解密密钥成对不同：公钥公开用于加密或验签，私钥保密用于解密或签名。题干前半句描述的是对称密码的特征，却挂到「公钥密码」名下，属于概念张冠李戴。对称密码才是加解密共用同一密钥。本题考的是公钥密码的基本定义，混淆「对称/非对称」是常见失分点。","correctReason":"公钥密码属于非对称密码，加解密使用不同密钥，故该表述不成立。","wrongReason":"","source":"GB/T 25069-2022《信息安全技术 术语》中公开密钥密码体制与非对称密码体制的定义","keyPoint":"公钥密码＝非对称：公钥加密、私钥解密，密钥不同。"},{"id":"第二部分专业题-一、密码学-判断题-64","no":64,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"SM9 密钥交换协议需要使用密码杂凑函数、密钥派生函数、随机数发生器作 为辅助函数。","options":[],"answer":"对","analysis":"SM9 密钥交换协议在计算会话密钥之外，还要完成密钥确认，它的辅助函数包括密码杂凑函数、密钥派生函数和随机数发生器；此外还用到双线性对、群上的点乘等运算。杂凑函数用于把标识与密钥材料压成定长值，密钥派生函数把共享秘密展开成会话密钥，随机数发生器提供临时密钥的随机性。本题考的是 SM9 密钥交换的辅助函数构成，易与签名、加密算法所调用的辅助函数混淆。","correctReason":"该协议明确以杂凑函数、密钥派生函数和随机数发生器作为辅助函数，表述成立。","wrongReason":"","source":"GB/T 38635.3-2020《信息安全技术 SM9 标识密码算法 第3部分：密钥交换协议》","keyPoint":"SM9 密钥交换辅助函数：杂凑、KDF、随机数发生器。"},{"id":"第二部分专业题-一、密码学-判断题-65","no":65,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"序列密码的加密速度通常快于分组密码，适合数据流加密。","options":[],"answer":"错","analysis":"流密码按比特或字节逐位加密、不需分组填充，硬件实现极简，传统观点认为其速度优于分组密码；但分组密码也可通过 CTR、OFB 等工作模式变成流式加密，且现代分组密码在通用处理器上常配合指令集并行加速，效率并不必然更低，因此「通常快于」这一绝对化说法不能成立。命题意在纠正「凡流密码必快于分组密码」的刻板印象。该题答案以官方为准。","correctReason":"两者速度取决于算法与实现，不能一概而论说流密码更快，故该表述不成立。","wrongReason":"","source":"GM/T 0001-2012《祖冲之序列密码算法》与 GB/T 32907-2016《信息安全技术 SM4 分组密码算法》相关效率说明","keyPoint":"流密码与分组密码速度无绝对优劣，取决于实现。"},{"id":"第二部分专业题-一、密码学-判断题-66","no":66,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"SM9 标识密码算法密钥交换过程中不需要计算群中的元素。","options":[],"answer":"错","analysis":"SM9 密钥交换要在双线性群上做大量运算：用户私钥与对方标识的哈希值做点乘、双方交换群元素后计算双线性对、再由共享秘密派生会话密钥。所谓「不需要计算群中的元素」与实际流程相反，交换的临时公钥本身就是群元素。本题考的是对标识密码底层数学结构的认识，易误以为标识密码只做哈希和异或。","correctReason":"密钥交换全过程依赖群元素的点乘与双线性对运算，故该表述不成立。","wrongReason":"","source":"GB/T 38635.3-2020《信息安全技术 SM9 标识密码算法 第3部分：密钥交换协议》","keyPoint":"SM9 密钥交换核心是群上点乘与双线性对运算。"},{"id":"第二部分专业题-一、密码学-判断题-67","no":67,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"伪随机数发生器不需要种子即可生成随机数序列。","options":[],"answer":"错","analysis":"伪随机数发生器的「伪」就在于其输出由算法加种子确定：给定种子即可完全复现序列，因此种子是必需的输入，其随机性直接决定输出序列的质量。真正不需要种子的是利用物理噪声源的真随机数发生器。本题考的是伪随机数发生器与真随机数发生器的区别，易错点是把伪随机误当成凭空产生随机性。","correctReason":"伪随机序列由确定性算法从种子扩展而来，无种子无法生成，故该表述不成立。","wrongReason":"","source":"GM/T 0005-2021《随机性检测规范》及 GM/T 0062-2018《密码产品随机数检测要求》","keyPoint":"伪随机数发生器必须有种子，种子决定整条序列。"},{"id":"第二部分专业题-一、密码学-判断题-68","no":68,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"在公钥加密算法中，私钥用于加密消息，公钥用于解密消息。","options":[],"answer":"错","analysis":"公钥加密体制中，公钥是公开的，任何人都可以用它加密；私钥由接收者独占，只有它能解密，这样才能保证机密性。至于「私钥加密、公钥解密」实际上对应数字签名中的私钥签名与公钥验签，是另一种用法。题干把加密方向写反了，本题考的是公钥密码的加解密方向及其与签名用法的区别。","correctReason":"公钥用于加密、私钥用于解密，题干方向颠倒，故该表述不成立。","wrongReason":"","source":"GB/T 32918.1-2016《信息安全技术 SM2 椭圆曲线公钥密码算法 第1部分：总则》","keyPoint":"公钥加密、私钥解密；私钥签名、公钥验签。"},{"id":"第二部分专业题-一、密码学-判断题-69","no":69,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"SM4 加密算法与密钥扩展算法中的轮函数基本相同，只将线性变换进行了修 改。","options":[],"answer":"对","analysis":"SM4 的加密算法与密钥扩展算法都采用 32 轮迭代，每轮结构相同：先做轮密钥异或，再经 8 比特 S 盒代换，最后做线性变换。区别在于线性变换的循环移位参数不同，密钥扩展用的是另一组移位常量，故说「只将线性变换进行了修改」是正确的。本题考的是 SM4 轮函数与密钥扩展结构的一致性，是理解 SM4 实现与硬件复用的关键点。","correctReason":"两者轮函数结构一致，仅线性变换的移位参数被替换，表述成立。","wrongReason":"","source":"GB/T 32907-2016《信息安全技术 SM4 分组密码算法》第 6、7 章","keyPoint":"SM4 加密与密钥扩展同构，仅线性变换移位参数不同。"},{"id":"第二部分专业题-一、密码学-判断题-70","no":70,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"维吉尼亚密码属于单表代换密码。","options":[],"answer":"错","analysis":"维吉尼亚密码使用一个关键词确定各位置的移位量，同一个明文字母在不同位置会被替换成不同密文字母，属于典型的多表代换密码。单表代换指整个明文空间只使用一张固定的替换表，如凯撒密码、仿射密码。本题考的是代换密码的单表与多表分类，易错点是只看到「字母替换」就误判为单表。","correctReason":"维吉尼亚密码随密钥字符改变替换表，属多表代换密码，故该表述不成立。","wrongReason":"","source":"密码学教材（古典密码部分）关于单表代换与多表代换密码的分类","keyPoint":"维吉尼亚是多表代换，凯撒、仿射是单表代换。"},{"id":"第二部分专业题-一、密码学-判断题-71","no":71,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"密码学中的“混淆”和“扩散”概念由 Shannon 提出，用于衡量密码算法的 安全性。","options":[],"answer":"对","analysis":"Shannon 在其保密系统通信理论中提出混淆与扩散两条设计准则：混淆让密钥与密文之间的统计关系尽量复杂，使攻击者难以由密文推测密钥；扩散让明文和密钥的每一位影响密文的众多位，从而平抑统计特征。二者至今仍是分组密码轮函数设计的核心指标。本题考的是这两条准则的提出者与作用，属密码学基础知识点。","correctReason":"混淆与扩散确由 Shannon 提出并作为衡量算法安全性的设计准则，表述成立。","wrongReason":"","source":"C. E. Shannon《Communication Theory of Secrecy Systems》（1949）","keyPoint":"混淆藏密钥与密文关系，扩散使一位影响多位。"},{"id":"第二部分专业题-一、密码学-判断题-72","no":72,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"OFB 加密模式在解密过程中需要执行分组密码的解密操作。","options":[],"answer":"错","analysis":"OFB（输出反馈）模式把分组密码当作密钥流发生器使用：先用密钥和 IV 反复加密生成密钥流，再与明文逐位异或。解密时只需用同样的方式再生成一次密钥流并与密文异或，加解密都只调用加密函数，不需要调用分组密码的解密函数。本题考的是各工作模式对加解密函数的使用方式，OFB 与 CTR 同属此类。","correctReason":"OFB 解密与加密一样只使用加密运算生成密钥流，故该表述不成立。","wrongReason":"","source":"GB/T 17964-2021《信息安全技术 分组密码算法的工作模式》中 OFB 工作模式","keyPoint":"OFB／CTR 加解密都只用加密函数，不用解密函数。"},{"id":"第二部分专业题-一、密码学-判断题-73","no":73,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"CBC 加密模式在解密过程中需要执行分组密码的解密操作。","options":[],"answer":"对","analysis":"CBC 模式加密时把前一组密文与当前明文异或后再送入分组密码加密，解密时必须真正调用分组密码的解密函数还原中间值，再与前一组密文异或得到明文，最后一块的处理也同样依赖解密函数。因此 CBC 的加解密是两套不同的运算。本题与 OFB 对照考查各工作模式的实现差异，注意 CBC 无法只用加密函数完成解密。","correctReason":"CBC 解密需调用分组密码的解密函数还原明文，表述成立。","wrongReason":"","source":"GB/T 17964-2021《信息安全技术 分组密码算法的工作模式》中 CBC 工作模式","keyPoint":"CBC 解密要用解密函数，OFB／CTR 不用。"},{"id":"第二部分专业题-一、密码学-判断题-74","no":74,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"消息鉴别码生成的标签必须随同消息一起加密发送给对方。","options":[],"answer":"对","analysis":"消息鉴别码是对消息和密钥计算出的定长标签，接收方必须同时拿到消息与标签才能重新计算并比对，只收到其中一项便无法完成鉴别，所以标签要和消息一起发给对方。至于标签本身是否再加密，取决于协议设计（可用独立的鉴别密钥保护），但「随同消息一起发送」这一点是成立的。本题考的是 MAC 的使用方式，别与数字签名混淆。","correctReason":"接收方需凭消息与标签重新计算比对，标签必须随消息一同发送，表述成立。","wrongReason":"","source":"GB/T 15852.1-2020《信息安全技术 消息鉴别码 第1部分：采用分组密码的机制》","keyPoint":"MAC 标签与消息同送，接收方重算比对完成鉴别。"},{"id":"第二部分专业题-一、密码学-判断题-75","no":75,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"一次一密体制可以实现完全保密，因此可以同时保证消息的完整性和不可否 认性。","options":[],"answer":"错","analysis":"一次一密在密钥真随机、长度不短于明文、只用一次的条件下能达到完善保密性，但完善保密只解决机密性，即密文不泄露明文信息，与完整性和不可否认性无关。它无法检测密文被篡改，也没有任何身份绑定，任何人都能伪造。本题考的是保密性、完整性与不可否认性是彼此独立的安全目标，不能由完善保密顺推。","correctReason":"一次一密只保证机密性，不提供完整性与不可否认性，故该表述不成立。","wrongReason":"","source":"C. E. Shannon《Communication Theory of Secrecy Systems》（1949）关于完善保密性的结论","keyPoint":"完善保密只管机密性，不含完整性与不可否认性。"},{"id":"第二部分专业题-一、密码学-判断题-76","no":76,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"CCM 不仅能加密数据，还能够保护数据的完整性。","options":[],"answer":"对","analysis":"CCM 是 CTR 加密与 CBC-MAC 的组合模式，先对明文做 CBC-MAC 得到鉴别标签，再用 CTR 模式加密明文与标签，从而实现「加密并鉴别」的认证加密。接收方解密后重新计算 MAC 并比对，可发现任何篡改。本题考的是 CCM 属于带关联数据的认证加密模式，兼有机密性与完整性保护。","correctReason":"CCM 由 CTR 加密与 CBC-MAC 组合而成，能同时提供机密性和完整性，表述成立。","wrongReason":"","source":"NIST SP 800-38C《Recommendation for Block Cipher Modes of Operation: The CCM Mode for Authentication and Confidentiality》","keyPoint":"CCM＝CTR 加密＋CBC-MAC，属认证加密模式。"},{"id":"第二部分专业题-一、密码学-判断题-77","no":77,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"SM4 算法采用的8 比特S 盒与AES 算法的S 盒满足仿射等价关系。","options":[],"answer":"对","analysis":"SM4 与 AES 都是 8 比特输入输出的 S 盒，密码学界已证明两者的 S 盒在仿射变换意义下等价，即存在可逆仿射变换把其中一个 S 盒映射为另一个。仿射等价说明两者的非线性度、差分均匀度等密码学指标一致，但两条曲线的参数和整体结构不同，安全性并不会因等价而相互削弱。本题考的是 S 盒等价性这一经典结论。","correctReason":"SM4 的 S 盒与 AES 的 S 盒确实构成仿射等价关系，表述成立。","wrongReason":"","source":"GB/T 32907-2016《信息安全技术 SM4 分组密码算法》及 SM4 S 盒仿射等价性公开研究结论","keyPoint":"SM4 与 AES 的 8 比特 S 盒仿射等价，密码学指标相同。"},{"id":"第二部分专业题-一、密码学-判断题-78","no":78,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"ZUC 算法LFSR 部分产生的二元序列具有很低的线性复杂度。","options":[],"answer":"对","analysis":"ZUC 采用三层结构：LFSR 层、比特重组层和非线性函数层。LFSR 在素域上基于本原多项式递归，单个抽头序列的线性复杂度确实很低，这正是设计上有意为之——若把 LFSR 输出直接当密钥流，用 Berlekamp-Massey 算法就能恢复初态。安全性由比特重组和非线性函数共同引入的非线性来保证，故题干对 LFSR 部分的描述成立。本题考的是 ZUC 各层的分工。","correctReason":"ZUC 的 LFSR 为线性反馈结构，其输出序列线性复杂度很低，表述成立。","wrongReason":"","source":"GM/T 0001-2012《祖冲之序列密码算法》","keyPoint":"ZUC 的 LFSR 线性复杂度低，非线性由重组与 F 函数提供。"},{"id":"第二部分专业题-一、密码学-判断题-79","no":79,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"使用Sponge 结构的密码杂凑函数，输入的数据在进行填充之后，要经过吸收 阶段和挤出阶段，最终生成输出的杂凑值。","options":[],"answer":"对","analysis":"Sponge 结构先把输入按固定速率分组并做填充（如 SHA-3 的 pad10*1），然后进入吸收阶段：每组数据与状态异或后经置换函数 f 压缩进状态；输入吸收完后进入挤出阶段，反复输出速率部分并调用置换函数，直到得到所需长度的杂凑值。SHA-3 是这一结构的典型代表，它与基于 Merkle-Damgård 迭代的 SM3 在设计框架上并不同源，注意区分。本题考的是 Sponge 结构的两阶段流程。","correctReason":"Sponge 结构确为「填充—吸收—挤出」三步骤，表述成立。","wrongReason":"","source":"GB/T 38761-2020《信息安全技术 基于海绵结构的密码杂凑算法设计指南》","keyPoint":"Sponge＝填充＋吸收＋挤出，速率与容量分离。"},{"id":"第二部分专业题-一、密码学-判断题-80","no":80,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"单向陷门函数，是在不知陷门信息的情况下求逆困难的函数，当知道陷门信 息后，求逆是易于实现的。","options":[],"answer":"对","analysis":"单向陷门函数是一类特殊单向函数：正向计算容易，不知道陷门信息时求逆在计算上不可行；一旦掌握陷门（如 RSA 的素因子分解、椭圆曲线密码的私钥），求逆就变得容易。公钥密码正是靠这种「有陷门则易、无陷门则难」的不对称性同时实现加密与解密。本题考的是陷门单向函数与公钥密码的构造基础。","correctReason":"陷门信息使求逆由困难变为可行，这正是陷门单向函数的定义，表述成立。","wrongReason":"","source":"GB/T 25069-2022《信息安全技术 术语》中单向陷门函数的定义","keyPoint":"陷门函数：无陷门求逆难，有陷门求逆易。"},{"id":"第二部分专业题-一、密码学-填空题-1","no":1,"kind":"blank","part":"第二部分专业题","cat":"一、密码学","type":"填空题","stem":"基域选择Fp-256 时，SM2 算法的数字签名的私钥长度为 。","options":[],"answer":"256","analysis":"SM2 推荐曲线定义在 256 位素域 Fp 上，私钥 d 是 [1, n-2] 区间内的整数，长度与基点阶 n 相同，即 256 比特（32 字节）。公钥是私钥与基点相乘得到的椭圆曲线点，未压缩表示要 65 字节，两者长度并不一样，这是最常见的易混点。题目问的是私钥本身所占位数，故为 256。","correctReason":"私钥与基点阶同长，Fp-256 曲线下私钥为 256 比特整数。","wrongReason":"","source":"GB/T 32918.1-2016《信息安全技术 SM2 椭圆曲线公钥密码算法 第1部分：总则》","keyPoint":"SM2 私钥 256 比特（32 字节）"},{"id":"第二部分专业题-一、密码学-填空题-2","no":2,"kind":"blank","part":"第二部分专业题","cat":"一、密码学","type":"填空题","stem":"某政务系统使用国密对称算法对敏感文件进行加密，该算法的分组长度为128 位，密钥长度可为128/192/256 位，且采用非平衡Feistel 结构。该算法的标准名 称是____。","options":[],"answer":"SM4","analysis":"SM4 分组长度固定 128 比特，采用 32 轮非线性迭代，整体是非平衡 Feistel 结构，轮函数由轮密钥异或、S 盒和线性变换 L 组成，这是判定它的关键特征。AES 属 SPN 结构，分组虽同为 128 位却不符合 Feistel 描述；DES 分组只有 64 位。题干中「密钥长度可为 128/192/256 位」其实是 AES 的特点，SM4 密钥固定 128 位，本题依据分组长度与迭代结构判定为 SM4（答案以官方为准）。","correctReason":"128 位分组加非平衡 Feistel 迭代结构对应 SM4，故填 SM4。","wrongReason":"","source":"GB/T 32907-2016《信息安全技术 SM4 分组密码算法》","keyPoint":"SM4：分组 128 位＋32 轮非平衡 Feistel"},{"id":"第二部分专业题-一、密码学-填空题-3","no":3,"kind":"blank","part":"第二部分专业题","cat":"一、密码学","type":"填空题","stem":"在金融IC 卡应用中，使用基于椭圆曲线双线性对的标识密码算法实现无需证 书的身份认证，该算法是____。","options":[],"answer":"SM9","analysis":"SM9 是基于椭圆曲线双线性对（Tate/Weil 配对）的标识密码算法，把用户可读标识当作公钥，由密钥生成中心 KGC 用主密钥派生用户私钥，因而不依赖数字证书和 CA 体系，特别适合金融 IC 卡这类海量终端。对比记忆：SM2 是椭圆曲线公钥算法、需要证书；SM4 是对称算法，无法完成非对称身份认证。","correctReason":"以标识为公钥、基于双线性对且无需证书，正是 SM9 的特征。","wrongReason":"","source":"GB/T 38635.1-2020《信息安全技术 SM9 标识密码算法 第1部分：总则》","keyPoint":"SM9＝双线性对＋标识密码＋免证书"},{"id":"第二部分专业题-一、密码学-填空题-4","no":4,"kind":"blank","part":"第二部分专业题","cat":"一、密码学","type":"填空题","stem":"MD5 算法输出128 位哈希值，但已被证明存在碰撞攻击，不适用于数字签名 场景。我国SM3 算法输出____位哈希值，安全性更高。","options":[],"answer":"256","analysis":"SM3 输出 256 比特杂凑值，分组长度 512 比特，采用 Merkle-Damgård 迭代与 64 轮压缩，抗碰撞强度约 2^128，比 MD5（128 位输出、已被实际碰撞攻击攻破）高出一个量级。杂凑值长度直接决定碰撞攻击成本，所以 256 位输出已是当前数字签名场景的安全底线。","correctReason":"SM3 的输出为 256 比特杂凑值，抗碰撞性远优于 MD5。","wrongReason":"","source":"GB/T 32905-2016《信息安全技术 SM3 密码杂凑算法》","keyPoint":"SM3 输出 256 位、分组 512 位、压缩 64 轮"},{"id":"第二部分专业题-一、密码学-填空题-5","no":5,"kind":"blank","part":"第二部分专业题","cat":"一、密码学","type":"填空题","stem":"SM4 国密分组密码算法的明文分组长度为 ______ 比特。","options":[],"answer":"128","analysis":"分组长度指算法一次能处理的数据块大小，SM4 固定为 128 比特（16 字节），数值与其密钥长度 128 比特相同，但概念完全不同。横向对比：DES 分组 64 位，AES 与 SM4 分组均为 128 位。数据长于一个分组时要按工作模式串联处理，不足一个分组时按标准方式填充。","correctReason":"SM4 标准规定的明文分组长度为 128 比特。","wrongReason":"","source":"GB/T 32907-2016《信息安全技术 SM4 分组密码算法》","keyPoint":"SM4 分组 128 位＝16 字节，与密钥等长"},{"id":"第二部分专业题-一、密码学-填空题-6","no":6,"kind":"blank","part":"第二部分专业题","cat":"一、密码学","type":"填空题","stem":"SM3 算法的初始化向量IV 为7380166f4914b2b9172442d7da8a0600 a96f30bc 163138aae38dee4db0fb0e4e，共____个32 位字。","options":[],"answer":"8","analysis":"SM3 的 256 比特初始向量 IV 由 8 个 32 位字组成，即 7380166f 起至 b0fb0e4e 的 8 个十六进制字，迭代时分别装入 A 至 H 八个寄存器。通用算法是「比特数 ÷ 32」：256÷32=8，也可按每 8 个十六进制字符切一组来数。同类常考参数还有 512 位分组、64 轮压缩、消息扩展出 68 个字。","correctReason":"IV 共 256 比特，按每字 32 位划分即 8 个字。","wrongReason":"","source":"GB/T 32905-2016《信息安全技术 SM3 密码杂凑算法》","keyPoint":"SM3 的 IV＝8 个 32 位字（装入 A~H）"},{"id":"第二部分专业题-一、密码学-填空题-7","no":7,"kind":"blank","part":"第二部分专业题","cat":"一、密码学","type":"填空题","stem":"有一张长长的数字“藏宝图”（消息），长度为1000 字节。你需要用SM3 算法 计算它的“指纹”（杂凑值）。SM3 处理消息时，会把它切成若干个512 位（64 字节）的块，那么可以切16 块。","options":[],"answer":"16","analysis":"SM3 按 512 比特（64 字节）分组处理。1000 字节＝8000 比特，含 15 个完整分组、余 320 比特；余下部分按规则补 0x80、补 0 到 448 模 512，再追加 64 比特消息长度，最后一块正好补齐 512 位，所以总共要切 16 块。数块数时必须把填充数据算进去。","correctReason":"1000 字节需 15 个完整分组，余下部分连同填充与长度字段构成第 16 块。","wrongReason":"","source":"GB/T 32905-2016《信息安全技术 SM3 密码杂凑算法》","keyPoint":"SM3 分组 512 位；1000 字节填充后为 16 块","note":"原卷此题未印答案（题干中直接写明了“可以切16块”），答案按题干补全。"},{"id":"第二部分专业题-一、密码学-填空题-8","no":8,"kind":"blank","part":"第二部分专业题","cat":"一、密码学","type":"填空题","stem":"SM4 算法的加密迭代轮数为 ______ 轮。","options":[],"answer":"32","analysis":"SM4 加密共 32 轮非线性迭代，每轮使用一把 32 位轮密钥，由 128 位主密钥经密钥扩展算法生成 32 把；解密结构与加密完全相同，只把轮密钥顺序倒过来用，这是 Feistel 类结构的典型优点。轮数决定扩散是否充分：轮数太少，明文与密钥的影响无法遍及整个分组。","correctReason":"SM4 标准规定加密迭代轮数为 32 轮。","wrongReason":"","source":"GB/T 32907-2016《信息安全技术 SM4 分组密码算法》","keyPoint":"SM4＝32 轮迭代，解密仅轮密钥逆序"},{"id":"第二部分专业题-一、密码学-填空题-9","no":9,"kind":"blank","part":"第二部分专业题","cat":"一、密码学","type":"填空题","stem":"你需要用SM4 算法加密一条信息，想象加密过程就像通过一个有32 扇门的迷 宫，每过一扇门，信息就会被转换一次，而且每扇门都需要一把不同的钥匙（轮 密钥），那么加密一个消息，需要穿过这个迷宫的 扇门。","options":[],"answer":"32","analysis":"题面把一轮迭代比作穿过一扇门、每扇门配一把不同的轮密钥，SM4 共 32 轮，自然要穿过 32 扇门。要分清一组数字：轮数 32、分组长度 128 比特、密钥长度 128 比特、轮密钥 32 把，它们最容易被张冠李戴。","correctReason":"SM4 加密需完成 32 轮迭代，对应 32 把轮密钥。","wrongReason":"","source":"GB/T 32907-2016《信息安全技术 SM4 分组密码算法》","keyPoint":"SM4 一轮一把轮密钥，共 32 把"},{"id":"第二部分专业题-一、密码学-填空题-10","no":10,"kind":"blank","part":"第二部分专业题","cat":"一、密码学","type":"填空题","stem":"当AES 的明文分组和密钥长度均为128 比特时，加密迭代轮数为 ______ 轮。","options":[],"answer":"10","analysis":"AES 的轮数由密钥长度决定：128 位密钥 10 轮、192 位 12 轮、256 位 14 轮。每轮依次做字节代换、行移位、列混合和轮密钥加，末轮省略列混合；分组长度恒为 128 位，与密钥长度无关。SM4 则不论何种情况都是 32 轮，两套参数别串了。","correctReason":"AES 规定 128 位密钥对应 10 轮迭代。","wrongReason":"","source":"FIPS PUB 197（AES 高级加密标准）","keyPoint":"AES 轮数：128/192/256 位密钥→10/12/14 轮"},{"id":"第二部分专业题-一、密码学-填空题-11","no":11,"kind":"blank","part":"第二部分专业题","cat":"一、密码学","type":"填空题","stem":"SM2 是一种基于椭圆曲线密码的公钥加密算法，如果明文长度是128 比特， 那么经过SM2 加密后的密文长度是 比特。","options":[],"answer":"896","analysis":"SM2 密文结构为 C1‖C3‖C2：C1 是加密所用随机点，按 x、y 坐标各 32 字节共 64 字节（512 比特）；C3 是 32 字节（256 比特）杂凑值；C2 与明文等长，128 比特即 16 字节。三者相加 512+256+128=896 比特。若把未压缩点前缀 0x04 也算进去则是 904 比特，本题按官方口径不计前缀。","correctReason":"C1(512 位)+C3(256 位)+C2(128 位)=896 比特。","wrongReason":"","source":"GB/T 32918.4-2016《信息安全技术 SM2 椭圆曲线公钥密码算法 第4部分：公钥加密算法》","keyPoint":"SM2 密文＝C1(512 位)+C3(256 位)+明文长度"},{"id":"第二部分专业题-一、密码学-填空题-12","no":12,"kind":"blank","part":"第二部分专业题","cat":"一、密码学","type":"填空题","stem":"凯撒密码是一种经典的替换密码，通过将字母表中的每个字母移动固定的偏 移量来进行加密。若给定偏移量为3，明文字母'A'的密文字母是 。","options":[],"answer":"D","analysis":"凯撒密码是单表移位替换，加密规则为「密文＝(明文＋偏移量) mod 26」。偏移量 3 时 A→D、B→E、X→A、Y→B、Z→C，越过表尾要回绕。与维吉尼亚密码的区别在于：凯撒的偏移量固定不变，维吉尼亚的偏移量随密钥字母逐位变化。","correctReason":"A 对应 0，0+3=3，映射回字母表即 D。","wrongReason":"","source":"经典密码学教材（凯撒密码，单表移位替换）","keyPoint":"凯撒密码模 26 移位，位移 3 时 A→D、Z→C"},{"id":"第二部分专业题-一、密码学-填空题-13","no":13,"kind":"blank","part":"第二部分专业题","cat":"一、密码学","type":"填空题","stem":"SM3 密码杂凑算法是中国国家密码管理局发布的一种密码杂凑算法，其压缩 函数一共有 种不同的布尔函数。","options":[],"answer":"2","analysis":"SM3 压缩函数每轮使用两个布尔函数 FF_j 与 GG_j，故共 2 种；它们各自按轮序号 j 分两段取不同表达式（前 16 轮为多数/选择逻辑，后 48 轮为异或逻辑）。配套记忆：消息扩展产生 68 个字 W0~W67 和 64 个字 W0′~W63′，共做 64 轮迭代，这与 SHA-256 使用的逻辑函数个数不同。","correctReason":"压缩函数只定义 FF 与 GG 两种布尔函数（各含两种表达式）。","wrongReason":"","source":"GB/T 32905-2016《信息安全技术 SM3 密码杂凑算法》","keyPoint":"SM3 压缩函数有 FF、GG 两种布尔函数"},{"id":"第二部分专业题-一、密码学-填空题-14","no":14,"kind":"blank","part":"第二部分专业题","cat":"一、密码学","type":"填空题","stem":"3DES 算法的加密迭代轮数为 ______ 轮（16 轮×3）。","options":[],"answer":"48","analysis":"3DES 用三个 56 位有效密钥对同一分组做三次 DES 运算（加密—解密—加密），每次 DES 为 16 轮 Feistel 迭代，合计 16×3=48 轮。分组仍为 64 位，实际安全强度约 112 比特；因软件效率低且存在 Sweet32 类生日攻击风险，正逐步被 AES 取代。","correctReason":"三次 DES 各 16 轮，16×3 即 48 轮。","wrongReason":"","source":"NIST SP 800-67（TDEA/3DES 使用建议）","keyPoint":"3DES＝3×16＝48 轮，分组仍为 64 位"},{"id":"第二部分专业题-一、密码学-填空题-15","no":15,"kind":"blank","part":"第二部分专业题","cat":"一、密码学","type":"填空题","stem":"DES 是一种广泛使用的对称密钥加密算法，其加密过程基于Feistel 网络结构， 共经过 次迭代运算的处理。","options":[],"answer":"16","analysis":"DES 分组 64 位、密钥 64 位（含 8 位奇偶校验位，有效密钥 56 位），采用 16 轮 Feistel 迭代，每轮使用由密钥调度算法生成的 48 位子密钥，加解密共用同一算法、仅子密钥顺序相反。56 位密钥空间仅约 2^56，现代算力可穷举，DES 已不安全。","correctReason":"DES 标准规定进行 16 轮迭代运算。","wrongReason":"","source":"FIPS PUB 46-3（DES 数据加密标准）","keyPoint":"DES：64 位分组、56 位有效密钥、16 轮迭代"},{"id":"第二部分专业题-一、密码学-填空题-16","no":16,"kind":"blank","part":"第二部分专业题","cat":"一、密码学","type":"填空题","stem":"RSA 算法中，已被认为不安全、逐步淘汰的密钥长度为 ______ 比特。","options":[],"answer":"1024","analysis":"RSA 安全性依赖大整数分解难度，密钥越短越容易分解。1024 位 RSA 的安全强度仅约 80 比特，NIST 早已不允许其用于新系统，现行要求不低于 2048 位（约 112 比特强度），故 1024 位属于被逐步淘汰的长度。512 位更早已被实际破解，3072 位用于更长期的数据保护。","correctReason":"1024 位 RSA 安全强度不足，属已被淘汰的密钥长度。","wrongReason":"","source":"NIST SP 800-57 Part 1（密钥管理建议）","keyPoint":"RSA 1024 位已淘汰，新系统不低于 2048 位"},{"id":"第二部分专业题-一、密码学-填空题-17","no":17,"kind":"blank","part":"第二部分专业题","cat":"一、密码学","type":"填空题","stem":"维吉尼亚加密是一种经典的多表替代密码，由布莱斯·德·维吉尼亚在16 世纪 提出。它通过密钥对明文进行加密，增强了单表替代密码的安全性。给定明文 HELLO 和密钥KEY，则加密后的密文是_ _。","options":[],"answer":"RIJVS","analysis":"维吉尼亚密码按「密文＝(明文＋密钥) mod 26」逐位加密，密钥不足时循环使用。HELLO 配密钥 K、E、Y、K、E：H+K=17→R，E+E=8→I，L+Y=35 mod 26=9→J，L+K=21→V，O+E=18→S，连起来即 RIJVS。关键在于密钥要对齐并循环覆盖每一位明文。","correctReason":"按密钥 KEY 循环逐位模 26 相加，依次得到 R、I、J、V、S。","wrongReason":"","source":"经典密码学教材（维吉尼亚多表替代密码）","keyPoint":"维吉尼亚：逐位模 26 相加，密钥循环使用"},{"id":"第二部分专业题-一、密码学-填空题-18","no":18,"kind":"blank","part":"第二部分专业题","cat":"一、密码学","type":"填空题","stem":"你要和盟友交换SM2 公钥。你告诉他，你发送的未压缩公钥字符串会以一个 特殊的十六进制前缀“_ _”开头，这样他就能识别出来。","options":[],"answer":"04","analysis":"SM2 公钥是椭圆曲线点，表示形式有三种：未压缩形式以 0x04 开头，后接 32 字节 x 坐标与 32 字节 y 坐标（共 65 字节）；压缩形式以 0x02（y 为偶）或 0x03（y 为奇）开头，只给出 x。接收方看首字节即可判定格式，0x04 就是未压缩点标识。","correctReason":"未压缩点形式的标识字节是 0x04，后接 x‖y 坐标。","wrongReason":"","source":"GB/T 32918.1-2016《信息安全技术 SM2 椭圆曲线公钥密码算法 第1部分：总则》","keyPoint":"SM2 点表示：04 未压缩，02/03 压缩"},{"id":"第二部分专业题-一、密码学-填空题-19","no":19,"kind":"blank","part":"第二部分专业题","cat":"一、密码学","type":"填空题","stem":"SHA-256 算法输出的哈希值通常表示为 ______ 个十六进制字符。","options":[],"answer":"64","analysis":"SHA-256 输出 256 比特，每个十六进制字符表示 4 比特，故 256÷4=64 个字符。这是通用换算法则：SM3 的 256 比特杂凑值同样写成 64 个十六进制字符，MD5 的 128 位则写成 32 个。看到「多少个十六进制字符」，先除以 4 即可。","correctReason":"256 比特除以每字符 4 比特，得 64 个十六进制字符。","wrongReason":"","source":"FIPS PUB 180-4（SHA 系列）；SM3 见 GB/T 32905-2016","keyPoint":"十六进制字符数＝比特数÷4，256 位→64 字符"},{"id":"第二部分专业题-一、密码学-填空题-20","no":20,"kind":"blank","part":"第二部分专业题","cat":"一、密码学","type":"填空题","stem":"在Diffie-Hellman 密钥交换协议中，双方使用公共参数：素数模数p=23 和原 根g=5。Alice 选择私有密钥a=6，Bob 选择私有密钥b=15。根据协议，Alice 需 要计算她的公钥A 并发送给Bob，那么Alice 的公钥A= 。","options":[],"answer":"8","analysis":"DH 协议中公钥按 A=g^a mod p 计算，即 5^6 mod 23。逐步算：5^2=25≡2，5^3≡10，5^6=(5^3)^2=100≡8，所以 A=8。Bob 的公钥为 5^15≡19，双方再以对方公钥求幂（8^15≡19^6≡2），得到相同的共享密钥。","correctReason":"A=g^a mod p=5^6 mod 23=100 mod 23=8。","wrongReason":"","source":"Diffie-Hellman 密钥交换协议（Diffie 与 Hellman，1976），安全性基于离散对数难题","keyPoint":"DH 公钥＝g^私钥 mod p，双方共享值相等"},{"id":"第二部分专业题-一、密码学-填空题-21","no":21,"kind":"blank","part":"第二部分专业题","cat":"一、密码学","type":"填空题","stem":"对于Hill 密码，给定密钥矩阵K=       73 811 和密文DHFL（字母映射：A=0,B=1,..., Z=25），则明文为 。","options":[],"answer":"RQZC","analysis":"Hill 密码把字母两两分组看作向量，加密为 C=K·P mod 26，解密则用密钥矩阵在模 26 下的逆矩阵左乘密文。矩阵可逆的条件是行列式与 26 互素，本题 det=7×11−3×8=53≡1，逆矩阵存在。把密文分组 DH、FL 分别还原即得明文 RQZC，运算全程注意 A=0 并按 26 取模。","correctReason":"用密钥矩阵的模 26 逆矩阵左乘密文分组，还原出明文 RQZC。","wrongReason":"","source":"经典密码学教材（Hill 密码，L. Hill 1929）","keyPoint":"Hill 解密＝逆矩阵左乘密文，密钥矩阵须模 26 可逆"},{"id":"第二部分专业题-一、密码学-填空题-22","no":22,"kind":"blank","part":"第二部分专业题","cat":"一、密码学","type":"填空题","stem":"在SM2 公钥加密算法中，密文由C1、C2 和C3 三部分组成。如果SM2 的密 文长度是2048 比特，那么相应明文长度是 比特。","options":[],"answer":"1280","analysis":"SM2 密文为 C1‖C3‖C2：C1 是加密随机点（x、y 各 32 字节，共 64 字节即 512 比特），C3 是 256 比特杂凑值，二者合计 768 比特固定开销；C2 与明文等长。2048 比特减去 768 比特得 1280 比特。记通用算式：明文长度＝密文长度−768 比特。","correctReason":"密文 2048 位＝C1(512)+C3(256)+明文长度，故明文＝1280 比特。","wrongReason":"","source":"GB/T 32918.4-2016《信息安全技术 SM2 椭圆曲线公钥密码算法 第4部分：公钥加密算法》","keyPoint":"SM2 密文固定开销 768 比特＝C1 512＋C3 256"},{"id":"第二部分专业题-一、密码学-填空题-23","no":23,"kind":"blank","part":"第二部分专业题","cat":"一、密码学","type":"填空题","stem":"你有一条很短的消息，只有1 字节（比如一个字母“A”）。为了用SM3 计 算它的杂凑值，必须进行填充，使其总长度是512 位的倍数。那么对这1 字节的 消息进行SM3 填充后，整个消息（原始消息+填充数据）的总长度是 比特。","options":[],"answer":"512","analysis":"SM3 填充规则：先在消息末尾补一个 1 比特（即字节 0x80），再补 k 个 0 使 l+1+k≡448 (mod 512)，最后追加 64 比特的消息长度。1 字节消息 l=8，由 8+1+k≡448 得 k=439，加上 64 位长度字段，总长 8+1+439+64=512 比特，刚好一个分组。短消息填充后也至少要占一块。","correctReason":"8+1+439+64=512 比特，填充后恰为 512 位的一个分组。","wrongReason":"","source":"GB/T 32905-2016《信息安全技术 SM3 密码杂凑算法》","keyPoint":"SM3 填充：补 1、补 0 至 448 mod 512，再加 64 位长度"},{"id":"第二部分专业题-一、密码学-填空题-24","no":24,"kind":"blank","part":"第二部分专业题","cat":"一、密码学","type":"填空题","stem":"在（k,n）-秘密分割门限方案中，至少需要 ______ 个参与者才能重构被分割的 秘密。","options":[],"answer":"k","analysis":"（k,n）门限秘密分割把秘密拆成 n 份子秘密交给 n 个参与者，任意 k 份及以上可重构秘密，少于 k 份则得不到任何信息，这就是门限特性。典型实现是 Shamir 基于多项式插值的方案：k−1 次多项式需要 k 个点才能唯一确定，故最少需要 k 个参与者。注意 k≤n，k=n 时即普通秘密分割。","correctReason":"门限方案中的 k 就是重构秘密所需的最少子秘密份数。","wrongReason":"","source":"Shamir (k,n) 门限秘密共享方案（A. Shamir，1979）","keyPoint":"（k,n）门限：满 k 份可重构，少一份都不行"},{"id":"第二部分专业题-一、密码学-填空题-25","no":25,"kind":"blank","part":"第二部分专业题","cat":"一、密码学","type":"填空题","stem":"在RSA 密钥生成过程中，两个质数p 和q 被选中，已知它们的和p+q=24 且 积p×q=143。那么，用于计算私钥的欧拉函数ϕ（n）的值为 。","options":[],"answer":"120","analysis":"由 p+q=24、pq=143 可解出 p=11、q=13，也可直接分解 143=11×13。RSA 中欧拉函数 φ(n)=(p−1)(q−1)=10×12=120，也可用恒等式 φ(n)=pq−p−q+1=143−24+1=120，私钥 d 由 e·d≡1 mod φ(n) 解出。要注意 n=pq=143 是模数，φ(n)=120 才是求私钥用的值。","correctReason":"φ(n)=(p−1)(q−1)=10×12=120。","wrongReason":"","source":"RSA 算法（Rivest、Shamir、Adleman，1978）与欧拉函数性质","keyPoint":"RSA：φ(n)=(p−1)(q−1)，与模数 n 不是一回事"},{"id":"第二部分专业题-一、密码学-填空题-26","no":26,"kind":"blank","part":"第二部分专业题","cat":"一、密码学","type":"填空题","stem":"假如你截获了一份文件，需要验证其真伪。你使用SM3 算法为其生成一个唯 一的“数字指纹”（杂凑值）。这个指纹的长度是 比特。","options":[],"answer":"256","analysis":"SM3 输出固定 256 比特（32 字节）的杂凑值，输入多长、结果长度都不变，这就是杂凑函数「定长输出」的特点。它常用于完整性校验和数字签名中的消息摘要：比对指纹即可发现篡改，而输入改动一位，输出就会面目全非，即雪崩效应。","correctReason":"SM3 的杂凑值长度固定为 256 比特。","wrongReason":"","source":"GB/T 32905-2016《信息安全技术 SM3 密码杂凑算法》","keyPoint":"SM3 定长输出 256 比特（32 字节）"},{"id":"第二部分专业题-一、密码学-填空题-27","no":27,"kind":"blank","part":"第二部分专业题","cat":"一、密码学","type":"填空题","stem":"SM4 分组密码算法采用32 轮非线性迭代结构（Feistel 网络），每轮使用一个 轮密钥和一个固定的非线性变换。其加密过程共需要进行 轮非线性迭代运算。","options":[],"answer":"32","analysis":"SM4 采用 32 轮非线性迭代，轮函数由轮密钥异或、S 盒非线性变换、线性变换 L 与合成置换 T 组成，属非平衡 Feistel 结构，解密只需把轮密钥逆序使用。其中的「非线性」主要来自 S 盒提供的混淆，线性变换负责扩散，二者配合实现雪崩效应。","correctReason":"SM4 的迭代轮数为 32 轮，故非线性迭代运算共 32 轮。","wrongReason":"","source":"GB/T 32907-2016《信息安全技术 SM4 分组密码算法》","keyPoint":"SM4 共 32 轮非线性迭代，解密轮密钥逆序"},{"id":"第二部分专业题-一、密码学-填空题-28","no":28,"kind":"blank","part":"第二部分专业题","cat":"一、密码学","type":"填空题","stem":"使用SM2 算法加密一条长度为16 字节的明文消息，若采用未压缩点形式表 示公钥点，则最终生成的密文长度为 字节。","options":[],"answer":"113","analysis":"SM2 密文长度＝C1+C3+C2。采用未压缩点形式时，C1 为 1 字节前缀 0x04 加 x、y 各 32 字节，共 65 字节；C3 是 32 字节杂凑值；C2 与明文等长 16 字节，合计 65+32+16=113 字节。若按不含 0x04 前缀的口径则算 112 字节，答题时要看清题目对点表示形式的规定。","correctReason":"65（含 04 前缀的未压缩点）＋32（C3）＋16（C2）＝113 字节。","wrongReason":"","source":"GB/T 32918.4-2016《信息安全技术 SM2 椭圆曲线公钥密码算法 第4部分：公钥加密算法》","keyPoint":"SM2 密文 113 字节＝65(C1)+32(C3)+16(C2)"},{"id":"第二部分专业题-一、密码学-填空题-29","no":29,"kind":"blank","part":"第二部分专业题","cat":"一、密码学","type":"填空题","stem":"假如你正在处理SM4 加密的数据，知道SM4 每次加密的数据块大小是固定 的，就像保险箱的储物格一样大，每个格子可以存放___比特的数据。","options":[],"answer":"128","analysis":"SM4 的「储物格」就是分组，每个分组固定 128 比特（16 字节），一次加密只处理一个分组。数据长于一个分组时要借助工作模式串联处理，如 ECB、CBC、CFB、OFB、CTR 等；不足一个分组则按填充规则补齐，工作模式的选择还直接影响密文是否暴露明文结构。","correctReason":"SM4 一次加密的数据块（分组）为 128 比特。","wrongReason":"","source":"GB/T 32907-2016《信息安全技术 SM4 分组密码算法》","keyPoint":"SM4 一格＝一个分组＝128 比特＝16 字节"},{"id":"第二部分专业题-一、密码学-填空题-30","no":30,"kind":"blank","part":"第二部分专业题","cat":"一、密码学","type":"填空题","stem":"一段密文由栅栏密码加密所得，其解密过程如下：首先计算出栏数（密钥） 为4，然后将密文依次按列填入一个4 列的栅栏中，最后按行读取得到明文。若 密文长度为 19 个字符，则用于填充密文的栅栏矩阵，其最后一行的列数应 为 。","options":[],"answer":"3","analysis":"栅栏密码解密时把密文按列依次填入 4 列矩阵，再按行读出即得明文。19 个字符按列填充，每行 4 个字符可填满 4 行共 16 个，余下 3 个落在第 5 行且只能占前 3 列，故最后一行有 3 列。解题关键是先算 19÷4 的商与余数，余数就是末行的字符数。","correctReason":"19÷4 商 4 余 3，最后一行只填 3 个字符即 3 列。","wrongReason":"","source":"经典密码学教材（栅栏/轨道密码，置换密码的一种）","keyPoint":"栅栏解密：按列填入按行读出，余数定末行列数"},{"id":"第二部分专业题-二、密码前沿技术-单选题-1","no":1,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"近年来，移动终端普遍集成指纹、面部和虹膜识别技术，以提升身份验证的安 全性和便捷性。下列相关描述中，哪一项是错误的？（ ）","options":[{"key":"A","text":"指纹识别可能被高精度模具复制"},{"key":"B","text":"面部识别在弱光环境下准确性下降"},{"key":"C","text":"虹膜识别安全性高于传统口令"},{"key":"D","text":"生物信息泄露后可通过修改口令重置"}],"answer":"D","analysis":"本题考生物特征认证的“不可撤销性”。指纹、人脸、虹膜是人体固有特征，一旦泄露无法像口令那样挂失、重置，而且终身难以更换，因此生物识别不能作为唯一认证因素，通常要与口令、安全芯片（如安全元件、TEE）配合。A、B、C 分别描述了指纹可被复制、人脸识别在弱光下准确率下降、虹膜识别强度高于口令，都符合技术事实。D 把生物特征当成可随意修改的口令，混淆了二者性质，故为错误描述。","correctReason":"生物特征具有唯一性和终身不变性，泄露即永久失控，不存在“修改口令”式的重置手段，D 的表述与这一基本事实相反。","wrongReason":"A：指纹可被高精度模具、硅胶指模复制，属真实风险；B：弱光、遮挡、角度变化会明显降低人脸识别准确率，描述正确；C：虹膜纹理复杂、难以伪造，安全强度确实高于可猜测、可共享的传统口令。","source":"《中华人民共和国个人信息保护法》第二十八条（生物识别信息属敏感个人信息）；GB/T 35273-2020《信息安全技术 个人信息安全规范》","keyPoint":"生物特征不可撤销，泄露后不能像口令一样重置"},{"id":"第二部分专业题-二、密码前沿技术-单选题-2","no":2,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"在节能环保、安全舒适，以及车联网、自动驾驶、智能交通等方面的推动下， 汽车正在迅速智能化、网联化，车联网网络安全对交通安全、社会安全和国家安 全具有重要影响。关于车联网网络安全，描述错误的是（ ）。","options":[{"key":"A","text":"车内单元的安全能力，受限于设备体积、成本、存储空间和计算能力，需要研 究与其相匹配的轻量级安全解决方案"},{"key":"B","text":"车联网包括移动互联网络和车内工控网络"},{"key":"C","text":"车与车之间的直接连接，尽管距离很近，也必须考虑安全连接问题"},{"key":"D","text":"车联网也是一种互联网，可以采用与目前互联网一样的安全防护技术手段"}],"answer":"D","analysis":"车联网是移动互联网络与车内工控网络融合而成的特殊网络，通信场景、时延约束和安全目标都与传统互联网不同。车内 ECU、网关受体积、成本、存储与算力限制，只能采用轻量级密码与安全方案；车与车近距离直连同样需要身份认证、消息完整性和抗重放保护；把互联网那套防护手段照搬过来，既满足不了实时性要求，也覆盖不了车内总线与车辆控制安全。故 D 的说法错误。","correctReason":"车联网兼具移动互联网与车内工控网络双重属性，安全需求、时延约束和信任模型与互联网差异很大，不能照搬互联网安全防护手段，因此 D 表述错误。","wrongReason":"A：车内单元资源受限，确需研究与其匹配的轻量级安全方案，描述正确；B：车联网包括移动互联网络和车内工控网络，描述正确；C：车与车直连虽距离很近，仍需解决安全连接与认证问题，描述正确。","source":"《车联网网络安全和数据安全标准体系建设指南》（工业和信息化部等，2021年）","keyPoint":"车联网不等于互联网，车内网络资源受限需轻量级安全"},{"id":"第二部分专业题-二、密码前沿技术-单选题-3","no":3,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"量子技术是基于量子力学基本原理发展而来的新一代颠覆性技术。以下关于量 子技术三大核心概念的表述中，正确的是（ ）","options":[{"key":"A","text":"量子技术的三大核心概念是叠加、纠缠和退相干"},{"key":"B","text":"量子技术的三大核心概念是叠加、纠缠和测量"},{"key":"C","text":"量子技术的三大核心概念是测量、退相干和干涉"},{"key":"D","text":"量子技术的三大核心概念是纠缠、干涉和不可克隆"}],"answer":"B","analysis":"量子技术的三大核心概念通常概括为量子叠加、量子纠缠和量子测量：叠加使量子系统能同时承载多条计算路径的信息，纠缠提供经典系统不具备的非经典关联，测量则把量子态读出为经典结果，同时也是扰动量子态的原因。退相干是量子信息向环境耗散的机制，干涉是量子态波动性的表现，不可克隆是量子信息不可复制的定理，它们虽重要，却都不构成“三大核心概念”。故只有 B 的组合正确。","correctReason":"“叠加、纠缠、测量”分别对应量子信息的表示、关联与读出，是公认的量子技术三大核心概念，B 的组合成立。","wrongReason":"A：退相干是量子信息丢失的机制，不属于三大核心概念；C：干涉与退相干都是量子现象，与“测量”搭配组成不了三大核心概念；D：不可克隆是量子信息不可复制的定理，属重要结论而非三大核心概念之一。","source":"量子信息基础理论（量子叠加、量子纠缠、量子测量三要素，通用教材与科普表述）","keyPoint":"量子技术三核心：叠加、纠缠、测量"},{"id":"第二部分专业题-二、密码前沿技术-单选题-4","no":4,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"可信计算（TrustedComputing）是一种通过硬件和软件结合来增强系统安全性 的技术，但它也可能面临多种网络安全威胁。以下哪些是可信计算可能面临的网 络安全威胁？（ ）","options":[{"key":"A","text":"TPM 芯片的物理侧信道攻击"},{"key":"B","text":"恶意软件篡改PCR 值"},{"key":"C","text":"远程证明过程中的中间人攻击"},{"key":"D","text":"DDoS 攻击"}],"answer":"ABC","analysis":"可信计算以 TPM 等硬件信任根、PCR 完整性度量和远程证明为核心机制，其威胁也集中在这三个环节：TPM 芯片可能被功耗、电磁等物理侧信道分析提取密钥；恶意软件（如引导级 rootkit）可能篡改 PCR 值，使度量结果失去可信性；远程证明协议在传输中可能被中间人劫持、重放或降级。DDoS 攻击针对的是网络服务的可用性，属通用网络攻击，与信任根、度量、证明机制没有直接关系，不是可信计算自身面临的典型威胁，故不选。","correctReason":"TPM 物理侧信道攻击、PCR 值被篡改、远程证明遭中间人攻击分别打击信任根、完整性度量和证明协议三个关键环节，均属可信计算面临的真实威胁。","wrongReason":"D：DDoS 攻击针对网络服务可用性，是通用网络层攻击，并非可信计算（TPM、PCR、远程证明）机制所面临的特有威胁。","source":"ISO/IEC 11889（TPM 2.0 系列标准）；国内外可信计算威胁分析通用结论","keyPoint":"可信计算威胁集中于信任根、PCR 度量与远程证明","conflict":"原卷归入单选题，但答案为『ABC』（多选格式），已按原卷答案保留。"},{"id":"第二部分专业题-二、密码前沿技术-单选题-5","no":5,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"量子计算之所以具备显著超越经典计算的算力优势，其核心原因在于（ ）","options":[{"key":"A","text":"量子计算机的时钟频率远高于经典计算机"},{"key":"B","text":"量子比特的叠加态特性使量子系统能够同时表征2 的N 次方个基态的组合状 态"},{"key":"C","text":"量子计算机使用了更先进的半导体制造工艺"},{"key":"D","text":"量子计算机的存储容量是经典计算机的指数倍"}],"answer":"B","analysis":"量子计算的算力优势来自量子比特的叠加与纠缠：N 个量子比特的态空间维数为 2 的 N 次方，可以同时表征 2 的 N 次方个基态的组合（叠加）状态，配合量子算法形成量子并行性，从而在特定问题上获得指数级加速。时钟频率、半导体制造工艺、存储容量都是经典计算机的性能指标，与量子加速的原理无关。故 B 正确。","correctReason":"量子比特的叠加态使 N 个量子比特系统的态空间达到 2 的 N 次方维，可同时表征 2 的 N 次方个基态组合状态，这是量子并行性与加速的根源。","wrongReason":"A：量子优势与时钟频率无关，量子门操作速度甚至常低于经典时钟；C：制造工艺不决定量子加速能力；D：量子优势源于态空间指数增长与量子并行性，而不是“存储容量”指数倍。","source":"量子计算基础理论（叠加态与量子并行性，通用教材表述）","keyPoint":"N 个量子比特可同时表征 2 的 N 次方个基态组合"},{"id":"第二部分专业题-二、密码前沿技术-单选题-6","no":6,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题（连线）","stem":"在物联网领域中，安全威胁和攻击类型多种多样，每种攻击都有其特定的防护 措施。请将左侧的物联网攻击类型与右侧对应的防护措施正确连线： 攻击类型 防护措施","options":[{"key":"A","text":"1—B；2—D；3—C；4—A"},{"key":"B","text":"1—C；2—A；3—B；4—D"},{"key":"C","text":"1—A；2—B；3—D；4—C"},{"key":"D","text":"1—D；2—C；3—A；4—B"}],"answer":"A","analysis":"本题考物联网四类典型攻击与针对性防护手段的一一对应。DDoS 靠海量流量耗尽带宽与连接资源，只能靠流量清洗、限速来抵御；中间人攻击靠截获并篡改通信内容，端到端加密加双向认证可使其无从下手；固件漏洞属于已知缺陷，及时更新固件并做签名校验才能封堵；弱口令爆破拼的是口令空间，强制强口令并配合锁定与多因素最直接。易混点是加密挡不住流量洪泛、更新固件也治不了弱口令，按攻击成因去挑措施即可。","correctReason":"四项防护恰好针对各自攻击的成因：1—B（DDoS 攻击对部署流量清洗系统）、2—D（中间人攻击对启用端到端加密通信）、3—C（固件漏洞利用对定期更新设备固件）、4—A（弱口令爆破对强制使用强口令策略），故选项 A 的配对全部成立。","wrongReason":"B：1—C、2—A、3—B、4—D，把固件更新配给 DDoS、强口令配给中间人、流量清洗配给固件漏洞、加密配给弱口令，四项全错；C：1—A、2—B、3—D、4—C，DDoS 配强口令、中间人配流量清洗、固件漏洞配加密、弱口令配固件更新，同样全部错位；D：1—D、2—C、3—A、4—B，加密对流量洪泛无效、固件更新挡不住中间人、强口令治不了固件漏洞、流量清洗与弱口令爆破无关。","source":"GB/T 37044-2018《信息安全技术 物联网安全参考模型及通用要求》；GB/T 22239-2019《信息安全技术 网络安全等级保护基本要求》物联网安全扩展要求","keyPoint":"DDoS—流量清洗、中间人—加密、固件漏洞—更新固件、弱口令—强口令。","pairs":["1.DDoS 攻击 —— A.强制使用强口令策略","2.中间人攻击 —— B.部署流量清洗系统","3.固件漏洞利用 —— C.定期更新设备固件","4.弱口令爆破 —— D.启用端到端加密通信"]},{"id":"第二部分专业题-二、密码前沿技术-单选题-7","no":7,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"一个量子比特（qubit）与一个经典比特（bit）的根本区别在于（ ）","options":[{"key":"A","text":"量子比特只能处于0 状态"},{"key":"B","text":"量子比特只能处于1 状态"},{"key":"C","text":"量子比特可以同时处于0 和1 的叠加状态"},{"key":"D","text":"量子比特的物理尺寸比经典比特更小"}],"answer":"C","analysis":"经典比特只能取 0 或 1 中的一个确定值；量子比特的状态是 |0> 与 |1> 的复系数线性叠加，测量前可以按一定概率幅同时“含有”0 和 1，测量后才塌缩成其中一个确定结果。因此二者的根本区别在于状态空间与测量行为，而不在于物理尺寸。A、B 只分别描述了 |0>、|1> 一个基态，D 与本质区别无关，故只有 C 正确。","correctReason":"量子比特可以同时处于 0 和 1 的叠加状态，测量时按概率塌缩为 0 或 1，这是它与只能取单一确定值的经典比特的根本区别。","wrongReason":"A：量子比特不只处于 0 态，该说法错误；B：量子比特也不只处于 1 态，0 与 1 只是两个基态；D：物理尺寸与比特本质无关，超导量子比特尺寸反而远大于晶体管。","source":"量子力学与量子信息基础理论（量子叠加态与测量塌缩）","keyPoint":"量子比特可叠加，测量后才塌缩为 0 或 1"},{"id":"第二部分专业题-二、密码前沿技术-单选题-8","no":8,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"在量子力学中，两个纠缠的量子比特之间存在的关联特性，被称为（ ）","options":[{"key":"A","text":"量子隧穿效应"},{"key":"B","text":"波粒二象性"},{"key":"C","text":"“鬼魅般的超距作用”"},{"key":"D","text":"海森堡不确定性原理"}],"answer":"C","analysis":"量子纠缠指两个或多个量子比特之间存在无经典对应的强关联，对其中一个的测量结果会瞬时确定另一个的对应结果，爱因斯坦把这种非经典关联称为“鬼魅般的超距作用”，这正是题干所述纠缠特性的经典表述。量子隧穿描述粒子穿过经典禁区势垒，波粒二象性描述微观客体的波动性与粒子性，不确定性原理描述共轭物理量不能同时精确测定，三者都与纠缠关联无关。故 C 正确。","correctReason":"“鬼魅般的超距作用”是爱因斯坦对量子纠缠非经典关联的著名描述，与题干所指的纠缠关联特性直接对应。","wrongReason":"A：量子隧穿效应讲的是粒子穿透势垒，与纠缠无关；B：波粒二象性讲的是微观客体的双重属性，与纠缠无关；D：海森堡不确定性原理讲共轭量不可同时精确测定，同样与纠缠关联无关。","source":"量子力学基础理论（量子纠缠与 EPR 佯谬，爱因斯坦“鬼魅般的超距作用”表述）","keyPoint":"纠缠关联即爱因斯坦说的“鬼魅般的超距作用”"},{"id":"第二部分专业题-二、密码前沿技术-单选题-9","no":9,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"在可信计算中，可信平台模块（TPM）是一个专用的微控制器，旨在通过提供 硬件级别的安全来增强设备的安全性。下面列出了几个关于TPM 功能的选项， 请根据对TPM 的理解选择最准确描述其核心功能的一项。（ ）","options":[{"key":"A","text":"加密硬盘中的所有数据"},{"key":"B","text":"提供硬件级密钥管理和安全存储"},{"key":"C","text":"阻止网络钓鱼攻击"},{"key":"D","text":"提升系统运行速度"}],"answer":"B","analysis":"TPM 是焊装于主板的专用安全微控制器，核心能力是硬件级密钥生成与层级化管理、密钥和数据的安全存储，以及平台配置寄存器（PCR）度量与远程证明。磁盘全盘加密（如 BitLocker）只是借助 TPM 保管和解封密钥，真正的加解密由 CPU 与操作系统软件完成；TPM 也无法识别钓鱼邮件这类社会工程攻击，更不负责提升系统运算速度。故 B 最准确。","correctReason":"TPM 的本质是以硬件信任根形式提供密钥管理与受保护存储，并支撑平台度量与远程证明，B 准确概括了其核心功能。","wrongReason":"A：磁盘数据加密由操作系统或加密软件执行，TPM 只负责保管解封密钥；C：网络钓鱼属社会工程与邮件安全范畴，TPM 无法阻止；D：TPM 不参与提升系统运行速度。","source":"ISO/IEC 11889（TPM 2.0 系列标准）","keyPoint":"TPM 核心功能是硬件级密钥管理与安全存储"},{"id":"第二部分专业题-二、密码前沿技术-单选题-10","no":10,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"量子密钥分发（QKD）在数据安全保护中的独特优势在于（ ）","options":[{"key":"A","text":"其密钥生成速度比传统方法快得多"},{"key":"B","text":"其安全性建立在物理定律之上而非数学难题的复杂性之上"},{"key":"C","text":"其密钥长度是无限长的"},{"key":"D","text":"其不需要任何密钥管理"}],"answer":"B","analysis":"QKD 的独特之处在于安全性不建立在计算复杂度假设之上，而由量子力学定律保证：未知量子态不可克隆，任何窃听测量都会扰动量子态，通信双方通过误码率升高即可发现。它的密钥生成速率并不比传统密钥派生更快，密钥也不是无限长；同时 QKD 依然需要设备认证、密钥存储与更新等密钥管理环节。故 B 正确。","correctReason":"QKD 的安全性建立在量子不可克隆定理、测量扰动等物理定律之上，而不是大数分解、离散对数等数学难题的计算复杂性。","wrongReason":"A：QKD 成码率通常远低于传统密钥生成速度，速度不是其优势；C：QKD 产出的是有限长度的密钥串，可用密钥量受成码率与误码约束；D：QKD 仍需认证、存储、更新、销毁等密钥管理，并非不需要密钥管理。","source":"量子密钥分发安全性基础（海森堡不确定性原理、量子不可克隆定理、窃听可检测性）","keyPoint":"QKD 靠物理定律保证安全，不靠数学难题"},{"id":"第二部分专业题-二、密码前沿技术-单选题-11","no":11,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"在工控系统网络架构中，典型的分层结构主要基于功能分区和安全需求，而 非传统企业网络的物理拓扑分层。那么，以下哪项是工控系统网络架构典型的分 层结构？（ ）","options":[{"key":"A","text":"核心层、汇聚层、接入层"},{"key":"B","text":"控制网、数据采集网、办公网"},{"key":"C","text":"物理层、数据链路层、应用层"},{"key":"D","text":"服务器层、客户端层、存储层"}],"answer":"B","analysis":"工控系统按功能分区与安全需求划分网络，典型结构是控制网（现场控制与过程监控，承载 PLC、DCS 等实时控制流量）、数据采集网（采集与监控数据汇聚，如 SCADA、OPC 通信）和办公网（企业管理信息网），三区之间依靠工业防火墙、单向隔离等手段做纵向防护。核心层—汇聚层—接入层是园区网的物理拓扑分层，物理层—数据链路层—应用层是协议层次，服务器层—客户端层—存储层是数据中心架构分层，都不符合工控的功能分区思路。故 B 正确。","correctReason":"工控网络按功能分区与安全需求划分，控制网、数据采集网、办公网正是其典型分层结构。","wrongReason":"A：核心层、汇聚层、接入层是传统园区网物理拓扑分层；C：物理层、数据链路层、应用层是网络协议层次划分；D：服务器层、客户端层、存储层是数据中心或云计算架构分层，均非工控网络功能分区。","source":"GB/T 22239-2019《信息安全技术 网络安全等级保护基本要求》工业控制系统安全扩展要求；《工业控制系统信息安全防护指南》（工业和信息化部，2016年）分区分域要求","keyPoint":"工控分层按功能分区：控制网、数据采集网、办公网"},{"id":"第二部分专业题-二、密码前沿技术-单选题-12","no":12,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"无线传感器网络容易受到各种恶意攻击，以下关于其防御手段说法错误的是 （ ）。","options":[{"key":"A","text":"采用干扰区内节点切换频率的方式抵御干扰"},{"key":"B","text":"通过向独立多路径发送验证数据来发现异常节点"},{"key":"C","text":"利用中心节点监视网络中其它所有节点来发现恶意节点"},{"key":"D","text":"利用安全并具有弹性的时间同步协议对抗外部攻击和被俘获节点的影响"}],"answer":"C","analysis":"无线传感器网络节点资源极其受限、部署环境开放且常无人值守，因此防御强调分布式、轻量级与容侵能力：可用干扰区节点切换频率抗干扰，用独立多路径发送验证数据交叉校验以发现异常节点，用安全且具弹性的时间同步协议抵御外部攻击和被俘获节点影响。WSN 通常是无中心的自组织网络，由单个中心节点监视全网既不可扩展、存在单点失效，中心节点一旦被俘获更会导致全网失控，因此 C 的说法错误。","correctReason":"WSN 多为无中心的自组织网络，集中式“中心节点监视全网”不可扩展且有单点失效与被俘获风险，不是可行防御手段，故 C 为错误说法。","wrongReason":"A：切换频率（跳频）是抵御干扰的有效手段，说法正确；B：向独立多路径发送验证数据可比对发现异常节点，说法正确；D：安全且具弹性的时间同步协议确能对抗外部攻击与被俘获节点影响，说法正确。","source":"GB/T 22239-2019《信息安全技术 网络安全等级保护基本要求》物联网安全扩展要求；无线传感器网络安全防御通用技术","keyPoint":"WSN 无中心、资源受限，防御须分布式轻量化"},{"id":"第二部分专业题-二、密码前沿技术-单选题-13","no":13,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"关于N 个量子比特的信息承载能力，以下说法正确的是（ ）","options":[{"key":"A","text":"N 个量子比特可以同时表征N 种状态"},{"key":"B","text":"N 个量子比特可以同时表征2N 种状态"},{"key":"C","text":"N 个量子比特可以同时表征2 的N 次方种基态组合状态"},{"key":"D","text":"N 个量子比特可以同时表征N 的2 次方种状态"}],"answer":"C","analysis":"N 个量子比特构成的复合系统，其态空间（希尔伯特空间）维数为 2 的 N 次方，即可以同时表征从 |00…0> 到 |11…1> 共 2 的 N 次方个基态的组合状态，这正是量子态空间随比特数指数增长的原因。N、2N、N 的 2 次方分别只是线性与多项式增长，与量子态空间的指数规律不符。故 C 正确。","correctReason":"N 个量子比特的态空间维数为 2 的 N 次方，可同时表征 2 的 N 次方种基态组合状态。","wrongReason":"A：N 种状态只是线性增长，远小于真实态空间；B：2N 同样是线性增长，不正确；D：N 的 2 次方是多项式增长，不符合量子态空间指数增长的规律。","source":"量子计算基础理论（量子态空间维数 2 的 N 次方与量子并行性）","keyPoint":"N 个量子比特的态空间维数等于 2 的 N 次方"},{"id":"第二部分专业题-二、密码前沿技术-单选题-14","no":14,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"量子密钥分发（QKD）在实际部署中通常采用的方式是（ ）","options":[{"key":"A","text":"完全替代所有现有通信网络"},{"key":"B","text":"以“外挂”的方式叠加在现有通信网络上：先用量子信道生成密钥，再用密 钥对信息加密传输"},{"key":"C","text":"仅在实验室环境中使用"},{"key":"D","text":"只用于无线通信"}],"answer":"B","analysis":"目前 QKD 采取“外挂式”增量部署：在既有光纤链路上叠加量子信道（多采用共纤波分复用）协商出对称密钥，业务密文仍走原有经典信道传输，即“量子信道送密钥、经典信道传数据”。它不替代现有通信网络，已在城域网、干线网等工程化应用（如京沪干线），也并非只限实验室；其信道主要依托光纤，自由空间为补充，并非只用于无线通信。故 B 正确。","correctReason":"QKD 以“外挂”方式叠加在现有通信网络上：先用量子信道生成密钥，再用密钥对信息加密传输，B 准确描述了这一实际部署方式。","wrongReason":"A：QKD 只解决密钥分发，不会也不可能完全替代现有通信网络；C：QKD 已实现城域、干线等工程化部署，并非仅限实验室；D：QKD 主要依托光纤信道，不是只用于无线通信。","source":"ITU-T Y.3800 系列标准（支持量子密钥分发的网络总体架构）；我国量子保密通信干线工程实践","keyPoint":"QKD 属外挂式叠加：量子信道分密钥、经典信道传数据"},{"id":"第二部分专业题-二、密码前沿技术-单选题-15","no":15,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"（ ）不仅是实现网络通信的主要设备之一，而且也是关系全网安全的设备 之一，它的安全性、健壮性将直接影响网络的可用性。","options":[{"key":"A","text":"网闸"},{"key":"B","text":"日志审计系统"},{"key":"C","text":"路由器"},{"key":"D","text":"入侵防御系统"}],"answer":"C","analysis":"路由器是网络互连的核心设备，承担路由转发、边界接入等关键职责，一旦被攻陷或配置失当，可能引发路由劫持、流量中断等大范围故障，直接影响全网可用性，因此其安全性与健壮性是网络安全防护的重点。网闸、日志审计系统、入侵防御系统都属于安全专用设备，分别负责隔离交换、行为审计和攻击检测阻断，并不是实现网络通信的主要设备。故 C 正确。","correctReason":"路由器既是实现网络通信互连的主要设备，又是决定全网可达性的关键节点，其安全性、健壮性直接影响网络可用性。","wrongReason":"A：网闸用于不同安全域之间的隔离与受控数据交换，属安全设备；B：日志审计系统负责日志记录与行为审计，不承担通信转发；D：入侵防御系统用于检测与阻断攻击，也不是主要通信设备。","source":"GB/T 22239-2019《信息安全技术 网络安全等级保护基本要求》网络架构与安全区域边界要求","keyPoint":"路由器是通信枢纽，也是全网可用性的关键节点"},{"id":"第二部分专业题-二、密码前沿技术-单选题-16","no":16,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"量子世界中存在一条“铁律”：未知的量子态无法被精准复制。这一特性被 称为（ ）","options":[{"key":"A","text":"量子叠加原理"},{"key":"B","text":"量子不可克隆定理"},{"key":"C","text":"量子纠缠定理"},{"key":"D","text":"量子测不准原理"}],"answer":"B","analysis":"量子不可克隆定理指出，不存在能够完美复制任意未知量子态的物理过程，这是量子力学线性性质与幺正演化约束的必然结果，也是量子密码学的基石之一：窃听者无法复制信道中的量子态而不留痕迹。量子叠加原理讲的是态的线性叠加，纠缠讲的是多体量子间的非经典关联，测不准原理讲的是共轭量不能同时精确测定，三者都没有“未知态不可复制”的含义。故 B 正确。","correctReason":"“未知的量子态无法被精准复制”这条铁律就是量子不可克隆定理（no-cloning theorem）的标准表述。","wrongReason":"A：量子叠加原理描述态的线性叠加，与不可复制无关；C：量子纠缠描述多量子比特间的非经典关联，不是不可克隆；D：量子测不准原理描述共轭物理量不可同时精确测定，也不等同于不可克隆。","source":"量子不可克隆定理（Wootters、Zurek 与 Dieks 于 1982 年提出）","keyPoint":"未知量子态不可精准复制即不可克隆定理"},{"id":"第二部分专业题-二、密码前沿技术-单选题-17","no":17,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"量子密钥分发（QKD）之所以能够实现安全通信，其核心物理基础在于（ ）","options":[{"key":"A","text":"量子比特的计算速度极快"},{"key":"B","text":"任何窃听或探测行为都会扰动量子态，使通信双方立刻察觉"},{"key":"C","text":"量子密钥的长度远超传统密钥"},{"key":"D","text":"量子通信不需要任何物理传输介质"}],"answer":"B","analysis":"QKD 的安全性来自“窃听必留痕”：依据不确定性原理和不可克隆定理，任何对量子信道的截获测量都会改变量子态，使双方测得的误码率升高，从而在密钥协商与误码估计阶段暴露窃听并丢弃该段密钥。它与量子比特运算速度、密钥长度无关，光子的传输仍然依赖光纤或自由空间等物理介质。故 B 正确。","correctReason":"任何窃听或探测行为都会扰动量子态，使通信双方通过误码检测立刻察觉，这正是 QKD 安全通信的核心物理基础。","wrongReason":"A：QKD 的价值在于密钥分发的安全性，与量子比特计算速度无关；C：密钥长度不是安全性来源，QKD 输出的是有限长度密钥；D：QKD 仍需要光纤或自由空间等物理传输介质。","source":"量子密钥分发物理安全性基础（BB84 协议的窃听可检测性、不确定性原理与不可克隆定理）","keyPoint":"QKD 安全靠“窃听必被察觉”"},{"id":"第二部分专业题-二、密码前沿技术-单选题-18","no":18,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"下列对于DMZ 区的说法错误的是（ ）。","options":[{"key":"A","text":"它是网络安全防护的一个“非军事区”"},{"key":"B","text":"它是对“深度防御”概念的一种实现方案"},{"key":"C","text":"它是一种比较常用的网络安全域划分方式"},{"key":"D","text":"它是互联网服务运行的必备条件"}],"answer":"D","analysis":"DMZ（隔离区）是在内网与外网之间划出的缓冲地带，把对外提供服务的服务器置于其中，实现“深度防御”和网络安全域划分，是常用的边界安全设计。但它只是可选架构：内部专网应用、不对外开放的服务或采用其他隔离措施的系统同样能正常运行，因此并非互联网服务运行的必备条件。A、B、C 的表述都成立，D 不成立。","correctReason":"DMZ 是可选的边界隔离架构，而非互联网服务运行的必要条件，许多系统不设 DMZ 也能正常提供服务，故 D 表述错误。","wrongReason":"A：DMZ 即“非军事区”，是网络安全防护的缓冲区，说法正确；B：它通过在内外网之间增加缓冲层体现深度防御思想，说法正确；C：它是比较常用的网络安全域划分方式，说法正确。","source":"GB/T 22239-2019《信息安全技术 网络安全等级保护基本要求》安全区域边界要求；网络安全域划分通用实践","keyPoint":"DMZ 是可选的边界缓冲区，不是上网服务的必备条件"},{"id":"第二部分专业题-二、密码前沿技术-单选题-19","no":19,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"NIST 发布的抗量子密码标准FIPS203（ML-KEM）和FIPS204（ML-DSA） 分别用于（ ）","options":[{"key":"A","text":"两者都是数字签名标准"},{"key":"B","text":"两者都是密钥封装标准"},{"key":"C","text":"ML-KEM 用于密钥封装，ML-DSA 用于数字签名"},{"key":"D","text":"ML-KEM 用于数字签名，ML-DSA 用于密钥封装"}],"answer":"C","analysis":"NIST 后量子密码标准中，FIPS 203 是 ML-KEM（源自 CRYSTALS-Kyber，基于模格困难问题的密钥封装机制），FIPS 204 是 ML-DSA（源自 CRYSTALS-Dilithium，基于格的数字签名算法），另有 FIPS 205 为 SLH-DSA（基于 SPHINCS+ 的无状态哈希签名）。二者用途不同：一个解决密钥协商与封装，一个解决身份认证与签名，不能互换。故 C 正确。","correctReason":"ML-KEM 是密钥封装机制（对应 FIPS 203），ML-DSA 是数字签名算法（对应 FIPS 204），C 的对应关系正确。","wrongReason":"A：ML-KEM 不是签名标准，两者并非都是数字签名；B：ML-DSA 不是密钥封装标准，两者并非都是密钥封装；D：把 ML-KEM 与 ML-DSA 的用途完全对调，正好说反。","source":"NIST FIPS 203（ML-KEM）、FIPS 204（ML-DSA）、FIPS 205（SLH-DSA）","keyPoint":"ML-KEM 管密钥封装，ML-DSA 管数字签名"},{"id":"第二部分专业题-二、密码前沿技术-单选题-20","no":20,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"我国在抗量子密码领域的重要进展包括（ ）","options":[{"key":"A","text":"已完成全部抗量子密码标准的制定并开始强制实施"},{"key":"B","text":"基于国产抗量子芯片完成了AI 多智能体可信通信试验"},{"key":"C","text":"尚未开展抗量子密码相关研究工作"},{"key":"D","text":"只依赖国际标准，不进行自主研发"}],"answer":"B","analysis":"我国抗量子密码坚持自主研究与国际标准跟进并行，相关算法征集、标准化和工程验证仍在推进，既没有“完成全部标准并强制实施”，也绝非未开展研究或只依赖国际标准。公开报道显示，中国电信研究院联合清华大学、无锡沐创等单位成功完成基于国产抗量子芯片的 AI 多智能体可信通信试验，首次把国产抗量子芯片作为硬件信任锚，实现抗量子数字签名背书与知识证明。故 B 正确。","correctReason":"该试验以国产抗量子芯片作为硬件信任锚，实现了 AI 多智能体跨域可信通信，是我国抗量子密码从研究走向落地应用的重要进展。","wrongReason":"A：我国抗量子密码标准化工作仍在推进，尚未完成全部标准并强制实施；C：我国已开展大量抗量子密码研究与试验，并非尚未开展；D：我国坚持自主创新并同步跟踪国际标准，并非只依赖国际标准。","source":"中国电信研究院联合清华大学、无锡沐创集成电路完成“基于国产抗量子芯片的 AI 多智能体可信通信试验”的公开报道（2026年）","keyPoint":"国产抗量子芯片首用于 AI 多智能体可信通信试验"},{"id":"第二部分专业题-二、密码前沿技术-单选题-21","no":21,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"信息安全风险评估是一个技术过程，更是一种战略性的管理活动，能够帮助 组织识别和应对潜在的安全威胁，优化资源配置，提升业务连续性和弹性。其中， 信息安全风险评估的核心环节是（ ）。","options":[{"key":"A","text":"资产识别"},{"key":"B","text":"威胁识别"},{"key":"C","text":"脆弱性识别"},{"key":"D","text":"已有安全措施识别"}],"answer":"A","analysis":"信息安全风险评估围绕资产、威胁、脆弱性和已有安全措施等要素展开，其逻辑起点与核心是资产识别：只有先明确要保护的资产及其价值，威胁与脆弱性分析才有作用对象，风险值才能计算，安全措施才有针对性。威胁识别、脆弱性识别和已有安全措施识别都是必要环节，但都依附于资产并为其服务，因而不是核心环节。故 A 正确。","correctReason":"风险评估以资产为核心展开，资产识别确定了保护对象与价值，是威胁、脆弱性分析和风险计算的前提与核心环节。","wrongReason":"B：威胁识别须以资产为对象，脱离资产无法评估；C：脆弱性识别同样依附于资产与威胁的对应关系；D：已有安全措施识别用于修正风险值，也不是核心环节。","source":"GB/T 20984-2022《信息安全技术 信息安全风险评估方法》","keyPoint":"风险评估的核心是资产识别，先明确保护对象"},{"id":"第二部分专业题-二、密码前沿技术-单选题-22","no":22,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"当前量子科技的落地应用主要聚焦三大核心赛道，分别是（ ）","options":[{"key":"A","text":"量子计算、量子通信与量子精密测量"},{"key":"B","text":"量子计算、量子存储与量子传感"},{"key":"C","text":"量子通信、量子雷达与量子成像"},{"key":"D","text":"量子精密测量、量子材料与量子生物"}],"answer":"A","analysis":"当前量子科技落地应用主要聚焦三大核心赛道：量子计算追求特定问题上的指数级加速，量子通信（QKD 与量子保密通信网络）解决密钥分发与信息安全，量子精密测量面向时间、重力、磁场等的超高精度传感。量子存储是量子通信与计算的支撑技术，量子传感属精密测量的分支，量子雷达、量子成像、量子材料、量子生物则多为上述方向的具体应用或交叉方向，不构成并列的三大赛道。故 A 正确。","correctReason":"量子计算、量子通信、量子精密测量是公认的量子科技三大核心应用赛道，与产业布局的通行表述一致。","wrongReason":"B：量子存储是支撑技术，传感属精密测量分支，不能与三大赛道并列；C：量子雷达与量子成像属量子精密测量/传感的具体应用形式；D：量子材料、量子生物属交叉应用方向，也不是三大核心赛道。","source":"量子科技产业通用分类（量子计算、量子通信、量子精密测量三大方向）","keyPoint":"量子科技三赛道：计算、通信、精密测量"},{"id":"第二部分专业题-二、密码前沿技术-单选题-23","no":23,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"深度流检测技术是一种主要通过判断网络流是否异常来进行安全防护的网络 安全技术，深度流检测系统通常不包括（ ）。","options":[{"key":"A","text":"流特征提取单元"},{"key":"B","text":"流特征选择单元"},{"key":"C","text":"分类器"},{"key":"D","text":"响应单元"}],"answer":"D","analysis":"深度流检测（DFI）以网络流的统计特征为依据判断流量是否异常，典型流程是先提取流时长、包长分布、包间隔等特征，再通过特征选择降维提纯，最后送入分类器完成流量分类与异常判定。告警、阻断、联动处置属安全管理平台或入侵防御系统的职责，并不是 DFI 系统自身的组成单元。故“不包括”的是 D。","correctReason":"深度流检测系统的典型组成是流特征提取单元、流特征选择单元和分类器，响应处置由其他安全设备或管理平台承担，故不包括响应单元。","wrongReason":"A：流特征提取单元是 DFI 的入口环节，属系统组成；B：流特征选择单元用于降维与提纯特征，属系统组成；C：分类器是判定流量是否异常的核心部件，属系统组成。","source":"网络安全检测技术通用原理（深度流检测的流特征提取—特征选择—分类判定流程）","keyPoint":"DFI 三件套：特征提取、特征选择、分类器"},{"id":"第二部分专业题-二、密码前沿技术-单选题-24","no":24,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"以下哪项不属于五大抗量子密码技术路线？（ ）","options":[{"key":"A","text":"基于格的密码"},{"key":"B","text":"基于编码的密码"},{"key":"C","text":"基于量子密钥分发的密码"},{"key":"D","text":"基于多变量的密码"}],"answer":"C","analysis":"抗量子密码（后量子密码）指可在经典计算机上运行、又能抵抗量子算法攻击的公钥密码，其五大技术路线通常概括为基于格、基于编码、基于多变量、基于杂凑（哈希签名）和基于同源。量子密钥分发依靠量子力学定律保证密钥分发安全，属于量子通信/物理层技术，并不属于基于数学难题的抗量子密码路线。故不属于五大路线的是 C。","correctReason":"五大抗量子密码技术路线是格、编码、多变量、杂凑签名和同源；QKD 属量子通信技术，不是抗量子密码的数学路线。","wrongReason":"A：基于格的密码（如 ML-KEM、ML-DSA）是主流抗量子路线；B：基于编码的密码（如 McEliece、HQC）属五大路线之一；D：基于多变量的密码同样属五大路线之一。","source":"NIST 后量子密码标准化方向与抗量子密码技术路线通用分类（格、编码、多变量、杂凑签名、同源）","keyPoint":"PQC 五路线：格、编码、多变量、杂凑、同源"},{"id":"第二部分专业题-二、密码前沿技术-单选题-25","no":25,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"日常安全运维管理中，服务器管理员会使用（ ）来安全连接远程服务器。","options":[{"key":"A","text":"Telnet"},{"key":"B","text":"安全文件传输协议（SFTP）"},{"key":"C","text":"安全拷贝（SCP）"},{"key":"D","text":"安全外壳（SSH）"}],"answer":"D","analysis":"安全连接远程服务器依靠 SSH 协议，它在不可信网络上建立加密会话通道，提供服务端与客户端双向认证以及数据完整性保护。Telnet 以明文传输账号口令和命令，生产环境早已禁用；SFTP 与 SCP 虽然也是安全协议（且都运行在 SSH 之上），但定位分别是安全文件传输与安全文件拷贝，不是远程登录连接本身。故 D 最符合题意。","correctReason":"SSH（安全外壳）正是为远程登录和不可信网络上的安全通信设计的协议，管理员用它安全连接并管理远程服务器。","wrongReason":"A：Telnet 明文传输账号口令与数据，不安全；B：SFTP 是运行在 SSH 之上的安全文件传输协议，用于传文件而非远程登录；C：SCP 同样基于 SSH，用于安全拷贝文件，不是远程连接登录方式。","source":"RFC 4251 至 RFC 4254（SSH 协议体系：体系结构、认证、传输层与连接层）","keyPoint":"远程安全登录用 SSH，Telnet 明文不可用"},{"id":"第二部分专业题-二、密码前沿技术-单选题-26","no":26,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"下列关于量子叠加态的表述，正确的是（ ）","options":[{"key":"A","text":"叠加态是指量子比特处于0 和1 之间的某个确定中间值"},{"key":"B","text":"叠加态是指量子比特在被观测前可以同时具有0 和1 的可能性"},{"key":"C","text":"叠加态只存在于理论推导中，尚未被实验证实"},{"key":"D","text":"叠加态一旦形成就无法改变"}],"answer":"B","analysis":"量子叠加态是指量子比特在未被测量时处于 |0> 与 |1> 的线性叠加，具有两种结果的概率幅，测量后才以一定概率塌缩为 0 或 1。它不是 0 与 1 之间的某个确定中间值；也并非只停留在理论推导，双缝干涉、量子比特相干振荡等实验已充分证实；叠加态既可被量子门操作改变，也会因退相干而失效。故 B 正确。","correctReason":"叠加态描述的是被观测前量子比特同时具有 0 和 1 的可能性（概率幅），观测后塌缩为确定结果，B 表述准确。","wrongReason":"A：叠加态不是 0 与 1 之间的确定中间值，测量结果只能是 0 或 1；C：叠加态已被大量实验证实，不是纯理论推导；D：叠加态可被量子门改变，也会因退相干被破坏，并非一旦形成就无法改变。","source":"量子力学基础理论（叠加态、测量塌缩与退相干）","keyPoint":"叠加态：观测前同时含有 0 和 1 的可能"},{"id":"第二部分专业题-二、密码前沿技术-单选题-27","no":27,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"我国自主研发的光量子计算原型机“九章四号”在执行高斯玻色取样任务时， 生成一个样本仅需25 微秒。该原型机可精准操纵的光子数量为（ ）","options":[{"key":"A","text":"100 个"},{"key":"B","text":"1000 个"},{"key":"C","text":"10000 个"},{"key":"D","text":"100000 个"}],"answer":"C","analysis":"本题考“九章四号”光量子计算原型机的规模指标。该原型机采用 1024 个量子压缩态输入、8176 模式的时空混合编码架构，执行高斯玻色取样生成一个样本仅需 25 微秒，比全球最快超算快约 10 的 54 次方倍，光子操控规模较“九章三号”的 255 个实现数量级跃升。四个选项中 A、B 明显偏小，D 远超实际能力，按官方答案取 C（10000 个，即万级规模）。（该题答案以官方为准）","correctReason":"按官方答案，“九章四号”可精准操纵的光子数量为 10000 个，代表其规模已达万级，远高于“九章三号”的 255 个光子。","wrongReason":"A：100 个比“九章二号”的 113 个还少，明显不符；B：1000 个低于该原型机的规模量级；D：100000 个（十万级）远超公开报道的操控能力。","source":"新华社、央视关于“九章四号”的公开报道（2026年5月）：1024 个量子压缩态输入、8176 模式、首次操纵和探测高达 3050 个光子、高斯玻色取样 25 微秒、比最快超算快约 10 的 54 次方倍","keyPoint":"“九章四号”光子规模达万级，远超“九章三号”255 个"},{"id":"第二部分专业题-二、密码前沿技术-单选题-28","no":28,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"量子计算在处理某些特定类型问题时展现出远超经典计算机的能力，但这种 加速效应（ ）","options":[{"key":"A","text":"对所有类型的问题都普遍适用"},{"key":"B","text":"只对特定类型的问题有效"},{"key":"C","text":"只对密码破解类问题有效"},{"key":"D","text":"只对人工智能训练有效"}],"answer":"B","analysis":"量子加速并非普适：Shor 算法只对整数分解、离散对数这类具有代数结构的问题有效，Grover 算法对无序搜索只给出平方级加速，而对大量一般问题，量子计算机并不优于经典计算机，还受退相干、门保真度与纠错开销的制约。因此量子优势是“特定问题、特定算法”下的加速，不是万能的。故 B 正确。","correctReason":"量子加速依赖具体算法与问题结构（Shor 针对分解与离散对数、Grover 提供平方加速），因此只对特定类型问题有效。","wrongReason":"A：量子加速不是对所有问题普遍适用；C：并非只对密码破解有效，量子模拟、组合优化等也是重要应用方向；D：量子加速也不限于人工智能训练。","source":"量子算法理论（Shor 算法、Grover 算法的适用范围与加速阶数）","keyPoint":"量子加速只对特定问题有效，不是万能加速"},{"id":"第二部分专业题-二、密码前沿技术-单选题-29","no":29,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"网络关键设备和网络安全专用产品应当按照相关国家标准的强制性要求，由 具备资格的机构（ ）或者安全检测符合要求后，方可销售或者提供。","options":[{"key":"A","text":"鉴定产品功能"},{"key":"B","text":"安全认证合格"},{"key":"C","text":"测试产品性能"},{"key":"D","text":"认证产品质量合格"}],"answer":"B","analysis":"题干表述出自《网络安全法》对网络关键设备和网络安全专用产品的销售前要求：按相关国家标准的强制性要求，由具备资格的机构“安全认证合格”或者“安全检测符合要求”后，方可销售或者提供，安全认证与安全检测二者满足其一即可。选项中“鉴定产品功能”“测试产品性能”“认证产品质量合格”都不是法定表述，也不能替代法定的安全认证或安全检测。故 B 正确。","correctReason":"《网络安全法》第二十三条明确要求，网络关键设备和网络安全专用产品须经具备资格的机构安全认证合格或者安全检测符合要求后，方可销售或者提供。","wrongReason":"A：鉴定产品功能不是法定要求，功能鉴定也不等于安全认证；C：测试产品性能属性能评价，与安全认证、安全检测不同；D：认证产品质量合格不是法条表述，也与网络安全专用产品的安全认证要求不一致。","source":"《中华人民共和国网络安全法》第二十三条","keyPoint":"网络关键设备销售前须安全认证合格或安全检测符合要求"},{"id":"第二部分专业题-二、密码前沿技术-单选题-30","no":30,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"后量子密码迁移被Gartner 列为2026 年六大网络安全趋势之一，其核心要求 是（ ）","options":[{"key":"A","text":"在量子计算机出现后再开始迁移"},{"key":"B","text":"加速识别、管理并替换传统加密体系，优先构建密码敏捷性"},{"key":"C","text":"只对金融行业进行密码迁移"},{"key":"D","text":"一次性完成所有系统的密码替换"}],"answer":"B","analysis":"Gartner 把“后量子密码学进入实施阶段”列为 2026 年重要网络安全趋势，判断量子计算突破可能在 2030 年前使现行非对称加密体系失效，并强调“现在窃取、未来解密”带来的数据泄露与合规风险，因此要求企业立即启动迁移：在确保密码敏捷性的前提下，系统性地识别、管理和替换传统加密方案。等量子计算机出现再迁移、只迁移金融行业、一次性替换所有系统，都不符合现实可行的迁移策略。故 B 正确。","correctReason":"该趋势的核心要求就是加速识别、管理并替换传统加密体系，并优先构建密码敏捷性，以便在算法更替时快速切换。","wrongReason":"A：迁移必须在量子威胁成为现实之前启动，否则已泄露数据无法挽回；C：迁移覆盖各行业关键系统，并非只针对金融行业；D：迁移是分阶段、分优先级的长期工程，不可能一次性完成。","source":"Gartner《2026年六大网络安全趋势》之“趋势三：后量子密码学进入实施阶段”","keyPoint":"PQC 迁移：早启动、可敏捷、分级替换"},{"id":"第二部分专业题-二、密码前沿技术-单选题-31","no":31,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"规范的实施流程和文档管理，是信息安全风险评估能否取得成果的重要基础， 按照规范的风险评估实施流程，下面哪个文档应当是风险要素识别阶段的输出成 果？（ ）","options":[{"key":"A","text":"《风险评估方案》"},{"key":"B","text":"《需要保护的资产清单》"},{"key":"C","text":"《风险计算报告》"},{"key":"D","text":"《风险程度等级列表》"}],"answer":"B","analysis":"按规范的风险评估实施流程，评估准备阶段产出《风险评估方案》与评估计划；风险要素识别阶段通过资产、威胁、脆弱性识别，产出资产清单、威胁列表和脆弱性列表；风险分析（计算）阶段再结合已有安全措施计算风险，产出《风险计算报告》和《风险程度等级列表》。因此风险要素识别阶段的输出成果是《需要保护的资产清单》，其余三项分属准备阶段和分析阶段。故 B 正确。","correctReason":"风险要素识别阶段的任务是识别资产、威胁与脆弱性，其直接输出成果即为《需要保护的资产清单》（及相关威胁、脆弱性列表）。","wrongReason":"A：《风险评估方案》是评估准备阶段的输出成果；C：《风险计算报告》是风险分析（计算）阶段的输出成果；D：《风险程度等级列表》同样属于风险分析阶段的输出成果。","source":"GB/T 20984-2022《信息安全技术 信息安全风险评估方法》","keyPoint":"要素识别产出资产清单，风险分析产出风险计算报告"},{"id":"第二部分专业题-二、密码前沿技术-单选题-32","no":32,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"在软件保障成熟度模型（SAMM） 中，规定了软件开发过程中的核心业务功 能，下列哪个选项不属于核心业务功能？（ ）","options":[{"key":"A","text":"治理，主要是管理软件开发的过程和活动"},{"key":"B","text":"构造，主要是在开发项目中确定目标并开发软件的过程与活动"},{"key":"C","text":"验证，主要是测试和验证软件的过程和活动"},{"key":"D","text":"购置，主要是购买第三方商业软件或者采用开源组件的相关管理过程与活动"}],"answer":"D","analysis":"SAMM 是 OWASP 提出的软件保障成熟度模型，用治理、设计、构造、验证、运营五大业务功能覆盖软件全生命周期，每个功能下设若干安全实践并按成熟度分级打分。购置指的是采购第三方商业软件或开源组件的管理活动，SAMM 并未把它单列为一项核心业务功能。第三方组件带来的供应链风险，在 SAMM 中归入治理、构造等实践里考虑。A、B、C 三项分别对应治理、构造、验证，都在五大核心业务功能之内。","correctReason":"SAMM 的五大核心业务功能是治理、设计、构造、验证、运营，购置（购买第三方软件或采用开源组件的管理）不在其列，故选 D。","wrongReason":"A：治理即管理软件开发的过程和活动，属 SAMM 核心业务功能；B：构造即在开发项目中确定目标并开发软件，属核心业务功能；C：验证即测试和验证软件的过程与活动，属核心业务功能。","source":"OWASP《Software Assurance Maturity Model (SAMM)》v2 业务功能（Business Functions）划分","keyPoint":"SAMM 五大业务功能：治理、设计、构造、验证、运营"},{"id":"第二部分专业题-二、密码前沿技术-单选题-33","no":33,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"关于“加密敏捷性”（CryptoAgility）的概念，以下理解正确的是（ ）","options":[{"key":"A","text":"指加密算法的运行速度足够快"},{"key":"B","text":"指系统架构具备快速替换和切换加密算法的能力"},{"key":"C","text":"指加密密钥可以随时更换"},{"key":"D","text":"指加密算法可以自我进化"}],"answer":"B","analysis":"加密敏捷性指把密码算法、协议、密钥长度等做成可插拔、可配置的模块，使系统在算法被攻破或标准更新时能低成本快速替换、平滑迁移，而不必推翻重建。关键在架构层面的解耦：统一的密码服务接口、算法标识与协商机制、证书与密钥的可更新能力。A 讲的是算法运算速度，属性能指标；C 只说密钥可更换，仅涉及密钥管理的一小部分；D 所谓算法自我进化并无此概念。","correctReason":"加密敏捷性强调的是系统架构具备快速替换、切换加密算法（含协议与参数）的能力，故选 B。","wrongReason":"A：运行速度快慢是算法性能指标，与“敏捷”无关；C：随时更换密钥属常规密钥管理，范围远小于算法与协议的可替换能力；D：算法不会自我进化，这不是密码学概念。","source":"NIST NCCoE《Considerations for Achieving Crypto Agility》及密码敏捷性通行定义","keyPoint":"加密敏捷＝算法与协议可插拔替换，不是速度也不是换密钥"},{"id":"第二部分专业题-二、密码前沿技术-单选题-34","no":34,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"下面有关软件安全问题的描述中，哪项是由于软件设计缺陷引起的（ ）。","options":[{"key":"A","text":"设计了三层Web 架构，但是软件存在SQL 注入漏洞，导致被黑客攻击后能直 接访问数据库"},{"key":"B","text":"使用C 语言开发时，采用了一些存在安全问题的字符串处理函数，导致存在缓 冲区溢出漏洞"},{"key":"C","text":"设计了缓存用户隐私数据机制以加快系统处理性能，导致软件在发布运行后， 被黑客攻击获取用户隐私数据"},{"key":"D","text":"使用了符合要求的密码算法，但在使用算法接口时，没有按照要求生成密钥， 导致黑客攻击后能破解并得到明文数据"}],"answer":"C","analysis":"本题要区分设计缺陷与编码（实现）缺陷。C 是在架构设计阶段主动设计了缓存用户隐私数据的机制，却未同步设计加密、脱敏与访问控制措施，属先天设计决策不当。A 的 SQL 注入是编码时未做参数化查询和输入校验，B 的缓冲区溢出源于选用了不安全的字符串处理函数，D 是未按算法接口要求生成密钥，三者都发生在编码实现阶段，属实现缺陷而非设计缺陷。","correctReason":"缓存用户隐私数据是设计阶段做出的架构决策，配套防护缺失导致隐私泄露，属设计缺陷，故选 C。","wrongReason":"A：SQL 注入源于编码时未做参数化查询和输入校验，属实现缺陷；B：使用存在安全问题的字符串处理函数导致缓冲区溢出，属编码实现缺陷；D：密码算法接口调用与密钥生成不合规，同属实现/使用缺陷。","source":"OWASP SAMM 安全设计（Design）与安全实现（Implementation）实践划分；GB/T 38674-2020《信息安全技术 应用软件安全编程指南》","keyPoint":"设计阶段定架构决策＝设计缺陷；写代码引入＝实现缺陷"},{"id":"第二部分专业题-二、密码前沿技术-单选题-35","no":35,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"某集团公司根据业务需求，在各地分支机构部署前置机，为了保证安全，集 团总部要求前置机开放日志共享，由总部 服务器采集进行集中分析，在运行过 程中发现攻击者也可通过共享从前置机种提取日志，从而导致部分敏感信息泄 露，根据降低攻击面的原则，应采取以下哪项处理措施（ ）。","options":[{"key":"A","text":"由于共享导致了安全问题，应直接关闭日志共享，禁止总部提取日志进行分析"},{"key":"B","text":"为配合总部的安全策略，会带来一定安全问题，但不影响系统使用，因此接受 此风险"},{"key":"C","text":"日志的存在就是安全风险，最好的办法就是取消日志，通过设置前置机不记录 日志"},{"key":"D","text":"只允许特定IP 地址从前置机提取日志，对日志共享设置访问密码且限定访问 的时间"}],"answer":"D","analysis":"降低攻击面的思路是保留必要功能、把暴露的入口与权限收敛到最小。日志集中分析是总部安全运营的必要能力，不能一关了之；正确做法是给共享通道加约束：按源 IP 白名单限定提取者、要求身份认证（访问密码）、限定可访问的时间窗口，使攻击者能利用的面显著收窄。A、C 因噎废食，牺牲审计能力甚至干脆不留日志；B 属消极接受风险，并未做任何处置。","correctReason":"以源 IP 白名单加访问认证、时间限制来约束日志共享通道，既保留集中分析能力又把攻击面收到最小，故选 D。","wrongReason":"A：彻底关闭日志共享会让总部失去集中审计与入侵发现能力，属过度处置；B：明知敏感信息可能泄露仍选择接受，是风险接受而非降低风险；C：不记录日志将使审计与追溯失去依据，反而放大风险。","source":"GB/T 20984-2022《信息安全技术 信息安全风险评估方法》风险处置要求；GB/T 22239-2019《信息安全技术 网络安全等级保护基本要求》安全审计条款","keyPoint":"降低攻击面＝保留功能、收敛入口（白名单＋认证＋限时）"},{"id":"第二部分专业题-二、密码前沿技术-单选题-36","no":36,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"对抗量子计算威胁，保障信息安全的当前主流可行技术路线是（ ）","options":[{"key":"A","text":"只依赖量子密钥分发（QKD）"},{"key":"B","text":"只增加传统加密算法的密钥长度"},{"key":"C","text":"部署抗量子密码（PQC）"},{"key":"D","text":"放弃所有加密，改用物理隔离"}],"answer":"C","analysis":"PQC 是能在现有经典计算机与网络设施上运行的抗量子算法（格、编码、哈希、多变量、同源等），可通过软件升级并与现有协议栈兼容，NIST 标准也已在 2024 年落地，因此是当前最主流的可行路线。QKD 依赖专用量子信道与可信中继，成本高、距离受限，且只解决密钥分发，替代不了数字签名与公钥加密。单纯加长传统密钥长度无法抵御 Shor 算法；放弃加密改用物理隔离更不现实。","correctReason":"部署抗量子密码（PQC）可在现有设施上以软件升级方式获得抗量子能力，是当前主流可行的技术路线，故选 C。","wrongReason":"A：QKD 只能解决密钥分发，受距离与造价限制，无法覆盖签名等需求，不能“只依赖”；B：Shor 算法对 RSA/ECC 属多项式时间破解，加长密钥无法根本抵御；D：全面放弃加密不可行，物理隔离也不是普遍适用的替代方案。","source":"NIST FIPS 203/204/205（2024 年 8 月发布）及抗量子密码迁移通行结论","keyPoint":"抗量子当前主力是 PQC（可软件升级），QKD 只是补充"},{"id":"第二部分专业题-二、密码前沿技术-单选题-37","no":37,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"某网站为了开发的便利，使用 SA 链接数据库，由于网站脚本中被发现存在 SQL 注入漏洞，导致攻击者利用内置存 储过程XP.cmctstell 删除了系统中的一 个重要文件，在进行问题分析时，作为安全专家，你应该指出该网站设计违反了 以下哪项原则（ ）。","options":[{"key":"A","text":"权限分离原则"},{"key":"B","text":"最小特权原则"},{"key":"C","text":"保护最薄弱环节的原则"},{"key":"D","text":"纵深防御的原则"}],"answer":"B","analysis":"网站用数据库最高权限账户 sa 连接数据库，等于让 Web 应用长期持有管理员权限；一旦存在 SQL 注入，攻击者便继承该权限，还能借 xp_cmdshell 等扩展存储过程执行系统命令、删除文件。最小特权原则要求每个主体只获得完成任务所必需的最小权限，Web 应用应改用仅有增删改查权限的专用低权账户，并禁用危险的扩展存储过程。A 强调职责分工制衡，C 讲防护水平取决于最弱环节，D 讲多层设防，都不是本案的症结。","correctReason":"Web 应用以 sa 最高权限连库，权限远超业务所需，注入后即可执行系统命令，违反最小特权原则，故选 B。","wrongReason":"A：权限分离指关键职能由不同角色分担、相互制衡，本案问题是单一账户权限过大；C：最薄弱环节原则是防护水平的总体判断，未点出权限配置失当这一根因；D：纵深防御要求多层设防，与本案根因不对应。","source":"GB/T 22239-2019《信息安全技术 网络安全等级保护基本要求》访问控制“最小权限”要求","keyPoint":"应用连库须用最小权限账户，禁用 xp_cmdshell 等危险过程"},{"id":"第二部分专业题-二、密码前沿技术-单选题-38","no":38,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"抗量子密码迁移的困难通常以10 年以上为单位推进，主要原因是（ ）","options":[{"key":"A","text":"量子计算机尚未问世，无需着急"},{"key":"B","text":"抗量子密码算法尚未标准化"},{"key":"C","text":"企业必须确认系统相依性、应用相容性、凭证链、设备支援度等方面的合规 要求"},{"key":"D","text":"抗量子密码算法运行速度太慢"}],"answer":"C","analysis":"抗量子迁移牵动全栈：要清点密码资产及其相依关系，验证应用与协议栈对新算法的兼容性，重建从根 CA 到终端设备的整条证书与信任链，还要确认老旧设备与固件是否支持。清点、改造、联调与合规验证层层叠加，决定了迁移要以十年为尺度推进。A 不成立，量子机虽未大规模实用，“先存储、后解密”已是现实威胁；B 不成立，NIST 首批标准 2024 年已发布；D 也不是主因，多数 PQC 算法性能可接受。","correctReason":"迁移缓慢的根源是系统相依性、应用相容性、凭证链、设备支援度等工程与合规因素需逐一确认，故选 C。","wrongReason":"A：量子计算机虽未大规模实用，“先存储、后解密”使当下数据已面临风险，不能说不着急；B：NIST 首批抗量子密码标准已于 2024 年 8 月发布；D：多数 PQC 算法性能已可接受，性能不是迁移缓慢的主因。","source":"NIST FIPS 203/204/205；NIST NCCoE 关于向后量子密码迁移的工程实践指南","keyPoint":"PQC 迁移难在系统清点、兼容验证与信任链重建"},{"id":"第二部分专业题-二、密码前沿技术-单选题-39","no":39,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"降低风险（或减低风险）指通过对面的风险的资产采取保护措施的方式来降 低风险，下面哪个措施不属于降低风险的措施？（ ）","options":[{"key":"A","text":"减少威胁源，采用法律的手段制裁计算机的犯罪，发挥法律的威慑作用，从而 有效遏制威胁源的动机"},{"key":"B","text":"签订外包服务合同，将有计算难点，存在实现风险的任务通过签订外部合同的 方式交予第三方公司完成，通过合同责任条款来应对风险"},{"key":"C","text":"减低威胁能力，采取身份认证措施，从而抵制身份假冒这种威胁行为的能力"},{"key":"D","text":"减少脆弱性，及时给系统打补丁，关闭无用的网络服务端口，从而减少系统的 脆弱性，降低被利用的可能性"}],"answer":"B","analysis":"风险处置分降低（缓解）、规避、转移、接受四类。B 通过签订外包合同、以责任条款把后果转给第三方，风险本身并未减小，属风险转移而非降低风险。A 用法律威慑遏制攻击动机，C 用身份认证削弱假冒能力，D 用打补丁、关端口减少脆弱性，三者都切实减小了风险发生的可能性或影响，是典型的降低风险措施。","correctReason":"签订外包服务合同、靠合同责任条款应对风险属于风险转移，风险的可能性与影响并未降低，故选 B。","wrongReason":"A：以法律手段威慑、遏制犯罪动机，直接削减威胁源，属降低风险；C：用身份认证削弱身份假冒的能力，属降低风险；D：打补丁、关闭无用端口是在减少系统脆弱性，属降低风险。","source":"GB/T 20984-2022《信息安全技术 信息安全风险评估方法》风险处置方式；GB/T 24353-2022《风险管理 指南》","keyPoint":"降低风险＝减威胁、减脆弱性；签合同外包＝风险转移"},{"id":"第二部分专业题-二、密码前沿技术-单选题-40","no":40,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"关于风险要素识别阶段工作内容叙述错误的是（ ）。","options":[{"key":"A","text":"资产识别是指对需求保护的资产和系统等进行识别和分类"},{"key":"B","text":"威胁识别是指识别与每项资产相关的可能威胁和漏洞及其发生的可能性"},{"key":"C","text":"脆弱性识别以资产为核心，针对每一项需求保护的资产，识别可能被威胁利用 的弱点，并对脆弱性的严重程度进行评估"},{"key":"D","text":"确认已有的安全措施仅属于技术层面的工作，牵涉到具体方面包括：物理平台、 系统平台、网络平台和应用平台"}],"answer":"D","analysis":"风险要素识别要完成资产、威胁、脆弱性以及已有安全措施的识别。已有的安全措施既有技术类（访问控制、加密、审计、备份），也有管理类（安全策略、操作规程、人员职责、培训考核），覆盖物理、网络、系统、应用与管理多个层面，绝非“仅技术层面”，故 D 表述错误。A、B、C 对资产识别、威胁识别、脆弱性识别的描述与风险评估标准一致，本身正确。","correctReason":"已有安全措施既含技术措施也含管理措施，涉及物理、网络、系统、应用与管理等多个层面，说成“仅属技术层面”不成立，故选 D。","wrongReason":"A：资产识别确为对需保护的资产和系统进行识别分类，描述正确，并非本题所选的错误项；B：威胁识别确要识别与资产相关的威胁、漏洞及其发生可能性，描述正确；C：脆弱性识别以资产为核心并评估严重程度，描述正确。","source":"GB/T 20984-2022《信息安全技术 信息安全风险评估方法》风险要素识别相关要求","keyPoint":"已有安全措施含技术＋管理，覆盖多个层面，不只技术"},{"id":"第二部分专业题-二、密码前沿技术-单选题-41","no":41,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"某单位的信息安全主管部门在学习我国有关信息安全的政策和文件后，认识 到信息安全风险评估分为自评估和检查评估两种形式，该部门将检查评估的特点 和要求整理成如下四条报告给单位领导，其中描述错误的是（ ）。","options":[{"key":"A","text":"检查评估可依据相关标准的要求，实施完整的风险评估过程；也可在自评估的 基础上，对关键环节或重点内容实施抽样评估"},{"key":"B","text":"检查评估可以由上级管理部门组织，也可以由本级单位发起，其重点是针对存 在的问题进行检查和评测"},{"key":"C","text":"检查评估可以由上级管理部门组织，并委托有资质的第三方技术机构实施"},{"key":"D","text":"检查评估是通过行政手段加强信息安全管理的重要措施，具有强制性的特点"}],"answer":"B","analysis":"我国信息安全风险评估分自评估与检查评估。自评估由组织自行发起、自主实施；检查评估则由信息安全主管部门（上级管理部门）依据行政职能组织发起，可委托有资质的第三方技术机构实施，带有强制性，是行政管理的重要手段。其范围既可依标准做完整评估，也可在自评估基础上对关键环节、重点内容抽样评估。B 把“本级单位发起”也算作检查评估的组织方，混淆了两类评估的发起主体。","correctReason":"检查评估由信息安全主管（上级管理）部门组织发起并具强制性，本级单位自行发起、自主实施的是自评估，故 B 描述错误。","wrongReason":"A：检查评估既可完整实施，也可在自评估基础上抽样评估，描述正确，并非本题所选的错误项；C：检查评估可由上级管理部门组织并委托有资质第三方机构实施，描述正确；D：检查评估确属行政管理手段并具有强制性，描述正确。","source":"GB/T 20984-2022《信息安全技术 信息安全风险评估方法》及国家信息安全风险评估管理文件关于自评估与检查评估的规定","keyPoint":"自评估＝本单位自主发起；检查评估＝主管部门组织、有强制性"},{"id":"第二部分专业题-二、密码前沿技术-单选题-42","no":42,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"在信息安全管理的实施过程中，管理者的作用于信息安全管理体系能否成功 实施非常重要，但是以下选项中不属于管理者应有职责的是（ ）。","options":[{"key":"A","text":"制定并颁发信息安全方针，为组织的信息安全管理体系建设指明方向并提供总 体纲领，明确总体要求"},{"key":"B","text":"确保组织的信息安全管理体系目标和相应的计划得以制定，目标应明确、可度 量，计划应具体、可实施"},{"key":"C","text":"向组织传达满足信息安全的重要性，传达满足信息安全要求、达成信息安全目 标、符合信息安全方针、履行法律 责任和持续改进的重要性"},{"key":"D","text":"建立健全信息安全制度，明确安全风险管理作用，实施信息安全风险评估过程、 确保信息安全风险评估技术选择 合理、计算正确"}],"answer":"D","analysis":"管理者在 ISMS 中的职责是方向性与资源性的：制定并颁发信息安全方针明确总体要求，确保体系目标与计划得以制定且目标可度量、计划可实施，向组织传达满足信息安全要求、符合方针、履行法律责任和持续改进的重要性，还包括提供资源、任命管理者代表、主持管理评审等。D 所说的“实施风险评估过程、确保评估技术选择合理、计算正确”属评估实施者与技术人员的具体工作，不是管理者的职责。","correctReason":"实施风险评估、判断评估技术是否合理、核对计算是否正确属技术执行层面的工作，应由风险评估人员承担，故选 D。","wrongReason":"A：制定并颁发信息安全方针是管理者的核心职责，描述正确，并非本题所选；B：确保 ISMS 目标与相应计划得以制定属管理者职责；C：向组织传达信息安全与合规、持续改进的重要性属管理者职责。","source":"GB/T 22080-2016《信息技术 安全技术 信息安全管理体系 要求》领导作用与职责相关条款","keyPoint":"管理者管方向与资源；风险评估的具体实施由技术人员做"},{"id":"第二部分专业题-二、密码前沿技术-单选题-43","no":43,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"信息安全管理体系（ISMS）的内部审核和管理审核是两项重要的管理活动， 关于这两者，下面描述的错误是（ ）。","options":[{"key":"A","text":"内部审核和管理评审都很重要，都是促进ISMS 持续改进的重要动力，也都应 当按照一定的周期实施"},{"key":"B","text":"内部审核实施方式多采用文件审核和现场审核的形式，而管理评审的实施方式 多采用召开管理评审会议形式进行"},{"key":"C","text":"内部审核实施主体组织内部的ISMS 内审小组，而管理评审的实施主体是由国 家政策指定的第三方技术服务机构"},{"key":"D","text":"组织的信息安全方针、信息安全目标和有关ISMS 文件等，在内部审核中作为 审核标准使用，但在管理评审中，这些文件是被审对象"}],"answer":"C","analysis":"内部审核由组织内部的审核小组按周期实施，多用文件审核与现场审核方式，检查体系是否符合标准与自身策划、是否有效实施保持；在内部审核中，方针、目标与体系文件充当审核准则。管理评审由最高管理者主持、通常以会议形式进行，目的是确保体系的持续适宜性、充分性和有效性，此时方针与体系文件成为被评审对象。C 把管理评审主体说成国家政策指定的第三方机构，混淆了管理评审与外部审核、检查评估。","correctReason":"管理评审的实施主体是组织的最高管理者（管理层），而非国家政策指定的第三方技术服务机构，故 C 描述错误。","wrongReason":"A：两者都是推动 ISMS 持续改进的动力且应按周期实施，描述正确，并非本题所选；B：内审多为文件与现场审核，管理评审多以会议形式开展，描述正确；D：体系文件在内审中是审核准则、在管理评审中是被评审对象，描述正确。","source":"GB/T 22080-2016《信息技术 安全技术 信息安全管理体系 要求》绩效评价（内部审核与管理评审）相关条款","keyPoint":"内审自己查（文件＋现场）；管理评审由最高管理者开会做"},{"id":"第二部分专业题-二、密码前沿技术-单选题-44","no":44,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"在风险管理中，残余风险是指实施了新的或增强的安全措施后还剩下的风险， 关于残余风险，下面描述错误的是（ ）。","options":[{"key":"A","text":"风险处理措施确定以后，应编制详细的残余风险清单，并获得管理层对残余风 险的书面批准，这也是风险管理中 的一个重要过程"},{"key":"B","text":"管理层确认接收残余风险，是对风险评估工作的一种肯定，表示管理层已经全 面了解了组织所面临的风险，并理解在风险一旦变为现实后，组织能够且承担引 发的后果"},{"key":"C","text":"接收残余风险，则表明没有必要防范和加固所有的安全漏洞，也没有必要无限 制的提高安全保护措施的强度，对 安全保护措施的选择要考虑到成本和技术等 因素的限制"},{"key":"D","text":"如果残余风险没有降低到可接受的级别，则只能被动的选择接受风险，即对风 险不进行下一步的处理措施，接受 风险可能带来的结果。"}],"answer":"D","analysis":"残余风险是处置措施实施后仍留存的风险。风险管理要求把它降到组织可接受的水平：处置措施确定后应编制残余风险清单并取得管理层书面批准；管理层签批意味着已通盘了解风险并愿承担后果；接受残余风险也说明不必对所有漏洞都加固、不必无限提高防护强度，措施选择要权衡成本与技术。D 的错误在于把“未降到可接受水平”当成只能被动接受，此时恰恰应返回处置环节继续加强或调整措施。","correctReason":"残余风险若仍高于可接受水平，应继续调整、加强风险处置措施直至可接受，而不是被动接受，故 D 描述错误。","wrongReason":"A：编制残余风险清单并取得管理层书面批准确属风险管理的重要过程，描述正确，并非本题所选；B：管理层接收残余风险表明其已全面了解并愿承担后果，描述正确；C：接受残余风险意味着不必对所有漏洞无限加固，须权衡成本与技术，描述正确。","source":"GB/T 20984-2022《信息安全技术 信息安全风险评估方法》风险处置与残余风险要求；GB/T 24353-2022《风险管理 指南》","keyPoint":"残余风险超可接受水平要继续处置，不是被动接受"},{"id":"第二部分专业题-二、密码前沿技术-单选题-45","no":45,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"关于业务连续性计划（BCP）以下说法最恰当的是（ ）。","options":[{"key":"A","text":"组织为避免所有业务功能因重大事件而中断，减少业务风险而建立的一个控制 过程。"},{"key":"B","text":"组织为避免关键业务功能因重大事件而中断，减少业务风险而建立的一个控制 过程。"},{"key":"C","text":"组织为避免所有业务功能因各种事件而中断，减少业务风险而建立的一个控制 过程"},{"key":"D","text":"组织为避免信息系统功能因各种事件而中断，减少信息系统风险建立的一个控 制过程"}],"answer":"B","analysis":"BCP 针对的是那些一旦中断就造成重大损失的关键业务功能，触发条件是重大事件（灾难、重大故障等），目标是把中断时间与影响控制在可接受范围，核心产出是恢复目标（RTO/RPO）以及应急与恢复流程。A 说“所有业务功能”，范围过大且不现实；C 把触发条件泛化成“各种事件”，会让计划失去重点；D 把对象缩为“信息系统功能”、风险限为“信息系统风险”，而 BCP 的对象是业务，IT 只是支撑。","correctReason":"BCP 以关键业务功能为对象、以重大事件为触发条件，目的是减少业务风险，故选 B。","wrongReason":"A：BCP 只针对关键业务功能，不必也不可能覆盖所有业务功能；C：触发条件应是重大事件，泛化为“各种事件”会使计划失去重点；D：BCP 以业务为对象、关注业务风险，信息系统只是支撑手段。","source":"GB/T 30146-2023《安全与韧性 业务连续性管理体系 要求》（等同采用 ISO 22301）；GB/T 20988-2007《信息安全技术 信息系统灾难恢复规范》","keyPoint":"BCP＝关键业务功能＋重大事件，产出 RTO/RPO 与恢复流程"},{"id":"第二部分专业题-二、密码前沿技术-单选题-46","no":46,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"ISMS 是组织的一项战略性决策，其设计和实施受需要、目标、安全要求、所 采用的过程以及组织的规模和结构影响。ISMS 是指（ ）。","options":[{"key":"A","text":"信息安全管理体系"},{"key":"B","text":"信息服务管理体系"},{"key":"C","text":"信息技术管理体系"},{"key":"D","text":"信息产品管理体系"}],"answer":"A","analysis":"ISMS 是 Information Security Management System 的缩写，即信息安全管理体系，指组织用于建立信息安全方针与目标并实现这些目标的体系，涵盖组织结构、方针策略、策划活动、职责、惯例、程序、过程和资源。它的通用要求标准是 ISO/IEC 27001，我国对应 GB/T 22080。B、C、D 三项只是字面相近的中文名称，都没有 ISMS 这一缩写来源。本题属基础术语题，记准英文全称即可。","correctReason":"ISMS 即 Information Security Management System，中文为信息安全管理体系，故选 A。","wrongReason":"B：信息服务管理体系对应服务管理类标准（如 ISO/IEC 20000），缩写不是 ISMS；C：信息技术管理体系是泛化说法，并非 ISMS 的规范中文名；D：信息产品管理体系无此标准术语。","source":"GB/T 22080-2016《信息技术 安全技术 信息安全管理体系 要求》（对应 ISO/IEC 27001）术语与定义","keyPoint":"ISMS＝信息安全管理体系，勿与 ITSM 等混淆"},{"id":"第二部分专业题-二、密码前沿技术-单选题-47","no":47,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"检查云计算管理平台的网络安全时，需检查虚拟网络边界的（ ）策略，查 看其是否对进出网络的信息内容进行过滤，实现对应用层HTTP、FTP、TELNET、 SMTP、POP3 等的控制。","options":[{"key":"A","text":"访问控制"},{"key":"B","text":"属性安全控制"},{"key":"C","text":"目录级安全控制"},{"key":"D","text":"网络锁定控制"}],"answer":"A","analysis":"题干要求检查对进出网络的信息内容是否过滤、能否对 HTTP、FTP、TELNET、SMTP、POP3 等应用层协议实施控制，这正是访问控制策略在虚拟网络边界的落地：通过虚拟防火墙或安全组规则，按源目地址与协议端口放行或拒绝流量。检查要点是规则是否默认拒绝、是否按最小必要开放。B 属性安全控制、C 目录级安全控制都是文件系统或数据库层面的权限机制，D“网络锁定控制”并非规范的安全控制术语。","correctReason":"对进出网络流量及 HTTP、FTP 等应用层协议实施过滤与控制，属于虚拟网络边界的访问控制策略，故选 A。","wrongReason":"B：属性安全控制指对文件或对象属性（只读、隐藏、系统）设定权限，属主机与文件系统层面；C：目录级安全控制是文件系统对目录及其文件的权限管理；D：网络锁定控制不是标准的安全控制分类术语。","source":"GB/T 22239-2019《信息安全技术 网络安全等级保护基本要求》安全区域边界“访问控制”条款；GB/T 31168《信息安全技术 云计算服务安全能力要求》","keyPoint":"虚拟网络边界过滤应用层协议＝访问控制策略"},{"id":"第二部分专业题-二、密码前沿技术-单选题-48","no":48,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"在量子通信中，量子密钥信息通常编码在何种物理载体上进行传输？（ ）","options":[{"key":"A","text":"无线电波"},{"key":"B","text":"光纤中的经典光信号"},{"key":"C","text":"单光子、弱相干光脉冲或纠缠光子等量子态"},{"key":"D","text":"电流脉冲信号"}],"answer":"C","analysis":"量子密钥分发把密钥信息编码在光子的量子态上（偏振、相位、时间等自由度），实际系统常用衰减激光产生的弱相干光脉冲（准单光子）或纠缠光子对，通过测量结果的一致性来协商密钥。经典强光可被分束窃听而不易察觉，只有单光子或量子态层面才体现“测量即扰动”，从而暴露窃听行为。A、D 是经典信道；B 若指经典光信号，则丢掉了可检测窃听这一量子特性。","correctReason":"量子密钥信息编码在单光子、弱相干光脉冲或纠缠光子等量子态上传输，窃听会扰动量子态而被发现，故选 C。","wrongReason":"A：无线电波是经典信道，无法承载单量子态并保证窃听可检测；B：经典强光信号可被分束复制而难以察觉，不符合 QKD 原理；D：电流脉冲属经典电信号，与量子态编码无关。","source":"量子密钥分发 BB84 协议（Bennett 与 Brassard，1984）及量子通信通行原理","keyPoint":"QKD 把密钥编在单光子/纠缠光子等量子态上，窃听必留痕"},{"id":"第二部分专业题-二、密码前沿技术-单选题-49","no":49,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"在量子计算时代，一种令人不安的新型攻击策略是“先存储、后解密”。这 种攻击方式指的是（ ）","options":[{"key":"A","text":"攻击者先破解加密算法再窃取数据"},{"key":"B","text":"攻击者现在截获并存储加密数据，待量子计算技术成熟后再批量解密"},{"key":"C","text":"攻击者先解密旧数据再攻击新系统"},{"key":"D","text":"攻击者先破坏密钥管理系统再窃取数据"}],"answer":"B","analysis":"“先存储、后解密”（Harvest Now, Decrypt Later）指攻击者现在就把截获的加密数据大量囤积起来。今天的 RSA/ECC 用经典计算机解不开，他们并不着急，等量子计算机（Shor 算法）成熟后再回头批量解密。这就使数据保密期限与迁移进度赛跑：只要数据需要保密的年限长于量子威胁到来的时间，当下就存在实际风险，因此长周期敏感数据必须尽早迁移。A、C、D 描述的攻击时序与对象都不符。","correctReason":"该攻击指现在截获并存储加密数据，待量子计算技术成熟后再批量解密，故选 B。","wrongReason":"A：攻击者恰恰是先窃取存储、后解密，而不是先破解算法再窃取数据；C：该策略针对当下截获的密文，不是先解旧数据再攻击新系统；D：破坏密钥管理系统属另一类攻击，与“先存后解”的定义无关。","source":"NIST IR 8547《Transition to Post-Quantum Cryptography Standards》","keyPoint":"先存后解＝现在囤密文，等量子机成熟再批量解密"},{"id":"第二部分专业题-二、密码前沿技术-单选题-50","no":50,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"系统调用是用户在程序中调用操作系统所提供的一些子功能，系统调用可以 被当作特殊的公共子程序。下面关于系统调用的描述中，错误的是（ ）。","options":[{"key":"A","text":"系统调用中被调用的过程运行在“用户态”中"},{"key":"B","text":"利用系统调用能够得到操作系统提供的多种服务"},{"key":"C","text":"系统调用把应用程序的请求传输给系统内核执行"},{"key":"D","text":"系统调用保护了一些只能在内核模式执行的操作指令"}],"answer":"A","analysis":"系统调用是应用程序请求内核服务的正规入口：用户态程序通过软中断或专用指令陷入内核，由内核在核心态（管态）执行相应服务例程，完成后返回用户态并带回结果。所以“被调用的过程运行在用户态”是错的，它运行在内核态。系统调用确实能让应用获得操作系统提供的多种服务；也正因为它把只能在核心态执行的特权操作封装在内核中，才对上层形成保护，避免用户程序直接操纵硬件与关键资源。","correctReason":"系统调用的服务例程由内核在核心态（内核态）执行，而不是在用户态执行，故 A 描述错误。","wrongReason":"B：系统调用正是操作系统对外提供的服务接口，描述正确，并非本题所选；C：系统调用会把应用程序的请求交由内核执行，描述正确；D：系统调用封装了只能在核心态执行的特权操作指令，描述正确。","source":"操作系统原理关于系统调用与用户态/核心态的通行论述；GB/T 20272-2019《信息安全技术 操作系统安全技术要求》","keyPoint":"系统调用陷入内核、在核心态执行，返回用户态给结果"},{"id":"第二部分专业题-二、密码前沿技术-单选题-51","no":51,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"抗量子密码（Post-QuantumCryptography,PQC）诞生的根本原因是（ ）","options":[{"key":"A","text":"经典计算机的算力已经足够破解现有密码"},{"key":"B","text":"量子计算技术的快速发展对基于大整数分解和离散对数难题的经典密码体系 构成了颠覆性安全威胁"},{"key":"C","text":"现有密码算法的密钥长度不够长"},{"key":"D","text":"传统密码算法在经典计算机上的运行速度太慢"}],"answer":"B","analysis":"现有公钥密码（RSA、ECC、DH、SM2）的安全性建立在大整数分解难与离散对数难之上，而 Shor 算法在足够规模的量子计算机上可多项式时间求解这两类问题，等于把这些算法的安全根基整体抽掉。为在量子环境下继续提供公钥加密、密钥封装与数字签名，才催生了不依赖上述难题的抗量子密码。A、C 与事实不符：经典算力并未破解现有密码，密钥长度也不是根本症结；D 说的是性能，与安全动因无关。","correctReason":"Shor 算法可多项式时间求解大整数分解与离散对数难题，动摇了 RSA/ECC 等经典公钥体系的安全根基，这正是 PQC 诞生的根本原因，故选 B。","wrongReason":"A：经典计算机算力提升并不能破解 RSA/ECC 所依赖的困难问题；C：密钥长度不是根本症结，面对 Shor 算法单纯加长密钥无法解决；D：运行速度属性能问题，不是 PQC 产生的安全动因。","source":"NIST FIPS 203/204/205 及 NIST PQC 标准化项目背景说明；Shor 算法（1994）","keyPoint":"PQC 因 Shor 算法威胁 RSA/ECC 所依赖的数学难题而生"},{"id":"第二部分专业题-二、密码前沿技术-单选题-52","no
