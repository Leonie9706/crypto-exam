/* 密码竞赛刷题 —— 桌面端优先样式 */
:root {
  --bg: #eef1f6;
  --card: #ffffff;
  --ink: #1b2330;
  --ink-2: #55627a;
  --line: #dde3ee;
  --brand: #1f5fd0;
  --brand-2: #2f7bf0;
  --ok: #14934a;
  --ok-bg: #e7f8ee;
  --bad: #d2372f;
  --bad-bg: #fdecea;
  --warn: #b8860b;
  --warn-bg: #fdf6e3;
  --shadow: 0 2px 10px rgba(24, 40, 72, .07);
  --radius: 12px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.7 "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif;
  min-height: 100vh;
}
button { font-family: inherit; cursor: pointer; }
h1, h2, h3, h4 { margin: 0; font-weight: 700; }
a { color: var(--brand); }

/* ---------- 顶栏 ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 18px;
  padding: 10px 22px;
  background: linear-gradient(90deg, #123a86, #1f5fd0 45%, #2a76e6);
  color: #fff;
  box-shadow: 0 2px 12px rgba(15, 40, 90, .25);
}
.brand { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
.logo {
  display: grid; place-items: center;
  width: 38px; height: 38px; border-radius: 10px;
  background: rgba(255, 255, 255, .18);
  border: 1px solid rgba(255, 255, 255, .35);
  font-size: 20px; font-weight: 700;
}
.brand-text { display: flex; flex-direction: column; line-height: 1.25; }
.brand-text strong { font-size: 16px; letter-spacing: .5px; }
.brand-text span { font-size: 12px; opacity: .78; }
.tabs { display: flex; gap: 4px; margin-left: 8px; flex-wrap: wrap; }
.tabs button {
  border: 0; background: transparent; color: rgba(255, 255, 255, .82);
  padding: 8px 14px; border-radius: 8px; font-size: 14.5px;
}
.tabs button:hover { background: rgba(255, 255, 255, .14); color: #fff; }
.tabs button.active { background: #fff; color: var(--brand); font-weight: 700; }
.topbar-right { margin-left: auto; display: flex; gap: 8px; }
.icon-btn {
  border: 1px solid rgba(255, 255, 255, .45); background: rgba(255, 255, 255, .12);
  color: #fff; border-radius: 8px; padding: 6px 12px; font-size: 13.5px;
}
.icon-btn:hover { background: rgba(255, 255, 255, .24); }

/* ---------- 布局 ---------- */
main { max-width: 1280px; margin: 0 auto; padding: 20px 22px 60px; }
.card {
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 18px 20px; margin-bottom: 16px;
}
.card h2 { font-size: 17px; margin-bottom: 12px; }
.row { display: flex; gap: 16px; align-items: flex-start; }
.grid { display: grid; gap: 14px; }
.grid.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.muted { color: var(--ink-2); font-size: 13px; }
.pill {
  display: inline-block; padding: 1px 9px; border-radius: 20px;
  background: #eef2fb; color: var(--brand); font-size: 12.5px; margin-right: 6px;
}
.pill.gray { background: #f0f1f5; color: var(--ink-2); }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }

/* ---------- 按钮 ---------- */
.btn {
  border: 1px solid var(--line); background: #fff; color: var(--ink);
  padding: 9px 16px; border-radius: 9px; font-size: 14.5px;
}
.btn:hover { border-color: var(--brand); color: var(--brand); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-2); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); border-color: #f3c9c6; }
.btn.danger:hover { background: var(--bad-bg); }
.btn.small { padding: 5px 11px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ---------- 首页 ---------- */
.hero {
  background: linear-gradient(120deg, #16336e, #2456b8 55%, #3a86ea);
  color: #fff; border-radius: var(--radius); padding: 26px 28px; margin-bottom: 18px;

}
.hero h1 { font-size: 26px; margin-bottom: 6px; }
.hero p { margin: 4px 0 0; opacity: .9; font-size: 14px; }
.hero .hero-stats { display: flex; gap: 26px; margin-top: 18px; flex-wrap: wrap; }
.hero .hero-stats div { line-height: 1.35; }
.hero .hero-stats b { font-size: 24px; display: block; }
.hero .hero-stats span { font-size: 12.5px; opacity: .82; }
.mode-card {

}
.mode-card:hover { transform: translateY(-2px); border-color: var(--brand); }
.mode-card h3 { font-size: 16px; margin-bottom: 6px; }
.mode-card .big { font-size: 30px; margin-bottom: 2px; }
.mode-card p { margin: 0; color: var(--ink-2); font-size: 13px; }
.progress-bar { height: 8px; border-radius: 6px; background: #e8ecf5; overflow: hidden; }
.progress-bar > i { display: block; height: 100%; background: linear-gradient(90deg, #2f7bf0, #35c07a); }

/* ---------- 刷题三栏 ---------- */
.practice-wrap { display: grid; grid-template-columns: 268px minmax(0, 1fr) 292px; gap: 16px; align-items: start; }
.side { position: sticky; top: 76px; max-height: calc(100vh - 100px); overflow: auto; }
.cat-list { list-style: none; margin: 0; padding: 0; }
.cat-list li { margin-bottom: 6px; }
.cat-list .cat-head {

}
.cat-item {

  width: 100%; text-align: left; border: 1px solid var(--line); background: #fff;
  border-radius: 9px; padding: 7px 10px; font-size: 13.5px; color: var(--ink);
}
.cat-item:hover { border-color: var(--brand); }
.cat-item.active { background: #eaf1ff; border-color: var(--brand); color: var(--brand); font-weight: 700; }
.cat-item .n { color: var(--ink-2); font-size: 12.5px; }
.cat-item.active .n { color: var(--brand); }

.q-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.q-stem { font-size: 17px; line-height: 1.85; white-space: pre-wrap; }
.q-type { font-size: 13px; color: var(--ink-2); }
.opts { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 10px; }
.opt {
  display: flex; gap: 12px; align-items: flex-start;
  border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px;
  background: #fff; cursor: pointer; font-size: 15.5px; line-height: 1.7;
}
.opt:hover { border-color: var(--brand-2); background: #f7faff; }
.opt .key {
  flex: 0 0 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  background: #eef1f8; font-weight: 700; font-size: 14px; color: var(--ink-2);
}
.opt.chosen { border-color: var(--brand); background: #f2f7ff; }
.opt.chosen .key { background: var(--brand); color: #fff; }
.opt.correct { border-color: var(--ok); background: var(--ok-bg); }
.opt.correct .key { background: var(--ok); color: #fff; }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .key { background: var(--bad); color: #fff; }
.opt.locked { cursor: default; }
.match-table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 14.5px; }
.match-table td { border: 1px solid var(--line); padding: 7px 10px; }
.match-table td:first-child { width: 42%; background: #f8fafd; }
.blank-input {
  width: 100%; max-width: 420px; padding: 10px 12px; font-size: 15.5px;
  border: 1px solid var(--line); border-radius: 9px; font-family: inherit;
}
.blank-input:focus { outline: 2px solid #cfe0ff; border-color: var(--brand); }

.result { margin-top: 16px; border-radius: 10px; padding: 14px 16px; border: 1px solid var(--line); }
.result.ok { background: var(--ok-bg); border-color: #b9e6cd; }
.result.bad { background: var(--bad-bg); border-color: #f2c6c2; }

.result.ok .r-title { color: var(--ok); }
.result.bad .r-title { color: var(--bad); }
.exp-block { margin-top: 10px; }
.exp-block h4 { font-size: 13.5px; color: var(--ink-2); margin: 10px 0 3px; }
.exp-block p { margin: 0; white-space: pre-wrap; }

.q-foot { display: flex; gap: 10px; align-items: center; margin-top: 18px; flex-wrap: wrap; }
.spacer { flex: 1; }

/* 答题卡 */
.sheet { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
.sheet button {

.sheet button.cur { outline: 2px solid var(--brand); color: var(--brand); font-weight: 700; }

table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }

/* ---------- 实操题 ---------- */
.prac-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }

  background: #fff; padding: 9px 12px; font-size: 14.5px;

.prac-list button.active, .prac-list button:hover { border-color: var(--brand); color: var(--brand); }
pre.code {
  background: #0f172a; color: #e6edf7; padding: 14px 16px; border-radius: 10px;
  overflow: auto; font: 13.5px/1.65 Consolas, "Cascadia Mono", monospace; margin: 8px 0 0;
  max-height: 620px;
}
.flag-box {
  font-family: Consolas, monospace; background: #10233f; color: #7fe0a6;
  padding: 12px 14px; border-radius: 9px; word-break: break-all; font-size: 14.5px;
}

/* ---------- 弹窗 / 提示 ---------- */
.modal-mask { position: fixed; inset: 0; background: rgba(14, 22, 40, .45); z-index: 60; display: grid; place-items: center; }
.modal { background: #fff; border-radius: 14px; width: min(720px, 92vw); max-height: 86vh; display: flex; flex-direction: column; box-shadow: 0 18px 50px rgba(12, 24, 50, .3); }

.modal-body { padding: 16px 18px; overflow: auto; }
.modal-foot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: flex-end; }
.toast {
  position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%);
  background: #1b2330; color: #fff; padding: 10px 18px; border-radius: 9px;
  z-index: 80; font-size: 14px; box-shadow: 0 8px 24px rgba(0, 0, 0, .28);
}
.setting-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.setting-row:last-child { border-bottom: 0; }
.setting-row label { font-size: 14.5px; }
.setting-row .tip { display: block; color: var(--ink-2); font-size: 12.5px; }
select, input[type=number], input[type=text] {
  font-family: inherit; font-size: 14px; padding: 6px 9px;
  border: 1px solid var(--line); border-radius: 8px; background: #fff;
}
.empty { text-align: center; color: var(--ink-2); padding: 40px 10px; }
.score-big { font-size: 46px; font-weight: 800; line-height: 1.1; }

</style>

window.BANK = [{"id":"第一部分基础题-一、密码法律法规-单选题-1","no":1,"kind":"single","part":"第一部分基础题","cat":"一、密码法律法规","type":"单选题","stem":"商用密码用于保护哪类信息（ ）","options":[{"key":"A","text":"国家秘密信息"},{"key":"B","text":"绝密级信息"},{"key":"C","text":"不属于国家秘密的信息"},{"key":"D","text":"所有信息"}],"answer":"C","analysis":"《密码法》把密码分为核心密码、普通密码和商用密码三类，前两类保护的是属于国家秘密的信息，商用密码保护的则是不属于国家秘密的信息。本题考的就是三类密码在保护对象上的基本分工：商用密码面向的是非国家秘密。国家秘密信息应当由国家秘密载体和涉密信息系统来承载，不能用商用密码来保护。把“商用密码=非国家秘密”这条对应关系记牢，很多题都能直接推出来。","correctReason":"《密码法》规定商用密码用于保护不属于国家秘密的信息，保护非国家秘密正是商用密码的定位。","wrongReason":"A：国家秘密信息以及B绝密级信息属于核心密码、普通密码的保护范围，不是商用密码；D：商用密码并非“所有信息”通用，国家秘密信息被明确排除在外。","source":"《中华人民共和国密码法》第二条、第十四条","keyPoint":"商用密码保护不属于国家秘密的信息，涉密信息靠核心、普通密码。"},{"id":"第一部分基础题-一、密码法律法规-单选题-2","no":2,"kind":"single","part":"第一部分基础题","cat":"一、密码法律法规","type":"单选题","stem":"（ ）依照《中华人民共和国密码法》和有关法律、行政法规、国家有关规 定对核心密码、普通密码实行严格统一管理。","options":[{"key":"A","text":"保密行政管理部门"},{"key":"B","text":"密码管理部门"},{"key":"C","text":"中央密码工作领导机构"},{"key":"D","text":"密码工作机构"}],"answer":"B","analysis":"本题考核心密码、普通密码的管理主体。《密码法》确立“统一领导、分级负责”的管理体制，核心密码和普通密码由密码管理部门实行严格统一管理，保密行政管理部门并不承担这一职责。中央密码工作领导机构管的是全国密码工作的统一领导，属于更高层面的领导机构；密码工作机构则是具体使用、管理密码的单位，不是行政管理主体。四个选项名称相近，区分的关键就是“谁管核心、普通密码”和“谁领导全国密码工作”。","correctReason":"《密码法》明确由密码管理部门对核心密码、普通密码实行严格统一管理。","wrongReason":"A：保密行政管理部门主管保密工作，不承担核心、普通密码的统一管理职责；C：中央密码工作领导机构是全国密码工作的领导机构，不作具体统一管理；D：密码工作机构是具体从事密码工作的单位，不是行政管理主体。","source":"《中华人民共和国密码法》第五条","keyPoint":"密码管理部门统一管理核心密码、普通密码。"},{"id":"第一部分基础题-一、密码法律法规-单选题-3","no":3,"kind":"single","part":"第一部分基础题","cat":"一、密码法律法规","type":"单选题","stem":"依据《中华人民共和国密码法》，应使用（ ）进行保护。","options":[{"key":"A","text":"核心密码"},{"key":"B","text":"普通密码"},{"key":"C","text":"一般密码"},{"key":"D","text":"商用密码"}],"answer":"D","analysis":"题干省略了保护对象，结合《密码法》的分类来理解：核心密码、普通密码保护属于国家秘密的信息，商用密码保护不属于国家秘密的信息。选项中“一般密码”在法律上并不存在这一分类，属于干扰项。凡是考题给出“非国家秘密”“社会生产生活”“公民法人合法权益”这类线索，答案基本都指向商用密码。","correctReason":"《密码法》规定商用密码用于保护不属于国家秘密的信息，因而应使用商用密码进行保护。","wrongReason":"A、B：核心密码和普通密码保护的是属于国家秘密的信息，不适用于非国家秘密；C：“一般密码”不是《密码法》规定的密码分类，法律上不存在这一类型。","source":"《中华人民共和国密码法》第二条、第十四条","keyPoint":"保护非国家秘密信息选商用密码；“一般密码”是杜撰分类。"},{"id":"第一部分基础题-一、密码法律法规-单选题-4","no":4,"kind":"single","part":"第一部分基础题","cat":"一、密码法律法规","type":"单选题","stem":"下列哪项不属于《中华人民共和国密码法》规范的密码（ ）。","options":[{"key":"A","text":"基于格的密码"},{"key":"B","text":"密码资源管理平台登录口令"},{"key":"C","text":"抗量子密码"},{"key":"D","text":"税票防伪标识符的加密算法"}],"answer":"B","analysis":"《密码法》所称密码，是指采用特定变换方法对信息等进行加密保护、安全认证的技术、产品和服务；而日常生活中由数字、字母和符号组成的登录口令、支付密码，并不属于该法规范的密码。基于格的密码、抗量子密码都是密码算法或密码技术，税票防伪标识符所用的加密算法也是典型的密码技术，均落入密码法的调整范围。只有“登录口令”属于口令范畴，是本题要选的答案。","correctReason":"密码资源管理平台的登录口令只是身份鉴别用的口令，不属于《密码法》界定的采用特定变换方法的密码。","wrongReason":"A、C：基于格的密码、抗量子密码都是密码算法技术，属于密码法规范的密码；D：税票防伪标识符的加密算法是加密保护技术，同样属于密码法规范的范围。","source":"《中华人民共和国密码法》第二条","keyPoint":"法律上的“密码”是技术与产品服务，登录口令不是密码。"},{"id":"第一部分基础题-一、密码法律法规-单选题-5","no":5,"kind":"single","part":"第一部分基础题","cat":"一、密码法律法规","type":"单选题","stem":"根据《中华人民共和国密码法》，密码工作坚持（ ），遵循统一领导、 分级负责，创新发展、服务大局，依法管理、保障安全的原则。","options":[{"key":"A","text":"总体国家安全观"},{"key":"B","text":"整体国家安全观"},{"key":"C","text":"综合国家安全观"},{"key":"D","text":"安全发展观"}],"answer":"A","analysis":"《密码法》规定密码工作坚持总体国家安全观，遵循统一领导、分级负责，创新发展、服务大局，依法管理、保障安全的原则。总体国家安全观是新时代国家安全工作的根本遵循，密码作为保障网络与信息安全的核心技术，也纳入这一框架。其余三个选项是对“总体”二字的改写，法律文本中并无“整体国家安全观”“综合国家安全观”这类表述，“安全发展观”则属于另一种理念，都不是法条用语。","correctReason":"《密码法》总则明确密码工作坚持总体国家安全观，后接统一领导、分级负责等原则。","wrongReason":"B、C：把“总体”改成“整体”“综合”，都不是法条表述；D：“安全发展观”是另一范畴的理念，不是密码法确立的原则。","source":"《中华人民共和国密码法》第三条","keyPoint":"密码工作坚持总体国家安全观——记准“总体”二字。"},{"id":"第一部分基础题-一、密码法律法规-单选题-6","no":6,"kind":"single","part":"第一部分基础题","cat":"一、密码法律法规","type":"单选题","stem":"根据《中华人民共和国密码法》，国家加强密码（ ）和队伍建设，对在密 码工作中作出（ ）的组织和个人，按照国家有关规定给予表彰和奖励。","options":[{"key":"A","text":"人才培养，突出贡献"},{"key":"B","text":"教育培训，突出成绩"},{"key":"C","text":"人员素质，卓越贡献"},{"key":"D","text":"教育培训，突出贡献"}],"answer":"A","analysis":"《密码法》规定，国家加强密码人才培养和队伍建设，对在密码工作中作出突出贡献的组织和个人，按照国家有关规定给予表彰和奖励。法条里的关键词就是“人才培养”和“突出贡献”。选“教育培训”的选项改动了一处措辞，选“人员素质”“卓越贡献”的更是替换了法条用语。此类题要按原文精确记忆，两个关键词同时正确的选项才是答案。","correctReason":"法条原文为“加强密码人才培养和队伍建设”，并对作出“突出贡献”的组织和个人给予表彰和奖励。","wrongReason":"B：把“人才培养”换成“教育培训”、“突出贡献”换成“突出成绩”，与法条不符；C：“人员素质”“卓越贡献”均为改写，无法条依据；D：“教育培训”“突出贡献”中前者仍是改写。","source":"《中华人民共和国密码法》第十一条","keyPoint":"加强密码人才培养和队伍建设，奖励突出贡献。"},{"id":"第一部分基础题-一、密码法律法规-单选题-7","no":7,"kind":"single","part":"第一部分基础题","cat":"一、密码法律法规","type":"单选题","stem":"（ ）不属于《中华人民共和国密码法》中规定的国家机关和涉及密码工作 的单位。","options":[{"key":"A","text":"某市公安局"},{"key":"B","text":"承担密码管理职责的企业"},{"key":"C","text":"承担密码管理职责的事业单位"},{"key":"D","text":"某市密码管理局"}],"answer":"A","analysis":"本题考对《密码法》中主体范围的理解。公安局是公安机关，属于国家机关，但并非密码法所规定的“涉及密码工作的单位”。承担密码管理职责的企业、事业单位（如受委托承担部分密码管理技术支撑工作的单位）以及密码管理局，都在法律调整和保障的范围内。四个选项里只有公安局与密码管理职责没有直接关联，所以选它。","correctReason":"公安局是普通国家机关，不承担密码管理职责，不属于《密码法》所规定的涉及密码工作的单位。","wrongReason":"B、C：承担密码管理职责的企业、事业单位属于涉及密码工作的单位；D：市密码管理局是密码管理部门，当然属于涉及密码工作的单位。","source":"《中华人民共和国密码法》第五条、第十一条（条号待核）","keyPoint":"是否有密码管理职责，是判断主体是否被密码法规制的关键。"},{"id":"第一部分基础题-一、密码法律法规-单选题-8","no":8,"kind":"single","part":"第一部分基础题","cat":"一、密码法律法规","type":"单选题","stem":"某金融机构在日常业务中使用了不属于国家秘密的信息。根据《中华人民共 和国密码法》的规定，该金融机构应当使用（ ）类型的密码。","options":[{"key":"A","text":"核心密码"},{"key":"B","text":"普通密码"},{"key":"C","text":"商用密码"},{"key":"D","text":"军用密码"}],"answer":"C","analysis":"金融机构日常业务中处理的多为不属于国家秘密的信息，按《密码法》的分类，这类信息应当使用商用密码保护。核心密码、普通密码保护的是属于国家秘密的信息；我国密码分类中也没有“军用密码”这一类型，军队密码属于核心密码、普通密码的范畴。凡是题干强调“非国家秘密”“商业、金融、社会生产生活”场景，答案就是商用密码。","correctReason":"《密码法》规定商用密码用于保护不属于国家秘密的信息，金融机构的非涉密业务信息应使用商用密码。","wrongReason":"A、B：核心密码、普通密码保护的是属于国家秘密的信息，与本题非涉密场景不符；D：“军用密码”不是我国密码法规定的密码分类。","source":"《中华人民共和国密码法》第二条、第十四条、第二十七条","keyPoint":"金融等非涉密行业用商用密码，且属密码法重点规范对象。"},{"id":"第一部分基础题-一、密码法律法规-单选题-9","no":9,"kind":"single","part":"第一部分基础题","cat":"一、密码法律法规","type":"单选题","stem":"根据《中华人民共和国密码法》，国家支持社会团体、企业利用自主创新技 术制定（ ）国家标准、行业标准相关技术要求的商用密码团体标准、企业标 准。","options":[{"key":"A","text":"低于"},{"key":"B","text":"多于"},{"key":"C","text":"高于"},{"key":"D","text":"相当于"}],"answer":"C","analysis":"《密码法》鼓励社会团体、企业利用自主创新技术制定高于国家标准、行业标准相关技术要求的商用密码团体标准、企业标准，这体现了标准体系“国家—行业—团体—企业”层层递进、鼓励先进的精神。团体标准、企业标准不能低于国家强制性要求，只能是更严更高；因此“高于”是唯一符合立法意图的表述。此类题只需抓住“鼓励创新、鼓励更严”这个取向。","correctReason":"法条规定团体标准、企业标准的技术要求应高于国家标准、行业标准的相关要求，以推动技术进步。","wrongReason":"A：低于国家、行业标准违背标准体系的基本要求；B：“多于”与技术要求的高低无关，也与法条表述不符；D：“相当于”只是持平，不能体现鼓励自主创新、制定更严标准的要求。","source":"《中华人民共和国密码法》第二十三条","keyPoint":"团体标准、企业标准鼓励“高于”国家、行业标准。"},{"id":"第一部分基础题-一、密码法律法规-单选题-10","no":10,"kind":"single","part":"第一部分基础题","cat":"一、密码法律法规","type":"单选题","stem":"国家鼓励企业、社会团体和教育、科研机构等参与商用密码国际标准化活动， 其主要目的是（ ）。","options":[{"key":"A","text":"降低国内商用密码产品的生产成本"},{"key":"B","text":"推进商用密码中国标准与国外标准之间的转化运用"},{"key":"C","text":"限制外资企业参与国际标准制定"},{"key":"D","text":"强制推广中国商用密码标准至其他国家"}],"answer":"B","analysis":"《密码法》鼓励企业、社会团体和教育、科研机构等参与商用密码国际标准化活动，其目的在于推进商用密码中国标准与国外标准之间的转化运用，提升我国在商用密码领域的国际话语权和产业竞争力。国际标准化活动的落脚点是标准互认与转化，而不是压低成本、排斥外资或强制他国采用。抓住“转化运用”这一表述即可锁定答案。","correctReason":"国家鼓励参与商用密码国际标准化活动，核心目的是推动中国标准与国外标准的相互转化运用。","wrongReason":"A：降低成本不是参与国际标准化的立法目的；C：国际标准化强调合作参与，不是限制外资企业参与；D：我国主张标准互认与转化，不存在“强制推广”到其他国家的做法。","source":"《中华人民共和国密码法》第二十四条","keyPoint":"参与国际标准化，重在推动中外标准转化运用。"},{"id":"第一部分基础题-一、密码法律法规-单选题-11","no":11,"kind":"single","part":"第一部分基础题","cat":"一、密码法律法规","type":"单选题","stem":"依据《中华人民共和国密码法》，密码管理部门和有关部门及其工作人员不 得要求商用密码从业单位和商用密码检测、认证机构向其披露（ ）等密码相 关专有信息。","options":[{"key":"A","text":"产品型号"},{"key":"B","text":"源代码"},{"key":"C","text":"产品厂商"},{"key":"D","text":"技术标准"}],"answer":"B","analysis":"《密码法》在赋予管理部门监管权的同时，也划定了权力边界：密码管理部门和有关部门及其工作人员不得要求商用密码从业单位和检测、认证机构向其披露源代码等密码相关专有信息。源代码属于企业的核心商业秘密，一旦要求披露会直接损害产业创新积极性。产品型号、厂商名称、所依据的技术标准通常属于可公开或依法报送的信息，不属于禁止要求披露的专有信息。","correctReason":"法条明确禁止要求披露源代码等密码相关专有信息，以保护商用密码从业单位的合法权益。","wrongReason":"A、C：产品型号、产品厂商一般属于公开或依法可获取的信息，不在禁止披露之列；D：技术标准是公开的标准文本，不属于企业专有信息。","source":"《中华人民共和国密码法》第三十一条","keyPoint":"不得要求披露源代码等密码专有信息。"},{"id":"第一部分基础题-一、密码法律法规-单选题-12","no":12,"kind":"single","part":"第一部分基础题","cat":"一、密码法律法规","type":"单选题","stem":"《商用密码管理条例》是一部专门规范商用密码管理的重要行政法规，根据 条例中描述的，商用密码的保护对象是（ ）。","options":[{"key":"A","text":"国家秘密信息"},{"key":"B","text":"非国家秘密信息"},{"key":"C","text":"所有网络信息"},{"key":"D","text":"仅限金融领域数据"}],"answer":"B","analysis":"《商用密码管理条例》与《密码法》保持一致：商用密码用于保护不属于国家秘密的信息，其保护对象是非国家秘密信息。国家秘密信息由核心密码、普通密码保护，不适用本条例；说“所有网络信息”则把商用密码的适用范围无限放大，也不准确；“仅限金融领域数据”是明显缩小的错误说法。把握“非国家秘密”这一条即可。","correctReason":"条例规定商用密码用于保护不属于国家秘密的信息，故其保护对象为非国家秘密信息。","wrongReason":"A：国家秘密信息由核心密码、普通密码保护；C：商用密码只针对非国家秘密信息，不是所有网络信息；D：商用密码适用面覆盖政务、金融、能源等各领域，不限于金融数据。","source":"《商用密码管理条例》第二条","keyPoint":"商用密码的保护对象是非国家秘密信息。"},{"id":"第一部分基础题-一、密码法律法规-单选题-13","no":13,"kind":"single","part":"第一部分基础题","cat":"一、密码法律法规","type":"单选题","stem":"某机关工作人员小张被安排参加密码安全教育培训。根据《中华人民共和国 密码法》的规定，密码安全教育被纳入（ ）教育体系。","options":[{"key":"A","text":"纳入国民教育体系和高等教育体系"},{"key":"B","text":"仅纳入公务员教育培训体系"},{"key":"C","text":"纳入国民教育体系和公务员教育培训体系"},{"key":"D","text":"仅纳入高等教育体系"}],"answer":"C","analysis":"《密码法》规定，国家加强密码人才培养和队伍建设，密码安全教育纳入国民教育体系和公务员教育培训体系。也就是说面向青少年的学校教育与面向公职人员的培训两条线同时推进，故选“纳入国民教育体系和公务员教育培训体系”。只纳入公务员培训或只纳入高等教育都属于片面理解；A项把“公务员教育培训体系”换成了“高等教育体系”，与法条不符。","correctReason":"法条明确将密码安全教育纳入国民教育体系和公务员教育培训体系，两条线并行。","wrongReason":"A：把“公务员教育培训体系”偷换为“高等教育体系”，与法条不符；B、D：只讲其中一条线，遗漏了另一体系，属于片面表述。","source":"《中华人民共和国密码法》第十一条","keyPoint":"密码安全教育：国民教育体系＋公务员教育培训体系。"},{"id":"第一部分基础题-一、密码法律法规-单选题-14","no":14,"kind":"single","part":"第一部分基础题","cat":"一、密码法律法规","type":"单选题","stem":"根据《中华人民共和国密码法》，实施进口许可的商用密码应符合的条件是 （ ）。","options":[{"key":"A","text":"涉及国家安全且具有安全认证功能"},{"key":"B","text":"涉及社会公共利益且具有安全认证功能"},{"key":"C","text":"中国承担国际义务"},{"key":"D","text":"涉及国家安全、社会公共利益且具有加密保护功能"}],"answer":"D","analysis":"《密码法》对商用密码的进口许可划定了双重条件：涉及国家安全或者社会公共利益，并且具有加密保护功能。两个条件要同时具备，只有加密保护功能的商用密码产品才纳入进口许可管理。A、B两项分别只提“国家安全”或“社会公共利益”，且把“加密保护功能”错换成“安全认证功能”；C项“中国承担国际义务”是出口管制条款里的表述，与进口许可无关。","correctReason":"法条规定，对涉及国家安全、社会公共利益且具有加密保护功能的商用密码，实行进口许可。","wrongReason":"A、B：都只列了国家安全或社会公共利益一项，且把“加密保护功能”错写为“安全认证功能”；C：“中国承担国际义务”是出口管制情形的表述，不是进口许可的条件。","source":"《中华人民共和国密码法》第二十八条","keyPoint":"进口许可＝涉及国家安全、社会公共利益＋具有加密保护功能。"},{"id":"第一部分基础题-一、密码法律法规-单选题-15","no":15,"kind":"single","part":"第一部分基础题","cat":"一、密码法律法规","type":"单选题","stem":"根据《中华人民共和国密码法》，国家密码管理部门对采用商用密码技术从 事电子政务电子认证服务的机构进行认定，会同有关部门负责政务活动中使用 （ ）、数据电文的管理。","options":[{"key":"A","text":"电子数据"},{"key":"B","text":"电子签名"},{"key":"C","text":"电子文档"},{"key":"D","text":"电子证照"}],"answer":"B","analysis":"《密码法》规定，国家密码管理部门对采用商用密码技术从事电子政务电子认证服务的机构进行认定，并会同有关部门负责政务活动中使用电子签名、数据电文的管理。电子签名、数据电文是《电子签名法》中的核心概念，政务活动中使用它们必须依托合规的电子认证服务，因此由密码管理部门会同有关部门管理。电子数据、电子文档、电子证照虽在名称上相近，但不是法条用语。","correctReason":"法条明确由密码管理部门会同有关部门负责政务活动中使用电子签名、数据电文的管理。","wrongReason":"A、C、D：电子数据、电子文档、电子证照都不是该条规定的对象，法条用语是“电子签名、数据电文”。","source":"《中华人民共和国密码法》第二十九条","keyPoint":"政务活动中的电子签名、数据电文由密码管理部门会同有关部门管理。"},{"id":"第一部分基础题-一、密码法律法规-单选题-16","no":16,"kind":"single","part":"第一部分基础题","cat":"一、密码法律法规","type":"单选题","stem":"根据《中华人民共和国密码法》，关于大众消费类产品所采用的商用密码的 特点，下列表述正确的是（ ）。","options":[{"key":"A","text":"供涉密单位使用"},{"key":"B","text":"能轻易改变密码功能"},{"key":"C","text":"通过常规零售渠道购买会受到一定的限制"},{"key":"D","text":"对国家安全带来的风险较小且可控"}],"answer":"D","analysis":"大众消费类产品所采用的商用密码，通常装在手机、智能门锁等消费电子产品中，密码功能不易被改变，涉及的信息多与个人生活相关，对国家安全带来的风险较小且可控，因此不实行进口许可和出口管制。A项“供涉密单位使用”与大众消费品的属性相矛盾；B项“能轻易改变密码功能”正是立法者担心的情形，与事实相反；C项“通过常规零售渠道购买会受到一定限制”也不成立，大众消费品本就是通过零售渠道自由销售的。","correctReason":"这类产品密码功能不易改变、面向个人消费，对国家安全的风险较小且可控，故不实行进出口许可与管制。","wrongReason":"A：大众消费类产品面向普通消费者，不是供涉密单位使用；B：其密码功能不易被改变，说“能轻易改变”与立法考量相反；C：可通过常规零售渠道自由购买，不存在“一定的限制”。","source":"《中华人民共和国密码法》第二十八条、第三十条","keyPoint":"大众消费类商用密码：功能难改、风险小可控、不管制。"},{"id":"第一部分基础题-一、密码法律法规-单选题-17","no":17,"kind":"single","part":"第一部分基础题","cat":"一、密码法律法规","type":"单选题","stem":"某企业拟通过海外代理商在境外销售该软件，依法应当办理（ ）手续？","options":[{"key":"A","text":"自由出口，仅需在海关报关时声明含加密功能即可"},{"key":"B","text":"必须将该软件的源代码全部销毁方可出口"},{"key":"C","text":"依法申请出口许可，由国务院商务主管部门会同国家密码管理部门实施出口管 制"},{"key":"D","text":"向世界贸易组织提交技术说明，获批准后出口"}],"answer":"C","analysis":"商用密码的出口管理属于管制而非自由出口。对涉及国家安全、社会公共利益或者中国承担国际义务的商用密码，由国务院商务主管部门会同国家密码管理部门实行出口管制，出口经营者应当依法申请出口许可。仅向海关声明、销毁源代码、向世贸组织报批都不是法定程序，也不存在这样的制度安排。","correctReason":"法条规定，涉及国家安全、社会公共利益或中国承担国际义务的商用密码出口，需依法申请许可，由商务主管部门会同国家密码管理部门管制。","wrongReason":"A：出口管制范围内的商用密码不能自由出口，仅报关声明无效；B：法律未要求销毁源代码，且销毁源代码与出口许可无关；D：世贸组织不是我国出口许可的审批机关，无此程序。","source":"《中华人民共和国密码法》第二十八条","keyPoint":"管制范围内的商用密码出口须许可，商务部门会同密码部门管。"},{"id":"第一部分基础题-一、密码法律法规-单选题-18","no":18,"kind":"single","part":"第一部分基础题","cat":"一、密码法律法规","type":"单选题","stem":"某大型互联网票务平台被依法认定为关键信息基础设施运营者，在连续两年 的安全监督检查中，均被发现未依法开展商用密码应用安全性评估。密码管理部 门初次针对该违法行为作出处理时，首先可采取的措施是（ ）。","options":[{"key":"A","text":"直接对该平台处以五十万元罚款"},{"key":"B","text":"责令改正，给予警告"},{"key":"C","text":"通报通信管理部门，暂时关闭其网站"},{"key":"D","text":"吊销其营业执照"}],"answer":"B","analysis":"《密码法》在法律责任部分对关键信息基础设施运营者未按要求使用商用密码、未开展商用密码应用安全性评估等行为，先设定“由密码管理部门责令改正，给予警告”的行政处理，拒不改正的才进一步罚款。也就是说初次处理通常先责令改正、给予警告，体现了过罚相当、教育与处罚相结合的原则。直接罚款五十万元、通报通信管理部门关闭网站、吊销营业执照都不是密码管理部门可以首先采取的措施，吊销营业执照更是市场监管部门的职权。","correctReason":"对此类违法行为，法律规定的第一档处理措施是责令改正、给予警告，拒不改正才处以罚款。","wrongReason":"A：罚款适用于拒不改正等更严重情形，不是“首先”可采取的措施；C：暂停关闭网站属于其他主管部门职权，密码管理部门不能直接实施；D：吊销营业执照由市场监管部门依法作出，与密码管理部门无关。","source":"《中华人民共和国密码法》第三十七条","keyPoint":"关键信息基础设施违规：先责令改正、警告，拒不改正才罚款。"},{"id":"第一部分基础题-一、密码法律法规-单选题-19","no":19,"kind":"single","part":"第一部分基础题","cat":"一、密码法律法规","type":"单选题","stem":"某互联网企业开发了一款手机加密相册App，该App 采用特定算法对用户照 片进行加密保护和安全认证。关于该App 是否属于《中华人民共和国密码法》 所界定的“密码”，以下说法正确的是（ ）。","options":[{"key":"A","text":"不属于，因为“密码”仅指硬件加密设备"},{"key":"B","text":"属于，因为其采用特定变换方法对信息进行加密保护和安全认证"},{"key":"C","text":"不属于，因为该App 未取得商用密码产品认证证书"},{"key":"D","text":"属于，但仅当用于保护国家秘密时才可以称为“密码”"}],"answer":"B","analysis":"《密码法》所称密码，是采用特定变换方法对信息等进行加密保护、安全认证的技术、产品和服务。这款App用特定算法对照片加密保护并做安全认证，完全符合密码的定义，属于法律所规范的密码。是不是密码与是否取得认证证书无关，法律概念不依赖认证结论；密码也不限于硬件设备，更不以保护国家秘密为条件。","correctReason":"该App采用特定变换方法实现加密保护和安全认证，符合《密码法》对密码的界定，属于法律所称的密码。","wrongReason":"A：密码不限于硬件加密设备，软件、服务同样是密码；C：是否属于密码取决于是否有加密保护、安全认证功能，与是否取得认证证书无关；D：密码既包括保护国家秘密的核心、普通密码，也包括保护非国家秘密的商用密码。","source":"《中华人民共和国密码法》第二条","keyPoint":"有加密保护、安全认证功能即为密码，与认证、载体无关。"},{"id":"第一部分基础题-一、密码法律法规-单选题-20","no":20,"kind":"single","part":"第一部分基础题","cat":"一、密码法律法规","type":"单选题","stem":"关于《中华人民共和国密码法》，下列说法错误的是（ ）。","options":[{"key":"A","text":"本法所称的密码并非由数字、字母和符号组成的登录或支付密码"},{"key":"B","text":"县级以上的人民政府应当将密码工作所需经费列入本级财政预算"},{"key":"C","text":"采用日常监管和随机抽查相结合的商用密码事中事后监管制度"},{"key":"D","text":"核心密码、普通密码和商用密码用于保护属于国家秘密的信息"}],"answer":"D","analysis":"本题选“错误”的说法。核心密码、普通密码保护属于国家秘密的信息，商用密码保护不属于国家秘密的信息，三者的保护对象并不相同，D项把三者都说成保护国家秘密信息，因而是错误的。A项符合《密码法》对密码的定义，日常登录口令不属于法律所称密码；B项“县级以上人民政府应当将密码工作所需经费列入本级财政预算”与法条一致；C项“日常监管与随机抽查相结合”的事中事后监管制度也确有规定。","correctReason":"商用密码保护的是不属于国家秘密的信息，只有核心密码、普通密码保护国家秘密，D项表述与法条相悖。","wrongReason":"A：符合密码法对“密码”的定义，日常登录口令不属于法律所称密码；B：县级以上人民政府应将密码工作经费列入本级财政预算，表述正确；C：商用密码实行日常监管与随机抽查相结合的事中事后监管，表述正确。","source":"《中华人民共和国密码法》第二条、第十条、第三十条","keyPoint":"只有核心、普通密码保护国家秘密，商用密码不保护国家秘密。"},{"id":"第一部分基础题-一、密码法律法规-单选题-21","no":21,"kind":"single","part":"第一部分基础题","cat":"一、密码法律法规","type":"单选题","stem":"某地市级人民政府拟将密码工作纳入本地发展规划。根据《中华人民共和国 密码法》的规定，下列关于密码工作经费保障的说法正确的是（ ）","options":[{"key":"A","text":"密码工作所需经费由各使用单位自行解决"},{"key":"B","text":"密码工作所需经费列入本级财政预算"},{"key":"C","text":"密码工作所需经费由中央财政统一拨付"},{"key":"D","text":"密码工作所需经费通过社会募集方式解决"}],"answer":"B","analysis":"《密码法》规定，县级以上人民政府应当将密码工作所需经费列入本级财政预算。地市级人民政府属于县级以上人民政府，因此其密码工作经费应列入本级财政预算，而不是由使用单位自筹、中央财政统一拨付或向社会募集。经费保障条款是密码工作落地的物质基础，也是常考的记忆点，关键词是“本级财政预算”。","correctReason":"法条规定县级以上人民政府应当将密码工作所需经费列入本级财政预算，地市级政府适用该规定。","wrongReason":"A：经费不是由各使用单位自行解决；C：法律未规定由中央财政统一拨付，实行的是分级保障；D：密码工作经费属于财政保障事项，不通过社会募集解决。","source":"《中华人民共和国密码法》第十条","keyPoint":"密码工作经费列入本级财政预算，分级保障。"},{"id":"第一部分基础题-一、密码法律法规-单选题-22","no":22,"kind":"single","part":"第一部分基础题","cat":"一、密码法律法规","type":"单选题","stem":"根据《中华人民共和国密码法》，密码管理部门根据工作需要会同有关部门 建立核心密码、普通密码的（ ）和应急处置等协作机制，确保核心密码、普 通密码安全管理的协同联动和有序高效。","options":[{"key":"A","text":"安全监测预警、安全风险评估、信息通报、重大事项会商"},{"key":"B","text":"安全风险评估、安全风险评估、事件报告、重大事项会商"},{"key":"C","text":"安全监测预警、信息共享、重大事项会商"},{"key":"D","text":"安全风险评估、事件报告、重大事项会商"}],"answer":"A","analysis":"《密码法》规定，密码管理部门根据工作需要会同有关部门建立核心密码、普通密码的安全监测预警、安全风险评估、信息通报、重大事项会商和应急处置等协作机制，以确保核心密码、普通密码安全管理协同联动、有序高效。四个选项中只有A项完整包含了这些机制；B项重复了“安全风险评估”又漏掉“安全监测预警”；C、D两项都只列了部分机制，均不完整。","correctReason":"法条列举的协作机制是安全监测预警、安全风险评估、信息通报、重大事项会商和应急处置，A项表述完整。","wrongReason":"B：“安全风险评估”重复出现，且漏掉了安全监测预警和信息通报；C：表述不完整，缺少安全风险评估和应急处置等；D：表述不完整，缺少安全监测预警、安全风险评估。","source":"《中华人民共和国密码法》第二十一条","keyPoint":"核心、普通密码协作机制：监测预警、风险评估、信息通报、会商、应急处置。"},{"id":"第一部分基础题-一、密码法律法规-单选题-23","no":23,"kind":"single","part":"第一部分基础题","cat":"一、密码法律法规","type":"单选题","stem":"《中华人民共和国密码法》明确了商用密码检测认证制度，下列说法正确的 是（ ）。","options":[{"key":"A","text":"目前我国采用的是商用密码产品品种和型号审批"},{"key":"B","text":"商用密码服务使用网络关键设备的，实行自愿认证"},{"key":"C","text":"对涉及社会公共利益的商用密码产品实行自愿性检测制度"},{"key":"D","text":"在商用密码检测认证中，自愿检测认证成为主要方式"}],"answer":"D","analysis":"《密码法》确立的商用密码检测认证制度以自愿检测认证为主要方式：对涉及国家安全、国计民生、社会公共利益等特定情形的商用密码产品实行强制性检测认证，其他情形由从业单位自愿申请。因此D项正确。A项的产品品种和型号审批是《商用密码管理条例》修订前的旧制度，已被取消；B项商用密码服务使用网络关键设备的，属于应当强制检测认证的情形，不是自愿认证；C项涉及社会公共利益的商用密码产品实行的是强制性检测，不是自愿性检测，说法都颠倒了。","correctReason":"在商用密码检测认证体系下，自愿检测认证是主要方式，强制性检测认证适用于特定情形。","wrongReason":"A：商用密码产品品种和型号审批制度已经取消，不是现行做法；B：使用网络关键设备的商用密码服务属于强制检测认证范围，不是自愿认证；C：涉及社会公共利益的商用密码产品实行强制性检测，而非自愿性检测。","source":"《中华人民共和国密码法》第二十五条","keyPoint":"商用密码检测认证以自愿为主，特定情形强制。"},{"id":"第一部分基础题-一、密码法律法规-单选题-24","no":24,"kind":"single","part":"第一部分基础题","cat":"一、密码法律法规","type":"单选题","stem":"根据《中华人民共和国密码法》，商用密码应用安全性评估应当与（ ）、 网络安全等级测评制度相衔接，避免重复评估、测评。","options":[{"key":"A","text":"关键信息基础设施国家安全审查"},{"key":"B","text":"网络安全风险评估"},{"key":"C","text":"关键信息基础设施安全检测评估"},{"key":"D","text":"网络安全检测、认证"}],"answer":"C","analysis":"《密码法》规定，商用密码应用安全性评估应当与关键信息基础设施安全检测评估、网络安全等级测评制度相衔接，避免重复评估、测评。也就是说密评不是另起一套，而是与已有的安全检测评估、等级测评相互衔接、结果互认。网络安全风险评估、国家安全审查、网络安全检测认证都不是该条并列衔接的对象，选项名称虽相近，但法条用语要与“网络安全等级测评”并列记忆。","correctReason":"法条明确商用密码应用安全性评估与关键信息基础设施安全检测评估、网络安全等级测评制度相衔接。","wrongReason":"A：关键信息基础设施国家安全审查是另一项制度，不是本条规定的衔接对象；B：网络安全风险评估与法条用语不符；D：网络安全检测、认证不是该条并列的衔接制度。","source":"《中华人民共和国密码法》第二十六条","keyPoint":"密评与关基安全检测评估、网络安全等级测评相衔接。"},{"id":"第一部分基础题-一、密码法律法规-单选题-25","no":25,"kind":"single","part":"第一部分基础题","cat":"一、密码法律法规","type":"单选题","stem":"《中华人民共和国密码法》规定了关键信息基础设施商用密码使用国家安全 审查制度，关于这一制度，下列说法正确的是（ ）。","options":[{"key":"A","text":"该制度是《中华人民共和国网络安全法》规定的网络安全审查的一部分"},{"key":"B","text":"该制度由国家安全部门单独落实"},{"key":"C","text":"该制度设计初衷主要是维护关键信息基础设施运营者的利益"},{"key":"D","text":"该制度与《中华人民共和国国家安全法》规定的国家安全审查制度是两个独立 制度"}],"answer":"A","analysis":"《密码法》规定，关键信息基础设施应当依法开展商用密码应用安全性评估，对其中涉及国家安全、社会公共利益的商用密码产品和服务，实行国家安全审查。这项审查是《网络安全法》确立的网络安全审查制度的组成部分，与关键信息基础设施安全保护制度配套，而不是一套孤立的新制度。它由密码管理部门会同有关部门落实，并非国家安全部门单独实施；其立法目的是维护国家安全和社会公共利益，不是维护运营者自身利益。","correctReason":"密码法规定的关键信息基础设施商用密码国家安全审查，属于《网络安全法》网络安全审查制度的一部分。","wrongReason":"B：该制度由密码管理部门会同有关部门落实，不是国家安全部门单独实施；C：立法初衷是维护国家安全和社会公共利益，而非运营者利益；D：它与国家安全法上的国家安全审查制度不是彼此独立的平行制度，而是网络安全审查制度的组成部分。","source":"《中华人民共和国密码法》第二十七条、第三十条","keyPoint":"关基商用密码国家安全审查＝网络安全审查制度的组成部分。"},{"id":"第一部分基础题-一、密码法律法规-单选题-26","no":26,"kind":"single","part":"第一部分基础题","cat":"一、密码法律法规","type":"单选题","stem":"某公民从境外购买了一台个人使用的加密手机，该手机采用的商用密码属于 大众消费类产品范畴。根据《中华人民共和国密码法》的规定，关于该手机所采 用商用密码的进口管理，下列哪一说法是正确的（ ）。","options":[{"key":"A","text":"必须取得进口许可后方可进口"},{"key":"B","text":"不实行进口许可制度"},{"key":"C","text":"由海关自由裁量是否放行"},{"key":"D","text":"仅需向密码管理部门备案即可"}],"answer":"B","analysis":"《密码法》对大众消费类产品所采用的商用密码不实行进口许可和出口管制。个人自用加密手机属于典型的大众消费类产品，其进口不需要取得进口许可。需要进口许可的是涉及国家安全、社会公共利益且具有加密保护功能的商用密码；海关自由裁量、仅向密码管理部门备案等说法都没有法律依据。判断的关键是分清“管制对象”和“大众消费品”两类。","correctReason":"大众消费类产品所采用的商用密码不实行进口许可，个人自用加密手机因此无需进口许可。","wrongReason":"A：进口许可只适用于特定范围的商用密码，不适用于大众消费类产品；C：海关依法依规监管，不存在“自由裁量是否放行”的规定；D：法律未对个人自用加密产品设定备案义务。","source":"《中华人民共和国密码法》第二十八条","keyPoint":"大众消费类商用密码不实行进口许可和出口管制。"},{"id":"第一部分基础题-一、密码法律法规-单选题-27","no":27,"kind":"single","part":"第一部分基础题","cat":"一、密码法律法规","type":"单选题","stem":"根据《中华人民共和国密码法》，以下关于商用密码检测、认证体系和商用 密码检测、认证机构管理的表述，正确的是（ ）。","options":[{"key":"A","text":"商用密码检测认证中，自愿检测认证是主要方式"},{"key":"B","text":"商用密码检测认证中，强制检测认证是主要方式"},{"key":"C","text":"商用密码检测、认证机构资质由国家密码管理局单独管理"},{"key":"D","text":"商用密码检测、认证机构可以取得统一的商用密码检测认证机构资质"}],"answer":"A","analysis":"《密码法》规定，商用密码检测、认证机构应当依法取得相关资质。在检测认证体系中，自愿检测认证是主要方式，强制性检测认证只适用于涉及国家安全、国计民生、社会公共利益等特定情形，所以A项正确、B项错误。C项说资质由国家密码管理局单独管理不准确，检测机构资质和认证机构资质分属不同管理体系；D项“统一的检测认证机构资质”也不存在，检测与认证是两类不同资质，不能合为一种。","correctReason":"《密码法》确立的商用密码检测认证制度以自愿检测认证为主要方式。","wrongReason":"B：强制性检测认证只针对特定情形，不是主要方式；C：检测机构与认证机构资质管理渠道不同，不是由国家密码管理局单独管理；D：检测资质和认证资质是两类资质，不存在“统一的检测认证机构资质”。","source":"《中华人民共和国密码法》第二十五条","keyPoint":"自愿检测认证为主；检测资质与认证资质分开管理。"},{"id":"第一部分基础题-一、密码法律法规-单选题-28","no":28,"kind":"single","part":"第一部分基础题","cat":"一、密码法律法规","type":"单选题","stem":"根据《中华人民共和国密码法》，国家密码管理部门对采用密码技术从事电 子政务电子认证服务的机构进行认定，关于电子政务电子认证服务机构的认定， 下列说法正确的是（ ）。","options":[{"key":"A","text":"一定程度上与电子认证服务机构存在重复许可"},{"key":"B","text":"与电子认证服务机构的审批对象一致"},{"key":"C","text":"可适用于电子商务领域的电子认证服务机构"},{"key":"D","text":"应当采用行政许可的方式对服务机构的电子政务电子认证服务能力进行评估"}],"answer":"D","analysis":"电子政务电子认证服务机构认定属于《密码法》确立的行政许可事项，密码管理部门通过行政许可的方式对服务机构从事电子政务电子认证服务的能力进行评估，D项正确。它与工信部依据《电子签名法》实施的电子认证服务许可在适用领域上不同——一个面向政务活动，一个面向电子商务等活动，因此不是重复许可，审批对象也不完全一致，更不能把该认定直接适用于电子商务领域的机构。","correctReason":"该认定是行政许可事项，由密码管理部门以行政许可方式对机构的电子政务电子认证服务能力进行评估。","wrongReason":"A：两者适用领域不同，不构成重复许可；B：电子政务电子认证服务机构与电子认证服务机构的审批对象并不一致；C：该认定针对电子政务领域，不能适用于电子商务领域的电子认证服务机构。","source":"《中华人民共和国密码法》第二十九条","keyPoint":"电子政务电子认证服务机构认定＝行政许可，只面向政务领域。"},{"id":"第一部分基础题-一、密码法律法规-单选题-29","no":29,"kind":"single","part":"第一部分基础题","cat":"一、密码法律法规","type":"单选题","stem":"根据《中华人民共和国密码法》，关于电子政务电子认证服务机构认定的审 批对象，下列说法正确的是（ ）。","options":[{"key":"A","text":"只有经营性企业"},{"key":"B","text":"不包括提供公共服务的事业单位"},{"key":"C","text":"只包括提供公共服务的事业单位"},{"key":"D","text":"包括经营性企业和提供公共服务的事业单位"}],"answer":"D","analysis":"《密码法》规定，国家密码管理部门对采用商用密码技术从事电子政务电子认证服务的机构进行认定。这里的机构既包括经营性企业，也包括提供公共服务的事业单位，只要符合法定条件、具备相应服务能力即可申请认定。A、C两项各说一半，B项直接排除事业单位，都不准确。本题的考点就是认定对象不区分企业性质，关键在于是否从事电子政务电子认证服务。","correctReason":"认定对象既包括经营性企业，也包括提供公共服务的事业单位，范围上不作性质区分。","wrongReason":"A：只列经营性企业，遗漏了提供公共服务的事业单位；B：事业单位同样可以申请认定，不存在排除；C：只列事业单位，遗漏了经营性企业，均属片面。","source":"《中华人民共和国密码法》第二十九条","keyPoint":"认定对象含经营性企业和提供公共服务的事业单位。"},{"id":"第一部分基础题-一、密码法律法规-单选题-30","no":30,"kind":"single","part":"第一部分基础题","cat":"一、密码法律法规","type":"单选题","stem":"根据《中华人民共和国密码法》，关键信息基础设施运营者未按照要求使用 商用密码导致危害网络安全后果的，对直接负责的主管人员处以罚款，下列不属 于“直接负责的主管人员”的是（ ）。","options":[{"key":"A","text":"实施违法行为中起决定作用的人"},{"key":"B","text":"实施违法行为中起指挥作用的人"},{"key":"C","text":"授意实施违法行为的人"},{"key":"D","text":"具体实施违法行为并起较大作用的人"}],"answer":"D","analysis":"对关键信息基础设施运营者未按要求使用商用密码并造成危害网络安全后果的，法律除处罚单位外，还可对直接负责的主管人员处以罚款。“直接负责的主管人员”是指在违法行为中起决定、批准、授意、纵容、指挥等作用的人员，属于负有领导、决策责任的角色。具体实施违法行为并起较大作用的人，通常被认定为“其他直接责任人员”，而不是主管人员，因此D项不属于该范围。","correctReason":"直接负责的主管人员是起决定、批准、授意、指挥作用的人员，具体实施者属于其他直接责任人员。","wrongReason":"A：起决定作用的人属于直接负责的主管人员；B：起指挥作用的人属于直接负责的主管人员；C：授意实施违法行为的人属于直接负责的主管人员。","source":"《中华人民共和国密码法》第三十七条","keyPoint":"主管人员＝决策、授意、指挥者；具体实施者是其他直接责任人员。"},{"id":"第一部分基础题-一、密码法律法规-单选题-31","no":31,"kind":"single","part":"第一部分基础题","cat":"一、密码法律法规","type":"单选题","stem":"根据《中华人民共和国密码法》规定，国家密码管理部门对采用商用密码技 术从事电子政务电子认证服务的机构进行认定，并会同有关部门负责政务活动中 使用（ ）的管理。","options":[{"key":"A","text":"电子签名和数据电文"},{"key":"B","text":"电子文档和电子证照"},{"key":"C","text":"电子印章和数字证书"},{"key":"D","text":"电子档案和电子合同"}],"answer":"A","analysis":"《密码法》第二十九条把两件事写在同一句里：一是国家密码管理部门对采用商用密码技术从事电子政务电子认证服务的机构进行认定，二是该部门会同有关部门负责政务活动中使用电子签名、数据电文的管理。电子签名、数据电文是《电子签名法》确立的政务活动电子化基本要素，与电子认证服务直接衔接，所以由密码管理部门会同有关部门管理。其余选项中的电子证照、电子印章、电子档案、电子合同虽也是政务信息化常用词，但不是本条的管理对象用语。","correctReason":"法条明确，国家密码管理部门会同有关部门负责政务活动中使用电子签名、数据电文的管理。","wrongReason":"B：电子文档、电子证照是政务信息化的业务载体，法条未将其列为该条的管理对象；C：电子印章、数字证书是电子认证服务的载体和成果，不是本条列举的管理对象；D：电子档案、电子合同同样属于业务文书范畴，与法条用语不符。","source":"《中华人民共和国密码法》第二十九条","keyPoint":"政务活动中电子签名、数据电文由密码管理部门会同有关部门管理。"},{"id":"第一部分基础题-一、密码法律法规-单选题-32","no":32,"kind":"single","part":"第一部分基础题","cat":"一、密码法律法规","type":"单选题","stem":"某科技自媒体发文举报称，一家社交软件公司在其即时通讯产品中未经批准 违规使用商用密码。省密码管理部门依法应当首先采取的行动是（ ）。","options":[{"key":"A","text":"直接约谈公司法人代表，要求其立即下架产品"},{"key":"B","text":"告知举报人这属于民事纠纷，建议向法院起诉"},{"key":"C","text":"对举报内容进行登记，组织开展调查核实，根据核实结果依法处理"},{"key":"D","text":"以举报不实为由不予受理，因为商用密码无需监管"}],"answer":"C","analysis":"《商用密码管理条例》第四十九条规定，任何单位或者个人有权向密码管理部门和有关部门举报违反本条例的行为，接到举报的部门应当及时核实、处理，并为举报人保密。因此接到举报后的第一顺位动作是受理登记、组织调查核实，再依据核实结果决定是否依法处理。商用密码活动依法接受密码管理部门的事中事后监管，既不属于民事纠纷，也不存在“无需监管”之说。本题考的是行政执法中先调查、后处理的程序要求。","correctReason":"条例要求密码管理部门接到举报后及时核实、处理，故应先登记线索、调查核实，再根据核实结果依法处理。","wrongReason":"A：未经调查核实即约谈并要求下架，缺乏事实和法律依据，下架也非法定处理措施；B：商用密码监管属行政管理事项，不是民事纠纷，不存在告知举报人另行起诉的处理方式；D：商用密码依法受密码管理部门监管，以“举报不实”为由不予受理并否认监管职责，与条例规定相悖。","source":"《商用密码管理条例》第四十九条","keyPoint":"举报应先核实、后依法处理，不得未查先处或推诿。"},{"id":"第一部分基础题-一、密码法律法规-单选题-33","no":33,"kind":"single","part":"第一部分基础题","cat":"一、密码法律法规","type":"单选题","stem":"依据《中华人民共和国密码法》涉及国家安全、国计民生、社会公共利益的 商用密码产品，在销售或提供前必须满足的法定要求是（ ）。","options":[{"key":"A","text":"通过企业自检并公开声明符合标准"},{"key":"B","text":"列入网络关键设备和网络安全专用产品目录，由具备资格的机构检测认证合格"},{"key":"C","text":"获得国际标准化组织（ISO）认证"},{"key":"D","text":"获得地方市场监管部门认可并备案"}],"answer":"B","analysis":"《密码法》第二十六条与《商用密码管理条例》第二十条对涉及国家安全、国计民生、社会公共利益的商用密码产品设定了前置性法定要求：先依法列入网络关键设备和网络安全专用产品目录，再由具备资格的商用密码检测、认证机构检测认证合格，之后方可销售或者提供。这是一项强制性准入要求，不能以企业自检、公开声明或境外认证替代。干扰点在于把“自愿接受检测认证”的一般原则套用到这类特殊产品上。","correctReason":"对涉及国家安全、国计民生、社会公共利益的商用密码产品，法定要求是列入网络关键设备和网络安全专用产品目录，并由具备资格的机构检测认证合格。","wrongReason":"A：企业自检并公开声明只是从业单位自我声明公开标准的要求，不能替代法定的目录管理和检测认证；C：ISO认证是国际组织认证，不是我国法律规定的准入条件；D：地方市场监管部门认可备案没有法定依据，目录和检测认证制度由国家层面确定。","source":"《中华人民共和国密码法》第二十六条、《商用密码管理条例》第二十条","keyPoint":"此类商用密码产品须先入目录、再经检测认证合格方可销售。"},{"id":"第一部分基础题-一、密码法律法规-单选题-34","no":34,"kind":"single","part":"第一部分基础题","cat":"一、密码法律法规","type":"单选题","stem":"在《商用密码管理条例》中，下列对于“商用密码”的描述正确的是（ ）。","options":[{"key":"A","text":"商用密码是指对涉及国家秘密的信息进行加密保护所使用的密码技术和密码 产品"},{"key":"B","text":"商用密码是指采用特定变换的方法对不属于国家秘密的信息等进行加密保护、 安全认证的技术、产品和服务"},{"key":"C","text":"商用密码仅指密码产品，不包括技术和服务"},{"key":"D","text":"商用密码是指可以商用的密码"}],"answer":"B","analysis":"《商用密码管理条例》第二条第二款给出了商用密码的法定定义：采用特定变换的方法对不属于国家秘密的信息等进行加密保护、安全认证的技术、产品和服务。定义有三个要点：技术手段是“特定变换”，保护对象是“不属于国家秘密的信息”，外延包括技术、产品和服务三类。干扰项分别错在保护对象（国家秘密）、外延范围（只讲产品）和概念通俗化（可以商用的密码）三个方面。","correctReason":"该表述与《商用密码管理条例》第二条第二款对商用密码的法定定义完全一致。","wrongReason":"A：对涉及国家秘密的信息进行加密保护使用的是核心密码、普通密码，不是商用密码；C：商用密码包括技术、产品和服务三类，该项不当缩小了外延；D：“可以商用的密码”是望文生义的生活化理解，不是法律定义。","source":"《商用密码管理条例》第二条","keyPoint":"商用密码是对非国家秘密信息做加密保护、安全认证的技术、产品和服务。"},{"id":"第一部分基础题-一、密码法律法规-单选题-35","no":35,"kind":"single","part":"第一部分基础题","cat":"一、密码法律法规","type":"单选题","stem":"根据《商用密码管理条例》规定，关于商用密码检测认证，下列选项中表述 正确的是（ ）。","options":[{"key":"A","text":"商用密码涉及网络安全，商用密码活动必须接受商用密码检测认证"},{"key":"B","text":"通过商用密码检测认证后，从事商用密码相关活动将不再需要许可"},{"key":"C","text":"商用密码检测认证机构应当经国家密码管理部门认定"},{"key":"D","text":"商用密码检测认证机构应当取得相应资质"}],"answer":"D","analysis":"《密码法》第二十五条第二款规定，商用密码检测、认证机构应当依法取得相关资质；《商用密码管理条例》第十三条、第十八条进一步区分了两类机构取得资质的条件和程序。检测认证以自愿为原则，只有涉及国家安全、国计民生、社会公共利益的特定产品和关键信息基础设施领域才是强制要求，故“必须接受”的说法不成立。同时检测认证与行政许可、机构认定分属不同制度，取得认证并不能免除依法应当取得的许可。","correctReason":"商用密码检测、认证机构应当依法取得相应资质，这是法律对检测认证机构主体资格的统一要求。","wrongReason":"A：检测认证以自愿为原则，并非所有商用密码活动都必须接受检测认证；B：检测认证与许可、认定是并行制度，取得认证不能替代依法应当取得的许可；C：经国家密码管理部门认定取得资质的是商用密码检测机构和电子政务电子认证服务机构，商用密码认证机构资质依条例第十八条向国务院市场监督管理部门申请。","source":"《中华人民共和国密码法》第二十五条、《商用密码管理条例》第十三条、第十八条","keyPoint":"检测、认证机构均须依法取得资质，取得认证不等于免许可。"},{"id":"第一部分基础题-一、密码法律法规-单选题-36","no":36,"kind":"single","part":"第一部分基础题","cat":"一、密码法律法规","type":"单选题","stem":"某商用密码标准制定工作组成员在参与标准制定过程中，需要明确各类标准 的制定主体和相互关系。根据《商用密码管理条例》，以下表述错误的是（ ）。","options":[{"key":"A","text":"国务院标准化行政主管部门和国家密码管理部门依据各自职责，组织制定商用 密码国家标准、行业标准"},{"key":"B","text":"国家密码管理部门对商用密码团体标准的制定进行规范、引导和监督"},{"key":"C","text":"其他领域的标准涉及商用密码的，应当与商用密码国家标准、行业标准保持协 调"},{"key":"D","text":"商用密码团体标准的制定需要自行监督"}],"answer":"D","analysis":"本题要求选出“表述错误”的一项，考的是《商用密码管理条例》第十条对标准化工作的分工。该条规定：国务院标准化行政主管部门和国家密码管理部门依据各自职责，组织制定商用密码国家标准、行业标准，并对商用密码团体标准的制定进行规范、引导和监督；其他领域的标准涉及商用密码的，应当与商用密码国家标准、行业标准保持协调。团体标准虽由社会团体制定发布，但其制定过程要接受密码管理部门的规范、引导和监督，而不是自行监督，故D项表述错误。","correctReason":"条例第十条明确对商用密码团体标准的制定进行规范、引导和监督是密码管理部门的职责，“自行监督”与该条不符。","wrongReason":"A：与条例第十条关于国务院标准化行政主管部门和国家密码管理部门依据各自职责组织制定商用密码国家标准、行业标准的规定一致；B：与条例第十条关于密码管理部门对团体标准制定进行规范、引导和监督的规定一致；C：与条例第十条第三款关于其他领域标准应与商用密码国家标准、行业标准保持协调的规定一致。","source":"《商用密码管理条例》第十条","keyPoint":"商用密码团体标准的制定由密码管理部门规范、引导和监督。"},{"id":"第一部分基础题-一、密码法律法规-单选题-37","no":37,"kind":"single","part":"第一部分基础题","cat":"一、密码法律法规","type":"单选题","stem":"根据《商用密码管理条例》规定，取得商用密码认证机构资质，应当符合相 应程序，下列选项中表述正确的是（ ）。","options":[{"key":"A","text":"应当向国家密码管理部门提出书面申请"},{"key":"B","text":"国家密码管理部门审查资质申请时，应当征求国务院市场监督管理部门意见"},{"key":"C","text":"应当向国务院市场监督管理部门提出书面申请"},{"key":"D","text":"国务院市场监督管理部门应当独立审查资质申请"}],"answer":"C","analysis":"《商用密码管理条例》第十八条第二款规定，申请商用密码认证机构资质应当向国务院市场监督管理部门提出书面申请；同条第三款还规定，国务院市场监督管理部门审查该申请时应当征求国家密码管理部门的意见。这与商用密码检测机构资质、电子政务电子认证服务机构资质“向国家密码管理部门提出书面申请”的程序不同，是本题最主要的易混点。抓住“认证机构归市场监管部门受理、检测与电子政务电子认证机构归密码管理部门”这条分工即可。","correctReason":"条例第十八条第二款明确，申请商用密码认证机构资质应当向国务院市场监督管理部门提出书面申请。","wrongReason":"A：向国家密码管理部门提出书面申请，是商用密码检测机构资质和电子政务电子认证服务机构资质的程序，受理主体错位；B：征求意见的方向相反，法条是国务院市场监督管理部门审查时征求国家密码管理部门的意见；D：法条要求征求意见而非独立审查，“独立审查”与第十八条第三款不符。","source":"《商用密码管理条例》第十八条","keyPoint":"商用密码认证机构资质向国务院市场监督管理部门申请。"},{"id":"第一部分基础题-一、密码法律法规-单选题-38","no":38,"kind":"single","part":"第一部分基础题","cat":"一、密码法律法规","type":"单选题","stem":"电子政务电子认证服务机构因出具虚假认证结论被处罚，依据《商用密码管 理条例》，可能面临的最高处罚是（ ）。","options":[{"key":"A","text":"10 万元罚款"},{"key":"B","text":"没收违法所得"},{"key":"C","text":"吊销认证机构资质"},{"key":"D","text":"追究法人刑事责任"}],"answer":"C","analysis":"《商用密码管理条例》对电子政务电子认证服务机构的违法行为设定了递进式行政处罚：责令改正或者停止违法行为、给予警告、没收违法所得、罚款，情节严重的责令停业整顿，直至吊销电子政务电子认证服务机构资质。四个选项中，吊销资质是处罚种类里最重的一档，后果是直接剥夺其继续从事电子政务电子认证服务的资格。罚款和没收违法所得属于较轻的财产罚，刑事责任以构成犯罪为前提，且不属于本条例设定的行政处罚种类。","correctReason":"该条例对情节严重的此类违法行为规定了责令停业整顿、直至吊销资质，吊销资质是选项中最重的处罚。","wrongReason":"A：10万元罚款处于罚款幅度中的较低档位，不属于最高处罚；B：没收违法所得是与警告并列的基础性财产罚，严厉程度有限；D：刑事责任以构成犯罪为前提，也不属于本条例设定的行政处罚种类，条例并未规定笼统追究法人刑事责任的处罚方式。","source":"《商用密码管理条例》第五十五条、第六十六条","keyPoint":"情节严重可责令停业整顿，直至吊销电子政务电子认证机构资质。"},{"id":"第一部分基础题-一、密码法律法规-单选题-39","no":39,"kind":"single","part":"第一部分基础题","cat":"一、密码法律法规","type":"单选题","stem":"根据《商用密码管理条例》规定，关于商用密码标准化，下列选项中表述正 确的是（ ）。","options":[{"key":"A","text":"商用密码中国标准不能与国外标准转化"},{"key":"B","text":"国家密码管理部门独立负责制定商用密码国家标准"},{"key":"C","text":"国家密码管理部门应当对商用密码标准的实施进行监督检查"},{"key":"D","text":"为促进商用密码技术发展，其他领域的标准如果涉及商用密码，可以不与商用 密码行业标准保持协调"}],"answer":"B","analysis":"本题考商用密码标准化制度，涉及标准制定主体、国际标准转化、标准之间协调以及标准实施监督几个层面。按《商用密码管理条例》第十条，商用密码国家标准、行业标准由国家密码管理部门组织制定，国家推动商用密码中国标准与国外标准之间的转化运用，其他领域的标准涉及商用密码的应当与商用密码国家标准、行业标准保持协调。A项否定中外标准转化、D项否定标准协调要求，均为明显的错误表述，C项讲的是标准实施环节的监督检查，与本题所问的制定层面不属同一问题。","correctReason":"该项与《商用密码管理条例》第十条关于商用密码国家标准由密码管理部门组织制定的制度安排一致。","wrongReason":"A：条例第十条第二款明确推进商用密码中国标准与国外标准之间的转化运用，“不能转化”的表述与该款不符；C：该项讲的是商用密码标准实施环节的监督检查，不是本题所问的标准制定层面的表述；D：条例第十条第三款要求其他领域标准涉及商用密码时与商用密码国家标准、行业标准保持协调，“可以不协调”错误。","source":"《商用密码管理条例》第十条","keyPoint":"商用密码国家标准由密码管理部门组织制定，并推动中外标准转化。"},{"id":"第一部分基础题-一、密码法律法规-单选题-40","no":40,"kind":"single","part":"第一部分基础题","cat":"一、密码法律法规","type":"单选题","stem":"依据《商用密码管理条例》，大众消费类密码产品（如手机加密芯片）在进 出口时适用何种管理制度？（ ）","options":[{"key":"A","text":"需申请进口许可证"},{"key":"B","text":"需通过国家安全审查"},{"key":"C","text":"不实行进口许可和出口管制"},{"key":"D","text":"仅需向海关报备"}],"answer":"C","analysis":"《商用密码管理条例》第三十一条建立的是清单式进出口管理制度：只有列入商用密码进口许可清单、出口管制清单的商用密码才需要许可或者管制，且该条第三款明确大众消费类产品所采用的商用密码不实行进口许可和出口管制制度，《密码法》第二十八条也有相同规定。手机加密芯片属于大众消费类产品所采用的商用密码，不在清单管理范围内。干扰项把关键信息基础设施领域的安全审查、海关报关等制度误搬到了大众消费品上。","correctReason":"《密码法》第二十八条和《商用密码管理条例》第三十一条均明确，大众消费类产品所采用的商用密码不实行进口许可和出口管制制度。","wrongReason":"A：进口许可只针对列入进口许可清单的商用密码，大众消费类产品所采用的商用密码被明确排除在外；B：国家安全审查针对关键信息基础设施运营者采购可能影响国家安全的网络产品和服务，与大众消费品进出口无关；D：条例未规定“向海关报备”制度，交验进出口许可证只适用于清单范围内的商用密码。","source":"《商用密码管理条例》第三十一条、《中华人民共和国密码法》第二十八条","keyPoint":"大众消费类产品所采用的商用密码不实行进出口许可和管制。"},{"id":"第一部分基础题-一、密码法律法规-多选题-1","no":1,"kind":"multi","part":"第一部分基础题","cat":"一、密码法律法规","type":"多选题","stem":"某大型军工企业集团正在建设一套涉密信息系统，用于存储和处理国家秘密 信息。该集团信息安全部门在制定密码应用方案时，需要依据《中华人民共和国 密码法》的相关规定进行规划。以下关于该涉密信息系统密码使用的说法，正确 的有（ ）","options":[{"key":"A","text":"该信息系统应当使用核心密码或普通密码进行加密保护和安全认证"},{"key":"B","text":"核心密码保护信息的最高密级为绝密级，普通密码保护信息的最高密级为机密 级"},{"key":"C","text":"该企业可以自主选择商用密码产品来保护系统中的国家秘密信息"},{"key":"D","text":"核心密码、普通密码属于国家秘密，由密码管理部门实行严格统一管理"}],"answer":"ABD","analysis":"本题考《密码法》确立的分类管理与涉密信息系统用密规则。该企业系统存储处理国家秘密，属涉密信息系统，依法必须使用核心密码或普通密码进行加密保护和安全认证，不得用商用密码替代，故A对、C错。B的密级划分是法定区分：核心密码保护信息的最高密级为绝密级，普通密码为机密级。D点出二者本身属于国家秘密，由密码管理部门严格统一管理。易混点：商用密码只能用于保护不属于国家秘密的信息。","correctReason":"涉密信息系统必须使用核心密码或普通密码加密保护和安全认证，二者属国家秘密且密级、管理体制均有法定划分。","wrongReason":"C：商用密码用于保护不属于国家秘密的信息，不能用于保护涉密信息系统中的国家秘密信息，违反了涉密系统用密要求。","source":"《中华人民共和国密码法》第七条、第十四条","keyPoint":"涉密系统只能用核心/普通密码；核心=绝密级，普通=机密级。"},{"id":"第一部分基础题-一、密码法律法规-多选题-2","no":2,"kind":"multi","part":"第一部分基础题","cat":"一、密码法律法规","type":"多选题","stem":"某高校计算机学院正在组织学生学习《中华人民共和国密码法》，教师在课 堂上讲解密码的分类。以下关于密码分类的说法，正确的有（ ）","options":[{"key":"A","text":"国家对密码实行分类管理"},{"key":"B","text":"密码分为核心密码、普通密码和商用密码"},{"key":"C","text":"核心密码、普通密码属于国家秘密"},{"key":"D","text":"商用密码用于保护不属于国家秘密的信息"}],"answer":"ABCD","analysis":"本题考《密码法》关于密码分类的基本制度。国家对密码实行分类管理，按保护对象不同把密码分为核心密码、普通密码和商用密码三类：前两类保护国家秘密信息，本身也属于国家秘密；商用密码用于保护不属于国家秘密的信息。四个选项正好串成完整的分类逻辑链条，无一处错误。记忆主线是：分类管理→三分法→密级归属→适用对象。","correctReason":"四项均是对《密码法》密码分类制度的准确表述：分类管理、三分法、前两类属国家秘密、商用密码保护非国家秘密信息。","wrongReason":"本题四个选项均为正确表述，无错误选项。","source":"《中华人民共和国密码法》第六条","keyPoint":"密码三分法：核心、普通、商用；前者护密、后者护非密。"},{"id":"第一部分基础题-一、密码法律法规-多选题-3","no":3,"kind":"multi","part":"第一部分基础题","cat":"一、密码法律法规","type":"多选题","stem":"商用密码检测机构出现下列哪些情形，依据《商用密码管理条例》可能被吊 销资质？（ ）","options":[{"key":"A","text":"超出批准范围检测"},{"key":"B","text":"检测数据虚假"},{"key":"C","text":"未参与国际标准制定"},{"key":"D","text":"拒不报送实施情况"}],"answer":"AB","analysis":"本题考商用密码检测机构资质被吊销的情形。检测机构资质被吊销，通常源于严重违反检测执业规范：超出批准范围检测、出具虚假检测数据或结论，都会直接动摇检测公信力，属可吊销资质的情形。C「未参与国际标准制定」不是检测机构的法定义务，与资质无关。D「拒不报送实施情况」一般先责令改正、警告、罚款，题干问「可能被吊销资质」的情形，故不选。答案以官方为准。","correctReason":"超出批准范围检测、检测数据虚假属于检测机构严重违法执业行为，依据《商用密码管理条例》可能被吊销资质。","wrongReason":"C：参与国际标准制定不是商用密码检测机构的法定资质条件，与吊销资质无因果；D：拒不报送实施情况一般先责令改正、给予警告或罚款，不属本题所列吊销资质情形。","source":"《商用密码管理条例》（2023年修订）","keyPoint":"检测机构吊销资质两类事由：超范围检测、数据造假。"},{"id":"第一部分基础题-一、密码法律法规-多选题-4","no":4,"kind":"multi","part":"第一部分基础题","cat":"一、密码法律法规","type":"多选题","stem":"新时期我国商用密码发展的主要任务包括（ ）。","options":[{"key":"A","text":"深化商用密码管理改革"},{"key":"B","text":"强化商用密码专控管理"},{"key":"C","text":"强化商用密码自主创新"},{"key":"D","text":"推进商用密码合规正确有效应用"}],"answer":"ACD","analysis":"本题考新时期商用密码发展的主要任务，取材于国家商用密码发展的政策部署。主线是「管理改革＋自主创新＋合规应用」三位一体：深化改革解决管理体制机制问题，自主创新解决算法和产品自主可控问题，推进合规正确有效应用解决用得上、用得对的问题。B是干扰项，「专控管理」是对核心密码、普通密码的管理思路，不是商用密码的发展任务；商用密码走的是市场化、法治化的路子。","correctReason":"深化管理改革、强化自主创新、推进合规正确有效应用，是新时期商用密码发展的三大主要任务。","wrongReason":"B：专控管理针对的是核心密码、普通密码等国家秘密事项，商用密码实行市场化管理，不存在「强化商用密码专控管理」的提法。","source":"国家商用密码发展相关政策部署（如「十四五」商用密码发展规划）","keyPoint":"商用密码任务：深化改革、自主创新、合规有效应用。"},{"id":"第一部分基础题-一、密码法律法规-多选题-5","no":5,"kind":"multi","part":"第一部分基础题","cat":"一、密码法律法规","type":"多选题","stem":"某关键信息基础设施运营者未按照要求开展商用密码应用安全性评估，导致 因商用密码产品存在安全漏洞而产生大规模的用户数据泄露，根据《中华人民共 和国密码法》，针对该行为，下列正确的表述有（ ）。","options":[{"key":"A","text":"对其进行警告"},{"key":"B","text":"吊销相关资质"},{"key":"C","text":"对关键信息基础设施的运营者处以罚款"},{"key":"D","text":"对直接负责的主管人员处以罚款"}],"answer":"CD","analysis":"本题考关键信息基础设施运营者未按要求开展密评的法律责任。按《密码法》第三十七条，此类行为先由密码管理部门责令改正、给予警告；拒不改正或导致危害网络安全等后果的，对运营者处十万元以上一百万元以下罚款，对直接负责的主管人员处一万元以上十万元以下罚款。题干已明确「导致大规模用户数据泄露」，属造成严重后果，因此单位与责任人都要罚。A的警告是一般情形的前置处理；B「吊销相关资质」不是该条处罚种类。","correctReason":"造成严重后果的，既要对关键信息基础设施运营者处以罚款，也要对直接负责的主管人员处一万元以上十万元以下罚款。","wrongReason":"A：警告适用于未造成严重后果的一般违法情形，本题已造成严重后果，应处罚款；B：吊销相关资质不属于该违法行为的法定处罚种类。","source":"《中华人民共和国密码法》第三十七条","keyPoint":"未做密评致严重后果：罚单位，也罚直接责任人。"},{"id":"第一部分基础题-一、密码法律法规-多选题-6","no":6,"kind":"multi","part":"第一部分基础题","cat":"一、密码法律法规","type":"多选题","stem":"根据《中华人民共和国密码法》，下列关于我国密码工作管理体制的表述， 正确的有（ ）。","options":[{"key":"A","text":"国家密码管理部门负责管理全国的密码工作"},{"key":"B","text":"县级以上地方各级密码管理部门负责管理本行政区域的密码工作"},{"key":"C","text":"国家机关和涉及密码工作的单位在其职责范围内负责本机关、本单位或者本系 统的密码工作"},{"key":"D","text":"密码工作保护部门负责本行业、本领域的密码工作"}],"answer":"ABC","analysis":"本题考我国密码工作管理体制的三层架构。国家密码管理部门管全国，县级以上地方各级密码管理部门管本行政区域，国家机关和涉及密码工作的单位在职责范围内管本机关、本单位或本系统的密码工作，三者构成纵向到底、横向到边的管理格局。D的错误在于主体表述：「保护部门」不是密码工作管理体制中的法定主体，由其负责本行业、本领域密码工作的说法同样与法条不符，属生造概念。","correctReason":"国家、县级以上地方密码管理部门和机关单位三级职责划分，是《密码法》对密码工作管理体制的法定安排。","wrongReason":"D：法条中没有「密码工作保护部门」这一主体，也不存在由其负责本行业、本领域密码工作的规定。","source":"《中华人民共和国密码法》第四条","keyPoint":"密码管理体制：国家统筹、地方分级、机关单位各负其责。"},{"id":"第一部分基础题-一、密码法律法规-多选题-7","no":7,"kind":"multi","part":"第一部分基础题","cat":"一、密码法律法规","type":"多选题","stem":"某涉及国家秘密的科研院所正在建设新的涉密信息系统，需要按照《中华人 民共和国密码法》的要求使用密码。以下关于核心密码、普通密码使用要求的说 法，正确的有（ ）","options":[{"key":"A","text":"在有线通信中传递的国家秘密信息，应当使用核心密码或普通密码进行加密 保护"},{"key":"B","text":"在无线通信中传递的国家秘密信息，应当使用核心密码或普通密码进行加密 保护"},{"key":"C","text":"存储国家秘密信息的信息系统，应当使用核心密码或普通密码进行安全认证"},{"key":"D","text":"处理国家秘密信息的信息系统，可以使用商用密码替代核心密码"}],"answer":"ABC","analysis":"本题考核心密码、普通密码的使用场景。法律规定：在有线通信、无线通信中传递的国家秘密信息，以及存储、处理国家秘密信息的信息系统，都应当使用核心密码或普通密码进行加密保护、安全认证。A、B、C与法条一一对应。D说可以用商用密码替代核心密码，方向性错误——商用密码的适用对象是不属于国家秘密的信息，涉密场景不能替代。答题关键是抓住「有线、无线、存储处理」三个场景。","correctReason":"有线、无线传递的国家秘密信息和存储、处理国家秘密信息的信息系统，均应使用核心密码或普通密码保护。","wrongReason":"D：商用密码用于保护不属于国家秘密的信息，不能替代核心密码用于国家秘密信息的保护。","source":"《中华人民共和国密码法》第十四条","keyPoint":"涉密三场景：有线、无线、存储处理，都用核心/普通密码。"},{"id":"第一部分基础题-一、密码法律法规-多选题-8","no":8,"kind":"multi","part":"第一部分基础题","cat":"一、密码法律法规","type":"多选题","stem":"某商用密码产品进口企业需要了解商用密码进出口管理的相关规定。根据《中 华人民共和国密码法》及配套规定，以下关于商用密码进出口的说法，正确的有 （ ）","options":[{"key":"A","text":"商用密码进口许可清单由国务院商务主管部门会同国家密码管理部门和海 关总署制定并公布"},{"key":"B","text":"商用密码出口管制清单由国务院商务主管部门会同国家密码管理部门和海 关总署制定并公布"},{"key":"C","text":"大众消费类产品所采用的商用密码不实行进口许可和出口管制制度"},{"key":"D","text":"所有商用密码产品均需取得进口许可方可进口"}],"answer":"ABC","analysis":"本题考商用密码进出口管理制度。密码法确立的是「清单管理＋许可/管制」框架：进口许可清单和出口管制清单，均由国务院商务主管部门会同国家密码管理部门、海关总署制定并公布，故A、B正确。同时法律明确，大众消费类产品所采用的商用密码不实行进口许可和出口管制，以免影响普通消费品贸易，故C正确。D把范围说成「所有商用密码产品均需进口许可」，与清单管理和消费类豁免的规定相冲突。","correctReason":"两类清单由商务主管部门会同密码管理部门、海关总署制定公布，且大众消费类产品所用商用密码豁免进出口许可与管制。","wrongReason":"D：商用密码进出口实行清单管理，只有列入清单的才需许可，且大众消费类产品所采用的商用密码不实行进口许可和出口管制。","source":"《中华人民共和国密码法》第二十八条","keyPoint":"进出口清单三部门联发，大众消费类产品豁免。"},{"id":"第一部分基础题-一、密码法律法规-多选题-9","no":9,"kind":"multi","part":"第一部分基础题","cat":"一、密码法律法规","type":"多选题","stem":"根据《中华人民共和国密码法》，以下属于核心密码和普通密码工作机构的 密码活动的有（ ）。","options":[{"key":"A","text":"密码科研"},{"key":"B","text":"密码生产、服务"},{"key":"C","text":"密码进出口"},{"key":"D","text":"密码使用、销毁"}],"answer":"ABD","analysis":"本题考核心密码、普通密码工作机构的密码活动范围。法律列举的是核心密码、普通密码的科研、生产、服务、检测、装备、使用和销毁等工作，这些都由国家统一管理或由指定机构承担，故科研、生产服务、使用销毁均属其密码活动。C「密码进出口」不在此列——进出口管理针对的是商用密码，与核心密码、普通密码的管理体制无关，属于把商用密码制度混进来。","correctReason":"核心密码、普通密码工作机构的密码活动包括科研、生产、服务、使用、销毁等环节，不含密码进出口。","wrongReason":"C：密码进出口属于商用密码管理制度的内容，不是核心密码、普通密码工作机构的密码活动。","source":"《中华人民共和国密码法》第十五条","keyPoint":"核心/普通密码活动：科研、生产、服务、使用、销毁。"},{"id":"第一部分基础题-一、密码法律法规-多选题-10","no":10,"kind":"multi","part":"第一部分基础题","cat":"一、密码法律法规","type":"多选题","stem":"根据《中华人民共和国密码法》，关于列入网络关键设备和网络安全专用产 品目录的商用密码产品，以下说法正确的是（ ）。","options":[{"key":"A","text":"一般是涉及国家安全、国计民生、社会公共利益和敏感个人信息的产品"},{"key":"B","text":"应由具备资格的机构检测认证合格后方可销售或者提供"},{"key":"C","text":"商用密码服务使用目录产品的，还需要经商用密码服务认证合格"},{"key":"D","text":"《网络关键设备安全通用要求》和《网络关键设备和网络安全专用产品安全认 证实施规则》等提供了检测认证的具体要求"}],"answer":"BCD","analysis":"本题考列入网络关键设备和网络安全专用产品目录的商用密码产品管理制度。B、C正是法条内容：目录产品须由具备资格的机构检测认证合格后方可销售或提供；商用密码服务使用目录产品的，服务本身还须经商用密码认证机构认证合格。D列举的检测认证依据标准与规则确实存在。A的表述与法条的适用范围（涉及国家安全、国计民生、社会公共利益）相比多出内容，不够严谨，故不选。","correctReason":"目录产品须经具备资格的机构检测认证合格方可销售或提供，商用密码服务使用目录产品的还须经商用密码服务认证合格。","wrongReason":"A：法条对目录产品的范围限定为涉及国家安全、国计民生、社会公共利益的商用密码产品，该选项的表述与之不完全一致，故不属于正确项。","source":"《中华人民共和国密码法》第二十六条","keyPoint":"目录内产品：检测认证合格才能卖；用目录产品的服务也要认证。"},{"id":"第一部分基础题-一、密码法律法规-多选题-11","no":11,"kind":"multi","part":"第一部分基础题","cat":"一、密码法律法规","type":"多选题","stem":"根据《中华人民共和国密码法》，（ ）不属于依法对密码工作机构的核心 密码、普通密码工作进行指导、监督和检查的主体。","options":[{"key":"A","text":"国家保密部门"},{"key":"B","text":"密码管理部门"},{"key":"C","text":"国家市场监督管理部门"},{"key":"D","text":"国家民政部门"}],"answer":"ACD","analysis":"本题为逆向设问，问的是「不属于」监督检查主体。对密码工作机构的核心密码、普通密码工作进行指导、监督和检查，是密码管理部门的法定职责，所以B属于，不选。国家保密部门、市场监督管理部门、民政部门都不承担这一职责，因此A、C、D三项都不属于，构成答案。做这类题要先在题干上圈出「不属于」，再逐项对照职责主体，避免把应选项当排除项。","correctReason":"密码管理部门是依法对密码工作机构的核心密码、普通密码工作进行指导、监督和检查的法定主体，其余三项均无此职责。","wrongReason":"A：国家保密部门主管保密工作，不承担核心密码、普通密码工作的指导监督检查职责；C：市场监督管理部门负责市场秩序监管，与核心密码、普通密码监督无关；D：民政部门职责在社会事务领域，与此完全无关。","source":"《中华人民共和国密码法》第十六条","keyPoint":"逆向题：核心/普通密码监督检查主体只有密码管理部门。"},{"id":"第一部分基础题-一、密码法律法规-多选题-12","no":12,"kind":"multi","part":"第一部分基础题","cat":"一、密码法律法规","type":"多选题","stem":"根据《中华人民共和国密码法》，密码管理部门的事中事后监管制度包括哪 些内容？（ ）","options":[{"key":"A","text":"建立统一的商用密码监督管理信息平台，向社会发布监管信息"},{"key":"B","text":"开展各类日常监管活动"},{"key":"C","text":"开展随机抽查活动"},{"key":"D","text":"将监管信息与社会信用体系相衔接"}],"answer":"ABCD","analysis":"本题考密码管理部门事中事后监管的制度工具。改革方向是「放管服」并重，不以审批代替监管：要建立统一的商用密码监督管理信息平台并向社会发布监管信息，要开展日常监管和随机抽查（双随机一公开），还要把监管信息与社会信用体系衔接，形成守信激励、失信惩戒的闭环。四个选项分别对应平台、日常监管、随机抽查、信用衔接，都是制度的组成部分，故全选。","correctReason":"统一监管信息平台、日常监管、随机抽查、与信用体系衔接，共同构成密码管理部门事中事后监管制度。","wrongReason":"本题四个选项均为正确表述，无错误选项。","source":"《中华人民共和国密码法》","keyPoint":"事中事后监管四件套：平台、日常、抽查、信用衔接。"},{"id":"第一部分基础题-一、密码法律法规-多选题-13","no":13,"kind":"multi","part":"第一部分基础题","cat":"一、密码法律法规","type":"多选题","stem":"《中华人民共和国密码法》作为我国首部系统性规范密码工作的专门法律， 既为国家安全构筑“技术盾牌”，又为数字经济发展注入法治动能。以下关于密码 分类及管理要求的表述中，正确的有（ ）。","options":[{"key":"A","text":"大众消费类产品采用的商用密码不实行进口许可和出口管制制度"},{"key":"B","text":"商用密码的科研、生产、销售、服务和进出口不得损害国家安全、社会公共利 益或他人合法权益"},{"key":"C","text":"县级以上地方密码管理部门负责管理本行政区域的核心密码和普通密码，国家 密码管理部门统一管理商用密码"},{"key":"D","text":"关键信息基础设施的运营者应委托第三方机构开展商用密码应用安全性评估"}],"answer":"AB","analysis":"本题综合考商用密码进出口豁免与商用密码活动底线。A与法律规定一致：大众消费类产品所采用的商用密码不实行进口许可和出口管制。B是合法性底线：商用密码的科研、生产、销售、服务和进出口都不得损害国家安全、社会公共利益或他人合法权益。C把管理权限说反了，核心密码、普通密码由国家密码管理部门统一管理，不是地方部门管。D也不对，法律要求运营者自行或委托测评机构开展密评，并无「应委托第三方」的一律要求。","correctReason":"大众消费类产品所采用的商用密码豁免进出口许可与管制，且商用密码各类活动均不得损害国家安全、社会公共利益和他人合法权益。","wrongReason":"C：核心密码、普通密码由国家密码管理部门统一管理，地方密码管理部门不负责管理核心密码和普通密码；D：商用密码应用安全性评估并非必须委托第三方机构，法律未作「应委托第三方」的一律要求。","source":"《中华人民共和国密码法》第二十七条、第二十八条","keyPoint":"消费类豁免进出口；商用密码须守住国家安全与公共利益底线。"},{"id":"第一部分基础题-一、密码法律法规-判断题-1","no":1,"kind":"judge","part":"第一部分基础题","cat":"一、密码法律法规","type":"判断题","stem":"依据《中华人民共和国密码法》，核心密码、普通密码和商用密码分别对应 保护国家秘密中的绝密、机密、秘密三个密级的信息。","options":[],"answer":"错","analysis":"《密码法》按保护对象把密码分为核心密码、普通密码、商用密码三类，但并没有把三个密级一一对应地派给三种密码。核心密码和普通密码都属于国家秘密，用于保护国家秘密信息；商用密码保护的是不属于国家秘密的信息。把\"绝密—核心、机密—普通、秘密—商用\"排成一一对应，既曲解了密级划分，也把商用密码错当成保护国家秘密的密码，因此该表述不成立。","correctReason":"《密码法》只规定商用密码用于保护不属于国家秘密的信息，并未将绝密、机密、秘密三个密级分别对应核心密码、普通密码、商用密码，故该表述不成立。","wrongReason":"","source":"《中华人民共和国密码法》第八条、第九条、第十条","keyPoint":"三分法是按保护对象划分，不是与绝密/机密/秘密一一对应"},{"id":"第一部分基础题-一、密码法律法规-判断题-2","no":2,"kind":"judge","part":"第一部分基础题","cat":"一、密码法律法规","type":"判断题","stem":"依据《中华人民共和国密码法》，在有线、无线通信中传递的国家秘密信息， 应当依照法律、行政法规和国家有关规定使用核心密码、普通密码进行加密保护、 安全认证。","options":[],"answer":"对","analysis":"这道题考的是有线、无线通信中传递国家秘密信息时的密码使用义务，属于《密码法》中直接引用原文的条款。国家秘密信息在通信中传递，必须按法律、行政法规和国家有关规定使用核心密码、普通密码进行加密保护和安全认证。题干表述与法条用语一致，未作扩大或缩小，因此判断为对；注意其中的\"安全认证\"也是与加密保护并列的法定要求。","correctReason":"该表述与《密码法》的规定完全一致：在有线、无线通信中传递的国家秘密信息，应当依法使用核心密码、普通密码进行加密保护、安全认证。","wrongReason":"","source":"《中华人民共和国密码法》第十四条","keyPoint":"国家秘密信息通信传递，用核心密码/普通密码加密保护+安全认证"},{"id":"第一部分基础题-一、密码法律法规-判断题-3","no":3,"kind":"judge","part":"第一部分基础题","cat":"一、密码法律法规","type":"判断题","stem":"依据《中华人民共和国密码法》，公民、法人和其他组织可以依法使用普通 密码保护网络与信息安全。","options":[],"answer":"错","analysis":"《密码法》对公民、法人和其他组织明确的是\"可以依法使用商用密码保护网络与信息安全\"，而不是普通密码。普通密码与核心密码同属国家秘密范畴，其使用主体、使用场景由国家有关规定限定，单位和个人不能随意拿来保护自己的网络和信息安全。这道题的陷阱就在\"商用\"与\"普通\"一词之差，属于高频易混点。","correctReason":"公民、法人和其他组织依法可以使用的是商用密码来保护网络与信息安全，使用普通密码保护网络与信息安全没有法律依据，故该表述不成立。","wrongReason":"","source":"《中华人民共和国密码法》第十二条","keyPoint":"公众可用的是商用密码；普通密码不是给社会公众用的"},{"id":"第一部分基础题-一、密码法律法规-判断题-4","no":4,"kind":"judge","part":"第一部分基础题","cat":"一、密码法律法规","type":"判断题","stem":"某科技公司研发了一款用于企业财务数据加密的商用密码软件。该公司负责 人认为，商用密码仅指加密技术本身，不包括相关产品和后续服务，因此该公司 只需关注技术研发，无需对产品销售后的技术服务承担任何密码管理方面的义 务。","options":[],"answer":"错","analysis":"该负责人的理解有两处错误。其一，《密码法》对商用密码的定义是\"采用特定变换的方法对信息等进行加密保护、安全认证的技术、产品和服务\"，技术、产品、服务三位一体，并非只有技术。其二，商用密码从业单位还要承担产品质量、检测认证、销售许可、应用安全等管理义务，产品销售后的技术服务同样受《密码法》《商用密码管理条例》约束。所以\"无需承担任何密码管理义务\"的结论是错的。","correctReason":"商用密码包括技术、产品和服务三类，从业单位对产品和服务都负有法定密码管理义务，\"仅指技术、无需承担义务\"的说法不成立。","wrongReason":"","source":"《中华人民共和国密码法》第二条、第二十六条","keyPoint":"商用密码＝技术＋产品＋服务，售后技术服务也在管理范围内"},{"id":"第一部分基础题-一、密码法律法规-判断题-5","no":5,"kind":"judge","part":"第一部分基础题","cat":"一、密码法律法规","type":"判断题","stem":"某县政府认为商用密码管理工作属于国家层面的事务，县级政府不需要承担 任何商用密码管理职责，因此未在本县设立专门的密码管理机构。","options":[],"answer":"错","analysis":"《密码法》在国家密码管理部门之外，还明确规定了县级以上地方各级人民政府密码管理部门的职责，并授权地方确定具体工作机构。因此商用密码管理并非只是\"国家层面的事务\"，县级政府同样负有法定职责，只是不一定单设独立的密码管理机构。题干以\"无需承担任何职责\"为由不设机构，结论错误。","correctReason":"法律明确县级以上地方人民政府密码管理部门承担相应商用密码管理职责，县级政府并非不承担任何职责，故该表述不成立。","wrongReason":"","source":"《中华人民共和国密码法》第五条","keyPoint":"县级以上地方政府密码管理部门也有法定职责，机构可依托现有部门"},{"id":"第一部分基础题-一、密码法律法规-判断题-6","no":6,"kind":"judge","part":"第一部分基础题","cat":"一、密码法律法规","type":"判断题","stem":"某企业向国务院商务主管部门申请商用密码进口许可，提交了相关材料。国 务院商务主管部门受理后可在第50 个工作日作出许可决定。","options":[],"answer":"错","analysis":"进口商用密码属于行政许可事项，受理机关必须在法定期限内作出决定，而这个期限不是50个工作日。《商用密码管理条例》对涉及商用密码的行政许可规定了具体的办理时限，行政执法机关不得随意延长到第50个工作日才作决定；即使按行政许可法的一般规则，期限也远短于50个工作日。因此该表述不成立。","correctReason":"商用密码进口许可的决定期限由法规明确规定，并非受理后第50个工作日才可作出，故该表述不成立。","wrongReason":"","source":"《商用密码管理条例》（进口许可决定期限依该条例关于行政许可办理期限的规定）","keyPoint":"行政许可有法定办理期限，不能用\"第50个工作日\"拖延"},{"id":"第一部分基础题-一、密码法律法规-判断题-7","no":7,"kind":"judge","part":"第一部分基础题","cat":"一、密码法律法规","type":"判断题","stem":"依据《中华人民共和国密码法》，电子政务电子认证服务机构可无需国家密 码管理部门认定即可开展服务。","options":[],"answer":"错","analysis":"电子政务电子认证服务直接服务于政务活动中的身份认证和电子签名，社会影响大、安全要求高。《密码法》规定，从事电子政务电子认证服务的机构应当经国家密码管理部门认定，取得相应资质后方可提供服务。题干中\"无需认定即可开展服务\"与该规定正相反，属于典型的资质条件考点，判断为错。","correctReason":"从事电子政务电子认证服务的机构必须依法经国家密码管理部门认定，\"无需认定即可开展服务\"不成立。","wrongReason":"","source":"《中华人民共和国密码法》第二十九条","keyPoint":"电子政务电子认证服务机构须经国家密码管理部门认定"},{"id":"第一部分基础题-一、密码法律法规-判断题-8","no":8,"kind":"judge","part":"第一部分基础题","cat":"一、密码法律法规","type":"判断题","stem":"某关键信息基础设施运营者正在建设一套新的信息系统，该系统依法需要使 用商用密码进行保护。该运营者认为，可以在系统建成后再考虑商用密码保障系 统的建设问题。","options":[],"answer":"错","analysis":"《密码法》要求关键信息基础设施依法使用商用密码保护时，必须同步规划、同步建设、同步运行商用密码保障系统，并与关键信息基础设施同步进行商用密码应用安全性评估。这是常说的\"三同步\"要求，目的是避免系统建成后再补密码而留下安全缺口。题干主张\"建成后再考虑\"，与同步要求相反，因此错误。","correctReason":"商用密码保障系统应当与关键信息基础设施同步规划、同步建设、同步运行，并同步开展应用安全性评估，\"建成后再考虑\"不成立。","wrongReason":"","source":"《中华人民共和国密码法》第二十七条","keyPoint":"关键信息基础设施密码保障要\"三同步\"，不能事后补"},{"id":"第一部分基础题-一、密码法律法规-判断题-9","no":9,"kind":"judge","part":"第一部分基础题","cat":"一、密码法律法规","type":"判断题","stem":"某政务系统存储机密级国家秘密信息，运维单位使用通过商用密码认证的加 密产品进行保护，该行为符合《中华人民共和国密码法》要求。","options":[],"answer":"错","analysis":"本题的关键是密级与密码类别的匹配。机密级国家秘密信息属于国家秘密，应当依照法律、行政法规和国家有关规定使用核心密码、普通密码进行保护，而不能用商用密码产品替代。商用密码用于保护不属于国家秘密的信息，即使产品通过了商用密码认证，也不能用于承载机密级国家秘密的系统。因此该做法不符合《密码法》要求。","correctReason":"机密级国家秘密信息的保护应使用核心密码、普通密码，使用商用密码产品保护不符合《密码法》的规定。","wrongReason":"","source":"《中华人民共和国密码法》第十四条、第二十七条","keyPoint":"秘密信息找核心/普通密码，商用密码只管非国家秘密"},{"id":"第一部分基础题-一、密码法律法规-判断题-10","no":10,"kind":"judge","part":"第一部分基础题","cat":"一、密码法律法规","type":"判断题","stem":"某市医院采购商用密码系统保护患者健康数据，因不属于关键信息基础设 施，运营者可自行决定是否开展密码应用安全性评估。","options":[],"answer":"对","analysis":"《密码法》规定的商用密码应用安全性评估强制义务，针对的是依法使用商用密码保护的关键信息基础设施，以及法律、行政法规和国家有关规定要求评估的情形。医院即便涉及大量患者健康数据，只要未被认定为关键信息基础设施，也不属于法律强制评估的范围，运营者可自行决定是否开展评估。题目说的是\"是否开展\"由运营者决定，这个表述与法律框架一致，故答案为对。","correctReason":"法律强制的商用密码应用安全性评估针对关键信息基础设施等法定情形，非关键信息基础设施的运营者可自主决定是否开展，该表述成立。","wrongReason":"","source":"《中华人民共和国密码法》第二十七条","keyPoint":"强制密评针对关键信息基础设施，非关基可自主选择"},{"id":"第一部分基础题-一、密码法律法规-判断题-11","no":11,"kind":"judge","part":"第一部分基础题","cat":"一、密码法律法规","type":"判断题","stem":"某电子政务电子认证服务机构因自身过错导致电子签名人在政务活动中遭 受了损失。该机构认为，由于电子签名人自身也应当对签名安全性负责，因此该 机构不承担任何赔偿责任。","options":[],"answer":"错","analysis":"电子签名法律制度在电子签名人与认证机构之间分配责任：电子签名人负有妥善保管签名制作数据的义务，但认证机构自身负有依法审验、保障证书真实有效和系统安全运行的义务。若认证机构因自身过错导致电子签名人在政务活动中受损，属于未履行法定义务，仍应承担相应赔偿责任，不能以\"签名人也有责任\"为由完全免责。故该主张错误。","correctReason":"认证机构因自身过错造成他人损失的，应当依法承担赔偿责任，\"不承担任何赔偿责任\"不成立。","wrongReason":"","source":"《中华人民共和国电子签名法》第二十八条、第三十二条","keyPoint":"认证机构有过错就要担责，不能因签名人也有义务而免责"},{"id":"第一部分基础题-一、密码法律法规-判断题-12","no":12,"kind":"judge","part":"第一部分基础题","cat":"一、密码法律法规","type":"判断题","stem":"《商用密码管理条例》要求商用密码检测机构需向国家密码管理部门报送检 测实施情况。","options":[],"answer":"对","analysis":"商用密码检测机构是经国家密码管理部门认定的专业技术机构，其检测活动直接关系到商用密码产品、服务的合规判断，因此必须接受持续监管。《商用密码管理条例》要求检测机构按规定向密码管理部门报送检测实施情况，以便主管部门掌握检测动态、发现质量和合规问题。题干表述符合条例要求，判断为对。","correctReason":"《商用密码管理条例》确实要求商用密码检测机构向密码管理部门报送检测实施情况，该表述成立。","wrongReason":"","source":"《商用密码管理条例》（关于商用密码检测机构报送检测情况的规定）","keyPoint":"检测机构要按规定向密码管理部门报送检测实施情况"},{"id":"第一部分基础题-二、网络安全法律法规-单选题-1","no":1,"kind":"single","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"单选题","stem":"下列哪一部法律给出了网络、网络安全、网络数据等用语的定义，并明确了 部门、企业、社会组织和个人在网络空间中的权利、义务和责任？（ ）","options":[{"key":"A","text":"《中华人民共和国网络安全法》"},{"key":"B","text":"《中华人民共和国数据安全法》"},{"key":"C","text":"《中华人民共和国个人信息保护法》"},{"key":"D","text":"《中华人民共和国国家安全法》"}],"answer":"A","analysis":"本题考查的是网络安全领域基础性法律的调整范围。《网络安全法》在附则中对网络、网络安全、网络数据、网络运营者、个人信息等用语逐一作了定义，并确立了网络运营者的安全保护义务、监管部门的职责以及个人和组织的权利与义务。其余三部法律各有侧重，均不以“网络”概念体系为主线。做题时抓住“给网络类用语下定义”这一标志即可锁定答案。","correctReason":"《网络安全法》既给出网络、网络安全、网络数据等用语定义，又全面规定部门、企业、社会组织和个人在网络空间的权利、义务和责任，是网络安全领域的基础性法律。","wrongReason":"B：《数据安全法》调整数据处理活动及其安全监管，不定义网络、网络安全；C：《个人信息保护法》只规范个人信息处理活动，不覆盖网络数据、网络运行安全等概念；D：《国家安全法》是国家安全领域的基础性法律，不涉及网络用语定义。","source":"《中华人民共和国网络安全法》第七十八条（2025年修正后为附则用语含义条款）","keyPoint":"网络、网络安全、网络数据、网络运营者的定义都出自《网络安全法》。"},{"id":"第一部分基础题-二、网络安全法律法规-单选题-2","no":2,"kind":"single","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"单选题","stem":"某市网信办在开展网络安全检查时，发现一家网络公司未制定内部安全管理 制度。该公司负责人辩称公司规模较小，不需要建立相关制度。根据《中华人民 共和国网络安全法》，该公司的辩解是否成立？（ ）","options":[{"key":"A","text":"成立，小规模企业可以豁免部分义务"},{"key":"B","text":"不成立，所有网络运营者都应履行网络安全保护义务"},{"key":"C","text":"成立，但需要向监管部门备案"},{"key":"D","text":"不成立，只有取得相关许可的企业才需要履行"}],"answer":"B","analysis":"本题考查网络安全等级保护制度下义务主体的范围。《网络安全法》规定国家实行网络安全等级保护制度，凡网络运营者都应按要求制定内部安全管理制度和操作规程、确定网络安全负责人、落实网络安全保护责任。法律未按企业规模设置豁免或备案替代，制度缺失就是未履行法定义务，与其是否取得许可也无关。","correctReason":"网络运营者是等级保护义务的当然主体，不论规模大小都必须建立内部安全管理制度，《网络安全法》未给小微企业任何豁免。","wrongReason":"A：法律没有“小规模企业豁免”的规定，该辩解没有依据；C：向监管部门备案既非豁免条件，也不是小企业的替代义务；D：履行安全保护义务不以事先取得许可为前提，许可与义务主体范围无关。","source":"《中华人民共和国网络安全法》关于网络安全等级保护制度的规定（2025年修正后为第二十三条第一款第一项）","keyPoint":"等级保护义务按“网络运营者”划定，不因企业规模而减免。"},{"id":"第一部分基础题-二、网络安全法律法规-单选题-3","no":3,"kind":"single","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"单选题","stem":"按照《中华人民共和国网络安全法》的要求，关键信息基础设施的运营者应 当（ ）对其网络的安全性和可能存在的风险开展检测评估。","options":[{"key":"A","text":"自行"},{"key":"B","text":"自行或者委托网络安全服务机构"},{"key":"C","text":"委托网络安全服务机构"},{"key":"D","text":"自行并且委托网络安全服务机构"}],"answer":"B","analysis":"本题考查关键信息基础设施安全检测评估的实施方式。法律授权运营者既可以依靠自身力量组织检测评估，也可以委托具备能力的网络安全服务机构来做，两者是“或者”的选择关系。这种安排的用意是兼顾运营者的自主性和专业机构的技术优势，而不是强制绑定。注意区分“或者”与“并且”：前者给运营者留出选择空间，后者会变成双重负担。","correctReason":"法条原文表述为“自行或者委托网络安全服务机构”开展检测评估，二者择一即可，不强制叠加。","wrongReason":"A：遗漏了委托专业机构这一法定途径，表述不完整；C：强制委托机构，排除了运营者自行评估的法定选择权；D：“并且”把可选关系误作并列强制，加重了义务。","source":"《中华人民共和国网络安全法》第四十条（2025年修正后条号）关于关键信息基础设施运营者每年至少进行一次检测评估的规定","keyPoint":"关键信息基础设施检测评估：自行或委托机构，两者择一。"},{"id":"第一部分基础题-二、网络安全法律法规-单选题-4","no":4,"kind":"single","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"单选题","stem":"按照《中华人民共和国网络安全法》的要求，关键信息基础设施的运营者应 当对其网络的安全性和可能存在的风险（ ）检测评估。","options":[{"key":"A","text":"每三个月至少一次"},{"key":"B","text":"每半年至少进行一次"},{"key":"C","text":"每年至少进行一次"},{"key":"D","text":"每两年至少一次"}],"answer":"C","analysis":"本题考查关键信息基础设施运营者开展安全检测评估的法定频次。法条明确要求“每年至少进行一次”，即最低频次为一年一次，上不封顶，运营者可结合风险状况加密频次。检测评估情况还应连同改进措施报送负责关键信息基础设施安全保护工作的部门。这类时间节点常与网络安全事件的报告时限混考，要分清楚。","correctReason":"法律对关键信息基础设施运营者设定的检测评估最低频次就是每年至少一次，与日常安全监测、事件报告时限是不同制度。","wrongReason":"A：每三个月一次属于更严的内控要求，不是法定义务；B：每半年一次同样高于法定下限，法律并未如此规定；D：每两年一次低于法定最低频次，运营者会因未履行义务而违法。","source":"《中华人民共和国网络安全法》第四十条（2025年修正后条号）","keyPoint":"关键信息基础设施检测评估：每年至少一次。"},{"id":"第一部分基础题-二、网络安全法律法规-单选题-5","no":5,"kind":"single","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"单选题","stem":"某市电力公司被认定为关键信息基础设施运营者。根据《中华人民共和国网 络安全法》，该公司除履行一般网络运营者的安全保护义务外，还应当履行的特 殊义务不包括以下哪项（ ）","options":[{"key":"A","text":"设置专门安全管理机构和安全管理负责人"},{"key":"B","text":"对安全管理负责人和关键岗位人员进行安全背景审查"},{"key":"C","text":"定期对从业人员进行网络安全教育、技术培训和技能考核"},{"key":"D","text":"将核心数据全部公开以供社会监督"}],"answer":"D","analysis":"本题考查关键信息基础设施运营者的特殊义务清单。除履行一般网络运营者的等级保护义务外，运营者还应设置专门安全管理机构和安全管理负责人并对该负责人和关键岗位人员进行安全背景审查、定期对从业人员开展网络安全教育技术培训和技能考核、对重要系统和数据库容灾备份、制定应急预案并定期演练。法律从未要求把核心数据公开接受社会监督，公开反而可能造成泄密风险。","correctReason":"A、B、C三项都是法条明确列举的关键信息基础设施运营者特殊义务，只有D项在法律规定中根本不存在。","wrongReason":"D：“将核心数据全部公开以供社会监督”不是法定义务，核心数据属于重点保护对象，公开会危害国家安全和公共利益，与立法宗旨相反。","source":"《中华人民共和国网络安全法》关于关键信息基础设施运营者安全保护义务的规定（2025年修正后为第三十六条）","keyPoint":"关键信息基础设施特殊义务含机构、人员、培训、备份、演练五类。"},{"id":"第一部分基础题-二、网络安全法律法规-单选题-6","no":6,"kind":"single","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"单选题","stem":"各级人民政府及其有关部门应当组织开展经常性的网络安全宣传教育，并指 导、督促有关单位做好（ ）宣传教育工作。","options":[{"key":"A","text":"网络安全"},{"key":"B","text":"数据安全"},{"key":"C","text":"信息安全"},{"key":"D","text":"体系安全"}],"answer":"A","analysis":"本题考查网络安全宣传教育的责任分工。法条要求各级人民政府及其有关部门组织开展经常性的网络安全宣传教育，同时指导、督促有关单位做好本单位、本领域的网络安全宣传教育工作；大众传播媒介还应有针对性地面向社会开展宣传。题目问的是“指导、督促有关单位做好”的内容，与本法主题一致，即网络安全宣传教育。","correctReason":"该项直接对应法条原文，政府及有关部门指导、督促有关单位做好的是网络安全宣传教育工作。","wrongReason":"B：数据安全宣传教育由数据安全相关法律法规调整，不是本条内容；C：信息安全是更宽泛的行业用语，未出现在该条表述中；D：体系安全并非本法用语，属于生造概念。","source":"《中华人民共和国网络安全法》关于网络安全宣传教育的规定（2025年修正后为第二十一条）","keyPoint":"政府组织、单位落实、媒体面向社会：宣传教育落点是“网络安全”。"},{"id":"第一部分基础题-二、网络安全法律法规-单选题-7","no":7,"kind":"single","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"单选题","stem":"某网络运营者未按照网络安全等级保护制度的要求采取防范计算机病毒和网 络攻击等技术措施，导致其网络系统被黑客入侵，大量用户数据被窃取。根据《中 华人民共和国网络安全法》，对该运营者的处罚，以下说法正确的是（ ）","options":[{"key":"A","text":"只需责令改正，给予警告"},{"key":"B","text":"可以处一万元以上五万元以下罚款"},{"key":"C","text":"处五万元以上五十万元以下罚款，对直接负责的主管人员处一万元以上十万元 以下罚款"},{"key":"D","text":"直接吊销营业执照"}],"answer":"C","analysis":"本题考查网络运营者未履行等级保护义务的法律责任档次。运营者未按要求采取防范计算机病毒、网络攻击等必要技术措施，导致系统被入侵、大量用户数据被窃取，属于“拒不改正或者导致危害网络安全等后果”的从重情形，罚款幅度升至五万元以上五十万元以下，直接负责的主管人员处一万元以上十万元以下罚款。只看“警告了事”或“直接吊销营业执照”都不符合法律责任条款的层级设计。","correctReason":"造成危害网络安全后果的，对运营者处五万元以上五十万元以下罚款，并对直接负责的主管人员处一万元以上十万元以下罚款。","wrongReason":"A：责令改正、给予警告只是责令改正类措施，本案已造成实际危害后果，不能仅止于此；B：一万元以上五万元以下是未造成后果时的罚款幅度，档次偏低；D：吊销营业执照须有法律明确规定且通常针对情节严重情形，法律对此并未规定一律吊销。","source":"《中华人民共和国网络安全法》第六十一条（2025年修正后条号）关于网络运营者不履行网络安全保护义务法律责任的规定","keyPoint":"未履责+造成后果：单位罚5万—50万，主管人员罚1万—10万。"},{"id":"第一部分基础题-二、网络安全法律法规-单选题-8","no":8,"kind":"single","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"单选题","stem":"某关键信息基础设施运营者不履行网络安全保护义务，造成大量数据泄露的 严重后果。根据《中华人民共和国网络安全法》第六十一条，该运营者可能面临 的最高罚款为（ ）","options":[{"key":"A","text":"五十万元"},{"key":"B","text":"一百万元"},{"key":"C","text":"二百万元"},{"key":"D","text":"一千万元"}],"answer":"D","analysis":"本题按题干给定的“第六十一条”考查关键信息基础设施运营者不履行网络安全保护义务的处罚上限。该类违法行为先适用责令改正、警告，拒不改正或者造成危害后果的按十万元以上一百万元以下罚款；若进一步造成大量数据泄露、关键信息基础设施丧失局部功能等严重危害后果，罚款升至五十万元以上二百万元以下；造成丧失主要功能等特别严重后果的，最高可达一千万元。本题以“最高罚款”设问，应取最重档次的上限。","correctReason":"在造成严重危害网络安全后果的档次中，法律对该类运营者规定的罚款幅度上限为二百万元，特别严重情形更可达一千万元，选项中最高者为一千万元。","wrongReason":"A：五十万元是较低档次的常见罚额，不是本题情形下的最高额；B：一百万元对应的是拒不改正或造成危害后果的一般档次上限；C：二百万元对应严重危害后果档次的上限，仍低于特别严重情形的上限。","source":"《中华人民共和国网络安全法》第六十一条（题中已明示条号；2025年修正后关键信息基础设施条款位于第六十一条第二款、第三款）","keyPoint":"关键信息基础设施严重后果：罚款最高可达一千万元。"},{"id":"第一部分基础题-二、网络安全法律法规-单选题-9","no":9,"kind":"single","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"单选题","stem":"某网络运营者在处理用户个人信息时，不慎将一批用户数据丢失。根据《中 华人民共和国网络安全法》，该运营者应当（ ）","options":[{"key":"A","text":"自行处理，无需告知用户"},{"key":"B","text":"及时告知用户并向有关主管部门报告"},{"key":"C","text":"只需向主管部门报告，无需告知用户"},{"key":"D","text":"只需告知用户，无需向主管部门报告"}],"answer":"B","analysis":"本题考查个人信息泄露、毁损、丢失时的应急处置和报告义务。网络运营者对其收集的个人信息负有安全保护责任，一旦发生或者可能发生泄露、毁损、丢失，应当立即采取补救措施，并按照规定及时告知用户、向有关主管部门报告。告知用户与报告主管部门是两项并行义务，不能相互替代，也不能以“自行处理”了事。","correctReason":"法条要求同时履行两项义务：按照规定及时告知用户，并向有关主管部门报告。","wrongReason":"A：隐瞒不报、自行处理违反法定义务，会扩大用户损失并加重法律责任；C：只报告主管部门而不告知用户，剥夺了用户的知情权和止损机会；D：只告知用户而不报告主管部门，规避了监管要求，同样违法。","source":"《中华人民共和国网络安全法》第四十四条第二款（2025年修正后条号）关于个人信息泄露、毁损、丢失补救与告知的规定","keyPoint":"个人信息出事：立即补救+告知用户+报告主管部门，缺一不可。"},{"id":"第一部分基础题-二、网络安全法律法规-单选题-10","no":10,"kind":"single","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"单选题","stem":"根据《中华人民共和国网络安全法》第四条规定，网络安全工作坚持的方针 是（ ）","options":[{"key":"A","text":"积极防御、依法管理、确保安全、安全可靠"},{"key":"B","text":"积极利用、科学发展、依法管理、确保安全"},{"key":"C","text":"自主可控、安全可靠、统筹规划、依法管理"},{"key":"D","text":"统筹规划、分步实施、确保安全、科学发展"}],"answer":"B","analysis":"本题考查网络安全工作的基本方针。国家坚持网络安全与信息化发展并重，遵循“积极利用、科学发展、依法管理、确保安全”的方针，推进网络基础设施建设，鼓励技术创新，支持培养网络安全人才。这一表述是该领域的经典记忆点，常被打乱顺序或替换词语来设错，答题时要逐词比对，特别注意“积极利用”“科学发展”两个容易被替换的部分。","correctReason":"“积极利用、科学发展、依法管理、确保安全”是法律原文表述的十六字方针。","wrongReason":"A：“积极防御、安全可靠”属于军事或等级保护领域的用语，混入了方针表述；C：“自主可控、统筹规划”是信息技术应用创新等政策用语，不是本条方针；D：“统筹规划、分步实施”来自信息化建设的一般提法，与法定方针不符。","source":"《中华人民共和国网络安全法》第四条（2016年文本）；2025年修正后为第五条","keyPoint":"网络安全工作方针：积极利用、科学发展、依法管理、确保安全。"},{"id":"第一部分基础题-二、网络安全法律法规-单选题-11","no":11,"kind":"single","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"单选题","stem":"《中华人民共和国网络安全法》规定网络运营者应当对其收集的用户信息严 格保密，并建立健全（ ）。","options":[{"key":"A","text":"用户信息保密制度"},{"key":"B","text":"用户信息保护制度"},{"key":"C","text":"用户信息加密制度"},{"key":"D","text":"用户信息保全制度"}],"answer":"B","analysis":"本题考查网络运营者对用户信息的保护义务用语。法条要求网络运营者对其收集的用户信息严格保密，并建立健全“用户信息保护制度”；同时明确处理个人信息还应遵守民法典、个人信息保护法等法律、行政法规的规定。注意“保密”是行为要求，“保护制度”是制度建设要求，两者层次不同，选项中用“保密制度”“加密制度”替换都是偷换概念。","correctReason":"法条原文为“建立健全用户信息保护制度”，保护制度是涵盖收集、使用、管理、安全措施的上位制度。","wrongReason":"A：“保密制度”只对应严格保密这一项要求，缩小了制度范围；C：“加密制度”把技术措施等同于制度体系，属于以偏概全；D：“保全制度”不是法律用语，属于生造表述。","source":"《中华人民共和国网络安全法》第四十二条第一款（2025年修正后条号）","keyPoint":"网络运营者须建立健全“用户信息保护制度”。"},{"id":"第一部分基础题-二、网络安全法律法规-单选题-12","no":12,"kind":"single","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"单选题","stem":"依据《中华人民共和国个人信息保护法》，（ ）是一旦泄露或者非法使 用，容易导致自然人的人格尊严受到侵害或者人身、财产安全受到危害的个人信 息，包括生物识别、宗教信仰、特定身份、医疗健康、金融账户、行踪轨迹等信 息。","options":[{"key":"A","text":"敏感个人信息"},{"key":"B","text":"个人信息"},{"key":"C","text":"个人数据"},{"key":"D","text":"个人隐私"}],"answer":"A","analysis":"本题考查敏感个人信息的概念。《个人信息保护法》把一旦泄露或者非法使用容易导致自然人人格尊严受侵害或者人身、财产安全受危害的个人信息界定为敏感个人信息，并列举了生物识别、宗教信仰、特定身份、医疗健康、金融账户、行踪轨迹等类型，不满十四周岁未成年人的个人信息也属于敏感个人信息。处理此类信息须有特定目的和充分必要性、采取严格保护措施并取得单独同意。","correctReason":"题干给出的定义与列举与《个人信息保护法》对敏感个人信息的规定完全一致，故应填入“敏感个人信息”。","wrongReason":"B：个人信息是上位概念，指与已识别或可识别自然人有关的各种信息，不限于高敏感类型；C：“个人数据”并非本法用语，无法对应法定的分类保护规则；D：“个人隐私”是民法上的概念，与个人信息保护法上的敏感个人信息不是同一范畴。","source":"《中华人民共和国个人信息保护法》第二十八条","keyPoint":"敏感个人信息含生物识别、医疗健康、金融账户、行踪轨迹等。"},{"id":"第一部分基础题-二、网络安全法律法规-单选题-13","no":13,"kind":"single","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"单选题","stem":"依据《中华人民共和国个人信息保护法》，提供重要互联网平台服务、用户 数量巨大、业务类型复杂的个人信息处理者，应当定期发布（ ），接受社会 监督。","options":[{"key":"A","text":"个人信息风险评估报告"},{"key":"B","text":"个人信息保护社会责任报告"},{"key":"C","text":"个人信息保护影响评估报告"},{"key":"D","text":"个人信息处理报告"}],"answer":"B","analysis":"本题考查大型互联网平台个人信息处理者的特别义务。提供重要互联网平台服务、用户数量巨大、业务类型复杂的处理者，应当建立健全合规制度体系并成立主要由外部成员组成的独立监督机构、制定平台规则、对严重违法的平台内经营者停止服务，并定期发布个人信息保护社会责任报告接受社会监督。这里要区分“社会责任报告”与“影响评估报告”：后者是处理敏感个人信息等特定情形时的事前评估文件。","correctReason":"该义务明确表述为定期发布“个人信息保护社会责任报告”，接受社会监督。","wrongReason":"A、C：个人信息保护影响评估报告是事前评估文件，法律并未要求平台定期向社会发布；D：“个人信息处理报告”不是法定文书名称，属于混淆性表述。","source":"《中华人民共和国个人信息保护法》第五十八条第四项","keyPoint":"大型平台定期发布的是“个人信息保护社会责任报告”。"},{"id":"第一部分基础题-二、网络安全法律法规-单选题-14","no":14,"kind":"single","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"单选题","stem":"根据《中华人民共和国网络安全法》第十一条规定，建设、运营网络或者通 过网络提供服务，应当维护网络数据的（ ）","options":[{"key":"A","text":"完整性、保密性和可用性"},{"key":"B","text":"完整性、真实性和时效性"},{"key":"C","text":"保密性、真实性和可追溯性"},{"key":"D","text":"可用性、真实性和完整性"}],"answer":"A","analysis":"本题考查网络数据的法定安全属性。法律要求建设、运营网络或者通过网络提供服务时采取技术措施和其他必要措施，保障网络安全、稳定运行，有效应对网络安全事件，维护网络数据的“完整性、保密性和可用性”。这三个属性是信息安全的基本目标，简称CIA，与真实性、时效性、可追溯性等衍生属性不是同一层级的法定表述。","correctReason":"法条明确列举的三项为完整性、保密性、可用性，顺序虽可调整但内容不可替换。","wrongReason":"B、D：加入了“真实性”“时效性”等非法定列举属性，替换了保密性；C：加入“真实性”“可追溯性”，删去了可用性，均属擅自改动法定表述。","source":"《中华人民共和国网络安全法》第十条（2016年文本）；2025年修正后为第十一条","keyPoint":"网络数据三性：完整性、保密性、可用性（CIA）。"},{"id":"第一部分基础题-二、网络安全法律法规-单选题-15","no":15,"kind":"single","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"单选题","stem":"某在线教育平台计划收集14 岁以下未成年人学习数据，并与境外机构共享 以优化算法。隐私政策未明确境外接收方信息，仅通过默认勾选获取家长同意。 根据《中华人民共和国个人信息保护法》，以下哪项是该平台必须补充或修正的 关键措施？（ ）","options":[{"key":"A","text":"删除所有儿童个人信息，改用匿名化数据替代"},{"key":"B","text":"取得家长的单独书面同意，制定专门处理规则，并通过安全评估后向境外提供 数据"},{"key":"C","text":"仅需在隐私政策中增加“可能向境外传输数据”的提示即可"},{"key":"D","text":"取消境外数据共享，改为境内存储以规避法律风险"}],"answer":"B","analysis":"本题考查未成年人个人信息与个人信息出境规则的叠加适用。不满十四周岁未成年人的个人信息属于敏感个人信息，处理时应当取得其父母或者其他监护人的同意，并制定专门的个人信息处理规则；向境外提供个人信息，还应当向个人告知境外接收方的名称、联系方式、处理目的方式、信息种类及行权途径等，并取得单独同意，同时满足通过安全评估、认证或者订立标准合同等条件之一。默认勾选不属于有效同意，仅作提示或简单取消共享都不能满足合规要求。","correctReason":"平台须取得监护人的单独同意、制定专门的个人信息处理规则，并在履行告知、单独同意义务的同时通过安全评估等法定途径后方可向境外提供数据。","wrongReason":"A：一律删除并改用匿名化数据并非法定要求，属于过度处置且可能影响正常服务；C：仅增加一句提示无法替代单独同意、专门处理规则和出境安全评估；D：取消共享虽可规避风险，但题目问的是必须补充或修正的合规措施，而非放弃业务。","source":"《中华人民共和国个人信息保护法》第二十八条、第二十九条、第三十一条、第三十八条、第三十九条","keyPoint":"未成年人信息属敏感个人信息：监护人单独同意+专门规则+出境安全评估。"},{"id":"第一部分基础题-二、网络安全法律法规-单选题-16","no":16,"kind":"single","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"单选题","stem":"《中华人民共和国数据安全法》旨在规范数据处理活动，保障数据安全，保 护个人、组织的合法权益，维护国家主权、安全和发展利益。关于数据安全法， 以下说法错误的是（ ）。","options":[{"key":"A","text":"延续了网络安全法生效以来的“一轴两翼三级”的监管体系"},{"key":"B","text":"是数据安全领域最高位阶的专门法"},{"key":"C","text":"适用于在中国境内开展的数据处理活动及其安全监管"},{"key":"D","text":"要求对不同类型和级别的数据采取相应的保护措施"}],"answer":"A","analysis":"本题考查《数据安全法》的制度定位与主要内容。该法是我国数据安全领域最高位阶的专门法律，适用于在境内开展的数据处理活动及其安全监管，确立了数据分类分级保护、数据安全审查、数据安全风险评估与应急处置等制度，并要求根据数据的重要程度和危害程度采取相应保护措施。所谓“一轴两翼三级”并非该法的制度设计表述，属于以讹传讹的说法。","correctReason":"A项所述“一轴两翼三级”监管体系不是《数据安全法》确立的制度内容，故该项说法错误，为本题答案。","wrongReason":"B：作为全国人大常委会制定的专门法律，称其为数据安全领域最高位阶的专门法表述正确；C：符合本法第二条关于域内适用的规定；D：符合本法第二十一条关于分类分级保护、按危害程度采取相应措施的要求。","source":"《中华人民共和国数据安全法》第一条、第二条、第二十一条","keyPoint":"数据安全法的制度抓手是分类分级保护、安全审查、风险评估与应急处置。"},{"id":"第一部分基础题-二、网络安全法律法规-单选题-17","no":17,"kind":"single","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"单选题","stem":"某跨国企业在中国境内设立研发中心，日常开展用户行为数据的收集、存储 和分析工作。该企业的数据合规官正在研究《中华人民共和国数据安全法》的适 用范围。根据《中华人民共和国数据安全法》的规定，该研发中心在中国境内开 展的数据处理活动应当适用本法。该法的立法目的不包括以下哪一项（ ）。","options":[{"key":"A","text":"规范数据处理活动，保障数据安全"},{"key":"B","text":"促进数据开发利用"},{"key":"C","text":"保护个人、组织的合法权益"},{"key":"D","text":"促进数据的无条件自由流动"}],"answer":"D","analysis":"本题考查《数据安全法》的立法目的。该法开宗明义规定其目的是规范数据处理活动、保障数据安全，促进数据开发利用，保护个人、组织的合法权益，维护国家主权、安全和发展利益。法律鼓励数据依法合理有效利用，保障数据依法有序自由流动，从未主张数据的无条件自由流动，跨境传输还要受安全评估、重要数据出境管理等制度约束。","correctReason":"A、B、C三项均为法条明示的立法目的，只有D项“无条件自由流动”在立法目的中没有依据且与法律精神相悖。","wrongReason":"D：法律强调数据“依法有序”自由流动，跨境提供还受安全评估等限制，不存在“无条件自由流动”的立法目的。","source":"《中华人民共和国数据安全法》第一条、第七条、第十一条","keyPoint":"数据流动是“依法有序”的，不是无条件的。"},{"id":"第一部分基础题-二、网络安全法律法规-单选题-18","no":18,"kind":"single","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"单选题","stem":"某科技公司正在制定内部数据安全管理制度。法务人员需要准确理解《中华 人民共和国数据安全法》中“数据”“数据处理”“数据安全”三个核心概念。 以下关于这三个概念的说法，错误的是（ ）","options":[{"key":"A","text":"数据是指任何以电子或者其他方式对信息的记录"},{"key":"B","text":"数据处理包括数据的收集、存储、使用、转移、加工、传输、提供等"},{"key":"C","text":"数据处理包括数据的收集、存储、使用、加工、传输、提供、公开等"},{"key":"D","text":"数据安全是指通过采取必要措施，确保数据处于有效保护和合法利用的状态， 以及具备保障持续安全状态的能力"}],"answer":"B","analysis":"本题考查《数据安全法》中数据、数据处理、数据安全三个核心概念。数据是指任何以电子或者其他方式对信息的记录；数据处理是指数据的收集、存储、使用、加工、传输、提供、公开等；数据安全是指通过采取必要措施，确保数据处于有效保护和合法利用的状态，以及具备保障持续安全状态的能力。注意“转移”不是法条列举的环节用语，法条用“传输、提供”。","correctReason":"A、C、D三项均与法条原文一致，B项把“加工”漏掉、用“转移”替换“传输”等表述，与法定概念不符，故B为错误项。","wrongReason":"B：数据处理环节中无“转移”一词，且遗漏了“加工”“公开”等法定环节，概念表述不准确。","source":"《中华人民共和国数据安全法》第三条","keyPoint":"数据处理七环节：收集、存储、使用、加工、传输、提供、公开。"},{"id":"第一部分基础题-二、网络安全法律法规-单选题-19","no":19,"kind":"single","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"单选题","stem":"某市正在推进智慧城市建设，拟开发一款面向全体市民的智能化公共服务 APP。根据《中华人民共和国数据安全法》的规定，提供智能化公共服务时，应 当充分考虑（ ）的需求，避免对其日常生活造成障碍。","options":[{"key":"A","text":"妇女和儿童"},{"key":"B","text":"老年人和残疾人"},{"key":"C","text":"欠发达地区群众"},{"key":"D","text":"外来务工人员"}],"answer":"B","analysis":"本题考查数据开发利用中的人文关怀要求。《数据安全法》规定，国家支持开发利用数据提升公共服务的智能化水平，提供智能化公共服务应当充分考虑老年人、残疾人的需求，避免对其日常生活造成障碍。这一条款与“数字鸿沟”“适老化改造”的政策导向一致，考查的是对特定群体需求的准确记忆，不要被妇女儿童、欠发达地区群众等常见表述干扰。","correctReason":"法条明确指出提供智能化公共服务应当充分考虑老年人、残疾人的需求，避免对其日常生活造成障碍。","wrongReason":"A：妇女和儿童是个人信息保护和劳动权益领域的关注对象，不是本条的服务设计对象；C：欠发达地区群众涉及区域协调发展政策，与智能化公共服务的适老无障碍要求不同；D：外来务工人员不是本条规定的特定群体。","source":"《中华人民共和国数据安全法》第十五条","keyPoint":"智能化公共服务：充分考虑老年人、残疾人的需求。"},{"id":"第一部分基础题-二、网络安全法律法规-单选题-20","no":20,"kind":"single","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"单选题","stem":"维护数据安全，应当坚持总体国家安全观，建立健全（ ），提高数据安 全保障能力。","options":[{"key":"A","text":"数据安全治理体系"},{"key":"B","text":"数据安全保护体系"},{"key":"C","text":"数据安全维护能力"},{"key":"D","text":"数据安全治理能力"}],"answer":"A","analysis":"本题考查维护数据安全的基本原则和制度建设要求。《数据安全法》规定，维护数据安全应当坚持总体国家安全观，建立健全数据安全治理体系，提高数据安全保障能力。这里的落点是“治理体系”，体现从国家层面统筹协调、多元共治的思路，而不是仅强调单一主体的保护能力。答题时要区分“治理”与“保护”、“体系”与“能力”两对易混表述。","correctReason":"法条原文为“建立健全数据安全治理体系，提高数据安全保障能力”，填入“数据安全治理体系”才与原文一致。","wrongReason":"B：“数据安全保护体系”不是该条用语，保护义务另有条款规定；C：“数据安全维护能力”与法条“保障能力”表述不符；D：“数据安全治理能力”偷换了“体系”一词，与原文不符。","source":"《中华人民共和国数据安全法》第四条","keyPoint":"坚持总体国家安全观，建立健全数据安全治理体系。"},{"id":"第一部分基础题-二、网络安全法律法规-单选题-21","no":21,"kind":"single","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"单选题","stem":"某国家机关不履行《中华人民共和国数据安全法》规定的数据安全保护义务， 造成政务数据泄露。根据《中华人民共和国数据安全法》的规定，对该国家机关 直接负责的主管人员和其他直接责任人员应当（ ）","options":[{"key":"A","text":"处五万元以上二十万元以下罚款"},{"key":"B","text":"依法给予处分"},{"key":"C","text":"处十日以上十五日以下拘留"},{"key":"D","text":"如认错态度良好则免予处罚"}],"answer":"B","analysis":"本题考查国家机关不履行数据安全保护义务的法律后果。《数据安全法》明确，国家机关不履行本法规定的数据安全保护义务的，对直接负责的主管人员和其他直接责任人员依法给予处分。对国家机关不能像对企业那样处以罚款，责任形式落在对相关责任人员的政务处分上，这是国家机关与一般数据处理者责任设计的重要差别。","correctReason":"对国家机关不履行数据安全保护义务的情形，法律明确规定对直接负责的主管人员和其他直接责任人员依法给予处分。","wrongReason":"A：五万元以上二十万元以下罚款是数据处理者造成严重后果时对责任人员的处罚幅度，不适用于国家机关；C：行政拘留属于治安管理处罚，本法未对国家机关工作人员规定拘留；D：认错态度良好可以从轻，但不能成为免予处分的法定依据。","source":"《中华人民共和国数据安全法》第四十九条（政务数据安全章节对应第三十九条）","keyPoint":"国家机关违反数据安全义务：对责任人员依法给予处分，而非罚款。"},{"id":"第一部分基础题-二、网络安全法律法规-单选题-22","no":22,"kind":"single","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"单选题","stem":"依据《中华人民共和国数据安全法》，各地区、各部门应当按照（ ）， 确定本地区、本部门以及相关行业、领域的重要数据具体目录，对列入目录的数 据进行重点保护。","options":[{"key":"A","text":"数据安全管理制度"},{"key":"B","text":"数据安全审查制度"},{"key":"C","text":"网络安全等级保护制度"},{"key":"D","text":"数据分类分级保护制度"}],"answer":"D","analysis":"本题考查重要数据目录的编制依据。《数据安全法》规定国家建立数据分类分级保护制度，根据数据在经济社会发展中的重要程度以及遭到篡改、破坏、泄露或者非法获取、非法利用可能造成的危害程度实行分类分级保护，各地区、各部门应当按照数据分类分级保护制度确定本地区、本部门以及相关行业、领域的重要数据具体目录。数据安全审查、等级保护等是配套制度，不是编制目录的直接依据。","correctReason":"法条明确各地区、各部门应“按照数据分类分级保护制度”确定重要数据具体目录，对列入目录的数据重点保护。","wrongReason":"A：数据安全管理制度是概括性义务要求，不是确定目录所依据的制度；B：数据安全审查制度针对影响国家安全的数据处理活动，与目录编制不是同一制度；C：网络安全等级保护制度保护的是网络系统，不能直接作为数据目录的编制依据。","source":"《中华人民共和国数据安全法》第二十一条第三款","keyPoint":"重要数据目录依据“数据分类分级保护制度”确定。"},{"id":"第一部分基础题-二、网络安全法律法规-单选题-23","no":23,"kind":"single","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"单选题","stem":"根据《中华人民共和国电子签名法》规定，从事电子认证服务，应当向（ ） 提出申请。","options":[{"key":"A","text":"国务院信息产业主管部门"},{"key":"B","text":"国务院公安部门"},{"key":"C","text":"国家密码管理部门"},{"key":"D","text":"国家市场监督管理总局"}],"answer":"A","analysis":"本题考查电子认证服务行政许可的受理机关。《电子签名法》规定，从事电子认证服务应当向国务院信息产业主管部门提出申请并提交符合条件的材料，该部门经审查并征求国务院商务主管部门等有关部门意见后，在法定期限内作出许可或者不予许可的决定，予以许可的颁发电子认证许可证书。行业监管主体与密码管理、公安、市场监管等部门的职责要分别对应，不要混淆。","correctReason":"法条明示申请机关为“国务院信息产业主管部门”，由其审查并决定是否颁发电子认证许可证书。","wrongReason":"B：公安部门负责网络安全监督管理、打击网络违法犯罪，不受理电子认证服务许可申请；C：国家密码管理部门负责商用密码管理，电子认证服务使用密码须取得其同意使用密码的证明文件，但许可申请不向其提出；D：市场监督管理部门负责工商登记与市场监管，不是电子认证服务的许可机关。","source":"《中华人民共和国电子签名法》第十八条（第十七条第五项关于密码证明文件）","keyPoint":"电子认证服务许可：向国务院信息产业主管部门申请。"},{"id":"第一部分基础题-二、网络安全法律法规-单选题-24","no":24,"kind":"single","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"单选题","stem":"在信息安全领域，我国出台了一系列的法律法规以保障国家网络安全和个人 信息保护。以下关于这些法律法规的描述，哪一项是错误的？（ ）","options":[{"key":"A","text":"《中华人民共和国个人信息保护法》于2022 年11 月1 日起施行"},{"key":"B","text":"《中华人民共和国数据安全法》于2021 年9 月1 日起施行"},{"key":"C","text":"《中华人民共和国网络安全法》于2017 年6 月1 日起施行"},{"key":"D","text":"《中华人民共和国密码法》于2020 年1 月1 日起施行"}],"answer":"A","analysis":"本题考查几部重要法律的时间节点。《个人信息保护法》于2021年8月20日通过、2021年11月1日起施行，不是2022年11月1日；《数据安全法》自2021年9月1日起施行；《网络安全法》自2017年6月1日起施行；《密码法》自2020年1月1日起施行。时间类考点建议按“2017网络安全、2020密码、2021数据安全与个保法”的顺序串记。","correctReason":"《个人信息保护法》的施行日期是2021年11月1日，A项写成2022年11月1日，日期有误，故A为本题答案。","wrongReason":"A：《个人信息保护法》2021年11月1日施行，年份写错；B、C、D三项所载施行日期均与法律实际规定一致。","source":"《中华人民共和国个人信息保护法》第七十四条、《中华人民共和国数据安全法》第五十五条、《中华人民共和国网络安全法》第八十一条（2025年修正后条号）、《中华人民共和国密码法》第四十四条","keyPoint":"个保法2021年11月1日施行，数据安全法同年9月1日施行。"},{"id":"第一部分基础题-二、网络安全法律法规-单选题-25","no":25,"kind":"single","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"单选题","stem":"按照《中华人民共和国个人信息保护法》，以下关于加密和去标识化的说法 错误的是（ ）。","options":[{"key":"A","text":"加密属于去标识化技术的一种"},{"key":"B","text":"去标识化和加密属于不同的技术措施"},{"key":"C","text":"去标识化可以和加密同时使用"},{"key":"D","text":"对于敏感个人信息，去标识化后无必要再采用加密"}],"answer":"D","analysis":"本题考查个人信息保护中加密与去标识化的关系。《个人信息保护法》把加密与去标识化并列为个人信息处理者应当采取的安全技术措施，二者原理不同：加密保护的是数据的机密性，去标识化降低的是数据与特定自然人的关联性。同一条款并列列举，说明它们是相互独立、可以叠加使用的措施，不存在“去标识化后就不必加密”的替代关系。","correctReason":"去标识化与加密是并列的两类安全技术措施，去标识化并不免除采取加密等必要措施的义务，故D项说法错误。","wrongReason":"A：加密是去标识化处理可以借助的技术手段之一，该表述成立；B：二者技术目标不同，属于不同的技术措施，表述成立；C：法律允许且鼓励多种措施叠加使用，表述成立。","source":"《中华人民共和国个人信息保护法》第五十一条第三项、第七十三条第三项","keyPoint":"加密管机密性、去标识化管关联性，二者并列不可相互替代。"},{"id":"第一部分基础题-二、网络安全法律法规-单选题-26","no":26,"kind":"single","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"单选题","stem":"《中华人民共和国电子签名法》规定，电子认证服务机构签发的证书内容失 实，造成损失时，应承担（ ）。","options":[{"key":"A","text":"仅需撤销证书"},{"key":"B","text":"承担形式审查责任"},{"key":"C","text":"证明无过错后可免责"},{"key":"D","text":"一律承担连带赔偿责任"}],"answer":"C","analysis":"本题考查电子认证服务提供者的赔偿责任归责原则。法律规定，电子签名人或者电子签名依赖方因依据电子认证服务提供者提供的电子签名认证服务从事民事活动遭受损失，电子认证服务提供者不能证明自己无过错的，承担赔偿责任。这是过错推定：先推定其有过错，机构须自证无过错才能免责，故“证明无过错后可免责”正确，而“一律承担连带赔偿责任”过于绝对，也与实际责任形态不符。","correctReason":"法条采用过错推定，电子认证服务提供者能够证明自己没有过错的不承担赔偿责任，故C项表述成立。","wrongReason":"A：撤销证书是业务管理措施，不能替代损失赔偿；B：法律并未把责任限缩为形式审查责任；D：连带责任需有法定或约定依据，且机构可举证免责，与“一律连带”矛盾。","source":"《中华
