解密时某一密文分组损坏会破坏本组明文，同时该错误经反馈影响下一组明文的对应比特，故最多影响两个分组。四项描述均正确。","correctReason":"A、B、C、D 分别正确说明了 CTR 的比特翻转会传导到明文、OFB 的密钥流可预计算、CFB 与 OFB 的反馈输入差异以及 CBC 解密错误最多影响两组。","wrongReason":"无错误选项：A、B、C、D 对 CTR、OFB、CFB、CBC 四种模式特性的描述均与标准一致，四项都正确。","source":"NIST SP 800-38A；GB/T 17964-2021《信息安全技术 分组密码算法的工作模式》","keyPoint":"CTR 比特翻转会传导到明文；CBC 解密错误最多影响 2 组"},{"id":"第二部分专业题-一、密码学-多选题-51","no":51,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"SM4 分组密码算法轮函数中的T 置换，包括的运算有（ ）。","options":[{"key":"A","text":"非线性变换"},{"key":"B","text":"S 盒运算"},{"key":"C","text":"线性变换"},{"key":"D","text":"列混合变换"}],"answer":"ABC","analysis":"本题考查 SM4 轮函数中 T 置换的具体构成。SM4 的 T(·)=L(τ(·))，其中 τ 由 4 个并行的 8 进 8 出 S 盒实现，S 盒运算正是非线性变换的落地形式，L 是面向 32 位字的线性变换（循环左移与异或）。因此非线性变换、S 盒运算、线性变换三者都包含在 T 置换中。列混合变换是 AES 轮函数中的部件，在 GF(2^8) 上做矩阵乘法，SM4 没有这个概念。","correctReason":"T 置换＝非线性变换 τ（即 S 盒运算）＋线性变换 L，故 A、B、C 都属于 T 置换包含的运算（该题答案以官方为准）。","wrongReason":"D：列混合（MixColumns）是 AES 在 GF(2^8) 上做的字节矩阵乘法，属于 AES 的轮变换，SM4 的轮函数中不存在该部件。","source":"GM/T 0002-2012《SM4 分组密码算法》5.3 节","keyPoint":"SM4 的 T＝τ（S 盒）＋L（线性变换），无列混合"},{"id":"第二部分专业题-一、密码学-多选题-52","no":52,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"下述对SM4 分组密码算法介绍中正确的是（ ）。","options":[{"key":"A","text":"将消息分为固定长度的数据块来逐块处理的"},{"key":"B","text":"分组长度和密钥长度一样长"},{"key":"C","text":"分组长度和密钥长度不一样"},{"key":"D","text":"加密算法中的线性变换与密钥扩展算法中的线性变换完全一致"}],"answer":"AB","analysis":"本题考查 SM4 的基本参数与结构。SM4 是分组密码，把消息按固定长度的数据块逐块加密；其分组长度和密钥长度都是 128 位，二者一样长，因此 C 的说法与事实相反。D 项容易错：加密算法中的线性变换 L 作用于 S 盒输出，密钥扩展算法中的线性变换 L′ 形式不同（循环移位参数不一样），二者并不完全一致。","correctReason":"SM4 以 128 位为一块逐块处理，分组长度与密钥长度均为 128 位，故 A、B 正确。","wrongReason":"C：SM4 的分组长度和密钥长度都是 128 位，二者相同，该说法与 B 矛盾且与事实不符；D：加密用线性变换 L 与密钥扩展用线性变换 L′ 的移位参数不同，并不完全一致。","source":"GM/T 0002-2012《SM4 分组密码算法》第 4、6 章","keyPoint":"SM4 分组 128 位、密钥 128 位；L 与 L′ 不是同一个变换"},{"id":"第二部分专业题-一、密码学-多选题-53","no":53,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"根据杂凑函数的安全水平，人们将杂凑函数分为两大类，分别是（ ）。","options":[{"key":"A","text":"弱碰撞自由的杂凑函数"},{"key":"B","text":"强碰撞自由的杂凑函数"},{"key":"C","text":"强杂凑函数"},{"key":"D","text":"弱杂凑函数"}],"answer":"AB","analysis":"本题考查杂凑函数按安全强度的分类。按抗碰撞能力划分，杂凑函数分为弱碰撞自由和强碰撞自由两类：弱碰撞自由指给定一个消息 x，在计算上找不到另一个 x′≠x 使 H(x′)=H(x)；强碰撞自由指在计算上找不到任意一对不同的消息 x≠x′ 使二者杂凑值相同，即抗生日攻击级别的碰撞。强杂凑函数、弱杂凑函数不是这一分类体系中的术语。","correctReason":"按安全水平（抗碰撞能力）划分，杂凑函数分为弱碰撞自由与强碰撞自由两大类，故 A、B 正确。","wrongReason":"C：强杂凑函数不是按碰撞自由程度划分的规范类别名称，属干扰项；D：弱杂凑函数同样不是该分类体系中的术语。","source":"GB/T 25069-2022《信息安全技术 术语》；《密码学导论》杂凑函数分类","keyPoint":"杂凑函数两类：弱碰撞自由、强碰撞自由"},{"id":"第二部分专业题-一、密码学-多选题-54","no":54,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"SM4 算法的轮函数包括的运算有（ ）。","options":[{"key":"A","text":"异或"},{"key":"B","text":"非线性变换"},{"key":"C","text":"线性变换"},{"key":"D","text":"相乘"}],"answer":"ABC","analysis":"本题考查 SM4 轮函数的运算组成。SM4 一轮的运算是：先把 X1、X2、X3 和轮密钥异或，结果送入 T 置换，T 由非线性变换 τ（S 盒替换）和线性变换 L（循环左移后异或）复合得到，最后再与前一个字异或得到新的状态字。整个过程只用到异或、S 盒替换和循环移位，不含乘法或模乘一类「相乘」运算。","correctReason":"SM4 轮函数包含与轮密钥的异或、非线性变换 τ 和线性变换 L，故 A、B、C 正确。","wrongReason":"D：SM4 的轮函数只用异或、循环移位和 S 盒替换，不含乘法（相乘）运算，故不选。","source":"GM/T 0002-2012《SM4 分组密码算法》5.3 节轮函数","keyPoint":"SM4 轮函数＝异或＋非线性变换＋线性变换，无乘法"},{"id":"第二部分专业题-一、密码学-多选题-55","no":55,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"公钥密码算法使用两个密钥，下述描述正确的是（ ）。","options":[{"key":"A","text":"一个是公钥，一个是私钥"},{"key":"B","text":"一个是加密密钥，一个是解密密钥"},{"key":"C","text":"一个是公开的密钥，一个是秘密保存的私钥"},{"key":"D","text":"一个用于加密，一个用于MAC"}],"answer":"ABC","analysis":"本题考查公钥密码体制的密钥特性。公钥算法使用一对数学相关的密钥：公钥可以公开分发给任何人，用于加密或验证签名；私钥必须由用户秘密保存，用于解密或生成签名。B 项从使用功能角度说「一个加密、一个解密」，在很多单向使用场景下也成立，故按官方答案入选；D 项把用途说成加密和 MAC，而 MAC 属对称密码机制，公钥算法并不用于 MAC，明显错误。C 项同时点出了公开与秘密保存的属性，是最准确的描述。","correctReason":"公钥密码使用一对密钥，分为可公开的公钥与需秘密保存的私钥，从功能上分别对应加密密钥与解密密钥，故 A、B、C 正确（该题答案以官方为准）。","wrongReason":"D：MAC（消息鉴别码）基于对称密钥机制，公钥密码的密钥对用于加密/解密和签名/验签，不会「一个用于加密、一个用于 MAC」。","source":"GM/T 0006-2012《密码应用标识规范》相关术语；《密码学导论》公钥密码体制","keyPoint":"公钥密码密钥对＝可公开的公钥＋需保密的私钥"},{"id":"第二部分专业题-一、密码学-多选题-56","no":56,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"分组密码将明文消息编码表示后的数字序列进行分组划分并进行加密，下列 不属于分组密码体制的有（ ）。","options":[{"key":"A","text":"SM2 密码体制"},{"key":"B","text":"IDEA 密码体制"},{"key":"C","text":"RC5 密码体制"},{"key":"D","text":"ElGamal 密码体制"}],"answer":"AD","analysis":"本题考查分组密码体制与公钥密码体制的区分。IDEA 和 RC5 都是分组对称密码：IDEA 分组 64 位、密钥 128 位；RC5 是参数可变的分组密码，支持不同分组、密钥长度和轮数。SM2 是我国基于椭圆曲线的公钥密码算法，用于加密、签名和密钥交换；ElGamal 基于离散对数困难问题，属公钥密码体制，二者都不是分组密码。","correctReason":"SM2 与 ElGamal 都是公钥密码体制，不属于分组密码，题目问「不属于分组密码体制的」，故 A、D 正确。","wrongReason":"B：IDEA 是典型的分组对称密码算法，属于分组密码体制；C：RC5 是分组长度和轮数可变的对称分组密码，同样属于分组密码体制。","source":"GB/T 32918 系列（SM2）；ISO/IEC 18033-3（IDEA、RC5）","keyPoint":"SM2、ElGamal 是公钥算法；IDEA、RC5 是分组密码"},{"id":"第二部分专业题-一、密码学-多选题-57","no":57,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"相对于对称加密算法，非对称密钥加密算法通常（ ）。","options":[{"key":"A","text":"加密速率较低"},{"key":"B","text":"更适合于数据的加解密处理"},{"key":"C","text":"安全性一定更高"},{"key":"D","text":"加密和解密的密钥不同"}],"answer":"AD","analysis":"本题考查非对称加密与对称加密的性能差异。公钥算法基于大数分解、离散对数等数学难题，运算涉及大整数模幂或椭圆曲线点乘，速度可比对称算法慢几个数量级，因此通常只用于密钥协商、数字签名和小数据加密，大批量数据加解密仍交给对称算法，B 的说法恰好相反。C 也不成立：安全性取决于密钥长度、参数选择和实现，而非「非对称就一定更安全」，参数选错或密钥过短同样会被攻破。","correctReason":"非对称算法运算复杂，加密速率明显低于对称算法；且其加解密使用不同的密钥，故 A、D 正确。","wrongReason":"B：公钥算法速度慢、开销大，不适合大批量数据加解密，通常配合对称算法做密钥封装；C：安全性取决于密钥长度与参数强度，非对称算法并不必然比对称算法安全。","source":"GB/T 32918 系列（SM2）；《密码学导论》公钥密码性能分析","keyPoint":"公钥算法：慢、密钥不同、适合密钥交换与签名"},{"id":"第二部分专业题-一、密码学-多选题-58","no":58,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"底层采用SM4 算法的EMAC，输出标签的比特长度支持（ ）。","options":[{"key":"A","text":"32"},{"key":"B","text":"64"},{"key":"C","text":"128"},{"key":"D","text":"256"}],"answer":"ABC","analysis":"本题考查基于 SM4 的 EMAC 算法的标签长度。EMAC 属于分组密码的消息鉴别码构造方式，在相关商用密码标准中，底层采用 SM4 的 EMAC 支持 32 位、64 位、128 位三种输出标签长度，应用方按安全需求选择：标签越长抗伪造能力越强，标签越短则传输开销越小。256 位超过 SM4 分组长度 128 位，无法由单次分组运算输出。","correctReason":"采用 SM4 的 EMAC 规定了 32、64、128 位三种标签长度，故 A、B、C 正确。","wrongReason":"D：SM4 分组长度为 128 位，EMAC 的输出标签不会超过一个分组的长度，256 位标签不被支持。","source":"GM/T 0042-2015《三元对等密码安全协议》及商用密码 EMAC 相关标准","keyPoint":"SM4-EMAC 标签长度：32／64／128 位"},{"id":"第二部分专业题-一、密码学-多选题-59","no":59,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"关于RSA 的参数选择，正确的是（ ）。","options":[{"key":"A","text":"选取两个秘密素数p 和q"},{"key":"B","text":"选取两个公开素数p 和q"},{"key":"C","text":"（p-1）和（q-1）都必须至少具有一个很大的素因数"},{"key":"D","text":"p 和q 二者之差不宜过小"}],"answer":"ACD","analysis":"本题考查 RSA 参数选取的安全要求。RSA 先秘密选取两个大素数 p、q，公开其乘积 n=pq 作为模数，若 p、q 公开则私钥指数 d 可被直接推出；同时要求 p−1 和 q−1 都含有大的素因数，以免攻击者用 Pollard p−1 方法分解 n；还要求 |p−q| 不能太小，否则可用 Fermat 分解法迅速分解 n。","correctReason":"RSA 的 p、q 必须保密，且需保证 p−1、q−1 有大素因数、|p−q| 足够大以抵抗 p−1 分解法和 Fermat 分解法，故 A、C、D 正确。","wrongReason":"B：p 和 q 是私钥的核心，必须严格保密，公开的只是它们的乘积 n 和加密指数 e，因此该说法错误。","source":"GM/T 0006 及《密码学导论》RSA 参数选取要求","keyPoint":"RSA：p、q 保密，p−1/q−1 含大素因子，|p−q| 不能过小"},{"id":"第二部分专业题-一、密码学-多选题-60","no":60,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"为保证安全性，在设计分组密码时应该考虑（ ）等问题。","options":[{"key":"A","text":"在设计分组密码时，加密/解密变换必须足够复杂"},{"key":"B","text":"加密时间要足够长"},{"key":"C","text":"密钥空间足够大"},{"key":"D","text":"解密时间要足够长"}],"answer":"AC","analysis":"本题考查分组密码的设计准则。好的分组密码要让加密变换和解密变换足够复杂，使攻击者无法用简单的代数或统计方法求解密钥；同时密钥空间必须足够大，以抵抗穷举密钥搜索，128 位密钥空间在现有算力下已不可穷举。B、D 把「加密时间要足够长」「解密时间要足够长」当作安全设计目标，这是错误的：算法设计追求的是在保证安全强度前提下的高效率，耗时过长反而影响可用性。","correctReason":"分组密码设计要保证变换足够复杂以抵抗各类分析攻击，并保证密钥空间足够大以抵抗穷举攻击，故 A、C 正确。","wrongReason":"B：加密时间长短与安全性没有必然关系，设计目标是安全且高效，故意拖长加密时间并非设计要求；D：解密时间同理，耗时长不等于安全，反而降低实用性。","source":"GB/T 32907-2016；《分组密码的设计与分析》设计准则","keyPoint":"分组密码设计：变换足够复杂＋密钥空间足够大"},{"id":"第二部分专业题-一、密码学-多选题-61","no":61,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"离散对数问题是一个在数学和密码学领域中的重要问题。基于离散对数问题 的密码算法包括（ ）。","options":[{"key":"A","text":"RSA"},{"key":"B","text":"SM2"},{"key":"C","text":"ECDSA"},{"key":"D","text":"NTRU"}],"answer":"BC","analysis":"本题考的是各类公钥算法「安全性究竟建立在哪个数学难题上」。离散对数问题指在有限域或椭圆曲线上由公钥反推私钥在计算上不可行，SM2 与 ECDSA 都是椭圆曲线离散对数问题（ECDLP）体制，故选 B、C。RSA 的安全基础是大整数分解难题，并非离散对数；NTRU 属于基于格的后量子密码，与离散对数无关，二者是命题人设置的干扰项。做题时抓住「数学难题来源」这条主线，就能把分解类、离散对数类、格类清晰分开。","correctReason":"SM2 与 ECDSA 的公钥都是私钥与椭圆曲线基点相乘的结果，由公钥反推私钥即为求解椭圆曲线离散对数问题，其安全性正建立在该难题之上。","wrongReason":"A：RSA 基于大整数分解难题，与离散对数无关；D：NTRU 是基于格上难题的后量子密码体制，安全性不依赖离散对数。","source":"GM/T 0003-2012《SM2 椭圆曲线公钥密码算法》；ANSI X9.62 椭圆曲线数字签名算法标准","keyPoint":"SM2/ECDSA 靠椭圆曲线离散对数，RSA 靠大整数分解，NTRU 靠格"},{"id":"第二部分专业题-一、密码学-多选题-62","no":62,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"SM2 公钥密码算法一般包括如下哪些功能（ ）。","options":[{"key":"A","text":"密钥派生"},{"key":"B","text":"签名"},{"key":"C","text":"密钥交换"},{"key":"D","text":"加密"}],"answer":"BCD","analysis":"SM2 标准给出的对外功能是数字签名、密钥交换和公钥加密解密三部分，即 B、C、D。密钥派生函数（KDF）只是加密与密钥交换内部调用的辅助函数，用于把共享秘密扩展成会话密钥，并不是 SM2 对外的独立功能，故 A 不选。复习时要把「算法主体功能」和「内部调用的辅助函数」分开；另外注意 SM2 不具备密钥封装（KEM）功能，KEM 是 SM9 才提供的。","correctReason":"SM2 由签名算法、密钥交换协议、公钥加密解密算法三部分构成，密钥派生仅是被调用的辅助函数，不构成其功能组成。","wrongReason":"A：密钥派生是 SM2 加密和密钥交换过程中调用的 KDF 辅助函数，不属于 SM2 对外提供的三大功能之一。","source":"GM/T 0003-2012《SM2 椭圆曲线公钥密码算法》（第 1～4 部分）","keyPoint":"SM2 三功能：签名、密钥交换、公钥加解密；KDF 只是辅助函数"},{"id":"第二部分专业题-一、密码学-多选题-63","no":63,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"分组密码的认证加密模式与公钥体制下的数字签名相比，（ ）不是共有 的。","options":[{"key":"A","text":"保护数据机密性"},{"key":"B","text":"保护数据完整性"},{"key":"C","text":"不可否认性"},{"key":"D","text":"运行速度快"}],"answer":"ACD","analysis":"题眼是「不是共有的」，即挑出只属于其中一方的性质。认证加密与数字签名都能保护数据完整性，B 是共有项故不选。机密性只有认证加密具备，数字签名只做完整性、认证与不可否认，故 A 不共有；不可否认性是公钥签名的特有性质，对称体制双方共享同一密钥，无法向第三方证明是谁生成的，故 C 不共有；运算速度上对称算法远快于公钥运算，故 D 也不共有。抓住「对称与非对称的本质差异」即可解答。","correctReason":"两者共通之处只有数据完整性与数据起源认证，因此机密性、不可否认性和运行速度快都不是双方共有的性质。","wrongReason":"A：数字签名不提供机密性，只有认证加密模式才保护数据机密性；C：认证加密使用对称密钥，不具备不可否认性；D：认证加密是对称运算，速度远快于公钥签名，并非双方共有。","source":"GB/T 17964-2021《信息安全技术 分组密码算法的工作模式》；GM/T 0003.2-2012《SM2 椭圆曲线公钥密码算法 第 2 部分：数字签名算法》","keyPoint":"对称只做完整性与认证，不可否认性只能由公钥签名提供"},{"id":"第二部分专业题-一、密码学-多选题-64","no":64,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"SM9 密码算法KGC 是负责（ ）的可信机构。","options":[{"key":"A","text":"选择系统参数"},{"key":"B","text":"生成主密钥"},{"key":"C","text":"生成用户标识"},{"key":"D","text":"生成用户私钥"}],"answer":"ABD","analysis":"SM9 是标识密码，密钥生成中心 KGC 承担三项职责：选定系统参数（曲线参数、配对参数、系统主公钥等），生成并保管主密钥（主私钥），再依据用户标识和主私钥计算出用户私钥并安全下发，即 A、B、D。用户标识是代表用户身份的信息（如邮箱、工号、手机号），由用户或应用系统确定，KGC 只是以它作为派生私钥的输入，并不生成标识，故 C 错。要记住 KGC 掌握主私钥，因此必须高度可信，且标识密码天然带有密钥托管特性。","correctReason":"KGC 负责选择系统参数、生成主密钥，并用主私钥与用户标识派生出用户私钥，这是标识密码密钥管理的核心环节。","wrongReason":"C：用户标识由用户或应用系统提供，用于标识身份，KGC 只是将其作为派生私钥的输入，并不生成标识本身。","source":"GM/T 0044-2016《SM9 标识密码算法》","keyPoint":"KGC 管参数、管主密钥、派发用户私钥，不管用户标识"},{"id":"第二部分专业题-一、密码学-多选题-65","no":65,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"SM9 密码算法椭圆曲线非无穷远点的字节串表示形式有（ ）。","options":[{"key":"A","text":"单一零字节表示形式"},{"key":"B","text":"压缩表示形式"},{"key":"C","text":"未压缩表示形式"},{"key":"D","text":"混合表示形式"}],"answer":"BCD","analysis":"椭圆曲线点的字节串编码有三种：未压缩形式（前缀 04，输出 x、y 两个坐标）、压缩形式（前缀 02 或 03，只输出 x 与一个奇偶标志，靠曲线方程恢复 y）、混合形式（前缀 06 或 07，输出 x、y 并额外携带 y 的奇偶信息），即 B、C、D。「单一零字节」(0x00) 是无穷远点 O 的专用编码，而题目已限定「非无穷远点」，故 A 不选。看到题干里的限定词就要立刻排除 0x00 这一项。","correctReason":"非无穷远点的标准编码是压缩（02/03）、未压缩（04）和混合（06/07）三种形式，均由首字节前缀加以区分。","wrongReason":"A：单一零字节 0x00 是无穷远点 O 的表示形式，题干限定了非无穷远点，故不属于本题答案。","source":"GM/T 0044.1-2016《SM9 标识密码算法 第 1 部分：总则》","keyPoint":"点编码：02/03 压缩、04 未压缩、06/07 混合，00 是无穷远点"},{"id":"第二部分专业题-一、密码学-多选题-66","no":66,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"为保障分组密码工作模式的使用安全性，通常采用的措施有（ ）。","options":[{"key":"A","text":"控制明文长度上限"},{"key":"B","text":"经常更新加密密钥"},{"key":"C","text":"多次加密同一明文"},{"key":"D","text":"规范使用Nonce、IV 等参数"}],"answer":"ABD","analysis":"工作模式的安全边界要靠使用管理来守住：单密钥下可加密的数据量必须有上限（如 GCM 固定密钥下密文块数受限，超限会削弱认证强度），故要控制明文长度上限（A）；密钥使用越久、数据量越大，被分析和泄露的风险越高，需定期换钥（B）；IV、Nonce、计数器绝不允许在同一密钥下重复，否则 CTR 密钥流复用、CBC 相同明文相同密文等问题会立刻暴露，故要规范使用（D）。而反复加密同一明文只会提供更多明密文对应关系，是错误做法，故 C 错。","correctReason":"限制单密钥加密数据量、及时更新密钥、规范 Nonce/IV 使用，都是分组密码工作模式安全使用的基本要求。","wrongReason":"C：同一明文反复加密会产生重复密文、暴露明文相等关系，为攻击者提供额外信息，是应当避免的错误用法。","source":"GB/T 17964-2021《信息安全技术 分组密码算法的工作模式》；NIST SP 800-38 系列","keyPoint":"工作模式三要点：限量、换钥、Nonce/IV 绝不复用"},{"id":"第二部分专业题-一、密码学-多选题-67","no":67,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"（ ）算法需要密钥派生函数作为辅助函数。","options":[{"key":"A","text":"SM9 数字签名"},{"key":"B","text":"SM9 密钥交换"},{"key":"C","text":"SM9 密钥封装"},{"key":"D","text":"SM9 公钥加密"}],"answer":"BCD","analysis":"SM9 的密钥交换、密钥封装和公钥加密都需要把配对运算得到的共享秘密（群元素）经密钥派生函数 KDF 扩展成定长的会话密钥或封装密钥，所以 B、C、D 正确。数字签名只做杂凑与椭圆曲线上的模运算来完成签名和验签，不产生密钥材料，因此不需要 KDF，A 不选。可以这样记：凡是要「从共享秘密得到密钥」的环节都要用 KDF，只做验证的签名环节则不需要。","correctReason":"密钥交换、密钥封装与公钥加密都要把配对结果经 KDF 扩展为会话密钥或封装密钥，签名过程不产生密钥材料故无需 KDF。","wrongReason":"A：SM9 数字签名只用杂凑和椭圆曲线上的模运算完成签名与验签，不涉及把共享秘密转换为密钥，因此不需要密钥派生函数。","source":"GM/T 0044-2016《SM9 标识密码算法》","keyPoint":"凡是从共享秘密生成密钥的环节（交换/封装/加密）都要 KDF"},{"id":"第二部分专业题-一、密码学-多选题-68","no":68,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"公钥密码体制的基本思想包括（ ）。","options":[{"key":"A","text":"将传统分组密码的密钥一分为二，分为加密密钥和解密密钥"},{"key":"B","text":"加密密钥公开，解密密钥保密"},{"key":"C","text":"由加密密钥推出解密密钥，在计算上是不可行的"},{"key":"D","text":"以上都不对"}],"answer":"BC","analysis":"公钥体制的核心思想是「非对称」：存在一对数学上关联但用途相反的密钥，一个公开用于加密或验签，一个保密用于解密或签名，且由公开密钥无法在可行时间内推算出私钥，这正是 B、C。A 的表述有瑕疵：并非把传统分组密码的密钥「一分为二」，而是基于陷门单向函数构造出一对数学上不等价、不可互推的密钥，说成对称密钥的简单拆分容易产生歧义，故不选；D 与前两项直接矛盾，自然排除。","correctReason":"公钥体制以非对称密钥对和陷门单向函数为基础，公钥可公开、私钥须保密，且由公钥推导私钥在计算上不可行。","wrongReason":"A：公钥与私钥并非把对称密钥简单拆成两半，而是基于陷门单向函数构造的一对不可互推的密钥；D：既然 B、C 成立，该说法自然错误。","source":"GB/T 25069-2022《信息安全技术 术语》；《商用密码知识与技术》公钥密码体制基本原理","keyPoint":"公钥公开、私钥保密、公钥推不出私钥——非对称三要点"},{"id":"第二部分专业题-一、密码学-多选题-69","no":69,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"评估 SM4 算法的安全性，必须考虑下述对分组密码算法常用的分析方法 （ ）。","options":[{"key":"A","text":"差分分析"},{"key":"B","text":"线性分析"},{"key":"C","text":"不可能差分分析"},{"key":"D","text":"积分分析"}],"answer":"ABCD","analysis":"评估一个分组密码的抗攻击能力，要看它能否抵抗主流分析方法：差分分析（A）和线性分析（B）是两大经典手段，不可能差分分析（C）是差分分析的重要变体，积分分析（D）是面向 SPN 结构（如 AES、SM4 这类含 S 盒与线性层的结构）的高阶攻击方法。SM4 通过 32 轮非线性迭代与充分的轮函数扩散，使这些攻击只能停留在低于全轮数的理论层面。四个选项都属分组密码常用的安全性分析方法，故选全。","correctReason":"差分分析、线性分析、不可能差分分析和积分分析均为分组密码安全性评估的标准分析手段，对 SM4 的安全性评估正是围绕它们展开。","wrongReason":"本题四个选项都是分组密码的常用分析方法，没有错误选项。","source":"GB/T 32907-2016《信息安全技术 SM4 分组密码算法》","keyPoint":"分组密码四大分析法：差分、线性、不可能差分、积分"},{"id":"第二部分专业题-一、密码学-多选题-70","no":70,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"RSA 密码体制中用到了（ ）等数论知识。","options":[{"key":"A","text":"Euclidean 算法"},{"key":"B","text":"中国剩余定理"},{"key":"C","text":"费马小定理"},{"key":"D","text":"欧拉函数"}],"answer":"ABCD","analysis":"RSA 是数论知识的集中体现：密钥生成时用欧拉函数 φ(n)=(p-1)(q-1) 计算模数并求私钥指数（D）；用扩展欧几里得算法求 e 关于 φ(n) 的模逆（A）；费马小定理与欧拉定理是 e·d≡1 mod φ(n) 能保证加解密互逆的理论基础（C）；中国剩余定理用于 CRT 加速解密，把模 n 的大数运算拆成模 p、模 q 的小数运算（B）。四项都被 RSA 实际用到，故选全。","correctReason":"RSA 的密钥生成与加解密验证依赖欧拉函数和欧拉/费马定理，求模逆用扩展欧几里得算法，解密加速用中国剩余定理，四项缺一不可。","wrongReason":"本题四个选项均为 RSA 实际使用的数论工具，没有错误选项。","source":"PKCS #1 v2.2 RSA Cryptography Standard；《密码学导论》RSA 算法原理","keyPoint":"RSA 数论四件套：欧拉函数、模逆、费马/欧拉定理、CRT 加速"},{"id":"第二部分专业题-一、密码学-多选题-71","no":71,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"混淆和扩散是密码设计的一般原则，所以在很多密码设计中，都采用了代换 和置换等变化来达到混淆和扩散的效果。下列哪些密码体制中，采用了置换的处 理思想？（ ）","options":[{"key":"A","text":"RSA"},{"key":"B","text":"CAESAR 密码"},{"key":"C","text":"AES"},{"key":"D","text":"DES"}],"answer":"CD","analysis":"置换（permutation，即重新排列比特或字节的位置）是分组密码实现扩散的主要手段。AES 的行移位与列混合都属位置置换操作，DES 的初始置换 IP、扩展置换 E、P 盒置换和末置换 IP⁻¹ 更是典型的按位换位，故 C、D 正确。RSA 是建立在大整数分解难题上的公钥体制，运算为模幂而非置换网络，A 错；凯撒密码属于字母表整体平移的单表代换密码，是代换而非置换，B 错。区分代换（换值）与置换（换位）是本题关键。","correctReason":"AES 的 ShiftRows/MixColumns 与 DES 的 IP、E、P 置换盒都通过重新排列比特位置实现扩散，属于典型的置换操作。","wrongReason":"A：RSA 是基于大整数分解难题的公钥算法，运算为模幂运算，不采用置换结构；B：凯撒密码是字母表整体平移的单表代换密码，属于代换而非置换。","source":"FIPS 197 Advanced Encryption Standard (AES)；FIPS 46-3 Data Encryption Standard (DES)","keyPoint":"代换换值、置换换位；AES/DES 用置换，凯撒用代换"},{"id":"第二部分专业题-一、密码学-多选题-72","no":72,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"根据密钥信息的交换方式，密钥分发可以分为（ ）两类。","options":[{"key":"A","text":"人工（离线）密钥分发"},{"key":"B","text":"自动（在线）密钥分发"},{"key":"C","text":"固定密钥分发"},{"key":"D","text":"随机密钥分发"}],"answer":"AB","analysis":"按密钥信息「用什么手段送到对方手中」来划分，只有人工（离线）分发和自动（在线）分发两大类：人工方式靠专人、机要渠道传递密钥介质，安全但效率低；自动方式借助密钥分发中心或密钥协商协议在网络上完成，效率高但对协议与信道安全要求高，故选 A、B。C「固定密钥分发」和 D「随机密钥分发」描述的是密钥本身是长期固定还是随机生成、以及更新策略，不是分发方式的分类维度，属于偷换概念。","correctReason":"按密钥信息的交换手段划分，密钥分发即分为人工（离线）分发与自动（在线）分发两类，这是通用的密钥管理分类方法。","wrongReason":"C：固定密钥描述的是密钥是否长期不变的使用策略，不是分发方式的分类；D：随机密钥描述的是密钥生成的随机性，同样不是分发方式的分类维度。","source":"《商用密码知识与技术》密钥管理章节（密钥分发方式分类）","keyPoint":"密钥分发两大类：人工离线、自动在线"},{"id":"第二部分专业题-一、密码学-多选题-73","no":73,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"以下哪些密码系统的参数应该与密钥一样进行保护（ ）。","options":[{"key":"A","text":"SM4 加密过程中的轮密钥"},{"key":"B","text":"密码算法中随机数发生器的内部状态"},{"key":"C","text":"椭圆曲线密码体制所使用的域的参数"},{"key":"D","text":"SM2 密钥交换临时产生的随机数"}],"answer":"ABD","analysis":"判断标准是「泄露后是否直接危害密钥安全」。SM4 的轮密钥由主密钥扩展而来，掌握全部轮密钥即可反推主密钥，必须按密钥保护（A）；随机数发生器的内部状态一旦泄露，攻击者就能预测后续所有输出随机数，等价于掌握密钥（B）；SM2 密钥交换中的临时随机数就是临时私钥，泄露会直接导致会话密钥被算出（D）。而椭圆曲线的域参数（p、a、b、基点、阶等）是公开的曲线常量，强调的是标准化与可验证性而非保密，故 C 不选。","correctReason":"轮密钥、随机数发生器内部状态和密钥交换临时随机数都与密钥等价或可直接推导出密钥，泄露即失密，必须按密钥要求保护。","wrongReason":"C：椭圆曲线域参数是公开的系统参数，无需保密，只有轮密钥、随机数发生器内部状态等泄露才会直接危及密钥。","source":"GB/T 32907-2016《信息安全技术 SM4 分组密码算法》；GM/T 0003.3-2012《SM2 椭圆曲线公钥密码算法 第 3 部分：密钥交换协议》","keyPoint":"凡是能推回密钥或预测随机数的中间量，都要当密钥保护"},{"id":"第二部分专业题-一、密码学-多选题-74","no":74,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"以下关于密钥派生的说法正确的有（ ）。","options":[{"key":"A","text":"从口令派生密钥可用于加密存储设备"},{"key":"B","text":"从口令派生密钥可用于网络通信数据保护"},{"key":"C","text":"可以基于HMAC 算法实现"},{"key":"D","text":"可以基于CMAC 算法实现"}],"answer":"AC","analysis":"从口令派生密钥的典型用途是对本地存储介质加密（如全盘加密、加密容器），口令只在本地使用、不必在网络上传输，能较好规避口令熵低、易被离线猜测的风险，故选 A。基于 HMAC 构造的 PBKDF（如 PBKDF2-HMAC）是口令派生的标准做法，故选 C。B 不选：低熵口令派生的密钥不宜直接用于网络通信数据保护；D 不选：CMAC 是分组密码消息认证码算法，用于完整性校验，并非密钥派生的构造基础。","correctReason":"从口令派生密钥适用于本地存储加密场景，且可用 HMAC 构造 PBKDF 来实现密钥派生，这是口令派生的标准用法。","wrongReason":"B：口令熵低，由口令派生的密钥不宜直接用于网络通信数据保护，网络会话密钥应由密钥协商或密钥分发机制产生；D：CMAC 属于分组密码消息认证码算法，不是密钥派生函数的构造基础。","source":"GM/T 0091-2020《基于口令的密钥派生规范》；NIST SP 800-132 Recommendation for Password-Based Key Derivation","keyPoint":"口令派生多用于本地存储加密，PBKDF 常基于 HMAC 构造"},{"id":"第二部分专业题-一、密码学-多选题-75","no":75,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"在对称分组密码AES 中，共进行10 轮迭代变换，第10 轮进行了处理变换 有（ ）。","options":[{"key":"A","text":"字节代换"},{"key":"B","text":"行移位"},{"key":"C","text":"列混合"},{"key":"D","text":"轮密钥加"}],"answer":"ABD","analysis":"AES-128 共 10 轮，前 9 轮每轮依次执行字节代换（SubBytes）、行移位（ShiftRows）、列混合（MixColumns）、轮密钥加（AddRoundKey）；为使加解密结构对称、便于实现，最后一轮省略列混合，只做字节代换、行移位和轮密钥加，故选 A、B、D。C 不选的原因就在于第 10 轮不执行 MixColumns，这也是考查 AES 轮结构时最常设置的坑点。记忆口诀：最后一轮「少一步列混合」。","correctReason":"AES 的末轮只执行字节代换、行移位和轮密钥加，省略列混合，这是 AES 既定的轮结构设计。","wrongReason":"C：列混合只在前 Nr-1 轮中执行，第 10 轮（末轮）不含列混合，故不是第 10 轮的变换。","source":"FIPS 197 Advanced Encryption Standard (AES) 5.1 节 Cipher","keyPoint":"AES 末轮无列混合，只有字节代换、行移位、轮密钥加"},{"id":"第二部分专业题-一、密码学-多选题-76","no":76,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"盲签名与普通签名相比，其显著特点为（ ）。","options":[{"key":"A","text":"签名者使用自己的公钥进行签名"},{"key":"B","text":"签名者不知道所签署的数据内容"},{"key":"C","text":"签名者先签名，然后再加密自己的签名，从而达到隐藏签名的目的"},{"key":"D","text":"在签名被接收者泄露后，签名者不能跟踪签名"}],"answer":"BD","analysis":"盲签名由 Chaum 提出，两大本质特征是盲性与不可追踪性：用户先把消息盲化再交给签名者，签名者看不到真实内容就完成签名（B）；事后即使签名被公开，签名者也无法把该签名与自己当初的那次签名行为对应起来（D）。A 不是盲签名的特点，普通数字签名同样是用签名者自己的私钥签名、公钥验证；C 描述的是「先签名再加密」的隐藏手段，属于对盲签名原理的常见误解，盲签名靠盲化因子而非对签名加密实现隐藏，故不选。","correctReason":"盲签名的定义性特征就是签名者对所签内容不可见（盲性），以及签名公开后签名者无法追踪关联（不可追踪性）。","wrongReason":"A：使用自己的私钥签名、公钥验证是所有数字签名的共同做法，不是盲签名区别于普通签名的特点；C：盲签名通过盲化变换隐藏消息内容，并非「先签名再加密签名」，该描述是对其原理的误解。","source":"《商用密码知识与技术》数字签名章节（盲签名、群签名等特殊签名机制）","keyPoint":"盲签名两特征：签名者不知内容、事后无法追踪"},{"id":"第二部分专业题-一、密码学-多选题-77","no":77,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"以下操作方式，可能出现安全问题的是（ ）。","options":[{"key":"A","text":"使用ECB 对于RGB 图片进行加密"},{"key":"B","text":"使用固定IV 的CBC 模式进行性别的加密"},{"key":"C","text":"明文传递CTR 模式的计数器值"},{"key":"D","text":"未采用可靠方式传递根CA 的自签名证书"}],"answer":"ABD","analysis":"本题把工作模式与 PKI 的典型错误用法放在一起考查。ECB 逐块独立加密、不隐藏数据模式，图像加密后轮廓仍清晰可见，故 A 有问题；CBC 用固定 IV 时相同明文得到相同密文，性别这种取值极少的字段等于直接暴露，故 B 有问题；根 CA 自签名证书是信任链起点，经不可靠渠道传递可能被替换为伪造根证书，使整条证书链可被伪造，故 D 有问题。CTR 的计数器值不是密钥，同一密钥下计数不重复即可明文传输，故 C 不属安全问题。","correctReason":"ECB 保留数据模式、固定 IV 导致相同明文产生相同密文、根证书经不可靠渠道传递破坏信任链，这三种做法都会产生真实的安全问题。","wrongReason":"C：CTR 模式的计数器值不属于秘密信息，可以明文传递，只要保证同一密钥下计数值不重复就不会造成密钥流复用，因此不构成安全问题。","source":"GB/T 17964-2021《信息安全技术 分组密码算法的工作模式》；GB/T 20518-2018《信息安全技术 公钥基础设施 数字证书格式》","keyPoint":"ECB 露模式、固定 IV 露重复、根证书必须可信传递"},{"id":"第二部分专业题-一、密码学-多选题-78","no":78,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"PKI 的基本组成包括（ ）。","options":[{"key":"A","text":"CA"},{"key":"B","text":"KM"},{"key":"C","text":"RA"},{"key":"D","text":"密钥分发中心"}],"answer":"ABC","analysis":"PKI 的基本组成是 CA（认证机构，负责证书的签发、更新与撤销）、RA（注册审核机构，负责用户身份审核与证书申请受理）、KM（密钥管理机构，负责密钥的生成、存储、备份与恢复等），即 A、B、C。D 的密钥分发中心（KDC）是对称密钥体制下为通信双方分发会话密钥的设施，属于 Kerberos 一类对称密钥管理体系，不是 PKI 的组成部分。区别点在于：PKI 靠数字证书把公钥与身份绑定，不需要在线分发密钥。","correctReason":"PKI 的基本组成包括认证机构 CA、注册审核机构 RA 和密钥管理机构 KM，三者共同完成身份审核、证书签发和密钥管理。","wrongReason":"D：密钥分发中心 KDC 是对称密码体制中分发会话密钥的设施，与 PKI 基于证书的公钥管理机制不同，不属于 PKI 基本组成。","source":"GB/T 20518-2018《信息安全技术 公钥基础设施 数字证书格式》；GB/T 19713-2005《信息安全技术 公钥基础设施 在线证书状态协议》","keyPoint":"PKI 三件套：CA、RA、KM；KDC 是对称体制的"},{"id":"第二部分专业题-一、密码学-多选题-79","no":79,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"对用户的身份鉴别基本方法可以分为（ ）。","options":[{"key":"A","text":"基于虹膜的身份鉴别"},{"key":"B","text":"基于秘密信息的身份鉴别"},{"key":"C","text":"基于指纹的身份鉴别"},{"key":"D","text":"基于人脸的身份鉴别"}],"answer":"ABCD","analysis":"身份鉴别按依据可分为三类：基于秘密信息（口令、密钥，即「你知道什么」）、基于持有物（令牌、USBKey，即「你拥有什么」）、基于生物特征（「你是什么」）。虹膜、指纹、人脸都属于生物特征鉴别，分别利用人眼虹膜纹理、指纹脊线特征和人脸几何特征做比对，都是现实中成熟应用的方法，故 A、B、C、D 均正确。本题为全选，答题时要避免只选「基于秘密信息」而漏掉三类生物特征选项。","correctReason":"基于口令/密钥等秘密信息的鉴别与基于虹膜、指纹、人脸等生物特征的鉴别都是现实中普遍采用的用户身份鉴别方法，均属基本方法范畴。","wrongReason":"本题四个选项均为现实中采用的用户身份鉴别方法，没有错误选项。","source":"GB/T 15843 系列《信息技术 安全技术 实体鉴别》；GB/T 37092-2018《信息安全技术 生物特征识别信息保护基本要求》","keyPoint":"鉴别三要素：秘密信息（知道）、持有物（拥有）、生物特征（本身）"},{"id":"第二部分专业题-一、密码学-多选题-80","no":80,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"我国涉密人员分为（ ）。","options":[{"key":"A","text":"核心涉密人员"},{"key":"B","text":"非常重要涉密人员"},{"key":"C","text":"重要涉密人员"},{"key":"D","text":"一般涉密人员"}],"answer":"ACD","analysis":"按照涉密岗位和接触、知悉国家秘密的程度，我国把涉密人员分为核心涉密人员、重要涉密人员和一般涉密人员三类，即 A、C、D，并实行分类确定、分级管理，对应不同的审查、保密教育培训和出境管理要求。B「非常重要涉密人员」不是法定的等级名称，是命题人编造的干扰项。记忆要点：涉密人员三级、涉密岗位三类，均与国家秘密的密级划分相对应，不可自创名称。","correctReason":"涉密人员按接触、知悉国家秘密的程度划分为核心、重要和一般三个等级，这是保密管理中的法定分类方式。","wrongReason":"B：我国涉密人员等级中没有「非常重要涉密人员」这一名称，属于编造的干扰项。","source":"《中华人民共和国保守国家秘密法》（涉密人员分类管理相关规定）","keyPoint":"涉密人员三级：核心、重要、一般"},{"id":"第二部分专业题-一、密码学-多选题-81","no":81,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"常见的后量子密码（或抗量子密码）技术的研究领域主要包括（ ）。","options":[{"key":"A","text":"基于编码后量子密码"},{"key":"B","text":"基于多变量后量子密码"},{"key":"C","text":"基于格后量子密码"},{"key":"D","text":"基于杂凑算法后量子密码"}],"answer":"ABCD","analysis":"后量子密码的主流路线包括基于格（如 Kyber、Dilithium）、基于编码（如 McEliece）、基于多变量多项式（如 Rainbow 一类）、基于杂凑（如 SPHINCS+、Merkle 签名树），此外还有基于同源椭圆曲线等，因此 A、B、C、D 均属其中。发展后量子密码的原因是 Shor 算法能在量子计算机上破解 RSA 与 ECC，而上述体制尚无已知的高效量子攻击算法。注意基于杂凑的签名也是国际标准化的重要路线。","correctReason":"基于编码、多变量、格和杂凑算法都是国际公认的后量子密码研究方向，各自有代表性方案并已进入标准化进程。","wrongReason":"本题四个选项均为后量子密码的主流研究领域，没有错误选项。","source":"NIST FIPS 203/204/205（后量子密码标准）；中国密码学会《后量子密码算法竞争性评估报告》","keyPoint":"后量子五路线：格、编码、多变量、杂凑、同源"},{"id":"第二部分专业题-一、密码学-多选题-82","no":82,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"我国SM2 公钥密码算法包含的3 个算法是（ ）。","options":[{"key":"A","text":"数字签名算法"},{"key":"B","text":"密钥封装算法"},{"key":"C","text":"密钥交换协议"},{"key":"D","text":"公钥加密解密算法"}],"answer":"ACD","analysis":"GM/T 0003 把 SM2 分为三部分：数字签名算法、密钥交换协议、公钥加密解密算法，因此选 A、C、D。B 的密钥封装（KEM）不是 SM2 的功能，而是 SM9 标识密码提供的能力，命题人正是用「封装」与「加密」的形近来设坑。复习时建议把 SM2 的「签、换、加」三条腿与 SM9 的「签名、密钥交换、密钥封装、公钥加密」并排对照记忆，避免功能张冠李戴。","correctReason":"SM2 标准明确规定其由数字签名算法、密钥交换协议和公钥加密解密算法三部分组成。","wrongReason":"B：SM2 不提供独立的密钥封装算法，密钥封装（KEM）是 SM9 标识密码算法的功能组成，故不属于 SM2 的三个算法。","source":"GM/T 0003-2012《SM2 椭圆曲线公钥密码算法》（共 4 部分）；GM/T 0044-2016《SM9 标识密码算法》","keyPoint":"SM2 = 签名 + 密钥交换 + 公钥加解密；封装是 SM9 的"},{"id":"第二部分专业题-一、密码学-多选题-83","no":83,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"评价密码系统安全性主要有以下哪些方法？（ ）","options":[{"key":"A","text":"计算安全性"},{"key":"B","text":"无条件安全性"},{"key":"C","text":"加密安全性"},{"key":"D","text":"可证明安全性"}],"answer":"ABD","analysis":"密码体制安全性评价分为三个层次：无条件安全（也称完善保密性，即使攻击者拥有无穷计算能力也无法破解，如一次一密）、计算安全（破解所需代价超出攻击者拥有的计算资源或时间，是现实系统的通用标准）、可证明安全（把破解方案归约到某个公认的数学难题上，从而给出安全性证明），故选 A、B、D。C「加密安全性」是杜撰的说法，密码安全评价体系中并无此分类，属于典型的形近干扰项。","correctReason":"密码系统安全性的标准评价方法就是无条件安全性、计算安全性和可证明安全性三种，分别对应信息论、计算复杂度和归约证明三个角度。","wrongReason":"C：安全评价体系中没有「加密安全性」这一分类，属杜撰的干扰项。","source":"《密码学导论》密码体制安全性评价（无条件安全、计算安全、可证明安全）","keyPoint":"安全性三层次：无条件安全、计算安全、可证明安全"},{"id":"第二部分专业题-一、密码学-多选题-84","no":84,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"消息鉴别是用来验证消息完整性的一种机制或服务。消息鉴别的内容包括 （ ）。","options":[{"key":"A","text":"证实消息的信源"},{"key":"B","text":"证实消息内容是否被篡改"},{"key":"C","text":"保护消息的机密性"},{"key":"D","text":"保护用户隐私"}],"answer":"AB","analysis":"消息鉴别（如消息鉴别码、带密钥杂凑、数字签名）解决两件事：确认消息来自预期的信源（信源认证，A），以及确认消息内容在传输过程中未被篡改（完整性校验，B）。机密性靠加密实现，属于另一类安全服务，消息鉴别本身并不隐藏内容，故 C 不选；用户隐私保护依赖去标识化、最小化收集、访问控制等一整套机制，也不是消息鉴别的功能，故 D 不选。答题要点：鉴别不等于加密，鉴别管真不真、加密管看不看得见。","correctReason":"消息鉴别机制用于证实消息的信源真实性和消息内容未被篡改，这正是完整性服务所包含的两项核心内容。","wrongReason":"C：机密性由加密机制提供，消息鉴别只做真伪校验，不隐藏消息内容；D：用户隐私保护依靠个人信息处理规范与去标识化等技术，不属于消息鉴别的内容。","source":"GB/T 15852 系列《信息技术 安全技术 消息鉴别码》；GB/T 25069-2022《信息安全技术 术语》","keyPoint":"消息鉴别只管信源真伪与内容完整，不管机密性"},{"id":"第二部分专业题-一、密码学-多选题-85","no":85,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"古典密码体制的分析方法有（ ）。","options":[{"key":"A","text":"统计分析法"},{"key":"B","text":"明文-密文分析法"},{"key":"C","text":"穷举分析法"},{"key":"D","text":"重合指数法"}],"answer":"ABCD","analysis":"古典密码（凯撒、维吉尼亚、仿射、Playfair、Hill 等）密钥空间小、结构简单，对应的分析手段有：统计分析（利用字母频率分布还原代换表，A）、明文-密文分析（即已知明密文对的已知明文攻击，B）、穷举分析（密钥空间小，可直接试遍全部密钥，C）、重合指数法（用重合指数判断多表代换的密钥长度，是破译维吉尼亚密码的关键步骤，D）。四种方法在古典密码分析中都有实际应用，故选全。","correctReason":"统计分析法、明文-密文分析法、穷举分析法和重合指数法都是古典密码破译中实际使用的经典分析方法。","wrongReason":"本题四个选项均为古典密码分析中实际使用的方法，没有错误选项。","source":"《密码学导论》古典密码及其分析方法（频率分析、重合指数、Kasiski 检验）","keyPoint":"古典密码破译四招：频率统计、已知明密文、穷举、重合指数"},{"id":"第二部分专业题-一、密码学-多选题-86","no":86,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"为了提高DES 的安全性，并充分利用现有的软硬件资源， 人们已设计开发 了DES 的多种变异版本，下面（ ）属于DES 变异版本。","options":[{"key":"A","text":"2DES"},{"key":"B","text":"3DES"},{"key":"C","text":"4DES"},{"key":"D","text":"5DES"}],"answer":"AB","analysis":"DES 密钥仅 56 位，为提升强度并沿用已有的软硬件实现，人们设计出多重加密的变异版本，公认的只有双重 DES（2DES）和三重 DES（3DES，含 EDE 等方式），故选 A、B。其中 2DES 因中间相遇攻击只需约 2^57 次运算，实际安全增益有限；3DES 才是被广泛采用并标准化的方案。C、D 提到的 4DES、5DES 并非通行的 DES 变异版本，增加层数收益有限且无标准化实现，属于编造的干扰项。","correctReason":"DES 的公认变异版本是双重 DES（2DES）和三重 DES（3DES），它们通过多次加密提高有效密钥长度，并可直接复用原有 DES 实现。","wrongReason":"C：4DES 不是通行的 DES 变异版本，安全增益有限且无标准化实现；D：5DES 并非存在的 DES 变异版本，属编造的干扰项。","source":"FIPS 46-3 Data Encryption Standard (DES)（含 TDEA 三重 DES）；NIST SP 800-67","keyPoint":"DES 变异只有 2DES、3DES，3DES 才是实际采用方案"},{"id":"第二部分专业题-一、密码学-多选题-87","no":87,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"AES 分组密码算法加密过程的轮数可以是（ ）。","options":[{"key":"A","text":"10 轮"},{"key":"B","text":"12 轮"},{"key":"C","text":"14 轮"},{"key":"D","text":"16 轮"}],"answer":"ABC","analysis":"AES 分组长度固定为 128 位，轮数由密钥长度决定：AES-128 为 10 轮，AES-192 为 12 轮，AES-256 为 14 轮，故选 A、B、C。AES 标准中不存在 16 轮的版本，D 是干扰项。记忆口诀：轮数 = 密钥长度（比特）/32 + 6，即 128→10、192→12、256→14。要注意 AES 只改变密钥长度和轮数，分组长度始终是 128 位。","correctReason":"AES 的轮数由密钥长度确定：128 位密钥 10 轮、192 位密钥 12 轮、256 位密钥 14 轮，三种轮数都对应合法的 AES 版本。","wrongReason":"D：AES 标准中没有 16 轮的版本，16 轮不对应任何一种密钥长度。","source":"FIPS 197 Advanced Encryption Standard (AES) 5.1 节（Nr = 10/12/14）","keyPoint":"AES 轮数：128 位 10 轮、192 位 12 轮、256 位 14 轮"},{"id":"第二部分专业题-一、密码学-多选题-88","no":88,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"分组密码的认证模式与公钥体制下的数字签名相比，（ ）是共有的。","options":[{"key":"A","text":"保护数据机密性"},{"key":"B","text":"保护数据完整性"},{"key":"C","text":"数据起源认证"},{"key":"D","text":"运行速度快"}],"answer":"BC","analysis":"本题与「不是共有」的题目是同一考点的正反问法。分组密码的认证模式（如 CMAC、GMAC 等消息鉴别码机制）和数字签名都能发现数据被篡改（保护完整性，B），也都能让接收方确认数据来源（数据起源认证，C），故 B、C 是共有性质。A 不是共有：认证模式只做完整性校验，本身不加密数据，不保证机密性；D 也不是共有：认证使用对称分组密码，速度远快于公钥签名，快是认证模式单方面的优势。","correctReason":"两者都能校验数据是否被篡改，并提供数据起源认证，这是认证模式与数字签名共同具备的安全服务。","wrongReason":"A：认证模式本身不提供机密性，只有认证加密模式才同时保护机密性；D：对称认证运算速度远快于公钥签名，速度优势并非双方共有。","source":"GB/T 17964-2021《信息安全技术 分组密码算法的工作模式》；GB/T 15852 系列《信息技术 安全技术 消息鉴别码》","keyPoint":"认证模式与签名共有：完整性 + 数据起源认证"},{"id":"第二部分专业题-一、密码学-多选题-89","no":89,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"以下哪种算法属于分组密算法的是（ ）。","options":[{"key":"A","text":"IDEA"},{"key":"B","text":"RC4"},{"key":"C","text":"Blowfish"},{"key":"D","text":"RC5"}],"answer":"ACD","analysis":"分组密码把明文按固定长度分组后逐组加密：IDEA 分组 64 位（8 轮，曾用于 PGP）、Blowfish 分组 64 位（密钥长度可变）、RC5 分组长度与轮数均可参数化，都是典型的分组密码，故选 A、C、D。RC4 是流密码，按字节生成伪随机密钥流与明文逐字节异或（曾用于 WEP、SSL），结构上不属于分组密码，故 B 不选。辨识要点：带 RC 编号的算法既有流密码也有分组密码，RC4 是流密码，RC5/RC6 才是分组密码。","correctReason":"IDEA、Blowfish 和 RC5 都按固定长度分组、经多轮迭代完成加密，均属于分组密码算法。","wrongReason":"B：RC4 是流密码算法，按字节产生密钥流与明文逐字节异或，不具备分组迭代结构，不属于分组密码。","source":"《密码学导论》分组密码与流密码分类；RFC 4345（Blowfish 在 SSH 中的应用）","keyPoint":"IDEA/Blowfish/RC5 是分组密码，RC4 是流密码"},{"id":"第二部分专业题-一、密码学-多选题-90","no":90,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"以ZUC 算法为核心，成为3GPPLTE 标准的算法为（ ）。","options":[{"key":"A","text":"128EEA-3"},{"key":"B","text":"128EIA-3"},{"key":"C","text":"128UEA-3"},{"key":"D","text":"128UIA-3"}],"answer":"AB","analysis":"ZUC 是我国自主设计的面向移动通信的序列密码算法，被 3GPP 采纳为 LTE 的机密性算法 128-EEA3（用 ZUC 产生密钥流加密）和完整性算法 128-EIA3（基于 ZUC 计算消息鉴别码），故选 A、B。C、D 的 UEA/UIA 是 3G 网络（UTRAN）体系中对应算法的编号，命名体系不同，故不选。抓住「E 表示 Evolved（LTE）、U 表示 UMTS（3G）」的命名规律即可区分。","correctReason":"ZUC 被 3GPP 标准化为 LTE 的加密算法 128-EEA3 和完整性保护算法 128-EIA3，这两个算法正是以 ZUC 为核心。","wrongReason":"C：128-UEA3 属于 3G（UTRAN）体系的加密算法编号，不是以 ZUC 为核心的 LTE 标准算法；D：128-UIA3 同样属于 3G 体系完整性算法编号，与 LTE 的 EIA 系列命名不同。","source":"3GPP TS 35.221 Specification of the 3GPP Confidentiality and Integrity Algorithms 128-EEA3 & 128-EIA3 (ZUC)；GM/T 0001-2012《祖冲之序列密码算法》","keyPoint":"ZUC = LTE 的 128-EEA3（加密）+ 128-EIA3（完整性）"},{"id":"第二部分专业题-一、密码学-多选题-91","no":91,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"关于ZUC 算法描述正确的是（ ）。","options":[{"key":"A","text":"3GPPLTE 唯一标准"},{"key":"B","text":"基于素域上的LFSR 设计"},{"key":"C","text":"算法结构新颖"},{"key":"D","text":"算法软硬件实现性能良好"}],"answer":"BCD","analysis":"ZUC（祖冲之）是我国自主设计的序列密码算法，采用三层结构：定义在素域 GF(2^31−1) 上的 16 级 LFSR、比特重组 BR 和非线性函数 F。这种设计在序列密码中比较少见，结构新颖，且软硬件实现开销小、吞吐率高，被 3GPP 采纳为 LTE 的机密性算法 EEA3 和完整性算法 EIA3。但 3GPP LTE 并非只有 ZUC 一种算法，SNOW 3G、AES 同样被采用，所以说它是“唯一标准”不成立。","correctReason":"B、C、D 成立：ZUC 的 LFSR 定义在素域 GF(2^31−1) 上，结构新颖，软硬件实现性能良好，已被 3GPP 采纳。","wrongReason":"A：ZUC 只是 3GPP LTE 的机密性/完整性算法之一（EEA3/EIA3），SNOW 3G、AES 也被采用，并非唯一标准。","source":"GM/T 0001.1-2012《祖冲之序列密码算法 第1部分：算法描述》；3GPP TS 35.221","keyPoint":"ZUC＝素域 LFSR＋比特重组＋非线性函数 F，是 LTE 算法之一而非唯一。"},{"id":"第二部分专业题-一、密码学-多选题-92","no":92,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"下列选项中可能涉及密码杂凑运算的是（ ）。","options":[{"key":"A","text":"消息机密性"},{"key":"B","text":"消息完整性"},{"key":"C","text":"消息鉴别码"},{"key":"D","text":"数字签名"}],"answer":"BCD","analysis":"密码杂凑函数把任意长数据压缩成定长摘要，具有单向性和抗碰撞性，典型用途是完整性校验、消息鉴别码和数字签名。完整性保护通过比对杂凑值实现；消息鉴别码如 HMAC 本身就是用杂凑函数构造的带密钥摘要；数字签名则是先对消息做杂凑、再对摘要用私钥签名。而消息机密性要靠加密算法（SM4、ZUC 等）实现，杂凑函数不可逆且不带密钥，不能用来保密数据。","correctReason":"B、C、D 成立：完整性校验用杂凑值、消息鉴别码（如 HMAC）以杂凑构造、数字签名先杂凑后签名，都涉及杂凑运算。","wrongReason":"A：消息机密性由加密算法（分组密码、序列密码）提供，杂凑函数无密钥且不可逆，不用于保密。","source":"GB/T 32905-2016《信息安全技术 SM3密码杂凑算法》","keyPoint":"杂凑用于完整性、MAC、签名；机密性靠加密，与杂凑无关。"},{"id":"第二部分专业题-一、密码学-多选题-93","no":93,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"杂凑算法又称密码散列、杂凑算法、摘要算法。到目前为止，以下算法是不 安全的杂凑算法的有（ ）。","options":[{"key":"A","text":"MD4"},{"key":"B","text":"RIPEMD"},{"key":"C","text":"SM3"},{"key":"D","text":"SHA-0"}],"answer":"ABD","analysis":"杂凑算法的安全性核心是抗碰撞和抗原像。MD4 输出仅 128 位，2004 年前后已被给出实用碰撞攻击；SHA-0 是 SHA-1 的前身，因设计缺陷碰撞攻击更易实现；早期 RIPEMD（RIPEMD-128）摘要偏短、安全性不足，同样不应再用于安全场景。SM3 是我国自主设计的 256 位杂凑算法，目前未发现有效碰撞攻击，属于安全算法，所以不选 C。","correctReason":"A、B、D 成立：MD4、SHA-0 及早期 RIPEMD 均已被碰撞攻击或安全性不足，不宜继续使用。","wrongReason":"C：SM3 是 256 位国产杂凑算法，抗碰撞性良好，属于安全算法，不是本题要找的“不安全杂凑算法”。","source":"GB/T 32905-2016《信息安全技术 SM3密码杂凑算法》；MD4/SHA-0 碰撞攻击见 CRYPTO 2004、EUROCRYPT 2005 公开结果","keyPoint":"MD4、SHA-0、早期 RIPEMD 均已不安全。"},{"id":"第二部分专业题-一、密码学-多选题-94","no":94,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"某信息系统部署了同一生产厂商的4 台应用服务器，其中，2 台型号为A， 操作系统版本分别为 C，2 台型号为D，操作系统版本分别为E、F；2 台服务器 密码机（商用密码产品认证证书编号分别为GMxxx、GMyyy）；以下关于设备 和计算安全层面测评对象选取的做法中，错误的是（ ）。","options":[{"key":"A","text":"从4 台应用服务器抽选1 台作为测评对 象，从2 台服务器密码机抽选1 台作 为测评对象"},{"key":"B","text":"从不同型号的应用服务器分别抽选1 台作为测评对象，2 台服务器密码机分别 作为测评对象"},{"key":"C","text":"4 台应用服务器分别作为测评对象，2 台服务器密码机也分别作为测评对象"},{"key":"D","text":"从不同操作系统版本的应用服务器抽选1 台作为测评对 象，2 台服务器密码 机分别作为测评对象"}],"answer":"ABD","analysis":"密评中测评对象选取有明确规则：同型号、同操作系统版本的设备可以抽样，型号或操作系统版本不同的应分别选取，服务器密码机等密码产品则应按商用密码产品认证证书逐台选取。本题 4 台应用服务器分属型号 A（版本 C）与型号 D（版本 E、F），至少要按型号与版本组合分别选取；2 台密码机证书编号为 GMxxx、GMyyy，属于不同产品，必须分别作为测评对象。因此只抽 1 台服务器、1 台密码机的做法覆盖不足。","correctReason":"B、C 成立：B 按不同型号分别抽取服务器、密码机逐台选取，C 全部设备均作为测评对象，都满足测评对象选取要求。","wrongReason":"A：只抽 1 台应用服务器、1 台密码机，未覆盖不同型号/版本及不同认证证书编号的密码产品；D：对不同操作系统版本只抽选 1 台，覆盖同样不全，且密码机未逐台选取。","source":"GM/T 0115-2021《信息安全技术 信息系统密码应用测评要求》；GB/T 39786-2021","keyPoint":"同型号同版本可抽样，型号/版本不同分别选取，密码机按证书逐台测。"},{"id":"第二部分专业题-一、密码学-多选题-95","no":95,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"以下不是背包公钥加密体制的是（ ）。","options":[{"key":"A","text":"LWE"},{"key":"B","text":"ECC"},{"key":"C","text":"Merkle-Hellman"},{"key":"D","text":"McEliece"}],"answer":"ABD","analysis":"背包公钥体制的安全性建立在子集和（背包）问题的困难性之上，最典型的是 Merkle-Hellman 体制及其改进版本。LWE 是基于带误差学习问题的格密码；ECC 基于椭圆曲线离散对数问题；McEliece 则基于纠错码译码困难性（Goppa 码），与背包问题没有关系。虽然这些都属于公钥密码，但只有 Merkle-Hellman 是背包体制，所以不选它。","correctReason":"C 是背包体制：Merkle-Hellman 用超递增背包加模乘变换构造陷门，属于经典背包公钥加密体制。","wrongReason":"A：LWE 属格密码，基于带误差学习问题；B：ECC 基于椭圆曲线离散对数问题；D：McEliece 基于纠错码译码困难性，三者都不是背包体制。","source":"公钥密码体制分类（Merkle-Hellman 1978 背包体制、McEliece 1978 纠错码体制、LWE 格密码）","keyPoint":"背包体制：Merkle-Hellman；McEliece 属纠错码。"},{"id":"第二部分专业题-一、密码学-多选题-96","no":96,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"SSL 协议可以实现的安全需求有（ ）。","options":[{"key":"A","text":"服务器对用户身份认证"},{"key":"B","text":"用户对服务器身份认证"},{"key":"C","text":"传输信息的机密性"},{"key":"D","text":"传输信息的完整性"}],"answer":"ABCD","analysis":"SSL/TLS 在握手阶段通过证书和数字签名完成身份认证：客户端验证服务器证书，实现用户对服务器的身份认证；若服务端要求并校验客户端证书，也能实现服务器对用户的身份认证。握手后双方协商出会话密钥，用对称加密保证传输信息的机密性，用 MAC 或 AEAD 保证完整性。因此四项安全需求 SSL 协议都能实现，只是客户端认证需要额外配置和部署，实际中常被省略。","correctReason":"四项均可实现：SSL 支持基于证书的双向身份认证（客户端认证为可选），并协商会话密钥提供传输机密性和完整性。","wrongReason":"本题四个选项均正确，无错误项。","source":"GB/T 38636-2020《信息安全技术 传输层密码协议（TLCP）》（SSL/TLS 类协议的安全机制）","keyPoint":"SSL/TLS 可实现身份认证（可双向）、机密性、完整性三类需求。"},{"id":"第二部分专业题-一、密码学-多选题-97","no":97,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"以下关于SSL/TLS 说法，正确的是（ ）。","options":[{"key":"A","text":"使用SSL/TLS 可以确保通信报文的机密性"},{"key":"B","text":"在SSL/TLS 中，使用数字签名技术来认证通信双方的身份"},{"key":"C","text":"在SSL/TLS 中，可以确保通信报文的完整性"},{"key":"D","text":"在SSL/TLS 中，一定是实现了双向身份鉴别"}],"answer":"ABC","analysis":"SSL/TLS 握手阶段协商会话密钥，之后用对称加密保护通信报文的机密性，用 MAC 或 AEAD 保护完整性，并通过证书和数字签名认证通信方身份，所以 A、B、C 成立。但 TLS 默认只要求服务器提供证书、由客户端验证服务器，属于单向身份鉴别；客户端身份鉴别是可选项，需要服务端明确要求客户端证书才会发生。因此“一定实现了双向身份鉴别”的说法过于绝对。","correctReason":"A、B、C 成立：SSL/TLS 用对称加密保证机密性、用 MAC 保证完整性、用证书与数字签名完成身份认证。","wrongReason":"D：TLS 默认为单向鉴别（客户端验证服务器证书），客户端鉴别属可选，并非一定实现双向鉴别。","source":"GB/T 38636-2020《信息安全技术 传输层密码协议（TLCP）》","keyPoint":"TLS 默认单向鉴别服务器；机密性、完整性、身份认证都有。"},{"id":"第二部分专业题-一、密码学-多选题-98","no":98,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"在密钥分发场景中，常见做法有（ ）。","options":[{"key":"A","text":"人工传递"},{"key":"B","text":"知识拆分"},{"key":"C","text":"通过密钥加密密钥（KEK）加密传输"},{"key":"D","text":"数字信封"}],"answer":"ABCD","analysis":"密钥分发要解决密钥如何安全送到使用方手中。人工传递（信使、专人递送）适合根密钥或少量高等级密钥；知识拆分把密钥分成多个分量分别保管、必要时合成，可避免单点掌握完整密钥；用密钥加密密钥 KEK 加密数据密钥后再传输，是密钥分层保护的基本做法；数字信封则用接收方公钥加密会话密钥。这四种都是密钥分发场景中的常见做法。","correctReason":"四项都是常见密钥分发方式：人工传递、知识拆分（分量保管）、KEK 加密传输、数字信封。","wrongReason":"本题四个选项均正确，无错误项。","source":"GB/T 17901.1-2020《信息技术 安全技术 密钥管理 第1部分：框架》","keyPoint":"密钥分发＝人工传递／知识拆分／KEK 加密／数字信封。"},{"id":"第二部分专业题-一、密码学-多选题-99","no":99,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"某三级信息系统运维人员从互联网， 通过SSLVPN 接入内网后，再登录堡 垒机对系统中的服务器进行远程运维管理，运维人员均配置了智能密码钥匙，则 在网络和通信安全层面的“身份鉴别”的主要测评内容包括（ ）。","options":[{"key":"A","text":"客户端对SSLVPN 服务端的身份鉴别"},{"key":"B","text":"SSLVPN 服务端对客户端使用智能密码钥匙的身份鉴别"},{"key":"C","text":"第三方电子认证服务"},{"key":"D","text":"身份鉴别过程是否采用了挑战响应机制"}],"answer":"ABD","analysis":"题干场景中，运维人员经 SSLVPN 从互联网接入内网，通信双方是客户端与 SSLVPN 服务端，因此网络和通信安全层面的身份鉴别要看：客户端对 SSLVPN 服务端的鉴别（一般通过验证服务端证书）、服务端对客户端基于智能密码钥匙的鉴别，以及鉴别过程是否采用挑战—响应机制、随机数是否新鲜。第三方电子认证服务属于证书服务的合规性核查内容，不属于该层面身份鉴别测评单元的内容。","correctReason":"A、B、D 成立：测评通信双方相互身份鉴别以及是否采用挑战响应机制，符合网络和通信安全层面“身份鉴别”的要求。","wrongReason":"C：第三方电子认证服务属证书服务合规性内容，不是网络和通信安全层面身份鉴别测评单元的测评内容。","source":"GB/T 39786-2021（第三级）网络和通信安全层面“身份鉴别”；GM/T 0115-2021","keyPoint":"网络层身份鉴别看双方互鉴别＋挑战响应机制。"},{"id":"第二部分专业题-一、密码学-多选题-100","no":100,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"网络和通信安全、应用和数据安全都有传输安全性（机密性、完整性）的 要求，以下说法正确的是（ ）。","options":[{"key":"A","text":"如果网络和通信安全层面合规，应用和数据安全层面的传输机密性和完整性未 采用密码技 术，则网络层可以缓解应用层传输安全的风险"},{"key":"B","text":"如果应用和数据安全层面的某关键数据传输机密性和完整性符合要求，网络和 通信安全层面未采用密码技术，则应用层可以弥补网络层的传输安全"},{"key":"C","text":"两个安全层面的数据保护对象不一样"},{"key":"D","text":"两个安全层面可以相互弥补，降低风险"}],"answer":"ABCD","analysis":"网络和通信安全层面保护的是通信实体与通信信道，应用和数据安全层面保护的是具体业务应用和数据，两层保护对象不同，不能互相替代，必须分别测评。但在风险分析上两者可以相互缓解：网络层已用密码技术保护传输，应用层明文传输的风险就能得到一定缓解；反之对关键数据在应用层做了加密和完整性保护，也能降低网络层未采用密码技术带来的风险。所以四句话都成立。","correctReason":"四项成立：两层保护对象不同，但一层合规可缓解另一层同类传输风险，可相互弥补、降低风险。","wrongReason":"本题四个选项均正确，无错误项。","source":"GB/T 39786-2021；GM/T 0115-2021（风险缓解与弥补分析）","keyPoint":"网络层管信道、应用层管业务数据；可相互缓解但不能相互替代。"},{"id":"第二部分专业题-一、密码学-多选题-101","no":101,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"信息系统可采用以下密码产品保护其应用和数据安全层面的安全（ ）","options":[{"key":"A","text":"利用智能密码钥匙、智能 IC 卡、动态令牌等作为用户登录应用的凭证。"},{"key":"B","text":"利用服务器密码机等设备对应用系统指定的重要数据进行加密和计算消息杂 凑后传输，实现对重要数据（在应用和数据安全层 面）在传输过程中的保密性 和完整性保护。"},{"key":"C","text":"利用服务器密码机等设备对重要数据进行加密、计算 MAC 或签名后存储在 数据库中，实现对重要数据在存储过程中的保密性和完整性保护。"},{"key":"D","text":"利用签名验签服务器、智能密码钥匙、电子签章系统、时间戳服务器等设备实 现对可能涉及法律责任认定的数据原发、接收行为的不可否认性"}],"answer":"ACD","analysis":"应用和数据安全层面围绕身份鉴别、访问控制、机密性、完整性、不可否认性来选配密码产品。用智能密码钥匙、智能 IC 卡、动态令牌做登录凭证属于身份鉴别；用服务器密码机加密并计算 MAC 或签名后存储，可保护存储数据的机密性和完整性；用签名验签服务器、电子签章、时间戳服务器可支撑不可否认性。B 的问题在于只“计算消息杂凑”，无密钥的杂凑值任何人都能重算，不具备抗篡改能力。","correctReason":"A、C、D 成立：分别对应身份鉴别、存储机密性与完整性（加密＋MAC 或签名）、不可否认性（签名、签章、时间戳）。","wrongReason":"B：仅计算消息杂凑（无密钥）不能防篡改，无法实现传输完整性保护，应改为 MAC 或数字签名。","source":"GB/T 39786-2021（应用和数据安全层面）；GM/T 0115-2021","keyPoint":"完整性要用带密钥的 MAC 或数字签名，裸杂凑值不能防篡改。"},{"id":"第二部分专业题-一、密码学-多选题-102","no":102,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"某信息系统部署在公有云平台的独立VPC 内，通过云平台的堡垒机对设备 进行远程管理，则在设备和计算安全层面“远程管理通道安全”测评单元的测评对 象为（ ）。","options":[{"key":"A","text":"堡垒机与设备之间的通信信道"},{"key":"B","text":"浏览器与堡垒机之间的通信信道"},{"key":"C","text":"浏览器与设备之间的通信信道"},{"key":"D","text":"设备与设备之间的通信信道"}],"answer":"AB","analysis":"“远程管理通道安全”测评的是管理终端到被管理设备这条管理通道有没有用密码技术保护。本题中运维人员先用浏览器登录公有云平台的堡垒机，再由堡垒机连接 VPC 内的设备，管理链路被拆成两段：浏览器与堡垒机之间、堡垒机与设备之间。浏览器与设备之间不存在直连通路，设备与设备之间也没有远程管理关系，所以测评对象只有这两段通信信道。","correctReason":"A、B 成立：远程管理通道由“浏览器—堡垒机”和“堡垒机—设备”两段通信信道组成，均为该单元测评对象。","wrongReason":"C：浏览器与设备之间不存在直连通信信道；D：设备与设备之间不存在远程管理通道，均不是测评对象。","source":"GB/T 39786-2021（设备和计算安全层面“远程管理通道安全”）；GM/T 0115-2021","keyPoint":"经堡垒机管理时分两段信道测评：浏览器—堡垒机、堡垒机—设备。"},{"id":"第二部分专业题-一、密码学-多选题-103","no":103,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"某电商平台包括用户注册业务和商品交易业务两大类，以下选项中属于应 用和数据安全层面的测评时关注的内容的是（ ）。","options":[{"key":"A","text":"用户注册业务"},{"key":"B","text":"商品交易业务"},{"key":"C","text":"交易订单数据"},{"key":"D","text":"用户浏览记录"}],"answer":"ABCD","analysis":"应用和数据安全层面的测评对象包括业务应用和业务数据。用户注册业务、商品交易业务是该平台两大类业务应用；注册信息、交易订单数据、用户浏览记录则是业务过程中产生和处理的数据。测评时要结合数据类别（个人信息、重要数据）和业务处理环节，核查身份鉴别、访问控制、机密性、完整性、不可否认性等是否采用密码技术保护。四类内容都在该层面的关注范围内。","correctReason":"四项都属于该层面关注内容：注册业务、交易业务是业务应用，订单数据、浏览记录是业务数据。","wrongReason":"本题四个选项均正确，无错误项。","source":"GB/T 39786-2021（应用和数据安全层面）；GM/T 0115-2021","keyPoint":"应用层测评对象＝业务应用＋业务数据（含个人信息）。"},{"id":"第二部分专业题-一、密码学-多选题-104","no":104,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"某电商平台用户需使用合规的智能密码钥匙才能登录，平台通过调用服务 器密码机对用户注册信息采用SM4 算法进行加密存储，则在应用和数据安全层 面“重要数据存储机密性”测评单元的测评对象主要包括（ ）。","options":[{"key":"A","text":"用户注册信息"},{"key":"B","text":"智能密码钥匙"},{"key":"C","text":"服务器密码机"},{"key":"D","text":"数据库服务器"}],"answer":"AC","analysis":"“重要数据存储机密性”测评单元关注的是：哪些重要数据需要加密存储、由什么密码产品完成加密、密钥如何管理。所以测评对象既包括被保护的客体——用户注册信息，也包括执行加密运算的密码产品——服务器密码机。智能密码钥匙在本场景中只用于用户登录的身份鉴别，不参与存储加密；数据库服务器只是数据承载环境，其自身安全在设备和计算安全层面测评，二者都不属于该单元的测评对象。","correctReason":"A、C 成立：测评对象包括被保护的重要数据（用户注册信息）和实现加密保护的密码产品（服务器密码机）。","wrongReason":"B：智能密码钥匙用于登录身份鉴别，未参与存储加密；D：数据库服务器是数据承载平台，不是该单元的密码相关测评对象。","source":"GB/T 39786-2021（应用和数据安全层面“重要数据存储机密性”）；GM/T 0115-2021","keyPoint":"存储机密性测评对象＝重要数据本体＋承担加密运算的密码产品。"},{"id":"第二部分专业题-一、密码学-多选题-105","no":105,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"堡垒机使用合规的智能密码钥匙进行身份鉴别，对通用服务器、数据库进 行统一管理，针对通用服务器和数据库采用用户名+口令方式实现身份鉴别的情 况，以下关于通用服务器、数据库身份鉴别判定合理的是（ ）。","options":[{"key":"A","text":"判定通用服务器和数据库为部分符合"},{"key":"B","text":"判定通用服务器和数据库为不符合"},{"key":"C","text":"判定通用服务器和数据库采取了风险缓解措施"},{"key":"D","text":"判定通用服务器和数据库为高风险"}],"answer":"BC","analysis":"用户名加口令属于非密码的身份鉴别措施，三级系统要求重要设备采用密码技术进行身份鉴别，因此通用服务器和数据库本身只能判“不符合”，而不存在“部分符合”的判定。但它们并非完全暴露：这些设备由堡垒机统一管理，运维人员必须先通过堡垒机、用合规智能密码钥匙完成强身份鉴别才能登录，这构成有效的风险缓解措施，可在风险分析中降低该项风险，所以不宜再直接判定为高风险。","correctReason":"B、C 成立：口令鉴别不属于密码技术措施，该单元判“不符合”；经堡垒机以智能密码钥匙统一管控，属于采取了风险缓解措施。","wrongReason":"A：口令鉴别不涉及密码技术，不存在“部分符合”的判定；D：已有风险缓解措施可降低风险，不应直接判定为高风险。","source":"GM/T 0115-2021《信息安全技术 信息系统密码应用测评要求》；GB/T 39786-2021（第三级）","keyPoint":"口令鉴别＝不符合；堡垒机强鉴别可作风险缓解，不直接判高风险。"},{"id":"第二部分专业题-一、密码学-多选题-106","no":106,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"某信息系统包括前台应用系统和后台管理系统，通过非国密浏览器或国密 浏览器访问前台应用系统，则网络和通信安全层面的测评对象有哪些（ ）。","options":[{"key":"A","text":"互联网国密浏览器与前台应用系统之间的通信信道"},{"key":"B","text":"互联网国密浏览器与后台管理系统之间的通信信道"},{"key":"C","text":"互联网非国密浏览器与前台应用系统之间的通信信道"},{"key":"D","text":"互联网非国密浏览器与后台管理系统之间的通信信道"}],"answer":"AC","analysis":"网络和通信安全层面测评的是通信实体与通信信道，且针对面向前台应用系统的对外通信。本题中国密浏览器、非国密浏览器访问前台应用系统，形成两条需要测评的通信信道，都要核实是否采用密码技术保护、用的算法和产品是否合规。后台管理系统属于内部运维管理入口，其访问通道按“远程管理通道安全”在设备和计算安全层面测评，因此 B、D 不属于网络和通信安全层面的测评对象。","correctReason":"A、C 成立：国密浏览器、非国密浏览器与前台应用系统之间的两条通信信道，属于该层面的测评对象。","wrongReason":"B、D：后台管理系统属运维管理入口，其通道在设备和计算安全层面的“远程管理通道安全”中测评，不属本层面。","source":"GB/T 39786-2021（网络和通信安全、设备和计算安全层面）；GM/T 0115-2021","keyPoint":"前台业务信道归网络层；后台管理通道归设备与计算层。"},{"id":"第二部分专业题-一、密码学-多选题-107","no":107,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"某办公系统部署了SSLVPN 安全网关，并向相关用户配发USBKey，实现 对PC 端登录系统用户的身份鉴别，在密评时以下选项中属于网络和通信安全层 面测评对象的是（ ）。","options":[{"key":"A","text":"SSLVPN 安全网关"},{"key":"B","text":"USBKey"},{"key":"C","text":"PC 端浏览器"},{"key":"D","text":"PC 端浏览器与SSLVPN 安全网关之间通信信道"}],"answer":"ACD","analysis":"网络和通信安全层面的测评对象由通信实体和通信信道两部分组成。本场景中 PC 端用户经 SSLVPN 安全网关远程接入，服务端通信实体是 SSLVPN 安全网关，客户端实体是 PC 端浏览器，两者之间的通信信道也是测评对象。USBKey 是终端上承载用户密钥的智能密码钥匙，其作为密码模块的合规性一般在设备和计算安全层面的身份鉴别中核查，不列为网络和通信安全层面的测评对象。","correctReason":"A、C、D 成立：SSLVPN 安全网关与 PC 端浏览器是通信实体，二者之间的通信信道是测评对象。","wrongReason":"B：USBKey 属终端侧智能密码钥匙，其密码模块合规性在设备和计算安全层面核查，不作为网络层面的测评对象。","source":"GB/T 39786-2021（网络和通信安全层面）；GM/T 0115-2021","keyPoint":"网络层测评对象＝通信实体（网关、客户端）＋通信信道。"},{"id":"第二部分专业题-一、密码学-多选题-108","no":108,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"以下可能属于应用和数据安全层面不可否认性测评单元测评时需要关注的 内容是（ ）。","options":[{"key":"A","text":"接收到重要邮件的确认操作"},{"key":"B","text":"对重要数据进行签名"},{"key":"C","text":"公文管理系统业务用户公文签发操作"},{"key":"D","text":"某银行网上的取钱或转账操作"}],"answer":"ABCD","analysis":"不可否认性针对的是“可能涉及法律责任认定的数据原发、接收行为”，目的是防止当事人事后否认自己发送或接收过数据。收到重要邮件后的确认操作是对接收行为的确认；对重要数据签名是原发行为的证明；公文签发是典型的责任认定场景；银行网上取款、转账涉及资金与法律责任，同样需要抗抵赖。四者都落在不可否认性测评单元的关注范围内。","correctReason":"四项都属于可能涉及法律责任认定的原发或接收行为，需要签名、时间戳等密码技术提供抗抵赖证明。","wrongReason":"本题四个选项均正确，无错误项。","source":"GB/T 39786-2021（应用和数据安全层面“不可否认性”）；GM/T 0115-2021","keyPoint":"不可否认性盯住原发/接收行为，凡涉及法律责任认定都要签名。"},{"id":"第二部分专业题-一、密码学-多选题-109","no":109,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"以下选项属于设备和计算安全层面访问控制信息的是（ ）。","options":[{"key":"A","text":"操作系统权限的访问控制信息"},{"key":"B","text":"系统文件目录的访问控制信息"},{"key":"C","text":"防火墙（不含密码功能）的访问控制列表"},{"key":"D","text":"堡垒机中的权限访问控制信息"}],"answer":"ABD","analysis":"设备和计算安全层面要求用密码技术保证访问控制信息的完整性，防止权限被非法篡改。操作系统权限配置、系统文件目录权限、堡垒机中的权限分配，都决定了“谁能访问什么”，属于访问控制信息。防火墙的访问控制列表虽然功能上也做访问控制，但题目已明确其不含密码功能，不属于密码应用测评的范围，其完整性不在本单元考虑。","correctReason":"A、B、D 成立：操作系统权限、系统文件目录权限、堡垒机权限均属访问控制信息，需用密码技术保护其完整性。","wrongReason":"C：防火墙（不含密码功能）的访问控制列表不属于密码应用范围，不是本单元测评的访问控制信息。","source":"GB/T 39786-2021（设备和计算安全层面“访问控制信息完整性”）","keyPoint":"访问控制信息＝权限配置、目录权限、堡垒机权限；不含密码功能的设备不算。"},{"id":"第二部分专业题-一、密码学-多选题-110","no":110,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"某信息系统部署了安全认证网关代理应用系统，用户通过智能密码钥匙访 问应用系统，下列哪些属于该访问应用通信信道身份鉴别测评单元的测评方法 （ ）。","options":[{"key":"A","text":"核查安全认证网关的商用密码产品认证证书"},{"key":"B","text":"核查智能密码钥匙的商用密码产品认证证书"},{"key":"C","text":"通过抓包核查通信过程中的握手协议"},{"key":"D","text":"通过抓包核查通信过程中的记录协议"}],"answer":"ABC","analysis":"访问应用通信信道的身份鉴别，要核查双方是否使用合规密码产品完成鉴别、鉴别过程用了什么协议。因此先核查安全认证网关和智能密码钥匙的商用密码产品认证证书，确认产品合规；再通过抓包查看握手协议中证书、签名、随机数等鉴别要素是否真实参与鉴别。记录协议负责的是应用数据的加密和完整性保护，不是身份鉴别的载体，核查记录协议对本单元判定没有直接作用。","correctReason":"A、B、C 成立：核查网关与智能密码钥匙的产品认证证书，并抓包检查握手协议中的鉴别过程，是身份鉴别单元的有效测评方法。","wrongReason":"D：记录协议承载数据加密与完整性保护，身份鉴别在握手协议中完成，核查记录协议不属于该单元的测评方法。","source":"GB/T 38636-2020《信息安全技术 传输层密码协议（TLCP）》；GM/T 0115-2021","keyPoint":"鉴别看握手协议＋产品认证证书；记录协议只管加密和完整性。"},{"id":"第二部分专业题-一、密码学-多选题-111","no":111,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"某机房部署了电子门禁系统，以下哪些属于电子门禁系统身份鉴别测评单 元的测评方法（ ）。","options":[{"key":"A","text":"查看发卡时密钥分散的密码算法"},{"key":"B","text":"核查电子门禁系统的商用密码产品认证证书"},{"key":"C","text":"核查门禁卡的管理制度"},{"key":"D","text":"核查是否有机房进出登记记录"}],"answer":"ABC","analysis":"电子门禁系统的身份鉴别，本质是门禁卡与读卡器之间用密码技术确认持卡人身份。测评时要核查门禁系统（含密码模块）是否具备商用密码产品认证证书，查看发卡环节密钥分散所用的密码算法是否合规，并核查门禁卡发放、挂失、回收等管理制度是否落实。机房进出登记记录属于人工管理手段，与门禁身份鉴别是否采用密码技术的判定没有直接关系。","correctReason":"A、B、C 成立：核查密钥分散算法、产品认证证书及门禁卡管理制度，均属身份鉴别单元的测评方法。","wrongReason":"D：机房进出登记记录属人工管理措施，不能证明门禁身份鉴别采用了合规密码技术。","source":"GB/T 39786-2021（物理和环境安全层面“电子门禁身份鉴别”）","keyPoint":"门禁身份鉴别三查：密钥分散算法、产品认证证书、卡管理制度。"},{"id":"第二部分专业题-一、密码学-多选题-112","no":112,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"某机房电子门禁记录数据完整性保护通过服务器密码机的HMAC 实现，以 下哪些属于电子门禁记录数据存储完整性测评单元的测评方法（ ）。","options":[{"key":"A","text":"核查电子门禁系统的商用密码产品认证证书"},{"key":"B","text":"核查服务器密码机的商用密码产品认证证书"},{"key":"C","text":"核查是否能够修改电子门禁记录"},{"key":"D","text":"核查是否能够发现修改电子门禁记录数据"}],"answer":"BCD","analysis":"本场景中电子门禁记录的完整性由服务器密码机的 HMAC 保证，所以测评重点落在两个密码产品是否正确使用、记录是否真正防篡改。要核查服务器密码机的商用密码产品认证证书，确认其合规可用；再通过实际尝试修改记录、检查系统能否发现被篡改的数据，验证完整性保护是否有效。电子门禁系统自身的认证证书与该记录完整性保护无关，不用于本单元核查。","correctReason":"B、C、D 成立：核查服务器密码机证书、验证记录不可修改且篡改可被发现，符合存储完整性测评方法。","wrongReason":"A：门禁记录的完整性由服务器密码机 HMAC 实现，核查门禁系统自身的认证证书与该单元无关。","source":"GB/T 39786-2021（物理和环境安全层面“电子门禁记录数据完整性”）","keyPoint":"谁做保护就查谁：HMAC 由密码机实现，就查密码机证书＋实测防篡改。"},{"id":"第二部分专业题-一、密码学-多选题-113","no":113,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"密评过程中，以下能获取的数据是（ ）。","options":[{"key":"A","text":"SSL 协议通信数据"},{"key":"B","text":"IPSec 协议通信数据"},{"key":"C","text":"远程管理通道数据"},{"key":"D","text":"密码机内的密钥数据明文"}],"answer":"ABC","analysis":"密评过程中，测评人员可以采集通信报文、协议数据和运维通道数据：SSL/TLS 通信数据、IPSec 通信数据都可以通过抓包获取，远程管理通道数据也可以采集，用于分析协议版本、密码算法、证书和密钥协商过程是否符合要求。但密码机内部的密钥以受保护形式存放，密钥明文不可导出、不可读取，测评只能通过密钥管理制度核查和密码功能验证间接进行，不能把密钥明文列为可获取数据。","correctReason":"A、B、C 成立：SSL、IPSec 通信数据和远程管理通道数据均可通过抓包等方式采集，属于测评可获取的数据。","wrongReason":"D：密码机内的密钥受密码模块保护，明文不可导出、不可获取，不属于测评中能拿到的数据。","source":"GM/T 0115-2021《信息安全技术 信息系统密码应用测评要求》；GM/T 0028-2014《密码模块安全技术要求》","keyPoint":"通信数据可抓包获取，密码机内密钥明文永远拿不到。"},{"id":"第二部分专业题-一、密码学-多选题-114","no":114,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"某证书的签名算法是1.2.156.10197.1.501，则意味着（ ）。","options":[{"key":"A","text":"该证书所包含的公钥是SM2 公钥"},{"key":"B","text":"签发该证书采用的是 SM3withSM2Encryption 算法"},{"key":"C","text":"颁发者所使用的公钥是SM2 公钥"},{"key":"D","text":"不考虑编码，该证书的签名值长度应为64 字节"}],"answer":"BCD","analysis":"OID 1.2.156.10197.1.501 是国密算法标识中 SM2 签名算法与 SM3 杂凑算法的组合标识，说明这张证书是颁发者用 SM2 私钥、配合 SM3 杂凑签发的，因此颁发者公钥必为 SM2 公钥。SM2 签名值由 r、s 两个 32 字节整数组成，不含额外编码时长度为 64 字节。但签名算法标识只描述签发算法，与证书主体公钥的算法没有必然联系，证书里装的公钥不一定是 SM2 公钥。","correctReason":"B、C、D 成立：该 OID 表示 SM3withSM2 签名算法，签发者必用 SM2 密钥，签名值为 r 与 s 拼接共 64 字节。","wrongReason":"A：签名算法标识只表明签发者所用算法，证书主体公钥的算法要看主体公钥信息字段，不能据此认定为 SM2 公钥。","source":"GM/T 0006-2012《密码应用标识规范》；GB/T 32918.2-2016《信息安全技术 SM2椭圆曲线公钥密码算法 第2部分：数字签名算法》","keyPoint":"1.2.156.10197.1.501＝SM3withSM2；签名值64字节。"},{"id":"第二部分专业题-一、密码学-多选题-115","no":115,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"以下（ ）方法可以用于辅助数字证书的分析。","options":[{"key":"A","text":"对数字证书的数字签名算法进行正确性验证"},{"key":"B","text":"对数字证书进行随机性检测"},{"key":"C","text":"使用ASN.1 工具对数字证书格式进行解析"},{"key":"D","text":"对数字证书的杂凑密码算法进行正确性验证"}],"answer":"ACD","analysis":"分析数字证书主要看三件事：格式是否规范、签名是否有效、算法是否合规。因此可以用 ASN.1 工具解析证书编码结构，检查字段是否符合格式要求；用颁发者公钥验证证书上的数字签名是否正确；对证书中使用的杂凑算法做正确性验证（如用标准测试向量比对）。随机性检测的对象是随机数发生器输出的随机序列，而数字证书是结构化的确定性数据，对其做随机性检测没有意义。","correctReason":"A、C、D 成立：验证签名算法正确性、用 ASN.1 解析格式、验证杂凑算法正确性，都是分析数字证书的常用辅助手段。","wrongReason":"B：随机性检测针对随机数与随机序列，证书是结构化数据，做随机性检测无意义。","source":"GB/T 20518-2018《信息安全技术 公钥基础设施 数字证书格式》；GB/T 32905-2016《信息安全技术 SM3密码杂凑算法》","keyPoint":"证书分析＝ASN.1 解析＋验签＋算法正确性验证；不做随机性检测。"},{"id":"第二部分专业题-一、密码学-多选题-116","no":116,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"对数字证书格式进行分析时，可以分析数字证书的各个字段，一个数字证 书的数据结构包括（ ）。","options":[{"key":"A","text":"tbsCertList"},{"key":"B","text":"tbsCertificate"},{"key":"C","text":"signatureAlgorithm"},{"key":"D","text":"signatureValue"}],"answer":"BCD","analysis":"X.509 数字证书的顶层结构由三部分组成：tbsCertificate（待签名证书，含版本、序列号、颁发者、有效期、主体、主体公钥等信息）、signatureAlgorithm（签名算法标识）和 signatureValue（签名值）。tbsCertList 是证书吊销列表 CRL 中“待签名证书列表”的字段名，属于 CRL 结构，并不出现在数字证书的数据结构里。","correctReason":"B、C、D 成立：tbsCertificate、signatureAlgorithm、signatureValue 共同构成数字证书的基本数据结构。","wrongReason":"A：tbsCertList 是证书吊销列表（CRL）的结构字段，不属于数字证书结构。","source":"GB/T 20518-2018《信息安全技术 公钥基础设施 数字证书格式》","keyPoint":"X.509 证书含 tbsCertificate、算法标识、签名值。"},{"id":"第二部分专业题-一、密码学-多选题-117","no":117,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"以下关于Wireshark 过滤规则的说法，（ ）是正确的。","options":[{"key":"A","text":"icmpandip.dst==192.168.1.1 可以用于获取目标IP 地址为192.168.1.1 并且协议 为ICMP 的所有数据包"},{"key":"B","text":"dns.dstport==53 and ip.src==192.168.1.1 用于获取所有源IP 地址为 192.168.1.1 并且目标端口号为53 的所有DNS 请求数据包"},{"key":"C","text":"udp.dstport==00:11:2 2:33:44:55 可 以 用 于 获 取 目 标 MAC 地 址 为 00:11:22:33:44:55 并且协议为UDP 的所有数据包"},{"key":"D","text":"eth.dst==00:11:22:33:44:55 可 以 用 于 获 取 所 有 目 标 MAC 地 址 为 00:11:22:33:44:55 的数据包"}],"answer":"AD","analysis":"Wireshark 过滤表达式由协议字段名加比较运算符组成。A、D 语法正确：A 筛出目的地址为该 IP 的 ICMP 包，D 筛出目的 MAC 为该地址的数据帧。B 错在字段名，Wireshark 没有 dns.dstport 字段，端口应写 udp.dstport==53 或 tcp.dstport==53；C 把 MAC 地址填进端口字段，应改用 eth.dst。","correctReason":"A、D 成立：字段名与语法均正确，能分别筛出指定目的 IP 的 ICMP 包和指定目的 MAC 的数据帧。","wrongReason":"B：Wireshark 无 dns.dstport 字段，应写 udp.dstport==53 或 tcp.dstport==53；C：端口字段不能填 MAC 地址，应使用 eth.dst。","source":"Wireshark 显示过滤器字段参考（eth.dst、ip.dst、udp.dstport、tcp.dstport、icmp）","keyPoint":"端口用 udp/tcp.dstport，MAC 用 eth.dst。"},{"id":"第二部分专业题-一、密码学-多选题-118","no":118,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"在测评时，信息系统声称采用SM4-CBC 进行个人隐私信息的存储机密性保 护，以下收集的证据与其声称的存在矛盾或证明其使用不合规的包括（ ）。","options":[{"key":"A","text":"密文长度为192 比特"},{"key":"B","text":"密文长度为64 比特"},{"key":"C","text":"IV 值以明文形式存储"},{"key":"D","text":"IV 值都为全0"}],"answer":"ABD","analysis":"SM4 分组长度是 128 位，CBC 模式下密文长度必须是 16 字节的整数倍：192 比特（24 字节）和 64 比特（8 字节）都不是 16 的整数倍，与“采用 SM4-CBC”的声称相矛盾。CBC 的 IV 本身不要求保密，明文存储或随密文一并保存都是允许的，所以 C 不构成问题。但 IV 不能固定或重复使用，D 中所有数据都用全 0 的 IV，会让相同明文块产生相同密文块，泄露明文相等关系，属不合规用法。","correctReason":"A、B、D 成立：密文长度不是 16 字节整数倍与 SM4-CBC 矛盾；IV 全 0 固定不变会泄露明文相等性，属不合规。","wrongReason":"C：CBC 模式的 IV 不要求保密，以明文形式存储是允许的，不构成矛盾或不合规。","source":"GB/T 32907-2016《信息安全技术 SM4分组密码算法》；GB/T 17964《信息安全技术 分组密码算法的工作模式》","keyPoint":"CBC 密文长度必为 16 字节整数倍；IV 可公开但不可固定为全 0。"},{"id":"第二部分专业题-一、密码学-多选题-119","no":119,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"如果设备登录需要使用智能密码钥匙，那么开展密评时，以下测评实施合 理的包括（ ）。","options":[{"key":"A","text":"在模拟的主机或抽选的主机上安装监控软件（如BusHound），用于对智能密 码钥 匙的APDU 指令进行抓取和分析，确认调用指令格式和内容符合预期 （如口令和密钥是 加密传输的）"},{"key":"B","text":"如果智能密码钥匙存储有数字证书，测评人员可以将数字证书导出后，对数字 证书合规性进行检测"},{"key":"C","text":"检查智能密码钥匙是否具备商用密码产品认证证书"},{"key":"D","text":"对智能密码钥匙是否满足GM/T0028《密码模块安全技术要求》进行检测认证"}],"answer":"ABC","analysis":"测评智能密码钥匙在登录中的应用，主要靠“查证书＋看调用”：核查智能密码钥匙是否具有商用密码产品认证证书，确认产品合规；用 BusHound 等工具在主机上抓取 APDU 指令，分析调用格式与内容是否符合预期，例如口令和密钥是否加密传输；若钥匙内存储数字证书，可以导出后检测证书格式与合规性。而按 GM/T 0028 对密码模块做检测认证是检测认证机构的职责，密评机构只核查已有认证证书，不开展产品认证。","correctReason":"A、B、C 成立：抓包分析 APDU 指令、导出证书检测合规性、核查产品认证证书，都是密评中合理可行的测评实施。","wrongReason":"D：按 GM/T 0028 开展密码模块检测认证属检测认证机构职责，密评只需核查产品是否已取得商用密码产品认证证书。","source":"GM/T 0028-2014《密码模块安全技术要求》；GM/T 0115-2021；《中华人民共和国密码法》第二十五条","keyPoint":"密评查产品认证证书、抓 APDU、验证书；不做产品检测认证。"},{"id":"第二部分专业题-一、密码学-多选题-120","no":120,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"测评人员在测评时，发现以下情况，其中密码应用合规正确的有（ ）。","options":[{"key":"A","text":"通信双方进行加密通信前，使用双证书中的加密证书进行SM2 密钥协商"},{"key":"B","text":"通 信 双 方 使 用 TLS 1.3 进 行 通 信 ， 并 将 其 中 的 密 码 算 法 全 部 替 换 为 SM2/SM3/SM4"},{"key":"C","text":"用户使用SM4-CTR 进行加密时，以随机数和当前时间值的拼接作为计数器值， 将计 数器值以明文形式与密文一并发送给接收方"},{"key":"D","text":"信息系统使用同一个数据密钥采用 SM4-CBC 模式对所有用户的性别信息进 行加密 保护，并使用全0 的IV 值"}],"answer":"AC","analysis":"双证书体系中签名证书用于签名、加密证书用于密钥交换，故用加密证书做 SM2 密钥协商正确。SM4-CTR 只要求计数器不重复，把计数值随密文明文传输是允许的。B 错在国密传输层协议基于 TLS 1.2 体系，TLS 1.3 密码套件与国密算法不匹配，不能整体替换。D 用同一数据密钥加密低熵数据（性别）且 IV 全 0，会泄露明文相等关系，不合规。","correctReason":"A、C 成立：加密证书用于 SM2 密钥协商符合双证书用法；SM4-CTR 的计数器值可明文随密文传输，只要不重复即可。","wrongReason":"B：国密传输层协议基于 TLS 1.2 体系，TLS 1.3 直接替换国密算法不可行、不合规；D：同一数据密钥加密低熵数据且 IV 全 0，会泄露明文相等性，不合规。","source":"GB/T 38636-2020《信息安全技术 传输层密码协议（TLCP）》；GB/T 32918.3-2016《信息安全技术 SM2椭圆曲线公钥密码算法 第3部分：密钥交换协议》","keyPoint":"加密证书做密钥协商、计数器值可明文；TLS1.3 换国密与固定 IV 都不合规。"},{"id":"第二部分专业题-一、密码学-多选题-121","no":121,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"密评人员在检查数据库中存储的口令杂凑值时，发现以下情况：（1）A 和 B 有相同的口令杂凑值；（2）口令杂凑值长度均为256 比特。以下分析正确的 是（ ）。","options":[{"key":"A","text":"可以确定使用了SM3 对口令进行杂凑保护"},{"key":"B","text":"可能采用了MD5 对口令进行杂凑计算"},{"key":"C","text":"计算口令杂凑值时可能未加入用户唯一的盐值"},{"key":"D","text":"A 和B 可能共享相同的口令"}],"answer":"CD","analysis":"本题考口令杂凑存储的推断逻辑。两人口令杂凑值相同，最基本的原因是二人口令恰好一样；若杂凑时加入了用户唯一的盐值，即使口令相同结果也会不同，所以结果相同就说明很可能没加盐。杂凑值长度256比特只能说明输出长度，MD5输出128比特、SM3输出256比特，因此256比特能否定MD5、却不能反过来断定就是SM3——SHA-256等也输出256比特，而且若真加了盐，也不会出现两人相同的结果。","correctReason":"C：两人杂凑值完全相同，说明计算时很可能未加入用户唯一的盐值（或盐值相同）；D：未加盐时相同口令必然得到相同杂凑值，故两人可能共享同一口令。","wrongReason":"A：输出256比特只是必要条件，SHA-256等同样输出256比特，凭长度不能确定用了SM3，真正加了SM3+唯一盐也不会出现相同值；B：MD5输出仅128比特，与题给的256比特不符。","source":"GB/T 39786-2021《信息安全技术 信息系统密码应用基本要求》（口令应使用密码技术并加盐保护）","keyPoint":"相同口令杂凑值相同→未加唯一盐；长度不能反推算法"},{"id":"第二部分专业题-一、密码学-多选题-122","no":122,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"测评人员在核查“真实性”密码功能时，可能需要关注以下内容（ ）。","options":[{"key":"A","text":"发送的挑战值是否每次均不重复"},{"key":"B","text":"使用对应公钥能否对签名值通过验签操作"},{"key":"C","text":"公钥或对称密钥与实体的绑定方式"},{"key":"D","text":"对数字证书格式正确性进行验证"}],"answer":"ABCD","analysis":"真实性功能是验证“对方确实是其所声称的实体”，测评时要看鉴别协议与凭据绑定两条线。挑战值（随机数）必须每次不重复，否则被重放即可冒充；验签是验证签名与公钥是否匹配、能否确认私钥持有者身份的基本手段；公钥或对称密钥与实体的绑定方式（证书、密钥管理系统记录等）决定了鉴别结论是否可信；数字证书还要查格式是否符合标准、扩展字段是否被正确解析。四者都属于真实性测评的关注点。","correctReason":"A、B、C、D均指向真实性功能的核查要素：抗重放的挑战值、验签有效性、密钥与实体绑定、证书格式正确性，缺一不可。","wrongReason":"无错误选项：A、B、C、D四项都属于真实性测评应关注的内容，全选。","source":"GB/T 39786-2021《信息安全技术 信息系统密码应用基本要求》真实性要求；GM/T 0115-2021《信息系统密码应用测评要求》","keyPoint":"真实性=验签有效+密钥与实体绑定+抗重放+证书合规"},{"id":"第二部分专业题-一、密码学-多选题-123","no":123,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"某四级信息系统的责任单位可采用以下（　）机制以满足“人员管理”方面的要求。","options":[{"key":"A","text":"设置密钥管理员、密码安全审计员、密码操作员并分别由甲、乙、丙三人担任"},{"key":"B","text":"关键岗位人员由机构内部人员担任，并在任前进行背景调查"},{"key":"C","text":"建立上岗人员培训制度，对涉及密码的操作和管理人员进行专项培训"},{"key":"D","text":"建立人员保密和调离制度，签订保密合同"}],"answer":"BCD","analysis":"本题考信息系统密码应用“人员管理”要求，通常按岗位设置与职责分离、人员背景与保密约束、培训制度、调离与权限回收几个维度落实。关键岗位须由本机构人员担任并做任前背景调查，涉及密码操作和管理的人员要接受专项培训，关键岗位要签保密协议、建立调离制度。特别要注意职责分离：密钥管理员、密码安全审计员与密码操作员的职责必须相互独立，审计员不得兼任另两岗，故“三人分别担任”若未做职责分离即不满足要求。","correctReason":"B、C、D分别对应关键岗位背景调查、专项培训制度、保密与调离制度，均是“人员管理”条款要求的具体落地机制。","wrongReason":"A：仅要求三岗由三人担任不够，关键是职责分离与相互制约，密码安全审计员不得兼任密钥管理员或密码操作员，单纯分人担任不等于满足要求。","source":"GB/T 39786-2021《信息安全技术 信息系统密码应用基本要求》（管理制度—人员管理）","keyPoint":"人员管理=职责分离+背景调查+专项培训+保密调离"},{"id":"第二部分专业题-一、密码学-多选题-124","no":124,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"关于数字证书的使用，以下存在风险的有（ ）。","options":[{"key":"A","text":"证书中未标明持有者的身份"},{"key":"B","text":"证书在使用前未验证真实性和有效性"},{"key":"C","text":"未及时更新CRL 或未使用OCSP 查询证书状态"},{"key":"D","text":"CA 签发的用户证书在未保护的通道中进行分发"}],"answer":"ABC","analysis":"数字证书把实体身份与公钥绑定，其安全使用依赖三点：证书内容可识别持有者、使用前验证真实性与有效性、及时掌握吊销状态。证书未标明持有者身份，等于公钥无主，无法完成身份鉴别；使用前不验证真实性与有效期，可能采信伪造或过期证书；不查CRL、不用OCSP，会继续信任已被吊销的证书。而CA签发的证书本身是公开数据、由CA数字签名保护，明文通道分发并不构成泄密风险，真正需要防的是伪造证书，而非传输保密。","correctReason":"A、B、C分别破坏身份绑定、真实性验证与吊销状态检查，都是证书使用的现实风险点。","wrongReason":"D：证书是公开信息且由CA签名保证真实性，明文通道分发一般不带来实质风险（分发根CA证书时才需核对指纹）。","source":"《中华人民共和国电子签名法》关于电子认证服务与证书管理的规定；GB/T 20518-2018《信息安全技术 公钥基础设施 数字证书格式》","keyPoint":"证书风险=身份不明+不验真+不查吊销；明文分发不算风险"},{"id":"第二部分专业题-一、密码学-多选题-125","no":125,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"某信息系统客户端APP 与服务端之间通过SSLVPN 建立的安全传输通道， 对网络和通信安全进行保护，通过抓取和分析通信数据包，使用的密码套件为 TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384，以下分析正确的是（ ）。","options":[{"key":"A","text":"该协议使用RSA 密码算法的数字信封功能进行密钥协商"},{"key":"B","text":"该协议使用AES-256 的GCM 工作模式保护传输数据的机密性"},{"key":"C","text":"无法确定所使用RSA 算法的密钥长度，还需要抓取传输中涉及的证书进行判 断"},{"key":"D","text":"该协议使用AES-256 的GCM 工作模式保护传输数据的完整性"}],"answer":"BCD","analysis":"套件名TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384要会拆读：ECDHE是密钥协商算法（临时椭圆曲线Diffie-Hellman），RSA指服务器证书用RSA私钥对握手参数做签名完成认证，并非用RSA数字信封协商密钥；AES_256_GCM是记录层算法，GCM作为AEAD模式加密同时产生认证标签，因而同时保障机密性与完整性；SHA384用于握手摘要。套件名不含RSA密钥长度，须抓证书看公钥位数才能判定。","correctReason":"B、D：AES-256-GCM是带关联数据的认证加密模式，一次运算同时提供机密性与完整性；C：套件名只标识RSA签名，不显示密钥长度，需取证书判断。","wrongReason":"A：ECDHE_RSA中RSA只用于证书签名（身份认证），密钥协商用的是临时椭圆曲线DH，属于前向安全的密钥交换，不是RSA数字信封。","source":"GB/T 38636-2020《信息安全技术 传输层密码协议（TLCP）》；RFC 5289（TLS ECC 密码套件）","keyPoint":"ECDHE负责协商、RSA只做签名、GCM一个模式管机密性+完整性"},{"id":"第二部分专业题-一、密码学-多选题-126","no":126,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"下列哪些算法属于单表代换密码？（ ）","options":[{"key":"A","text":"凯撒密码"},{"key":"B","text":"放射密码"},{"key":"C","text":"移位密码"},{"key":"D","text":"希尔密码"}],"answer":"ABC","analysis":"单表代换密码指整段明文使用同一张固定的明密文对照表，即一个明文字母在整个加密过程中始终映射到同一个密文字母。凯撒密码是固定步长的移位，移位密码是其一般化形式，放射（仿射）密码是线性变换E(x)=ax+b，三者都逐字母代换且对照表唯一，属单表代换。希尔密码把字母分组做矩阵乘法，同一字母在不同分组中会被映射成不同密文，属多表（分组线性）代换，故不选。","correctReason":"A、B、C的加密都基于唯一固定的明密文对照表，逐字母替换，符合单表代换定义。","wrongReason":"D：希尔（Hill）密码按明文分组进行矩阵乘法，同一明文字母随位置变化对应不同密文，属于多表代换/分组代换，不是单表代换。","source":"密码学教材（古典密码—代换密码分类）；GM/T 0002-2012《SM4分组密码算法》为现代分组密码对照","keyPoint":"单表=一张固定表；凯撒/移位/仿射是单表，希尔是多表"},{"id":"第二部分专业题-一、密码学-多选题-127","no":127,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"对密码系统的攻击类型包括（ ）。","options":[{"key":"A","text":"选择明文攻击"},{"key":"B","text":"选择密文攻击"},{"key":"C","text":"已知明文攻击"},{"key":"D","text":"唯密文攻击"}],"answer":"ABCD","analysis":"密码分析按攻击者掌握的信息量由弱到强分为四类模型：唯密文攻击（只有密文）、已知明文攻击（掌握若干明密文对）、选择明文攻击（可自选明文取得对应密文，如加密预言机）、选择密文攻击（可自选密文取得对应明文，如解密预言机）。四种都是标准的攻击类型，安全性设计通常要求能抵抗选择密文攻击。此外还有相关密钥攻击、侧信道攻击等，但教材体系的四大类即本选项。","correctReason":"A、B、C、D恰好对应唯密文、已知明文、选择明文、选择密文四种经典密码分析模型，均属攻击类型。","wrongReason":"无错误选项：A、B、C、D分别对应选择明文、选择密文、已知明文、唯密文攻击，均为标准攻击类型，全选。","source":"密码学教材（密码分析攻击模型分类：唯密文/已知明文/选择明文/选择密文）","keyPoint":"四大攻击模型：唯密文、已知明文、选择明文、选择密文"},{"id":"第二部分专业题-一、密码学-多选题-128","no":128,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"身份鉴别是安全服务中的重要一环，以下关于身份鉴别叙述正确的是（ ）。","options":[{"key":"A","text":"目前一般采用基于对称密钥加密或公开密钥加密的方法"},{"key":"B","text":"身份鉴别一般不用提供双向的认证"},{"key":"C","text":"数字签名机制是实现身份鉴别的重要机制"},{"key":"D","text":"身份鉴别是授权控制的基础"}],"answer":"ACD","analysis":"身份鉴别的目的是让对方（或双方）确认身份，核心是“证明者掌握某个秘密、且该秘密与声称的身份绑定”。实现上目前主要用对称密钥加密（如挑战—响应）或公钥加密/签名两类方法。公钥体制下，数字签名让签名者用私钥签名、验证方用公钥验签，能确认私钥持有者身份，是身份鉴别的重要机制。鉴别是访问控制的前置环节，只有先确认“你是谁”，才能决定“你能做什么”，因此身份鉴别是授权控制的基础。","correctReason":"A、C、D：身份鉴别可通过对称或公钥密码方法实现，数字签名是重要机制，且身份鉴别先于授权、是授权控制的基础。","wrongReason":"B：身份鉴别经常需要双向认证（客户端与服务器互相验证），声称“一般不用提供双向认证”与安全实践相悖。","source":"GB/T 15843（ISO/IEC 9798）系列实体鉴别标准；GB/T 39786-2021 真实性要求","keyPoint":"鉴别是授权的前提，可用对称或公钥实现，常需双向认证"},{"id":"第二部分专业题-一、密码学-多选题-129","no":129,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"属于密码在信息安全领域的具体应用的是（ ）。","options":[{"key":"A","text":"生成所有网络协议"},{"key":"B","text":"消息鉴别，确保信息完整性和真实性"},{"key":"C","text":"加密保护，保护传输信息的机密性"},{"key":"D","text":"身份鉴别"}],"answer":"BCD","analysis":"密码在信息安全中的落地就是围绕机密性、完整性、真实性、不可否认性提供机制：加密保护解决数据存储与传输的机密性；消息鉴别（MAC、杂凑+签名）确认信息来源并检出篡改；身份鉴别确认通信实体身份；数字签名还提供不可否认性。网络协议本身由协议标准与工程实现定义，密码只是协议中可调用的安全组件，说“生成所有网络协议”既不符合事实也把密码的作用夸大了。","correctReason":"B、C、D分别是密码在完整性/真实性、机密性、身份鉴别方面的典型应用，属密码的具体用途。","wrongReason":"A：网络协议由协议规范定义，密码算法只是协议中保障安全的构件，不能“生成所有网络协议”，表述错误。","source":"《中华人民共和国密码法》关于密码的分类管理（核心密码、普通密码、商用密码）与作用定位","keyPoint":"密码应用：机密性、完整性、真实性、不可否认性"},{"id":"第二部分专业题-一、密码学-多选题-130","no":130,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"ZUC 算法中，比特重组（BR）过程从LFSR 中抽取哪些寄存器单元来构造 X0、X1、X2、X3？（ ）","options":[{"key":"A","text":"s15,s14"},{"key":"B","text":"s11,s9"},{"key":"C","text":"s7,s5"},{"key":"D","text":"s2,s0"}],"answer":"ABD","analysis":"ZUC是面向LTE的流密码，由16个31比特LFSR单元s0~s15、比特重组BR、非线性函数F和线性变换L组成。BR层把LFSR状态重组成4个32比特字：X0由s15高16比特与s14低16比特拼接，X1由s11与s9拼接，X2由s7与s5拼接，X3由s2与s0拼接。抽取的正是s15/s14、s11/s9、s7/s5、s2/s0这四对单元，选项A、B、D完整覆盖四对，C只对应X2一对、不完整。","correctReason":"A、B、D分别对应X0=s15||s14、X1=s11||s9、X3=s2||s0的抽取关系，符合ZUC比特重组定义。","wrongReason":"C：s7、s5只是构造X2（X2=s7H||s5L）的一对单元，单独列出不完整，题目问的是构造X0~X3所抽取的全部寄存器单元。","source":"GB/T 33133.1-2016《信息安全技术 祖冲之序列密码算法 第1部分：算法描述》（比特重组）","keyPoint":"BR抽取四对：s15/14、s11/9、s7/5、s2/0 拼成X0~X3"},{"id":"第二部分专业题-一、密码学-判断题-1","no":1,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"5G 空口加密中，使用ZUC 算法时可以将基站小区ID 作为固定IV 以提高效率。","options":[],"answer":"错","analysis":"ZUC 是 3GPP 采用的流密码算法，5G 空口加密时其初始向量 IV 必须随每个无线承载、每个数据包变化，以保证同一密钥下密钥流不重复。小区 ID 对同一小区内所有用户和所有数据包都固定不变，若拿它当固定 IV，同一密钥就会产生完全相同的密钥流，攻击者通过异或即可恢复明文。IV 的作用是引入差异性，不是用来降低计算开销的。","correctReason":"该表述不成立：IV 必须逐包变化，用固定的基站小区 ID 作 IV 会导致密钥流重复，破坏流密码的基本安全前提。","wrongReason":"","source":"3GPP TS 33.401 附录 D（ZUC 机密性算法 128-EEA3）","keyPoint":"流密码的 IV 必须逐包更新，绝不可固定复用"},{"id":"第二部分专业题-一、密码学-判断题-2","no":2,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"AES 算法是一种分组密码算法，其分组长度固定为128 比特。","options":[],"answer":"对","analysis":"AES 是分组密码，无论密钥取 128、192 还是 256 比特，分组长度始终固定为 128 比特。这一点与 SM4 相同，都是 128 比特分组；而 DES 的分组长度是 64 比特，两者不要混淆。密钥长度可变、分组长度不变，是 AES 的基本设计特征。","correctReason":"该表述成立：AES 的分组长度固定为 128 比特，可变的只是密钥长度。","wrongReason":"","source":"FIPS 197 (AES)","keyPoint":"AES 分组固定 128 位，密钥可为 128/192/256 位"},{"id":"第二部分专业题-一、密码学-判断题-3","no":3,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"将ZUC 算法的密钥长度扩展到256 位（ZUC-256）即可抵抗量子计算机的暴力 破解。","options":[],"answer":"错","analysis":"ZUC-256 把密钥扩展到 256 比特、IV 扩展到 184 比特，主要是为 5G 后期演进的密钥长度需求做准备，能提高对经典暴力穷举的抵抗能力。但密钥加长并不改变算法结构，Shor 算法直接威胁的是公钥密码而非对称密钥，Grover 算法也只是使穷举的代价开平方。而且 ZUC 是序列密码，不属于后量子密码（PQC）方案，说它「即可抵抗量子计算机暴力破解」是过度延伸。","correctReason":"该表述不成立：加长密钥只提高经典穷举的难度，并不能使 ZUC-256 成为抗量子的密码算法。","wrongReason":"","source":"3GPP TS 33.401 附录 D；GM/T 0001-2012（ZUC 算法）","keyPoint":"加长密钥≠抗量子，抗量子靠 Shor/Grover 抗性算法"},{"id":"第二部分专业题-一、密码学-判断题-4","no":4,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"凯撒密码是一种典型的单表代换密码。","options":[],"answer":"对","analysis":"单表代换密码指整篇消息只用一张代换表，明文字母与密文字母一一对应。凯撒密码把每个字母统一后移固定位数（如后移 3 位），全程共用同一张移位表，因此是典型的单表代换密码。与之相对的是维吉尼亚密码等多表代换密码，它们轮流使用多张代换表。","correctReason":"该表述成立：凯撒密码全程使用同一张代换表，属于单表代换密码。","wrongReason":"","source":"密码学基础（古典密码体制分类）","keyPoint":"凯撒密码＝固定移位的单表代换密码"},{"id":"第二部分专业题-一、密码学-判断题-5","no":5,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"在密码学中，需要被变换的原消息被称为密文。","options":[],"answer":"错","analysis":"密码学中需要被变换的原始消息叫明文，变换后的结果才叫密文，题干把两者说反了。完整的加密模型是明文经加密算法和密钥变换为密文，密文经解密算法和密钥还原为明文。这是最基础的概念题，只要记住「待变换＝明文、已变换＝密文」即可。","correctReason":"该表述不成立：需要被变换的原消息是明文，密文是变换之后的结果。","wrongReason":"","source":"密码学基础（明文/密文基本概念）","keyPoint":"待变换是明文，变换结果是密文"},{"id":"第二部分专业题-一、密码学-判断题-6","no":6,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"古典密码体制中，移位密码属于置换密码。","options":[],"answer":"错","analysis":"古典密码有两大类：代换密码（字符本身被换成别的字符，如凯撒、维吉尼亚）和置换密码（字符不变、只改变位置，如栅栏、列置换）。移位密码改变的是字母取值，属于代换而非置换，所以表述错误。这里要注意中英文术语：「置换密码」在中文教材中也常指代换，容易与「移位」混淆，但竞赛按「位置置换」这一分类命题。","correctReason":"该表述不成立：移位密码改变字母的取值，属于代换密码，而不是置换（位置换）密码。","wrongReason":"","source":"密码学基础（古典密码体制分类）","keyPoint":"移位改取值属代换，置换只改位置"},{"id":"第二部分专业题-一、密码学-判断题-7","no":7,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"分组密码的 CTR 模式在解密时需要使用分组密码的解密算法。","options":[],"answer":"错","analysis":"CTR（计数器）模式先用分组密码加密计数器得到密钥流，再与明文或密文异或。加密和解密两个方向都只调用分组密码的加密函数，不需要解密函数，这是它与 CBC、CFB 等模式的显著区别。此外 CTR 模式可并行处理、可随机访问，缺点是不能重复使用计数器值。","correctReason":"该表述不成立：CTR 模式加解密都只使用分组密码的加密算法，不涉及解密算法。","wrongReason":"","source":"GB/T 17964-2021《信息安全技术 分组密码算法的工作模式》","keyPoint":"CTR 模式只用加密函数，加密解密同一套运算"},{"id":"第二部分专业题-一、密码学-判断题-8","no":8,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"在置换密码算法中，密文所包含的字符集与明文的字符集是相同的。","options":[],"answer":"对","analysis":"置换密码只重排明文字符的顺序，不替换字符本身，因此密文与明文使用完全相同的符号集合，只是排列不同。这也是它最明显的特征：字符频率分布被保留，容易被频率分析或字谜式破解。正因如此，实际使用中置换通常要和代换结合（如分组密码中的 S 盒加 P 盒）。","correctReason":"该表述成立：置换只改变位置不改变符号，密文与明文字符集相同。","wrongReason":"","source":"密码学基础（置换密码性质）","keyPoint":"置换不改符号，只改位置，字符集不变"},{"id":"第二部分专业题-一、密码学-判断题-9","no":9,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"在分组密码的 ECB 模式下，相同的明文分组会被加密成相同的密文分组。","options":[],"answer":"对","analysis":"ECB 是最简单的分组密码工作模式，每个明文分组各自独立加密，不引入任何链接或随机量。因此在同一密钥下，相同的明文分组必然得到相同的密文分组，明文中重复的图案会在密文中原样体现，无法隐藏数据模式，故实际中不推荐用于加密结构化数据。","correctReason":"该表述成立：ECB 模式各分组独立加密，相同明文分组必产生相同密文分组。","wrongReason":"","source":"GB/T 17964-2021《信息安全技术 分组密码算法的工作模式》","keyPoint":"ECB 无链接、同明文同密文，会泄露数据模式"},{"id":"第二部分专业题-一、密码学-判断题-10","no":10,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"“一次一密”的随机密码序列体制在理论上是不可破译的。","options":[],"answer":"对","analysis":"一次一密（Vernam 体制）要求密钥与明文等长、真正随机、只使用一次且严格保密，在此条件下香农证明了它具有完善保密性，密文不泄露明文的任何信息，理论上不可破译。它的困难在于密钥的产生、分发和管理代价极高，工程上难以实用。注意「理论上不可破译」的前提条件必须全部满足。","correctReason":"该表述成立：在密钥真随机、等长且一次一用的条件下，一次一密具有完善保密性，理论上不可破译。","wrongReason":"","source":"密码学基础（Shannon 完善保密性/一次一密）","keyPoint":"一次一密理论不可破，前提是真随机、等长、不重用"},{"id":"第二部分专业题-一、密码学-判断题-11","no":11,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"RSA 算法的安全性基于椭圆曲线离散对数问题。","options":[],"answer":"错","analysis":"RSA 的安全性建立在大整数分解困难问题上，攻击者要从公开模数 n 分解出 p、q 才能求出私钥。椭圆曲线离散对数问题（ECDLP）是 ECC、SM2 等椭圆曲线密码的安全基础，与 RSA 不是同一类困难问题。常见三类基础要分清：大整数分解对应 RSA，椭圆曲线离散对数对应 ECC/SM2，有限域离散对数对应 DSA/ElGamal/DH。","correctReason":"该表述不成立：RSA 基于大整数分解困难问题，基于椭圆曲线离散对数问题的是 ECC/SM2。","wrongReason":"","source":"密码学基础（公钥密码数学难题分类）","keyPoint":"RSA 靠大整数分解，ECC/SM2 才靠椭圆曲线离散对数"},{"id":"第二部分专业题-一、密码学-判断题-12","no":12,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"所有的线性变换都能成为一个有效的仿射加密函数。","options":[],"answer":"错","analysis":"仿射加密函数形如 E(x)=(ax+b) mod n，它要成为有效的一一映射，关键条件是 a 与模数 n 互素（即 gcd(a,n)=1），否则不同明文会映射到同一密文而无法解密。因此并非任意线性变换都能用作仿射加密函数，只有满足可逆条件的才行。这是仿射密码最常考的限定条件。","correctReason":"该表述不成立：只有当乘数 a 与模数互素时仿射变换才可逆，才能作为有效的加密函数。","wrongReason":"","source":"密码学基础（仿射密码可逆条件）","keyPoint":"仿射密码要求 gcd(a,n)=1 才可逆"},{"id":"第二部分专业题-一、密码学-判断题-13","no":13,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"置换（permutation）密码采用线性变换对明文进行处理。","options":[],"answer":"对","analysis":"置换密码按确定规则重排明文字符的位置，这种位置置换本质上是一种线性变换（可用置换矩阵或模 n 的线性映射描述），因此题干表述成立。例如按固定步长 k 取字符的置换，可写成位置下标乘 k 再取模的线性形式。它与代换密码的区别在于：置换作用于位置，代换作用于符号本身。","correctReason":"该表述成立：置换密码对明文位置实施线性变换（置换矩阵/线性映射），不改变字符本身。","wrongReason":"","source":"密码学基础（置换密码的线性变换描述）","keyPoint":"置换＝对位置的线性变换，字符本身不变"},{"id":"第二部分专业题-一、密码学-判断题-14","no":14,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"数字签名可以实现对消息来源的认证，但不能提供消息的机密性保护。","options":[],"answer":"对","analysis":"数字签名用私钥对消息摘要签名、用公钥验证，可实现身份认证、数据完整性和不可否认性，但签名后的消息内容仍是可读的，并不隐藏信息。若要同时保密，需要先签名再加密，或采用带加密功能的方案。所以「能认证、不保密」的说法是准确的。","correctReason":"该表述成立：数字签名提供来源认证、完整性与不可否认性，但不提供机密性保护。","wrongReason":"","source":"GB/T 32918《信息安全技术 SM2 椭圆曲线公钥密码算法》；密码学基础（数字签名安全属性）","keyPoint":"签名管认证和防抵赖，保密要靠加密"},{"id":"第二部分专业题-一、密码学-判断题-15","no":15,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"数字证书中的私钥可以公开，因为公钥是保密的。","options":[],"answer":"错","analysis":"数字证书遵循「公钥公开、私钥保密」的基本原则：证书里承载的正是公钥及 CA 的签名，公钥本来就是可以公开分发的。私钥必须由持有者严格保护，一旦泄露，他人就能冒用身份签名或解密数据，整个信任链即被破坏。题干把公私钥的公开性完全颠倒了。","correctReason":"该表述不成立：证书中公开的是公钥，私钥必须严格保密，绝不能公开。","wrongReason":"","source":"《中华人民共和国电子签名法》第十三条、第十七条；密码学基础（公私钥使用原则）","keyPoint":"公钥可公开，私钥必须保密，不可颠倒"},{"id":"第二部分专业题-一、密码学-判断题-16","no":16,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"多表代换密码是以多个不同的代换表对明文消息的字母序列进行代换的密 码。","options":[],"answer":"对","analysis":"多表代换密码对同一明文字母按其在消息中的位置轮流使用多张不同的代换表，同一字母可能被加密成不同的密文字母，从而削弱了单表代换中保留下来的字母频率特征。维吉尼亚密码、博福特密码都是典型代表。判断的关键词是「多个不同的代换表」。","correctReason":"该表述成立：多表代换密码轮流使用多个不同代换表对明文字母序列进行加密。","wrongReason":"","source":"密码学基础（多表代换密码定义）","keyPoint":"多表代换＝多个代换表轮换，打乱频率特征"},{"id":"第二部分专业题-一、密码学-判断题-17","no":17,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"SHA-256 算法的输出长度为 256 比特。","options":[],"answer":"对","analysis":"SHA-256 属于 SHA-2 家族，输出固定为 256 比特（32 字节），输入消息长度则可以任意。它的内部状态和字长均为 32 位，分组长度 512 比特，每分组 64 轮压缩。要区分「输出长度固定、输入长度不限」这一基本特征。","correctReason":"该表述成立：SHA-256 的输出（摘要）长度固定为 256 比特。","wrongReason":"","source":"FIPS 180-4 (SHA-2)","keyPoint":"SHA-256 输出 256 位，输入不限长"},{"id":"第二部分专业题-一、密码学-判断题-18","no":18,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"基于Hash 的消息认证码的输出长度与消息的长度无关，而与选用的Hash 函 数有关。","options":[],"answer":"对","analysis":"基于杂凑函数构造的消息认证码（如 HMAC）先对消息做压缩，最终输出长度由所选杂凑函数决定，与消息长短无关。例如 HMAC-SM3、HMAC-SHA256 的输出都是 256 比特，无论消息是 1 字节还是 1 GB。这是 MAC 与直接输出等长校验的一个关键区别。","correctReason":"该表述成立：基于 Hash 的 MAC 输出长度取决于所选 Hash 函数，与消息长度无关。","wrongReason":"","source":"GB/T 15852《信息安全技术 消息鉴别码》；FIPS 198-1 (HMAC)","keyPoint":"HMAC 输出长度由 Hash 决定，与消息长短无关"},{"id":"第二部分专业题-一、密码学-判断题-19","no":19,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"在相同的硬件平台和软件环境下，相同密钥长度的RSA 在加密时硬件实现速 度比DES 快。","options":[],"answer":"错","analysis":"RSA 加密是大数模幂运算，涉及上千比特的模乘，运算量远大于 DES 的分组迭代，实际速度比对称密码慢几个数量级，说它比 DES 快完全相反。正因如此，工程上普遍采用「RSA/SM2 传会话密钥、对称算法加密数据」的混合密码体制。","correctReason":"该表述不成立：RSA 为大数模幂运算，其加密速度远慢于 DES 等对称分组密码。","wrongReason":"","source":"密码学基础（公钥与对称密码性能对比）","keyPoint":"公钥算法慢、对称算法快，故用混合加密"},{"id":"第二部分专业题-一、密码学-判断题-20","no":20,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"哈希函数可以用于加密消息，因为它是可逆的。","options":[],"answer":"错","analysis":"哈希函数是单向函数，设计上就要求不可逆（由摘要无法还原原消息），因此不能用于加密消息。题干一方面说「可以加密」，另一方面又给出「因为它可逆」的理由，两处都错。哈希的典型用途是完整性校验、口令存储、消息摘要和数字签名，保密性则必须依靠加密算法实现。","correctReason":"该表述不成立：哈希函数是单向不可逆的，不能用于加密消息。","wrongReason":"","source":"GB/T 32905-2016《信息安全技术 SM3 密码杂凑算法》","keyPoint":"杂凑单向不可逆，用于完整性而非加密"},{"id":"第二部分专业题-一、密码学-判断题-21","no":21,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"对称密码算法只能C 语言实现而不能用其它程序设计语言实现。","options":[],"answer":"错","analysis":"密码算法本质是一组数学运算和逻辑操作，与编程语言无关，用 C、C++、Java、Python、Rust、汇编乃至硬件描述语言都能实现。C 语言因可移植、效率高、便于底层位运算，在密码实现中用得较多，但这只是工程习惯，不是语言限制。","correctReason":"该表述不成立：算法实现与编程语言无关，对称密码算法可用任意程序设计语言实现。","wrongReason":"","source":"密码学基础（算法实现与编程语言无关）","keyPoint":"密码算法是数学运算，任何语言都能实现"},{"id":"第二部分专业题-一、密码学-判断题-22","no":22,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"ZUC 算法是一个序列密码算法。","options":[],"answer":"对","analysis":"ZUC（祖冲之）是我国自主设计的序列密码（流密码）算法，通过 LFSR、比特重组和非线性函数 F 生成密钥流，再与明文逐比特异或。它已被 3GPP 采纳为 LTE/5G 的机密性算法 128-EEA3 和完整性算法 128-EIA3，并被发布为国家密码行业标准。判断要点：ZUC 是流密码，不是分组密码。","correctReason":"该表述成立：ZUC 是生成密钥流、逐位异或加密的序列（流）密码算法。","wrongReason":"","source":"GM/T 0001-2012《祖冲之序列密码算法》","keyPoint":"ZUC 是流密码，用于 4G/5G 空口机密性与完整性"},{"id":"第二部分专业题-一、密码学-判断题-23","no":23,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"SM4 算法是我国自主设计的分组密码算法，其分组长度为 128 比特，密钥 长度为 128 比特。","options":[],"answer":"对","analysis":"SM4 是我国自主设计并公布的分组密码算法，分组长度和密钥长度均为 128 比特，采用 32 轮非线性迭代结构，加解密结构相同、仅轮密钥使用次序相反。它已作为国家标准发布，广泛用于无线局域网、金融和政务等领域。题干对分组与密钥长度的描述完全正确。","correctReason":"该表述成立：SM4 的分组长度为 128 比特、密钥长度为 128 比特，是我国自主设计的分组密码。","wrongReason":"","source":"GB/T 32907-2016《信息安全技术 SM4 分组密码算法》","keyPoint":"SM4 分组 128 位、密钥 128 位、32 轮迭代"},{"id":"第二部分专业题-一、密码学-判断题-24","no":24,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"ZUC 算法是一个基于字设计的序列密码算法。","options":[],"answer":"对","analysis":"ZUC 的线性反馈移位寄存器（LFSR）建立在素域 GF(2^31-1) 上，以 31 比特字为单位进行运算，比特重组和非线性函数 F 也都以 32 比特字为处理单位，因此被称为「基于字设计」的序列密码。这与以比特为单位设计的传统流密码（如基于 LFSR 逐比特输出）形成对比，是其高效率的重要原因。","correctReason":"该表述成立：ZUC 以 31/32 比特字为基本运算单位，属于基于字设计的序列密码。","wrongReason":"","source":"GM/T 0001-2012《祖冲之序列密码算法》","keyPoint":"ZUC 在 31 位字域上设计，是「面向字」的流密码"},{"id":"第二部分专业题-一、密码学-判断题-25","no":25,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"SM3 密码杂凑算法和SHA-256 的压缩函数完全相同。","options":[],"answer":"错","analysis":"SM3 与 SHA-256 的输出长度都是 256 比特、都采用 MD 迭代结构，但内部设计完全不同：SM3 的压缩函数为 64 轮，使用 P0、P1 置换和特有的消息扩展方式；SHA-256 为 64 轮，使用不同的逻辑函数和常量。二者是各自独立设计的算法，绝不能互换实现或认为压缩函数相同。","correctReason":"该表述不成立：SM3 与 SHA-256 的压缩函数在轮结构、消息扩展和置换函数上均不相同。","wrongReason":"","source":"GB/T 32905-2016《信息安全技术 SM3 密码杂凑算法》；FIPS 180-4","keyPoint":"SM3 与 SHA-256 同为 256 位输出但压缩函数不同"},{"id":"第二部分专业题-一、密码学-判断题-26","no":26,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"SM2 数字签名算法生成的签名长度与 SM3 哈希值长度相同。","options":[],"answer":"错","analysis":"SM2 数字签名的签名值是 (r, s) 两个分量，每个分量的长度都与椭圆曲线基点阶 n 的比特长度一致（推荐曲线为 256 比特），因此签名总长约 512 比特（64 字节）。而 SM3 的杂凑值是 256 比特（32 字节），只有签名长度的一半。计算签名时虽然会对杂凑值做运算，但最终签名要多出模 n 运算产生的 s 分量，长度并不相同。","correctReason":"该表述不成立：SM2 签名由 r、s 两个 256 比特分量组成共 64 字节，而 SM3 杂凑值仅 32 字节。","wrongReason":"","source":"GB/T 32918.2-2016《信息安全技术 SM2 椭圆曲线公钥密码算法 第2部分：数字签名算法》","keyPoint":"SM2 签名 64 字节（r、s 各 32），SM3 摘要 32 字节"},{"id":"第二部分专业题-一、密码学-判断题-27","no":27,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"量子计算对 RSA 和 ECC 公钥密码构成威胁，但对对称密码和哈希函数影响 较小（通常需要增大密钥长度）。","options":[],"answer":"对","analysis":"Shor 算法能在多项式时间内求解大整数分解和离散对数问题，而这两者正是 RSA 和 ECC/SM2 的安全基础，因此量子计算对现有公钥密码构成实质威胁。对对称密码和杂凑函数，量子攻击主要靠 Grover 算法把穷举复杂度开平方（等价于密钥长度减半），通过加倍密钥长度或输出长度即可有效应对。这一判断符合当前后量子密码迁移的主流认识。","correctReason":"该表述成立：Shor 算法威胁 RSA/ECC，Grover 对对称密码与杂凑仅带来平方根级加速，可通过增大密钥长度缓解。","wrongReason":"","source":"后量子密码迁移通用结论（NIST IR 8105、GB/T 39786-2021 相关要求）","keyPoint":"量子威胁公钥密码，对称与杂凑只需加长密钥"},{"id":"第二部分专业题-一、密码学-判断题-28","no":28,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"SHA-512 处理消息时，每个分组有80 轮运算。","options":[],"answer":"对","analysis":"SHA-512 属于 SHA-2 家族中 64 位字版本，内部状态和字长都是 64 位，输入分组长度 1024 比特，每个分组固定进行 80 轮压缩运算，输出 512 比特。要注意区分：SHA-256 是 32 位字、512 比特分组、64 轮；SHA-512 是 64 位字、1024 比特分组、80 轮。","correctReason":"该表述成立：SHA-512 每个 1024 比特消息分组需进行 80 轮压缩运算。","wrongReason":"","source":"FIPS 180-4 (SHA-2)","keyPoint":"SHA-512：64 位字、80 轮；SHA-256：32 位字、64 轮"},{"id":"第二部分专业题-一、密码学-判断题-29","no":29,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"在 Diffie-Hellman 密钥交换协议中，通信双方需要共享一个预先分配的秘密 密钥。","options":[],"answer":"错","analysis":"Diffie-Hellman 是公开密钥交换协议，双方只需公开协商大素数（或椭圆曲线参数）和各自的公开值，各自用本地私钥即可算出相同的共享密钥，事先并不需要共享任何秘密。它的真正弱点是无法认证对端身份，容易遭受中间人攻击，实际中需配合证书或签名使用。","correctReason":"该表述不成立：DH 协议无需预先共享秘密，双方通过公开交换参数即可协商出相同会话密钥。","wrongReason":"","source":"密码学基础（Diffie-Hellman 密钥交换原理）","keyPoint":"DH 无需预共享秘密，但需防中间人攻击"},{"id":"第二部分专业题-一、密码学-判断题-30","no":30,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"SM2 签名速率一般小于验签速率。","options":[],"answer":"错","analysis":"SM2 签名只需一次椭圆曲线标量乘，验签则需要两次标量乘并附带点加等运算，计算量明显更大，因此实际测试中签名速率高于验签速率，题干表述与事实相反。这一特点与「验签比签名快」的直觉不同，是 SM2 性能测试中的常见考点。","correctReason":"该表述不成立：SM2 签名仅需一次标量乘，验签需两次标量乘，故签名速率大于验签速率。","wrongReason":"","source":"GB/T 32918.2-2016《信息安全技术 SM2 椭圆曲线公钥密码算法 第2部分：数字签名算法》","keyPoint":"SM2 签名快于验签（1 次标量乘 vs 2 次）"},{"id":"第二部分专业题-一、密码学-判断题-31","no":31,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"格密码是一类被认为可以抵抗量子计算攻击的公钥密码候选算法。","options":[],"answer":"对","analysis":"这道题考的是后量子密码的分类。格密码的安全性建立在格上困难问题之上，典型代表是格中最短向量问题（SVP）和最近向量问题（CVP），在高维情形下目前既没有经典多项式算法，也没有已知的高效量子算法。因此在 NIST 组织的后量子密码标准化征集中，格密码是入选方案最多、最被看好的技术路线。与之并列的候选还有基于编码、多变量、杂凑签名等体制。","correctReason":"格密码的安全性归约到高维格上的 SVP/CVP 等困难问题，至今没有有效的量子求解算法，因此被视为能抵抗量子计算攻击的公钥密码候选。","wrongReason":"","source":"NIST 后量子密码标准化项目（PQC Standardization）入选算法说明","keyPoint":"格密码＝抗量子的主流路线，难在 SVP/CVP"},{"id":"第二部分专业题-一、密码学-判断题-32","no":32,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"SM2 算法的安全性是基于因子分解困难问题。","options":[],"answer":"错","analysis":"这道题把两类公钥体制的困难问题弄混了。基于因子分解困难问题的是 RSA，而 SM2 是我国自主设计的椭圆曲线公钥密码算法，其安全性依赖于椭圆曲线离散对数问题（ECDLP）。也就是说，攻破 SM2 等价于在相应椭圆曲线上求离散对数，而不是分解大整数 n=pq。考生最容易在此处失分，需牢记「RSA 靠分解、ECC/SM2 靠离散对数」。","correctReason":"SM2 的安全性基于椭圆曲线离散对数问题（ECDLP），与因子分解困难问题无关，故该表述不成立。","wrongReason":"","source":"GM/T 0003-2012《SM2 椭圆曲线公钥密码算法》","keyPoint":"SM2 靠椭圆曲线离散对数，RSA 才靠大整数分解"},{"id":"第二部分专业题-一、密码学-判断题-33","no":33,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"SM2 算法的安全性是基于椭圆曲线离散对数问题。","options":[],"answer":"对","analysis":"SM2 属于椭圆曲线密码（ECC）家族，在素域或二元扩域上定义椭圆曲线，其困难性假设是：已知基点 G 和点 kG，反推标量 k 在计算上不可行，即椭圆曲线离散对数问题。正因如此，SM2 用 256 比特的密钥就能达到与 3072 比特 RSA 相当的安全强度，密钥短、运算快、带宽省，适合智能卡和移动终端场景。","correctReason":"SM2 是椭圆曲线公钥密码算法，其安全性建立在椭圆曲线离散对数问题（ECDLP）的困难性上。","wrongReason":"","source":"GM/T 0003-2012《SM2 椭圆曲线公钥密码算法》","keyPoint":"SM2 安全基础＝椭圆曲线离散对数难题"},{"id":"第二部分专业题-一、密码学-判断题-34","no":34,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"消息认证码可以保证消息的机密性，因为只有持有密钥的人才能生成和验证。","options":[],"answer":"错","analysis":"该表述混淆了「认证」与「机密性」两个安全目标。消息认证码（MAC）用带密钥的算法对消息生成认证标签，收发双方共享密钥，接收方重新计算标签比对，从而发现篡改并确认来源，提供的是完整性、数据源认证和不可否认性。但消息本身是明文传输的，标签也不对消息加密，任何人截获都能读到内容。要同时保密，必须再加一层加密或采用认证加密（AEAD）模式。","correctReason":"MAC 只提供完整性校验与来源认证，不改变消息的可读性，因此不能保证机密性，该表述不成立。","wrongReason":"","source":"GB/T 15852《信息技术 安全技术 消息鉴别码》系列标准","keyPoint":"MAC 管完整性与认证，不管机密性"},{"id":"第二部分专业题-一、密码学-判断题-35","no":35,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"SM2 加密算法可以用来保护消息机密性。","options":[],"answer":"对","analysis":"SM2 标准包含公钥加密算法部分，发送方用接收方的公钥加密，只有持有对应私钥的接收方能解密，这正是机密性保护。其加密流程是：随机取 k，用点乘得到共享点，再用密钥派生函数 KDF 生成对称密钥，以异或方式加密明文，并附带 C3 杂凑值供解密方校验。要注意与 SM2 数字签名区分，签名解决的是身份认证与不可否认，不负责保密。","correctReason":"SM2 公钥加密算法以接收方公钥加密、私钥解密，未持有私钥者无法还原明文，可用于保护消息机密性。","wrongReason":"","source":"GM/T 0003.4-2012《SM2 椭圆曲线公钥密码算法 第4部分：公钥加密算法》","keyPoint":"公钥加密保机密，数字签名管认证"},{"id":"第二部分专业题-一、密码学-判断题-36","no":36,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"在公钥基础设施 PKI 中，数字证书用于将用户的身份与其公钥绑定。","options":[],"answer":"对","analysis":"PKI 的核心就是把「公钥属于谁」这件事用证书固化下来。数字证书由权威的认证机构 CA 用自己的私钥签名，内容包含用户身份信息、公钥、有效期、序列号、签发者等，任何一方都能用 CA 的公钥验证签名，从而确认该公钥确实绑定到证书上记载的主体。这样就防止了中间人替换公钥。围绕证书还配套有注册、签发、发布、吊销（CRL/OCSP）和信任链验证等完整机制。","correctReason":"数字证书由 CA 签名，把主体身份信息与其公钥绑定，使验证者能确认公钥的真实归属。","wrongReason":"","source":"GB/T 25069-2022《信息安全技术 术语》中公钥基础设施与数字证书相关条目","keyPoint":"证书＝CA 签名把身份和公钥绑定起来"},{"id":"第二部分专业题-一、密码学-判断题-37","no":37,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"在 RSA 中，选择两个大素数 p 和 q，计算 n=pq，公钥（n,e）可以公开，私钥 （n,d）中的 d 必须与 e 相等。","options":[],"answer":"错","analysis":"RSA 的密钥生成是先选两个大素数 p、q，令 n=pq 与 φ(n)=(p-1)(q-1)，再选加密指数 e 与 φ(n) 互素，并由 ed≡1 mod φ(n) 求出解密指数 d。d 是 e 关于 φ(n) 的模逆元，二者关系是乘积模 φ(n) 等于 1，而不是相等。实际中 e 常取 65537 这类小值，d 却是一个与 n 同量级的大数；若真取 d=e，公钥就能直接解密，体制立刻失去意义。","correctReason":"d 由 ed≡1 mod φ(n) 计算得到，是 e 的模逆元，一般远大于 e，故「d 必须与 e 相等」的说法不成立。","wrongReason":"","source":"RSA 算法原始定义（Rivest、Shamir、Adleman，1978）及 PKCS #1 标准","keyPoint":"ed≡1 mod φ(n)，d 是 e 的模逆元不是相等"},{"id":"第二部分专业题-一、密码学-判断题-38","no":38,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"非对称密码体制也称公钥密码体制，即所有的密钥都是公开的。","options":[],"answer":"错","analysis":"非对称密码体制之所以又叫公钥密码体制，是因为密钥成对出现：一把公钥可以公开，一把私钥必须自己保管，两者在计算上不能互相推导。所以「所有密钥都公开」是把「公钥公开」偷换成了「密钥全公开」。私钥一旦泄露，加密的消息可被解密、签名可被伪造，整个安全性就归零。这正是密钥管理要重点保护私钥的原因。","correctReason":"非对称体制中只有公钥可公开，私钥必须保密，故「所有密钥都是公开的」这一表述不成立。","wrongReason":"","source":"GB/T 25069-2022《信息安全技术 术语》公钥密码体制相关条目","keyPoint":"公钥可公开、私钥必须保密，两把不是一回事"},{"id":"第二部分专业题-一、密码学-判断题-39","no":39,"kind":"judge","part":"第二部分专业题","cat":"一、密码学","type":"判断题","stem":"CCM 认证加密模式结合了 CTR 模式的机密性和 CBC-MAC 的完整性保 护。
