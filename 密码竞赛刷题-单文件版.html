D：SM2 验签必须重新计算杂凑值（含 ZA 与消息），不可能省略。（该题答案以官方为准）","source":"GB/T 32918.2-2016《SM2 椭圆曲线公钥密码算法 第 2 部分：数字签名算法》第 6、7 章","keyPoint":"SM2/ECDSA 签名均约 64 字节、结构同源；RSA 签名长度等于模长"},{"id":"第二部分专业题-一、密码学-单选题-102","no":102,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"签名者无法知道所签消息的具体内容，即使后来签名者见到这个签名时， 也不能确定当时签名的行为，这种签名称为（ ）。","options":[{"key":"A","text":"代理签名"},{"key":"B","text":"群签名"},{"key":"C","text":"多重签名"},{"key":"D","text":"盲签名"}],"answer":"D","analysis":"盲签名的核心机制是「盲化—签名—去盲」：消息拥有者先用盲化因子把消息隐藏，签名者看到的是盲化后的数据，无法得知真实内容；签名者完成签名后，拥有者去掉盲化因子得到对原消息的有效签名。因此签名者事后即便再次见到该签名，也无法把它与自己当时的签名行为对应起来，这就是不可追踪性（无关联性），典型应用是电子现金和匿名凭证。","correctReason":"盲签名通过盲化因子让签名者看不到消息内容，签名公开后也无法将签名与请求者/消息关联，符合题干描述。","wrongReason":"A：代理签名是原签名者授权他人代为签名，签名者明确知道所签内容；B：群签名由群体成员匿名代表群体签名，签名者知道消息内容；C：多重签名是多人对同一消息依次或联合签名，各签名者都清楚消息内容。三者都不具备「内容不可见、事后不可追踪」的特性。","source":"盲签名机制（Chaum 盲签名方案）；GB/T 35275-2017《信息安全技术 SM2 密码算法加密签名消息语法规范》相关签名应用","keyPoint":"盲签名=内容不可见+签名不可追踪，用于电子现金与匿名凭证"},{"id":"第二部分专业题-一、密码学-单选题-103","no":103,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"一个数字签名体制包含的内容，说法正确的是（ ）。","options":[{"key":"A","text":"包含加密和解密两个方面"},{"key":"B","text":"包含加密和认证两个方面"},{"key":"C","text":"包含签名和验证签名两个方面"},{"key":"D","text":"包含认证和身份识别两个方面"}],"answer":"C","analysis":"数字签名体制由两套算法构成：签名算法（签名者用私钥对消息或消息摘要生成签名）和验证算法（验证者用签名者公钥确认签名有效）。它不包含加密和解密，也不同于单纯的认证或身份识别机制——虽然签名能顺带实现身份鉴别与完整性校验，但体制本体的组成就是「签名 + 验签」，标准中也是按这两部分来定义的。","correctReason":"签名体制的基本组成是签名算法与验证算法两部分，前者用私钥生成签名，后者用公钥校验签名。","wrongReason":"A：加密解密是加密体制的组成，数字签名不涉及解密操作；B：认证可以算签名带来的能力，但不是签名体制的组成结构；D：认证与身份识别是签名可支撑的安全功能，并非体制本身的构成部分。","source":"GB/T 32918.2-2016《SM2 椭圆曲线公钥密码算法 第 2 部分：数字签名算法》第 6、7 章；GB/T 25064-2010《信息安全技术 公钥基础设施 电子签名格式规范》","keyPoint":"签名体制=签名算法+验证算法，别再与加密解密混淆"},{"id":"第二部分专业题-一、密码学-单选题-104","no":104,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"关于数字签名，以下说法正确的是（ ）。","options":[{"key":"A","text":"数字签名是在所传输的数据后附加上一段和传输数据毫无关系的数字信息"},{"key":"B","text":"数字签名能够解决数据的加密传输，即安全传输问题"},{"key":"C","text":"数字签名一般采用对称加密机制"},{"key":"D","text":"数字签名能够解决篡改、伪造等安全性问题"}],"answer":"D","analysis":"数字签名用私钥生成、公钥验证，验证通过说明消息来源可信且未被改动，因此能解决篡改、伪造、冒充和抵赖等安全性问题。它不是「和传输数据无关的数字信息」，而是与消息内容（通常是消息杂凑值加签名者标识 ZA）严格绑定的；它本身也不提供机密性，只签名不加密时数据仍是明文，需要保密必须另外加密。","correctReason":"数字签名与消息摘要、签名者私钥绑定，验证通过即可证明消息完整且来自签名者，从而解决篡改、伪造等安全性问题。","wrongReason":"A：签名值由消息杂凑与私钥决定，与数据强相关，并非毫无关系的附加信息；B：签名解决的是完整性与认证，机密性要靠加密传输解决；C：数字签名基于非对称密码体制（私钥签名、公钥验签），不是对称加密。","source":"GB/T 32918.2-2016《SM2 椭圆曲线公钥密码算法 第 2 部分：数字签名算法》；《中华人民共和国电子签名法》第十三条、第十四条","keyPoint":"签名管完整性、真实性与不可否认，保密性得靠加密"},{"id":"第二部分专业题-一、密码学-单选题-105","no":105,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"下面对于数字签名的描述不正确的是（ ）。","options":[{"key":"A","text":"数字签名是可信的"},{"key":"B","text":"数字签名是不可抵赖的"},{"key":"C","text":"数字签名是可伪造的"},{"key":"D","text":"数字签名是不可伪造的"}],"answer":"C","analysis":"数字签名体制的安全目标之一就是不可伪造性：在不知道签名者私钥的前提下，攻击者无法对新的消息生成能通过验证的签名，这也是签名可用于抗抵赖、电子合同生效的前提。因此「可信」「不可抵赖」「不可伪造」都是数字签名的应有属性，而「可伪造」与它们直接矛盾，是不正确的描述。当然，现实中若私钥泄露或算法/实现存在缺陷，伪造才可能发生，但这不是签名体制的设计属性。","correctReason":"数字签名的安全性定义即为存在性不可伪造，正常使用下签名不可伪造，故「可伪造」的描述不正确。","wrongReason":"A：签名可用公钥公开验证，来源与内容可信，说法正确；B：私钥唯一持有，签名者事后无法否认，说法正确；D：不可伪造正是签名体制的核心安全属性，说法正确。故不正确的是 C。","source":"GB/T 32918.2-2016《SM2 椭圆曲线公钥密码算法 第 2 部分：数字签名算法》；《中华人民共和国电子签名法》第十三条","keyPoint":"签名三属性：可信、不可抵赖、不可伪造；「可伪造」必错"},{"id":"第二部分专业题-一、密码学-单选题-106","no":106,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"下面的说法中错误的是（ ）。","options":[{"key":"A","text":"对称密码系统的加密密钥和解密密钥相同"},{"key":"B","text":"PKI 系统的加密密钥和解密密钥不同"},{"key":"C","text":"数字签名之前要先对消息或报文做摘要"},{"key":"D","text":"数字签名系统一定具有数据加密功能"}],"answer":"D","analysis":"这是一个综合辨析题。对称密码加解密用同一密钥（或易互相推导）；公钥密码体制（PKI 场景）加解密分用公钥与私钥；数字签名一般先对消息做杂凑再对摘要签名，以兼顾效率与安全。但数字签名体制本身不包含加密功能：它只保证完整性与不可否认性，若还要保密必须另行加密，所以「签名系统一定具有数据加密功能」是错的。","correctReason":"数字签名的功能是完整性、真实性与不可否认性，并不自带数据加密能力，需要保密时必须另外施加加密。","wrongReason":"A：对称密码体制加解密共用同一密钥，说法正确；B：公钥（PKI）体制加密用公钥、解密用私钥，密钥不同，说法正确；C：签名前先做消息摘要以提高效率并绑定内容，说法正确。故错误的是 D。","source":"GB/T 32918.2-2016《SM2 椭圆曲线公钥密码算法 第 2 部分：数字签名算法》；GB/T 15843 系列《信息技术 安全技术 实体鉴别》","keyPoint":"签名不等于加密：先摘要后签名，保密另需加密"},{"id":"第二部分专业题-一、密码学-单选题-107","no":107,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"下面有关盲签名说法错误的是（ ）。","options":[{"key":"A","text":"消息的内容对签名者是不可见的"},{"key":"B","text":"在签名被公开后，签名消息一定可追踪"},{"key":"C","text":"消息的盲化处理由消息拥有者完成"},{"key":"D","text":"满足不可否认性"}],"answer":"B","analysis":"盲签名的三个要点：消息拥有者自己完成盲化处理，签名者看不到消息真实内容；签名者对盲化数据签名，事后无法把公开的签名与自己那次签名行为对应起来（无关联性/不可追踪）；同时签名仍可用签名者公钥验证，满足不可否认性。因此说「签名公开后一定可追踪」与盲签名的设计目标恰好相反。","correctReason":"盲签名的本质是签名者事后无法将签名与请求者及原消息关联，故「一定可追踪」的说法错误。","wrongReason":"A：盲化后签名者看不到消息内容，说法正确；C：盲化由消息拥有者（请求者）执行，签名者只对盲化值签名，说法正确；D：签名仍可被公开验证，签名者不能否认自己签发过，说法正确。故错误的是 B。","source":"盲签名机制（Chaum 盲签名方案）；GB/T 35275-2017《信息安全技术 SM2 密码算法加密签名消息语法规范》相关签名应用","keyPoint":"盲签名两特性：内容不可见 + 事后不可追踪（无关联性）"},{"id":"第二部分专业题-一、密码学-单选题-108","no":108,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"签名者把他的签名授权给某个人，这个人代表原始签名者进行签名，这种 签名称为（ ）。","options":[{"key":"A","text":"代理签名"},{"key":"B","text":"群签名"},{"key":"C","text":"多重签名"},{"key":"D","text":"盲签名"}],"answer":"A","analysis":"代理签名解决的是「授权代签」问题：原始签名者把自己的签名权力（通常通过一份代理授权凭证，将代理信息与自己的私钥结合生成代理密钥）授予代理人，代理人用代理私钥签名，验证者既能验证签名有效，也能确认代理关系与授权范围。群签名是群体成员匿名代表整个群体签字，多重签名是多人对同一消息共同签名，盲签名则是内容对签名者不可见，都不符合题干。","correctReason":"代理签名即原始签名者把签名权授权给代理人，由代理人代表原签名者生成的、可验证代理关系的签名。","wrongReason":"B：群签名由群内某成员匿名代表整个群体签名，仅管理者可追踪身份，不是单人授权关系；C：多重签名需要多个签名者对同一消息分别或联合签名，不涉及授权代签；D：盲签名强调签名者看不到消息内容，与授权代理无关。","source":"GB/T 32918.2-2016《SM2 椭圆曲线公钥密码算法 第 2 部分：数字签名算法》扩展应用；代理签名机制（Mambo-Usuda-Okamoto 代理签名）","keyPoint":"代理签名=授权代签，验签可确认代理关系与授权范围"},{"id":"第二部分专业题-一、密码学-单选题-109","no":109,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"环签名（ringsignature）是一种（ ）方案，是一种简化的群签名，环签 名中只有环成员没有管理者，不需要环成员间的合作。","options":[{"key":"A","text":"加密"},{"key":"B","text":"数字签名"},{"key":"C","text":"数字认证"},{"key":"D","text":"秘密共享"}],"answer":"B","analysis":"环签名是把签名者藏进一个自选「环」里的签名方案：验证者能确认签名由环内某个成员生成，却无法确定具体是谁，实现无条件匿名；它没有群管理员、也不需要成员之间协商合作，因此常被称作简化的群签名，是典型的数字签名类方案而非加密或认证协议。典型应用包括匿名举报、机密信息的匿名泄露等场景。","correctReason":"环签名通过环成员的公开信息与签名者私钥构造签名，实现签名者匿名性，本质上属于数字签名方案。","wrongReason":"A：环签名不做消息加密，不提供机密性；C：数字认证侧重于身份真实性确认，环签名恰恰刻意隐藏身份；D：秘密共享是把秘密拆分给多方保管，与环签名机制无关。","source":"环签名机制（Rivest-Shamir-Tauman 环签名方案）；GB/T 32918.2-2016 数字签名算法体系","keyPoint":"环签名=无管理者的简化群签名，匿名性、无需成员协作"},{"id":"第二部分专业题-一、密码学-单选题-110","no":110,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"关于SM9 数字签名算法以下说法错误的是（ ）。","options":[{"key":"A","text":"基于椭圆曲线双线性对实现"},{"key":"B","text":"签名之前需要对待签消息进行压缩"},{"key":"C","text":"使用主私钥对待签消息进行签名"},{"key":"D","text":"可通过签名者标识和其他信息对签名进行验证"}],"answer":"C","analysis":"SM9 签名算法基于椭圆曲线双线性对（配对）构造，签名前先对消息做杂凑压缩，验证时用签名者标识（ID）和其它公开参数即可完成验证，无需证书。关键在于密钥体系：主私钥由 KGC 保管，只用于派生用户的签名私钥；真正对消息签名的是用户自己的私钥，而不是主私钥。主私钥一旦直接用于签名，整个系统的密钥安全基础就崩塌了，因此 C 的说法是错误的。","correctReason":"SM9 中签名由用户私钥完成，该私钥由 KGC 用主私钥和用户标识派生；主私钥仅用于生成用户密钥，不直接参与签名。","wrongReason":"A：SM9 签名确实基于椭圆曲线双线性对实现，说法正确；B：签名前需对消息做杂凑压缩后再运算，说法正确；D：验证时用签名者标识等公开信息即可，无需证书，说法正确。故错误的是 C。","source":"GB/T 38635.2-2020《信息安全技术 SM9 标识密码算法 第 2 部分：数字签名算法》","keyPoint":"SM9：主私钥只派生用户私钥，签名用用户私钥，验签用标识"},{"id":"第二部分专业题-一、密码学-单选题-111","no":111,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"签名者无法知道所签消息的具体内容，即使后来签名者见到这个签名时， 也不能确定当时签名的行为，这种签名称为（ ）。","options":[{"key":"A","text":"代理签名"},{"key":"B","text":"群签名"},{"key":"C","text":"多重签名"},{"key":"D","text":"盲签名"}],"answer":"D","analysis":"该题再次考查盲签名的定义（与第 102 题同型）。盲签名在签名之前由消息拥有者对消息做盲化处理，签名者拿到的是被打乱的内容，既不知道签的是什么，签名完成后也无法把公开的签名与自己那次签名行为对应起来，这就是不可追踪性。它是电子现金、匿名凭证等需要「签名有效但内容保密」场景的基础技术。","correctReason":"盲签名的盲化处理使签名者对消息内容不可见、事后也无法关联签名与签名行为，与题干描述完全一致。","wrongReason":"A：代理签名是授权他人代签，代理人清楚消息内容；B：群签名中签名者对自己所签内容完全知情，只是对外匿名；C：多重签名各签名者均知晓所签消息。三者都不满足「签名者不知内容、事后不能确认」的特征。","source":"盲签名机制（Chaum 盲签名方案）；GB/T 35275-2017《信息安全技术 SM2 密码算法加密签名消息语法规范》相关签名应用","keyPoint":"题干出现「签名者不知道内容、事后不能确定」直接选盲签名"},{"id":"第二部分专业题-一、密码学-单选题-112","no":112,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"下列方法通常用来实现抗抵赖性的是（ ）。","options":[{"key":"A","text":"加密"},{"key":"B","text":"数字签名"},{"key":"C","text":"时间戳"},{"key":"D","text":"哈希值"}],"answer":"B","analysis":"抗抵赖（不可否认）要求签名者事后不能否认自己签发过某数据，并能向第三方（如仲裁者、法官）出示可验证的证据。数字签名恰好满足：私钥唯一由签名者掌握，签名可用其公钥公开验证，形成可举证的电子证据，这也是《电子签名法》认可可靠电子签名效力的技术基础。加密只解决机密性，时间戳只证明「某时刻数据已存在」，杂凑值本身不带身份绑定且人人可算，都不能单独实现抗抵赖。","correctReason":"数字签名与签名者私钥唯一绑定且可公开验证，能作为第三方可核验的证据，从而实现抗抵赖性。","wrongReason":"A：加密解决机密性，不绑定签名者身份，无法防止否认；C：时间戳只证明数据在某一时刻已存在，需与签名结合才有效力；D：杂凑值任何人都能计算，不具备身份唯一性和不可否认性。","source":"《中华人民共和国电子签名法》第十三条、第十四条；GB/T 25064-2010《信息安全技术 公钥基础设施 电子签名格式规范》","keyPoint":"抗抵赖靠数字签名，时间戳只能证明「那时已存在」"},{"id":"第二部分专业题-一、密码学-单选题-113","no":113,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"下列不属于数字签名所能实现的安全保证的是（ ）。","options":[{"key":"A","text":"保密通信"},{"key":"B","text":"防抵赖"},{"key":"C","text":"防冒充"},{"key":"D","text":"防伪造"}],"answer":"A","analysis":"数字签名能提供完整性、身份真实性（防冒充）、不可伪造和不可否认（防抵赖）等保证，因为签名由私钥生成、公钥可验证、且与消息摘要绑定。但签名不改变数据的可读性：只签名不加密时，报文仍以明文传输，任何截获者都能读取，所以保密通信不在数字签名所能提供的安全保证之列，需要另行加密。","correctReason":"保密通信依赖加密算法提供机密性，数字签名只保证完整性与身份真实性，不提供机密性。","wrongReason":"B：私钥唯一持有使签名者事后无法否认，属于签名提供的保证；C：签名可验证消息来源，能防冒充；D：签名不可伪造，能防伪造。三者均属于数字签名的安全保证。","source":"GB/T 32918.2-2016《SM2 椭圆曲线公钥密码算法 第 2 部分：数字签名算法》；《中华人民共和国电子签名法》第十三条","keyPoint":"签名四项保证：完整性、防冒充、防伪造、防抵赖——不含保密"},{"id":"第二部分专业题-一、密码学-单选题-114","no":114,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"PKI 体系所使用数字证书的格式标准是（ ）。","options":[{"key":"A","text":"RSA"},{"key":"B","text":"PGP"},{"key":"C","text":"X.509"},{"key":"D","text":"ECC"}],"answer":"C","analysis":"X.509 是 ITU-T 制定的公钥证书与认证框架标准，规定了证书的语法（版本、序列号、签名算法、颁发者、有效期、主体、主体公钥信息、扩展项、签名值等）以及证书路径处理规则，PKI 体系中的数字证书普遍采用这一格式，我国对应标准为 GB/T 20518。RSA、ECC 是公钥算法，PGP 是另一套基于信任网的邮件安全方案，都不是证书格式标准。","correctReason":"X.509 定义了公钥证书的数据格式与认证框架，是 PKI 数字证书通用格式标准。","wrongReason":"A：RSA 是一种公钥加密与签名算法，不是证书格式；B：PGP 是电子邮件加密与信任网体系，不采用 CA 层级证书格式；D：ECC 是椭圆曲线密码算法族的总称，同样不是证书格式标准。","source":"ITU-T X.509 | ISO/IEC 9594-8；GB/T 20518-2018《信息安全技术 公钥基础设施 数字证书格式》","keyPoint":"PKI 证书格式认准 X.509（我国对应 GB/T 20518）"},{"id":"第二部分专业题-一、密码学-单选题-115","no":115,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"下面哪个格式描述了证书请求语法（ ）。","options":[{"key":"A","text":"PKCS#7"},{"key":"B","text":"PKCS#8"},{"key":"C","text":"PKCS#9"},{"key":"D","text":"PKCS#10"}],"answer":"D","analysis":"PKCS 系列各有分工：PKCS#10 是证书请求（CertificationRequest）语法，用户在其中放入自己的主体名、公钥及扩展属性，并用对应私钥对整个请求签名，CA 校验后据此签发证书，对应 RFC 2986；PKCS#7 是密码消息封装语法（签名/信封数据），PKCS#8 是私钥信息语法，PKCS#9 定义可选属性类型。题干问「证书请求语法」，答案即 PKCS#10。","correctReason":"PKCS#10 规定了证书请求的语法结构（主体名、公钥、属性及请求者的自签名），是申请数字证书的标准格式。","wrongReason":"A：PKCS#7 定义的是加密消息/签名数据封装语法，用于数据封装而非证书申请；B：PKCS#8 定义私钥信息的封装格式，与证书请求无关；C：PKCS#9 定义附加属性类型，只是配套的属性集合。","source":"RFC 2986《PKCS #10: Certification Request Syntax Specification》；GB/T 20518-2018 相关证书申请流程","keyPoint":"PKCS#10 证书请求、#7 消息封装、#8 私钥、#9 属性、#12 个人交换格式"},{"id":"第二部分专业题-一、密码学-单选题-116","no":116,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"以下哪项不是CA 的服务功能（ ）。","options":[{"key":"A","text":"提供加密私钥管理"},{"key":"B","text":"用户证书签发"},{"key":"C","text":"用户证书撤销"},{"key":"D","text":"用户证书查询"}],"answer":"A","analysis":"CA（认证机构）的职责围绕证书生命周期展开：受理申请并签发用户证书、发布 CRL/提供 OCSP 实现在线状态查询与证书撤销、维护证书库供查询验证。而加密私钥属于用户独有凭证，通常由用户自己的密码设备或密钥管理系统生成并保管，CA 原则上不接触、更不能代为管理，否则就破坏了不可否认性的基础。","correctReason":"加密私钥由用户本人或专用密码设备生成与保管，不属于 CA 的服务功能，CA 只负责证书签发、撤销与查询。","wrongReason":"B：签发用户证书是 CA 的核心职责；C：证书撤销（发布 CRL、提供在线状态查询）是 CA 的法定职责；D：提供证书查询与状态发布服务也是 CA 的基本功能。三者均属于 CA 服务范围。","source":"GB/T 20518-2018《信息安全技术 公钥基础设施 数字证书格式》；GM/T 0014-2012《数字证书认证系统密码协议规范》","keyPoint":"CA 管证书（签发/撤销/查询），私钥永远归用户自己管"},{"id":"第二部分专业题-一、密码学-单选题-117","no":117,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"公钥密码体制中，其他人可以用公钥进行（ ）。","options":[{"key":"A","text":"加密和验证签名"},{"key":"B","text":"解密"},{"key":"C","text":"签名"},{"key":"D","text":"以上均不对"}],"answer":"A","analysis":"公钥密码体制的密钥分工是：公钥公开、私钥自留。因此任何人都可以用某人的公钥加密数据发给对方（只有对方私钥能解），也可以用其公钥验证对方生成的签名（只有对方私钥能签）。反过来，解密和签名都必须使用私钥，他人无法完成。所以「用公钥可以加密和验证签名」是唯一正确的组合。","correctReason":"公钥公开可得，既可用于加密数据，也可用于验证签名者用其私钥生成的签名，二者都不需要私钥。","wrongReason":"B：解密必须使用与加密公钥配对的私钥，公开的公钥不能解密；C：签名必须使用签名者私钥，他人持公钥无法伪造签名；D：由于 A 正确，「以上均不对」自然不成立。","source":"GB/T 32918.1-2016《SM2 椭圆曲线公钥密码算法 第 1 部分：总则》；GB/T 32918.4-2016 公钥加密算法","keyPoint":"公钥两用途：加密 + 验签；私钥两用途：解密 + 签名"},{"id":"第二部分专业题-一、密码学-单选题-118","no":118,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"X.509 数字证书格式中包含的元素有①证书版本②证书序列号③签名算法 标识④证书有效期⑤证书颁发者⑥证书主体名⑦主体公钥信息和⑧（ ）。","options":[{"key":"A","text":"主体的解密密钥"},{"key":"B","text":"证书序列号摘要"},{"key":"C","text":"密钥交换协议"},{"key":"D","text":"签名值"}],"answer":"D","analysis":"X.509 证书的必备字段依次为：版本、序列号、签名算法标识、颁发者、有效期、主体名、主体公钥信息，最后是⑧签名值（即 CA 用自己的私钥对前面所有字段的杂凑所做的签名）。证书里绝不会出现主体的解密私钥或解密密钥，它们必须由主体自己保密；也不包含「序列号摘要」或「密钥交换协议」这类字段。","correctReason":"X.509 证书的最后一个必需字段是签名值，即 CA 对证书内容（tbsCertificate）的签名，供验证者用 CA 公钥校验。","wrongReason":"A：主体的解密密钥属于私钥，必须由用户自己保管，绝不出现在公开的证书中；B：证书不含「序列号摘要」这一字段，序列号本身就是明文列出的；C：密钥交换协议不属于证书格式字段，协商由具体协议完成。","source":"ITU-T X.509 | ISO/IEC 9594-8 证书结构；GB/T 20518-2018《信息安全技术 公钥基础设施 数字证书格式》","keyPoint":"证书九要素：版本/序列号/签名算法/颁发者/有效期/主体/公钥/扩展/签名值"},{"id":"第二部分专业题-一、密码学-单选题-119","no":119,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"数字证书由CA 机构签发，用（ ）来验证证书。","options":[{"key":"A","text":"私钥"},{"key":"B","text":"公钥"},{"key":"C","text":"SRA"},{"key":"D","text":"序列号"}],"answer":"B","analysis":"数字证书由 CA 签发，其做法是 CA 用自身私钥对证书内容（含主体名、主体公钥、有效期等）的杂凑值签名。验证者拿到证书后，用 CA 的公钥（来自受信任的根证书或证书链上一级证书）去验证这个签名值：验证通过说明证书内容确由该 CA 签发且未被篡改。因此在证书验证环节起作用的是 CA 公钥，而不是任何私钥，也不是证书序列号。","correctReason":"证书上是 CA 用其私钥生成的签名，验证时必须用 CA 的公钥去校验该签名值，从而确认证书的真实性与完整性。","wrongReason":"A：私钥只在 CA 侧用于生成签名，验证方不可能持有 CA 私钥；C：「SRA」不是标准术语，与证书验证无关；D：序列号仅用于唯一标识证书、配合 CRL 查询状态，不能验证证书真伪。","source":"GB/T 20518-2018《信息安全技术 公钥基础设施 数字证书格式》；《中华人民共和国电子签名法》第十三条规定可靠电子签名需以签名人私钥制作、公钥验证","keyPoint":"私钥签名、公钥验签：验证书就是用 CA 公钥验 CA 的签名"},{"id":"第二部分专业题-一、密码学-单选题-120","no":120,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"在PKI 系统中，由（ ）绑定用户的身份信息和公钥。","options":[{"key":"A","text":"发送方"},{"key":"B","text":"CA 机构"},{"key":"C","text":"接收方"},{"key":"D","text":"不需要"}],"answer":"B","analysis":"PKI 的核心价值就是解决「公钥属于谁」的问题：CA 在审核用户身份后签发数字证书，把主体身份信息与其公钥捆绑在一起，并用自己的私钥签名以保证这一绑定关系可公开验证、不可伪造。发送方、接收方只使用和验证证书，不负责绑定；没有 CA 的绑定，公钥就可能被中间人替换。这也是 PKI 区别于 PGP 信任网的关键。","correctReason":"CA 通过审核身份并签发数字证书，将用户身份信息与公钥绑定，并以自身签名保证该绑定可被验证。","wrongReason":"A：发送方只能使用对方证书中的公钥，无权也无法完成身份与公钥的权威绑定；C：接收方同样只是证书的使用者和验证者；D：若无需绑定，公钥就会被冒充替换，PKI 也就失去意义。","source":"GB/T 20518-2018《信息安全技术 公钥基础设施 数字证书格式》；GM/T 0014-2012《数字证书认证系统密码协议规范》","keyPoint":"CA 签发证书＝把身份与公钥权威绑定，这是 PKI 的立足点"},{"id":"第二部分专业题-一、密码学-单选题-121","no":121,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"CA 用（ ）签名数字证书。","options":[{"key":"A","text":"用户的公钥"},{"key":"B","text":"用户的私钥"},{"key":"C","text":"自己的公钥"},{"key":"D","text":"自己的私钥"}],"answer":"D","analysis":"数字证书的核心是CA用自己私钥对用户身份信息与用户公钥整体做签名，证书使用者再用CA公钥验证签名，从而信任证书中的公钥确实属于该主体。用户私钥由用户自己持有，CA在正常流程中根本拿不到，而用户公钥本身正是证书要绑定的内容，不可能用来签名。CA公钥虽然与私钥成对，但只能验证签名，不能产生签名。易混点在于把\"签名\"与\"验证\"、\"CA自己\"与\"用户\"这四组关系对应清楚。","correctReason":"CA只有掌握自己的私钥才能生成只有对应公钥可验证的签名，这也是证书可被全社会统一验证的基础。","wrongReason":"A：签名需要私钥，公钥只能用于验签；B：用户私钥由用户保管，CA不掌握；C：CA公钥是对外公开用于验签的，不能签名。","source":"GB/T 20518-2018《信息安全技术 公钥基础设施 数字证书格式》","keyPoint":"证书签名用CA自己私钥，验证用CA公钥"},{"id":"第二部分专业题-一、密码学-单选题-122","no":122,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"防止他人对传输的文件进行破坏，以及确定发信人的身份需要采取的密码 技术手段是（ ）。","options":[{"key":"A","text":"数字签名"},{"key":"B","text":"加密技术"},{"key":"C","text":"生物识别"},{"key":"D","text":"实体鉴别"}],"answer":"A","analysis":"题干包含两项需求：一是防止文件在传输中被破坏或篡改，二是确定发信人身份，这两点正对应数字签名提供的完整性与真实性（含不可否认性）。加密技术解决的是机密性，即便文件被改也难以被察觉，更无法证明发送方是谁。生物识别属于身份认证手段，主要面向人员/终端登录场景，与文件传输完整性无直接关系。实体鉴别解决的是通信双方身份的真实性，不能保护文件内容在传输过程中不被改动。","correctReason":"数字签名既能校验消息是否被篡改，又能凭签名者私钥唯一性确认发送方身份并防止其抵赖。","wrongReason":"B：加密技术只保护机密性，不提供发送方身份证明；C：生物识别面向人员身份认证，不保护传输文件；D：实体鉴别只做身份真实性确认，不保证报文完整性。","source":"GB/T 39786-2021 第 7 章 数据传输相关要求","keyPoint":"防篡改+验身份+防抵赖，选数字签名"},{"id":"第二部分专业题-一、密码学-单选题-123","no":123,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"下面有关数字签名描述错误的是（ ）。","options":[{"key":"A","text":"通过待签名消息、签名值和公钥完成签名验证"},{"key":"B","text":"发送者事后不能抵赖对报文的签名"},{"key":"C","text":"接收者不能伪造签名"},{"key":"D","text":"能够保证待签名消息的机密性"}],"answer":"D","analysis":"数字签名的目标是完整性、真实性和不可否认性，它本身并不隐藏消息内容：签名方案通常基于杂凑值计算，消息往往还是明文传送。因此\"能够保证待签名消息的机密性\"是错误描述。A、B、C 都是数字签名的标准性质：验签需要消息、签名值和公钥三方参与；私钥唯一使发送者无法抵赖；接收者没有私钥也就无法伪造他人签名。若既要签名又要保密，需要再叠加加密。","correctReason":"签名基于杂凑和私钥变换，只做完整性、身份真实性证明，输出中不含也不隐藏原文，故不提供机密性。","wrongReason":"A：这是验签的标准输入，说法正确；B：私钥唯一性保证不可抵赖，说法正确；C：私钥不公开，接收者无法伪造签名，说法正确。","source":"GB/T 32918.2-2016《信息安全技术 SM2 椭圆曲线公钥密码算法 第2部分：数字签名算法》","keyPoint":"数字签名管完整性/认证/防抵赖，不管机密性"},{"id":"第二部分专业题-一、密码学-单选题-124","no":124,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"如果基于数字证书方式进行用户的身份鉴别，在进行密评时，以下核查 （ ）不是必要的。","options":[{"key":"A","text":"检查根证书如何安全导入或预置到系统内"},{"key":"B","text":"检查数字证书的合规性"},{"key":"C","text":"验证数字证书的证书链是否通过"},{"key":"D","text":"检查数字证书的机密性是如何保证的"}],"answer":"D","analysis":"采用数字证书做身份鉴别时，密评关注的是证书本身的合规可信以及验证路径是否可信：证书合规性、证书链能否验证通过、根证书如何安全导入或预置，这些都直接决定鉴别结果是否可信。而数字证书是公开发布的凭据，其内容本来就是公开信息，不存在\"保证机密性\"的要求，所以检查证书机密性不是必要的核查项。需要保密的是用户私钥，属于密钥管理环节的核查内容。","correctReason":"证书是公开凭据，机密性不是证书身份鉴别机制的必查内容，因此该项不属于必要核查项。","wrongReason":"A：根证书导入/预置方式决定信任锚是否可信，必须核查；B：证书合规性是鉴别有效的前提，必须核查；C：证书链验证通过是鉴别成立的基本条件，必须核查。","source":"GB/T 39786-2021 第 7 章 身份鉴别","keyPoint":"证书公开不需保密，查合规性、证书链与根证书"},{"id":"第二部分专业题-一、密码学-单选题-125","no":125,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"以下选项（ ）不是对传输完整性实现的测评方法。","options":[{"key":"A","text":"利用Wireshark 分析受完整性保护的数据在传输时的数据格式（如签名长度、 MAC 长度）是否符合预期"},{"key":"B","text":"如果采用数字签名技术进行传输完整性保护，测评人员可以使用公钥对抓取的 签名结果进行验证"},{"key":"C","text":"条件允许的情况下，测评人员可尝试对传输数据进行篡改（如修改MAC 值或 数字签名值），验证完整性保护措施的有效性"},{"key":"D","text":"检查传输过程是否符合GB/T15843《信息技术 安全技术实体鉴别》要求"}],"answer":"D","analysis":"传输完整性测评应围绕完整性保护措施本身做技术验证：抓包看数据格式是否符合预期（如签名长度、MAC 长度），用公钥验证抓到的签名结果，条件允许时篡改数据看能否被发现。这三条都是有效的测评方法。而 GB/T 15843《信息技术 安全技术 实体鉴别》规范的是实体鉴别机制，与传输完整性保护不是同一项技术，检查是否符合该标准不能证明传输完整性措施有效。","correctReason":"传输完整性测评应采用格式分析、签名验证、篡改测试等技术手段，实体鉴别标准与完整性测评无对应关系。","wrongReason":"A：抓包比对签名/MAC 长度属于有效测评手段；B：用公钥验证签名结果是直接验证完整性措施有效性的方法；C：篡改 MAC 或签名值验证防护有效性属于有效验证手段。","source":"GB/T 39786-2021 第 7 章 数据传输；GB/T 15843《信息技术 安全技术 实体鉴别》","keyPoint":"完整性测评靠抓包验证与篡改测试，不查鉴别标准"},{"id":"第二部分专业题-一、密码学-单选题-126","no":126,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"在测评过程中遇到的PEM 编码格式，除了开头和结尾，其内容通常以（ ） 格式编码。","options":[{"key":"A","text":"BER"},{"key":"B","text":"DER"},{"key":"C","text":"Base64"},{"key":"D","text":"Base64url"}],"answer":"C","analysis":"PEM 是一种文本化的密钥与证书封装格式，用 BEGIN/END 标签作为起止边界，边界之间是把 DER 二进制数据做 Base64 编码后按行折叠的文本。DER 是二进制编码规则，不能直接放进文本文件；BER 与 DER 同属 ASN.1 编码体系，也不是 PEM 的文本内容形式；Base64url 用 - 和 _ 替换 + 和 /，是 JWT 等场景的变体，标准 PEM 使用的是普通 Base64。","correctReason":"PEM 本质就是\"文本头尾标签 + Base64 编码的 DER 数据\"，故边界内是标准 Base64 字符集。","wrongReason":"A：BER 是 ASN.1 二进制编码规则，不在 PEM 文本中出现；B：DER 是二进制编码，需先 Base64 才能文本化；D：Base64url 是 URL 安全变体，标准 PEM 不使用。","source":"RFC 7468《Textual Encodings of PKIX, PKCS, and CMS Structures》","keyPoint":"PEM = BEGIN/END 标签 + Base64 编码的 DER"},{"id":"第二部分专业题-一、密码学-单选题-127","no":127,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"某信息系统部署在云服务提供商（CSP）机房，其物理机房完全由CSP 托 管，那么在对该信息系统进行密评时，在物理和环境安全层面合理的做法是 （ ）。","options":[{"key":"A","text":"若CSP 机房未通过密评，则物理和环境安全层面直接判定为“不符合”"},{"key":"B","text":"若CSP 机房通过密评，则可以复用该机房的密评结论"},{"key":"C","text":"若CSP 机房未通过密评，则可以直接判定为“符合”"},{"key":"D","text":"无论CSP 机房是否通过密评，物理和环境安全层面应判定为“不适用”"}],"answer":"B","analysis":"系统部署在云机房、物理环境完全由云服务商托管时，物理和环境安全层面的密码措施（如电子门禁身份鉴别、视频监控完整性）由 CSP 负责建设。若 CSP 机房已通过密评，被测系统可以直接复用其结论，避免重复测评，这是密评中常见的结论复用做法。若 CSP 机房未通过密评，也不能直接判\"不符合\"或\"符合\"，而应结合托管协议、证明材料等实际情况再下结论；而物理和环境安全是密评的必测层面，不能笼统判为\"不适用\"。","correctReason":"物理环境由云服务商托管且其机房已通过密评时，可将该层面对应指标的测评结论直接复用。","wrongReason":"A：未通过密评不等于本系统该层面一定不符合，仍需结合实际证据判定；C：未通过密评更不可能直接判\"符合\"；D：物理和环境安全是必测层面，不能一概判\"不适用\"。","source":"GB/T 39786-2021 第 7 章 物理和环境安全；GB/T 43206-2023《信息安全技术 信息系统密码应用测评要求》","keyPoint":"云托管机房已过密评→物理环境层面结论可复用"},{"id":"第二部分专业题-一、密码学-单选题-128","no":128,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"某二级信息系统，对物理和环境安全层面“身份鉴别”这一项，其密码应用 方案中论述了无法采用密码技术的客观因素，并提供了目前采用的风险控制措 施，即人脸识别，密评人员在实际测评时核实密码应用方案中的措施已落实。那 么作为该条款的测评结论合理的是（ ）。","options":[{"key":"A","text":"符合"},{"key":"B","text":"部分符合"},{"key":"C","text":"不符合"},{"key":"D","text":"不适用"}],"answer":"C","analysis":"该题考查\"无法采用密码技术\"时的测评结论如何给。物理和环境安全层面的身份鉴别要求使用密码技术（如基于密码技术的电子门禁）实现人员身份鉴别，二级系统同样适用。方案中论述的客观困难与非密码风险补偿措施，只能说明风险被缓解，并不能替代密码措施本身，实际措施是人脸识别而非密码技术。因此该条款在密码应用上未落地，应判\"不符合\"，而不是\"符合\"\"部分符合\"或\"不适用\"。","correctReason":"条款要求的密码措施并未实现，人脸识别只是风险补偿手段，不构成密码应用，故判不符合。","wrongReason":"A：未采用密码技术，不能判符合；B：本条不存在部分落实密码措施的情形，不适用\"部分符合\"；D：物理环境身份鉴别是必测项，不属于\"不适用\"。","source":"GB/T 39786-2021 第 7 章 物理和环境安全 身份鉴别；GB/T 43206-2023","keyPoint":"非密码措施（人脸识别）不能替代密码要求，判不符合"},{"id":"第二部分专业题-一、密码学-单选题-129","no":129,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"某四级信息系统，对物理和环境安全“身份鉴别”这一项，其密码应用方案 中论述了无法采用密码技术的客观因素，并提供了目前采用的风险控制措施，即 “口令+指纹”，密评人员在实际测评时核实方案中的措施已落实。那么作为该条 款的测评结论合理的是（ ）。","options":[{"key":"A","text":"符合"},{"key":"B","text":"部分符合"},{"key":"C","text":"不符合"},{"key":"D","text":"不适用"}],"answer":"C","analysis":"四级信息系统安全要求更高，物理和环境安全的身份鉴别同样应采用密码技术实现。方案中虽然论述了客观困难并落实了\"口令+指纹\"的风险控制措施，但口令和指纹都不是密码技术，口令若仅做杂凑比对也不构成合规的密码身份鉴别，指纹属于生物特征识别。因此密码措施缺失这一事实未改变，条款测评结论仍应为\"不符合\"，与二级系统同类情形结论一致。","correctReason":"\"口令+指纹\"属于非密码的身份鉴别措施，不能替代标准要求的密码技术措施。","wrongReason":"A：未使用密码技术，判不符合而非符合；B：本条并非部分落实，不适用\"部分符合\"；D：物理环境身份鉴别必测，不适用\"不适用\"。","source":"GB/T 39786-2021 第 7 章 物理和环境安全 身份鉴别；GB/T 43206-2023","keyPoint":"系统等级越高要求越严，生物识别仍不能替代密码措施"},{"id":"第二部分专业题-一、密码学-单选题-130","no":130,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"某三级信息系统开发人员采用密码机（经检测认证的一级密码模块）实现 的SM4 算法，为具有“重要数据传输机密性”安全需求的数据提供相应密码保护， 经密评人员确认该指标测评对象有2 个，且密码保护有效。那么该指标的判定结 果较为合理的是（ ）。","options":[{"key":"A","text":"符合，1 分"},{"key":"B","text":"部分符合，0.5 分"},{"key":"C","text":"部分符合，0.3 分"},{"key":"D","text":"不符合，0.25 分"}],"answer":"B","analysis":"三级系统\"重要数据传输机密性\"要求使用达到相应安全等级的密码模块。题目中密码机采用的是\"经检测认证的一级密码模块\"，而三级信息系统通常要求使用二级及以上密码模块，因此密码模块等级不达标。指标有两个测评对象且保护有效，但由于模块等级不满足要求，不能判\"符合\"满分，合理的结论是\"部分符合\"，按 GB/T 43206 的评分规则给 0.5 分。D 项的\"不符合，0.25 分\"过重，因为措施确实有效落实。","correctReason":"密码保护措施有效但密码模块安全等级不满足三级系统要求，故判部分符合并按规则计 0.5 分。","wrongReason":"A：密码模块等级不达标，不能给满分\"符合\"；C：部分符合的档位分值为 0.5 分，0.3 分不对应；D：措施真实有效，不应判\"不符合\"且分值档位不符。","source":"GB/T 39786-2021 第 7 章；GB/T 43206-2023 测评结果判定与量化评分规则","keyPoint":"密码模块等级不够→部分符合，0.5 分"},{"id":"第二部分专业题-一、密码学-单选题-131","no":131,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"以下因素（ ）可能导致数字签名功能不正确。","options":[{"key":"A","text":"签名中使用固定的随机数"},{"key":"B","text":"待签消息比SM3 杂凑值长"},{"key":"C","text":"签名中使用不可预测的随机数"},{"key":"D","text":"使用私钥签名"}],"answer":"A","analysis":"以 SM2、ECDSA 为代表的数字签名算法在签名时需要一个每次签名都不同的随机数 k，由它决定签名值中的点。若使用固定随机数，同一私钥对不同消息的签名会产生关联，攻击者通过两次签名结果联立即可解出私钥，签名功能与安全性随即失效。待签消息长度不受限，因为签名前会先做 SM3 杂凑，长消息照样能签。使用不可预测的随机数恰恰是正确做法，用私钥签名也是签名的标准流程。","correctReason":"签名随机数必须每次唯一且不可预测，固定随机数会泄露私钥，直接导致签名不再安全。","wrongReason":"B：长消息先经杂凑压缩再签名，不影响功能；C：不可预测的随机数正是签名所要求的安全条件；D：用私钥生成签名是标准做法，不是错误来源。","source":"GB/T 32918.2-2016《信息安全技术 SM2 椭圆曲线公钥密码算法 第2部分：数字签名算法》","keyPoint":"签名随机数必须唯一不可预测，固定随机数会泄私钥"},{"id":"第二部分专业题-一、密码学-单选题-132","no":132,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"某信息系统在数据库中存储有用户的性别字段的密文，应用开发人员告知 密评人员该字段采用SM4-CBC 算法进行了加密。密评人员查看该字段信息发现 只存在两种密文值，每个密文值长度为128 比特。那么以下推断正确的是（ ）。","options":[{"key":"A","text":"如果确实使用SM4-CBC 进行加密，那么开发人员可能错误地使用了IV"},{"key":"B","text":"由于密文长度为64 比特的整数倍，因此性别字段一定使用了DES 或3DES 进 行加密，开发人员说法存在问题"},{"key":"C","text":"开发人员不可能使用ECB 模式加密"},{"key":"D","text":"由于密文长度为128 比特的整数倍，符合SM4 的分组特征，因此可以判定开 发人员的说法是正确的"}],"answer":"A","analysis":"CBC 模式中每条记录都应使用不同且不可预测的初始向量 IV，即使明文相同，密文也应各不相同。本题中性别字段只有两种取值，也恰好只出现两种密文，说明相同明文产生了相同密文，这通常是 IV 被固定甚至置零、效果等同 ECB 的典型现象，因此可推断开发人员错误使用了 IV。密文长度为 128 比特与 SM4 分组长度一致，但这只是必要条件，不能证明用法正确。","correctReason":"CBC 下相同明文反复出现相同密文，说明 IV 被固定复用，属于 IV 使用错误。","wrongReason":"B：128 比特正是 SM4 的分组长度，不能据此断定用了 DES/3DES；C：ECB 模式同样会让相同明文产生相同密文，与现象吻合，不能说\"不可能使用 ECB\"；D：长度符合分组特征只是必要条件，不能证明开发人员用法正确。","source":"GB/T 32907-2016《信息安全技术 SM4 分组密码算法》；GB/T 17964-2021《信息安全技术 分组密码算法的工作模式》","keyPoint":"相同明文出相同密文，多因 CBC 的 IV 固定复用"},{"id":"第二部分专业题-一、密码学-单选题-133","no":133,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"密评人员在对SSLVPN 通信信道进行测评时 ， 发 现 协 议 算 法 套 件为 TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA（0xc013） ， 以 下 判 断 合 理 的 是 （ ）。","options":[{"key":"A","text":"采用ECDHE 算法进行密钥协商"},{"key":"B","text":"采用RSA 算法来保证通信过程中数据的机密性"},{"key":"C","text":"采用AES 算法来保证通信过程中数据的完整性"},{"key":"D","text":"采用SHA 算法来保证通信过程中数据的完整性"}],"answer":"A","analysis":"密码套件名称按\"密钥交换/认证_加密算法_WITH_对称加密_杂凑算法\"的格式排列。TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA 中，ECDHE 负责密钥协商（并提供前向安全性），RSA 用于服务器签名认证，AES_128_CBC 负责记录层数据机密性，SHA 用于生成 MAC 保证消息完整性。因此\"采用 ECDHE 算法进行密钥协商\"的说法准确，其余三项都把算法职责张冠李戴。","correctReason":"套件名中的 ECDHE 就代表密钥协商（密钥交换）算法，与选项描述一致。","wrongReason":"B：RSA 在本套件中用于身份认证与签名，机密性由 AES 提供；C：AES 提供的是加密（机密性），完整性由 SHA 的 MAC 负责；D：SHA 在本套件中负责完整性/MAC，不是密钥协商。","source":"GB/T 38636-2020《信息安全技术 传输层密码协议（TLCP）》；RFC 5289/5246 密码套件命名规则","keyPoint":"套件名顺序=密钥交换_认证_WITH_加密_完整性"},{"id":"第二部分专业题-一、密码学-单选题-134","no":134,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"我国金融信息系统、第二代居民身份证管理系统、国家电力信息系统、社 会保障信息系统、全国中小学学籍管理系统中，都应用（ ）技术构建了密码保 障体系。","options":[{"key":"A","text":"核心密码"},{"key":"B","text":"普通密码"},{"key":"C","text":"商用密码"},{"key":"D","text":"核心密码和普通密码"}],"answer":"C","analysis":"《密码法》把密码分为核心密码、普通密码和商用密码三类，前两类用于保护国家秘密信息，由国家秘密载体相关单位使用和管理，不对社会商用。金融、第二代居民身份证、国家电力、社会保障、中小学学籍管理等面向社会公众的信息系统，使用的都是商用密码技术构建密码保障体系。因此答案锁定商用密码，\"核心密码和普通密码\"的组合明显不适用于这些民用领域。","correctReason":"这些系统面向社会公共服务，采用的正是商用密码技术，符合《密码法》对三类密码的划分。","wrongReason":"A：核心密码保护国家秘密信息，不用于此类民用系统；B：普通密码同属国家秘密密码范畴，不面向社会应用；D：两类国家秘密密码均不适用于上述系统。","source":"《中华人民共和国密码法》第六条","keyPoint":"三类密码划分，民用信息系统用商用密码"},{"id":"第二部分专业题-一、密码学-单选题-135","no":135,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"下面算法运算时不需要密钥的是（ ）。","options":[{"key":"A","text":"SM2"},{"key":"B","text":"SM4"},{"key":"C","text":"ZUC"},{"key":"D","text":"SM3"}],"answer":"D","analysis":"杂凑算法是单向压缩函数，把任意长度数据映射为固定长度杂凑值，运算过程只依赖消息本身，不需要密钥，SM3 正属此类。SM2 是椭圆曲线公钥算法，签名、加密、密钥交换都涉及公钥和私钥。SM4 是分组密码，加解密必须使用 128 比特密钥。ZUC 是流密码，需要 128 比特密钥和初始向量才能产生密钥流。因此只有 SM3 不需要密钥。","correctReason":"SM3 是无密钥的杂凑算法，输入消息即得固定长度杂凑值，全程不涉及密钥。","wrongReason":"A：SM2 签名/加密都依赖公私钥对；B：SM4 加解密必须使用128 比特密钥；C：ZUC 需要密钥（和 IV）驱动才能生成密钥流。","source":"GB/T 32905-2016《信息安全技术 SM3 密码杂凑算法》","keyPoint":"SM3 杂凑无密钥，SM2/SM4/ZUC 都要密钥"},{"id":"第二部分专业题-一、密码学-单选题-136","no":136,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"密评人员在测评时发现被测系统调用服务器密码机，对堡垒机的访问控制 信息进行完整性保护，并获取了堡垒机访问控制信息的完整性校验值为： 0x1073f2a58ae7e43550bc1c11f4cd2899，其长度为128 比特，以下说法错误的是 （ ）。","options":[{"key":"A","text":"一定未采用HMAC-SM3 算法对堡垒机访问控制信息进行完整性保护"},{"key":"B","text":"可能采用了HMAC-SM3 算法对堡垒机访问控制信息进行完整性保护"},{"key":"C","text":"可能采用了HMAC-MD5 算法对堡垒机访问控制信息进行完整性保护"},{"key":"D","text":"可能采用了基于SM4-CBC 的MAC 算法对堡垒机访问控制信息进行完整性保 护"}],"answer":"A","analysis":"输出长度是识别 MAC 算法的第一条线索。杂凑算法 SM3 的输出为 256 比特，HMAC-SM3 的输出同样为 256 比特，而题中校验值只有 128 比特，所以不可能是完整的 HMAC-SM3 结果。但若说成\"一定未采用\"又过于绝对，因为实现中可以把输出截断到 128 比特使用。本题按官方答案将 A 判为错误说法；HMAC-MD5 输出恰为 128 比特，SM4-CBC-MAC 也可取 128 比特，两者在长度上均可能。","correctReason":"HMAC-SM3 输出为 256 比特，与观测到的 128 比特长度不符；本题以官方答案为准，A 为错误说法。","wrongReason":"B：若实现中对 HMAC-SM3 输出做了截断，就可能得到 128 比特值，故\"可能采用\"说得通；C：HMAC-MD5 输出恰为 128 比特，长度上可能；D：基于 SM4-CBC 的 MAC 同样可取 128 比特输出，长度上可能。","source":"GB/T 32905-2016；GB/T 15852《信息技术 安全技术 消息鉴别码》","keyPoint":"SM3/HMAC-SM3 输出 256 位，MD5 输出 128 位"},{"id":"第二部分专业题-一、密码学-单选题-137","no":137,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"SM2 算法中的数字签名的签名运算最耗时的是（）运算。","options":[{"key":"A","text":"随机数生成"},{"key":"B","text":"消息映射"},{"key":"C","text":"素性检测"},{"key":"D","text":"点乘"}],"answer":"D","analysis":"SM2 签名过程中最重的计算是椭圆曲线点乘：签名时要计算 G 的标量乘得到椭圆曲线点 r，验证时还要做两次点乘的线性组合，每一次都包含大量有限域模乘、模平方与模逆运算，开销远高于其他步骤。随机数生成只是调用随机源，代价极小；消息映射（如 SM3 杂凑与求逆）只是少量运算；素性检测属于系统参数或密钥生成阶段的准备工作，不在每次签名运算的主路径上。","correctReason":"点乘（椭圆曲线标量乘）运算量大、耗时最长，是 SM2 签名的主要性能瓶颈。","wrongReason":"A：随机数生成只是一次随机源调用，耗时极小；B：消息映射仅做杂凑与少量模运算，开销小；C：素性检测用于参数/密钥生成阶段，不构成签名主路径的开销。","source":"GB/T 32918.1-2016、GB/T 32918.2-2016《SM2 椭圆曲线公钥密码算法》","keyPoint":"SM2 签名最耗时的是点乘"},{"id":"第二部分专业题-一、密码学-单选题-138","no":138,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"（ ）算法使用同一个私钥对同一个消息签名后，签名值始终一致，即该 算法是一个确定性签名算法。","options":[{"key":"A","text":"SM2 签名"},{"key":"B","text":"DSA"},{"key":"C","text":"RSA-PSS 签名"},{"key":"D","text":"EdDSA"}],"answer":"D","analysis":"EdDSA 是确定性签名算法：它的随机数 r 由私钥与消息杂凑值共同确定性地导出，因此同一私钥对同一消息签名，结果始终完全一致。SM2 签名和 DSA 都依赖每次签名随机选取的 k，同一消息两次签名结果通常不同；RSA-PSS 在签名时会引入随机盐值，同一消息重复签名的结果也不相同。这种随机化设计提升了安全性，但代价就是签名值不确定。","correctReason":"EdDSA 用确定性方式从私钥和消息导出签名随机数，故同一私钥对同一消息的签名值恒定。","wrongReason":"A：SM2 签名使用随机数 k，每次签名结果不同；B：DSA 同样依赖随机数 k，签名结果随机；C：RSA-PSS 引入随机盐值，同一消息签名结果不固定。","source":"RFC 8032《Edwards-Curve Digital Signature Algorithm (EdDSA)》","keyPoint":"EdDSA 是确定性签名，SM2/DSA/RSA-PSS 用随机数"},{"id":"第二部分专业题-一、密码学-单选题-139","no":139,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"在区块链中，用户的交易记录会通过区块的方式进行组织，然后通过一种 块链结构将区块串联在一块，形成区块链账本。以下（ ）可用于区块链账本的 存储安全管理。","options":[{"key":"A","text":"通过SHA1 算法计算区块头的杂凑值标识区块，用于链接相邻区块"},{"key":"B","text":"采用SM4 算法保证账本重要内容的机密性"},{"key":"C","text":"只通过用户名、口令实现访问账本数据的身份鉴别"},{"key":"D","text":"采用MD5 算法保证账本重要内容的完整性"}],"answer":"B","analysis":"区块链账本本身要求公开可验证，敏感内容的保护重点在机密性，用 SM4 等分组密码对账本重要内容加密是可行且合规的存储安全管理手段。A 项用 SHA1 计算区块头杂凑值来链接区块，SHA1 早已不具备足够抗碰撞强度，不应作为安全措施推荐。C 项仅靠用户名加口令做身份鉴别，强度不足。D 项 MD5 已被证明存在实用碰撞攻击，不能再用它保证账本完整性。","correctReason":"SM4 是合规的商用分组密码算法，对账本重要内容加密可有效保证其机密性。","wrongReason":"A：SHA1 抗碰撞性已被攻破，不适合继续承担哈希链接的安全职责；C：仅用户名口令属弱鉴别，不足以保护账本访问；D：MD5 存在实用碰撞，不能用于完整性保护。","source":"GB/T 32907-2016；GB/T 39786-2021 第 7 章 数据存储安全","keyPoint":"账本存储保护：SM4 保机密，弃用 SHA1/MD5 与弱口令"},{"id":"第二部分专业题-一、密码学-单选题-140","no":140,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"某物联网智慧水务系统需实现低功耗终端设备与云端的安全通信，要求满 足以下条件： （1）终端计算能力弱，需轻量级算法加密水质传感数据流（每秒1KB）； （2）通信双方需完成双向身份认证，防止伪造节点接入； （3）数据完整性需抗重放攻击，且传输时延低于50ms。 以下哪种算法组合最符合需求？（ ）","options":[{"key":"A","text":"SM2+SM3+CBC 模式填充"},{"key":"B","text":"SM4-CTR+SM3-HMAC+预共享SM9 密钥"},{"key":"C","text":"ZUC 流加密+SM2 数字签名+SM3 哈希"},{"key":"D","text":"SM4-OFB+SM3-KDF+动态SM2 证书"}],"answer":"B","analysis":"条件（1）要求轻量高效：SM4-CTR 属流式加密，无需填充、可并行、开销小，适合算力弱的终端。条件（2）要求双向身份认证：SM9 基于标识的密码体制密钥短、认证过程轻量，配合预共享密钥即可完成双向认证。条件（3）要求完整性且抗重放：HMAC-SM3 提供带密钥的完整性校验，再配合序号/时间戳即可抵抗重放，且时延远低于 50ms。其余组合中，数字签名和证书校验环节在弱终端上开销偏大。","correctReason":"SM4-CTR 轻量加密、HMAC-SM3 保完整性抗重放、SM9 轻量双向认证，三项需求都能满足且时延可控。","wrongReason":"A：SM2 与 CBC 模式填充在弱算力终端上开销大、需填充，时延与功耗不占优；C：ZUC 与 SM2 数字签名组合中，公钥签名在弱终端上验证开销大；D：采用动态 SM2 证书每次会话都需证书链校验，时延与功耗偏高。","source":"GB/T 32907-2016；GB/T 32918 系列；GB/T 38635《信息安全技术 SM9 标识密码算法》","keyPoint":"弱终端选轻量对称加密+MAC+轻量标识认证（SM9）"},{"id":"第二部分专业题-一、密码学-单选题-141","no":141,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"某科技公司想要使用密码技术对其开发的线上会议系统的实时视频流进行 加密传输，使用以下哪种密码算法可以最大限度保证视频流的实时性（ ）","options":[{"key":"A","text":"ZUC"},{"key":"B","text":"SM2"},{"key":"C","text":"SM3"},{"key":"D","text":"RSA"}],"answer":"A","analysis":"实时视频流的特点是数据量大且对时延敏感，需要流式、低开销的加密方式。ZUC 是我国自主设计的流密码算法，逐比特/逐字产生密钥流与明文异或，无需分组填充和模式迭代，软硬件实现都很轻，最适合保证实时性。SM2 与 RSA 是非对称算法，运算速度比对称算法慢几个数量级，无法承载大流量视频数据。SM3 是杂凑算法，只用于完整性校验，根本不能加密。","correctReason":"ZUC 是面向实时场景的流密码，加解密只需与密钥流异或，吞吐高、时延低。","wrongReason":"B：SM2 是公钥算法，运算慢，不适合大流量视频加密；C：SM3 是杂凑算法，不提供加密功能；D：RSA 是公钥算法，加解密开销大，无法满足实时性。","source":"GB/T 33133《信息安全技术 祖冲之序列密码算法》（GM/T 0001-2012）","keyPoint":"实时大流量加密用流密码 ZUC，不用公钥和杂凑"},{"id":"第二部分专业题-一、密码学-单选题-142","no":142,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"Alice 有一台专用加密机，其只能实现ZUC 算法。Alice 使用该加密机，一 定无法实现的功能是（ ）","options":[{"key":"A","text":"真实性"},{"key":"B","text":"机密性"},{"key":"C","text":"完整性"},{"key":"D","text":"不可否认性"}],"answer":"D","analysis":"ZUC 是对称流密码，收发双方共享密钥即可生成相同密钥流，因此能提供机密性；利用它构造 MAC 或参与鉴别协议，也能支持完整性保护和一定程度的实体真实性。但不可否认性必须由数字签名这类非对称技术提供——只有签名者独有私钥，事后无法抵赖。对称密码双方共用同一密钥，任何一方都能伪造对方的消息认证码，无法在争议中区分是谁生成的，因此一定无法实现不可否认性。","correctReason":"不可否认性要求只能由签名者掌握的私钥生成签名，对称的 ZUC 双方共享密钥，无法做到。","wrongReason":"A：ZUC 可参与消息鉴别/认证构造，能支持真实性；B：流密码本身即可提供机密性；C：ZUC 可结合 MAC 机制提供完整性保护，并非无法实现。（本题四个选项中 D 为必选项，其余功能均存在实现途径）","source":"GB/T 33133《信息安全技术 祖冲之序列密码算法》；GB/T 32918.2-2016","keyPoint":"对称算法（ZUC）可保机密/完整，唯独不能提供不可否认性"},{"id":"第二部分专业题-一、密码学-单选题-143","no":143,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"在5G 通信的加密场景中，ZUC 算法被用于生成密钥流。以下关于ZUC 算 法核心结构的描述正确的是（ ）","options":[{"key":"A","text":"采用256 位初始密钥"},{"key":"B","text":"包含16 级线性反馈移位寄存器（LFSR）"},{"key":"C","text":"每轮输出64 位密钥流"},{"key":"D","text":"其S 盒设计基于AES 的SubBytes 变换"}],"answer":"B","analysis":"标准 ZUC 算法的三大部件是 16 级线性反馈移位寄存器（LFSR）、比特重组（BR）和非线性函数 F，因此\"包含 16 级 LFSR\"的描述正确。其初始密钥为 128 比特、初始向量 128 比特，故\"256 位初始密钥\"说的是扩展版 ZUC-256。标准 ZUC 每轮输出 32 比特密钥流，不是 64 比特。其 S 盒为专门设计，并非基于 AES 的 SubBytes 变换。","correctReason":"ZUC 的核心结构就是 16 级 LFSR 加比特重组和非线性函数 F，描述与算法规范一致。","wrongReason":"A：标准 ZUC 初始密钥为 128 比特，256 比特是 ZUC-256 扩展版；C：标准 ZUC 每轮输出 32 比特密钥流；D：ZUC 的 S 盒为自主设计，不基于 AES 的 SubBytes。","source":"GB/T 33133《信息安全技术 祖冲之序列密码算法》（GM/T 0001-2012）","keyPoint":"ZUC=16 级 LFSR+比特重组+F，128 位密钥、32 位轮输出"},{"id":"第二部分专业题-一、密码学-单选题-144","no":144,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"Alice 对某数据传输的加密代码进行分析，发现其是通过提前生成密钥流再 与明文逐比特异或的方式对数据进行加密的。那么，其所使用的密码算法可能是 （ ）","options":[{"key":"A","text":"AES"},{"key":"B","text":"SM4"},{"key":"C","text":"ZUC"},{"key":"D","text":"MD5"}],"answer":"C","analysis":"\"提前生成密钥流再与明文逐比特异或\"正是流密码的定义性特征。四个选项中只有 ZUC 是流密码，它用密钥和 IV 初始化内部状态后连续输出密钥流，直接与明文异或完成加密。AES 和 SM4 是分组密码，按 128 比特分组处理，需借助工作模式（如 CTR/OFB）才能表现出流式特征，代码层面会看到分组与模式处理逻辑。MD5 是杂凑算法，只做单向摘要，根本无法用于加密。","correctReason":"ZUC 是流密码，其加密过程正是密钥流与明文逐比特异或，与题干描述完全吻合。","wrongReason":"A：AES 是分组密码，不直接产生密钥流逐比特异或；B：SM4 同为分组密码，需特定工作模式才近似流式；D：MD5 是杂凑算法，不能加密。","source":"GB/T 33133《信息安全技术 祖冲之序列密码算法》；GB/T 17964-2021","keyPoint":"密钥流异或明文=流密码，国产代表是 ZUC"},{"id":"第二部分专业题-一、密码学-单选题-145","no":145,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"当安全技术人员检查5G 核心网时，发现加密模块的初始化向量（IV）固定不 变。这会导致（ ）","options":[{"key":"A","text":"加密速度下降"},{"key":"B","text":"相同密钥下密钥流重复"},{"key":"C","text":"数据明文传输"},{"key":"D","text":"触发基站重启保护"}],"answer":"B","analysis":"流密码加密时用密钥和 IV 初始化内部状态，IV 的作用就是让同一密钥在不同会话中产生不同密钥流。如果 IV 固定不变，相同密钥下每次生成的密钥流完全相同，一旦密钥流被复用，攻击者把两段密文异或即可消掉密钥流、得到两段明文异或的结果，再结合语言统计就能还原明文，安全性急剧下降。加密速度、明文传输、基站重启与该缺陷都没有因果关系。","correctReason":"密钥流由密钥与 IV 共同决定，IV 固定则密钥流可重复，导致密钥流复用这一致命弱点。","wrongReason":"A：IV 固定不影响算法运算量，加密速度不会因此下降；C：数据仍被异或加密，并非变成明文传输；D：IV 固定不会触发基站重启保护机制。","source":"GB/T 33133《信息安全技术 祖冲之序列密码算法》；GB/T 17964-2021 关于 IV 唯一性要求","keyPoint":"流密码 IV 必须每次不同，否则密钥流复用被破"},{"id":"第二部分专业题-一、密码学-单选题-146","no":146,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"某智能电表项目要求使用国密算法进行通信加密，工程师选择ZUC 算法而 不使用其他的国密算法是因为（ ）","options":[{"key":"A","text":"适合低功耗嵌入式设备"},{"key":"B","text":"支持512 位超长密钥"},{"key":"C","text":"内置纠错编码功能"},{"key":"D","text":"可替进行数字签名"}],"answer":"A","analysis":"ZUC 面向的正是资源受限场景，硬件实现电路面积小、逻辑简单、加解密速度快、功耗低，非常适合智能电表这类低功耗嵌入式设备，这也是它在移动通信等领域被广泛采用的原因。它使用 128 比特密钥，并不支持 512 比特超长密钥；算法本身不含纠错编码功能，纠错由通信层处理；作为流密码它也不能替代数字签名。","correctReason":"ZUC 属轻量级流密码，实现简单、功耗低、速度快，契合低功耗嵌入式终端。","wrongReason":"B：ZUC 密钥长度为 128 比特，不支持 512 位密钥；C：算法不含纠错编码，纠错属于通信层功能；D：流密码不能承担数字签名职责。","source":"GB/T 33133《信息安全技术 祖冲之序列密码算法》（GM/T 0001-2012）","keyPoint":"选 ZUC 的理由=轻量、低功耗、适合嵌入式"},{"id":"第二部分专业题-一、密码学-单选题-147","no":147,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"工程师调试ZUC 硬件模块时，发现首次输出的32 位密钥流全为0，应优先 检查（ ）","options":[{"key":"A","text":"电源供电电压"},{"key":"B","text":"LFSR 初始化状态"},{"key":"C","text":"散热片安装情况"},{"key":"D","text":"晶振频率偏差"}],"answer":"B","analysis":"ZUC 输出密钥流完全由内部状态决定，而内部状态由密钥与 IV 通过初始化过程装载。若内部状态、密钥或 IV 没有正确写入（如复位未释放、初态为全零），LFSR 就可能停在异常状态，导致开头输出全零或恒定序列。因此排查应优先看 LFSR 初始化状态和密钥/IV 装载是否正确。电源、散热、晶振属于硬件环境因素，通常表现为随机错误或时序异常，而不是恰好输出全零这种确定性现象。","correctReason":"输出全零说明内部状态未正确初始化，最直接的原因是 LFSR 初态（含密钥/IV 装载）异常。","wrongReason":"A：供电电压异常一般造成随机误码或不工作，不会精确输出全零密钥流；C：散热问题与密钥流内容无直接关系；D：晶振偏差影响时序，不决定密钥流取值。","source":"GB/T 33133《信息安全技术 祖冲之序列密码算法》（GM/T 0001-2012）","keyPoint":"密钥流异常先查 LFSR 初始化状态与密钥/IV 装载"},{"id":"第二部分专业题-一、密码学-单选题-148","no":148,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"某无人机在传输视频信号时使用了ZUC-256，而非ZUC 的标准版，ZUC-256 相比标准版本主要增强了（ ）","options":[{"key":"A","text":"抗侧信道攻击能力"},{"key":"B","text":"密钥派生函数强度"},{"key":"C","text":"算法吞吐量"},{"key":"D","text":"密钥空间大小"}],"answer":"D","analysis":"ZUC-256 是标准 ZUC 的增强版本，主要变化是把密钥长度从 128 比特扩展到 256 比特，并相应扩展 IV 长度、增强密钥派生与初始化设计。密钥长一倍意味着穷举密钥的搜索空间呈指数级增长，抗暴力破解能力显著提升，这正是其最核心的增强点。它并不是专门针对侧信道防护、也不以提升吞吐量为目标，密钥派生函数虽有改进但属配套设计。","correctReason":"ZUC-256 把密钥由 128 比特扩展到 256 比特，最直接的增强就是密钥空间大幅增大。","wrongReason":"A：抗侧信道攻击不是 ZUC-256 的主要改进目标；B：密钥派生函数设计有调整，但不是主要增强点；C：算法吞吐量并非 ZUC-256 相对标准版的主要提升方向。","source":"GB/T 33133《信息安全技术 祖冲之序列密码算法》系列（ZUC-256 相关部分）","keyPoint":"ZUC-256 主要增强密钥空间（128→256 位密钥）"},{"id":"第二部分专业题-一、密码学-单选题-149","no":149,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"Alice 破解了某系统对存储数据进行加密的源代码，发现其是使用ECB 模式 对数据进行加密存储的。那么可以分析得出，该系统最不可能是使用下列的哪类 密码算法实现数据存储的机密性保护的（ ）","options":[{"key":"A","text":"ZUC"},{"key":"B","text":"SM4"},{"key":"C","text":"AES"},{"key":"D","text":"DES"}],"answer":"A","analysis":"ECB 是一种分组密码工作模式，前提是底层算法必须是分组密码。ZUC 是流密码，只按密钥流逐位异或输出，根本不存在分组与 ECB 模式的概念，因此采用 ECB 模式加密存储的系统不可能使用 ZUC。SM4、AES、DES 都是分组密码，都可以（虽然不推荐）用 ECB 模式实现数据存储加密。所以最不可能的选项是 ZUC。","correctReason":"ECB 属于分组密码工作模式，流密码 ZUC 不支持该模式，故该系统不可能用 ZUC。","wrongReason":"B：SM4 是分组密码，支持 ECB 模式；C：AES 是分组密码，支持 ECB 模式；D：DES 是分组密码，同样支持 ECB 模式。","source":"GB/T 17964-2021《信息安全技术 分组密码算法的工作模式》；GB/T 33133","keyPoint":"ECB 是分组密码模式，流密码 ZUC 用不了"},{"id":"第二部分专业题-一、密码学-单选题-150","no":150,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"某金融机构计划升级跨境支付系统，需在区块链底层实现以下安全功能： （1）节点间密钥协商支持后量子安全特性； （2）交易哈希算法需抗长度扩展攻击； （3）智能合约权限管理需支持属性基细粒度控制； （4）兼容现有国际标准的同时优先采用国密算法。 应选择哪种技术方案？（ ）","options":[{"key":"A","text":"ECDH+SHA-256+基于SM2 的访问控制"},{"key":"B","text":"SM2-KEM+SM3+SM9 属性基加密"},{"key":"C","text":"Kyber+SM3+SM4 工作流加密"},{"key":"D","text":"SM9 密钥交换+BLAKE2s+SM2 属性签名"}],"answer":"B","analysis":"四项需求逐一对照：后量子安全的密钥协商可用 SM2-KEM 做国密合规的密钥封装与协商；抗长度扩展攻击的杂凑要求排除 SHA-256、MD5 一类 Merkle-Damgård 结构算法，SM3 采用了抗长度扩展的设计；属性基细粒度权限控制正好由 SM9 标识密码体系支持的属性基加密（ABE）实现；同时全程采用国密算法满足\"优先国密\"。其余方案或引入非国密算法（Kyber、BLAKE2s、ECDH），或缺少属性基加密能力。","correctReason":"SM2-KEM 支持国产密钥协商、SM3 抗长度扩展、SM9 可构建属性基加密，四项需求全覆盖且以国密为主。","wrongReason":"A：ECDH 与 SHA-256 非国密，且基于 SM2 的访问控制不等于属性基细粒度控制；C：Kyber 非国密算法，SM4 工作流加密也不是属性基控制；D：BLAKE2s 非国密杂凑、属性签名不等于属性基加密，方案不匹配。","source":"GB/T 32918 系列；GB/T 32905-2016；GB/T 38635《信息安全技术 SM9 标识密码算法》","keyPoint":"国密组合：SM2-KEM 协商+SM3 杂凑+SM9 属性基加密"},{"id":"第二部分专业题-一、密码学-单选题-151","no":151,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"SM2 密钥交换协议（基于ECDH）可以使得通信双方在公开信道上协商出 共享秘密。以下关于SM2 密钥交换的描述，错误的是（ ）","options":[{"key":"A","text":"SM2 密钥交换使用椭圆曲线点乘运算"},{"key":"B","text":"通信双方各自生成临时密钥对，并交换临时公钥"},{"key":"C","text":"SM2 密钥交换最终协商出的共享密钥可以直接用作对称加密密钥"},{"key":"D","text":"SM2 密钥交换协议通过哈希运算对交换过程进行认证，防止中间人攻击"}],"answer":"C","analysis":"SM2 密钥交换属于椭圆曲线 Diffie-Hellman 类协商：双方各生成临时密钥对并交换临时公钥，结合自身私钥、对方临时公钥与双方标识，算出共享的椭圆曲线点。该点不直接充当对称密钥，而是先拼接 x 坐标等数据，再送入标准定义的密钥派生函数 KDF 扩展成会话密钥，输出还需按需截取并排除全零退化值。C 把共享秘密与最终会话密钥混为一谈，故错误。协议中双方标识与公钥经杂凑参与运算，可确认对端持有私钥，抗中间人攻击。","correctReason":"SM2 密钥交换只协商出共享的椭圆曲线点（共享秘密），必须再经标准规定的 KDF 派生后才是会话密钥，两者不能等同。","wrongReason":"A：SM2 密钥交换的核心运算正是椭圆曲线点乘（以及点加），描述正确；B：协议确实要求双方各自生成临时密钥对并交换临时公钥，描述正确；D：协议用杂凑值把双方标识与公钥绑定，可鉴别对端身份、抵御中间人攻击，描述正确。","source":"GB/T 32918.3-2016《信息安全技术 SM2 椭圆曲线公钥密码算法 第3部分：密钥交换协议》","keyPoint":"SM2 协商出的是共享点，需经 KDF 派生才是会话密钥"},{"id":"第二部分专业题-一、密码学-单选题-152","no":152,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"前向安全性（ForwardSecrecy）是指长期私钥泄露后，过去的会话密钥仍然 安全。以下密钥交换方案中，提供完美前向安全性的是（ ）","options":[{"key":"A","text":"RSA 密钥传输（客户端生成预主密钥，用RSA 公钥加密后发送给服务器）"},{"key":"B","text":"静态ECDH（双方使用固定长期的椭圆曲线密钥对）"},{"key":"C","text":"ECDHE（临时椭圆曲线Diffie-Hellman 密钥交换）"},{"key":"D","text":"SM2 密钥封装机制（KEM）"}],"answer":"C","analysis":"前向安全性考察长期私钥泄露后历史会话密钥是否仍安全。ECDHE 每次握手临时生成椭圆曲线密钥对，会话一结束即销毁临时私钥，攻击者事后拿到长期私钥也无法重算已删除的临时私钥，故提供完美前向安全性。RSA 密钥传输把预主密钥用服务器长期公钥加密，拿到长期私钥即可解开全部历史流量；静态 ECDH 双方密钥长期固定，泄露长期私钥同样能推出历史共享秘密。可见关键在临时密钥用完即弃。","correctReason":"ECDHE 每次会话使用一次性临时密钥对，会话结束后临时私钥即被销毁，长期私钥泄露也无法反推历史会话密钥。","wrongReason":"A：预主密钥由服务器长期 RSA 私钥解密，长期私钥泄露即可解开全部历史会话；B：静态 ECDH 使用长期固定密钥对，泄露长期私钥即可重算共享秘密，无前向安全性；D：SM2 密钥封装机制以接收方长期公钥封装密钥，接收方长期私钥泄露即导致历史被封装密钥被解出，不具备完美前向安全性。","source":"RFC 8446《TLS 1.3》及 GB/T 32918.3-2016 密钥交换协议相关原理","keyPoint":"临时密钥对即用即弃才有前向安全性，长期密钥参与密钥生成则没有"},{"id":"第二部分专业题-一、密码学-单选题-153","no":153,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"量子计算机对当前主流的公钥密码算法构成威胁。以下算法中，受量子计 算机影响最大的是（ ）","options":[{"key":"A","text":"AES-256"},{"key":"B","text":"SM3"},{"key":"C","text":"SM2"},{"key":"D","text":"SM4"}],"answer":"C","analysis":"SM2 的安全性建立在椭圆曲线离散对数问题之上，Shor 算法可在量子计算机上多项式时间求解该类问题，故 SM2 受冲击最大、基本失效。对称算法与杂凑算法只面对 Grover 搜索的平方级加速：AES-256 仍有约 128 比特量子安全强度，SM4 约 64 比特，SM3 抗碰撞强度约降到 128 比特，都可通过加长密钥或输出应对。","correctReason":"SM2 所依赖的椭圆曲线离散对数问题可被 Shor 算法多项式时间求解，公钥密码在量子模型下基本失效。","wrongReason":"A：AES-256 只受 Grover 算法平方级加速影响，仍有约 128 比特安全强度；B：SM3 是杂凑算法，仅受 Grover/生日界影响，可提升输出长度应对；D：SM4 同为分组密码，同样只面对平方级加速，不属于受影响最大的一类。","source":"GB/T 32918 系列（SM2）、GB/T 32907-2016（SM4）、GB/T 32905-2016（SM3）；量子算法对公钥密码的威胁属通用结论","keyPoint":"Shor 破公钥（SM2/RSA），Grover 只把对称与杂凑强度开平方"},{"id":"第二部分专业题-一、密码学-单选题-154","no":154,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"某数据库系统需要对存储的每条记录进行加密，并且需要能够检测数据是 否被篡改。以下方案中最优的是（ ）","options":[{"key":"A","text":"AES-CBC 加密 + 独立存储哈希值"},{"key":"B","text":"AES-GCM 认证加密"},{"key":"C","text":"先AES-ECB 加密，再计算MD5"},{"key":"D","text":"仅使用SM3 进行完整性保护，不加密"}],"answer":"B","analysis":"题目要求每条记录既保密又能检测篡改。AES-GCM 属认证加密模式，一次运算同时产出密文与认证标签，标签覆盖密文与附加数据，密钥持有者可验证完整性，兼顾保密、防篡改且高效可并行，故最优。A 的加密与哈希分离，哈希值可被一并篡改，CBC 本身也无完整性保护；C 的 ECB 会暴露明文块的重复规律，MD5 碰撞已被构造，不能用于防篡改；D 只校验不加密，保密需求落空。","correctReason":"AES-GCM 是认证加密模式，一次运算同时提供机密性与可验证的完整性（认证标签），最契合\"加密并防篡改\"的双重需求。","wrongReason":"A：CBC 本身不提供完整性，另存的哈希值与被保护数据分离、可被一并篡改，且存在填充预言等风险；C：ECB 会泄露明文块的重复规律，MD5 抗碰撞性已被攻破，不能用于防篡改；D：仅用 SM3 做完整性保护而不加密，无法满足数据保密要求。","source":"GB/T 36624-2018《信息安全技术 可鉴别的加密机制》及 NIST SP 800-38D 关于 GCM 的规定","keyPoint":"既要保密又要防篡改，选认证加密（AEAD）模式如 GCM"},{"id":"第二部分专业题-一、密码学-单选题-155","no":155,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"差分密码分析是一种针对分组密码的选择明文攻击方法。以下关于差分密 码分析的描述，正确的是（ ）","options":[{"key":"A","text":"差分密码分析通过分析大量明密文对的线性关系来恢复密钥"},{"key":"B","text":"差分密码分析的核心是研究输入差分对输出差分的影响规律"},{"key":"C","text":"差分密码分析对DES 完全无效"},{"key":"D","text":"差分密码分析是唯密文攻击方法"}],"answer":"B","analysis":"差分密码分析由 Biham 与 Shamir 提出：选定明文差分，统计它经过各轮非线性部件（如 S 盒）后输出差分的传播概率，找出概率明显偏离随机的差分特征，再用大量明密文对筛出候选轮密钥并逐轮扩展。可见核心是研究输入差分对输出差分的影响规律，属选择明文攻击。DES 的设计已针对差分分析优化，但攻击理论上仍有效，只是数据复杂度高（约 2^47 量级选择明文对）。","correctReason":"差分密码分析的核心正是利用高概率差分特征，研究输入差分如何经各轮变换影响输出差分，从而恢复密钥。","wrongReason":"A：通过线性逼近描述明文、密文与密钥比特的线性关系的是线性密码分析，不是差分分析；C：差分分析对 DES 理论上是有效的（需约 2^47 量级选择明文对），并非完全无效，只是复杂度高于穷举的实用门槛；D：差分分析需要攻击者选择明文并获取对应密文，属于选择明文攻击，不是唯密文攻击。","source":"Biham E., Shamir A.《Differential Cryptanalysis of the Data Encryption Standard》；GB/T 32907-2016 分组算法设计原理","keyPoint":"差分分析＝选择明文下追踪输入差分到输出差分的传播概率"},{"id":"第二部分专业题-一、密码学-多选题-1","no":1,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"雪崩效应指加密算法的一种理想属性，当输入发生最微小的改变时，也会导 致输出的剧变。下列密码算法中具有雪崩效应的是（ ）。","options":[{"key":"A","text":"RSA"},{"key":"B","text":"AES"},{"key":"C","text":"DES"},{"key":"D","text":"MD5"}],"answer":"BCD","analysis":"本题考查雪崩效应的适用范围。雪崩效应指输入哪怕只翻转一个比特，输出也会有约一半比特发生变化，是分组密码和杂凑算法扩散设计的核心指标。AES、DES 靠多轮代换与置换把输入差异扩散到整个分组，MD5 靠多轮压缩迭代混合消息位，三者都具备雪崩效应。RSA 的安全性建立在大整数分解困难性上，其模幂运算本身是确定的模算术，没有扩散层设计，故不属于具备雪崩效应的算法。","correctReason":"B、C、D 均通过多轮非线性变换＋线性扩散实现明文（或消息）任一比特的变化传播到整个输出块，符合雪崩效应定义。","wrongReason":"A：RSA 是数论型非对称算法，靠模幂与分解难题保证安全，不存在输入微变导致输出剧变的扩散结构，故不具有雪崩效应。","source":"《密码学导论》分组密码设计准则；GB/T 32907-2016（SM4）扩散设计思想","keyPoint":"雪崩效应看分组密码与杂凑算法；RSA 无此属性"},{"id":"第二部分专业题-一、密码学-多选题-2","no":2,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"杂凑函数是一种将任意长度的消息压缩到某一固定长度的消息摘要的函数。 以下关于杂凑函数的说法正确的是（ ）。","options":[{"key":"A","text":"输入x 可以为任意长度；输出数据串长度固定"},{"key":"B","text":"给定任何x，容易算出H（x）=h；而给出一个杂凑值h，很难找到一特定输入 x，使h=H（x）"},{"key":"C","text":"给出一个消息x，找出另一个消息y 使H（x）=H（y）是计算上不可行的"},{"key":"D","text":"可以找到两个消息x、y，使得H（x）=H（y）"}],"answer":"ABC","analysis":"本题考查杂凑函数的三大基本性质。一是压缩性：输入长度任意，输出定长；二是单向性（抗原像性）：正向易算、由摘要反推特定原文在计算上不可行；三是抗弱碰撞性：给定一个消息，找另一条消息与之摘要相同不可行。选项 D 说“可以找到两个消息 x、y 使 H(x)=H(y)”，即宣称可以人为构造碰撞，与抗强碰撞性要求相冲突，因此不选。注意区分：抗弱碰撞是“给定一个消息找另一个”，抗强碰撞是“自由找任意一对”。","correctReason":"A、B、C 分别对应压缩性、单向性和抗弱碰撞性，都是杂凑函数必须满足的基本性质。","wrongReason":"D：能够找到任意一对消息使杂凑值相同，等价于碰撞可构造，直接违反抗强碰撞性，正是杂凑函数要避免的。","source":"GB/T 32905-2016（SM3 密码杂凑算法）安全性质要求","keyPoint":"杂凑三性质：定长输出、单向、抗碰撞"},{"id":"第二部分专业题-一、密码学-多选题-3","no":3,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"某公司着手在偏远山区建设5G 基站，计划在加密模块中使用ZUC 算法，可 能是由于ZUC 包含下列哪些特点（ ）。","options":[{"key":"A","text":"硬件实现面积小，适合嵌入式设备"},{"key":"B","text":"抗量子计算攻击能力突出"},{"key":"C","text":"符合3GPP 标准"},{"key":"D","text":"可实现数字签名保证不可否认性"}],"answer":"AC","analysis":"本题考查 ZUC 算法的工程定位。ZUC 是我国自主设计的面向移动通信的流密码算法，2011 年被 3GPP 接纳为国际标准，用于 LTE/5G 的空口加密与完整性保护。它结构简洁，硬件实现面积小、功耗低、密钥流生成速度快，很适合基站这类嵌入式、高吞吐场景，所以 A、C 成立。ZUC 是 128 比特密钥的对称流密码，不提供数字签名功能，也不具备抵抗量子计算攻击的特殊能力，B、D 属于典型混淆项。","correctReason":"ZUC 面向移动通信设计并被 3GPP 采纳为标准算法，且硬件资源开销小，适合基站的嵌入式实现。","wrongReason":"B：ZUC 密钥仅 128 比特，面对 Grover 类量子搜索并不比同类对称算法更抗量子；D：流密码只做加解密，本身不提供数字签名与不可否认性，签名需由 SM2 等公钥算法完成。","source":"GM/T 0001-2012《祖冲之序列密码算法》；3GPP TS 33.401/33.501 采用 ZUC","keyPoint":"ZUC＝3GPP 流密码，硬件小、无签名、非抗量子"},{"id":"第二部分专业题-一、密码学-多选题-4","no":4,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"一个完整的密码体制，包括以下（ ）要素。","options":[{"key":"A","text":"明文空间"},{"key":"B","text":"密文空间"},{"key":"C","text":"数字签名"},{"key":"D","text":"密钥空间"}],"answer":"ABD","analysis":"本题考查密码体制的组成要素。一个完整密码体制由五元组构成：明文空间、密文空间、密钥空间，以及加密算法和解密算法。题干选项中明文空间、密文空间、密钥空间都在其中，故 A、B、D 正确。数字签名属于公钥密码的应用机制，用于鉴别与不可否认，并不是加解密体制的必要组成，属于跨领域干扰项。","correctReason":"密码体制＝明文空间＋密文空间＋密钥空间＋加密算法＋解密算法，前三项即 A、B、D。","wrongReason":"C：数字签名是公钥密码的一种应用功能，与加解密体制的组成要素不是同一层次的概念，不构成密码体制必要要素。","source":"《密码学导论》密码体制五元组定义；GB/T 39786-2021 密码技术应用框架","keyPoint":"密码体制五要素：两个空间＋密钥空间＋两套算法"},{"id":"第二部分专业题-一、密码学-多选题-5","no":5,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"Alice 发现，自己运维的信息系统ZUC 密钥流异常重复，为解决该问题，采 取的措施包含（ ）","options":[{"key":"A","text":"立即更换初始密钥"},{"key":"B","text":"检查IV 生成模块随机性"},{"key":"C","text":"改用CBC 模式的ZUC"},{"key":"D","text":"立即更换ZUC 算法的数字证书"}],"answer":"AB","analysis":"本题考查 ZUC 密钥流重复的成因与处置。ZUC 是流密码，密钥流由初始密钥和初始向量 IV 共同决定，同一对密钥与 IV 必然产生完全相同的密钥流。密钥流一旦重复，攻击者把两段密文异或即可消掉密钥流，直接恢复明文。因此处置要点有两条：一是立即停止使用该密钥、更换初始密钥；二是追查 IV 生成模块，检查其随机性或唯一性缺陷。换工作模式、换证书对流密码密钥流重复都无效，故 C、D 不选。","correctReason":"密钥流重复根因是密钥与 IV 复用，因此更换初始密钥并修复 IV 生成模块的随机性缺陷是对症措施。","wrongReason":"C：ZUC 是流密码，没有 CBC 这类分组工作模式，更换模式解决不了密钥流重复；D：ZUC 是算法而非证书体系，算法本身不使用数字证书，更换证书无意义。","source":"GM/T 0001-2012《祖冲之序列密码算法》密钥与 IV 使用要求","keyPoint":"流密码密钥流重复＝密钥/IV 复用，须换密钥并修 IV"},{"id":"第二部分专业题-一、密码学-多选题-6","no":6,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"下列可以防止重放攻击的方式有（ ）。","options":[{"key":"A","text":"时间戳"},{"key":"B","text":"鉴别方验证序列号没有重复"},{"key":"C","text":"采用“挑战-响应”机制"},{"key":"D","text":"数字签名"}],"answer":"ABC","analysis":"本题考查抗重放攻击的常用机制。重放攻击是攻击者把截获的合法报文原样再发一次，因此防御的关键是让接收方能够判断报文的新鲜性。时间戳靠时间窗口排除过期报文，序列号靠接收方核查是否已出现过，挑战—响应靠每次会话由鉴别方给出不可预测的随机挑战，三者都能有效防重放。数字签名只解决来源真实与完整性、不可否认，不能阻止把签名报文原样重发，故 D 不选。","correctReason":"时间戳、序列号去重、挑战—响应都属于新鲜性机制，能让接收方识别并拒绝重复报文。","wrongReason":"D：数字签名保证来源与完整性，但签名报文被原样重放时验证仍会通过，单独使用无法防重放。","source":"GB/T 15843 系列实体鉴别标准中的时间戳、序列号与挑战—响应机制","keyPoint":"防重放靠新鲜性：时间戳、序列号、挑战—响应"},{"id":"第二部分专业题-一、密码学-多选题-7","no":7,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"在分组密码设计中用到扩散和混淆的理论。理想的扩散是（ ）。","options":[{"key":"A","text":"明文的一位只影响密文对应的一位"},{"key":"B","text":"让密文中的每一位受明文中每一位的影响"},{"key":"C","text":"让明文中的每一位影响密文中的所有位。"},{"key":"D","text":"一位明文影响对应位置的密文和后续密文"}],"answer":"BC","analysis":"本题考查扩散与混淆两个设计准则的区别。扩散的目标是让明文与密文之间的统计关系尽可能复杂：明文中的每一位都应影响密文中的所有位，反过来密文中的每一位也应受明文中每一位的影响，B、C 正是这一双向表述。A 说“一位只影响对应一位”、D 说“只影响对应位置和后续密文”，都属于局部影响，达不到扩散要求。另需注意，使密钥与密文关系复杂化的是混淆，不要与扩散混淆。","correctReason":"理想扩散要求明文与密文的每一位相互影响，即明文任一位影响密文全部位，密文任一位受明文全部位影响。","wrongReason":"A：明文一位只影响密文对应一位，是逐位独立的弱设计；D：影响只局限在对应位置及后续位置，属于局部扩散，都不满足全覆盖扩散。","source":"《密码学导论》Shannon 扩散与混淆准则；GB/T 32907-2016 轮函数扩散设计","keyPoint":"扩散＝明文与密文每一位相互影响；混淆针对密钥"},{"id":"第二部分专业题-一、密码学-多选题-8","no":8,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"对DES 的三种主要攻击方法包括（ ）。","options":[{"key":"A","text":"暴力攻击"},{"key":"B","text":"生日攻击"},{"key":"C","text":"差分密码分析"},{"key":"D","text":"线性密码分析"}],"answer":"ACD","analysis":"本题考查针对 DES 的主要攻击手段。DES 密钥只有 56 比特，穷举搜索在算力提升后变得可行，是最著名的现实威胁；差分密码分析和线性密码分析是分组密码两类经典的分析方法，分别利用明密文对的差分传播规律和明密文之间的线性逼近关系来恢复密钥。生日攻击针对的是杂凑函数的碰撞概率，与 DES 这类分组密码的攻击路径无关，属于干扰项。","correctReason":"穷举攻击针对 56 比特短密钥，差分与线性密码分析是针对分组密码结构的经典分析方法，三者共同构成对 DES 的主要攻击。","wrongReason":"B：生日攻击利用生日悖论寻找杂凑碰撞，攻击对象是杂凑函数，不适用于 DES 的密钥恢复。","source":"《密码学导论》DES 安全性分析；GM/T 0002-2012（SMS4）抗差分与线性分析设计要求","keyPoint":"DES 三大攻击：穷举、差分分析、线性分析"},{"id":"第二部分专业题-一、密码学-多选题-9","no":9,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"以下加密算法中不属于古典加密算法的是（ ）。","options":[{"key":"A","text":"Caesar 密码"},{"key":"B","text":"DES 算法"},{"key":"C","text":"IDEA 算法"},{"key":"D","text":"Diffie-Hellman 算法"}],"answer":"BCD","analysis":"本题考查古典密码与现代密码的界限。古典密码指依靠手工或机械实现的替换、移位类密码，凯撒密码是最典型的移位密码，属于古典密码。DES 是 1977 年的分组密码标准，IDEA 是分组密码算法，Diffie-Hellman 是 1976 年提出的公钥密钥交换协议，三者都是现代密码学的产物，不属于古典加密算法。题干问的是“不属于”，故选 B、C、D。","correctReason":"DES、IDEA、Diffie-Hellman 均为现代密码学算法（分组密码与公钥密码），不属于古典密码范畴。","wrongReason":"A：凯撒密码是典型的移位替换古典密码，正是古典加密算法的代表，与题干“不属于古典加密算法”的要求相反。","source":"《密码学导论》古典密码与现代密码发展史","keyPoint":"凯撒＝古典；DES/IDEA/DH＝现代密码"},{"id":"第二部分专业题-一、密码学-多选题-10","no":10,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"基于格理论密码是重要的后量子密码技术之一。下述属于格理论困难问题的 是（ ）。","options":[{"key":"A","text":"最短向量问题 （ShortestVectorProblem， SVP）"},{"key":"B","text":"最近向量问题，ClosestVectorProblem）"},{"key":"C","text":"容错学习（LearningWithErrors， LWE）"},{"key":"D","text":"最小整数解（SmallIntegerSolution）"}],"answer":"ABCD","analysis":"本题考查格理论后量子密码所依赖的困难问题。格密码的安全性主要建立在格上困难问题之上：SVP 求格中最短非零向量，CVP 求距目标点最近的格点，LWE 是在带噪声的线性方程组中求解秘密向量，SIS 是求满足条件的短非零整数解。四个问题都被广泛研究，并被普遍认为能抵抗量子算法攻击，是格密码方案构造的基础，因此全选。","correctReason":"SVP、CVP、LWE、SIS 都是格上公认的计算困难问题，构成格理论后量子密码的安全性基础。","wrongReason":"本题四项均为正确项，无错误选项可排除：A（SVP）、B（CVP）是格上几何型难题，C（LWE）、D（SIS）是格上平均情形难题，都属格理论困难问题。易错点在于曾把“容错学习”“最小整数解”误当作非格问题而漏选。","source":"《后量子密码算法设计准则与评估》格密码困难问题；GB/T 42571 系列后量子密码相关标准","keyPoint":"格上难题：SVP、CVP、LWE、SIS，四项全对"},{"id":"第二部分专业题-一、密码学-多选题-11","no":11,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"一个密码系统的安全性包含哪些？（ ）","options":[{"key":"A","text":"加密安全性"},{"key":"B","text":"解密安全性"},{"key":"C","text":"可证明安全性"},{"key":"D","text":"计算安全性"}],"answer":"CD","analysis":"本题考查密码系统安全性的分类方式。安全性通常按“如何论证”来划分：可证明安全性是指通过归约证明攻破方案等价于解决某个公认困难问题，从而使安全性有理论保证；计算安全性是指以现有最优攻击算法所需的计算资源（时间、存储、数据量）衡量，攻击代价超出攻击者能力即认为安全。所谓“加密安全性”“解密安全性”不是密码学的标准安全性分类，属于生造选项。","correctReason":"密码系统的安全性按论证方式分为可证明安全性和计算安全性两类，C、D 即这两种标准表述。","wrongReason":"A：加密安全性不是标准的安全性分类概念；B：解密安全性同样不是标准分类，二者属于生造术语。","source":"《密码学导论》可证明安全与计算安全概念","keyPoint":"安全性两分法：可证明安全性、计算安全性"},{"id":"第二部分专业题-一、密码学-多选题-12","no":12,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"量子计算中的Shor 算法，对哪些传统密码算法安全性产生较大威胁（ ）。","options":[{"key":"A","text":"RSA"},{"key":"B","text":"DSA"},{"key":"C","text":"AES"},{"key":"D","text":"SM3"}],"answer":"AB","analysis":"本题考查 Shor 算法对密码体制的威胁范围。Shor 算法能在多项式时间内求解大整数分解和离散对数问题，而 RSA 的安全性依赖大整数分解，DSA 的安全性依赖有限域离散对数，因此在可用的量子计算机面前两者都会被攻破。AES 是对称分组密码、SM3 是杂凑算法，量子计算对它们主要构成 Grover 搜索带来的平方级加速（相当于密钥长度减半），并不构成 Shor 算法式的根本性威胁，故 C、D 不选。","correctReason":"Shor 算法可高效求解大整数分解与离散对数，而 RSA、DSA 的安全基础正是这两类问题，故受严重威胁。","wrongReason":"C：AES 是对称算法，只受 Grover 算法平方级加速影响，可通过加长密钥应对；D：SM3 是杂凑算法，主要面对量子碰撞搜索的平方根加速，Shor 算法对其无直接威胁。","source":"《密码学导论》Shor 算法与后量子密码；GB/T 39786-2021 密码算法选用要求","keyPoint":"Shor 破分解与离散对数：威胁 RSA、DSA；对称算法不怕"},{"id":"第二部分专业题-一、密码学-多选题-13","no":13,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"在我国商用密码中，密码系统通常由明文、密文、加密算法、解密算法和密 钥五部分组成，其中可以公开的部分是（ ）。","options":[{"key":"A","text":"加密算法"},{"key":"B","text":"解密算法"},{"key":"C","text":"密文"},{"key":"D","text":"密钥"}],"answer":"ABC","analysis":"本题考查柯克霍夫原则在商用密码中的体现。密码系统的安全性应完全依赖于密钥的保密，而不应依赖算法本身的保密：加密算法与解密算法在标准中公开发布，任何人都可以实现和验证；密文经信道传输本身即为公开可见。只有密钥必须严格保密，一旦泄露系统即失去安全性。因此可公开部分是 A、B、C，密钥不可公开。","correctReason":"按柯克霍夫原则，算法与密文均可公开，安全性只系于密钥保密，故 A、B、C 可公开。","wrongReason":"D：密钥是密码系统唯一必须保密的核心，密钥泄露等同于系统被攻破，不属于可公开部分。","source":"《中华人民共和国密码法》商用密码技术公开与密钥管理要求；GB/T 39786-2021 密钥管理","keyPoint":"算法与密文可公开，密钥必须保密"},{"id":"第二部分专业题-一、密码学-多选题-14","no":14,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"与量子密码相对应，经典密码学包括（ ）。","options":[{"key":"A","text":"密码编码学"},{"key":"B","text":"密码分析学"},{"key":"C","text":"后（抗）量子密码学"},{"key":"D","text":"量子密码"}],"answer":"AB","analysis":"本题考查密码学的学科划分。经典密码学（传统密码学）包含两个相互对立又相互促进的分支：密码编码学负责设计与实现安全的密码体制，密码分析学负责研究破译与分析方法以评估安全性。量子密码是利用量子力学原理（如量子密钥分发）实现密钥协商与检测窃听的新方向，后（抗）量子密码学则是为抵御量子计算攻击而设计的算法体系，两者都不属于经典密码学的组成部分，故 C、D 不选。","correctReason":"经典密码学由密码编码学和密码分析学两大分支构成，二者分别对应“造锁”与“开锁”。","wrongReason":"C：后量子密码学是应对量子计算威胁的新兴算法体系，不属于经典密码学；D：量子密码基于量子物理原理，与经典密码学是并列的不同技术路线。","source":"《密码学导论》密码学学科体系划分","keyPoint":"经典密码学＝密码编码学＋密码分析学"},{"id":"第二部分专业题-一、密码学-多选题-15","no":15,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"下列哪些参数决定了穷举攻击所消耗的时间（ ）。","options":[{"key":"A","text":"密钥空间"},{"key":"B","text":"密钥长度"},{"key":"C","text":"主机运算速度"},{"key":"D","text":"主机显存容量"}],"answer":"ABC","analysis":"本题考查穷举攻击耗时的影响因素。穷举攻击的时间等于需要尝试的密钥数量除以单位时间的尝试速度：密钥空间（长度）决定了总尝试量，密钥越长、空间越大，穷举代价指数级上升；主机运算速度决定每秒可尝试的次数，直接决定总耗时。主机显存容量只影响存储与并行调度的规模，并不决定穷举一轮所需的计算次数，与耗时无直接关系，故 D 不选。","correctReason":"穷举耗时＝密钥空间大小÷单位时间尝试次数，因此密钥空间、密钥长度与主机运算速度共同决定耗时。","wrongReason":"D：主机显存容量影响存储与并行规模，不直接决定穷举所需的计算次数与速度，不是决定因素。","source":"《密码学导论》穷举攻击复杂度分析；GB/T 39786-2021 密码算法强度要求","keyPoint":"穷举耗时看密钥空间（长度）与运算速度"},{"id":"第二部分专业题-一、密码学-多选题-16","no":16,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"密码设备的各组成部件既可以在多个不同芯片上实现，也可以在单芯片上实 现。而模块中常见的属于单芯片构成的密码设备包括以下哪些（ ）。","options":[{"key":"A","text":"智能卡"},{"key":"B","text":"USBKey"},{"key":"C","text":"密码加速卡"},{"key":"D","text":"安全芯片"}],"answer":"ABCD","analysis":"本题考查单芯片密码设备的常见形态。单芯片密码设备指把密码运算、密钥存储与接口逻辑集成在一块芯片内实现的设备，其优点是体积小、成本低、密钥不易被外部探测。智能卡、USB Key、密码加速卡和安全芯片都属于典型的单芯片或片上系统实现形态，均在题目所述范围内，因此四项全选。注意不要与多芯片板卡式密码机等形态混淆。","correctReason":"智能卡、USB Key、密码加速卡、安全芯片都把密码运算与密钥保护集成在单芯片中实现，均属单芯片构成的密码设备。","wrongReason":"本题四项均为正确项，无错误选项可排除：A 智能卡、B USB Key、C 密码加速卡、D 安全芯片都是模块中常见的单芯片（片上系统）密码设备形态。易错点是把密码加速卡误判为必须多芯片板卡实现而漏选。","source":"GM/T 0028-2014《密码模块安全技术要求》密码模块物理形态与安全等级划分","keyPoint":"单芯片密码设备：智能卡、USB Key、加速卡、安全芯片"},{"id":"第二部分专业题-一、密码学-多选题-17","no":17,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"密码算法主要分为三类：对称密码算法、 非对称密码算法、密码杂凑算法。 以下哪两种密码算法属于同一类密码体制（ ）。","options":[{"key":"A","text":"RC4 和RC5"},{"key":"B","text":"RSA 和DSA"},{"key":"C","text":"SM4 和AES"},{"key":"D","text":"SM2 和SM9"}],"answer":"ABCD","analysis":"本题考查密码算法的体制归类，题干问哪些组合属于同一类。RC4 是流密码、RC5 是分组密码，两者同属对称密码算法；RSA 与 DSA 都是基于数论难题的公钥算法，同属非对称密码；SM4 与 AES 都是 128 比特分组的对称分组密码；SM2 与 SM9 都是我国自主设计的非对称（公钥）密码算法。四组配对在体制分类上都一致，因此全选。注意各组内部的具体构造差异不影响其体制归属。","correctReason":"四组配对分别同属对称密码或非对称密码体制：RC4／RC5 对称，RSA／DSA 非对称，SM4／AES 对称，SM2／SM9 非对称。","wrongReason":"本题四项均为正确项，无错误选项可排除：A RC4 与 RC5 同属对称密码，B RSA 与 DSA 同属非对称密码，C SM4 与 AES 同属对称分组密码，D SM2 与 SM9 同属非对称密码。易错点是把流密码与分组密码、签名算法与加密算法对立起来，误认为不算同一体制。","source":"GM/T 0002-2012（SMS4）、GM/T 0044-2016（SM9）、GM/T 0006-2012（SM2 密码算法使用规范）算法分类","keyPoint":"同类配对：RC4/RC5、RSA/DSA、SM4/AES、SM2/SM9"},{"id":"第二部分专业题-一、密码学-多选题-18","no":18,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"杂凑函数是一种将任意长度的消息压缩到某一固定长度的消息摘要的函数。 以下关于杂凑函数的说法正确的是（ ）。","options":[{"key":"A","text":"输入x 可以为任意长度；输出数据串长度固定"},{"key":"B","text":"给定任何x，容易算出H（x）=h；而给出一个杂凑值h，很难找到一个特定输 入 x，使h=H（x）"},{"key":"C","text":"给出一个消息x，找出另一个消息y 使H（x）=H（y）是计算上不可行的"},{"key":"D","text":"可以找到两个消息x、y，使得H（x）=H（y）"}],"answer":"ABC","analysis":"本题与第 2 题同源，考查杂凑函数的基本性质。压缩性要求输入任意长度而输出定长；单向性要求由摘要无法反推出原像；抗弱碰撞性要求给定一个消息时找不到第二条消息与之摘要相同。这三点分别对应 A、B、C。D 项宣称可以找到两个消息使杂凑值相同，等于承认碰撞可被构造，与抗强碰撞性相悖，因此不选。做题时关键是分清“碰撞客观存在”与“可在计算上找到”。","correctReason":"A、B、C 依次是杂凑函数的压缩性、单向性与抗弱碰撞性，均为其必须满足的基本要求。","wrongReason":"D：能找到任意一对消息使杂凑值相同，即碰撞可构造，违反抗强碰撞性，正是杂凑函数设计要排除的情形。","source":"GB/T 32905-2016（SM3 密码杂凑算法）安全性质要求","keyPoint":"杂凑三性质：定长输出、单向性、抗碰撞性"},{"id":"第二部分专业题-一、密码学-多选题-19","no":19,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"以下关于密钥的描述，正确的是（ ）。","options":[{"key":"A","text":"在消息认证码中，发送者和接收者使用共享的密钥来进行认证"},{"key":"B","text":"在数字签名中，签名的生成和验证使用不同的密钥"},{"key":"C","text":"消息认证码所使用的密钥，是用于认证的密钥"},{"key":"D","text":"对称密码和非对称加密的密钥都可以用于机密性保护"}],"answer":"ABCD","analysis":"本题考查密钥在不同密码机制中的使用方式。消息认证码基于对称密钥，收发双方共享同一密钥对消息计算认证码，因而该密钥是专用于认证的密钥，A、C 成立。数字签名用私钥签名、公钥验证，生成与验证使用不同密钥，B 成立。对称密码用同一密钥加解密、非对称密码用公钥加密私钥解密，两者都能提供机密性保护，D 成立。四项均正确。","correctReason":"A、B、C、D 分别正确描述了 MAC 的共享密钥认证、签名的双密钥机制、MAC 密钥的认证用途以及对称／非对称密码均可保护机密性。","wrongReason":"本题四项均为正确项，无错误选项可排除：A 与 C 描述的正是 MAC 收发共享认证密钥的机制，B 描述签名的双密钥特征，D 描述对称与非对称两类密码的机密性用途。易错点是把 MAC 密钥误当作加密密钥，或误以为对称密码不用于机密性保护。","source":"GB/T 15852 系列消息认证码标准；GB/T 32918 系列（SM2）数字签名要求","keyPoint":"MAC 靠共享认证密钥；签名双密钥；两类密码都可保机密性"},{"id":"第二部分专业题-一、密码学-多选题-20","no":20,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"在计算复杂性理论中，下列属于NP 问题的是（ ）。","options":[{"key":"A","text":"背包问题"},{"key":"B","text":"整数分解问题"},{"key":"C","text":"矩阵覆盖问题"},{"key":"D","text":"陪集重量问题"}],"answer":"ABCD","analysis":"本题考查计算复杂性理论中的 NP 类问题。NP 类指解的验证可在多项式时间内完成的判定问题（等价地，可用非确定图灵机在多项式时间内求解）。背包问题、整数分解问题、矩阵覆盖问题、陪集重量问题都属于 NP 问题，其中若干还是公认的困难问题，正是 Merkle-Hellman 背包密码、RSA、纠错码密码等方案的安全基础，因此四项全选。","correctReason":"背包问题、整数分解、矩阵覆盖、陪集重量问题的解都能在多项式时间内验证，均属于 NP 类问题。","wrongReason":"本题四项均为正确项，无错误选项可排除：A 背包问题为 NP 完全问题，B 整数分解属 NP（其判定形式还在 NP∩co-NP 中），C 矩阵覆盖为 NP 完全问题，D 陪集重量问题是纠错码密码所依赖的 NP 困难问题。易错点是因整数分解“并非 NP 完全”而误判其不属于 NP。","source":"《密码学导论》计算复杂性基础与 NP 问题；GB/T 42571 系列后量子密码困难问题基础","keyPoint":"NP＝解可多项式时间验证；背包、分解、矩阵覆盖、陪集重量均属之"},{"id":"第二部分专业题-一、密码学-多选题-21","no":21,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"以下关于完整性保护的说法错误的有（ ）。","options":[{"key":"A","text":"在特殊应用中，在确保杂凑值无法被修改时，也可以单纯采用杂凑算法保护数 据的完整性"},{"key":"B","text":"基于公钥密码技术的数字签名可以防止敌手对消息进行篡改，但不能防止接收 者对消息进行伪造"},{"key":"C","text":"基于对称密码或者杂凑算法的完整性保护机制既能确保接收者接收消息之前 的消息完整性，也能防止接收者对消息的伪造"},{"key":"D","text":"HMAC 可以避免单独使用杂凑算法可能会遭受中间人攻击的弊端"}],"answer":"BC","analysis":"本题考查完整性保护机制的能力边界。数字签名由私钥生成、公钥验证，既能防篡改，也能防接收者伪造并支持不可否认，因此 B 说“不能防止接收者伪造”是错的。基于对称密码或杂凑算法的机制中收发双方共享同一密钥，接收者自己也能生成合法认证值，无法防其伪造与抵赖，因此 C 说“也能防止接收者伪造”也是错的。A、D 表述正确：杂凑值本身受保护时可单用杂凑算法，HMAC 引入密钥可避免裸杂凑易受中间人攻击。题干问错误的，故选 B、C。","correctReason":"B、C 都错在对机制能力的高估或低估：签名能防接收者伪造，而对称／杂凑类机制恰恰不能防接收者伪造。","wrongReason":"B：数字签名以私钥唯一持有为前提，接收者无法伪造签名，该说法错误；C：对称或杂凑机制收发双方共享密钥，接收者可自行生成认证值，不能防其伪造，该说法错误。","source":"GB/T 15852 系列消息认证码标准；GB/T 32918 系列（SM2）数字签名要求","keyPoint":"签名可防双方伪造；对称 MAC 防不了接收者伪造"},{"id":"第二部分专业题-一、密码学-多选题-22","no":22,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"以下场景利用了密码的不可否认功能的是（ ）。","options":[{"key":"A","text":"网银用户对交易信息进行签名"},{"key":"B","text":"电子证照"},{"key":"C","text":"服务端对挑战值进行签名"},{"key":"D","text":"SSL 协议中对会话计算MAC"}],"answer":"AB","analysis":"本题考查不可否认功能的典型应用。不可否认性由数字签名提供，其含义是签名者事后不能否认自己签发的数据，验证方也不能否认验证结果。网银用户对交易信息签名，事后无法否认该笔交易；电子证照由签发机构签名，可证明证照来源与内容，两者都体现不可否认，A、B 正确。服务端对挑战值签名属于身份鉴别，SSL 中对会话计算 MAC 属于完整性保护，二者都不产生不可否认的证据效力，故 C、D 不选。","correctReason":"网银交易签名与电子证照都以签名作为事后追责与举证依据，正是不可否认功能的直接应用。","wrongReason":"C：对挑战值签名用于证明服务端身份，属鉴别用途；D：SSL 会话 MAC 仅保证传输完整性，依赖共享密钥，不具备不可否认性。","source":"《中华人民共和国电子签名法》可靠电子签名与数据电文效力规定；GB/T 32918 系列（SM2）数字签名","keyPoint":"不可否认靠数字签名：交易签名、电子证照"},{"id":"第二部分专业题-一、密码学-多选题-23","no":23,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"公开密钥加密（public-keycryptography）也称为非对称密钥加密（asymmetric cryptography），是一种密码学算法类型。下列算法属于公钥密码算法的是（ ）。","options":[{"key":"A","text":"RSA 算法"},{"key":"B","text":"ElGamal 算法"},{"key":"C","text":"AES 算法"},{"key":"D","text":"ECC（椭圆曲线密码）算法"}],"answer":"ABD","analysis":"本题考查公钥密码算法的识别。RSA 基于大整数分解难题，ElGamal 基于有限域离散对数难题，ECC 基于椭圆曲线离散对数难题，三者都使用公钥／私钥配对，属于公钥密码算法。AES 是 128 比特分组的对称分组密码，加解密使用同一密钥，与公钥体制的使用方式根本不同，故不属于。因此选 A、B、D。","correctReason":"RSA、ElGamal、ECC 都基于数论或代数难题、采用公私钥配对，是标准公钥密码算法。","wrongReason":"C：AES 是对称分组密码，加密解密共用同一密钥，不具备公私钥分离特征，不属于公钥密码算法。","source":"GM/T 0006-2012《SM2 密码算法使用规范》；GB/T 32918 系列（SM2）与公钥密码分类","keyPoint":"公钥算法：RSA、ElGamal、ECC；AES 是对称算法"},{"id":"第二部分专业题-一、密码学-多选题-24","no":24,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"一个有新鲜性的值是指这个值是刚产生的，而不是重放的。常用的保证新鲜 性的机制有（ ）。","options":[{"key":"A","text":"时间戳"},{"key":"B","text":"一次性随机数"},{"key":"C","text":"计数器"},{"key":"D","text":"将时间戳和计数器结合使用的方法"}],"answer":"ABCD","analysis":"本题考查保证新鲜性的常用机制。新鲜性指该值是新近产生而非被重放的。时间戳以当前时间为依据判断报文是否在有效窗口内；一次性随机数每次取值不同，接收方可通过查重拒绝重复值；计数器随消息单调递增，接收方只接受更大的计数值；把时间戳与计数器结合使用，既能避免计数器失步，又能防止时间戳被预先囤积，进一步扩大防护范围。四者都是工程中常用的新鲜性机制，故选全项。","correctReason":"时间戳、一次性随机数、计数器及二者结合的方法都能保证取值新近且不重复，是标准的新鲜性机制。","wrongReason":"本题四项均为正确项，无错误选项可排除：A 时间戳、B 一次性随机数、C 计数器都是经典新鲜性机制，D 时间戳与计数器结合可互补短板、扩大适用范围。易错点是误认为“结合使用”只是组合而非独立机制，导致漏选 D。","source":"GB/T 15843 系列实体鉴别标准中的新鲜性机制","keyPoint":"新鲜性四招：时间戳、随机数、计数器、二者结合"},{"id":"第二部分专业题-一、密码学-多选题-25","no":25,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"下列方法可用于对消息认证码攻击的是（ ）。","options":[{"key":"A","text":"重放攻击"},{"key":"B","text":"密钥推测攻击"},{"key":"C","text":"已知明文攻击"},{"key":"D","text":"选择密文攻击"}],"answer":"AB","analysis":"本题考查针对消息认证码的攻击方式。MAC 用于验证消息来源与完整性，攻击者可以在不知道密钥的情况下截获合法报文并原样重发，即重放攻击，这是 MAC 保护机制必须配合新鲜性才能抵御的弱点；也可以尝试通过大量已知的“消息—认证码”对来恢复密钥，即密钥推测攻击。已知明文攻击和选择密文攻击都属于针对加密算法的攻击手段，由于 MAC 本身不提供加密、不存在解密接口，故不适用于 MAC，本题选 A、B。","correctReason":"重放与密钥推测分别针对 MAC 的新鲜性缺失和密钥保密性，是两类典型的 MAC 攻击方式。","wrongReason":"C：已知明文攻击针对加密算法的密钥恢复；D：选择密文攻击依赖解密接口，MAC 不含解密过程，二者均不适用于攻击 MAC。","source":"GB/T 15852 系列消息认证码标准安全性要求","keyPoint":"攻击 MAC 主要靠重放与密钥推测；已知明文、选择密文攻击针对加密"},{"id":"第二部分专业题-一、密码学-多选题-26","no":26,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"公钥密码体制使用不同的加密密钥和解密密钥。以下密码算法是公钥密码体 制的有（ ）。","options":[{"key":"A","text":"SM2"},{"key":"B","text":"SM4"},{"key":"C","text":"Rabin"},{"key":"D","text":"RSA"}],"answer":"ACD","analysis":"本题考查具体算法的体制归属。SM2 是我国自主设计的椭圆曲线公钥密码算法，支持加密与签名；Rabin 是 RSA 的变体，其安全性等价于大整数分解难题；RSA 以分解难题为基础，三者都采用公私钥配对，属于公钥密码体制。SM4 是 128 比特分组的对称分组密码，密钥只有一把，不具备公私钥分离特征，故不选。答案 A、C、D。","correctReason":"SM2、Rabin、RSA 都基于数论难题并采用公钥／私钥分离的机制，符合公钥密码体制定义。","wrongReason":"B：SM4 是我国自主的对称分组密码算法，加解密使用同一密钥，不属于公钥密码体制。","source":"GM/T 0006-2012《SM2 密码算法使用规范》；GB/T 32907-2016（SM4 分组密码算法）","keyPoint":"公钥：SM2、Rabin、RSA；SM4 是对称分组密码"},{"id":"第二部分专业题-一、密码学-多选题-27","no":27,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"磁盘加密要求密文和初始向量等的总长度不会超过原有的明文长度，以下分 组工作模式适合用于磁盘加密的是（ ）。","options":[{"key":"A","text":"XTS"},{"key":"B","text":"HCTR"},{"key":"C","text":"CTR"},{"key":"D","text":"ECB"}],"answer":"ABC","analysis":"本题考查磁盘加密对分组工作模式的要求。磁盘加密要求密文与初始向量总长不超过原明文长度（即不作长度扩张），否则无法按扇区就地写回。XTS 专为存储加密设计，采用可调加密与密文窃取，长度保持且能抵抗同一位置重复密文分析；HCTR 是宽块可调加密模式，同样长度保持；CTR 属流式模式，密文与明文等长且支持随机访问。ECB 虽不扩张长度，但相同明文块产生相同密文块，会泄露明文结构且易被重排篡改，不适合磁盘加密，故不选 D。","correctReason":"XTS、HCTR、CTR 都能在保持长度不变的前提下提供加密，并支持按扇区随机访问，满足磁盘加密需求。","wrongReason":"D：ECB 逐块独立加密，相同明文块得相同密文块，会暴露明文模式且难以抵抗块重排与篡改，不适合磁盘加密。","source":"GB/T 17964-2021《信息安全技术 分组密码算法的工作模式》；GB/T 39786-2021 存储加密要求","keyPoint":"磁盘加密选长度保持模式：XTS、HCTR、CTR，忌用 ECB"},{"id":"第二部分专业题-一、密码学-多选题-28","no":28,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"以下（ ）算法可以安全地为变长的数据生成MAC。","options":[{"key":"A","text":"CBC-MAC"},{"key":"B","text":"HMAC"},{"key":"C","text":"GCM"},{"key":"D","text":"CMAC"}],"answer":"BCD","analysis":"本题考查各类 MAC 算法对变长数据的适用性。HMAC 以带密钥的杂凑函数为基础，对任意长度消息都能安全生成 MAC；GCM 是带关联数据的认证加密模式，同时输出密文与认证标签，可处理变长输入；CMAC 通过子密钥派生与填充改进了 CBC-MAC，克服了长度扩展问题，适用于变长消息。而基础版 CBC-MAC 对变长消息不安全：把两个已知 MAC 的报文拼接即可伪造出第三条报文的合法 MAC，因此对变长数据不适用，故不选 A。","correctReason":"HMAC、GCM、CMAC 都能对任意长度消息安全生成认证码，CMAC 正是为修正 CBC-MAC 的变长缺陷而设计。","wrongReason":"A：基础 CBC-MAC 只对固定长度消息安全，对变长消息存在长度扩展／拼接伪造风险，不能安全地为变长数据生成 MAC。","source":"GB/T 15852 系列消息认证码标准；GB/T 17964-2021《信息安全技术 分组密码算法的工作模式》（CMAC、GCM）","keyPoint":"变长 MAC 选 HMAC、CMAC、GCM；裸 CBC-MAC 只对定长安全"},{"id":"第二部分专业题-一、密码学-多选题-29","no":29,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"下列关于分组密码算法的设计的说法正确的是（ ）。","options":[{"key":"A","text":"分组长度应足够大，以防止明文被穷举攻击"},{"key":"B","text":"密钥空间应足够大，尽可能消除弱密钥"},{"key":"C","text":"密钥越长，安全性越强，因此，设计的密钥长度应该很长"},{"key":"D","text":"由密钥确定的算法要足够复杂，要能抵抗各种已知的攻击"}],"answer":"ABD","analysis":"本题考查分组密码的设计准则。分组长度应足够大，否则攻击者可通过预置明文表等手段实施穷举，A 正确；密钥空间应足够大并尽可能消除弱密钥与半弱密钥，避免有效密钥量被削弱，B 正确；由密钥确定的算法必须足够复杂，能够抵抗差分分析、线性分析等已知攻击，D 正确。C 说“密钥越长越好、应该设计得很长”并不成立：安全性还受分组长度与工作模式制约，而密钥过长会显著增加加解密开销与密钥管理难度，设计需要在安全与效率间取得平衡，故不选 C。","correctReason":"分组长度足够大、密钥空间足够大且消除弱密钥、算法足够复杂以抗已知攻击，是分组密码的基本设计准则。","wrongReason":"C：密钥长度并非越长越好，除安全性外还要权衡运算效率、分组长度与密钥管理成本，不能无限制加长。","source":"GB/T 32907-2016《信息安全技术 SM4 分组密码算法》设计准则；GM/T 0002-2012（SMS4）","keyPoint":"分组密码设计：分组够大、密钥空间大且无弱密钥、算法够复杂"},{"id":"第二部分专业题-一、密码学-多选题-30","no":30,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"在SM4 算法的线性变换中，循环左移运算的移位数包括（ ）。","options":[{"key":"A","text":"2"},{"key":"B","text":"10"},{"key":"C","text":"18"},{"key":"D","text":"24"}],"answer":"ABCD","analysis":"本题考查 SM4 线性变换 L 的参数。SM4 轮函数由非线性变换 τ 与线性变换 L 复合而成，L 对 32 比特字做四次循环左移后异或：L(B)=B⊕(B<<<2)⊕(B<<<10)⊕(B<<<18)⊕(B<<<24)，移位数即 2、10、18、24。该设计保证每比特差异在若干轮内充分扩散，也是 SM4 与 AES 的明显区别（AES 的 MixColumns 用字节移位与有限域乘法）。四个选项都是实际移位数，故选全项。","correctReason":"SM4 线性变换 L 固定采用循环左移 2、10、18、24 位后与自身异或，四个数都是该变换的实际移位数。","wrongReason":"本题四项均为正确项，无错误选项可排除：A(2)、B(10)、C(18)、D(24) 正是 SM4 线性变换 L(B)=B⊕(B<<<2)⊕(B<<<10)⊕(B<<<18)⊕(B<<<24) 中的四个移位数。易错点是把 SM4 的移位数与 AES ShiftRows 的字节偏移或 SM3 的消息扩展参数混淆。","source":"GB/T 32907-2016《信息安全技术 SM4 分组密码算法》第 6 章轮函数与线性变换；GM/T 0002-2012（SMS4）","keyPoint":"SM4 线性变换移位数：2、10、18、24"},{"id":"第二部分专业题-一、密码学-多选题-31","no":31,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"SM4 算法轮函数中的合成置换T 由下述选项中哪几个（ ）复合而成。","options":[{"key":"A","text":"扩展置换"},{"key":"B","text":"初始置换"},{"key":"C","text":"非线性变换"},{"key":"D","text":"线性变换"}],"answer":"CD","analysis":"本题考查 SM4 轮函数中合成置换 T 的组成。SM4 的轮函数为 X4 = X0 ⊕ T(X1⊕X2⊕X3⊕rk)，其中 T 由非线性变换 τ（4 个 S 盒并行替换）和线性变换 L（循环移位与异或）复合而成。扩展置换、初始置换都是 DES 的结构部件，与 SM4 无关。记住口诀「T＝τ 加 L，先非线性后线性」，就不会与 DES 的 E 扩展混淆。","correctReason":"SM4 的合成置换 T 就是「非线性变换 τ ＋ 线性变换 L」的复合，即 T(·)=L(τ(·))，故 C、D 正确。","wrongReason":"A：扩展置换是 DES 轮函数把 32 位右半扩展为 48 位的部件，SM4 没有该步骤；B：初始置换 IP 属于 DES 的预处理，SM4 直接对 128 位明文分组分组运算，不做初始置换。","source":"GM/T 0002-2012《SM4 分组密码算法》5.3 节","keyPoint":"SM4 的 T 置换＝非线性变换 τ（S 盒）＋线性变换 L"},{"id":"第二部分专业题-一、密码学-多选题-32","no":32,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"下列攻击形式中，属于主动攻击的是（ ）。","options":[{"key":"A","text":"伪造"},{"key":"B","text":"篡改"},{"key":"C","text":"中断"},{"key":"D","text":"监听"}],"answer":"ABC","analysis":"本题考查主动攻击与被动攻击的区分。主动攻击是指攻击者主动干预信息的传递、伪造或更改数据流，包括中断（可用性破坏）、篡改（完整性破坏）、伪造（真实性破坏）三类，通常易于检测但难以预防。监听（窃听）只是被动地获取信道上的信息而不改变数据流，属于被动攻击，其特点是难以检测但易于预防。题干措辞「主动攻击的是」在语法上略有歧义，按官方答案选 ABC 即可。","correctReason":"中断、篡改、伪造都会改变数据的正常传递状态或内容，属于典型的主动攻击（该题答案以官方为准）。","wrongReason":"D：监听只是被动截获信道上的信息，不修改、不注入、不阻断数据流，属于被动攻击，因此不选。","source":"GB/T 25069-2022《信息安全技术 术语》中「主动攻击／被动攻击」定义","keyPoint":"主动攻击＝中断、篡改、伪造；监听属被动攻击"},{"id":"第二部分专业题-一、密码学-多选题-33","no":33,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"下列密码分析方法属于已知明文攻击的是（ ）。","options":[{"key":"A","text":"最佳放射逼近分析方法"},{"key":"B","text":"线性密码分析方法"},{"key":"C","text":"分别征服分析方法"},{"key":"D","text":"时间-存储权衡攻击"}],"answer":"AB","analysis":"本题考查密码分析方法的攻击条件分类。线性密码分析寻找明文、密文与密钥比特之间的线性逼近关系，用已知的明密文对统计偏差来恢复密钥比特，属典型的已知明文攻击。「最佳放射逼近分析」也是围绕明密文对的线性／仿射逼近做统计分析（教材原文写作「放射」，即仿射），同样归入已知明文攻击。分别征服分析和时间-存储权衡攻击则是在未知明文条件下对密钥各比特独立穷举或利用预计算表的攻击。","correctReason":"线性密码分析与最佳仿射（放射）逼近分析都需要掌握一定数量的已知明密文对才能建立统计偏差，属于已知明文攻击（该题答案以官方为准）。","wrongReason":"C：分别征服分析是逐个确定密钥比特的穷举类方法，属于唯密文/已知算法条件下的强力攻击；D：时间-存储权衡攻击借助预计算表在时间与存储间取折中，不依赖已知明文对。","source":"《密码学导论》密码分析方法分类；GM/T 0002-2012 附录安全性说明","keyPoint":"线性（仿射）逼近类分析＝已知明文攻击"},{"id":"第二部分专业题-一、密码学-多选题-34","no":34,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"下列分组密码工作模式中，加密不能并行但解密可并行的是（ ）。","options":[{"key":"A","text":"CBC"},{"key":"B","text":"OFB"},{"key":"C","text":"CFB"},{"key":"D","text":"CTR"}],"answer":"AC","analysis":"本题考查分组密码工作模式的并行性。判断口诀：谁依赖前一块密文反馈，谁的加密就必须串行。CBC 加密必须等前一组密文产生后才能算下一组，但解密时各密文分组的解密互不依赖，可并行；CFB 同理，加密依赖反馈的密文，解密时可用已知密文段预生成密钥流并并行处理。OFB 与 CTR 都不存在密文反馈，加解密两端均可并行。题干措辞「加密不能并行但解密可并行」在语法上略绕，按官方答案选 AC。","correctReason":"CBC 与 CFB 的加密过程均需前一组密文作为反馈输入，只能串行；而二者的解密只用到已经收到的密文分组，可以并行进行（该题答案以官方为准）。","wrongReason":"B：OFB 由分组算法独立产生密钥流，加解密都不依赖密文，均可并行；D：CTR 对计数器加密产生密钥流，加解密同样都可并行。","source":"GM/T 0002-2012 及 NIST SP 800-38A 分组密码工作模式","keyPoint":"CBC／CFB 加密串行、解密可并行；OFB／CTR 两端皆可并行"},{"id":"第二部分专业题-一、密码学-多选题-35","no":35,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"下述正确描述SM4 和AES 有什么不同之处的是（ ）。","options":[{"key":"A","text":"SM4 密钥长度固定，而AES 密钥长度可变"},{"key":"B","text":"SM4 的线性变换是面向比特的运算，而AES 的所有运算是面向字节的"},{"key":"C","text":"SM4 的加密过程和解密过程一致，而AES 的加密过程和解密过程不一致"},{"key":"D","text":"SM4 是非平衡广义Fesitel 结构，而AES 是SP 结构"}],"answer":"ABCD","analysis":"本题考查 SM4 与 AES 的结构差异。SM4 分组和密钥都固定为 128 位，AES 密钥可选 128/192/256 位；SM4 的线性变换 L 由循环移位与异或构成（面向比特），AES 的字节代换、行移位、列混合则全部面向字节；SM4 采用广义 Feistel 结构，加解密一致，AES 是 SP 结构，解密要用逆 S 盒、逆列混合，与加密不相似。四项分别从密钥长度、运算粒度、可自反性和整体结构描述，均正确。","correctReason":"A 讲密钥长度、B 讲运算粒度、C 讲加解密是否自反、D 讲整体结构，四个方面都是 SM4 与 AES 的真实差别。","wrongReason":"无错误选项：A、B、C、D 分别从密钥长度、线性变换粒度、加解密是否一致和整体结构四个角度准确描述了 SM4 与 AES 的差异，四个选项均正确。","source":"GM/T 0002-2012《SM4 分组密码算法》；GB/T 32907-2016《SM4 分组密码算法》；FIPS 197 (AES)","keyPoint":"SM4：密钥固定、比特线性变换、广义 Feistel、加解密同构"},{"id":"第二部分专业题-一、密码学-多选题-36","no":36,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"对称密码的优点是非常快速，受到广泛的应用，选项中哪些是对称密码算 法？（ ）","options":[{"key":"A","text":"RSA 算法"},{"key":"B","text":"3DES 算法"},{"key":"C","text":"SM4 算法"},{"key":"D","text":"IDEA 算法"}],"answer":"BCD","analysis":"本题考查对称密码算法的识别。对称密码的加解密使用同一密钥，速度远快于公钥算法，3DES、SM4、IDEA 都是分组对称密码。3DES 用两把或三把 DES 密钥做三次 DES 运算来扩展密钥空间；SM4 是我国商用分组密码标准，分组与密钥均为 128 位；IDEA 使用 128 位密钥、64 位分组，曾用于 PGP。RSA 的安全性基于大整数分解困难问题，加解密密钥不同，属于非对称（公钥）密码。","correctReason":"3DES、SM4、IDEA 的加解密均使用同一密钥（或由同一密钥派生），符合对称密码的定义。","wrongReason":"A：RSA 使用公钥加密、私钥解密，密钥成对且不同，属非对称密码算法，不属于对称密码。","source":"GM/T 0002-2012；GB/T 32907-2016；ISO/IEC 18033-3（3DES、IDEA）","keyPoint":"3DES、SM4、IDEA 是对称分组密码；RSA 是非对称"},{"id":"第二部分专业题-一、密码学-多选题-37","no":37,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"对于SM4 分组密码，当采用CTR 工作模式时，下述描述正确的是（ ）。","options":[{"key":"A","text":"具有良好的硬件和软件效率"},{"key":"B","text":"能进行随机访问"},{"key":"C","text":"可以在明文到来之前计算密钥流"},{"key":"D","text":"不能用于高速实现需求"}],"answer":"ABC","analysis":"本题考查 CTR 工作模式的性质。CTR 用计数器值加密得到密钥流再与明文异或，无需等待明文即可预先产生密钥流，天然支持随机访问（可直接定位到任意分组解密），且分组算法调用可流水化、并行化，软硬件效率都很高，因此在高速传输和磁盘加密场景中广泛使用。D 项说不能用于高速实现，与事实相反。","correctReason":"CTR 模式通过计数器独立产生密钥流，可预计算、可流水线并行、可随机访问，故 A、B、C 均正确。","wrongReason":"D：CTR 无反馈依赖，各分组可并行处理且密钥流可预生成，恰恰非常适合高速实现，该说法与事实相反。","source":"NIST SP 800-38A；GB/T 17964-2021《信息安全技术 分组密码算法的工作模式》","keyPoint":"CTR 模式：密钥流可预计算、可并行、可随机访问"},{"id":"第二部分专业题-一、密码学-多选题-38","no":38,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"以下分组密码算法的工作模式IV 要求每个消息必须唯一，不能重用，且不 可预测的是（ ）。","options":[{"key":"A","text":"OFB"},{"key":"B","text":"CFB"},{"key":"C","text":"CBC"},{"key":"D","text":"GCM"}],"answer":"ABCD","analysis":"本题考查各工作模式对 IV 的不可重用、不可预测要求。OFB、CFB、CBC 在 IV 重复时都会使相同明文产生相同密文，泄露明文的相等关系，其中 OFB 还会因密钥流重用导致明文被异或恢复；CBC 若 IV 可预测还会遭受 BEAST 类攻击。GCM 以计数器块构造密钥流并用于认证，IV 重用会毁掉密钥流唯一性并破坏 GMAC 认证。因此四种模式的 IV 都要求唯一、不可预测。","correctReason":"OFB、CFB、CBC 用 IV 保证同一密钥下密钥流与反馈起点唯一，GCM 以 IV 构造唯一计数器块，四者都要求 IV 每次唯一且不可预测。","wrongReason":"无错误选项：A、B、C、D 四种模式的 IV 均需每个消息唯一、不可重用且不可预测，四项都正确。","source":"NIST SP 800-38A；NIST SP 800-38D（GCM 对 IV 唯一性的要求）","keyPoint":"CBC／CFB／OFB／GCM 的 IV 必须唯一且不可预测"},{"id":"第二部分专业题-一、密码学-多选题-39","no":39,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"主动攻击者可以通过将事先保存的正确MAC 值不断重放来发动攻击。以下 哪几种方法可以防御重放攻击？（ ）","options":[{"key":"A","text":"每次都对发送的消息赋予一个递增的编号（序号），并且在计算MAC 值时将 序号也包含在消息中"},{"key":"B","text":"在发送消息时包含当前的时间，如果收到以前的消息，即便MAC 值正确也将 其当做错误的消息来处理"},{"key":"C","text":"在通信之前，接收者先向发送者发送一个一次性的随机数，发送者在消息中包 含这个nonce 并计算MAC 值"},{"key":"D","text":"每次都对发送的消息携带发送者的唯一身份标识，并且在计算MAC 值时该标 识也包含在消息中"}],"answer":"ABC","analysis":"本题考查重放攻击的防御思路。防重放的核心是让攻击者保存的旧报文在新一轮通信中失效，常用三种手段：序号（接收方只接受递增且未用过的编号）、时间戳（只接受时间窗口内的新鲜报文）、挑战-应答式随机数 nonce（由接收方当次生成，旧报文无法预先包含）。这三种机制都必须把序号、时间戳或 nonce 纳入 MAC 计算范围，否则攻击者可篡改这些字段。仅携带发送者身份标识只能识别身份，重放同一身份标识仍能通过校验。","correctReason":"序号、时间戳、一次性随机数都能使旧报文的 MAC 在新会话中失效，且题目都强调将其纳入 MAC 计算，故 A、B、C 可有效防重放。","wrongReason":"D：发送者身份标识对同一发送者的每次报文都相同，攻击者原样重放旧报文时标识和 MAC 都能通过校验，无法阻止重放。","source":"GB/T 15843（实体鉴别）中序号、时间戳、随机数三类防重放机制","keyPoint":"防重放三件套：序号、时间戳、挑战 nonce，且必须纳入 MAC"},{"id":"第二部分专业题-一、密码学-多选题-40","no":40,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"以下关于分组密码正确说法的是（ ）。","options":[{"key":"A","text":"分组密码的结构一般可以分为两种： Feistel 网络结构和SP 网络结构"},{"key":"B","text":"DES 算法是Feistel 结构的一个代表，AES 算法、SM4 算法是 SP 结构的代表"},{"key":"C","text":"分组密码由加密算法、解密算法和密钥扩展算法三部分组成"},{"key":"D","text":"Feistel 网络解密过程与其加密过程实质是相同的，而SP 网络密码可以更快的 得到扩散，但加、解密过程通常不相似"}],"answer":"ACD","analysis":"本题考查分组密码的结构与加解密特性。分组密码按结构分为 Feistel 网络与 SP 网络两大类；DES 是 Feistel 网络的经典代表，其解密只需把轮密钥逆序使用、轮函数不变；SP 网络靠代换层与置换层配合，几轮内即可实现良好扩散，但解密要用各层的逆运算，与加密不相似。C 项所述算法构成也是通常表述。B 项把 SM4 归为 SP 结构代表，与 SM4 的广义 Feistel 结构不符，答题时按官方答案选 ACD 即可。","correctReason":"A、D 正确说明了分组密码的两大结构分类及 Feistel 与 SP 网络在加解密相似性、扩散性能上的差别，C 所述算法构成也成立（B 项以官方答案为准）。","wrongReason":"B：SM4 实际采用非平衡广义 Feistel 结构，并非 SP 结构的代表，该表述严格说并不准确，但按官方答案本题仍选 ACD。","source":"GB/T 32907-2016；《分组密码设计与分析》结构分类","keyPoint":"DES＝Feistel；AES＝SP；SM4＝广义 Feistel"},{"id":"第二部分专业题-一、密码学-多选题-41","no":41,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"SM4 分组密码算法可以用于下列哪些用途？（ ）","options":[{"key":"A","text":"数据保密传输"},{"key":"B","text":"信息加密存储"},{"key":"C","text":"签名认证"},{"key":"D","text":"消息鉴别码"}],"answer":"ABD","analysis":"本题考查分组密码算法的应用范围。SM4 既能直接加密数据，也可用于数据保密传输和信息加密存储；配合 CBC-MAC、EMAC、CMAC、GCM 等工作模式可生成消息鉴别码，实现完整性与来源鉴别。但数字签名必须依赖非对称密码体制，用私钥签名、公钥验证，分组密码没有公私钥对，无法独立完成签名认证，故 C 不选。","correctReason":"SM4 作为分组密码可用于数据加密（传输与存储），并能通过 MAC 类工作模式实现消息鉴别，故 A、B、D 正确。","wrongReason":"C：签名认证需要公私钥对实现不可否认性，对称的 SM4 无法提供，须由 SM2、SM9 或 RSA 等公钥算法完成。","source":"GB/T 32907-2016；GB/T 17964-2021《信息安全技术 分组密码算法的工作模式》","keyPoint":"分组密码能加密、能做 MAC，但做不了数字签名"},{"id":"第二部分专业题-一、密码学-多选题-42","no":42,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"ZUC 算法中使用到的运算包括（ ）。","options":[{"key":"A","text":"模2^{31}-1 的加法"},{"key":"B","text":"模2^{32}的加法"},{"key":"C","text":"右循环移位"},{"key":"D","text":"左循环移位"}],"answer":"ABD","analysis":"本题考查 ZUC 算法（祖冲之序列密码）的运算部件。ZUC 的 LFSR 在素数域上工作，采用模 2^31−1 的加法来更新状态；非线性函数 F 对 32 位字做模 2^32 的加法以及异或运算，并对 S 盒输出做左循环移位（如 L1、L2）。因此 A、B、D 描述的运算在算法中真实存在。右循环移位不是 ZUC 的组成部件。","correctReason":"ZUC 的 LFSR 用模 2^31−1 加法，F 函数中用模 2^32 加法，S 盒输出后又做左循环移位，故 A、B、D 正确。","wrongReason":"C：ZUC 规格中用到的是左循环移位，没有把右循环移位作为算法的组成运算。","source":"GM/T 0001-2012《祖冲之序列密码算法》第 4 章（LFSR 与非线性函数 F）","keyPoint":"ZUC：LFSR 模 2^31−1 加，F 函数模 2^32 加＋左循环移位"},{"id":"第二部分专业题-一、密码学-多选题-43","no":43,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"下述（ ）算法的S 盒与SM4 算法的S 盒是仿射等价。","options":[{"key":"A","text":"DES"},{"key":"B","text":"AES"},{"key":"C","text":"Camellia"},{"key":"D","text":"MISTY"}],"answer":"BC","analysis":"本题考查 S 盒的代数等价关系。SM4 的 S 盒与 AES 的 S 盒都被证明与有限域 GF(2^8) 上的求逆运算仿射等价，只是外围仿射变换不同，这正是两者都能抵抗差分与线性分析的原因。Camellia 的 S 盒同样由 GF(2^8) 求逆加仿射变换构造，与 SM4 属同一等价类。DES 的 S 盒是人工设计的查找表；MISTY 的 S 盒基于 GF(2^7)、GF(2^9) 上的幂函数，二者都不等价。","correctReason":"AES 与 Camellia 的 S 盒都与 SM4 的 S 盒同属「GF(2^8) 求逆＋仿射变换」这一等价类，故 B、C 正确。","wrongReason":"A：DES 的 S 盒是查表式设计，与 GF(2^8) 求逆类结构不构成仿射等价；D：MISTY 的 S 盒建立在 GF(2^7)、GF(2^9) 幂函数之上，与 SM4 的 S 盒不等价。","source":"SM4 与 AES S 盒仿射等价性的公开研究结论；GM/T 0002-2012 附录","keyPoint":"SM4／AES／Camellia 的 S 盒同属 GF(2^8) 求逆仿射等价类"},{"id":"第二部分专业题-一、密码学-多选题-44","no":44,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"基于ZUC 算法的完整性算法工作流程中的步骤有（ ）。","options":[{"key":"A","text":"初始化"},{"key":"B","text":"函数扩展"},{"key":"C","text":"产生密钥流"},{"key":"D","text":"计算MAC"}],"answer":"ACD","analysis":"本题考查基于 ZUC 的完整性算法（GM/T 0001 中的 128-EIA3 类算法）流程。其过程为：先用密钥和 IV 初始化 LFSR（初始化阶段），再运行产生密钥流比特，随后按消息分组与密钥流一起迭代计算 MAC 值，最终截取标签。消息扩展是杂凑算法（如 SM3）中的概念，不是 ZUC 完整性算法的步骤，故 B 不选。","correctReason":"该算法依次执行初始化、产生密钥流、计算 MAC 三个环节，故 A、C、D 为其工作流程步骤。","wrongReason":"B：函数扩展（消息扩展）是 SM3、SHA-256 等杂凑算法压缩前的处理步骤，ZUC 完整性算法中没有这一环节。","source":"GM/T 0001-2012《祖冲之序列密码算法》完整性算法部分","keyPoint":"ZUC 完整性算法：初始化→产生密钥流→计算 MAC"},{"id":"第二部分专业题-一、密码学-多选题-45","no":45,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"不借助其他密码机制，分组密码算法自身可实现（ ）。","options":[{"key":"A","text":"加密功能"},{"key":"B","text":"认证功能"},{"key":"C","text":"数据完整性保护功能"},{"key":"D","text":"数字签名功能"}],"answer":"ABC","analysis":"本题考查分组密码算法自身的功能边界。分组密码本身提供机密性，配合工作模式可产生认证和完整性保护能力：CBC-MAC、EMAC、CMAC 利用分组密码的密钥依赖性生成消息鉴别码，可同时校验消息来源与内容是否被改动。但数字签名必须满足不可否认性，需要签名私钥与验证公钥成对存在，只有公钥密码体制才能实现，分组密码无法独立完成。","correctReason":"分组密码可直接加密，并通过 MAC 类工作模式实现认证和数据完整性保护，故 A、B、C 正确。","wrongReason":"D：数字签名要求不可否认性，必须使用公私钥对（如 SM2、SM9、RSA），分组密码不借助公钥机制无法实现签名功能。","source":"GB/T 17964-2021《信息安全技术 分组密码算法的工作模式》（MAC 类模式）","keyPoint":"分组密码＝加密＋认证＋完整性；签名须靠公钥体制"},{"id":"第二部分专业题-一、密码学-多选题-46","no":46,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"以下关于SM3 密码杂凑算法和SHA-256 的描述正确的是（ ）。","options":[{"key":"A","text":"消息字的介入方式相同"},{"key":"B","text":"消息扩展过程生成的总消息字个数相同"},{"key":"C","text":"杂凑值的长度相同"},{"key":"D","text":"压缩函数的轮数"}],"answer":"CD","analysis":"本题考查 SM3 与 SHA-256 的构造差异。两者的输出都是 256 位、压缩函数都是 64 轮，但在消息扩展与消息字介入方式上不同：SM3 每轮用 Wj、Wj+1、Wj+4、Wj+13、Wj+16、Wj+19、Wj+22、Wj+25 共 8 个字参与，SHA-256 只用 Wj、Wj+1、Wj+9、Wj+14 共 4 个字，因此「消息字的介入方式」和「生成的总消息字个数」都不同。","correctReason":"SM3 与 SHA-256 的杂凑值长度相同（均为 256 位），压缩函数的轮数也相同（均为 64 轮），故 C、D 正确。","wrongReason":"A：SM3 每轮取 8 个扩展消息字参与运算，SHA-256 每轮只取 4 个，介入方式不同；B：SM3 消息扩展生成 68 个消息字加 64 个扩展字，SHA-256 仅 64 个消息字，总数不同。","source":"GB/T 32905-2016《SM3 密码杂凑算法》；FIPS 180-4 (SHA-256)","keyPoint":"SM3 与 SHA-256：同长 256 位、同 64 轮，扩展方式不同"},{"id":"第二部分专业题-一、密码学-多选题-47","no":47,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"SM3 密码杂凑算法的运算中（ ）起到混淆的作用。","options":[{"key":"A","text":"循环移位"},{"key":"B","text":"P 置换"},{"key":"C","text":"模加"},{"key":"D","text":"布尔函数"}],"answer":"CD","analysis":"本题考查 SM3 压缩函数中各运算的作用。Shannon 提出的设计准则中，混淆是让密钥与密文之间的关系复杂化，扩散是让明文或密钥的单个比特影响尽可能多的输出比特。SM3 的布尔函数 FF、GG 通过复杂的非线性组合掩盖输入与输出之间的关系，起混淆作用；P 置换把状态字的比特打散到多个字中，起扩散作用。循环移位和模加主要提供比特混合与扩散，通常归入扩散类操作。","correctReason":"布尔函数 FF、GG 提供非线性混淆，P 置换把比特扩散到不同字中，二者共同完成混淆与扩散，故 C、D 正确。","wrongReason":"A：循环移位主要用于把比特位置打散，起扩散作用；B：P 置换是典型的扩散部件，作用是把单比特影响扩展开，不属于混淆。","source":"GB/T 32905-2016《SM3 密码杂凑算法》5.3 节压缩函数","keyPoint":"SM3 中布尔函数管混淆，P 置换和循环移位管扩散"},{"id":"第二部分专业题-一、密码学-多选题-48","no":48,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"下列分组密码工作模式中，解密之前可以进行伪随机流预计算的有（ ）。","options":[{"key":"A","text":"CBC"},{"key":"B","text":"CTR"},{"key":"C","text":"OFB"},{"key":"D","text":"CFB"}],"answer":"BC","analysis":"本题考查工作模式能否预生成密钥流。CTR 直接用计数器值作为分组算法的输入，与明文、密文都无关，因此在解密前就能把整段密钥流算好；OFB 是自反馈的输出反馈模式，密钥流的后续分组只依赖前一次的输出，同样可以离线预计算。CBC 的密钥流取决于前一组密文，CFB 的密钥流取决于前一组密文，二者都必须拿到前一段密文后才能继续，无法提前预计算。","correctReason":"CTR 与 OFB 的密钥流由计数器或算法自身反馈独立产生，不含明文与密文信息，故解密前可预计算，B、C 正确。","wrongReason":"A：CBC 中每组分组算法的输入是前一组密文，无密文则无密钥流，无法预计算；D：CFB 把前一组密文反馈进分组算法，同样依赖密文，不能提前生成密钥流。","source":"NIST SP 800-38A；GB/T 17964-2021《信息安全技术 分组密码算法的工作模式》","keyPoint":"CTR／OFB 密钥流与明文无关，可预计算；CBC／CFB 不可"},{"id":"第二部分专业题-一、密码学-多选题-49","no":49,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"Shannon 建议密码设计的基本方法包括（ ）。","options":[{"key":"A","text":"布尔运算"},{"key":"B","text":"扩散"},{"key":"C","text":"混淆"},{"key":"D","text":"迭代"}],"answer":"BC","analysis":"本题考查 Shannon 的保密系统设计思想。Shannon 在《保密系统的通信理论》中提出，对抗统计分析的根本手段是扩散与混淆：扩散使明文和密钥的每一个比特影响尽可能多的密文比特，抹平统计规律；混淆使密文与密钥之间的统计关系尽可能复杂，让攻击者难以从密文推断密钥。布尔运算和迭代只是实现这些目标的具体技术手段，不是他提出的基本设计方法。","correctReason":"Shannon 明确提出的两条基本设计原则就是扩散和混淆，故 B、C 为正确答案。","wrongReason":"A：布尔运算是构造密码函数的具体运算工具，不是 Shannon 提出的设计方法；D：迭代是实现扩散混淆的工程手段，同样不属于他给出的两条基本方法。","source":"C. E. Shannon, Communication Theory of Secrecy Systems (1949)","keyPoint":"Shannon 两条设计准则：扩散、混淆"},{"id":"第二部分专业题-一、密码学-多选题-50","no":50,"kind":"multi","part":"第二部分专业题","cat":"一、密码学","type":"多选题","stem":"以下分组密码算法工作模式，说法是正确的（ ）。","options":[{"key":"A","text":"在CRT 模式中，主动攻击者可以通过反转密文分组中的某些比特，引起解密 后明文中的相应比特也发生反转"},{"key":"B","text":"在OFB 模式中，可以在加密消息之前预计算密钥流"},{"key":"C","text":"CFB 模式与OFB 模式的区别仅仅在于密码算法的输入"},{"key":"D","text":"假设CBC 模式加密的密文分组中有一个分组损坏了（如由于硬盘故障导致密 文分组的值发生了改变），在这种情况下，只要密文分组的长度没有发生变化， 则解密时最多只会有2 个分组受到数据损坏的影响"}],"answer":"ABCD","analysis":"本题考查各工作模式的细节特性。CTR 中明文由密钥流与密文异或恢复，密文某比特翻转会使对应明文比特同样翻转，攻击者能可控地改动明文；OFB 的密钥流可事先算出，因此能提前加密或解密；CFB 与 OFB 的差别就在于送入分组算法的是前一段密文还是前一次的输出；CBC
