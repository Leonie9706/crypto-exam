人民共和国电子签名法》第二十八条（证书内容准确义务见第二十一条、第二十二条）","keyPoint":"电子认证机构赔偿责任：过错推定，能自证无过错即可免责。"},{"id":"第一部分基础题-二、网络安全法律法规-单选题-27","no":27,"kind":"single","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"单选题","stem":"《中华人民共和国电子签名法》规定，满足法律要求的\"电子文件原件\"形式 要件是（ ）","options":[{"key":"A","text":"首次生成时即加盖电子印章"},{"key":"B","text":"内容未被系统自动备份"},{"key":"C","text":"最终完整形成于专用系统"},{"key":"D","text":"能够随时调取查用"}],"answer":"D","analysis":"本题考查数据电文原件形式的法律要件。法律规定，符合下列条件的数据电文视为满足原件形式要求：能够有效地表现所载内容并可供随时调取查用；能够可靠地保证自最终形成时起内容保持完整、未被更改，但增加背书以及交换、储存、显示过程中的形式变化不影响完整性。可见核心是“可随时调取查用+内容完整未改”，“加盖电子印章”“专用系统”等都不是法定要件。","correctReason":"“能够随时调取查用”正是法条列举的原件形式要件之一，与内容完整未被更改共同构成判断标准。","wrongReason":"A：是否首次生成时加盖电子印章与原件形式要件无关；B：内容未被系统自动备份既非法定要件，也与数据电文的完整性判断无关；C：“最终完整形成于专用系统”不是法律要求，系统类型不影响原件认定。","source":"《中华人民共和国电子签名法》第五条","keyPoint":"数据电文原件：能表现内容并可随时调取查用+自最终形成起内容完整未改。"},{"id":"第一部分基础题-二、网络安全法律法规-单选题-28","no":28,"kind":"single","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"单选题","stem":"某科技信息公司存有大量个人信息，根据《中华人民共和国个人信息保护法》 要求，该公司应采取的保护措施，下列说法正确的是（ ）。","options":[{"key":"A","text":"制定内部管理制度"},{"key":"B","text":"定期对从业人员进行安全教育和培训"},{"key":"C","text":"采取相应的加密、去标识化等措施"},{"key":"D","text":"以上都是"}],"answer":"D","analysis":"本题考查个人信息处理者应采取的安全保障措施。《个人信息保护法》要求处理者根据处理目的、方式、信息种类、对个人权益的影响及安全风险，采取制定内部管理制度和操作规程、分类管理、相应的加密与去标识化等技术措施、合理确定操作权限并定期对从业人员进行安全教育和培训、制定并组织实施安全事件应急预案等措施。题目三个选项分别对应其中不同条款，因此答案取“以上都是”。","correctReason":"制定内部管理制度、定期开展从业人员安全教育培训、采取加密与去标识化措施都是法律明确要求的义务，三项均正确。","wrongReason":"本项为组合选项，A、B、C三项各自都是法定义务的组成部分，故不能只选其一。","source":"《中华人民共和国个人信息保护法》第五十一条第一项、第三项、第四项","keyPoint":"个保法安全措施：制度+分类+加密去标识化+权限与培训+应急预案。"},{"id":"第一部分基础题-二、网络安全法律法规-单选题-29","no":29,"kind":"single","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"单选题","stem":"个人信息处理者应当公开个人信息保护负责人的（ ），并将个人信息保护 负责人的姓名、联系方式等报送履行个人信息保护职责的部门。","options":[{"key":"A","text":"身份证号"},{"key":"B","text":"联系方式"},{"key":"C","text":"家庭住址"},{"key":"D","text":"工作地点"}],"answer":"B","analysis":"本题考查个人信息保护负责人的信息公开与报送要求。处理个人信息达到国家网信部门规定数量的处理者应当指定个人信息保护负责人，负责监督个人信息处理活动及保护措施；处理者应当公开该负责人的联系方式，并将其姓名、联系方式等报送履行个人信息保护职责的部门。公开的目的是方便个人行使权利和投诉，因此只需公开联系方式，身份证号、家庭住址等属于不应公开的个人信息。","correctReason":"法条明确要求公开个人信息保护负责人的联系方式，并报送姓名、联系方式等信息。","wrongReason":"A：身份证号属于敏感个人信息，公开会给负责人本人带来安全风险，法律未作此要求；C：家庭住址同样属于不应公开的个人信息；D：工作地点不是公开和报送的法定事项。","source":"《中华人民共和国个人信息保护法》第五十二条","keyPoint":"个人信息保护负责人：公开联系方式、报送姓名与联系方式。"},{"id":"第一部分基础题-二、网络安全法律法规-单选题-30","no":30,"kind":"single","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"单选题","stem":"根据《电子签名法》的规定，可靠的电子签名与手写签名或者盖章具有什么 关系（ ）","options":[{"key":"A","text":"可靠的电子签名法律效力低于手写签名"},{"key":"B","text":"可靠的电子签名法律效力高于手写签名"},{"key":"C","text":"可靠的电子签名与手写签名或者盖章具有同等的法律效力"},{"key":"D","text":"可靠的电子签名仅在某些特定领域具有法律效力"}],"answer":"C","analysis":"本题考查电子签名的法律效力。法律规定，可靠的电子签名与手写签名或者盖章具有同等的法律效力。这意味着电子签名不是“次一等”的签署方式，也不是只在特定领域才被承认，而是在满足专有性、可控性、签署后签名与内容改动可被发现等条件后，与手写签名、盖章处于同一效力层级。","correctReason":"法条明确规定可靠的电子签名与手写签名或者盖章具有同等的法律效力，不存在效力高低之分。","wrongReason":"A：法律已确立同等效力，不存在低于手写签名的情形；B：同样无高低之别，电子签名并非效力更高；D：可靠电子签名的效力并非限于特定领域，当事人约定使用电子签名的文书不得仅因形式被否定效力。","source":"《中华人民共和国电子签名法》第十三条、第十四条（第三条关于适用范围）","keyPoint":"可靠电子签名与手写签名、盖章效力同等。"},{"id":"第一部分基础题-二、网络安全法律法规-多选题-1","no":1,"kind":"multi","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"多选题","stem":"某市政府在制定本市网络安全工作规划时，需要明确网络安全工作的根本原 则。根据《中华人民共和国网络安全法》，网络安全工作应当坚持（ ）","options":[{"key":"A","text":"中国共产党的领导"},{"key":"B","text":"贯彻总体国家安全观"},{"key":"C","text":"以经济效益为中心"},{"key":"D","text":"推进网络强国建设"}],"answer":"ABD","analysis":"本题考查《网络安全法》总则中网络安全工作的根本原则和方向。该法明确网络安全工作坚持中国共产党的领导，贯彻总体国家安全观，并推进网络强国建设，三句话是政治方向和战略目标的完整表述。C项把网络安全工作歪曲成以经济效益为中心，既不符合立法宗旨，也与社会效益优先、安全与发展并重的导向相悖。易混点在于把「并重」误读为「以经济为中心」。","correctReason":"《网络安全法》总则确立了坚持党的领导、贯彻总体国家安全观、推进网络强国建设的原则，故A、B、D均为立法明文表述。","wrongReason":"C：网络安全工作不以经济效益为中心，《网络安全法》强调安全与发展并重、维护国家安全和社会公共利益，「以经济效益为中心」不是法定原则。","source":"《中华人民共和国网络安全法》总则","keyPoint":"党的领导＋总体国家安全观＋网络强国建设，是网络安全工作的根本方向。"},{"id":"第一部分基础题-二、网络安全法律法规-多选题-2","no":2,"kind":"multi","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"多选题","stem":"《中华人民共和国网络安全法》由全国人民代表大会常务委员会于2016 年11 月7 日发布，下列关于此部法案说法错误的是（ ）。","options":[{"key":"A","text":"为了保障网络安全，维护网络空间主权和国家安全、社会公共利益，保护公民、 法人和其他组织的合法权益，促进经济社会信息化健康发展，制定本法"},{"key":"B","text":"确定了培养网络安全人才法律制度"},{"key":"C","text":"采取监测、记录网络运行状态、网络安全事件的技术措施，并按照规定留存相 关的网络日志不少于360 天"},{"key":"D","text":"《中华人民共和国网络安全法》自2017 年7 月1 日起施行"}],"answer":"CD","analysis":"本题为选错题，考《网络安全法》的基本制度与关键数字、日期。A项是立法目的的完整表述，B项对应国家支持网络安全人才培养的制度，二者均正确。C项把网络日志留存期限说成不少于360天，法定要求是不少于六个月；D项把施行日期说成2017年7月1日，实际是2017年6月1日。两个错误点都是考试高频「数字陷阱」。","correctReason":"A项为立法目的的原文表述，B项符合国家培养网络安全人才的法律制度，故A、B说法正确。","wrongReason":"C：法律规定采取监测、记录网络运行状态和网络安全事件的技术措施，并按规定留存相关网络日志不少于六个月，不是360天；D：该法自2017年6月1日起施行，不是2017年7月1日。","source":"《中华人民共和国网络安全法》第一条、第二十条、第二十一条、第七十九条","keyPoint":"日志留存不少于6个月；《网络安全法》2017年6月1日施行。"},{"id":"第一部分基础题-二、网络安全法律法规-多选题-3","no":3,"kind":"multi","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"多选题","stem":"国家在推进网络安全工作中，确立了网络安全与信息化发展的关系。根据《中 华人民共和国网络安全法》，以下关于这一关系的表述正确的有（ ）。","options":[{"key":"A","text":"国家坚持网络安全与信息化发展并重"},{"key":"B","text":"遵循积极利用、科学发展、依法管理、确保安全的方针"},{"key":"C","text":"应当优先保障网络安全，暂缓信息化发展"},{"key":"D","text":"国家鼓励网络技术创新和应用，支持培养网络安全人才"}],"answer":"ABD","analysis":"本题考查《网络安全法》确立的网络安全与信息化发展关系。法律要求二者并重、同步推进，遵循积极利用、科学发展、依法管理、确保安全的方针，并鼓励技术创新、支持人才培养。C项把「并重」扭曲为「先安全、缓发展」，属于典型的绝对化干扰项，安全不是发展的对立面，而是发展的前提和保障。","correctReason":"法律明文规定国家坚持网络安全与信息化发展并重，遵循积极利用、科学发展、依法管理、确保安全的方针，并鼓励网络技术创新和应用、支持培养网络安全人才，故A、B、D正确。","wrongReason":"C：法律要求安全与发展并重、同步推进，并不存在「优先保障网络安全、暂缓信息化发展」的表述，该说法与立法方针相反。","source":"《中华人民共和国网络安全法》第三条","keyPoint":"十六字方针：积极利用、科学发展、依法管理、确保安全；安全与发展并重。"},{"id":"第一部分基础题-二、网络安全法律法规-多选题-4","no":4,"kind":"multi","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"多选题","stem":"甲公司拟与乙公司签订一份货物买卖合同，双方通过电子邮件协商一致后， 甲公司使用其法定代表人王某的数字证书对合同电子版进行了电子签名。根据 《中华人民共和国电子签名法》，下列有关电子签名的表述中，正确的有（ ）。","options":[{"key":"A","text":"电子签名是指数据电文中以电子形式所含、所附用于识别签名人身份并表明签 名人认可其中内容的数据"},{"key":"B","text":"电子签名必须采用数字证书的形式才具有法律效力"},{"key":"C","text":"电子签名具有识别签名人身份和表明签名人认可文件内容的双重功能"},{"key":"D","text":"电子签名必须以磁介质为载体生成"}],"answer":"AC","analysis":"本题考查电子签名的法定定义与功能。《电子签名法》给出的定义强调两点：一是以电子形式所含、所附的数据，二是用于识别签名人身份并表明签名人认可其中内容。B项把「可靠的电子签名」与「数字证书」混为一谈，法律不强求证书形式；D项把载体限定为磁介质，也是对技术中立的误解。记住「可靠电子签名与手写签名、盖章具有同等法律效力」即可。","correctReason":"A项是《电子签名法》对电子签名的法定定义，C项准确概括了识别身份与表明认可的双重功能，故A、C正确。","wrongReason":"B：法律并未要求电子签名必须采用数字证书形式，只要符合法定可靠条件的电子签名即与手写签名或盖章具有同等法律效力；D：电子签名以数据电文形式存在，法律不限定为载体必须为磁介质。","source":"《中华人民共和国电子签名法》第二条、第十三条、第十四条","keyPoint":"电子签名＝电子形式数据＋识别身份＋表明认可；技术中立，不限于数字证书。"},{"id":"第一部分基础题-二、网络安全法律法规-多选题-5","no":5,"kind":"multi","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"多选题","stem":"按照《中华人民共和国个人信息保护法》，以下关于个人信息处理者在发生 数据泄露时应履行通知义务的说法正确的是（ ）。","options":[{"key":"A","text":"发生个人信息泄露的，应通知履行个人信息保护职责的部门和个人"},{"key":"B","text":"通知应包括事件发生的原因和可能造成的后果"},{"key":"C","text":"个人信息处理者如采取了有效的加密措施，能够有效避免信息泄露、篡改、丢 失造成危害 的，可以不通知个人"},{"key":"D","text":"通知应包括个人信息处理者的联系方式和采取的补救措施"}],"answer":"ABCD","analysis":"本题考查个人信息泄露后的补救与告知义务。法律要求处理者立即采取措施补救，并通知履行个人信息保护职责的部门和受影响的个人；告知内容须包含泄露原因、可能造成的危害、已采取的补救措施、个人可采取的减轻危害措施以及联系方式。C项对应法定的免除通知个人的情形，即处理者已采取措施能够有效避免信息泄露、篡改、丢失造成危害时可以不再通知个人，加密正是常见手段。","correctReason":"四项均对应《个人信息保护法》关于泄露通知的对象、内容以及免除通知个人的规定，故A、B、C、D全选。","wrongReason":"本题为全选题，A、B、C、D四个选项均符合法律规定，无错误选项。","source":"《中华人民共和国个人信息保护法》第五十七条","keyPoint":"泄露通知四要素：原因、危害、补救措施、联系方式；能有效避免危害可不通知个人。"},{"id":"第一部分基础题-二、网络安全法律法规-多选题-6","no":6,"kind":"multi","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"多选题","stem":"某市供水公司拟通过电子方式与用户签订供水服务合同，用户张某对该合同 的电子形式提出异议。根据《中华人民共和国电子签名法》，下列表述正确的有 （ ）。","options":[{"key":"A","text":"涉及停止供水等公用事业服务的文书不适用电子签名"},{"key":"B","text":"供水服务合同可以采用电子方式签署"},{"key":"C","text":"涉及停止供电的文书不适用电子签名"},{"key":"D","text":"所有公用事业服务合同均不得采用电子方式签署"}],"answer":"AC","analysis":"本题考查《电子签名法》的适用除外情形。法律规定涉及婚姻、收养、继承等人身关系，以及涉及停止供水、供热、供气、供电等公用事业服务的文书不适用电子签名（当事人另有约定除外）。本题的陷阱在于区分「服务合同」与「停止服务的文书」：供水、供电服务合同本身可以用电子方式签署，只有停止供水、停止供电这类文书被排除。D项一概否定公用事业合同，明显过宽。","correctReason":"停止供水、停止供电的文书属于法定的电子签名不适用情形，而一般供水服务合同不在排除之列，可采用电子方式签署，故A、C正确。","wrongReason":"B：供水服务合同不属于法定排除情形，可以采用电子方式签署，故该表述与题意不符；D：法律只排除涉及停止供水、供热、供气、供电等公用事业服务的文书，并非所有公用事业服务合同都不得电子签署。","source":"《中华人民共和国电子签名法》第三条","keyPoint":"排除的是「停止供水供电」类文书，不是全部公用事业合同。"},{"id":"第一部分基础题-二、网络安全法律法规-多选题-7","no":7,"kind":"multi","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"多选题","stem":"按照《中华人民共和国个人信息保护法》，在个人信息出境前，应考虑的安 全保护机制有（ ）。","options":[{"key":"A","text":"制定出境计划"},{"key":"B","text":"开展出境评估"},{"key":"C","text":"进行加密或采取去标识化措施"},{"key":"D","text":"签订出境合同"}],"answer":"BCD","analysis":"本题考查个人信息出境的安全保护机制。法律确立了安全评估、专业机构认证、订立标准合同三条出境路径，并要求向个人告知境外接收方信息、取得单独同意，同时采取必要措施保障境外接收方的处理活动达到本法规定的保护标准；加密、去标识化等正是常用的安全保障手段。A项的「制定出境计划」不是法定机制，属于自造概念，但只要涉及出境业务，评估、合同保障与技术措施都是必须考虑的。","correctReason":"开展出境评估、采取加密或去标识化措施、签订出境合同分别对应法定的安全评估、安全保障措施与标准合同路径，故B、C、D正确。","wrongReason":"A：「制定出境计划」不是《个人信息保护法》规定的出境安全保护机制，法律确立的是安全评估、认证和标准合同等合法路径。","source":"《中华人民共和国个人信息保护法》第三十八条、第三十九条、第四十条","keyPoint":"个人信息出境三路径：安全评估、认证、标准合同；外加告知＋单独同意。"},{"id":"第一部分基础题-二、网络安全法律法规-多选题-8","no":8,"kind":"multi","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"多选题","stem":"《中华人民共和国个人信息保护法》中对提供重要互联网平台服务、用户数 量巨大、业务类型复杂的个人信息处理者应履行的义务进行了要求。以下义务描 述，正确的是（ ）。","options":[{"key":"A","text":"成立主要由内部成员组成的独立机构对个人信息保护情况进行监督"},{"key":"B","text":"对严重违反法律、行政法规处理个人信息的平台内的产品或者服务提供者，停 止提供服务"},{"key":"C","text":"定期发布个人信息保护社会责任报告，接受社会监督"},{"key":"D","text":"遵循公开、公平、公正的原则，制定平台规则"}],"answer":"BCD","analysis":"本题考查「守门人」条款，即为提供重要互联网平台服务、用户数量巨大、业务类型复杂的个人信息处理者设定的特别义务。这类平台要成立主要由外部成员组成的独立机构监督个人信息保护，制定平台规则须遵循公开、公平、公正原则，对严重违法的平台内产品或服务提供者停止服务，并定期发布个人信息保护社会责任报告。A项把「外部成员」偷换成「内部成员」，独立性无从谈起，是本题唯一错误项。","correctReason":"制定平台规则遵循公开公平公正原则、对严重违法者停止提供服务、定期发布社会责任报告均为「守门人」平台的法定特别义务，故B、C、D正确。","wrongReason":"A：法律要求成立主要由外部成员组成的独立机构对个人信息保护情况进行监督，而不是主要由内部成员组成，内部成员主导会丧失独立性。","source":"《中华人民共和国个人信息保护法》第五十八条","keyPoint":"守门人义务：外部成员独立监督机构＋公开公平公正平台规则＋停服＋社会责任报告。"},{"id":"第一部分基础题-二、网络安全法律法规-多选题-9","no":9,"kind":"multi","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"多选题","stem":"某跨境电商企业收集用户消费记录（含住址、支付账户）后，未进行安全评 估即通过标准合同将数据传输至境外服务器。因境外合作方安全漏洞，部分用户 数据遭泄露，引发用户集体诉讼。根据《中华人民共和国个人信息保护法》，该 企业的违法行为包括哪些？（ ）","options":[{"key":"A","text":"未通过国家网信部门安全评估擅自跨境提供数据"},{"key":"B","text":"未采取必要措施确保境外接收方达到保护标准"},{"key":"C","text":"未向用户明示境外接收方信息并取得单独同意"},{"key":"D","text":"未及时删除数据且拒绝用户行使删除权"}],"answer":"ABC","analysis":"本题是场景题，考跨境提供个人信息的合规要件。该企业含住址、支付账户的消费记录属于个人信息，向境外提供须履行法定路径：应当经国家网信部门组织的安全评估的必须走安全评估，不能以标准合同替代；同时须向个人告知境外接收方名称、联系方式、处理目的方式、个人信息种类并取得单独同意，并采取必要措施保障境外接收方的处理活动达到法定保护标准。D项的删除权与及时删除义务在题干中没有事实依据，属于无中生有。","correctReason":"未经安全评估擅自出境、未确保境外接收方达到保护标准、未明示境外接收方信息并取得单独同意，分别违反《个人信息保护法》关于出境路径、安全保障和告知同意的要求，故A、B、C正确。","wrongReason":"D：题干只描述了违规出境与数据泄露，并未出现用户要求删除而被拒绝的事实，认定其未及时删除、拒绝用户行使删除权缺乏依据，属于无中生有。","source":"《中华人民共和国个人信息保护法》第三十八条第（一）项、第三十九条、第四十条、第五十五条","keyPoint":"出境看路径（评估/认证/标准合同）＋告知单独同意＋保障境外达到同等保护水平。"},{"id":"第一部分基础题-二、网络安全法律法规-多选题-10","no":10,"kind":"multi","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"多选题","stem":"小李在某购物平台注册时同意平台收集其浏览记录和购物偏好用于个性化 推荐。使用一段时间后，小李认为推荐不准确，决定撤回同意。平台告知小李： 撤回同意后，之前基于同意已进行的推荐活动无效，且以后不再向其提供任何服 务。关于平台的说法，下列评价正确的有（ ）。","options":[{"key":"A","text":"平台应提供便捷的撤回同意方式"},{"key":"B","text":"撤回同意不影响撤回前已进行的个人信息处理活动的效力"},{"key":"C","text":"平台可以因小李撤回同意而拒绝继续提供服务"},{"key":"D","text":"平台不得以撤回同意为由拒绝提供产品或者服务，但处理个人信息属于提供服 务所必需的除外"}],"answer":"ABD","analysis":"本题考查基于同意的处理规则。个人有权撤回同意，处理者应当提供便捷的撤回方式；撤回同意不影响撤回前基于同意已进行的处理活动的效力，即「向后生效」；同时处理者不得以个人撤回同意为由拒绝提供产品或服务，除非处理个人信息是提供产品或服务所必需的。C项把「不得拒绝」的例外当成原则，且夸大为完全停服，属于对法条的错误解读。","correctReason":"提供便捷撤回方式、撤回不影响此前处理活动效力、不得因撤回而拒绝提供产品或服务（必需情形除外），均是《个人信息保护法》的明文规定，故A、B、D正确。","wrongReason":"C：法律禁止以撤回同意为由拒绝提供产品或服务，只有处理个人信息属于提供产品或服务所必需时才可例外，平台不能笼统地宣称撤回同意后不再提供任何服务。","source":"《中华人民共和国个人信息保护法》第十五条、第十六条","keyPoint":"撤回同意便捷可行、不溯及既往；不得因此拒绝服务，必需情形除外。"},{"id":"第一部分基础题-二、网络安全法律法规-判断题-1","no":1,"kind":"judge","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"判断题","stem":"《中华人民共和国网络安全法》规定，网信部门和有关部门在履行网络安全 保护职责中获取的信息，只能用于维护网络安全的需要，不得用于其他用途。","options":[],"answer":"对","analysis":"该题考查监管部门在履职中获取信息的用途限制。网信部门和有关部门依法开展网络安全监督检查、事件调查时，会接触到网络运营者的日志、数据等大量敏感信息，法律为此划出红线：这些信息只能服务于维护网络安全这一目的。考点在于「职责与信息用途绑定」，防止监管信息被挪作他用或外泄。备选说法中「可以用于社会治理、案件办理等其他需要」都是干扰项，法律并未开这样的口子。","correctReason":"《网络安全法》明确规定网信部门和有关部门在履行网络安全保护职责中获取的信息只能用于维护网络安全的需要，不得用于其他用途，该表述与法条一致，故成立。","wrongReason":"","source":"《中华人民共和国网络安全法》第三十条","keyPoint":"监管履职获取的信息：仅限维护网络安全，不得他用"},{"id":"第一部分基础题-二、网络安全法律法规-判断题-2","no":2,"kind":"judge","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"判断题","stem":"根据《中华人民共和国网络安全法》，网络运营者应当采取数据分类、重要 数据备份和加密等措施，以履行网络安全保护义务。","options":[],"answer":"对","analysis":"该题考查网络运营者网络安全保护义务的具体技术措施。等级保护制度要求运营者按等级采取防范木马病毒、攻击入侵、数据泄露等技术措施，题干中的「数据分类、重要数据备份和加密」正是落实到数据层面的常见手段，也是密码技术在网络场景的典型应用。需要区分的是：数据分类分级是《数据安全法》的独立义务，而「重要数据备份和加密」在网安法语境下属于安全保护义务的技术措施。因此该表述成立。","correctReason":"《网络安全法》在网络安全等级保护制度中要求网络运营者采取防范攻击、数据泄露等危害网络安全行为的技术措施，数据分类、重要数据备份和加密属于其中应有之义，故表述成立。","wrongReason":"","source":"《中华人民共和国网络安全法》第二十一条","keyPoint":"等级保护技术措施：数据分类、重要数据备份、加密"},{"id":"第一部分基础题-二、网络安全法律法规-判断题-3","no":3,"kind":"judge","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"判断题","stem":"《中华人民共和国网络安全法》是我国第一部全面规范网络安全的基础性法 律。","options":[],"answer":"对","analysis":"该题考查《网络安全法》的法律地位。它在2016年11月7日通过、2017年6月1日施行，是我国网络安全领域第一部基础性、综合性法律，确立了网络空间主权、关键信息基础设施保护、个人信息保护等基本制度框架。其定位是「基础性法律」，即统帅后续单行立法。考生易与《数据安全法》《个人信息保护法》混淆，后两者分别2021年施行，属于数据与个人信息领域的专门法，并非网络安全基础法。故本题表述正确。","correctReason":"《网络安全法》是我国第一部全面规范网络空间安全管理的基础性法律，确立了网络安全领域的基本制度框架，故表述成立。","wrongReason":"","source":"《中华人民共和国网络安全法》","keyPoint":"网安法=我国首部网络安全基础性法律，2017.6.1施行"},{"id":"第一部分基础题-二、网络安全法律法规-判断题-4","no":4,"kind":"judge","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"判断题","stem":"某公司法定代表人王某的电子签名制作数据（私钥）存储在公司的服务器中， 公司IT 部门主管张某未经王某授权，使用该私钥签署了一份借款合同。根据《中 华人民共和国电子签名法》，该数据电文应视为王某发送。","options":[],"answer":"错","analysis":"该题考查数据电文归属规则。私钥是电子签名制作数据，其法律意义在于「仅有签名人可控」，一旦脱离签名人控制并被他人冒用，归属规则即被打破。《电子签名法》规定，数据电文由谁发送，需看是否由签名人本人发送、或经其授权的人发送、或由其信息系统自动发送。张某未经王某授权擅自用其私钥签合同，既非本人所为也非授权所为，属于典型越权冒用，不能视为王某发送。故该表述错误。","correctReason":"数据电文只有由签名人本人发送、经其授权的人发送或由其信息系统自动发送时才视为签名人发送；张某未经授权使用私钥，不符合归属要件，故不能视为王某发送。","wrongReason":"","source":"《中华人民共和国电子签名法》第九条、第十三条","keyPoint":"私钥须由签名人控制，未经授权使用不归属签名人"},{"id":"第一部分基础题-二、网络安全法律法规-判断题-5","no":5,"kind":"judge","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"判断题","stem":"某在线教育平台在课程结束后，仍继续保存所有学员的姓名、联系方式、学 习记录等全部个人信息。平台认为只要学员没有主动要求删除，就可以一直保存。","options":[],"answer":"错","analysis":"该题考查个人信息保存期限原则。个人信息处理必须遵循必要和最短期限原则：处理目的已实现、无法实现或为实现目的不再必要时，就应主动删除，而不是等用户开口。平台「没人要求就永久保存」的逻辑，把删除义务转嫁给用户，违反法定义务，也放大了泄露风险。此类超期留存属于违规处理行为，还可能面临监管处罚。故该表述错误。","correctReason":"个人信息保存期限应为实现处理目的所必要的最短时间，目的实现后处理者应当主动删除或匿名化，不能以学员未要求删除为由无限期保存，故表述不成立。","wrongReason":"","source":"《中华人民共和国个人信息保护法》第十九条、第四十七条","keyPoint":"保存期限=必要最短；目的达成即主动删除"},{"id":"第一部分基础题-二、网络安全法律法规-判断题-6","no":6,"kind":"judge","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"判断题","stem":"某境外电子认证服务提供者在境外签发的电子签名认证证书，经国务院信息 产业主管部门核准后，与依照《中华人民共和国电子签名法》设立的境内电子认 证服务提供者签发的证书具有同等的法律效力。","options":[],"answer":"对","analysis":"该题考查境外电子认证服务的证书效力。跨境电子认证的立法思路不是「一律不认」，而是设置核准通道：境外机构在境外签发的认证证书，经国务院信息产业主管部门（实践中为工业和信息化主管部门）核准后，可与境内依法设立的电子认证服务提供者签发的证书具有同等法律效力。考生易误认为境外证书一律无效，或误以为在境内使用即自动生效。关键在于「需经核准」这一前置条件。故本题表述正确。","correctReason":"《电子签名法》规定境外电子认证服务提供者在境外签发的证书，经国务院信息产业主管部门核准后，与境内依法设立的电子认证服务提供者签发的证书具有同等法律效力，故表述成立。","wrongReason":"","source":"《中华人民共和国电子签名法》第二十六条","keyPoint":"境外证书须经信产主管部门核准，方享同等效力"},{"id":"第一部分基础题-二、网络安全法律法规-判断题-7","no":7,"kind":"judge","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"判断题","stem":"依据《中华人民共和国个人信息保护法》，国家监管机构负责统筹协调个人 信息保护工作和相关监督管理工作。","options":[],"answer":"错","analysis":"该题考查个人信息保护工作的统筹协调主体。个保法确立的是「国家网信部门负责统筹协调」的体制机制，网信部门同时承担个人信息保护相关监督管理工作，各有关部门在各自职责范围内负责。题干把主体写成笼统的「国家监管机构」，主体表述不准确，属于典型的偷换主体陷阱。备考时要记住网信部门在个人信息保护、网络安全、数据安全三大领域均居统筹协调地位。故该表述错误。","correctReason":"《个人信息保护法》明确由国家网信部门负责统筹协调个人信息保护工作和相关监督管理工作，而非笼统的「国家监管机构」，故表述不成立。","wrongReason":"","source":"《中华人民共和国个人信息保护法》第六十条","keyPoint":"个保统筹协调主体=国家网信部门"},{"id":"第一部分基础题-二、网络安全法律法规-判断题-8","no":8,"kind":"judge","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"判断题","stem":"《中华人民共和国个人信息保护法》规定，除法律、行政法规另有规定外， 个人信息的保存期限应当为实现处理目的所预留的最充足时间。","options":[],"answer":"错","analysis":"该题考查保存期限的价值取向。个人信息保护的核心是目的限制与最小必要，保存期限应当是实现处理目的所必要的「最短时间」，而不是「最充足时间」——后者恰好把原则说反了。法律还要求超出期限后主动删除或匿名化处理。这类题目常通过把「最短」「最少」「必要」改成「最长」「最充足」「尽量多」来制造错误项，审题时要盯住程度副词。故该表述错误。","correctReason":"法律要求的保存期限是为实现处理目的所必要的最短时间，题干「最充足时间」与法定表述相反，故不成立。","wrongReason":"","source":"《中华人民共和国个人信息保护法》第十九条","keyPoint":"保存期限是最短必要时间，不是最充足时间"},{"id":"第一部分基础题-二、网络安全法律法规-判断题-9","no":9,"kind":"judge","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"判断题","stem":"网络运营者为用户办理网络接入、域名注册服务时，应当要求用户提供真实 身份信息；用户不提供真实身份信息的，网络运营者可以酌情为其提供有限服务。","options":[],"answer":"错","analysis":"该题考查网络实名制的执行刚性。为用户办理网络接入、域名注册、固定电话和移动电话等入网手续，或提供信息发布、即时通讯等服务时，运营者应当要求用户提供真实身份信息；用户不提供的，不得为其提供相关服务，这里没有「酌情」「有限服务」的缓冲空间。题干加上「可以酌情提供有限服务」，等于给实名制开了口子，与法条相悖。故该表述错误。","correctReason":"法律规定用户不提供真实身份信息的，网络运营者不得为其提供相关服务，不存在「酌情提供有限服务」的例外，故表述不成立。","wrongReason":"","source":"《中华人民共和国网络安全法》第二十四条","keyPoint":"实名制：不提供真实身份信息→不得提供服务"},{"id":"第一部分基础题-二、网络安全法律法规-判断题-10","no":10,"kind":"judge","part":"第一部分基础题","cat":"二、网络安全法律法规","type":"判断题","stem":"《中华人民共和国数据安全法》规定从事数据交易中介服务的机构提供服 务，应当要求数据提供方说明数据来源，审核交易双方的身份，并留存审核、交 易记录。","options":[],"answer":"对","analysis":"该题考查数据交易中介服务机构的审核与留痕义务。数据交易中介连接买卖双方，是数据来源合法性把关的关键环节，法律要求其做到三件事：要求数据提供方说明数据来源、审核交易双方身份、留存审核与交易记录。同时不得提供服务给无法说明合法来源的数据，否则要承担相应责任。这一制度设计正是为了遏制非法获取数据的交易链条。故本题表述正确。","correctReason":"《数据安全法》对从事数据交易中介服务的机构设定了来源说明、身份审核和记录留存三项义务，题干表述与法条一致，故成立。","wrongReason":"","source":"《中华人民共和国数据安全法》第三十三条","keyPoint":"数据交易中介三义务：查来源、审身份、留记录"},{"id":"第一部分基础题-三、密码管理规章制度-单选题-1","no":1,"kind":"single","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"单选题","stem":"依据《电子印章管理办法》，电子印章的法律效力如何规定？（ ）","options":[{"key":"A","text":"与实物印章效力相同"},{"key":"B","text":"效力低于实物印章"},{"key":"C","text":"仅在政务活动中有效"},{"key":"D","text":"需另行公证方有效"}],"answer":"A","analysis":"《电子印章管理办法》（国办发〔2025〕33号）确立了电子印章与实物印章的效力等同关系：符合办法规定的电子印章与实物印章具有同等法律效力，经电子签章的电子文件与加盖实物印章的纸质文件也具有同等效力。电子印章本质上是基于密码技术的特定格式数据，其法律效力来源于可靠电子签名制度，而非公证或行政特别授权。本题考的是效力层级这一核心制度定位。","correctReason":"办法明确赋予符合规定的电子印章与实物印章同等法律效力，不存在效力降格或需另行公证的问题。","wrongReason":"B：办法规定的是「同等法律效力」，并非低于实物印章；C：电子印章适用于政务、公共服务及各类经济社会活动，不限于政务活动；D：效力源于法定制度与可靠电子签名，不以另行公证为生效条件。","source":"《电子印章管理办法》第五条","keyPoint":"符合规定的电子印章与实物印章同等法律效力"},{"id":"第一部分基础题-三、密码管理规章制度-单选题-2","no":2,"kind":"single","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"单选题","stem":"依据《电子印章管理办法》，电子印章有效期截止时间不得晚于（ ）。","options":[{"key":"A","text":"实物印章有效期"},{"key":"B","text":"电子印章所有者电子签名认证证书有效期的截止时间"},{"key":"C","text":"电子印章制作管理单位规定的统一日期"},{"key":"D","text":"电子印章备案时间后一年"}],"answer":"B","analysis":"电子印章的有效性依赖其背后的电子签名认证证书，证书一旦失效，印章就无法再形成可靠的电子签名。因此办法要求电子印章的电子签名认证证书必须合法有效，且电子印章有效期的截止时间不超过印章所有者电子签名认证证书有效期的截止时间。这里考的是「印章有效期与证书有效期的绑定关系」，属于制作环节的强制性要求。","correctReason":"电子印章有效期截止时间不得超过（不晚于）其所有者电子签名认证证书有效期的截止时间，二者必须绑定。","wrongReason":"A：实物印章有效期与电子印章的有效期并无法律上的绑定关系；C：办法未授权制作管理单位统一规定有效期截止日；D：备案时间与印章有效期无关，不存在「备案后一年」的规则。","source":"《电子印章管理办法》第十六条","keyPoint":"印章有效期不得超出其电子签名认证证书有效期"},{"id":"第一部分基础题-三、密码管理规章制度-单选题-3","no":3,"kind":"single","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"单选题","stem":"依据《电子印章管理办法》，电子印章的本质是什么？（ ）","options":[{"key":"A","text":"实物印章的数字化图片"},{"key":"B","text":"基于密码技术和相关数字技术表征印章的特定格式数据"},{"key":"C","text":"单位内部使用的电子签名工具"},{"key":"D","text":"用于替代手写签名的图像文件"}],"answer":"B","analysis":"办法第二条对电子印章作了明确定义：它是基于密码技术和相关数字技术表征印章的特定格式数据，用于实现电子文件的可靠电子签名，内容包括印章图像数据、印章名称、印章所有者信息、电子签名认证证书以及关联的电子签名制作数据等。关键区别在于：电子印章是「数据」而不是图片，其核心是电子签名制作数据与证书。图像只是其外在表现形式之一。","correctReason":"电子印章在法律上的定义就是基于密码技术和相关数字技术表征印章的特定格式数据，用于实现可靠电子签名。","wrongReason":"A：数字化的印章图片只是图像数据，不构成电子印章，图片可被复制粘贴而无签名效力；C：电子印章可用于对外签署文件，不是单位内部的电子签名工具；D：它并非替代手写签名的图像文件，而是包含证书与电子签名制作数据的特定格式数据。","source":"《电子印章管理办法》第二条","keyPoint":"电子印章＝密码技术表征印章的特定格式数据"},{"id":"第一部分基础题-三、密码管理规章制度-单选题-4","no":4,"kind":"single","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"单选题","stem":"依据《电子印章管理办法》，电子印章使用管理应遵循的原则是（ ）。","options":[{"key":"A","text":"谁制作、谁负责"},{"key":"B","text":"谁持有、谁使用"},{"key":"C","text":"谁所有、谁控制，谁签章、谁负责"},{"key":"D","text":"谁备案、谁管理"}],"answer":"C","analysis":"办法第四章把电子印章使用管理的原则表述为「谁所有、谁控制，谁签章、谁负责」。前半句强调印章及其电子签名制作数据归所有者专有、由所有者实际控制，不能由制作管理单位代管代用；后半句强调签章行为的责任落到具体签章人身上，做到可追溯、可定责。这一原则是电子印章责任划分的基础。","correctReason":"使用管理原则的法定表述为「谁所有、谁控制，谁签章、谁负责」，兼顾了控制权归属与签章责任落实。","wrongReason":"A：制作管理单位只承担制作、备案职责，不因制作而承担用章责任；B：只讲持有使用，缺少「谁签章、谁负责」的责任归属；D：备案是制作管理单位的程序性义务，不是使用管理原则。","source":"《电子印章管理办法》第二十一条","keyPoint":"使用原则：谁所有、谁控制，谁签章、谁负责"},{"id":"第一部分基础题-三、密码管理规章制度-单选题-5","no":5,"kind":"single","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"单选题","stem":"依据《电子印章管理办法》，电子印章管理工作应遵循的原则不包括以下哪 项？（ ）","options":[{"key":"A","text":"统筹推进"},{"key":"B","text":"分级管理"},{"key":"C","text":"自主自愿"},{"key":"D","text":"安全可控"}],"answer":"C","analysis":"办法第四条规定电子印章管理工作遵循四项原则：统筹推进、分级管理、规范标准、安全可控。「自主自愿」并不在其中，因为电子印章管理涉及密码管理、认证服务和印章管理秩序，具有公共管理属性，需要统一规范和强制约束，而不是由各单位完全自愿选择。本题用「不包括」设问，考查对四项法定原则的准确记忆。","correctReason":"法定原则是统筹推进、分级管理、规范标准、安全可控，「自主自愿」不在其列。","wrongReason":"A：统筹推进是办法明确列出的管理原则之一；B：分级管理是办法明确列出的管理原则之一；D：安全可控是办法明确列出的管理原则之一。","source":"《电子印章管理办法》第四条","keyPoint":"管理原则：统筹推进、分级管理、规范标准、安全可控"},{"id":"第一部分基础题-三、密码管理规章制度-单选题-6","no":6,"kind":"single","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"单选题","stem":"依据《电子印章管理办法》，负责电子印章相关电子政务电子认证服务监督 管理的是（ ）","options":[{"key":"A","text":"国务院办公厅"},{"key":"B","text":"工业和信息化部"},{"key":"C","text":"国家密码管理局"},{"key":"D","text":"公安机关"}],"answer":"C","analysis":"办法按「谁主管谁负责」的思路分工：国家密码管理局负责电子印章有关密码管理工作，并对电子印章相关的电子政务电子认证服务实施监督管理；国务院办公厅负责推动政务服务等领域的互信互认；工业和信息化部负责对电子认证服务实施监督管理；公安机关负责打击违法犯罪。本题问的是电子政务电子认证服务的监督管理，落点在密码管理机构。","correctReason":"对电子印章相关的电子政务电子认证服务实施监督管理，是密码管理部门的法定职责。","wrongReason":"A：国务院办公厅负责依托全国一体化政务服务平台推动电子印章互信互认，不负责认证服务监管；B：工业和信息化部监管的是一般电子认证服务，不是电子政务电子认证服务；D：公安机关负责依法打击涉及电子印章的违法犯罪行为，不承担认证服务监管。","source":"《电子印章管理办法》第六条","keyPoint":"电子政务电子认证服务监管归密码管理部门"},{"id":"第一部分基础题-三、密码管理规章制度-单选题-7","no":7,"kind":"single","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"单选题","stem":"依据《电子印章管理办法》，电子印章的电子签名认证证书应由（ ）签 发。","options":[{"key":"A","text":"任意电子认证服务机构"},{"key":"B","text":"依法设立的电子政务电子认证服务机构或电子认证服务机构"},{"key":"C","text":"电子印章制作管理单位自行签发"},{"key":"D","text":"公安机关"}],"answer":"B","analysis":"电子印章之所以具有与实物印章同等的法律效力，前提是其电子签名认证证书合法有效。办法要求证书应由依法设立的电子政务电子认证服务机构（政务领域）或电子认证服务机构签发，两类机构的资质均须依法取得。制作管理单位、公安机关都不是认证机构，不能自行签发证书。","correctReason":"办法明确要求证书由依法设立的电子政务电子认证服务机构或者电子认证服务机构签发，且证书必须合法有效。","wrongReason":"A：必须是「依法设立」并具备相应资质的机构，并非任意电子认证服务机构；C：制作管理单位负责制作与备案，无权自行签发认证证书；D：公安机关负责打击涉电子印章违法犯罪，不签发认证证书。","source":"《电子印章管理办法》第十二条、第十六条","keyPoint":"证书须由依法设立的政务或一般电子认证机构签发"},{"id":"第一部分基础题-三、密码管理规章制度-单选题-8","no":8,"kind":"single","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"单选题","stem":"根据《商用密码检测机构管理办法》规定，国家级商用密码检测机构的资质 认定部门是（ ）。","options":[{"key":"A","text":"省级密码管理部门"},{"key":"B","text":"国家密码管理局"},{"key":"C","text":"国务院市场监管总局"},{"key":"D","text":"工业和信息化部"}],"answer":"B","analysis":"《商用密码检测机构管理办法》第三条规定，从事商用密码产品检测、网络与信息系统商用密码应用安全性评估等检测活动并出具具有证明作用数据、结果的机构，应当经国家密码管理局认定并取得商用密码检测机构资质；第四条进一步明确国家密码管理局负责全国检测机构的资质认定和监督管理，县级以上地方密码管理部门只负责本行政区域内的监督管理。","correctReason":"资质认定权集中在国家密码管理局，地方密码管理部门仅有监督管理职责，无认定权。","wrongReason":"A：省级密码管理部门可受托受理申请，但无权作出资质认定；C：市场监管总局负责检验检测机构资质认定的一般管理，不负责商用密码检测机构资质认定；D：工业和信息化部不属于商用密码检测机构资质认定部门。","source":"《商用密码检测机构管理办法》第三条、第四条","keyPoint":"商密检测机构资质认定权在国家密码管理局"},{"id":"第一部分基础题-三、密码管理规章制度-单选题-9","no":9,"kind":"single","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"单选题","stem":"检测机构需变更法人代表的，按照《商用密码检测机构管理办法》中的要求， 应（ ）。","options":[{"key":"A","text":"自行变更后备案"},{"key":"B","text":"提前30 日申请审批"},{"key":"C","text":"无需报备"},{"key":"D","text":"事后15 日内补交说明"}],"answer":"B","analysis":"办法把机构变更分为两类程序：资质证书延续须在有效期届满3个月前提出书面申请；而法定代表人、最高管理者、技术负责人、质量负责人、授权签字人等事项发生变更，属于事后报告类变更，机构应当自变更之日起30日内向国家密码管理局申请办理变更手续。注意区分「30日内申请变更」与「届满前3个月申请延续」两个不同时限。","correctReason":"法定代表人变更属于法定变更事项，应自变更之日起30日内向国家密码管理局申请办理变更手续。","wrongReason":"A：不是自行变更后简单备案，而是要在30日内向国家密码管理局申请办理变更手续；C：法定代表人变更属于法定变更事项，必须报办变更手续；D：办法未规定「事后15日内补交说明」这种程序。","source":"《商用密码检测机构管理办法》第十三条","keyPoint":"法定代表人变更：变更之日起30日内申请办理"},{"id":"第一部分基础题-三、密码管理规章制度-单选题-10","no":10,"kind":"single","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"单选题","stem":"若有检测机构超出指定范围开展检测的，依据《商用密码检测机构管理办法》 规定，应受到的处罚是（ ）。","options":[{"key":"A","text":"警告并限期整改"},{"key":"B","text":"暂停资质6 个月"},{"key":"C","text":"吊销资质证书"},{"key":"D","text":"处以违法所得3 倍罚款"}],"answer":"C","analysis":"办法第二十五条规定，检测机构超出批准范围开展商用密码检测的，由密码管理部门责令改正或者停止违法行为、给予警告、没收违法所得，可并处罚款；情节严重的，由国家密码管理局吊销其商用密码检测机构资质。四个选项中「吊销资质证书」正是该条针对情节严重情形设定的最重行政后果。","correctReason":"超出批准范围开展检测属于第二十五条列举的违法情形，情节严重的由国家密码管理局吊销其资质。","wrongReason":"A：警告并限期整改只是一般情节的处理，未体现该条对严重情节的处罚力度；B：办法未规定「暂停资质6个月」这种处罚种类；D：「违法所得3倍罚款」只是可以并处的罚款上限，不是该情形对应的最重处理。","source":"《商用密码检测机构管理办法》第二十五条","keyPoint":"超范围检测情节严重→吊销商用密码检测机构资质"},{"id":"第一部分基础题-三、密码管理规章制度-单选题-11","no":11,"kind":"single","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"单选题","stem":"《商用密码检测机构管理办法》规定，检测机构资质延续申请应在有效期届 满前（ ）提出。","options":[{"key":"A","text":"30 日"},{"key":"B","text":"60 日"},{"key":"C","text":"90 日"},{"key":"D","text":"180 日"}],"answer":"C","analysis":"检测机构资质证书有效期为5年。办法规定，有效期届满需要延续的，应当在有效期届满3个月前向国家密码管理局提出书面申请，国家密码管理局通过书面或现场形式审查后，在有效期届满前作出是否准予延续的决定。「3个月」约合90日，是延续申请的法定提前期，与法定代表人变更的30日时限不同。","correctReason":"资质延续应在证书有效期届满3个月前（即约90日前）提出书面申请，故90日为正确选项。","wrongReason":"A：30日是机构变更事项申请办理的时限，不是资质延续的时限；B：办法规定的是届满3个月前，不是60日；D：180日无对应规定。","source":"《商用密码检测机构管理办法》第十二条","keyPoint":"资质证书5年有效，届满3个月前申请延续"},{"id":"第一部分基础题-三、密码管理规章制度-单选题-12","no":12,"kind":"single","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"单选题","stem":"若检测机构泄露商用密码技术秘密的，那检测机构最高可能承担（ ）。","options":[{"key":"A","text":"公开道歉"},{"key":"B","text":"行政罚款"},{"key":"C","text":"吊销资质"},{"key":"D","text":"刑事责任"}],"answer":"D","analysis":"办法规定检测机构及其从业人员应当保守在工作中知悉的国家秘密、商业秘密和个人隐私；泄露在工作中知悉的商业秘密、个人隐私的，除警告、没收违法所得、罚款外，情节严重的可吊销资质。但题目问的是「最高可能承担」的责任，若泄露商用密码技术秘密构成犯罪，则要依照《密码法》《商用密码管理条例》追究刑事责任，刑事责任是责任阶梯的顶端。","correctReason":"泄露商用密码技术秘密构成犯罪的，依法追究刑事责任，这是法律后果中最重的一档。","wrongReason":"A：公开道歉并非该规章设定的法律责任形式；B：行政罚款只是行政处罚的一种，层级低于刑事责任；C：吊销资质属于行政处罚，虽严厉但仍低于刑事追责。","source":"《商用密码检测机构管理办法》第十五条、第二十五条；《中华人民共和国密码法》法律责任相关条款","keyPoint":"泄露商密技术秘密构成犯罪→追究刑事责任"},{"id":"第一部分基础题-三、密码管理规章制度-单选题-13","no":13,"kind":"single","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"单选题","stem":"某银行规划新一代核心业务系统时，需依据《商用密码应用安全性评估管理 办法》明确商用密码应用安全性评估的核心目标。该评估主要验证（ ）。","options":[{"key":"A","text":"密码产品价格合理性"},{"key":"B","text":"密码应用的合规性、正确性及有效性"},{"key":"C","text":"系统用户容量极限"},{"key":"D","text":"硬件设备物理防护强度"}],"answer":"B","analysis":"《商用密码应用安全性评估管理办法》第二条对「密评」作了定义：按照有关法律法规和标准规范，对网络与信息系统使用商用密码技术、产品和服务的合规性、正确性、有效性进行检测分析和评估验证。也就是说，密评查的不是钱、不是容量、也不是单纯的硬件防护，而是密码「用得对不对、合不合规、有没有真正起到保护作用」。","correctReason":"办法把密评的目标明确界定为对密码应用的合规性、正确性、有效性进行检测分析和评估验证。","wrongReason":"A：密评不审查密码产品价格，价格合理性属于采购管理范畴；C：用户容量极限属于性能指标，不是密评内容；D：密评关注的是密码技术应用效果，不以硬件物理防护强度为评估目标。","source":"《商用密码应用安全性评估管理办法》第二条","keyPoint":"密评三要素：合规性、正确性、有效性"},{"id":"第一部分基础题-三、密码管理规章制度-单选题-14","no":14,"kind":"single","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"单选题","stem":"省级医保信息系统被列为重要网络与信息系统，依据《商用密码应用安全性 评估管理办法》，其商用密码评估工作的全国主管部门是（ ）。","options":[{"key":"A","text":"国家卫生健康委员会"},{"key":"B","text":"国家密码管理局"},{"key":"C","text":"省级人民政府"},{"key":"D","text":"公安部网络安全保卫局"}],"answer":"B","analysis":"办法第三条规定，国家密码管理局负责管理全国的商用密码应用安全性评估工作；县级以上地方各级密码管理部门负责管理本行政区域的密评工作。系统属于哪个行业、由哪级政府建设，都不改变「全国主管部门是国家密码管理局」这一管理体制。本题考的是密评工作的管理体制与主管部门。","correctReason":"全国商用密码应用安全性评估工作由国家密码管理局统一管理，这是办法确立的全国性管理体制。","wrongReason":"A：国家卫生健康委员会是行业主管部门，不主管密评工作；C：省级人民政府不是密评主管部门；D：公安部负责网络安全相关监管，密评的全国主管部门是密码管理部门。","source":"《商用密码应用安全性评估管理办法》第三条","keyPoint":"国家密码管理局主管全国密评工作"},{"id":"第一部分基础题-三、密码管理规章制度-单选题-15","no":15,"kind":"single","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"单选题","stem":"某电力调度系统运营者依据《商用密码应用安全性评估管理办法》建设密码 保障系统时，必须遵守的原则是（ ）。","options":[{"key":"A","text":"先建设后补评估"},{"key":"B","text":"与主体系统同步规划、建设、运行"},{"key":"C","text":"每三年升级一次密码算法"},{"key":"D","text":"仅委托第三方运维"}],"answer":"B","analysis":"办法第六条要求，重要网络与信息系统的运营者应当使用商用密码进行保护，制定商用密码应用方案，配备必要的资金和专业人员，同步规划、同步建设、同步运行商用密码保障系统，并定期开展密评。「三同步」的意义在于把密码保障嵌入系统全生命周期，避免建设完成后再补救。","correctReason":"密码保障系统必须与主体系统同步规划、同步建设、同步运行，这是法定要求。","wrongReason":"A：「先建设后补评估」与三同步原则相悖，方案未通过密评不得作为建设依据；C：办法并未规定密码算法每三年升级一次；D：委托第三方运维与「同步规划建设运行」完全是两回事，不是本条原则。","source":"《商用密码应用安全性评估管理办法》第六条","keyPoint":"密码保障系统与主体系统同步规划、建设、运行"},{"id":"第一部分基础题-三、密码管理规章制度-单选题-16","no":16,"kind":"single","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"单选题","stem":"电子印章所有者在哪种情况下应当注销电子印章？（ ）","options":[{"key":"A","text":"电子印章载体损坏"},{"key":"B","text":"电子印章有效期到期"},{"key":"C","text":"单位更名、解散、撤销、被吊销等情形"},{"key":"D","text":"电子印章图像样式调整"}],"answer":"C","analysis":"注销针对的是印章所有者主体资格发生变化、不再适合继续持有电子印章的情形。办法规定，电子印章所有者发生更名、解散、撤销、被吊销、破产、分立、合并等情形，应当注销电子印章。而有效期到期、载体损坏或遗失、电子签名制作数据失密等，属于「重新制作」而非注销的适用情形。","correctReason":"所有者发生更名、解散、撤销、被吊销、破产、分立、合并等主体资格变化情形时，应当注销电子印章。","wrongReason":"A：载体损坏属于重新制作的情形，不是注销情形；B：有效期到期应提出重新制作，同样不是注销情形；D：图像样式调整不涉及印章存废。","source":"《电子印章管理办法》第十八条、第十九条","keyPoint":"主体资格变化（更名/解散/撤销/被吊销等）才注销"},{"id":"第一部分基础题-三、密码管理规章制度-单选题-17","no":17,"kind":"single","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"单选题","stem":"某电信运营商计费系统已运行3 年，依据《商用密码应用安全性评估管理办 法》，至少应多久开展一次商用密码应用安全性评估？（ ）","options":[{"key":"A","text":"每6 个月"},{"key":"B","text":"每年"},{"key":"C","text":"每18 个月"},{"key":"D","text":"每2 年"}],"answer":"B","analysis":"办法第九条规定，重要网络与信息系统建成运行后，其运营者应当自行或者委托商用密码检测机构每年至少开展一次商用密码应用安全性评估，确保商用密码保障系统正确有效运行；未通过的应当改造。「每年至少一次」是运行阶段的基线频率，题中系统已运行3年，仍须按年度开展。","correctReason":"建成运行后应当每年至少开展一次商用密码应用安全性评估，年度评估是法定最低频率。","wrongReason":"A：每6个月不是规章要求，严于法定最低要求；C：每18个月低于法定每年一次的频率；D：每2年同样不满足每年至少一次的强制要求。","source":"《商用密码应用安全性评估管理办法》第九条","keyPoint":"建成运行后每年至少开展一次密评"},{"id":"第一部分基础题-三、密码管理规章制度-单选题-18","no":18,"kind":"single","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"单选题","stem":"依据《电子印章管理办法》，负责依法打击涉及电子印章违法犯罪行为的部 门是（ ）。","options":[{"key":"A","text":"国家密码管理局"},{"key":"B","text":"工业和信息化部"},{"key":"C","text":"公安机关"},{"key":"D","text":"国务院办公厅"}],"answer":"C","analysis":"办法对电子印章相关部门作了清晰分工：国家密码管理局管密码工作与电子政务电子认证服务监管，工业和信息化部管电子认证服务监管，国务院办公厅推动互信互认，公安机关负责依法打击涉及电子印章的违法犯罪行为。打击犯罪属于公安的法定职责，涉及伪造、变造、冒用、盗用电子印章的，由公安依法处理。","correctReason":"依法打击涉及电子印章的违法犯罪行为，是公安机关的法定职责。","wrongReason":"A：国家密码管理局负责电子印章有关的密码管理工作，不负责打击犯罪；B：工业和信息化部负责对电子印章相关的电子认证服务实施监督管理；D：国务院办公厅负责推动电子印章互信互认，不承担打击犯罪职责。","source":"《电子印章管理办法》第九条","keyPoint":"打击涉电子印章违法犯罪＝公安机关职责"},{"id":"第一部分基础题-三、密码管理规章制度-单选题-19","no":19,"kind":"single","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"单选题","stem":"《商用密码应用安全性评估管理办法》生效前已运行的税务征管系统，应如 何管理？（ ）","options":[{"key":"A","text":"豁免评估"},{"key":"B","text":"每年开展评估"},{"key":"C","text":"重新设计密码架构"},{"key":"D","text":"仅做漏洞扫描"}],"answer":"B","analysis":"办法第二十条专门处理新旧衔接：本办法施行前正在建设的，要按第八条开展评估；本办法施行前已经投入运行的，运营者应当按照第九条规定开展商用密码应用安全性评估，即每年至少一次。存量系统不豁免、不只做漏洞扫描、也不要求推倒重来重新设计密码架构。","correctReason":"施行前已运行的重要网络与信息系统，应按办法第九条规定开展评估，即每年至少开展一次密评。","wrongReason":"A：办法没有对存量系统规定评估豁免；C：已运行系统按第九条定期评估即可，不要求重新设计密码架构；D：漏洞扫描不能替代商用密码应用安全性评估。","source":"《商用密码应用安全性评估管理办法》第二十条","keyPoint":"施行前已运行系统按第九条每年评估，不豁免"},{"id":"第一部分基础题-三、密码管理规章制度-单选题-20","no":20,"kind":"single","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"单选题","stem":"某国企自行开展商用密码应用安全性评估后，依据《商用密码应用安全性评 估管理办法》，报告需由（ ）签署生效。","options":[{"key":"A","text":"外部审计师签字并加盖单位公章"},{"key":"B","text":"密码或网络安全负责人签字并加盖单位公章"},{"key":"C","text":"法务总监签字并加盖单位公章"},{"key":"D","text":"IT 部门经理签字并加盖单位公章"}],"answer":"B","analysis":"办法第十三条规定了自行开展密评的条件：运营者须具备相适应的设备设施、管理制度、专业人员与专业能力；形成的评估报告应符合国家标准、行业标准和有关规定，并由本单位密码或者网络安全负责人签字确认并加盖本单位公章。签字人必须是懂密码或网络安全的负责人，而非审计师、法务或普通IT经理。","correctReason":"自行开展密评形成的报告，应由本单位密码或者网络安全负责人签字确认并加盖本单位公章。","wrongReason":"A：外部审计师不是办法指定的报告签署人，自行评估报告由本单位负责人签字；C：法务总监不负责密码或网络安全，无权签字确认；D：办法指定的是密码或者网络安全负责人，一般IT部门经理不等同于该角色。","source":"《商用密码应用安全性评估管理办法》第十三条","keyPoint":"自行密评报告由密码/网络安全负责人签字＋单位公章"},{"id":"第一部分基础题-三、密码管理规章制度-单选题-21","no":21,"kind":"single","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"单选题","stem":"关键信息基础设施运营者采购商用密码产品和服务，根据《关键信息基础设 施商用密码使用管理规定》规定，应优先选择（ ）。","options":[{"key":"A","text":"自主创新产品"},{"key":"B","text":"通过安全认证的产品"},{"key":"C","text":"国际通用标准产品"},{"key":"D","text":"价格最低的产品"}],"answer":"B","analysis":"《关键信息基础设施商用密码使用管理规定》第九条要求，关键信息基础设施使用的商用密码产品、服务应当经检测认证合格，使用的密码算法、密码协议、密钥管理机制等商用密码技术应当通过国家密码管理部门审查鉴定。合格检测认证是使用的前置条件，因此采购时必然优先（实际上只能）选择通过检测认证的产品和服务。","correctReason":"关键信息基础设施使用的商用密码产品、服务必须经检测认证合格，采购时应选择通过安全（检测）认证的产品。","wrongReason":"A：「自主创新」是产业导向，不是本规定对采购设定的合规门槛；C：国际通用标准产品未经我国商用密码检测认证，不能作为合规选择；D：价格最低与合规性无关，未通过检测认证的产品不得使用。","source":"《关键信息基础设施商用密码使用管理规定》第九条","keyPoint":"关基密码产品服务必须经检测认证合格方可使用"},{"id":"第一部分基础题-三、密码管理规章制度-单选题-22","no":22,"kind":"single","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"单选题","stem":"根据《关键信息基础设施商用密码使用管理规定》规定，关键信息基础设施 密码应用安全性评估的最低频率要求是（ ）。","options":[{"key":"A","text":"每年一次"},{"key":"B","text":"每两年一次"},{"key":"C","text":"上线前评估一次"},{"key":"D","text":"发生重大变更时评估"}],"answer":"A","analysis":"该规定第十三条与《商用密码应用安全性评估管理办法》第九条保持一致：关键信息基础设施建成运行后，运营者应当自行或者委托商用密码检测机构每年至少开展一次商用密码应用安全性评估，确保商用密码正确使用和保障系统有效运行。上线前评估与重大变更时评估是额外要求，不能替代年度评估。","correctReason":"规定明确建成运行后每年至少开展一次商用密码应用安全性评估，年度评估即为最低频率要求。","wrongReason":"B：每两年一次低于法定「每年至少一次」的要求；C：上线前评估是运行前的必经环节，不等于运行后的定期评估；D：重大变更时评估是额外触发条件，不能替代每年一次的定期评估。","source":"《关键信息基础设施商用密码使用管理规定》第十三条","keyPoint":"关基密评：运行前评估＋建成后每年至少一次"},{"id":"第一部分基础题-三、密码管理规章制度-单选题-23","no":23,"kind":"single","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"单选题","stem":"根据《关键信息基础设施商用密码使用管理规定》规定，关键信息基础设施 密码保护的第一责任主体是（ ）。","options":[{"key":"A","text":"技术运维团队"},{"key":"B","text":"运营单位主要负责人"},{"key":"C","text":"密码服务提供商"},{"key":"D","text":"行业监管部门"}],"answer":"B","analysis":"规定第六条明确要求运营者加强关键信息基础设施商用密码使用制度保障，建立使用、应急处置、重大事件报告等管理制度，并规定「运营者的主要负责人对关键信息基础设施商用密码使用管理负总责」，负责商用密码使用和涉及商用密码的重大网络安全事件处置工作。这就是「第一责任主体」的规范依据。","correctReason":"规定明确运营者的主要负责人对关键信息基础设施商用密码使用管理负总责，是责任的第一承担者。","wrongReason":"A：技术运维团队承担具体技术工作，不是责任第一主体；C：密码服务提供商是外部服务方，不承担运营者的主体责任；D：行业监管部门履行监督管理职责，不是密码保护的第一责任主体。","source":"《关键信息基础设施商用密码使用管理规定》第六条","keyPoint":"运营者主要负责人对关基密码使用管理负总责"},{"id":"第一部分基础题-三、密码管理规章制度-单选题-24","no":24,"kind":"single","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"单选题","stem":"运营者委托第三方开展密码应用评估时，根据《关键信息基础设施商用密码 使用管理规定》规定，受托方必须具备（ ）。","options":[{"key":"A","text":"网络安全等级保护资质"},{"key":"B","text":"商用密码检测机构资质"},{"key":"C","text":"ISO27001 认证"},{"key":"D","text":"风险管理体系认证"}],"answer":"B","analysis":"规定第十一条、第十二条、第十三条均规定，运营者对商用密码应用方案以及运行前、建成后的商用密码应用安全性评估，可以自行开展，也可以委托「商用密码检测机构」开展。依据《商用密码检测机构管理办法》，向社会出具具有证明作用的密评数据、结果的机构须经国家密码管理局认定取得商用密码检测机构资质，因此受托方必须具备该资质。","correctReason":"规章明确委托对象为商用密码检测机构，而该类机构须经国家密码管理局认定取得资质，故受托方必须持有商用密码检测机构资质。","wrongReason":"A：网络安全等级保护资质不能替代商用密码检测机构资质；C：ISO27001是信息安全管理体系认证，与密评业务资质无关；D：风险管理体系认证同样不能作为出具密评结果的资质依据。","source":"《关键信息基础设施商用密码使用管理规定》第十一条至第十三条；《商用密码检测机构管理办法》第三条","keyPoint":"受托做密评须有商用密码检测机构资质"},{"id":"第一部分基础题-三、密码管理规章制度-单选题-25","no":25,"kind":"single","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"单选题","stem":"根据《关键信息基础设施商用密码使用管理规定》规定，密码应用方案应包 括的核心内容是（ ）。","options":[{"key":"A","text":"预算分配表"},{"key":"B","text":"密码技术路线和实施计划"},{"key":"C","text":"供应商名单"},{"key":"D","text":"员工培训记录"}],"answer":"B","analysis":"规定第十一条要求，关键信息基础设施规划阶段，运营者应当根据商用密码应用需求制定商用密码应用方案，规划商用密码保障系统并纳入关键信息基础设施安全规划统筹部署。方案未通过商用密码应用安全性评估的，不得作为建设依据。方案的技术内核就是密码技术路线和实施计划，预算、供应商名单、培训记录属于配套管理材料。","correctReason":"商用密码应用方案的核心是密码技术路线与实施计划，方案须通过密评方可作为建设依据。","wrongReason":"A：预算分配表属于经费保障材料，不是方案的核心内容；C：供应商名单属采购环节信息，不构成密码应用方案的核心；D：员工培训记录属于人员保障材料，与方案核心内容无关。","source":"《关键信息基础设施商用密码使用管理规定》第十一条","keyPoint":"密码应用方案核心＝密码技术路线＋实施计划"},{"id":"第一部分基础题-三、密码管理规章制度-单选题-26","no":26,"kind":"single","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"单选题","stem":"发生密码安全事件后，根据《关键信息基础设施商用密码使用管理规定》规 定，运营者向监管部门报告的最长时限是（ ）。","options":[{"key":"A","text":"1 小时"},{"key":"B","text":"12 小时"},{"key":"C","text":"24 小时"},{"key":"D","text":"72 小时"}],"answer":"A","analysis":"规定第四条要求，关键信息基础设施发生涉及商用密码的重大网络安全事件或者发现重大网络安全威胁时，保护工作部门应当及时向国家密码管理部门、国家网信部门、国务院公安部门报告，并指导运营者开展应急处置。此类事件的时效要求极严，报告时限按小时计，四个选项中最短的一小时对应最紧急的报告要求。","correctReason":"涉密码重大网络安全事件报告时限以小时计，最短时限为1小时，强调「及时报告」的刚性。","wrongReason":"B：12小时超出了该类重大事件的报告时限要求；C：24小时更为宽松，不符合及时报告要求；D：72小时通常用于其他领域数据/安全事件报告，不是本题情形的最长时限。","source":"《关键信息基础设施商用密码使用管理规定》第四条","keyPoint":"涉密码重大安全事件报告时限以小时计（最短1小时）"},{"id":"第一部分基础题-三、密码管理规章制度-单选题-27","no":27,"kind":"single","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"单选题","stem":"《电子印章管理办法》正式实施日期为（ ）。","options":[{"key":"A","text":"2025 年9 月27 日"},{"key":"B","text":"2025 年10 月1 日"},{"key":"C","text":"2026 年1 月1 日"},{"key":"D","text":"印发之日起"}],"answer":"D","analysis":"《电子印章管理办法》由国务院办公厅以国办发〔2025〕33号印发，印发日期为2025年9月27日；办法第三十八条明确规定「本办法自印发之日起施行」。因此生效时间不是2025年10月1日或2026年1月1日这类固定日期，而是随印发同步生效，考查的是对施行条款的准确记忆。","correctReason":"办法第三十八条规定自印发之日起施行，印发日期为2025年9月27日，故「印发之日起」为正确表述。","wrongReason":"A：2025年9月27日只是印发日期，办法并未以该日期作为施行日起算的表述选项；B：2025年10月1日不是本办法的施行日期；C：2026年1月1日不是本办法的施行日期。","source":"《电子印章管理办法》第三十八条","keyPoint":"电子印章管理办法自印发之日起施行"},{"id":"第一部分基础题-三、密码管理规章制度-单选题-28","no":28,"kind":"single","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"单选题","stem":"运营者跨境提供重要数据时，根据《关键信息基础设施商用密码使用管理规 定》规定，需依法开展的审查是（ ）。","options":[{"key":"A","text":"密码应用安全性评估"},{"key":"B","text":"网络安全审查"},{"key":"C","text":"个人信息影响评估"},{"key":"D","text":"商业秘密审核"}],"answer":"B","analysis":"规定第九条要求，运营者采购涉及商用密码的网络产品和服务，影响或者可能影响国家安全的，应当按照《网络安全审查办法》进行网络安全审查；第二十条还对使用未经安全审查或审查未通过的产品的行为设定了处罚。跨境提供重要数据涉及国家安全，需依法开展的审查是网络安全审查，而非密评、个人信息影响评估或商业秘密审核。","correctReason":"涉及国家安全的数据跨境与产品服务采购，需按《网络安全审查办法》开展网络安全审查，这是本规定指向的审查类型。","wrongReason":"A：密码应用安全性评估针对的是密码应用的合规性、正确性、有效性，不是数据出境审查；C：个人信息影响评估针对个人信息处理风险，不能替代网络安全审查；D：商业秘密审核不存在法定审查制度。","source":"《关键信息基础设施商用密码使用管理规定》第九条；《数据安全法》《网络数据安全管理条例》数据出境相关规定","keyPoint":"影响国家安全的数据跨境→依法开展网络安全审查"},{"id":"第一部分基础题-三、密码管理规章制度-单选题-29","no":29,"kind":"single","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"单选题","stem":"根据《关键信息基础设施商用密码使用管理规定》规定，在密码应用改造项 目验收时，必须提交的材料是（ ）。","options":[{"key":"A","text":"用户满意度调查报告"},{"key":"B","text":"密码应用安全性评估报告"},{"key":"C","text":"供应商服务承诺书"},{"key":"D","text":"项目决算审计报告"}],"answer":"B","analysis":"规定第十二条要求，关键信息基础设施运行前，运营者应当自行或者委托商用密码检测机构开展商用密码应用安全性评估；未通过评估的应当改造，改造期间不得投入运行。可见密评报告是系统能否投运的凭据，因此在密码应用改造项目验收时，必须提交的材料就是密码应用安全性评估报告。","correctReason":"密评通过是系统投运的前置条件，故改造项目验收时必须提交密码应用安全性评估报告作为合规凭据。","wrongReason":"A：用户满意度调查报告属于服务质量评价材料，不是运行前的强制凭据；C：供应商服务承诺书不能证明密码应用合规有效；D：项目决算审计报告属财务材料，与密码应用合规性无关。","source":"《关键信息基础设施商用密码使用管理规定》第十二条","keyPoint":"未通过密评不得投运，验收必备密评报告"},{"id":"第一部分基础题-三、密码管理规章制度-单选题-30","no":30,"kind":"single","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"单选题","stem":"根据《电子印章管理办法》，某单位（组织）申请制作电子印章时，应当提 交的材料中不包括以下哪项？（ ）","options":[{"key":"A","text":"电子印章申请通过的相关证明材料"},{"key":"B","text":"单位（组织）的设立批准文件或者设立登记证件"},{"key":"C","text":"制作电子印章的相关数据和信息"},{"key":"D","text":"电子印章所有者的电子签名认证证书"}],"answer":"D","analysis":"办法第十四条列举了单位（组织）申请制作电子印章应当提交的材料：电子印章申请通过的相关证明材料；单位（组织）的设立批准文件或者设立登记证件；制作电子印章的相关数据和信息；制作管理单位规定提交的其他材料，并鼓励通过数据共享方式获取。电子印章所有者的电子签名认证证书属于印章的组成内容与制作要求，不是申请人提交的材料。","correctReason":"办法列举的申请材料中不包含电子印章所有者的电子签名认证证书，该证书是印章的构成要素而非申请材料。","wrongReason":"A：电子印章申请通过的相关证明材料是第十四条明确列举的申请材料之一；B：单位（组织）的设立批准文件或者设立登记证件是明确列举的申请材料；C：制作电子印章的相关数据和信息同样是明确列举的申请材料。","source":"《电子印章管理办法》第十四条、第十六条","keyPoint":"申请材料三类主体文件，不含认证证书本身"},{"id":"第一部分基础题-三、密码管理规章制度-单选题-31","no":31,"kind":"single","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"单选题","stem":"省级医保平台电子认证服务机构申请资质时，依据《电子政务电子认证服务 管理办法》，无需满足哪项条件？（ ）","options":[{"key":"A","text":"30 名以上专业人员"},{"key":"B","text":"外资控股股权结构"},{"key":"C","text":"符合国标的认证系统"},{"key":"D","text":"企业法人资格"}],"answer":"B","analysis":"本题问资质认定法定条件中「不属于」的一项。办法第六条列出七项条件：企业法人或者事业单位法人资格、与业务相适应的资金和运营场所、在境内设置且符合国家有关密码标准的电子认证服务系统、30名以上专业人员、长期服务能力、安全管理体系。可见法人资格、国标系统、30名以上专业人员都是明文硬条件。外资控股股权结构从来不是准入门槛，办法第十一条走的是另一条路：外商投资该服务影响或者可能影响国家安全的，依法进行外商投资安全审查。","correctReason":"B项外资控股股权结构不属于第六条列举的资质认定条件；办法对外资的处理方式是依法开展外商投资安全审查，而不是把股权结构设为申请门槛。","wrongReason":"A：办法第六条第（五）项明确要求具有30名以上专业技术人员、运营管理人员、安全管理人员和客户服务人员等专业人员，属于必备条件；C：第六条第（四）项要求具有在境内设置、符合国家有关密码标准的电子认证服务系统等设备设施，属于法定条件；D：第六条第（一）项要求具有企业法人或者事业单位法人资格，属于法定条件。","source":"《电子政务电子认证服务管理办法》第六条、第十一条","keyPoint":"资质七条件含30名专业人员、境内国标系统、法人资格；外资走安全审查"},{"id":"第一部分基础题-三、密码管理规章制度-单选题-32","no":32,"kind":"single","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"单选题","stem":"依据《电子政务电子认证服务管理办法》，电子政务电子认证服务机构拟暂 停或者终止电子政务电子认证服务的，应当在暂停或者终止服务（ ）向国家密 码管理局报告。","options":[{"key":"A","text":"30 日前"},{"key":"B","text":"60 日前"},{"key":"C","text":"90 日前"},{"key":"D","text":"120 日前"}],"answer":"B","analysis":"这道题考退出机制中的报告时限。办法第二十九条规定，机构拟暂停或者终止电子政务电子认证服务的，应当在暂停或者终止服务60日前向国家密码管理局报告，并与其他机构就业务承接进行协商、作出妥善安排；协商不成的可申请国家密码管理局安排承接。设定60日提前期是为证书用户迁移和业务承接留缓冲，避免服务中断导致政务活动中的证书失效。两处易混：报告对象是国家密码管理局，不是住所地省级密码管理部门；年度工作报告是每年1月15日前报送，不是1月30日。","correctReason":"第二十九条第一款规定暂停或者终止服务应当在60日前向国家密码管理局报告，故60日前成立。","wrongReason":"A：30日是变更手续、委托注册备案、业务规则变更备案等事项的期限，不是暂停或终止服务的报告期；C：90日在资质有效期5年、延续申请60日前等制度中均无对应规定，属干扰项；D：120日同样没有对应条款，且时限越长越不利于保障用户平稳过渡。","source":"《电子政务电子认证服务管理办法》第二十九条","keyPoint":"暂停或终止服务提前60日报国家密码管理局，并协商业务承接"},{"id":"第一部分基础题-三、密码管理规章制度-单选题-33","no":33,"kind":"single","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"单选题","stem":"某认证机构未公布投诉渠道，依据《电子政务电子认证服务管理办法》，可 能面临的罚款金额是（ ）。","options":[{"key":"A","text":"5 千-5 万元"},{"key":"B","text":"1 万-10 万元"},{"key":"C","text":"违法所得1-3 倍"},{"key":"D","text":"30 万元以上"}],"answer":"B","analysis":"本题考查未建立投诉处理机制的处罚幅度。办法第二十七条要求机构建立完善投诉处理机制、公布投诉方式、畅通投诉渠道并及时受理处理投诉；第三十九条把「未建立投诉处理机制、公布投诉方式，或者未及时受理、妥善处理有关投诉事项」列为较轻违法情形，先责令改正，逾期未改正或者改正后仍不符合要求的，处1万元以上10万元以下罚款。要区分第三十八条的严重情形：违法所得30万元以上的可并处违法所得1倍以上3倍以下罚款，情节严重可停业整顿直至吊销资质。","correctReason":"未公布投诉方式属于第三十九条列举的较轻违法情形，逾期未改正的处1万元以上10万元以下罚款，故B项正确。","wrongReason":"A：5千至5万元不是本办法的罚款幅度，属于拼凑数字；C：违法所得1至3倍罚款对应第三十八条的严重违法行为，且以违法所得30万元以上为前提，不适用于投诉渠道问题；D：30万元以上是第三十八条「没有违法所得或者违法所得不足30万元」时的另一档罚款，也不是本题情形。","source":"《电子政务电子认证服务管理办法》第二十七条、第三十九条","keyPoint":"未公布投诉方式→责令改正，逾期不改罚1万至10万元"},{"id":"第一部分基础题-三、密码管理规章制度-单选题-34","no":34,"kind":"single","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"单选题","stem":"国家密码管理局委托技术评审时，依据《电子政务电子认证服务管理办法》， 专家需对什么负责？（ ）","options":[{"key":"A","text":"评审费用结算"},{"key":"B","text":"结论真实性及符合性"},{"key":"C","text":"申请人商业机密"},{"key":"D","text":"行政许可决定"}],"answer":"B","analysis":"本题考查技术评审中专家与专业机构的责任边界。办法第十条规定，国家密码管理局根据技术评审需要和专业要求，可以委托专业机构或者组织专家实施技术评审，评审内容包括电子认证服务系统安全性审查、运营场所与设备设施和管理体系建设实地查勘、专业人员能力考核等；同条明确专业机构和专家应当独立、公正、科学、诚信地开展技术评审活动，对技术评审结论的真实性、符合性负责，并承担相应法律责任。行政许可决定权始终在国家密码管理局，专家只出技术结论。","correctReason":"第十条明确规定专业机构和专家应当对技术评审结论的真实性、符合性负责并承担相应法律责任，故B项正确。","wrongReason":"A：评审费用的结算属于委托事务性安排，不是法定的责任内容；C：保密义务由第二十三条针对机构的保密制度规定，且「对商业秘密负责」表述不准确，专家责任的落点是评审结论；D：行政许可决定由国家密码管理局依法作出，专家无权作出也不对许可决定负责。","source":"《电子政务电子认证服务管理办法》第十条","keyPoint":"专家对技术评审结论的真实性、符合性负责；许可决定权在管理局"},{"id":"第一部分基础题-三、密码管理规章制度-单选题-35","no":35,"kind":"single","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"单选题","stem":"某认证机构将证书注册业务委托给A 公司，A 公司又以自身名义委托B 公 司，依据《电子政务电子认证服务管理办法》，责任主体是（ ）。","options":[{"key":"A","text":"A 公司"},{"key":"B","text":"原认证机构"},{"key":"C","text":"B 公司"},{"key":"D","text":"三方共担"}],"answer":"B","analysis":"本题考证书注册业务委托链条中的责任归属。办法第二十五条允许认证服务机构委托其他机构开展证书注册业务，但设了三道约束：委托协议签订之日起30日内向受委托机构住所地省级密码管理部门备案；机构应当对受委托机构的注册业务行为进行监督，并对该行为的后果承担法律责任；受委托机构只能在委托范围内、以委托它的认证服务机构名义开展业务，不得再委托其他机构或者个人。对外责任始终归于原认证机构，不能通过层层转委托转移出去。","correctReason":"第二十五条第二款规定认证服务机构应当监督受委托机构的注册业务行为，并对该行为的后果承担法律责任，因此责任主体是原认证机构B项。","wrongReason":"A：A公司是受委托机构，其擅自转委托本身违法，但不对外承担认证服务的最终法律责任；C：B公司处在转委托链条末端，与认证服务机构之间没有合法的委托关系；D：三方共担没有法律依据，法律明确把责任归于认证服务机构一方。","source":"《电子政务电子认证服务管理办法》第二十五条、第三十八条","keyPoint":"注册业务可委托，但不得再转委托，责任由认证服务机构承担"},{"id":"第一部分基础题-三、密码管理规章制度-多选题-1","no":1,"kind":"multi","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"多选题","stem":"以下哪些属于网络数据处理者在按照有关部门要求委托评估机构开展风险 评估时应履行的义务？（ ）","options":[{"key":"A","text":"为评估机构提供必要的访问权限支持"},{"key":"B","text":"在限定时间内完成风险评估"},{"key":"C","text":"在完成评估后将风险评估报告报送有关部门"},{"key":"D","text":"对风险评估中发现的问题进行整改并报送整改情况"}],"answer":"ABCD","analysis":"本题考查《网络数据安全风险评估办法》中网络数据处理者配合有关部门委托评估时的义务清单。按有关部门要求委托通过认证的机构开展风险评估，处理者既要保障评估能落地（给权限、给材料、按期限完成），也要把结果环节走完（报送报告、对问题整改并反馈）。这类题目考的是「评估不是交差，而是一个闭环流程」：事前配合、事中按期、事后报告加整改。易混点是把「配合义务」只理解成提供资料，漏掉报送与整改这两项收尾义务。","correctReason":"提供必要访问权限支持、限定时间内完成评估、完成评估后报送报告、对发现问题整改并报送整改情况，都是处理者在委托评估中应履行的法定义务。","wrongReason":"A：易被误认为只是「配合」而非义务，实则提供必要访问权限支持是评估得以开展的前提性法定义务；B：易被误读为对评估机构的期限要求，实则按限定时间完成评估是处理者自身的义务；C、D：易被认为属于主管部门或评估机构职责而漏选，实则报送风险评估报告、对发现问题整改并报送整改情况均须由网络数据处理者完成。本题四项均正确，无错误选项。","source":"《网络数据安全风险评估办法》","keyPoint":"委托评估四步闭环：给权限、按期查、报报告、改问题。"},{"id":"第一部分基础题-三、密码管理规章制度-多选题-2","no":2,"kind":"multi","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"多选题","stem":"《网络数据安全风险评估办法》规定，省级以上网信部门、电信主管部门、 公安机关和其他有关部门在哪些情形下可以要求网络数据处理者委托通过认证 的评估机构开展风险评估？（ ）","options":[{"key":"A","text":"网络数据处理活动存在较大安全风险，可能危害国家安全、公共利益的"},{"key":"B","text":"发生网络数据安全事件，导致重要数据或者大规模个人信息泄露、被窃取的"},{"key":"C","text":"网络数据处理者认为自身风险较高的"},{"key":"D","text":"有关部门规定的其他情形"}],"answer":"ABD","analysis":"本题考查什么样的情形下，省级以上网信、电信、公安等部门可以「点名」要求网络数据处理者委托通过认证的评估机构做风险评估。启动条件是法定且客观的：日常处理活动存在较大安全风险、可能危害国家安全或公共利益，或者已经发生数据安全事件并造成重要数据、大规模个人信息泄露被窃取，以及有关部门规定的兜底情形。C是典型的干扰项，把「企业自己觉得风险高」当成触发条件，混淆了「自主评估」与「被要求委托评估」两种情形。","correctReason":"存在较大安全风险可能危害国家安全公共利益、发生重要数据或大规模个人信息泄露被窃取的事件、有关部门规定的其他情形，均属法定可要求委托评估的情形。","wrongReason":"C：网络数据处理者自认为风险较高属于企业自主判断，不是有关部门要求其委托评估的法定情形，是否要求评估由主管部门决定。","source":"《网络数据安全风险评估办法》","keyPoint":"被要求委托评估三情形：风险大、已出事、有兜底。"},{"id":"第一部分基础题-三、密码管理规章制度-多选题-3","no":3,"kind":"multi","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"多选题","stem":"根据《网络数据安全风险评估办法》，评估机构开展网络数据安全风险评估 时应当遵守哪些基本要求？（ ）","options":[{"key":"A","text":"遵守法律法规"},{"key":"B","text":"公正客观地作出风险判断"},{"key":"C","text":"对所出具的风险评估报告真实性、有效性、完整性负责"},{"key":"D","text":"根据网络数据处理者的要求灵活调整评估结论"}],"answer":"ABC","analysis":"本题考查评估机构执业的基本要求，核心是「独立性＋责任自负」。评估机构必须依法依规开展评估、公正客观作出风险判断，并对报告的真实性、有效性、完整性承担相应责任，这是数据安全评估制度能取信于监管的前提。D把评估机构写成「按客户要求出结论」，彻底违背了第三方评估的独立性和客观性，属于原则性错误选项。记住一句话：评估机构可以对方法灵活，对结论不能灵活。","correctReason":"遵守法律法规、公正客观作出风险判断、对报告真实性有效性完整性负责，均为评估机构开展风险评估的法定基本要求。","wrongReason":"D：按网络数据处理者的要求调整评估结论，丧失了第三方评估的独立性与客观性，与评估机构应尽的公正客观义务直接冲突。","source":"《网络数据安全风险评估办法》","keyPoint":"评估机构：依法评估、结论客观、对报告真实性负责。"},{"id":"第一部分基础题-三、密码管理规章制度-多选题-4","no":4,"kind":"multi","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"多选题","stem":"以下关于网络数据安全风险评估报告编制与保存的说法，正确的有：","options":[{"key":"A","text":"重要数据处理者编制的风险评估报告至少保存3 年"},{"key":"B","text":"一般数据处理者可以参照国家标准编制风险评估报告"},{"key":"C","text":"重要数据处理者应当严格按照国家标准编制风险评估报告，不得参照行业规 定"},{"key":"D","text":"风险评估报告需由评估机构主要负责人和评估负责人签字并加盖公章"}],"answer":"ABD","analysis":"本题考查评估报告的编制依据与保存要求。重要数据处理者的风险评估报告要按国家标准编制，且至少保存3年，以备主管部门检查核验；报告还需由评估机构主要负责人和评估负责人签字并加盖公章，体现「谁签字谁负责」。C错在把国家标准的适用写成排他性要求，法律并未禁止重要数据处理者参照行业规定，相反行业规定往往是对国家标准的细化落实，二者是衔接关系而非对立关系。","correctReason":"重要数据处理者报告至少保存3年、一般数据处理者可参照国家标准编制报告、报告须由评估机构主要负责人和评估负责人签字并加盖公章，说法均正确。","wrongReason":"C：把「严格按国家标准编制」曲解为「不得参照行业规定」，属绝对化表述；行业规定与国家标准的适用并不互斥，该说法无依据。","source":"《网络数据安全风险评估办法》","keyPoint":"报告：签字盖章、重要数据至少存3年。"},{"id":"第一部分基础题-三、密码管理规章制度-多选题-5","no":5,"kind":"multi","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"多选题","stem":"依据《网络数据安全风险评估办法》，以下哪些属于国家相关部门在风险评 估工作中的职责？","options":[{"key":"A","text":"国家网信部门会同国务院电信、公安等有关部门建立专项工作机制"},{"key":"B","text":"国家网信部门汇总风险评估报告并与国务院电信、公安、国家安全等有关部 门共享"},{"key":"C","text":"有关主管部门应于每年1 月底前将年度风险评估检查计划报送国家网信部门"},{"key":"D","text":"省级以上网信部门可以对重要数据处理者的风险评估报告进行检查核验"}],"answer":"ABCD","analysis":"本题考查国家相关部门在风险评估工作中的职责分工，属于「谁来管、怎么管」的框架题：国家网信部门牵头会同电信、公安等建立专项工作机制，汇总风险评估报告并与电信、公安、国家安全等部门共享；日常监管则由部门层层落实，主管部门每年1月底前报送年度检查计划，省级以上网信部门可对重要数据处理者的报告进行检查核验。四个选项分别对应机制建设、信息共享、计划报送、检查核验四个环节，没有越权或漏项的表述。","correctReason":"建立专项工作机制、汇总共享风险评估报告、按期报送年度检查计划、对重要数据处理者报告进行检查核验，均属国家相关部门在风险评估工作中的法定职责。","wrongReason":"A：易误以为机制由各部门各自建立，实为国家网信部门会同国务院电信、公安等有关部门建立专项工作机制；B：易误以为报告只需报送不需共享，实则国家网信部门还要与国务院电信、公安、国家安全等部门共享；C：易误以为报送主体或时限有误而漏选，实则有关主管部门应于每年1月底前将年度检查计划报送国家网信部门；D：易误以为核验权仅在国家网信部门，实则省级以上网信部门均可对重要数据处理者的报告检查核验。本题四项均正确，无错误选项。","source":"《网络数据安全风险评估办法》","keyPoint":"网信牵头、报告共享、计划1月底前报、省级以上可核验。"},{"id":"第一部分基础题-三、密码管理规章制度-多选题-6","no":6,"kind":"multi","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"多选题","stem":"下列哪些部门（或单位）对电子印章负有监督管理职责？（ ）","options":[{"key":"A","text":"国家密码管理局"},{"key":"B","text":"工业和信息化部"},{"key":"C","text":"公安机关"},{"key":"D","text":"国务院办公厅"}],"answer":"ABCD","analysis":"本题考查电子印章的监督管理职责分工。电子印章涉及密码技术应用、电子认证服务、社会治安秩序以及政务系统用章等多个层面，因此国家密码管理局、工业和信息化部、公安机关和国务院办公厅按各自职责对电子印章相关活动实施监督管理，共同构成多部门协同的管理格局。只要记住电子印章「技术归密码与工信、安全秩序归公安、政务应用统筹在国办」这条线索，就不会误判某个部门「不管印章」。","correctReason":"国家密码管理局、工业和信息化部、公安机关和国务院办公厅在各自职责范围内对电子印章负有监督管理职责，四者均为适格主体。","wrongReason":"A：易误以为密码管理局只管密码不管印章，实则电子印章以密码技术为支撑，其密码应用属其监管范围；B：易误以为工信部只管电信业务，实则电子认证服务及相关行业管理属其职责；C：易误以为公安只管实物印章，实则电子印章涉及的治安秩序与违法犯罪查处同样由公安负责；D：最易被误判为「不监管」而漏选，实则国务院办公厅在政务领域电子印章应用与管理中负有相应监督管理职责。本题四项均正确，无错误选项。","source":"《电子印章管理办法》","keyPoint":"电子印章监管：密码局、工信部、公安、国务院办公厅。"},{"id":"第一部分基础题-三、密码管理规章制度-多选题-7","no":7,"kind":"multi","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"多选题","stem":"电子印章制作应当符合哪些要求？（ ）","options":[{"key":"A","text":"电子签名认证证书合法有效"},{"key":"B","text":"数据格式、生成流程和应用接口符合国家有关标准规范"},{"key":"C","text":"图像规格式样与实物印章完全一致，不可附加标注"},{"key":"D","text":"图像规格、式样应与印章管理有关法律法规明确的印模规制保持一致"}],"answer":"ABD","analysis":"本题考查电子印章制作的技术与合规要求。电子印章依赖电子签名认证证书来确认制章主体身份，制作全流程和数据格式、应用接口也必须符合国家有关标准规范，其图像规格与式样要与法律法规明确的印模规制保持一致，才能保证加盖后的文书具有可验证性和法律效力。C错在绝对化：要求「与实物印章完全一致、不可附加标注」是伪要求，实践中电子印章图像按规定可带有编码等标注要素，并不需要与实物印章像素级一致。","correctReason":"证书合法有效、数据格式与生成流程及应用接口符合国家有关标准规范、图像规格式样与法定印模规制一致，都是电子印章制作的法定要求。","wrongReason":"C：「与实物印章完全一致、不可附加标注」属绝对化表述，与电子印章需符合标准规范、可依规附加标注要素的实际要求不符。","source":"《电子印章管理办法》","keyPoint":"制章三要：证书有效、符合国标规范、印模规制一致。"},{"id":"第一部分基础题-三、密码管理规章制度-多选题-8","no":8,"kind":"multi","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"多选题","stem":"电子印章状态信息备案的情形包括哪些？（ ）","options":[{"key":"A","text":"电子印章制作完成"},{"key":"B","text":"电子印章停用"},{"key":"C","text":"电子印章恢复"},{"key":"D","text":"电子印章图像样式变更"}],"answer":"ABC","analysis":"本题考查电子印章状态信息备案的情形，备案的目的是让用章相关方能实时掌握印章是否可用。制作完成意味着印章正式产生并进入可用状态，停用意味着退出使用，恢复意味着重新启用，这三种都直接改变印章的法律效力状态，必须备案。D只是图像样式变更，属于表现形式问题，并不改变印章的有效性状态，因此不属于状态信息备案情形——这是本题最容易失分的地方。","correctReason":"电子印章制作完成、停用、恢复都会导致印章有效性状态发生变化，属于应当备案的状态信息情形。","wrongReason":"D：图像样式变更只是外观表现变化，不影响印章能否使用的状态，不属于状态信息备案的情形。","source":"《电子印章管理办法》","keyPoint":"状态备案只认三种：制作完成、停用、恢复。"},{"id":"第一部分基础题-三、密码管理规章制度-多选题-9","no":9,"kind":"multi","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"多选题","stem":"依据《电子印章管理办法》，一个完整的电子印章包含哪些内容？（ ）","options":[{"key":"A","text":"印章图像数据"},{"key":"B","text":"印章名称"},{"key":"C","text":"印章所有者信息"},{"key":"D","text":"电子签名认证证书"}],"answer":"ABCD","analysis":"本题考查电子印章的构成要素。一个完整的电子印章是「可视化图像＋身份可信凭证」的结合体：印章图像数据承载印章的视觉表现，印章名称和印章所有者信息界定该印章归谁所有、用于何种名义，电子签名认证证书则为制章主体和使用行为提供密码学身份绑定。四者缺一，印章要么无法辨识主体，要么无法验签，都不构成完整可用的电子印章。","correctReason":"印章图像数据、印章名称、印章所有者信息、电子签名认证证书共同构成一个完整的电子印章，四项缺一不可。","wrongReason":"A：易误以为电子印章就是一张图像，实则图像数据只是可视载体，单独存在不构成印章；B：易误以为名称可有可无而漏选，实则印章名称是确定用章名义的必要要素；C：易被当作附属说明信息而排除，实则印章所有者信息是判断印章归属、确定责任主体的必备内容；D：易误以为证书与印章相互独立，实则电子签名认证证书是印章身份可信、可验签的组成部分。本题四项均正确，无错误选项。","source":"《电子印章管理办法》","keyPoint":"完整电子印章＝图像＋名称＋所有者信息＋签名证书。"},{"id":"第一部分基础题-三、密码管理规章制度-多选题-10","no":10,"kind":"multi","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"多选题","stem":"依据《电子印章管理办法》，下列哪些行为依法依规应承担相应责任？（ ）","options":[{"key":"A","text":"伪造电子印章"},{"key":"B","text":"变造电子印章"},{"key":"C","text":"冒用电子印章"},{"key":"D","text":"盗用电子印章"}],"answer":"ABCD","analysis":"本题考查电子印章使用中的违法责任情形。伪造、变造是围绕印章本身造假，区分点在于「无中生有」还是「真章改内容」；冒用、盗用是围绕用章权造假，前者是假借他人名义用章，后者是未经许可擅自使用他人印章。这四类行为都破坏了电子印章的身份可信与意思表示真实，侵害印章所有者合法权益，依法应承担相应责任，做题时不要以为「只有伪造才违法」。","correctReason":"伪造、变造、冒用、盗用电子印章均属侵害印章所有者合法权益、破坏电子印章可信秩序的违法行为，应依法依规承担相应责任。","wrongReason":"A：易误以为伪造只针对实物印章而漏选，实则伪造电子印章同样应依法担责；B：易误以为在真章基础上改动内容不算违法，实则变造电子印章亦须承担相应责任；C：易被当作普通民事纠纷而排除，实则冒用他人电子印章侵害印章所有者合法权益，应依法追责；D：易误以为盗用只是一般违规，实则盗用电子印章同样破坏印章可信秩序，依法应承担相应责任。本题四项均正确，无错误选项。","source":"《电子印章管理办法》","keyPoint":"四类用章违法：伪造、变造、冒用、盗用都要担责。"},{"id":"第一部分基础题-三、密码管理规章制度-判断题-1","no":1,"kind":"judge","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"判断题","stem":"《商用密码检测机构管理办法》规定，检测机构可自愿申请成为国家级或区 域性机构。（ ）","options":[],"answer":"对","analysis":"考核点是商用密码检测机构的资质分级管理制度。现行制度把检测机构分为国家级与区域性两类，并允许符合条件者自愿提出申请，由主管部门按条件核准，而不是强制指派。题干用「可自愿申请」描述这一机制，与制度设计一致，所以表述成立。易混点在于：「自愿申请」说的是申请环节，取得资质后仍须在核准范围内从业，不能理解为可自由选择业务区域。","correctReason":"因为检测机构资质实行国家级、区域性分级管理，且取得资质以机构自愿申请为前置，故「可自愿申请」的表述成立。","wrongReason":"","source":"《商用密码检测机构管理办法》","keyPoint":"检测机构资质分级：国家级、区域性，均需自愿申请后核准"},{"id":"第一部分基础题-三、密码管理规章制度-判断题-2","no":2,"kind":"judge","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"判断题","stem":"处理一般数据的网络数据处理者应当至少每2 年开展一次风险评估。（ ）","options":[],"answer":"错","analysis":"考核点是数据安全风险评估的周期要求。数据处理者定期开展风险评估并报送报告，是按「重要数据」这一门槛设定的强制性义务，法规并未给一般数据处理者规定「至少每2年一次」的固定周期。对一般数据，处理者出于自身合规与风控需要可以自行组织评估，但不存在题干所说的强制两年周期，故表述不成立。注意区分：承担该定期义务的主体是重要数据处理者，而不是所有处理者。","correctReason":"不成立：定期风险评估并报送报告是重要数据处理者的法定义务，一般数据处理者无「至少每2年一次」的强制周期。","wrongReason":"","source":"《中华人民共和国数据安全法》《网络数据安全管理条例》","keyPoint":"定期风评报告是重要数据处理者的义务，无「一般数据每2年」之说"},{"id":"第一部分基础题-三、密码管理规章制度-判断题-3","no":3,"kind":"judge","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"判断题","stem":"《商用密码检测机构管理办法》提到区域性检测机构经批准可在其他省份设 立分支机构。（ ）","options":[],"answer":"错","analysis":"考核点是区域性检测机构的从业范围限制。检测机构资质与固定的检测能力范围、从业地域绑定，区域性机构只能在其核准的区域内开展检测，跨省设立分支机构会突破核准的地域与能力边界，因此不被允许。题干称「经批准可在其他省份设立分支机构」，与制度设定相冲突，表述不成立。记住：分级管理的实质就是限定范围，不是扩张范围。","correctReason":"不成立：区域性检测机构的从业范围限于核准区域，不得跨省设立分支机构开展检测。","wrongReason":"","source":"《商用密码检测机构管理办法》","keyPoint":"区域性检测机构只能在核准区域内从业，不得跨省设分支机构"},{"id":"第一部分基础题-三、密码管理规章制度-判断题-4","no":4,"kind":"judge","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"判断题","stem":"评估机构在风险评估过程中发现重大数据安全风险时，应当首先向有关主管 部门报告，再通知网络数据处理者。（ ）","options":[],"answer":"错","analysis":"考核点是风险评估中重大风险的报告顺序。制度安排是评估机构先把风险情况通知被评估的网络数据处理者，使其能第一时间处置；再按规定向有关主管部门报送，而不是反过来先报主管部门。题干把顺序颠倒成「先报主管部门、再通知处理者」，与规定不符。这里的记忆抓手是「先告知当事人、后报告监管方」，避免处置时机被拖延。","correctReason":"不成立：评估机构发现重大数据安全风险应先通知网络数据处理者，再按规定向有关主管部门报告。","wrongReason":"","source":"《数据安全技术 数据安全风险评估方法》","keyPoint":"重大风险先通知数据处理者，再报主管部门，顺序不可颠倒"},{"id":"第一部分基础题-三、密码管理规章制度-判断题-5","no":5,"kind":"judge","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"判断题","stem":"某市密码管理局对医保系统开展专项检查，依据《商用密码应用安全性评估 管理办法》，属于合法职权范围。（ ）","options":[],"answer":"对","analysis":"考核点是密码管理部门的监督检查职权。商用密码应用安全性评估工作由密码管理部门负责监督管理，相关单位应当接受监督检查并如实提供材料。医保系统属于需要开展密评的重点领域信息系统，市级密码管理局对其开展专项检查，属于依法履职，没有越权，因此表述成立。不要误以为只有国家级或省级部门才有检查权，也不要把密评检查与网信、公安的检查混为一谈。","correctReason":"成立：密码管理部门对商用密码应用安全性评估工作负有监督管理职责，对医保系统等开展专项检查属合法职权。","wrongReason":"","source":"《商用密码应用安全性评估管理办法》《中华人民共和国密码法》","keyPoint":"密码管理部门对密评工作有监督检查权，受检单位必须配合"},{"id":"第一部分基础题-三、密码管理规章制度-判断题-6","no":6,"kind":"judge","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"判断题","stem":"有关主管部门开展数据安全检查时，不得向被检查的重要数据处理者收取任 何费用。（ ）","options":[],"answer":"对","analysis":"考核点是数据安全检查的费用规则。有关部门依法开展数据安全监督检查，属于履行监管职责的公务行为，不得借检查向被检查的重要数据处理者收取费用，否则就变成变相摊派。题干表述与这一原则一致，故成立。实务上要区分两笔钱：监管检查不收费，而处理者自行委托第三方做评估、检测所发生的服务费用由自己承担。","correctReason":"成立：主管部门的数据安全检查属依法履职，不得向被检查的重要数据处理者收取任何费用。","wrongReason":"","source":"《中华人民共和国数据安全法》","keyPoint":"监管检查不收费；自行委托评估检测的费用才是自己出"},{"id":"第一部分基础题-三、密码管理规章制度-判断题-7","no":7,"kind":"judge","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"判断题","stem":"某支付平台评估未通过，依据《商用密码应用安全性评估管理办法》，改造 期间可保持业务运行无需额外措施。（ ）","options":[],"answer":"错","analysis":"考核点是密评未通过后的整改要求。评估未通过说明系统密码应用存在风险隐患，使用单位必须制定整改方案并落实整改，整改期间还应当采取必要的风险控制措施，整改完成后重新组织评估，不能「照常运行、什么都不做」。题干称无需额外措施即可保持业务运行，与要求相悖，表述不成立。整改不是走过场，风险管控要同步跟上。","correctReason":"不成立：密评未通过必须限期整改并采取必要的风险控制措施，整改后重新评估，不得无措施地原样运行。","wrongReason":"","source":"《商用密码应用安全性评估管理办法》","keyPoint":"密评未通过：限期整改＋必要风险控制措施＋重新评估"},{"id":"第一部分基础题-三、密码管理规章制度-判断题-8","no":8,"kind":"judge","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"判断题","stem":"评估机构接受数据安全风险评估委托后，可以根据需要将部分评估工作转委 托给其他专业机构完成。（ ）","options":[],"answer":"错","analysis":"考核点是风险评估的独立性与不可转让性。评估机构接受委托后，应当由本机构独立完成评估工作并对结论负责，不得把受托业务转委托给其他专业机构，否则责任主体不清、结论可信度无法保证。题干用「可以根据需要转委托」来描述，属于被禁止的情形，故不成立。注意区分：评估机构内部可以聘请专家协助，但对外转委托整项业务不行。","correctReason":"不成立：受托的数据安全风险评估应由评估机构本机构独立完成，禁止将评估工作转委托给其他机构。","wrongReason":"","source":"《数据安全技术 数据安全风险评估方法》","keyPoint":"风险评估不得转委托，必须由受托机构独立完成并负责"},{"id":"第一部分基础题-三、密码管理规章制度-判断题-9","no":9,"kind":"judge","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"判断题","stem":"依据《电子政务电子认证服务管理办法》，电子政务电子认证服务机构应当 于每年1 月30 日前向住所地省、自治区、直辖市密码管理部门报送上一年度工 作报告。（ ）","options":[],"answer":"错","analysis":"考核点是电子政务电子认证服务机构的年度报告报送时限。管理办法对上报时间有明确的日期节点，题干给出的「1月30日前」并非规定的时间，故表述不成立。此类题目考查的就是对具体时间、期限的精确记忆，复习时应把报送主体（服务机构报省级密码管理部门）、报送周期（每年一次）、截止日期三者绑定记忆，避免只记住「每年1月」就下判断。","correctReason":"不成立：管理办法规定的年度工作报告报送截止日期不是1月30日，题干时限与规定不符。","wrongReason":"","source":"《电子政务电子认证服务管理办法》","keyPoint":"年度工作报告的报送时限要精确记，主体是省级密码管理部门"},{"id":"第一部分基础题-三、密码管理规章制度-判断题-10","no":10,"kind":"judge","part":"第一部分基础题","cat":"三、密码管理规章制度","type":"判断题","stem":"对同一网络数据安全事件或者风险，有关部门可以要求多个评估机构同时对 该网络数据处理者开展风险评估，以确保评估结论的准确性。（ ）","options":[],"answer":"错","analysis":"考核点是监管检查的合理性原则与减轻相对人负担的要求。对同一网络数据安全事件或风险，有关部门应当加强协同、避免重复检查重复评估，不得要求多个评估机构同时对同一处理者开展风险评估，否则既浪费资源又干扰企业正常经营。题干把这种被禁止的重复评估说成是「为确保准确性」的正当做法，故不成立。判断此类题的关键是看监管行为是否给相对人增加了不必要负担。","correctReason":"不成立：对同一事件或风险不得要求多个评估机构同时评估，有关部门应协同避免重复检查评估。","wrongReason":"","source":"《网络数据安全管理条例》","keyPoint":"同一事件不得要求多家机构同时评估，监管应协同不重复"},{"id":"第一部分基础题-四、其他政策法规条例-单选题-1","no":1,"kind":"single","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"单选题","stem":"某省级单位新建政务信息系统，根据《江苏省省级政务信息化项目建设管理 办法》规定，项目单位应如何落实密码应用要求？（ ）","options":[{"key":"A","text":"项目建成后补充密码保障方案"},{"key":"B","text":"同步规划、建设、运行密码保障系统并定期评估"},{"key":"C","text":"仅需在验收时提供密码技术说明"},{"key":"D","text":"委托第三方机构代建密码系统"}],"answer":"B","analysis":"本题考政务信息化项目密码应用\"三同步\"要求。密码保障系统不能事后补做，必须与项目同步规划、同步建设、同步运行，并定期开展密码应用安全性评估，这样才能保证密码在系统设计阶段就嵌入业务流程，而不是验收前的\"贴补丁\"。项目建成后补方案、只提供技术说明、单纯委托代建，都改变不了项目单位的主体责任。","correctReason":"《江苏省省级政务信息化项目建设管理办法》要求项目单位落实密码应用\"同步规划、同步建设、同步运行\"，并定期开展评估，B项表述完整准确。","wrongReason":"A：建成后才补充密码保障方案，违反同步规划要求，事后补救已无法弥补设计与投资缺陷；C：密码应用是强制要求，验收时给一份技术说明远不足以证明合规；D：委托第三方代建只是实施方式，不能免除项目单位自身的密码应用主体责任。","source":"《江苏省省级政务信息化项目建设管理办法》","keyPoint":"密码保障系统要\"同步规划、同步建设、同步运行\"并定期评估。"},{"id":"第一部分基础题-四、其他政策法规条例-单选题-2","no":2,"kind":"single","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"单选题","stem":"依据《江苏省省级政务信息化项目建设管理办法》，（ ）负责项目安全可 靠情况、密码应用、电子文件管理等审核及监督工作。","options":[{"key":"A","text":"省国家密码管理局"},{"key":"B","text":"省发展改革委"},{"key":"C","text":"省保密局"},{"key":"D","text":"省委网信办"}],"answer":"A","analysis":"本题考江苏省政务信息化项目中各部门的职责划分。密码应用属于密码管理部门的法定监管范围，因此由省国家密码管理局负责项目安全可靠情况、密码应用、电子文件管理等方面的审核与监督，并出具密码应用安全性评估方面的意见。发展改革部门主管项目审批和投资安排，保密局管涉密事项，网信办统筹网络安全，三者都不能替代密码管理部门的密码监管职责。","correctReason":"密码应用监管是密码管理部门的法定职责，《江苏省省级政务信息化项目建设管理办法》明确由省国家密码管理局承担相关审核及监督工作。","wrongReason":"B：省发展改革委负责项目立项审批与投资管理，不负责密码应用审核；C：省保密局负责国家秘密事项的保密管理，与密码应用审核不是一回事；D：省委网信办统筹协调网络安全工作，密码使用和管理的监管不属于其职责。","source":"《江苏省省级政务信息化项目建设管理办法》","keyPoint":"密码应用审核监管归密码管理部门，勿与网信、保密职责混淆。"},{"id":"第一部分基础题-四、其他政策法规条例-单选题-3","no":3,"kind":"single","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"单选题","stem":"依据《江苏省省级政务信息化项目建设管理办法》，密码应用安全性评估结 果不合格的项目，将面临（ ）。","options":[{"key":"A","text":"扣减50%运维经费"},{"key":"B","text":"不得申请竣工验收"},{"key":"C","text":"限期3 个月整改"},{"key":"D","text":"通报批评责任单位"}],"answer":"B","analysis":"本题考密评不合格的后果。密码应用安全性评估是政务信息化项目竣工验收的前置条件，评估结论不合格的，项目就不得申请竣工验收，必须整改合格后才能继续走验收流程。这是把密码应用从\"软要求\"变成\"硬约束\"的关键条款，也是竞赛里常考的制度衔接点：密评不过关，验收就走不通。","correctReason":"《江苏省省级政务信息化项目建设管理办法》将密码应用安全性评估结果作为竣工验收的前置条件，评估不合格的不得申请竣工验收。","wrongReason":"A：扣减50%运维经费不是本办法规定的处理措施；C：\"限期3个月整改\"属于杜撰的整改期限，规定中并无此表述；D：通报批评责任单位不是密评不合格的直接法定后果。","source":"《江苏省省级政务信息化项目建设管理办法》","keyPoint":"密评不合格＝不得申请竣工验收（验收前置条件）。"},{"id":"第一部分基础题-四、其他政策法规条例-单选题-4","no":4,"kind":"single","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"单选题","stem":"依据《江苏省数据条例》，（ ）是数据安全责任主体，应建立健全数据安 全管理制度，组织开展数据安全教育培训，采取相应的技术措施和其他必要措施， 加强数据处理全流程安全防护。","options":[{"key":"A","text":"数据提供者"},{"key":"B","text":"数据收集者"},{"key":"C","text":"数据使用者"},{"key":"D","text":"数据处理者"}],"answer":"D","analysis":"本题考数据安全责任主体的界定。《江苏省数据条例》与《数据安全法》《个人信息保护法》保持一致，把数据处理者（即自主决定处理目的和处理方式、实际开展数据处理活动的组织和个人）确定为数据安全责任主体。数据处理者的义务是全流程的：建制度、搞培训、上技术措施，加强数据收集、存储、使用、加工、传输、提供、公开等各环节防护。提供者、收集者、使用者不过是数据处理活动中的某一环节角色，不承担整体安全责任。","correctReason":"数据处理者自主决定数据处理目的和方式，是数据安全的第一责任人，《江苏省数据条例》明确其为数据安全责任主体。","wrongReason":"A：数据提供者只对应数据提供环节，不能覆盖全流程安全责任；B：数据收集者仅涉及收集环节的合规义务；C：数据使用者只对使用环节负责，均不足以承担全流程数据安全主体责任。","source":"《江苏省数据条例》","keyPoint":"数据安全责任主体＝数据处理者，责任覆盖处理全流程。"},{"id":"第一部分基础题-四、其他政策法规条例-单选题-5","no":5,"kind":"single","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"单选题","stem":"《江苏省数据条例》自2025 年4 月1 日起施行，旨在加强数据资源管理，保 障数据安全，促进数据依法有序流通和应用，其中，规定（ ）按照国家有关 规定统筹协调全省数据跨境流动安全管理工作。","options":[{"key":"A","text":"省工业和信息化部门"},{"key":"B","text":"省网信部门"},{"key":"C","text":"省通信管理部门"},{"key":"D","text":"省数据部门"}],"answer":"B","analysis":"本题考数据跨境流动安全管理的统筹部门。数据出境安全管理制度由网信部门牵头建立，因此《江苏省数据条例》规定由省网信部门按照国家有关规定，统筹协调全省数据跨境流动的安全管理工作，与《数据安全法》《个人信息保护法》确立的网信统筹体制一致。工信、通信管理部门侧重行业与网络基础设施管理，省数据部门负责数据资源开发利用和政务数据管理，都不负责跨境流动安全统筹。","correctReason":"数据出境安全管理制度由网信部门统筹，故《江苏省数据条例》将统筹协调全省数据跨境流动安全管理的职责赋予省网信部门。","wrongReason":"A：省工业和信息化部门负责工业和信息化行业管理，不统筹数据跨境流动安全；C：省通信管理部门负责通信行业和网络基础设施监管；D：省数据部门主责数据资源管理、共享开放与开发利用，均非跨境流动安全管理统筹主体。","source":"《江苏省数据条例》","keyPoint":"数据跨境流动安全管理由网信部门统筹协调。"},{"id":"第一部分基础题-四、其他政策法规条例-单选题-6","no":6,"kind":"single","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"单选题","stem":"根据《电子认证服务使用密码管理办法》，申请《电子认证服务使用密码许 可证》的机构，应当向哪个部门提交申请材料？（ ）","options":[{"key":"A","text":"国家密码管理局"},{"key":"B","text":"国家密码管理局委托进行受理的省、自治区、直辖市密码管理部门"},{"key":"C","text":"国务院工业和信息化主管部门"},{"key":"D","text":"住所地的县级以上地方各级密码管理部门"}],"answer":"B","analysis":"本题考电子认证服务使用密码许可的申请受理渠道。为方便申请人就近办事，国家密码管理局将受理环节委托给省、自治区、直辖市密码管理部门，由它们接收申请材料并转报，审批发证权仍在国家密码管理局。所以\"向国家密码管理局提交\"虽是审批机关但并非受理渠道，工信部门、县级以上密码管理部门也都不受理此类许可申请。","correctReason":"《电子认证服务使用密码管理办法》规定，申请人向国家密码管理局委托受理的省、自治区、直辖市密码管理部门提交申请材料，由其受理后上报。","wrongReason":"A：国家密码管理局是审批发证机关，但材料受理由其委托的地方密码管理部门承担；C：国务院工业和信息化主管部门负责电子认证服务许可，与使用密码许可不是同一事项；D：县级以上地方密码管理部门层级过低，未获委托受理此类申请。","source":"《电子认证服务使用密码管理办法》","keyPoint":"电子认证服务使用密码许可：省级密码管理部门受理、国家局审批。"},{"id":"第一部分基础题-四、其他政策法规条例-单选题-7","no":7,"kind":"single","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"单选题","stem":"根据《江苏省政务信息化项目建设网络安全管理规定》实施指南，（ ）会 同省有关部门强化对省政务信息化项目的网络安全检查和评估，对于不符合网络 安全要求，或者存在重大安全隐患的政务信息系统，发放《运行管理安全问题整 改通知单》。","options":[{"key":"A","text":"省委网信办"},{"key":"B","text":"省工业和信息化厅"},{"key":"C","text":"省政府办公厅"},{"key":"D","text":"省国家密码管理局"}],"answer":"A","analysis":"本题考政务信息化项目网络安全检查评估的组织部门。网络安全工作由网信部门统筹协调，因此由省委网信办会同省有关部门对省政务信息化项目开展网络安全检查和评估，对不达标或存在重大安全隐患的系统发放《运行管理安全问题整改通知单》。密码管理部门管密码应用，工信部门管行业，政府办公厅管政务运行，都不承担这项统筹检查职能。","correctReason":"网信部门统筹协调网络安全工作，《江苏省政务信息化项目建设网络安全管理规定》实施指南据此明确由省委网信办会同有关部门组织检查评估并发放整改通知单。","wrongReason":"B：省工业和信息化厅负责工业和信息化行业管理，不牵头政务系统网络安全检查；C：省政府办公厅负责政务运行与协调，不承担技术性安全检查评估；D：省国家密码管理局负责密码使用和管理监管，其检查对象是密码应用而非整体网络安全。","source":"《江苏省政务信息化项目建设网络安全管理规定》实施指南","keyPoint":"网络安全检查评估由网信办牵头，密码检查归密码管理局。"},{"id":"第一部分基础题-四、其他政策法规条例-单选题-8","no":8,"kind":"single","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"单选题","stem":"根据《网络数据安全风险评估办法》，重要数据处理者应当多久开展一次年 度风险评估？","options":[{"key":"A","text":"每半年"},{"key":"B","text":"每年度"},{"key":"C","text":"每2 年"},{"key":"D","text":"每3 年"}],"answer":"B","analysis":"本题考重要数据处理者的风险评估频次。重要数据一旦泄露可能危害国家安全、公共利益，风险随业务、数据和威胁态势不断变化，因此《网络数据安全风险评估办法》要求重要数据处理者每年至少开展一次风险评估，形成\"每年度评估\"的常态化机制。半年一次属于加严要求，2年、3年则间隔过长，无法及时掌握风险变化。","correctReason":"《网络数据安全风险评估办法》规定重要数据处理者应当每年度开展一次网络数据安全风险评估。","wrongReason":"A：每半年一次并非该办法对重要数据处理者的法定最低频次；C：每2年一次、D：每3年一次，间隔过长，不能满足重要数据年度评估要求。","source":"《网络数据安全风险评估办法》","keyPoint":"重要数据处理者每年至少开展一次风险评估。"},{"id":"第一部分基础题-四、其他政策法规条例-单选题-9","no":9,"kind":"single","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"单选题","stem":"重要数据处理者在完成年度风险评估后，应当在多少个工作日内向有关主管 部门报送风险评估报告？","options":[{"key":"A","text":"10 个工作日"},{"key":"B","text":"15 个工作日"},{"key":"C","text":"20 个工作日"},{"key":"D","text":"30 个工作日"}],"answer":"C","analysis":"本题考年度风险评估报告的报送时限。重要数据处理者完成年度评估后，应当在20个工作日内向有关主管部门报送风险评估报告，既给企业内部审核留出时间，又不至于让监管部门长期掌握不到风险状况。10个、15个工作日过紧，30个工作日过松，都是干扰项。","correctReason":"《网络数据安全风险评估办法》规定，重要数据处理者应在完成年度风险评估后的20个工作日内报送风险评估报告。","wrongReason":"A：10个工作日、B：15个工作日，均短于办法规定的报送期限；D：30个工作日超出规定期限，属于常见的时间数字干扰项。","source":"《网络数据安全风险评估办法》","keyPoint":"年度风险评估报告：完成后20个工作日内报送。"},{"id":"第一部分基础题-四、其他政策法规条例-单选题-10","no":10,"kind":"single","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"单选题","stem":"依据《互联网政务应用安全管理规定》，机关事业单位应当自行或者委托具 有相应资质的第三方网络安全服务机构，对互联网政务应用网络和数据安全 （ ）至少进行一次安全检测评估。","options":[{"key":"A","text":"每半年"},{"key":"B","text":"每年"},{"key":"C","text":"每两年"},{"key":"D","text":"每三年"}],"answer":"B","analysis":"本题考互联网政务应用安全检测评估的周期。互联网政务应用直接面向社会公众，系统持续迭代、外部威胁不断演变，因此《互联网政务应用安全管理规定》要求机关事业单位自行或委托有资质的第三方网络安全服务机构，每年至少进行一次网络和数据安全检测评估。半年属于更高频的内部要求，两年、三年则明显低于法定底线。","correctReason":"《互联网政务应用安全管理规定》明确对互联网政务应用的网络和数据安全每年至少开展一次安全检测评估。","wrongReason":"A：每半年一次高于法定最低要求，不是规定表述；C：每两年、D：每三年，均低于\"每年至少一次\"的法定底线。","source":"《互联网政务应用安全管理规定》","keyPoint":"互联网政务应用：每年至少做一次安全检测评估。"},{"id":"第一部分基础题-四、其他政策法规条例-单选题-11","no":11,"kind":"single","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"单选题","stem":"以下哪一项不是我国国务院信息化办公室为加强信息安全保障明确提出的 九项重点工作内容之一（ ）","options":[{"key":"A","text":"提高信息技术产品的国产化率"},{"key":"B","text":"保证信息安全资金投入"},{"key":"C","text":"加快信息安全人才培养"},{"key":"D","text":"重视信息安全应急处理工作"}],"answer":"A","analysis":"本题考国家信息安全保障重点工作的内容。国务院信息化办公室提出的信息安全保障重点工作，主要围绕等级保护、风险评估、应急处理、人才培养、资金投入、法规标准、技术研发等制度性举措展开，并不包含以国产化率为指标的产品替代要求，因此\"提高信息技术产品的国产化率\"不属于这九项内容。需注意：自主可控、信创替代是后来的政策方向，但不能倒推到这项工作清单里。","correctReason":"该九项重点工作聚焦制度、技术、人才、资金、应急等安全保障举措，未把\"提高信息技术产品国产化率\"列为其中一项。","wrongReason":"B：保证信息安全资金投入是九项重点工作之一；C：加快信息安全人才培养是其中之一；D：重视信息安全应急处理工作也是其中之一，三项均属于九项内容，故不选。","source":"国务院信息化办公室关于加强信息安全保障工作的九项重点工作","keyPoint":"九项重点工作含资金、人才、应急，不含\"国产化率\"指标。"},{"id":"第一部分基础题-四、其他政策法规条例-单选题-12","no":12,"kind":"single","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"单选题","stem":"获得《电子认证服务使用密码许可证》的机构，其机构名称发生变更的，应 当自变更之日起多少日内向国家密码管理局办理变更手续？（ ）","options":[{"key":"A","text":"15 日"},{"key":"B","text":"20 日"},{"key":"C","text":"30 日"},{"key":"D","text":"60 日"}],"answer":"C","analysis":"本题考电子认证服务使用密码许可的变更时限。持证机构的机构名称等许可事项发生变更时，应当自变更之日起30日内向国家密码管理局办理变更手续，保证许可信息与实际主体一致、便于持续监管。15日、20日短于法定期限，60日又过长，均不正确。","correctReason":"《电子认证服务使用密码管理办法》规定，机构名称等事项变更的，应自变更之日起30日内向国家密码管理局办理变更手续。","wrongReason":"A：15日、B：20日，均短于规定期限；D：60日超出规定期限，属于时间数字干扰项。","source":"《电子认证服务使用密码管理办法》","keyPoint":"许可事项变更：自变更之日起30日内办理。"},{"id":"第一部分基础题-四、其他政策法规条例-单选题-13","no":13,"kind":"single","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"单选题","stem":"根据《关键信息基础设施安全保护条例》，（ ）对关键信息基础设施中 的密码使用和管理进行监管。","options":[{"key":"A","text":"国家互联网信息办公室"},{"key":"B","text":"海关总署"},{"key":"C","text":"国家密码管理局"},{"key":"D","text":"国家数据局"}],"answer":"C","analysis":"本题考关键信息基础设施保护的职责分工。《关键信息基础设施安全保护条例》明确，关键信息基础设施中的密码使用和管理由国家密码管理局负责监管，这与其在《密码法》下的法定职责相衔接。公安部门负责网络安全等级保护等监督管理，网信部门负责统筹协调，保密部门管国家秘密，各自分工不同，不能混为一谈。","correctReason":"《关键信息基础设施安全保护条例》规定，国家密码管理局对关键信息基础设施中的密码使用和管理进行监管。","wrongReason":"A：国家互联网信息办公室负责网络安全统筹协调和相关监督管理，不管密码使用；B：海关总署职责在进出口监管，与关键信息基础设施保护无关；D：国家数据局负责数据资源开发利用等职责，均不负责密码使用和管理监管。","source":"《关键信息基础设施安全保护条例》","keyPoint":"关键信息基础设施中的密码使用和管理由国家密码管理局监管。"},{"id":"第一部分基础题-四、其他政策法规条例-单选题-14","no":14,"kind":"single","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"单选题","stem":"依据《网络数据安全风险评估办法》，评估机构及其关联机构不得连续多少 次以上对同一网络数据处理者开展年度风险评估？","options":[{"key":"A","text":"2 次"},{"key":"B","text":"3 次"},{"key":"C","text":"4 次"},{"key":"D","text":"5 次"}],"answer":"B","analysis":"本题考评估机构独立性的限制性要求。为保证年度风险评估结论客观、避免评估机构与被评估对象形成长期利益关联，《网络数据安全风险评估办法》要求评估机构及其关联机构不得连续3次以上对同一网络数据处理者开展年度风险评估。也就是说，同一家机构最多连续做3次，第4次就应当更换。2次过于严格，4次、5次则突破了独立性红线。","correctReason":"《网络数据安全风险评估办法》对评估机构设定独立性要求，明确不得连续3次以上对同一网络数据处理者开展年度风险评估。","wrongReason":"A：2次低于规定的连续上限，不是办法表述；C：4次、D：5次均超过\"连续3次\"的上限，违反评估独立性要求。","source":"《网络数据安全风险评估办法》","keyPoint":"同一评估机构对同一处理者最多连续评估3次。"},{"id":"第一部分基础题-四、其他政策法规条例-单选题-15","no":15,"kind":"single","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"单选题","stem":"获得《电子认证服务使用密码许可证》的机构，应当自行或者委托专业机构 每年至少进行（ ）次电子认证服务使用密码合规性评估？","options":[{"key":"A","text":"1"},{"key":"B","text":"2"},{"key":"C","text":"3"},{"key":"D","text":"4"}],"answer":"A","analysis":"本题考持证机构合规性评估的频次。获得《电子认证服务使用密码许可证》的机构，应当自行或者委托专业机构每年至少进行1次电子认证服务使用密码合规性评估，把许可监管从\"发证\"延伸到\"持续合规\"。评估可由机构自评，也可委托专业机构，但频次底线是每年1次。","correctReason":"《电子认证服务使用密码管理办法》规定，持证机构应当自行或委托专业机构每年至少进行1次使用密码合规性评估。","wrongReason":"B：2次、C：3次、D：4次，次数均高于规定的\"每年至少1次\"，属于把最低要求当成多次的干扰项。","source":"《电子认证服务使用密码管理办法》","keyPoint":"电子认证服务使用密码合规性评估：每年至少1次。"},{"id":"第一部分基础题-四、其他政策法规条例-单选题-16","no":16,"kind":"single","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"单选题","stem":"关于商用密码应用安全性评估的原则，以下表述错误的是（ ）。","options":[{"key":"A","text":"商用密码应用安全性评估实施分类分级管理"},{"key":"B","text":"新建的重要领域网络和信息系统，应当在规划、建设、运行三个阶段开展评估"},{"key":"C","text":"已建成的重要领域网络和信息系统不再需要开展评估"},{"key":"D","text":"商用密码应用安全性评估的关键点是网络和信息系统密码应用的合规性、正确 性和有效性"}],"answer":"C","analysis":"本题为逆向选择，考商用密码应用安全性评估（密评）的基本原则。密评实行分类分级管理，关键点是密码应用的合规性、正确性、有效性；新建系统要在规划、建设、运行三个阶段都开展评估，已建成系统同样要定期开展评估，密评不是\"一次性验收动作\"。C项说已建成系统不再需要评估，与持续评估要求相悖，故为错误表述。","correctReason":"商用密码应用安全性评估实行分类分级管理，覆盖规划、建设、运行各阶段并持续开展，\"已建成系统不再需要评估\"的说法不成立。","wrongReason":"A：密评实施分类分级管理，是正确表述；B：新建重要领域网络和信息系统应在规划、建设、运行三阶段开展评估，是正确要求；D：密评关键点是合规性、正确性、有效性，也是正确表述，三项均不能选。","source":"《商用密码应用安全性评估管理办法》","keyPoint":"密评分类分级、覆盖三阶段、三大关键点：合规性、正确性、有效性。"},{"id":"第一部分基础题-四、其他政策法规条例-单选题-17","no":17,"kind":"single","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"单选题","stem":"密码在网络空间中身份识别、安全隔离、信息加密、完整性保护和抗抵赖性 等方面具有不可替代的重要作用，可实现信息的（ ）、（ ）、数据的（ ） 和行为的（ ）。","options":[{"key":"A","text":"机密性、真实性、完整性、不可否认性"},{"key":"B","text":"秘密性、确定性、完整性、不可替代性"},{"key":"C","text":"机密性、安全性、统一性、不可抵赖性"},{"key":"D","text":"秘密性、有效性、统一性、不可逆转性"}],"answer":"A","analysis":"本题考密码保障网络空间安全的四类安全属性。用密码做加密保护信息的机密性，做身份鉴别保障真实性，做完整性校验保障数据完整性，做数字签名实现行为不可否认，这四项恰好构成密码在网络空间的完整安全价值链条。其余选项中的\"秘密性\"\"确定性\"\"统一性\"\"不可逆转性\"都不是规范的安全属性术语。","correctReason":"密码通过加密、身份鉴别、完整性校验和数字签名，分别实现信息的机密性、真实性、数据的完整性和行为的不可否认性。","wrongReason":"B：\"秘密性、确定性、不可替代性\"均非规范安全属性术语，且缺少真实性、不可否认性对应关系；C：\"安全性、统一性\"表述不规范，与密码技术功能不对应；D：\"有效性、不可逆转性\"更与四项安全属性无关。","source":"《密码法》及密码保障网络空间安全的相关表述","keyPoint":"密码四大作用：机密性、真实性、完整性、不可否认性。"},{"id":"第一部分基础题-四、其他政策法规条例-单选题-18","no":18,"kind":"single","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"单选题","stem":"络数据处理者按照有关部门要求委托评估机构开展风险评估，在整改完成 后，应在多少天内向有关部门报送整改情况报告？","options":[{"key":"A","text":"10 个工作日"},{"key":"B","text":"15 个工作日"},{"key":"C","text":"20 个工作日"},{"key":"D","text":"30 个工作日"}],"answer":"B","analysis":"本题考整改情况报告的报送时限。数据处理者按有关部门要求委托评估机构开展风险评估后，对发现的问题要整改到位，并在整改完成后15个工作日内向有关部门报送整改情况报告，形成\"评估—整改—报告\"的监管闭环。注意与年度评估报告的20个工作日相区别，两个时限不要记混。","correctReason":"《网络数据安全风险评估办法》规定，数据处理者应当在整改完成后15个工作日内向有关部门报送整改情况报告。","wrongReason":"A：10个工作日、C：20个工作日、D：30个工作日均不符合规定，其中20个工作日易与年度评估报告报送期限混淆。","source":"《网络数据安全风险评估办法》","keyPoint":"整改情况报告：整改完成后15个工作日内报送。"},{"id":"第一部分基础题-四、其他政策法规条例-单选题-19","no":19,"kind":"single","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"单选题","stem":"《网络数据安全风险评估办法》自（ ）起开始施行？","options":[{"key":"A","text":"2026 年6 月18 日"},{"key":"B","text":"2026 年6 月1 日"},{"key":"C","text":"2026 年8 月20 日"},{"key":"D","text":"2026 年1 月1 日"}],"answer":"C","analysis":"本题考《网络数据安全风险评估办法》的施行日期，属于数字记忆题。该办法自2026年8月20日起施行，此前的评估工作按原有规定和标准执行。选项中的2026年6月18日、6月1日、1月1日都是形近日期干扰，记住\"8月20日\"即可。","correctReason":"《网络数据安全风险评估办法》明确自2026年8月20日起施行。","wrongReason":"A：2026年6月18日、B：2026年6月1日、D：2026年1月1日均非该办法施行日期，属于形近日期干扰项。","source":"《网络数据安全风险评估办法》","keyPoint":"《网络数据安全风险评估办法》2026年8月20日施行。"},{"id":"第一部分基础题-四、其他政策法规条例-单选题-20","no":20,"kind":"single","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"单选题","stem":"《App 违法违规收集使用个人信息行为认定方法》系《中华人民共和国网络 安全法》框架下针对广泛应用的App 的个人信息保护配套性规章。下列（ ） 可以被认定为“违反必要原则，收集与其提供的服务无关的个人信息”？","options":[{"key":"A","text":"一款天气预报App 仅收集用户的位置信息用于提供本地天气预报"},{"key":"B","text":"一款社交媒体App 收集用户位置信息用于向用户推荐附近的活动"},{"key":"C","text":"一款健康管理App 收集用户的健康数据用于提供健康建议"},{"key":"D","text":"一款游戏App 收集用户的银行账户信息，声称是为防止作弊行为"}],"answer":"D","analysis":"本题考\"必要原则\"在App个人信息收集中的判断标准，即收集范围应与所提供的服务直接相关、为实现服务功能所必需。游戏App以防作弊为由收集银行账户信息，二者之间没有必然联系，明显超出实现游戏功能所必需的限度，属于违反必要原则收集与服务无关的个人信息。天气预报收集位置、社交App推荐附近活动、健康App采集健康数据提供建议，都与核心功能直接相关，属于必要范围。","correctReason":"《App违法违规收集使用个人信息行为认定方法》把收集与业务功能无直接关联、非实现服务所必需的信息认定为违反必要原则，游戏防作弊不需要银行账户信息，故D构成该情形。","wrongReason":"A：天气App收集位置用于本地预报，与核心功能直接相关，属必要收集；B：社交App用位置推荐附近活动，属于所提供服务的功能需要；C：健康管理App采集健康数据用于健康建议，数据与功能匹配，三项均不构成违反必要原则。","source":"《App违法违规收集使用个人信息行为认定方法》","keyPoint":"必要原则＝与业务功能直接相关、实现服务所必需。"},{"id":"第一部分基础题-四、其他政策法规条例-单选题-21","no":21,"kind":"single","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"单选题","stem":"随着数字化进程的加快，公共数据的安全问题日益突出。依据《江苏省公共 数据管理办法》，公共数据提供按照（ ）的原则，实施公共数据管理。","options":[{"key":"A","text":"谁主管谁负责、谁提供谁负责"},{"key":"B","text":"谁主管谁负责、谁使用谁负责"},{"key":"C","text":"谁管理谁负责、谁使用谁负责"},{"key":"D","text":"谁使用谁负责、谁提供谁负责"}],"answer":"A","analysis":"本题考公共数据管理的责任原则。《江苏省公共数据管理办法》确立\"谁主管谁负责、谁提供谁负责\"，即主管部门对本领域公共数据管理负总责，提供数据的公共管理和服务机构对数据质量与安全负责。这一表述把管理责任落到\"主管\"和\"提供\"两个主体上，而不是笼统地说使用者负责。","correctReason":"《江苏省公共数据管理办法》规定公共数据管理实行\"谁主管谁负责、谁提供谁负责\"的原则。","wrongReason":"B：把\"谁提供谁负责\"错换成\"谁使用谁负责\"，改变了责任主体；C：\"谁管理谁负责\"并非该办法表述；D：漏掉\"谁主管谁负责\"这一核心要求，均不准确。","source":"《江苏省公共数据管理办法》","keyPoint":"公共数据管理：谁主管谁负责、谁提供谁负责。"},{"id":"第一部分基础题-四、其他政策法规条例-单选题-22","no":22,"kind":"single","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"单选题","stem":"依据《江苏省公共数据管理办法》，公共管理和服务机构之间共享公共数据 应当以（ ）为原则、（ ）为例外，（ ）公共数据。","options":[{"key":"A","text":"不共享、共享、无偿共享"},{"key":"B","text":"不共享、共享、有偿共享"},{"key":"C","text":"共享、不共享、有偿共享"},{"key":"D","text":"共享、不共享、无偿共享"}],"answer":"D","analysis":"本题考公共数据共享的基本原则。公共数据共享以\"共享为原则、不共享为例外\"，并且实行无偿共享，这样才能打破部门数据壁垒、降低共享成本。有偿共享会变相抬高数据流通门槛，与政务数据共享的公益性相冲突，因此凡是把\"有偿\"填入的选项都可直接排除。","correctReason":"《江苏省公共数据管理办法》明确公共管理和服务机构之间共享公共数据以共享为原则、不共享为例外，并实行无偿共享。","wrongReason":"A：把原则与例外颠倒成\"不共享为原则\"；B：既颠倒原则与例外，又错写为有偿共享；C：虽列\"共享、不共享\"顺序正确，但\"有偿共享\"与无偿共享要求相违，均不选。","source":"《江苏省公共数据管理办法》","keyPoint":"公共数据共享：共享为原则、不共享为例外、无偿共享。"},{"id":"第一部分基础题-四、其他政策法规条例-单选题-23","no":23,"kind":"single","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"单选题","stem":"依据《江苏省省级政务信息化项目建设管理办法》，项目单位在哪个阶段需 首次制定密码应用方案？（ ）","options":[{"key":"A","text":"项目建成阶段"},{"key":"B","text":"项目实施阶段"},{"key":"C","text":"竣工验收阶段"},{"key":"D","text":"运维阶段"}],"answer":"B","analysis":"本题考密码应用方案的形成时点。按照密码应用与项目建设同步的要求，项目单位应当在项目实施阶段就制定密码应用方案，并据此同步建设密码保障系统，而不是等到建成或验收、运维阶段再补。方案先行是保证密码措施与业务系统同步落地的关键，也是后续密评的基础。","correctReason":"《江苏省省级政务信息化项目建设管理办法》要求项目实施阶段即制定密码应用方案，实现密码与项目同步建设。","wrongReason":"A：项目建成阶段再定方案已无法与建设同步；C：竣工验收阶段方案应已落实，此时制定为时已晚；D：运维阶段属于运行环节，方案应在建设期形成，三项均不符合同步要求。","source":"《江苏省省级政务信息化项目建设管理办法》","keyPoint":"密码应用方案在项目实施阶段首次制定。"},{"id":"第一部分基础题-四、其他政策法规条例-单选题-24","no":24,"kind":"single","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"单选题","stem":"当前，个人信息被企业、机构甚至个人广泛收集使用，个人信息保护和个人 信息利用的矛盾日益突出。那么，根据《个人信息保护合规审计管理办法》要求， 如果某大型电商平台处理超过1500 万用户个人信息，该平台合规审计的最低频 率应为（ ）。","options":[{"key":"A","text":"每半年一次"},{"key":"B","text":"每年一次"},{"key":"C","text":"每两年一次"},{"key":"D","text":"每三年一次"}],"answer":"C","analysis":"本题考个人信息保护合规审计的强制频次门槛。《个人信息保护合规审计管理办法》规定，处理超过1000万人个人信息的个人信息处理者，应当每两年至少开展一次合规审计；处理未达该数量标准的一般由企业自主确定审计频次。本题中平台处理超1500万人信息，已越过门槛，最低频次即每两年一次。","correctReason":"处理超过1000万人个人信息的处理者，按《个人信息保护合规审计管理办法》应每两年至少开展一次合规审计，1500万用户已超门槛。","wrongReason":"A：每半年一次、B：每年一次均严于法定最低频次，不是该办法规定的强制要求；D：每三年一次低于\"每两年至少一次\"的底线，不符合规定。","source":"《个人信息保护合规审计管理办法》","keyPoint":"超1000万人个人信息：合规审计每两年至少一次。"},{"id":"第一部分基础题-四、其他政策法规条例-单选题-25","no":25,"kind":"single","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"单选题","stem":"《江苏省公共数据管理办法》规定：（ ）会同有关主管部门建立公共数 据管理安全应急处置机制，指导公共管理和服务机构制定安全处置应急预案，定 期组织应急演练。","options":[{"key":"A","text":"工信部门"},{"key":"B","text":"网信部门"},{"key":"C","text":"电信部门"},{"key":"D","text":"数据管理部门"}],"answer":"B","analysis":"本题考公共数据安全应急处置机制的组织部门。网络安全与数据安全事件应对由网信部门统筹，因此《江苏省公共数据管理办法》规定由网信部门会同有关主管部门建立公共数据管理安全应急处置机制，指导公共管理和服务机构制定安全处置应急预案并定期组织应急演练。工信、电信部门负责行业与网络运行管理，数据管理部门主责数据资源管理，均不牵头该机制。","correctReason":"《江苏省公共数据管理办法》明确网信部门会同有关主管部门建立公共数据管理安全应急处置机制并指导应急预案制定与演练。","wrongReason":"A：工信部门负责工业和信息化行业管理，不牵头数据安全应急机制；C：电信部门负责通信网络运行，与管理机制无关；D：数据管理部门主责公共数据资源管理和共享开放，安全应急处置机制由网信部门牵头。","source":"《江苏省公共数据管理办法》","keyPoint":"公共数据安全应急处置机制由网信部门会同有关部门建立。"},{"id":"第一部分基础题-四、其他政策法规条例-多选题-1","no":1,"kind":"multi","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"多选题","stem":"依据《网络数据安全风险评估办法》，有关主管部门应当按照（ ）原则组 织开展本行业、本领域的风险评估工作。","options":[{"key":"A","text":"谁管业务"},{"key":"B","text":"谁管业务数据"},{"key":"C","text":"谁管数据安全"},{"key":"D","text":"谁管网络安全"}],"answer":"ABC","analysis":"《网络数据安全风险评估办法》确定的分工原则是「谁管业务、谁管业务数据、谁管数据安全」三位一体：主管部门对业务负责，业务产生的数据也归口管理，数据安全责任随之落地。A、B、C 正是这一递进关系，缺一不可；D「谁管网络安全」是另一个层面的工作口径，办法并未把它列为风险评估的组织原则。本题考的是行业主管与数据安全责任的对应关系，属纯记忆型考点。","correctReason":"该办法明确按「谁管业务、谁管业务数据、谁管数据安全」原则，由有关主管部门组织开展本行业、本领域的风险评估。","wrongReason":"D：网络安全运行管理与数据安全风险评估不是同一归口口径，该原则中不含此表述。","source":"《网络数据安全风险评估办法》","keyPoint":"风险评估归口：谁管业务、谁管业务数据、谁管数据安全。"},{"id":"第一部分基础题-四、其他政策法规条例-多选题-2","no":2,"kind":"single","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"单选题（连线）","stem":"关键信息基础设施是国家安全的核心命脉，涉及能源、交通、金融、国防等关键领域。请结合《关键信息基础设施安全保护条例》内容，将责任主体与对应的法定职责或权限正确连线：","options":[{"key":"A","text":"1—B；2—A；3—C；4—D"},{"key":"B","text":"1—A；2—C；3—D；4—B"},{"key":"C","text":"1—C；2—D；3—B；4—A"},{"key":"D","text":"1—D；2—B；3—A；4—C"}],"answer":"A","analysis":"本题考《关键信息基础设施安全保护条例》中四类主体各管什么。条例确立在国家网信部门统筹协调下、国务院公安部门负责指导监督的体制：网信部门统筹跨部门信息共享与威胁研判，保护工作部门管本行业本领域认定规则，运营者负主体责任并做安全背景审查。错项都是把职能整体错位。抓住“统筹协调—网信”“指导监督—公安”“定规则—保护工作部门”“主体责任—运营者”这条主线即可。","correctReason":"《关键信息基础设施安全保护条例》第三条规定国家网信部门统筹协调、国务院公安部门负责指导监督，第九条规定保护工作部门制定本行业本领域认定规则并报国务院公安部门备案，第十四条规定运营者对专门安全管理机构负责人和关键岗位人员进行安全背景审查，故1—B、2—A、3—C、4—D成立。","wrongReason":"B：把统筹协调信息共享与威胁研判（网信部门，属B）安到保护工作部门头上，又把背景审查安给公安机关、指导监督安给运营者，四项全部错位；C：把背景审查、指导监督、统筹协调分别错配给网信部门、保护工作部门、运营者；D：把公安机关写成认定规则制定者，与公安机关“安全保卫、防范打击犯罪”的职责不符。（原卷选项D内容为“1—D；2—B；3—A；4—C”，本批次输入文件未收录该行）","source":"《关键信息基础设施安全保护条例》第三条、第九条、第十四条、第二十三条","keyPoint":"网信统筹、公安指导监督、保护工作部门定规则、运营者负主体责任。","note":"原卷此题排版异常（配对项题号与正式题号混排），题面与选项已按原页 PDF 图片校正。","pairs":["1.国家网信部门 —— A.制定本行业、本领域关键信息基础设施认定规则","2.保护工作部门 —— B.统筹协调跨部门网络安全信息共享与威胁研判","3.运营者 —— C.对专门安全管理机构负责人实施安全背景审查","4.公安机关 —— D.依法指导监督全国关键信息基础设施安全保护"]},{"id":"第一部分基础题-四、其他政策法规条例-多选题-3","no":3,"kind":"multi","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"多选题","stem":"根据《电子认证服务使用密码管理办法》，申请《电子认证服务使用密码许可证》应当具备的条件包括（　）。","options":[{"key":"A","text":"具有企业法人资格"},{"key":"B","text":"具有在境内设置、符合国家有关密码标准的电子认证服务系统"},{"key":"C","text":"具有密码或者相关专业知识的专业人员"},{"key":"D","text":"注册资本不低于5000万元"}],"answer":"ABC","analysis":"申请《电子认证服务使用密码许可证》的条件，围绕主体资格、系统合规和人员素质三方面展开：要有企业法人资格，要有在境内设置且符合国家密码标准的电子认证服务系统，还要有具备密码或相关专业知识的专业人员。A、B、C 分别对应这三点。D 是干扰项，该办法并未把注册资本数额作为许可条件，故不选。","correctReason":"法人资格、境内合规的电子认证服务系统、密码或相关专业人员，是取得该许可证应当具备的法定条件。","wrongReason":"D：该办法未对注册资本设定数额门槛，属无依据的干扰表述。","source":"《电子认证服务使用密码管理办法》","keyPoint":"许可三要件：法人资格、合规系统、专业人员。","note":"原卷此题题号与上一题排版粘连（上一题的配对项被印成了 1./2.），题面已按原页 PDF 图片校正。"},{"id":"第一部分基础题-四、其他政策法规条例-多选题-5","no":5,"kind":"multi","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"多选题","stem":"国家密码管理局在对行政许可申请进行审查时，可以采取的技术评审方式包 括（ ）。","options":[{"key":"A","text":"电子认证服务系统安全性审查"},{"key":"B","text":"互联互通测试"},{"key":"C","text":"运营场所、设备设施实地查勘"},{"key":"D","text":"管理体系实地查勘"}],"answer":"ABCD","analysis":"行政许可审查中的技术评审不是单纯看书面材料，而是可以用多种手段核实申请单位是否真正具备条件：安全性审查针对电子认证服务系统本身，互联互通测试验证系统与其他系统的互通能力，实地查勘则分别查看运营场所、设备设施和管理体系。四项都是常用的技术评审方式，故全选。本题考的是「技术评审方式」这一清单式考点。","correctReason":"安全性审查、互联互通测试，以及对运营场所、设备设施和管理体系的实地查勘，均属审查时可采取的技术评审方式。","wrongReason":"无错误选项：A、B、C、D 四项均属技术评审方式，本题为全选。","source":"《电子认证服务使用密码管理办法》","keyPoint":"技术评审四式：安审、互通测试、场所设施查勘、体系查勘。"},{"id":"第一部分基础题-四、其他政策法规条例-多选题-6","no":6,"kind":"multi","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"多选题","stem":"密码管理部门在监督检查中，应遵守的义务包括（ ）。","options":[{"key":"A","text":"不得影响电子认证服务系统的正常运行"},{"key":"B","text":"不得收取任何费用"},{"key":"C","text":"不得泄露在履行职责中知悉的商业秘密"},{"key":"D","text":"检查人员不得少于三人"}],"answer":"ABC","analysis":"密码管理部门开展监督检查，既要有权也要有边界：不得影响电子认证服务系统正常运行，不得收取任何费用，不得泄露履职中知悉的商业秘密，这三项都是依法行政和保护被检查对象权益的要求。检查人员人数另有规定（通常要求不少于两人），D 写「不得少于三人」与该要求不符。注意本类题目常把「人数、期限、费用」做成数字陷阱。","correctReason":"不干扰系统正常运行、不收费、不泄露商业秘密，是密码管理部门监督检查中必须遵守的法定义务。","wrongReason":"D：现场检查人员的法定最低人数不是三人，该表述与规定不符。","source":"《电子认证服务使用密码管理办法》","keyPoint":"监督检查义务：不扰运行、不收费、不泄密。"},{"id":"第一部分基础题-四、其他政策法规条例-多选题-7","no":7,"kind":"multi","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"多选题","stem":"根据《商用密码产品认证规则》，以下对商用密码认证证书的说法正确的是 （ ）","options":[{"key":"A","text":"商用密码产品认证证书的有效期为五年"},{"key":"B","text":"认证机构定期监督认定不符合证书保持条件的，可以撤销认证证书"},{"key":"C","text":"认证证书覆盖产品变更的，认证证书有效期不变"},{"key":"D","text":"认证证书覆盖产品扩展的，认证证书有效期自动终止"}],"answer":"ABC","analysis":"《商用密码产品认证规则》下的认证证书管理，考点集中在有效期与证书变更两件事上：证书有效期为五年，认证机构定期监督后认定不再符合证书保持条件的，可以撤销证书；证书覆盖的产品发生变更时，证书本身不重新起算，有效期保持不变。D 把「产品扩展」的后果说成有效期自动终止，属对适用规则和条件的错误表述，故不选。","correctReason":"证书有效期五年、监督不合格可撤销、覆盖产品变更不改变有效期，均与认证规则的证书管理要求一致。","wrongReason":"D：产品扩展并非认证证书有效期自动终止的法定情形，规则中无此后果。","source":"《商用密码产品认证规则》","keyPoint":"认证证书五年有效；变更不改期，不合格可撤销。"},{"id":"第一部分基础题-四、其他政策法规条例-多选题-8","no":8,"kind":"multi","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"多选题","stem":"获得《电子认证服务使用密码许可证》的机构违反《电子认证服务使用密码 管理办法》相关规定，可能面临的行政处罚包括（ ）。","options":[{"key":"A","text":"警告"},{"key":"B","text":"通报批评"},{"key":"C","text":"罚款"},{"key":"D","text":"吊销营业执照"}],"answer":"ABC","analysis":"持证机构违反《电子认证服务使用密码管理办法》，可由密码管理部门给予警告、通报批评、罚款等行政处罚，这是本办法设定的处罚种类。D 不选的原因在于主体和种类都不对：吊销营业执照属于市场监督管理部门的职权，不在密码管理部门的处罚权限之内，本办法也未设定该处罚。做题时先看处罚主体，再看处罚种类是否在规定清单内。","correctReason":"警告、通报批评、罚款是本办法对违规持证机构规定的行政处罚种类。","wrongReason":"D：吊销营业执照由市场监督管理部门依相关法规实施，不属密码管理部门的处罚权限。","source":"《电子认证服务使用密码管理办法》","keyPoint":"行政处罚种类看主体权限：密码部门不管营业执照。"},{"id":"第一部分基础题-四、其他政策法规条例-多选题-9","no":9,"kind":"single","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"单选题（连线）","stem":"《江苏省数据条例》已由江苏省第十四届人民代表大会第三次会议于2025 年 1 月22 日通过，自2025 年4 月1 日起施行。那么，请将以下数据应用领域与其 对应的条例内容进行正确匹配： 应用领域 条例内容","options":[{"key":"A","text":"1—A；2—D；3—C；4—B"},{"key":"B","text":"1—D；2—B；3—A；4—C"},{"key":"C","text":"1—B；2—C；3—D；4—A"},{"key":"D","text":"1—C；2—A；3—B；4—D"}],"answer":"A","analysis":"本题考《江苏省数据条例》第六、四章中几类典型场景的制度表述。正确一组基本按条文顺序展开：制造业对智能车间、智能工厂和制造业基础数据库，农业对数智化场景与精准化管理，公共服务对整合医疗教育数据资源、推进城市全域数字化转型，跨境试点对自贸区数据出境清单与一般数据自由流动。错项是把四个领域的关键词整体错位。记关键词即可：制造看工厂、农业看数智化、公共服务看医疗教育、跨境看自贸区清单。","correctReason":"《江苏省数据条例》第五十四条明确推动数据在制造业等工业领域应用、推进智能车间和智能工厂建设并构建基础数据库，第五十五条规定农业领域建设数智化场景、提升精准化管理水平，第五十八条要求整合数据资源推进城市全域数字化转型，第四十三条规定自贸区可制定数据出境清单并探索一般数据自由流动，与1—A、2—D、3—C、4—B完全一致。（该题答案以官方为准）","wrongReason":"B：把跨境流通的“自贸区数据出境清单”错配给制造业，把农业（数智化场景）配给跨境试点，公共服务配给智能工厂，制造配给医疗教育数据整合，四项全错；C：把制造业配给数据出境清单、跨境配给农业生产数智化场景，领域与内容完全颠倒；D：跨境试点配成智能车间智能工厂，农业配成自贸区清单，均为张冠李戴。（原卷选项D内容为“1—C；2—A；3—B；4—D”，本批次输入文件未收录该行）","source":"《江苏省数据条例》第五十四条、第五十五条、第五十八条、第四十三条","keyPoint":"制造—智能工厂、农业—数智化场景、公共服务—医疗教育、跨境—自贸区清单。","pairs":["1.制造业领域的数据应用 —— A.推动智能车间、智能工厂建设，构建制造业基础数据库","2.农业领域的数据应用 —— B.制定自贸区数据出境清单，探索一般数据自由流动","3.公共服务领域的数据应用 —— C.整合医疗、教育等
