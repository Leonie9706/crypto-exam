数据资源，推进城市全域数字化转型","4.数据跨境流通试点 —— D.建设农业生产数智化场景，提升数字化精准管理水平"]},{"id":"第一部分基础题-四、其他政策法规条例-多选题-10","no":10,"kind":"multi","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"多选题","stem":"依据《网络数据安全风险评估办法》，风险评估包括哪些活动？（ ）","options":[{"key":"A","text":"风险识别"},{"key":"B","text":"风险分析"},{"key":"C","text":"风险评价"},{"key":"D","text":"风险处置"}],"answer":"ABC","analysis":"《网络数据安全风险评估办法》把风险评估界定为风险识别、风险分析、风险评价三个环节：识别是找出风险源与脆弱性，分析是判定风险发生的可能性和影响，评价是定出风险等级并形成结论。D 的风险处置是评估结论出来之后单独开展的管理动作，不属于评估活动本身，故不选。本题考的是评估流程的边界，属易混点。","correctReason":"风险评估包括风险识别、风险分析和风险评价三项活动，是办法对评估内涵的明确界定。","wrongReason":"D：风险处置是对评估结论的后续应对措施，不属于风险评估活动本身。","source":"《网络数据安全风险评估办法》","keyPoint":"风险评估三环节：识别、分析、评价；处置不算。"},{"id":"第一部分基础题-四、其他政策法规条例-判断题-1","no":1,"kind":"judge","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"判断题","stem":"《电子认证服务使用密码管理办法》的施行日期是2026 年7 月1 日，同时废 止了2009 年发布的旧版办法。","options":[],"answer":"对","analysis":"该题考新规的时间节点。《电子认证服务使用密码管理办法》由国家密码管理局令第6号公布，自2026年7月1日起施行，同时废止2009年10月28日公告第17号公布、2017年修正的《电子认证服务密码管理办法》。注意新规把「密码」二字加进名称，旧办法叫《电子认证服务密码管理办法》，新旧名称只差一个「使用」，很容易看串。两个时间点要分开记：公布日是2026年5月30日，施行日是2026年7月1日。","correctReason":"该办法第二十五条明确自2026年7月1日起施行，并同时废止2009年发布的旧版办法，与题干表述一致。","wrongReason":"","source":"《电子认证服务使用密码管理办法》（2026年国家密码管理局令第6号）第二十五条","keyPoint":"新规2026年7月1日施行，废止2009年旧办法"},{"id":"第一部分基础题-四、其他政策法规条例-判断题-2","no":2,"kind":"judge","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"判断题","stem":"按照《关键信息基础设施安全保护条例》，关键信息基础设施中的密码使用 和管理，应当遵守《中华人民共和国密码法》等相关法律、行政法规的规定。","options":[],"answer":"对","analysis":"考点是《关键信息基础设施安全保护条例》与《密码法》的衔接关系。条例第五十条第二款规定，关键信息基础设施中的密码使用和管理，还应当遵守相关法律、行政法规的规定；《密码法》正是密码领域的基本法律，故题干表述成立。这说明关基保护条例并未对密码另设一套独立制度，而是「借用」密码法律法规体系。复习时把「关基的密码问题回归密码法管」这条衔接记住即可。","correctReason":"条例明确关基中的密码使用和管理还应遵守相关法律、行政法规的规定，而《密码法》是密码领域的基本法律，故该表述成立。","wrongReason":"","source":"《关键信息基础设施安全保护条例》第五十条第二款","keyPoint":"关基的密码使用和管理适用《密码法》等法律法规"},{"id":"第一部分基础题-四、其他政策法规条例-判断题-3","no":3,"kind":"judge","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"判断题","stem":"根据《国家政务信息化项目建设管理办法》，除国家发展改革委审批或者核 报国务院审批的外，其他有关部门自行审批新建、改建、扩建，以及通过政府购 买服务方式产生的国家政务信息化项目，应当按规定履行审批程序并向国家发展 改革委备案。","options":[],"answer":"对","analysis":"考国家政务信息化项目的审批与备案口径。属于「谁审批、谁负责，但要归口备案」的思路：国家发展改革委审批或核报国务院审批的项目走主渠道，其他部门自行审批的新建、改建、扩建项目以及政府购买服务方式产生的项目，履行审批程序后还要报国家发展改革委备案。备案不是可选项，而是法定动作，报送内容还包含密码应用方案和密码应用安全性评估报告，这也正是密码工作者要关注的连接点。","correctReason":"该办法第九条对自行审批及政府购买服务方式产生的项目作出与题干完全一致的审批加备案要求。","wrongReason":"","source":"《国家政务信息化项目建设管理办法》第九条","keyPoint":"自审批项目须履行审批程序并向国家发展改革委备案"},{"id":"第一部分基础题-四、其他政策法规条例-判断题-4","no":4,"kind":"judge","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"判断题","stem":"获得《电子认证服务使用密码许可证》的机构，其相关专业技术人员和安全 管理人员每年的密码安全教育培训时间不得少于20 个小时。","options":[],"answer":"对","analysis":"考持证机构的培训义务。新办法要求持证机构制定电子认证服务使用密码安全教育培训计划，每年组织安全知识和岗位技能培训，相关专业技术人员和安全管理人员每年教育培训时间不得少于20个小时。注意「20小时」是年度下限，且对象限定为这两类人员，不是全员。与之相邻的还有一项高频考点：持证机构应自行或委托专业机构每年至少进行一次使用密码合规性评估，培训次数和评估次数都是「每年」，别与许可证有效期5年混在一起。","correctReason":"新办法第十七条直接规定了每年教育培训时间不得少于20个小时的量化要求，题干数据准确。","wrongReason":"","source":"《电子认证服务使用密码管理办法》（2026年国家密码管理局令第6号）第十七条","keyPoint":"专业技术人员和安全管理人员每年培训不少于20小时"},{"id":"第一部分基础题-四、其他政策法规条例-判断题-5","no":5,"kind":"judge","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"判断题","stem":"根据《国家政务信息化项目建设管理办法》，对于不符合密码应用和网络安 全要求，或者存在重大安全隐患的政务信息系统，可以通过安排运行维护经费进 行整改。","options":[],"answer":"错","analysis":"考资金管理的「反向约束」。该办法第二十八条规定，对不符合密码应用和网络安全要求或者存在重大安全隐患的政务信息系统，不安排运行维护经费，并且项目建设单位不得新建、改建、扩建政务信息系统。题干说「可以通过安排运行维护经费进行整改」，正好把禁止性规定说成了可行做法，方向反了。正确理解是：先用整改消除隐患、通过相应评估，才谈得上经费安排，钱不是用来兜住安全隐患的。","correctReason":"该办法对不符合密码应用和网络安全要求或存在重大安全隐患的系统，明确规定不安排运行维护经费，故题干「可以安排经费整改」的说法不成立。","wrongReason":"","source":"《国家政务信息化项目建设管理办法》第二十八条第三项","keyPoint":"不合密码与网络安全要求的系统不安排运维经费"},{"id":"第一部分基础题-四、其他政策法规条例-判断题-6","no":6,"kind":"judge","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"判断题","stem":"因许可证有效期满需要延续的，机构应当在有效期届满30 日前向国家密码管 理局提出书面申请。","options":[],"answer":"错","analysis":"考许可证延续的时限。新办法把延续申请的提前期定为有效期届满60日前，且要求书面提出，与国家密码管理局在有效期届满前作出是否准予延续的决定。题干写的是30日，属于把变更手续的30日期限错安到延续上——该办法第十一条对机构名称、住所、法定代表人变更以及系统新建搬迁等情形规定的是「自变更之日起30日内」办理变更手续，两个30和60极易混淆。","correctReason":"延续申请须在有效期届满60日前向国家密码管理局书面提出，题干写30日前，与法定时限不符。","wrongReason":"","source":"《电子认证服务使用密码管理办法》（2026年国家密码管理局令第6号）第十二条","keyPoint":"延续提前60日，变更自变更之日起30日内"},{"id":"第一部分基础题-四、其他政策法规条例-判断题-7","no":7,"kind":"judge","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"判断题","stem":"电子认证服务系统所需的密钥服务，可以由机构自行搭建的密钥管理系统提 供。","options":[],"answer":"错","analysis":"考密钥管理系统的来源限定。电子认证服务属于为社会公众提供信任锚点的服务，其密钥服务必须由国家密码管理局或者省、自治区、直辖市密码管理部门规划的密钥管理系统提供，机构不得自建自用。原因在于根密钥和密钥管理体系一旦自建，就等于自己给自己发信任凭证，互联互通和监管都无从落地。这条也是新办法第二十一条列明的处罚情形之一，可见其刚性。","correctReason":"法定密钥服务只能由国家密码管理局或者省、自治区、直辖市密码管理部门规划的密钥管理系统提供，机构自行搭建不符合规定。","wrongReason":"","source":"《电子认证服务使用密码管理办法》（2026年国家密码管理局令第6号）第十四条","keyPoint":"密钥服务只能来自密码管理部门规划的密钥管理系统"},{"id":"第一部分基础题-四、其他政策法规条例-判断题-8","no":8,"kind":"judge","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"判断题","stem":"根据《电子认证服务密码管理办法》，电子认证服务系统所需密钥服务由国 家密码管理局和省、自治区、直辖市密码管理机构规划的密钥管理系统提供。","options":[],"answer":"对","analysis":"考点与上一题相同，但命题用的是旧规章名称《电子认证服务密码管理办法》，其内容在现行《电子认证服务使用密码管理办法》中被完整继承：密钥服务由国家密码管理局或者省、自治区、直辖市密码管理部门规划的密钥管理系统提供。因此题干关于密钥服务来源的表述成立。需留意的是，旧名称规章已被2026年7月1日施行的新办法废止，复习时按新名称、新条号记忆更稳妥。","correctReason":"密钥服务由国家密码管理局及省、自治区、直辖市密码管理部门规划的密钥管理系统提供，这一制度在新旧规章中一脉相承，表述成立。","wrongReason":"","source":"《电子认证服务使用密码管理办法》（2026年国家密码管理局令第6号）第十四条；原《电子认证服务密码管理办法》第六条","keyPoint":"密钥服务由密码管理部门规划的密钥管理系统提供"},{"id":"第一部分基础题-四、其他政策法规条例-判断题-9","no":9,"kind":"judge","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"判断题","stem":"如果《电子认证服务使用密码许可证》被依法吊销，国家密码管理局应当将 有关情况通报国务院工业和信息化主管部门。","options":[],"answer":"对","analysis":"考许可证退出环节的部门通报机制。电子认证服务与工业和信息化主管部门监管的电子认证服务许可制度相互配套，因此当《电子认证服务使用密码许可证》被依法吊销、撤销或者注销时，由国家密码管理局将有关情况通报国务院工业和信息化主管部门。题干只提到吊销一种情形，本身没错，但完整记忆应包含吊销、撤销、注销三种，避免在多选题里漏项。","correctReason":"该办法第二十三条明确规定许可证被吊销、撤销、注销的，由国家密码管理局通报国务院工业和信息化主管部门，题干表述符合该规定。","wrongReason":"","source":"《电子认证服务使用密码管理办法》（2026年国家密码管理局令第6号）第二十三条","keyPoint":"许可证吊销撤销注销均须通报国务院工信主管部门"},{"id":"第一部分基础题-四、其他政策法规条例-判断题-10","no":10,"kind":"judge","part":"第一部分基础题","cat":"四、其他政策法规条例","type":"判断题","stem":"《商用密码应用安全性评估管理办法》规定，重要网络与信息系统建成运行 后，其运营者应当自行或者委托商用密码检测机构每两年至少开展一次商用密码 应用安全性评估，确保商用密码保障系统正确有效运行。","options":[],"answer":"错","analysis":"考密评的频次红线。《商用密码应用安全性评估管理办法》第九条规定，重要网络与信息系统建成运行后，运营者应当自行或者委托商用密码检测机构每年至少开展一次密评，确保商用密码保障系统正确有效运行；未通过的应当改造，改造期间采取必要措施保证系统运行安全。题干把「每年」写成「每两年」，频次减半即为错。评估报告还应在形成后30日内报密码管理部门备案，这两个数字一起记。","correctReason":"法定频次是每年至少一次，题干所述「每两年至少一次」低于法定要求，故表述不成立。","wrongReason":"","source":"《商用密码应用安全性评估管理办法》第九条","keyPoint":"建成运行后密评每年至少一次，报告30日内备案"},{"id":"第二部分专业题-一、密码学-单选题-1","no":1,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"以下哪种情况可以实现对消息完整性的认证，也提供消息源真实性鉴别 （ ）。","options":[{"key":"A","text":"对消息进行SM3 杂凑计算，将消息和杂凑值一并发送给接收者"},{"key":"B","text":"对消息进行SM4-CTR 计算，将密文发送给接收者"},{"key":"C","text":"对消息进行SM2 签名计算，将消息和签名一并发送给接收者"},{"key":"D","text":"对消息进行SM3 杂凑计算，将消息发送给接收者，并通过可靠的方式将消息 的摘要离线发送给接收者，保证摘要值无法被攻击者篡改"}],"answer":"C","analysis":"本题考查完整性认证与消息源真实性鉴别的区别。数字签名用签名者私钥对消息（或其杂凑值）生成签名，验证者用公钥验证，既校验消息是否被改动，也证明消息来自私钥持有者，因此同时满足完整性与源鉴别。裸杂凑值没有秘密，任何人可换消息重算，只能防偶然篡改而不能证明来源。本题易混点是把杂凑当成认证手段。","correctReason":"SM2签名由发送方私钥生成、可用其公钥验证，只有私钥持有者能生成，故同时提供完整性认证与消息源真实性鉴别。","wrongReason":"A：只计算SM3杂凑且随消息一同发送，攻击者可篡改消息并重算杂凑，无源鉴别；B：SM4-CTR是加密，只解决机密性，密文可被篡改且不能证明来源；D：虽能防篡改，但摘要离线传送仍由发送方计算，缺少不可否认的源鉴别依据。","source":"GM/T 0003-2012《SM2椭圆曲线公钥密码算法》；GB/T 32918-2016","keyPoint":"要同时保完整性+认来源，只能靠私钥生成的数字签名"},{"id":"第二部分专业题-一、密码学-单选题-2","no":2,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"打扑克是一种流行于全世界的休闲类游戏，玩扑克之前首先要进行洗牌，从 密码学的角度看，可以将洗牌理解为一种加密运算，目的是让玩家猜不到牌的顺 序，那么这种加密运算属于（ ）。","options":[{"key":"A","text":"置换加密"},{"key":"B","text":"代换加密"},{"key":"C","text":"公钥加密"},{"key":"D","text":"序列加密"}],"answer":"A","analysis":"本题考查古典密码两大基本变换的区分。洗牌只改变每张牌所处的位置，牌面本身（A还是K）不变，对应密码学中保持字符不变、只重排次序的置换加密。代换加密则是字符被换成别的字符，牌面改变而位置保留。公钥加密与序列加密属于现代密码体制，与洗牌这种位置重排的直观模型无关。抓住“位置变、符号不变”即可迅速定答案。","correctReason":"洗牌只重新排列各元素的位置而不改变元素本身，符合置换加密“只换位置、不换符号”的特征。","wrongReason":"B：代换加密是把明文字符替换为其他字符，牌面会改变，与洗牌不符；C：公钥加密基于数学难题，依赖公钥私钥对，不是位置重排；D：序列加密用密钥流逐位异或，属于按位叠加运算。","source":"《密码学》基础理论（古典密码：置换与代换）","keyPoint":"置换换位置，代换换符号"},{"id":"第二部分专业题-一、密码学-单选题-3","no":3,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"密码学理论研究通常包括哪两个分支（ ）。","options":[{"key":"A","text":"对称加密与非对称加密"},{"key":"B","text":"密码编码学与密码分析学"},{"key":"C","text":"序列算法与分组算法"},{"key":"D","text":"DES 和RSA"}],"answer":"B","analysis":"本题考查密码学的学科划分。密码学理论研究通常分为两个分支：研究如何设计保密与认证系统的密码编码学，以及研究如何攻破这些系统的密码分析学。两者互为对手、相互促进，共同推动算法强度提升。其余选项都是具体技术分类或具体算法名字，属于密码编码学内部的分支或实例，不是一个与密码分析学并列的理论分支。","correctReason":"密码学理论由“造密码”的密码编码学与“破密码”的密码分析学两个相互对立的分支构成。","wrongReason":"A：对称与非对称加密只是密码算法的分类方式；C：序列算法与分组算法是分组/流密码的实现形态划分；D：DES和RSA是具体算法名称，不构成理论分支。","source":"《密码学》基础理论（密码编码学与密码分析学）","keyPoint":"两大分支：密码编码学（造）＋密码分析学（破）"},{"id":"第二部分专业题-一、密码学-单选题-4","no":4,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"在下面分组密码加密工作模式中，有密文传输错误扩散的是（ ）。","options":[{"key":"A","text":"ECB"},{"key":"B","text":"OFB"},{"key":"C","text":"CBC"},{"key":"D","text":"CTR"}],"answer":"D","analysis":"本题考查分组密码工作模式的错误传播特性。ECB各分组独立加密，单块出错只影响该块；OFB的密钥流由反馈函数独立生成，密文某比特出错只导致对应明文比特翻转；CBC具有自同步性，错误只扩散到当前块和下一块。而CTR模式若密文分组出现丢失或计数序列失步，后续各分组解密所用的计数块全部错位，整段数据无法恢复，即存在错误扩散。","correctReason":"CTR依靠计数器同步，一旦密文块丢失或计数失步，其后所有分组解密都会错位，错误大范围扩散。","wrongReason":"A：ECB逐块独立，错误严格限于单个分组；B：OFB密钥流与密文无关，错误不传播；C：CBC仅把错误扩散到当前和下一个分组，随后自动同步恢复。","source":"GB/T 17964-2021《信息安全技术 分组密码算法的工作模式》","keyPoint":"CTR靠计数器同步，失步即全段错误扩散"},{"id":"第二部分专业题-一、密码学-单选题-5","no":5,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"在量子攻击下，根据Grover 算法，采用SM4 的分组密码CTR 模式抵抗密钥 恢复攻击的强度大约是（ ）。","options":[{"key":"A","text":"2^32"},{"key":"B","text":"2^64"},{"key":"C","text":"2^96"},{"key":"D","text":"2^128"}],"answer":"B","analysis":"本题考查量子算法对对称密码安全强度的影响。Grover算法对密钥穷举搜索提供平方根级加速，SM4密钥长度为128比特，经典穷举复杂度为2^128，量子搜索下约降为2^64，因此密钥恢复强度约为2^64。分组长度128比特下，即使考虑Grover下生日界带来的碰撞复杂度下降，2^64仍是本题所问的密钥恢复量级，故选B。","correctReason":"Grover搜索把128比特密钥的穷举复杂度由2^128降到约2^(128/2)=2^64。","wrongReason":"A：2^32是密钥长度64比特在Grover下的量级；C：2^96未对应任何本量级推导；D：2^128是经典穷举强度，未考虑量子加速。","source":"Grover量子搜索算法；GM/T 0002-2012《SM4分组密码算法》","keyPoint":"Grover把n比特密钥强度从2^n降到2^(n/2)，SM4即2^64"},{"id":"第二部分专业题-一、密码学-单选题-6","no":6,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"杂凑函数不可直接应用于（ ）。","options":[{"key":"A","text":"数字签名"},{"key":"B","text":"安全存储口令"},{"key":"C","text":"加解密"},{"key":"D","text":"数字指纹"}],"answer":"C","analysis":"本题考查杂凑函数的用途边界。杂凑函数是单向压缩函数，只做“任意长输入到定长输出”的不可逆映射，没有解密密钥和逆运算，因此不能直接用于需要还原明文的加解密。它能用于数字签名（压缩待签数据）、口令安全存储（保存口令杂凑值并加盐）、数字指纹（文件完整性校验）等场景。把杂凑当加密算法是常见误区。","correctReason":"杂凑运算单向不可逆、无解密环节，无法还原原始数据，故不能直接用于加解密。","wrongReason":"A：签名先对消息做杂凑压缩，是标准用法；B：口令通常只存杂凑值（加盐）以防泄露；D：杂凑值是文件的数字指纹，用于完整性比对。","source":"GB/T 32905-2016《SM3密码杂凑算法》","keyPoint":"杂凑单向不可逆，能签名能存口令，就是不能加解密"},{"id":"第二部分专业题-一、密码学-单选题-7","no":7,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"DES 算法中扩展运算E 的功能是（ ）。","options":[{"key":"A","text":"对16 位的数据组的各位进行选择和排列，产生一个32 位的结果"},{"key":"B","text":"对32 位的数据组的各位进行选择和排列，产生一个48 位的结果"},{"key":"C","text":"对48 位的数据组的各位进行选择和排列，产生一个64 位的结果"},{"key":"D","text":"对56 位的数据组的各位进行选择和排列，产生一个64 位的结果"}],"answer":"B","analysis":"本题考查DES轮函数的内部结构。DES把64比特分组分成左右各32比特，轮函数先对右半32比特做扩展置换E，按固定规律重复其中16个比特，把这些比特选择、排列为48比特，以便与48比特的轮密钥异或后再进S盒压缩。E运算只做位置选择与重复，不改变比特取值。它是DES实现混淆与扩散的关键环节之一。","correctReason":"扩展置换E输入为32比特的右半分组，按表重复16位后输出48比特，用于与48比特轮密钥异或。","wrongReason":"A：16位输入产生32位不符合DES结构；C：48位到64位描述的是密钥置换而非扩展E；D：56位到64位是密钥初始置换中的比特选择关系，与E无关。","source":"GB/T 15277-2013《信息安全技术 分组密码算法的工作模式》及DES算法规范（FIPS 46-3）","keyPoint":"DES的E运算：32位→48位，靠重复16位对齐轮密钥"},{"id":"第二部分专业题-一、密码学-单选题-8","no":8,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"一个序列密码具有很高的安全强度主要取决于（ ）。","options":[{"key":"A","text":"密钥流生成器的设计"},{"key":"B","text":"初始向量长度"},{"key":"C","text":"明文长度"},{"key":"D","text":"加密算法"}],"answer":"A","analysis":"本题考查序列密码安全性的根源。序列密码的安全几乎完全取决于密钥流生成器：密钥流必须具有长周期、良好的随机统计特性、高线性复杂度以及对已知明文攻击的抵抗能力。初始向量只保证同一密钥下密钥流不重复，明文长度和所谓“加密算法”本身不决定强度。因此设计良好的密钥流生成器才是强度来源。","correctReason":"序列密码的安全性由密钥流生成器的设计质量决定，其周期、线性复杂度与随机性直接决定密码强度。","wrongReason":"B：初始向量只用于区分同一密钥下的不同密钥流，本身不提供强度；C：明文长度是数据属性，与算法强度无关；D：序列密码的“加密”通常只是逐位异或，强度不在这一步。","source":"《密码学》序列密码原理；GM/T 0001-2012《祖冲之序列密码算法》","keyPoint":"流密码强度看密钥流生成器，不看异或那一步"},{"id":"第二部分专业题-一、密码学-单选题-9","no":9,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"如果DES 加密使用的轮密钥为k1，k2……k16，则DES 解密时第一轮使用的 密钥为（ ）。","options":[{"key":"A","text":"K1"},{"key":"B","text":"K8"},{"key":"C","text":"K12"},{"key":"D","text":"K16"}],"answer":"D","analysis":"本题考查DES解密与加密的对称关系。DES的16轮迭代结构相同，解密时只需把子密钥的使用顺序完全颠倒：解密第一轮用K16，第二轮用K15，依此类推，最后一轮用K1。这样每轮的逆运算与原加密过程相互抵消，实现正确还原。子密钥顺序不能乱，这是Feistel结构可解密的关键。","correctReason":"DES解密轮密钥按加密顺序逆序使用，故解密第一轮对应的是K16。","wrongReason":"A：K1是加密第一轮所用，正序使用等于再加密一次；B：K8处在中间轮次，不构成逆序起点；C：K12同样不是逆序序列的首个子密钥。","source":"DES算法规范（FIPS 46-3）","keyPoint":"DES解密＝同结构＋子密钥逆序（K16先上）"},{"id":"第二部分专业题-一、密码学-单选题-10","no":10,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"下面关于AES 算法的叙述，哪一个是正确的？（ ）","options":[{"key":"A","text":"AES 算法是用56 比特的密钥加密64 比特的明文得到64 比特的密文"},{"key":"B","text":"AES 算法属于非对称密码算法"},{"key":"C","text":"AES 是一个数据块长度和密钥长度可分别为128 比特、192 比特或256 比特的 分组密码算法"},{"key":"D","text":"AES 是一个数据块长度和密钥长度可分别为64 比特或128 比特的分组密码算 法"}],"answer":"C","analysis":"本题考查AES的基本参数。AES是分组密码（对称），分组长度固定为128比特，密钥长度可为128、192或256比特，对应10、12、14轮迭代，状态按4×4字节矩阵运算。A把它与DES的参数混淆，B把对称算法说成非对称，D把分组长度误写成可选64或128比特。本题答案以官方为准，请优先记住“分组固定128比特”这一更精确的表述。","correctReason":"AES分组固定128比特，密钥长度可分别取128、192、256比特，属分组对称密码算法。","wrongReason":"A：56比特密钥、64比特分组是DES的参数；B：AES是对称分组密码，不属于非对称算法；D：AES分组长度不取64比特。","source":"FIPS 197（AES）；GB/T 32907-2016《信息安全技术 SM4分组密码算法》参照对比","keyPoint":"AES分组固定128比特，密钥128/192/256比特"},{"id":"第二部分专业题-一、密码学-单选题-11","no":11,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"如果密钥序列的产生独立于明文消息和密文消息，那么此类序列密码称为 （ ）。","options":[{"key":"A","text":"同步序列密码"},{"key":"B","text":"非同步序列密码"},{"key":"C","text":"自同步序列密码"},{"key":"D","text":"移位序列密码"}],"answer":"A","analysis":"本题考查序列密码的同步性分类。若密钥流的生成只依赖密钥和初始向量，与明文、密文完全无关，则收发双方必须严格保持密钥流位置同步，这类称为同步序列密码（如基于LFSR的密钥流发生器）。自同步（非同步）序列密码的密钥流由密钥和已产生的密文共同决定，密文出错会在有限步后自动恢复同步。抓住“密钥流是否依赖明文/密文”这一判据即可。","correctReason":"密钥流产生独立于明文与密文，正符合同步序列密码的定义。","wrongReason":"B：非同步序列密码的密钥流受密文影响；C：自同步序列密码的密钥流由密钥和先前密文共同决定；D：“移位序列密码”不是标准的分类名称。","source":"《密码学》序列密码分类理论","keyPoint":"密钥流与明密文无关＝同步序列密码"},{"id":"第二部分专业题-一、密码学-单选题-12","no":12,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"（ ）密码体制，其原理是加密密钥和解密密钥分离。这样，一个具体用 户就可以将自己设计的加密密钥和算法公诸于众，而只保密解密密钥。","options":[{"key":"A","text":"对称"},{"key":"B","text":"私钥"},{"key":"C","text":"代换"},{"key":"D","text":"公钥"}],"answer":"D","analysis":"本题考查公钥密码体制的核心特征。公钥体制中加密密钥（公钥）与解密密钥（私钥）分离且不能由公钥推出私钥，因此用户可公开加密密钥与算法，只保密解密密钥。对称与私钥体制收发双方共用同一密钥，密钥必须保密、无法公开；代换加密只是古典密码的一种变换手法。公钥公开正是为解决密钥分发难题而生。","correctReason":"加密密钥与解密密钥分离、且可公开加密密钥而只保密解密密钥，是公钥密码体制的定义性特征。","wrongReason":"A：对称体制加解密共用同一密钥，密钥必须保密不能公开；B：私钥体制同样共用密钥，与“密钥分离”矛盾；C：代换加密是古典密码的字符替换技术，不涉及密钥分离。","source":"《密码学》公钥密码体制原理；GB/T 32918-2016《SM2椭圆曲线公钥密码算法》","keyPoint":"公钥体制标志：加解密密钥分离、公钥可公开"},{"id":"第二部分专业题-一、密码学-单选题-13","no":13,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"某业务员发起了“从A 账户向B 账户转账1 亿元”的转账请求数据并进行 加密传输，攻击者将捕获的密文分组数据进行对调，将原转账请求内容改为“从 B 账户向A 账户转账1 亿元”，以下加密模式可能会导致该问题发生的是（ ）。","options":[{"key":"A","text":"CBC"},{"key":"B","text":"ECB"},{"key":"C","text":"BCC"},{"key":"D","text":"CFB"}],"answer":"B","analysis":"本题考查ECB模式的结构性缺陷。ECB对每个分组用同一密钥独立加密，相同明文分组必然产生相同密文分组，分组之间也没有链接关系。攻击者虽不知密钥，却可整块调换密文分组的位置，从而改变明文的语义顺序，使“A转B”变成“B转A”。CBC、CFB等模式引入链接或反馈，分组顺序被打乱后解密结果会混乱，从而能暴露篡改。","correctReason":"ECB逐块独立加密且无链接，密文分组位置可被直接调换而解密仍有效，导致明文语义被改写。","wrongReason":"A：CBC后一分组与前一分组密文链接，调换顺序会破坏后续解密结果；C：BCC内部带链接，顺序改变会产生错误；D：CFB具有反馈链接，同样不易被整块重排利用。","source":"GB/T 17964-2021《信息安全技术 分组密码算法的工作模式》（ECB模式安全性分析）","keyPoint":"ECB无链接、可重排，相同明文出相同密文"},{"id":"第二部分专业题-一、密码学-单选题-14","no":14,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"原始的Diffie-Hellman 密钥交换协议易受（ ）。","options":[{"key":"A","text":"中间人攻击"},{"key":"B","text":"选择密文攻击"},{"key":"C","text":"已知明文攻击"},{"key":"D","text":"被动攻击"}],"answer":"A","analysis":"本题考查Diffie-Hellman密钥交换的安全边界。原始DH只依赖离散对数难题保证会话密钥不可由公开参数推出，但双方交换的公开值没有身份认证，攻击者可在中间分别与双方各建立一份密钥，冒充彼此转发，即中间人攻击。选择密文攻击针对公钥加密体制，已知明文攻击针对加密算法的强度，被动攻击只窃听而不篡改。DH本身不解决身份认证，需配合签名或证书。","correctReason":"原始DH协议的公开值缺少身份认证，攻击者可分别冒充双方完成两次密钥协商，实施中间人攻击。","wrongReason":"B：选择密文攻击针对公钥加密方案，不是密钥交换的主要威胁；C：已知明文攻击考察加密算法抗分析能力；D：被动攻击仅窃听，无法改变密钥协商结果，故DH对被动窃听是安全的。","source":"《密码学》Diffie-Hellman密钥交换协议分析；GB/T 32918-2016","keyPoint":"裸DH缺身份认证，怕中间人，不怕被动窃听"},{"id":"第二部分专业题-一、密码学-单选题-15","no":15,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"多变量公钥密码的安全性基础是基于（ ）的困难性。","options":[{"key":"A","text":"求解有限域上随机生成的多变量非线性多项式方程组"},{"key":"B","text":"大整数分解"},{"key":"C","text":"任意线性码的译码问题"},{"key":"D","text":"最小整数解问题"}],"answer":"A","analysis":"本题考查多变量公钥密码的困难性假设。该类体制以有限域上二次（或更高次）多变量多项式方程组为核心，公钥是一组多变量多项式，私钥是可逆的仿射变换与中心映射。已知公钥求私钥或恢复明文，归结为求解有限域上随机多变量非线性方程组（MQ问题），该问题被广泛认为困难甚至NP困难。大整数分解是RSA的基础，任意线性码译码是McEliece类体制的基础。","correctReason":"多变量公钥密码的安全性建立在求解有限域上随机多变量非线性多项式方程组的困难性之上。","wrongReason":"B：大整数分解困难性是RSA类体制的基础；C：任意线性码译码困难性是McEliece等纠错码体制的基础；D：“最小整数解问题”不是标准的困难问题名称，与多变量体制无关。","source":"《密码学》多变量公钥密码（MQ问题）原理","keyPoint":"多变量公钥＝解有限域多变量非线性方程组难"},{"id":"第二部分专业题-一、密码学-单选题-16","no":16,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"使用有效资源对一个密码系统进行分析而未被破译，则该密码是（ ）。","options":[{"key":"A","text":"计算上安全"},{"key":"B","text":"不安全"},{"key":"C","text":"无条件安全"},{"key":"D","text":"不可破译"}],"answer":"A","analysis":"本题考查安全性的两种层次。计算安全指在现有计算资源与算法条件下，破译所需代价（时间、存储、成本）超出攻击者可行范围，因而“用有效资源分析而未被破译”。无条件安全（完善保密）要求无论攻击者拥有多强算力都无法破译，只有一次一密等极少数体制具备。不可破译是绝对表述，现实中绝大多数实用算法只做到计算安全。","correctReason":"使用有效（现实可行）资源分析仍无法破译，正是计算上安全即计算安全性的定义。","wrongReason":"B：未被破译却判定“不安全”自相矛盾；C：无条件安全要求任意算力都无法破译，标准远高于题意；D：“不可破译”是绝对结论，无法由有限资源下的分析结果得出。","source":"《密码学》密码体制安全性定义（计算安全与无条件安全）","keyPoint":"有效资源攻不破＝计算安全；任何资源攻不破＝无条件安全"},{"id":"第二部分专业题-一、密码学-单选题-17","no":17,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"SM4 算法的密钥和明文长度分别是多少比特？（ ）。","options":[{"key":"A","text":"128、256"},{"key":"B","text":"128、128"},{"key":"C","text":"256、128"},{"key":"D","text":"256、256"}],"answer":"B","analysis":"本题考查SM4的基本参数。SM4是我国自主设计的分组密码算法，分组长度128比特，密钥长度也是128比特，采用32轮非线性迭代，加解密结构相同、轮密钥逆序使用。选项把密钥与分组长度张冠李戴或写成256比特均是常见干扰。记住SM4是“128对128”即可，与AES可支持更长密钥不同。","correctReason":"SM4算法的密钥长度为128比特，明文分组长度同样为128比特。","wrongReason":"A：128、256把分组长度误写成256比特；C：256、128把密钥长度误写成256比特；D：256、256两者均错，SM4不支持256比特密钥。","source":"GM/T 0002-2012《SM4分组密码算法》","keyPoint":"SM4：分组128比特＋密钥128比特，32轮"},{"id":"第二部分专业题-一、密码学-单选题-18","no":18,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"AES 算法中的状态可表示为一个二维数组，如果明文长度为128 比特，则明 文状态为（ ）。","options":[{"key":"A","text":"4 行4 列"},{"key":"B","text":"4 行6 列"},{"key":"C","text":"4 行8 列"},{"key":"D","text":"4 行10 列"}],"answer":"A","analysis":"本题考查AES的状态表示。AES把128比特分组按字节排成4行4列共16字节的二维状态数组，即4行4列，每列4字节，列数等于分组长度除以32。若分组更长（192比特为4行6列，256比特为4行10列）才需要更多列，而AES标准分组固定128比特，故状态为4行4列。字节顺序按列优先填充，是理解轮变换的基础。","correctReason":"128比特分组等于16字节，按4行排列即4行4列的状态矩阵。","wrongReason":"B：4行6列对应192比特分组的状态规模；C：4行8列对应256比特分组的列数写法之一；D：4行10列是AES-256的轮数而非128比特分组的状态列数，属典型混淆。","source":"FIPS 197（AES）第3.4节 状态（State）表示","keyPoint":"AES状态恒为4行×（分组比特/32）列，128比特即4×4"},{"id":"第二部分专业题-一、密码学-单选题-19","no":19,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"关于对称加密和非对称加密，以下说法正确的是（ ）。","options":[{"key":"A","text":"对称加密的安全性较高"},{"key":"B","text":"对称加密一定比非对称加密的安全性高"},{"key":"C","text":"对称加密的效率较高"},{"key":"D","text":"非对称加密的效率较高"}],"answer":"C","analysis":"本题考查两类密码体制的对比。对称加密加解密共用密钥，运算多为移位、异或、查表等简单操作，软硬件实现速度远快于非对称加密，适合大数据量加密；非对称加密基于大数模幂、椭圆曲线点乘等复杂运算，效率低，但便于密钥分发与数字签名。安全性高低取决于算法与密钥长度，不能一概而论，故“对称一定更安全”是错误表述。","correctReason":"对称加密运算简单、密钥短、加解密共用同一密钥，因此实现效率明显高于非对称加密。","wrongReason":"A：笼统称“对称加密安全性较高”不成立，安全性取决于算法强度与密钥长度；B：“一定比非对称安全”属绝对化表述；D：非对称加密涉及大数运算，效率远低于对称加密。","source":"《密码学》对称密码与非对称密码性能对比","keyPoint":"对称快而省，非对称慢但好分发密钥、能做签名"},{"id":"第二部分专业题-一、密码学-单选题-20","no":20,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"SM4 算法是我国国家密码管理局发布的商用密码标准，其广泛应用于金融数 据传输、电子商务安全、电子政务等场景。SM4 密钥扩展算法中的线性变换由 输入及其循环左移若干比特共（ ）项异或而成。","options":[{"key":"A","text":"3"},{"key":"B","text":"4"},{"key":"C","text":"5"},{"key":"D","text":"32"}],"answer":"A","analysis":"本题考查SM4密钥扩展算法中的线性变换。密钥扩展每轮把前四个字与常量CK异或后送入τ（S盒）与线性变换L′，L′(x)=x⊕(x<<<13)⊕(x<<<23)，除输入x本身外只有左移13位和23位这两个循环移位项参与异或，故除x外涉及2项、按题意计入输入本身共3项，选A。注意轮函数中的L是4项参与异或，不可与密钥扩展的L′混淆。","correctReason":"SM4密钥扩展的线性变换为L′(x)=x⊕(x<<<13)⊕(x<<<23)，除输入本身外只有两个循环移位项参与异或。","wrongReason":"B：4对应轮函数线性变换L(x)=x⊕(x<<<2)⊕(x<<<10)⊕(x<<<18)⊕(x<<<24)的项数；C：5同样是轮函数L的异或项数；D：32是SM4的迭代轮数，与线性变换异或项数无关。","source":"GM/T 0002-2012《SM4分组密码算法》密钥扩展算法","keyPoint":"密钥扩展L′只有13、23两个移位项，轮函数L有2/10/18/24四项"},{"id":"第二部分专业题-一、密码学-单选题-21","no":21,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"我国商用分组密码算法SM4 加密的轮数为（ ）。","options":[{"key":"A","text":"12 轮"},{"key":"B","text":"14 轮"},{"key":"C","text":"16 轮"},{"key":"D","text":"32 轮"}],"answer":"D","analysis":"本题考查SM4的迭代轮数。SM4加密采用32轮非线性迭代结构，每轮使用一个32比特轮密钥，由初始密钥经密钥扩展算法生成32个轮密钥。DES是16轮，AES按密钥长度分别为10、12、14轮，均与SM4不同。轮数多使得差分、线性等分析的复杂度大幅提升，是SM4抵抗密码分析的重要保障。","correctReason":"SM4算法的标准规定加密与解密均采用32轮非线性迭代。","wrongReason":"A：12轮与AES-192轮数相同，不是SM4；B：14轮是AES-256的轮数；C：16轮是DES的迭代轮数。","source":"GM/T 0002-2012《SM4分组密码算法》","keyPoint":"SM4＝32轮，DES＝16轮，AES＝10/12/14轮"},{"id":"第二部分专业题-一、密码学-单选题-22","no":22,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"下列关于SM4 分组密码算法叙述错误的是（ ）。","options":[{"key":"A","text":"一般来说，分组密码迭代轮数越多，密码分析越困难"},{"key":"B","text":"可以用于数据加密"},{"key":"C","text":"是对称密码"},{"key":"D","text":"是不可逆的"}],"answer":"D","analysis":"本题考查SM4的性质。SM4是分组对称密码，加解密结构相同、轮密钥逆序使用，因而是可逆的分组密码，能正确还原明文，故“不可逆”的说法错误。一般情况下迭代轮数越多，密码分析的难度越大，这是分组密码设计的普遍经验；SM4用于数据加密也是其基本用途。本题要求选出叙述错误的一项，故选D。","correctReason":"SM4是可逆分组密码，解密时轮密钥逆序即可还原明文，故“不可逆”的表述错误。","wrongReason":"A：轮数增加一般会提高抗差分、线性分析能力，表述正确；B：SM4的基本用途就是数据加解密，表述正确；C：SM4加解密使用同一密钥体系，属对称密码，表述正确。","source":"GM/T 0002-2012《SM4分组密码算法》","keyPoint":"SM4可逆：加密解密同结构、轮密钥逆序"},{"id":"第二部分专业题-一、密码学-单选题-23","no":23,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"下述关于SM4 算法和AES 算法采用的S 盒之间的关系叙述错误的是（ ）。","options":[{"key":"A","text":"都是8 比特输入8 比特输出的非线性置换"},{"key":"B","text":"都是基于有限域逆运算构造"},{"key":"C","text":"两者之间线性等价"},{"key":"D","text":"两者之间仿射等价"}],"answer":"C","analysis":"本题考查SM4与AES的S盒关系。两者都是8比特进8比特出的非线性置换，且在有限域GF(2^8)上均与求逆运算相关，因此存在仿射等价关系，但二者具体构造（仿射变换与常量的选取、SM4采用复合仿射结构）不同，并不满足线性等价。故选“线性等价”这一错误表述。区分仿射等价与线性等价（是否允许非零常数项）是本题的易混点。","correctReason":"SM4与AES的S盒是仿射等价关系而非线性等价，故“两者之间线性等价”的叙述错误。","wrongReason":"A：两者均为8比特输入、8比特输出的非线性置换，表述正确；B：两者构造都与有限域GF(2^8)上的求逆运算相关，表述正确；D：两者确为仿射等价，表述正确。","source":"SM4（GM/T 0002-2012）与AES（FIPS 197）S盒构造对比；密码学S盒等价性研究","keyPoint":"SM4与AES的S盒：仿射等价成立，线性等价不成立"},{"id":"第二部分专业题-一、密码学-单选题-24","no":24,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"下列关于SM4 分组密码算法叙述正确的是（ ）。","options":[{"key":"A","text":"一次只对明文消息的单个字符进行加解密变换"},{"key":"B","text":"是不可逆的"},{"key":"C","text":"采用了正形置换设计思想"},{"key":"D","text":"需要密钥同步"}],"answer":"C","analysis":"本题考查SM4的设计思想。SM4在轮函数与密钥扩展中采用正形置换（orthomorphism）设计思想，用以提高算法的扩散性和抵抗差分、线性分析的能力，防止相邻轮之间出现不良相关。SM4是分组密码，一次处理128比特整块而非单个字符；加解密可逆；作为分组密码不需要流密码那样的密钥流同步，故其余选项均错。","correctReason":"SM4在结构设计中采用了正形置换设计思想，以增强扩散与抗密码分析能力。","wrongReason":"A：SM4是分组密码，每次处理128比特分组，不是逐字符变换；B：SM4加解密均可逆；D：需要密钥流同步是序列密码的特点，分组密码不涉及。","source":"GM/T 0002-2012《SM4分组密码算法》设计说明","keyPoint":"SM4采用正形置换设计思想；密钥同步是流密码的事"},{"id":"第二部分专业题-一、密码学-单选题-25","no":25,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"下列关于SM4 的解密算法叙述错误的是（ ）。","options":[{"key":"A","text":"解密算法与加密算法结构相同"},{"key":"B","text":"解密轮密钥与加密轮密钥相同"},{"key":"C","text":"解密轮密钥是加密轮密钥的逆序"},{"key":"D","text":"解密算法与加密算法都采用32 轮迭代"}],"answer":"B","analysis":"本题考查SM4解密算法的实现方式。SM4加密解密共用同一轮函数与结构，区别仅在轮密钥的使用顺序：解密时把加密轮密钥按逆序使用，即rk35,rk34,…,rk0，因此“解密轮密钥与加密轮密钥相同”是错误的，正确的是逆序。解密同样进行32轮迭代。这是分组密码“同结构＋轮密钥逆序”实现解密的典型设计。","correctReason":"SM4只有把加密轮密钥逆序使用才能解密，故“解密轮密钥与加密轮密钥相同”的叙述错误。","wrongReason":"A：解密算法与加密算法结构完全相同，表述正确；C：解密轮密钥是加密轮密钥的逆序，表述正确；D：两者都采用32轮迭代，表述正确。","source":"GM/T 0002-2012《SM4分组密码算法》解密算法","keyPoint":"SM4解密＝同结构＋32轮＋轮密钥逆序"},{"id":"第二部分专业题-一、密码学-单选题-26","no":26,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"下列关于SM4 的密钥扩展算法叙述错误的是（ ）。","options":[{"key":"A","text":"采用32 轮非线性迭代结构"},{"key":"B","text":"每次迭代生成32 比特轮密钥"},{"key":"C","text":"采用与加密算法相同的S 盒"},{"key":"D","text":"采用与加密算法相同的线性变换"}],"answer":"D","analysis":"本题考查SM4密钥扩展算法与加密算法的差异。密钥扩展同样采用32轮非线性迭代、每轮产生32比特轮密钥、复用与加密相同的S盒（τ变换），但其中的线性变换是L′（只含13、23两个循环移位项），与加密轮函数中4项参与的L不同，故“采用与加密算法相同的线性变换”错误。系统参数FK与固定参数CK也只出现在密钥扩展中。","correctReason":"密钥扩展使用线性变换L′，加密轮函数使用L，两者不同，故“相同的线性变换”叙述错误。","wrongReason":"A：密钥扩展采用32轮非线性迭代结构，表述正确；B：每次迭代生成32比特轮密钥，表述正确；C：密钥扩展与加密使用相同的S盒，表述正确。","source":"GM/T 0002-2012《SM4分组密码算法》密钥扩展算法","keyPoint":"密钥扩展L′（13、23）≠轮函数L（2、10、18、24）"},{"id":"第二部分专业题-一、密码学-单选题-27","no":27,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"下列分组密码认证模式中，使用密钥最少的是（ ）。","options":[{"key":"A","text":"OMAC"},{"key":"B","text":"TMAC"},{"key":"C","text":"XCBC"},{"key":"D","text":"EMAC"}],"answer":"A","analysis":"本题考查分组密码认证（MAC）模式的密钥需求。OMAC是对CBC-MAC的改进，仅需一个分组密码密钥即可完成消息认证，无需额外的辅助密钥。XCBC需一个分组密钥并辅以派生参数处理；TMAC需额外引入由密钥派生的第二密钥；EMAC也需两个密钥（一密钥加密、一密钥做掩码/输出变换）。因此使用密钥最少的是OMAC。","correctReason":"OMAC仅使用一个分组密码密钥即可生成认证标签，在三类改进模式中密钥需求最少。","wrongReason":"B：TMAC需要通过密钥派生第二个密钥作掩码，密钥数多于OMAC；C：XCBC虽只用分组密钥，但依赖附加派生处理，密钥使用数量不少于OMAC；D：EMAC需两个密钥分别用于加密和最终变换。","source":"ISO/IEC 9797-1（MAC算法）；OMAC/CMAC（NIST SP 800-38B）","keyPoint":"OMAC/CMAC只需一个分组密码密钥"},{"id":"第二部分专业题-一、密码学-单选题-28","no":28,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"序列密码也称为（ ），它是对称密码算法的一种。","options":[{"key":"A","text":"非对称密码"},{"key":"B","text":"公钥密码"},{"key":"C","text":"流密码"},{"key":"D","text":"古典密码"}],"answer":"C","analysis":"本题考查基本术语。序列密码又称流密码，是每次处理一位或一字节、用密钥流与明文逐位叠加的对称密码算法，与分组密码并列构成对称密码的两大实现形态。非对称密码与公钥密码是同一类体制的两种叫法，与序列密码不属同一范畴；古典密码指历史上的手工或机械密码，与现代序列密码不是同义关系。","correctReason":"序列密码即流密码，是与分组密码并列的对称密码算法实现形态。","wrongReason":"A：非对称密码指公钥体制，与序列密码不同范畴；B：公钥密码同样是非对称体制的别称；D：古典密码指历史上的手工密码，与现代序列密码含义不同。","source":"《密码学》序列密码基本概念；GM/T 0001-2012《祖冲之序列密码算法》","keyPoint":"序列密码＝流密码，逐位/逐字节叠加密钥流"},{"id":"第二部分专业题-一、密码学-单选题-29","no":29,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"如果序列密码所使用的是真正随机方式的、与消息流长度相同的密钥流，则 此时的序列密码就是（ ）密码体制。","options":[{"key":"A","text":"对称"},{"key":"B","text":"非对称"},{"key":"C","text":"古典"},{"key":"D","text":"一次一密"}],"answer":"D","analysis":"本题考查一次一密体制。当密钥流是真正随机的、长度与消息流相同、且密钥只用一次时，密文与明文在统计上完全独立，攻击者无论拥有多大算力都无法确定明文，达到无条件安全（完善保密），这种序列密码就是一次一密。对称、非对称、古典都是分类名称，不描述这种密钥流特性下的体制。它虽理论完美，但密钥分发与管理代价极高，实用性受限。","correctReason":"真正随机、与消息等长且一次一用的密钥流构成一次一密体制，可达到无条件安全。","wrongReason":"A：对称只说明加解密共用密钥，未刻画密钥流的随机与一次性；B：非对称指公钥体制，与真随机密钥流无关；C：古典密码是历史算法的统称，不等于一次一密。","source":"《密码学》完善保密性与一次一密（Vernam密码）理论","keyPoint":"真随机＋等长＋不重复＝一次一密，无条件安全"},{"id":"第二部分专业题-一、密码学-单选题-30","no":30,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"如果泄漏了CBC-MAC 的链接值，会导致如下情况发生（ ）。","options":[{"key":"A","text":"密钥被恢复"},{"key":"B","text":"CBC-MAC 被伪造"},{"key":"C","text":"生成标签错误"},{"key":"D","text":"无任何问题"}],"answer":"B","analysis":"本题考查CBC-MAC的安全性边界。CBC-MAC把最后一个密文分组作为认证标签，其安全性依赖于中间链接值对攻击者保密。若链接值泄漏，攻击者可在已知链接值的基础上继续“续接”伪造消息分组，使新消息的标签与原标签保持一致，从而伪造认证标签。泄漏链接值并不能直接恢复密钥，也不是简单“生成标签错误”，而是给了伪造的可用素材。","correctReason":"链接值泄漏后攻击者可在已知链接值上续接伪造分组，使标签保持不变，从而伪造CBC-MAC。","wrongReason":"A：泄漏链接值不足以反推分组密钥；C：问题不在标签计算过程出错，而在于被攻击者利用；D：链接值属于敏感性中间数据，泄漏必然带来安全风险。","source":"ISO/IEC 9797-1（CBC-MAC安全性分析）；NIST SP 800-38B","keyPoint":"CBC-MAC链接值必须保密，泄漏即可被续接伪造"},{"id":"第二部分专业题-一、密码学-单选题-31","no":31,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"关于DES 加密算法和AES 加密算法的说法中错误的是（ ）。","options":[{"key":"A","text":"DES 是一个分组算法，数据分组长度为64 比特位"},{"key":"B","text":"AES 是一个分组密码算法，数据分组长度为128 比特位"},{"key":"C","text":"DES 和AES 均为对称密钥加密算法"},{"key":"D","text":"DES 和AES 密钥长度为128 比特位（16 字节）"}],"answer":"D","analysis":"这道题考的是两类经典分组密码的基本参数。DES和AES都属于对称分组密码，加解密使用同一密钥。DES分组长度64比特，密钥名义上64比特但只有56比特有效；AES分组长度固定128比特，密钥长度有128、192、256比特三种。D把两者密钥长度都说成128比特，明显错误。这类参数靠死记：DES是「64位分组、56位密钥」，AES是「128位分组、128/192/256位密钥」。","correctReason":"DES密钥有效位仅56比特，AES密钥长度可选128、192或256比特，并非都是128比特，故D的说法错误，为本题所选。","wrongReason":"A：DES确为64比特分组的分组密码，说法正确；B：AES分组长度确为128比特，说法正确；C：DES与AES都是对称密钥加密算法，说法正确。","source":"FIPS PUB 46-3；FIPS PUB 197","keyPoint":"DES：64位分组/56位密钥；AES：128位分组/128·192·256位密钥"},{"id":"第二部分专业题-一、密码学-单选题-32","no":32,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"关于椭圆曲线密码体制正确的是（ ）。","options":[{"key":"A","text":"运算速度一般比对称密码算法快"},{"key":"B","text":"运算速度一般与对称密码一样快"},{"key":"C","text":"密钥长度一般比同等强度的RSA 短"},{"key":"D","text":"密钥长度一般比同等强度的RSA 长"}],"answer":"C","analysis":"椭圆曲线密码（ECC）的安全性建立在椭圆曲线离散对数问题之上，目前求解该问题的最优通用算法是指数复杂度；而RSA依赖的大整数分解存在亚指数算法，所以达到同等安全强度时ECC所需密钥短得多，如256比特ECC约相当于3072比特RSA。但ECC属于公钥算法，运算速度远不及对称密码。","correctReason":"同等安全强度下，椭圆曲线密码的密钥长度明显短于RSA，256位ECC约相当于3072位RSA。","wrongReason":"A：公钥算法涉及大数模乘与点运算，速度远慢于对称密码；B：二者速度不可能一样快，ECC与AES不属于同类运算；D：方向说反了，ECC密钥是更短而不是更长。","source":"GB/T 32918 系列；NIST SP 800-57 Part 1","keyPoint":"ECC密钥短、强度高，但速度慢于对称密码"},{"id":"第二部分专业题-一、密码学-单选题-33","no":33,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"消息鉴别码比杂凑函数增加了（ ）功能。","options":[{"key":"A","text":"机密性保护"},{"key":"B","text":"完整性保护"},{"key":"C","text":"消息源鉴别"},{"key":"D","text":"不可否认性"}],"answer":"C","analysis":"杂凑函数是公开无密钥的，任何人都能对任意消息算出杂凑值，只能校验数据是否被改动，即提供完整性，无法说明消息是谁发的。消息鉴别码MAC引入了共享密钥，只有持有密钥的一方才算得出正确鉴别码，验证通过即证明消息来自持有该密钥的实体，因此比杂凑函数多出消息源鉴别能力。两者都不提供机密性，也不能实现不可否认性，因为共享密钥双方都能生成鉴别码。","correctReason":"MAC基于共享密钥生成鉴别码，只有掌握密钥者才能产生正确值，故在完整性之外还提供消息源鉴别。","wrongReason":"A：两者都不做加密，均不提供机密性；B：完整性保护是杂凑函数本来就具备的能力；D：共享密钥双方都能生成鉴别码，无法实现不可否认，那是数字签名的功能。","source":"GB/T 15852 系列；GB/T 32905-2016","keyPoint":"MAC＝完整性＋密钥，因而有来源鉴别；杂凑无密钥只保完整性"},{"id":"第二部分专业题-一、密码学-单选题-34","no":34,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"关于杂凑函数下列描述有错误的是（ ）。","options":[{"key":"A","text":"杂凑函数的输入长度固定"},{"key":"B","text":"杂凑123.函数的输出长度固定"},{"key":"C","text":"杂凑函数可用于数字签名方案"},{"key":"D","text":"杂凑函数可用于消息完整性机制"}],"answer":"A","analysis":"杂凑函数的特征可概括为：输入长度任意、输出长度固定、单向性、抗碰撞性。它把任意长的消息压缩成固定长度的杂凑值，所以「输入长度固定」恰好说反了。杂凑值常作为数字签名的待签数据，先压缩再签名既提高效率又保护消息；在完整性机制中，比对杂凑值即可发现篡改。B项文字有乱码，但意思为输出长度固定，是正确的表述。","correctReason":"杂凑函数接受任意长度输入，只有输出长度固定，故A「输入长度固定」的表述错误，为本题所选。","wrongReason":"B：输出长度为固定值（如SM3为256比特），表述正确；C：数字签名先对消息杂凑再签名，用途表述正确；D：杂凑值比对是完整性校验的常用手段，表述正确。","source":"GB/T 32905-2016 第4章","keyPoint":"杂凑函数：输入任意长、输出定长、单向、抗碰撞"},{"id":"第二部分专业题-一、密码学-单选题-35","no":35,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"SM4 加密轮函数中的线性变换由输入及其循环左移若干比特共（ ）项异 或而成。","options":[{"key":"A","text":"4"},{"key":"B","text":"5"},{"key":"C","text":"8"},{"key":"D","text":"32"}],"answer":"B","analysis":"SM4的轮函数由非线性变换和线性变换复合而成。设非线性变换的输出为B，则线性变换L(B)=B异或(B循环左移2位)异或(B循环左移10位)异或(B循环左移18位)异或(B循环左移24位)，即输入自身加上4个循环左移版本，共5项异或。记住2、10、18、24这组移位量，项数自然就是5。","correctReason":"SM4的线性变换由输入自身与循环左移2、10、18、24比特的结果共5项异或构成。","wrongReason":"A：4是循环移位的个数，不是异或项数；C：8是SM4中S盒并行处理的字节数，与线性变换项数无关；D：32是字长（比特），不是异或项数。","source":"GB/T 32907-2016 第6.2节","keyPoint":"SM4线性变换＝输入与左移2、10、18、24位共5项异或"},{"id":"第二部分专业题-一、密码学-单选题-36","no":36,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"SHA-1 接收任何长度的输入消息，并产生长度为（ ）位的杂凑值。","options":[{"key":"A","text":"64"},{"key":"B","text":"160"},{"key":"C","text":"512"},{"key":"D","text":"128"}],"answer":"B","analysis":"SHA-1以512比特分组处理消息，经填充与压缩迭代后输出160比特杂凑值，相当于5个32比特字。SHA家族中SHA-224、SHA-256、SHA-384、SHA-512分别输出对应位数的杂凑值，不要与SHA-1混淆。按现行安全要求SHA-1已被认为不再安全，应改用SHA-256或国密SM3（256比特）。","correctReason":"SHA-1的杂凑值长度为160比特，即5个32比特字。","wrongReason":"A：64是填充字段中消息长度域的比特数，不是输出长度；C：512是SHA-1处理消息的分组长度，不是输出长度；D：128是MD5的输出长度，与SHA-1无关。","source":"FIPS PUB 180-4","keyPoint":"SHA-1输出160比特，512比特是它的分组长度"},{"id":"第二部分专业题-一、密码学-单选题-37","no":37,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"如果杂凑函数的函数值为64 位，则对其进行生日攻击的代价为（ ）。","options":[{"key":"A","text":"2^16"},{"key":"B","text":"2^32"},{"key":"C","text":"2^48"},{"key":"D","text":"2^64"}],"answer":"B","analysis":"生日攻击利用随机取样中出现碰撞的概率来寻找杂凑碰撞：对n比特输出的杂凑函数，约需2^(n/2)次运算即可较高概率找到一对碰撞。本题输出为64比特，故攻击代价约为2^32。注意区分：找碰撞是2^(n/2)，而给定杂凑值求原像才是2^n，题目问的是生日攻击即找碰撞，所以选2^32。","correctReason":"生日攻击的复杂度约为2^(n/2)，n为64时即2^32。","wrongReason":"A：2^16是n=32时生日攻击的量级，张冠李戴；C：2^48对应n=96，与64位输出不符；D：2^64是穷举求原像的代价，不是生日攻击找碰撞的代价。","source":"GB/T 32905-2016；生日悖论通用结论","keyPoint":"生日攻击（找碰撞）代价约2^(n/2)，求原像才是2^n"},{"id":"第二部分专业题-一、密码学-单选题-38","no":38,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"对于一个给定的杂凑函数H，其单向性是指（ ）。","options":[{"key":"A","text":"对于给定的杂凑函数H，找到满足H（x）=h 的x 在计算上是不可行的"},{"key":"B","text":"对于给定的分组x，找到满足x≠y 且H（x）=H（y）的y 在计算上是不可行的"},{"key":"C","text":"找到任何满足H（x）=H（y）的（x，y）在计算上是不可行的"},{"key":"D","text":"以上说法都不对"}],"answer":"A","analysis":"杂凑函数的安全性质有三条：单向性（原像不可求）、弱抗碰撞性（第二原像不可求）、强抗碰撞性（任意碰撞不可求）。单向性的标准表述是：给定杂凑值h，找到满足H(x)=h的原像x在计算上不可行。B描述的是弱抗碰撞性（给定x找y不等于x使杂凑值相同），C描述的是强抗碰撞性，二者都不是单向性，要注意题目问的是哪一条性质。","correctReason":"单向性即由杂凑值反推原像不可行，正是A所述的给定h求x在计算上不可行。","wrongReason":"B：这是弱抗碰撞性（第二原像不可求）的定义；C：这是强抗碰撞性的定义；D：既然A正确，该项自然不成立。","source":"GB/T 32905-2016 第4章","keyPoint":"单向性＝给定h求x不可行；碰撞性与之不同"},{"id":"第二部分专业题-一、密码学-单选题-39","no":39,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"为确保加解密结构一致，SM4 算法最后还需经过一次（ ）运算。","options":[{"key":"A","text":"反序变换"},{"key":"B","text":"交叉变换"},{"key":"C","text":"非线性变换"},{"key":"D","text":"正形置换"}],"answer":"A","analysis":"SM4采用32轮迭代结构，加解密调用同一轮函数，只是轮密钥使用次序相反。由于末轮输出的4个字顺序不像输入那样对称，SM4在32轮迭代结束后要对最后一轮输出再做一次反序变换，把X35、X34、X33、X32反序为X32、X33、X34、X35，从而与加解密输入结构保持一致，保证解密能正确还原明文。","correctReason":"SM4在32轮迭代后对末轮输出作一次反序变换，以保证加解密结构一致、共用同一轮函数。","wrongReason":"B：交叉变换不是SM4的组成部分，属凭空术语；C：非线性变换是轮函数内部的一步，不是末尾的整体变换；D：正形置换是分组密码设计中的一种思想，并非SM4的末步运算。","source":"GB/T 32907-2016 第6.2节","keyPoint":"SM4最后一步是反序变换，保证加解密共用同一轮函数"},{"id":"第二部分专业题-一、密码学-单选题-40","no":40,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"DES 算法密钥是64 位，其中密钥有效位为（ ）。","options":[{"key":"A","text":"32 比特"},{"key":"B","text":"56 比特"},{"key":"C","text":"64 比特"},{"key":"D","text":"128 比特"}],"answer":"B","analysis":"DES的输入密钥虽然写作64比特，但每个字节的第8位是奇偶校验位，不参与加解密运算，去掉这8位后实际有效密钥为56比特。密钥先经置换选择PC-1压缩为56比特，再经PC-2产生48比特轮密钥。因此DES的真实密钥空间只有2的56次方，这也是它后来被认为密钥太短而遭淘汰的原因。","correctReason":"64位DES密钥中每字节有1位奇偶校验位，共8位不参与运算，故有效密钥为56比特。","wrongReason":"A：32比特与DES密钥无关；C：64比特是含校验位的名义密钥长度，不是有效位数；D：128比特是AES的密钥长度。","source":"FIPS PUB 46-3","keyPoint":"DES密钥64位含8位校验位，有效密钥56位"},{"id":"第二部分专业题-一、密码学-单选题-41","no":41,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"SM3 密码杂凑算法的链接变量长度为（ ）比特。","options":[{"key":"A","text":"128"},{"key":"B","text":"224"},{"key":"C","text":"256"},{"key":"D","text":"512"}],"answer":"C","analysis":"SM3采用Merkle-Damgard迭代结构，链接变量（中间状态）由8个32比特字组成，合计256比特，因而输出杂凑值也是256比特；消息分组长度为512比特，压缩函数每轮更新这8个字。对这类MD结构的杂凑函数而言，链接变量长度等于输出长度，记住SM3的256比特这个数字即可。","correctReason":"SM3的链接变量为8个32比特字，合计256比特，与输出杂凑值等长。","wrongReason":"A：128是MD5一类的量级，不是SM3；B：224来自SHA-224，与SM3无关；D：512是SM3的消息分组长度，不是链接变量长度。","source":"GB/T 32905-2016 第4章、第5章","keyPoint":"SM3：512比特分组、256比特链接变量与输出"},{"id":"第二部分专业题-一、密码学-单选题-42","no":42,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"在公钥密码体制中，加密过程中用（ ）。","options":[{"key":"A","text":"对方的公钥"},{"key":"B","text":"自己的公钥"},{"key":"C","text":"自己的私钥"},{"key":"D","text":"用公钥和私钥"}],"answer":"A","analysis":"公钥密码体制的核心规则是「公钥加密、私钥解密」。发方要给收方发送保密数据，就用收方对外公开的公钥加密，收方用自己的私钥解密，而私钥只有收方本人持有。不要与签名混淆：签名是自己私钥签、对方用自己公钥验。公钥与私钥成对使用，一次加解密运算中只会用到其中一个。","correctReason":"公钥加密体制中，发方必须使用接收方（对方）的公钥加密，接收方再以自己的私钥解密。","wrongReason":"B：自己的公钥只能供别人给自己发信时使用，不是加密本方外发数据的密钥；C：私钥用于解密或签名，不用于给他人加密；D：公私钥不能同时用于一次加密运算。","source":"GB/T 32918.1-2016","keyPoint":"公钥加密、私钥解密；私钥签名、公钥验证"},{"id":"第二部分专业题-一、密码学-单选题-43","no":43,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"RSA 公钥密码算法的安全性基于（ ）。","options":[{"key":"A","text":"模指数计算"},{"key":"B","text":"离散对数求解问题"},{"key":"C","text":"数论中大整数分解的困难性"},{"key":"D","text":"Euler 定理"}],"answer":"C","analysis":"RSA的模数n为两个大素数p与q之积，n公开而p、q保密。攻击者若能分解n得到p和q，就能求出欧拉函数值，并由公钥e反推出私钥d，因此RSA的安全性归结为大整数分解的困难性。模指数运算和欧拉定理只是RSA构造与正确性证明中的计算工具，本身不构成困难问题；离散对数问题则是ElGamal、DSA等体制的基础。","correctReason":"RSA的私钥可由模数n的素因子分解推出，其安全性建立在大整数分解困难性之上。","wrongReason":"A：模指数是RSA加解密的运算方式，不是安全基础；B：离散对数困难性是ElGamal、DSA等体制的基础；D：欧拉定理是RSA正确性的数学依据，本身不是困难问题。","source":"GB/T 32918 系列；RSA 原始论文（Rivest-Shamir-Adleman, 1978）","keyPoint":"RSA靠大整数分解；ElGamal、DSA靠离散对数"},{"id":"第二部分专业题-一、密码学-单选题-44","no":44,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"ElGamal 公钥密码体制的安全性基于（ ）。","options":[{"key":"A","text":"数域上的离散对数问题"},{"key":"B","text":"椭圆曲线上的离散对数问题"},{"key":"C","text":"数域上大整数素数分解问题"},{"key":"D","text":"椭圆曲线上大整数素数分解问题"}],"answer":"A","analysis":"ElGamal体制在有限域（素域）上构造，公钥由私钥与生成元的幂运算得到，由公钥反推私钥就是求解有限域上的离散对数问题，故其安全性基于数域上的离散对数难题。椭圆曲线密码ECC是离散对数问题在椭圆曲线群上的类似物，属另一类体制；大整数素因子分解是RSA的基础。做题时要看清题目问的是有限域版本还是椭圆曲线版本。","correctReason":"经典ElGamal公钥密码体制建立在有限域（数域）上离散对数问题的困难性之上。","wrongReason":"B：椭圆曲线上的离散对数问题是ECC、SM2的基础，不是经典ElGamal的；C：大整数素数分解是RSA的基础；D：椭圆曲线与大整数分解本就不是同一类问题，该项属拼凑。","source":"ElGamal 原始论文（1985）；GB/T 32918 系列","keyPoint":"ElGamal（有限域）靠离散对数；ECC是它在椭圆曲线上的版本"},{"id":"第二部分专业题-一、密码学-单选题-45","no":45,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"DES 中密钥从输入的64 位到输入F 函数中，轮密钥长度为（ ）。","options":[{"key":"A","text":"64 比特"},{"key":"B","text":"48 比特"},{"key":"C","text":"128 比特"},{"key":"D","text":"36 比特"}],"answer":"B","analysis":"DES的密钥调度过程是：64比特输入密钥先经置换选择PC-1去掉8个校验位、压缩成56比特，再分成左右各28比特，按轮次循环左移后经PC-2置换选择得到每轮48比特的轮密钥。轮密钥在F函数中与经E扩展从32比特扩到48比特的数据异或，所以长度必须为48比特。","correctReason":"DES每轮轮密钥由PC-2从56比特密钥状态中选出48比特，用于与E扩展后的48比特数据异或。","wrongReason":"A：64比特是含奇偶校验位的输入密钥长度；C：128比特是AES密钥长度；D：36比特与DES参数无关，属干扰项。","source":"FIPS PUB 46-3","keyPoint":"DES：输入密钥64位→有效56位→每轮轮密钥48位"},{"id":"第二部分专业题-一、密码学-单选题-46","no":46,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"利用SM2 公钥密码体制两次加密相同的明文，密文（ ）。","options":[{"key":"A","text":"不同"},{"key":"B","text":"相同"},{"key":"C","text":"有时相同，也有不同"},{"key":"D","text":"根据具体情况"}],"answer":"A","analysis":"SM2公钥加密是随机化加密，加密时每次都要生成一个新的随机数k，密文中包含C1（k与基点G的倍点，是随机的椭圆曲线点），以及由k导出的密钥流加密得到的C2和杂凑值C3。由于k每次都不同，C1不同、派生密钥流也不同，所以同一明文加密两次得到的密文必然不同。这种随机化正是为了抵抗重放与密文比对分析，与ECB那种确定性加密形成对比。","correctReason":"SM2加密每次引入新随机数k，密文含随机点C1且密钥流随之变化，故两次加密同一明文所得密文不同。","wrongReason":"B：若密文总是相同则说明加密是确定性的，SM2并非如此；C：既然每轮都用新随机数，不存在有时相同的情形；D：该表述含糊，实际结论是确定的「不同」。","source":"GB/T 32918.4-2016 第6.1节","keyPoint":"SM2为随机化加密，同一明文多次加密的密文每次都不同"},{"id":"第二部分专业题-一、密码学-单选题-47","no":47,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"下述（ ）密码算法与SM2 算法使用相同的数学难题。","options":[{"key":"A","text":"AES"},{"key":"B","text":"RSA"},{"key":"C","text":"ECDSA"},{"key":"D","text":"DES"}],"answer":"C","analysis":"SM2是我国自主设计的椭圆曲线公钥密码算法，安全性建立在椭圆曲线离散对数问题之上。ECDSA同样是基于椭圆曲线离散对数的签名算法，二者数学难题相同，只是曲线参数与算法细节不同。AES和DES是对称分组密码，不以数论难题为基础；RSA依靠大整数分解困难性，与SM2不同。","correctReason":"ECDSA与SM2都建立在椭圆曲线离散对数问题之上，使用相同的数学难题。","wrongReason":"A：AES是对称分组密码，安全性靠S盒与轮变换的混淆扩散，不使用数论难题；B：RSA基于大整数分解困难性；D：DES是对称分组密码，与数论难题无关。","source":"GB/T 32918.1-2016；GM/T 0003 系列","keyPoint":"SM2与ECDSA同源：都基于椭圆曲线离散对数问题"},{"id":"第二部分专业题-一、密码学-单选题-48","no":48,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"相比于RSA 算法，SM2 算法在相同安全强度下，所需的密钥长度要短得多， 因此SM2 算法适合在移动设备、智能卡等资源受限的环境中使用。那么，SM2 算法的安全性基于（ ）困难假设。","options":[{"key":"A","text":"双线性映射"},{"key":"B","text":"椭圆曲线离散对数"},{"key":"C","text":"多线性映射"},{"key":"D","text":"丢番图方程求解"}],"answer":"B","analysis":"SM2属于椭圆曲线公钥密码体制，其私钥是椭圆曲线上的一个标量，公钥是基点与该标量的倍点，由公钥反推私钥等价于求解椭圆曲线离散对数问题，因此安全性基于椭圆曲线离散对数困难假设。这一难题带来的好处正是密钥短、运算量小，适合移动设备、智能卡等资源受限场景。双线性映射、多线性映射是双线性对密码、多线性映射密码的研究方向，不是SM2的基础。","correctReason":"SM2的安全性基于椭圆曲线离散对数问题（ECDLP）的困难性。","wrongReason":"A：双线性映射常用于构造基于对的密码体制，不是SM2的安全基础；C：多线性映射是多线性映射密码的研究基础，与SM2无关；D：丢番图方程求解不是SM2所依据的困难假设。","source":"GB/T 32918.1-2016","keyPoint":"SM2＝椭圆曲线离散对数难题，密钥短、适合受限设备"},{"id":"第二部分专业题-一、密码学-单选题-49","no":49,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"测评过程中，可以作为可能使用SM2 加密的证据有（ ）。","options":[{"key":"A","text":"密文比明文长64 个字节"},{"key":"B","text":"密文的第一部分是SM2 椭圆曲线上的点"},{"key":"C","text":"密文长度为512 比特"},{"key":"D","text":"加密公钥长度为256 比特"}],"answer":"B","analysis":"SM2加密的密文由三部分组成：C1是椭圆曲线上的一个点（由随机数k与基点G相乘得到），C3是杂凑值（用于解密后校验正确性），C2是密文数据本身。因此在测评取证时，若发现密文第一段恰好是曲线上的一点、具有椭圆曲线点的编码结构，就是使用SM2加密最有力的证据。密文长度、公钥长度只是间接线索，并不能单独证明用了SM2。","correctReason":"SM2密文结构为C1加C3加C2，其中第一部分C1必为椭圆曲线上的点，这是识别SM2加密的直接证据。","wrongReason":"A：密文比明文长的字节数随编码方式变化，不能作为判定依据；C：512比特长度并非SM2密文的固定特征；D：SM2公钥为256比特，但仅凭公钥长度无法区分是否用于加密。","source":"GB/T 32918.4-2016 第6.1节","keyPoint":"SM2密文＝C1(曲线上的点)＋C3(杂凑值)＋C2(密文数据)"},{"id":"第二部分专业题-一、密码学-单选题-50","no":50,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"SM4 密钥扩展算法中首先将加密密钥与（ ）异或。","options":[{"key":"A","text":"系统参数"},{"key":"B","text":"固定参数"},{"key":"C","text":"轮常数"},{"key":"D","text":"明文"}],"answer":"A","analysis":"SM4密钥扩展算法以加密密钥MK为输入，第一步先计算各字与系统参数FK的异或值，作为轮密钥生成的初始状态，即K0=MK0异或FK0，其余各字同理。轮常数CK则在逐轮生成轮密钥时与中间值异或，属于后续步骤。所以「首先异或」的对象是系统参数。","correctReason":"SM4密钥扩展第一步是将加密密钥MK与系统参数FK逐字异或，得到轮密钥生成的初始状态。","wrongReason":"B：标准中称FK为系统参数，「固定参数」不是该标准术语（真正含义为固定参数的常写作CK轮常数）；C：轮常数CK用于后续逐轮生成轮密钥时异或，不是最先异或的对象；D：明文不参与密钥扩展。","source":"GB/T 32907-2016 第6.3节","keyPoint":"SM4密钥扩展：先MK异或FK得初态，再逐轮异或轮常数CK"},{"id":"第二部分专业题-一、密码学-单选题-51","no":51,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"下列不属于SM2 公钥加密算法特点的是（ ）。","options":[{"key":"A","text":"每次加密数据时，引入不同的随机数"},{"key":"B","text":"可用于产生数字信封"},{"key":"C","text":"解密过程可以验证结果正确性"},{"key":"D","text":"密文比明文长64 字节"}],"answer":"D","analysis":"SM2公钥加密有几个鲜明特点：加密时引入随机数使同一明文每次密文不同；可用于构造数字信封（用SM2加密对称密钥再加密数据）；解密后可用杂凑值C3校验结果是否正确。其固定开销为C1一个点加C3杂凑值再加1字节长度，通常约97字节而不是64字节，所以D不是SM2的特点，反而是本题所选。","correctReason":"SM2密文的固定附加开销约97字节（C1点64字节加C3杂凑值32字节加1字节长度），并非仅64字节，故D不属于其特点。","wrongReason":"A：该说法与SM2随机化加密的实际相符，不是错误特点；B：该说法也与SM2能力相符，不是错误特点；C：该说法同样与SM2一致，不是错误特点。","source":"GB/T 32918.4-2016 第6.1节","keyPoint":"SM2密文约比明文长97字节：C1(64)＋C3(32)＋长度(1)"},{"id":"第二部分专业题-一、密码学-单选题-52","no":52,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"如果M，C，K 分别表示明文、密文和密钥，而M'，C'，K'分别表示的非， E 表示加密运算，则DES 算法的互补对称性可以表示为（ ）。","options":[{"key":"A","text":"C＝E（M，K），则C'＝E（M'，K'）"},{"key":"B","text":"C＝E（M，K），则C'＝E（M，K）"},{"key":"C","text":"C＝E（M，K），则C'＝E（M，K'）"},{"key":"D","text":"C＝E（M，K），则C'＝E（M'，K）"}],"answer":"A","analysis":"DES的互补对称性（又称互补性）是指：若用密钥K对明文M加密得到密文C，那么把密钥和明文都按位取反后再加密，得到的密文恰好是原密文的按位取反，即C的补等于E(M的补, K的补)。这一性质源于DES中S盒之后的异或结构与密钥异或的线性关系。利用它可把穷举密钥的搜索量减少一半。","correctReason":"DES满足C=E(M,K)时，C的补=E(M的补, K的补)，即密钥与明文同时取反则密文也取反。","wrongReason":"B：明文与密钥都不取反当然得到原密文，不是互补性；C：只把密钥取反不会得到密文的补，必须明文同时取反；D：只把明文取反也不会得到密文的补。","source":"FIPS PUB 46-3；DES 互补性（complementation property）经典结论","keyPoint":"DES互补性：明文与密钥同时取反，密文随之取反"},{"id":"第二部分专业题-一、密码学-单选题-53","no":53,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"RSA 密码算法的安全性是基于（ ）。","options":[{"key":"A","text":"离散对数问题的困难性"},{"key":"B","text":"子集和问题的困难性"},{"key":"C","text":"大整数因子分解的困难性"},{"key":"D","text":"线性编码的解码问题的困难性"}],"answer":"C","analysis":"RSA的安全性来自大整数因子分解的困难性：模数n等于两个大素数p、q之积，n公开而p、q保密，只要能分解n就能求出私钥。离散对数问题对应ElGamal、DSA等；子集和问题是背包密码的基础；线性编码解码问题则是纠错码密码的基础。RSA与这些难题不能混淆。","correctReason":"从公开模数n分解出p和q即可算出私钥，故RSA安全性基于大整数因子分解的困难性。","wrongReason":"A：离散对数问题是ElGamal、DSA等体制的基础；B：子集和问题是背包类公钥密码的基础；D：线性编码的解码问题是纠错码密码的基础。","source":"RSA 原始论文（Rivest-Shamir-Adleman, 1978）","keyPoint":"RSA＝大整数分解；离散对数、子集和是别的体制的基础"},{"id":"第二部分专业题-一、密码学-单选题-54","no":54,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"Alice 收到Bob 发给她的一个文件的签名，并要验证这个签名的有效性，那 么签名验证算法需要Alice 选用的密钥是（ ）。","options":[{"key":"A","text":"Alice 的公钥"},{"key":"B","text":"Alice 的私钥"},{"key":"C","text":"Bob 的公钥"},{"key":"D","text":"Bob 的私钥"}],"answer":"C","analysis":"数字签名的规则是「私钥签名、公钥验证」。Bob要给文件签名形成数字签名，用的是自己的私钥；Alice收到后要验证这个签名是否有效、是否确实出自Bob，就必须用Bob的公钥去验证。Alice自己的公私钥在这份签名上不起作用，Bob的私钥也不可能交给Alice。","correctReason":"签名由Bob的私钥生成，验证必须使用签名者Bob的公钥，故Alice应选用Bob的公钥。","wrongReason":"A：Alice的公钥与Bob的签名无关，不能用于验证；B：Alice的私钥只能用于她自己签名或解密，不能验证Bob的签名；D：Bob的私钥只有Bob持有，验证签名不需要也不应该使用私钥。","source":"GB/T 32918.2-2016","keyPoint":"验证签名用签名者的公钥（此处为Bob的公钥）"},{"id":"第二部分专业题-一、密码学-单选题-55","no":55,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"OFB 是一种分组密码（ ）模式。","options":[{"key":"A","text":"加密"},{"key":"B","text":"认证"},{"key":"C","text":"认证加密"},{"key":"D","text":"杂凑"}],"answer":"A","analysis":"OFB是输出反馈模式（Output Feedback），它反复对初始向量做加密运算产生密钥流，再与明文逐位异或，属于分组密码的加密工作模式之一。分组密码工作模式里，认证模式指MAC类构造，认证加密模式指GCM、CCM这类同时提供保密与认证的模式，杂凑则是另一类算法。因此OFB只归入加密模式。","correctReason":"OFB（输出反馈）通过迭代加密产生密钥流与明文异或，是分组密码的加密工作模式。","wrongReason":"B：认证模式指CBC-MAC、CMAC等消息鉴别码构造；C：认证加密模式指GCM、CCM等同时提供保密与完整性；D：杂凑是压缩函数类算法，与分组密码工作模式不属同一范畴。","source":"GB/T 17964-2021 分组密码算法的工作模式","keyPoint":"OFB是加密工作模式：迭代产生密钥流，与明文异或"},{"id":"第二部分专业题-一、密码学-单选题-56","no":56,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"SM4 是我国提出的商用密码算法，SM4 算法进行加解密时的迭代次数是 （ ）。","options":[{"key":"A","text":"10"},{"key":"B","text":"16"},{"key":"C","text":"31"},{"key":"D","text":"32"}],"answer":"D","analysis":"SM4的分组长度和密钥长度都是128比特，加解密各迭代32轮，密钥扩展也产生32个轮密钥。DES是16轮、分组64比特；AES是10、12或14轮（对应128、192、256比特密钥）。所以看到「SM4迭代次数」，答案就是32轮，注意不要与DES的16轮混淆。","correctReason":"SM4加解密算法采用32轮非线性迭代结构，故迭代次数为32。","wrongReason":"A：10是AES-128的轮数，不是SM4；B：16是DES的迭代轮数，常被用来干扰SM4；C：31是SM3压缩函数的迭代轮数，与SM4无关。","source":"GB/T 32907-2016 第6.2节","keyPoint":"SM4：32轮迭代；DES 16轮；SM3压缩函数64轮"},{"id":"第二部分专业题-一、密码学-单选题-57","no":57,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"CCM 是CTR 工作模式和CBC-MAC 消息鉴别码以（ ）的形式进行结合。","options":[{"key":"A","text":"MAC-then-Encrypt"},{"key":"B","text":"Encrypt-then-MAC"},{"key":"C","text":"Encrypt-and-MAC"},{"key":"D","text":"Hash-then-Encrypt"}],"answer":"A","analysis":"CCM把CTR工作模式与CBC-MAC组合起来，先对消息和附加数据计算CBC-MAC鉴别值，再用CTR模式对消息和鉴别值一起加密，属于典型的先认证后加密结构（MAC-then-Encrypt）。GCM则相反，是先加密再用GHASH做认证（Encrypt-then-MAC）。两者都是认证加密模式，但认证与加密的先后组合方式不同，这是常考的对比点。","correctReason":"CCM采用MAC-then-Encrypt方式，先用CBC-MAC生成鉴别值，再用CTR模式一并加密。","wrongReason":"B：Encrypt-then-MAC是先加密后认证，对应GCM的处理方式；C：Encrypt-and-MAC是边加密边独立计算MAC，为SSH等使用的组合；D：Hash-then-Encrypt不是CCM的组合方式。","source":"NIST SP 800-38C；RFC 3610（CCM）","keyPoint":"CCM＝CBC-MAC后接CTR（MAC-then-Encrypt）；GCM＝先加密后认证"},{"id":"第二部分专业题-一、密码学-单选题-58","no":58,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"Bob 给Alice 发送一封邮件，为让Alice 确信邮件是由Bob 发出的，则Bob 应该选用（ ）对邮件签名。","options":[{"key":"A","text":"Alice 的公钥"},{"key":"B","text":"Alice 的私钥"},{"key":"C","text":"Bob 的公钥"},{"key":"D","text":"Bob 的私钥"}],"answer":"D","analysis":"数字签名用签名者自己的私钥生成，验证者用签名者的公钥验证。Bob要让Alice确信邮件确实由他发出，就必须用自己的私钥对邮件的杂凑值签名；Alice用Bob的公钥验证通过，即可确认邮件来自Bob，且Bob事后无法否认。用Alice的密钥签名毫无意义，因为那只能代表Alice自己。","correctReason":"签名须用签名者自己的私钥，Bob对自己的邮件签名应使用Bob的私钥，Alice再用Bob的公钥验证其身份。","wrongReason":"A：Alice的公钥是Alice对外公开的加密/验证密钥，不能用于Bob签名；B：Alice的私钥只有Alice持有，Bob拿不到，即便拿到也代表不了Bob；C：公钥用于验证而不是生成签名。","source":"GB/T 32918.2-2016","keyPoint":"签名用签名者自己的私钥，验证用签名者的公钥"},{"id":"第二部分专业题-一、密码学-单选题-59","no":59,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"Skipjack 是一个密钥长度为（ ）位分组加密算法。","options":[{"key":"A","text":"56"},{"key":"B","text":"64"},{"key":"C","text":"80"},{"key":"D","text":"128 答案：C 下列分组密码工作模式，在解密过程中具备错误传播扩散的是（ ）。 A.ECB B.OFB C.CFB D.CTR"}],"answer":"C","analysis":"Skipjack是美国NSA设计的分组密码，分组长度64比特，密钥长度80比特，迭代32轮，最初用于Clipper芯片和Fortezza卡，后来解密公开。常见的干扰项是56比特（DES）和128比特（AES）。本题选项D的文字里混入了下一题的内容，属题库排版错误，按选项字母仍以C为答案。","correctReason":"Skipjack是分组长度64比特、密钥长度80比特的分组加密算法，故选80。","wrongReason":"A：56比特是DES的有效密钥长度，不是Skipjack；B：64比特是Skipjack的分组长度（也是DES分组长度），不是密钥长度；D：128比特是AES的密钥长度。","source":"NIST（Skipjack 算法公开资料）；FIPS PUB 185","keyPoint":"Skipjack：64比特分组、80比特密钥、32轮"},{"id":"第二部分专业题-一、密码学-单选题-60","no":60,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"当SM4 算法采用（ ）工作模式时，可以并行处理多组消息分组。","options":[{"key":"A","text":"ECB"},{"key":"B","text":"CBC"},{"key":"C","text":"CFB"},{"key":"D","text":"OFB"}],"answer":"A","analysis":"并行处理的前提是各分组的加解密互不依赖。ECB模式下每个分组独立加密，因此可以并行处理多组消息。CBC加密要用前一分组的密文，CFB、OFB都要用前一步的输出反馈作为下一步输入，加密方向存在前后依赖，不能并行（其中CBC、CFB的解密方向可以并行）。所以能并行的只有ECB。","correctReason":"ECB模式各分组加解密相互独立，故SM4采用ECB时可并行处理多组消息分组。","wrongReason":"B：CBC加密需前一组密文参与，加密方向无法并行；C：CFB采用密文反馈，加密方向需逐步迭代，不能并行；D：OFB采用输出反馈，密钥流需逐块迭代产生，不能并行。","source":"GB/T 17964-2021 分组密码算法的工作模式","keyPoint":"ECB各分组独立可并行；CBC、CFB、OFB加密方向不能并行"},{"id":"第二部分专业题-一、密码学-单选题-61","no":61,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"ZUC 算法比特重组BR 层从上层LFSR 寄存器单元抽取位置不包括（ ）。","options":[{"key":"A","text":"s0"},{"key":"B","text":"s5"},{"key":"C","text":"s9"},{"key":"D","text":"s12"}],"answer":"D","analysis":"ZUC 的比特重组（BR）层从 LFSR 中抽取 8 个 31 比特单元，按固定规则拼成 X0～X3 四个 32 比特字：X0 取 s15 高 16 位与 s14 低 16 位，X1 取 s11 低 16 位与 s9 高 16 位，X2 取 s7 低 16 位与 s5 高 16 位，X3 取 s2 低 16 位与 s0 高 16 位。可见被抽取的是 s0、s2、s5、s7、s9、s11、s14、s15，s12 从未参与，故答案为 D。","correctReason":"BR 层只抽取 s0、s2、s5、s7、s9、s11、s14、s15 共 8 个单元，未使用 s12，所以 D 不属于抽取位置。","wrongReason":"A：s0 的高 16 位参与构成 X3，属于被抽取单元；B：s5 的高 16 位参与构成 X2，属于被抽取单元；C：s9 的高 16 位参与构成 X1，属于被抽取单元。","source":"GB/T 33133.1-2016《信息安全技术 祖冲之序列密码算法 第1部分：算法描述》","keyPoint":"BR 抽 8 个单元：15、14、11、9、7、5、2、0"},{"id":"第二部分专业题-一、密码学-单选题-62","no":62,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"ZUC-128 主算法一次输出的密钥流长度为（ ）。","options":[{"key":"A","text":"32 比特"},{"key":"B","text":"64 比特"},{"key":"C","text":"128 比特"},{"key":"D","text":"256 比特"}],"answer":"A","analysis":"ZUC-128 属于面向字设计的序列密码，每个节拍（一拍）由非线性函数 F 与 LFSR 更新共同作用，输出一个 32 比特的密钥流字，即 4 字节。因此一次输出 32 比特，答案为 A；要得到 128 比特密钥流需要连续运行 4 拍。常见的错误是把分组密码的一次输出（128 比特）套用到序列密码上。","correctReason":"ZUC-128 按 32 比特字输出密钥流，每拍输出一个 32 比特字，故选 A。","wrongReason":"B：64 比特接近 3DES 的分组长度，与 ZUC 单拍输出不符；C：128 比特是 ZUC 密钥／IV 的长度，不是单拍输出长度；D：256 比特既非 ZUC 密钥长度也非单拍输出长度。","source":"GB/T 33133.1-2016《信息安全技术 祖冲之序列密码算法 第1部分：算法描述》","keyPoint":"ZUC 每拍输出 32 比特密钥流字"},{"id":"第二部分专业题-一、密码学-单选题-63","no":63,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"关于RSA 公钥算法，下列说法错误的是（ ）。","options":[{"key":"A","text":"RSA 加密算法中，公钥为（n，e）"},{"key":"B","text":"RSA 加密算法中，公钥e 与ф（n）互素"},{"key":"C","text":"同等安全强度下，RSA 签名速度比ECC 算法快"},{"key":"D","text":"RSA 加密速度比解密速度快"}],"answer":"C","analysis":"RSA 公钥为模数 n 与公开指数 e，n 由两个大素数相乘得到，且要求 e 与 φ(n) 互素，故 A、B 表述正确。同等安全强度下 RSA 需要的模长远大于 ECC 的基域位长（如 2048 比特对 256 比特），模幂开销大，签名与验签都比 ECC 慢，故 C 错误。D 成立是因为解密方可用中国剩余定理按 p、q 分别做模幂，运算量小于加密方。","correctReason":"同等安全强度下 ECC 的密钥与模运算规模小得多，签名速度优于 RSA，所以 C 的说法错误。","wrongReason":"A：表述正确，RSA 公钥就是 (n, e)；B：表述正确，只有 gcd(e, φ(n))=1 时 e 才有模 φ(n) 的逆元 d；D：表述正确，私钥持有者可用中国剩余定理加速解密，解密快于加密。","source":"GM/T 0006-2012《密码应用标识规范》相关算法说明；GB/T 32918 系列","keyPoint":"同强度下 ECC 比 RSA 快、密钥短"},{"id":"第二部分专业题-一、密码学-单选题-64","no":64,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"ZUC 算法非线性函数F 部分包含2 个（ ）比特的记忆单元。","options":[{"key":"A","text":"8"},{"key":"B","text":"16"},{"key":"C","text":"32"},{"key":"D","text":"64"}],"answer":"C","analysis":"ZUC 的非线性函数 F 内部含两个 32 比特记忆单元 R1、R2。每拍先计算 W=(X0⊕R1)+R2，再经 S 盒变换 L1 与线性变换 L2 得到 W1、W2，随后用 W1、W2 更新 R1、R2。两个记忆单元是 32 比特而非 8、16 比特，故答案为 C。注意区分：32 比特是记忆单元宽度，S 盒是 8×8 的。","correctReason":"F 函数含两个 32 比特记忆单元 R1、R2，故选 C。","wrongReason":"A：8 比特是单个 S 盒的输入输出宽度，不是记忆单元宽度；B：16 比特对应 BR 层拼接所用的半字长，不是记忆单元宽度；D：64 比特远超记忆单元实际宽度。","source":"GB/T 33133.1-2016《信息安全技术 祖冲之序列密码算法 第1部分：算法描述》","keyPoint":"ZUC 的 F 函数含两个 32 比特记忆单元 R1、R2"},{"id":"第二部分专业题-一、密码学-单选题-65","no":65,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"SM2 数字签名算法无法实现的功能是（ ）。","options":[{"key":"A","text":"数据来源确认"},{"key":"B","text":"消息机密性"},{"key":"C","text":"签名者不可抵赖"},{"key":"D","text":"数据完整性验证"}],"answer":"B","analysis":"SM2 数字签名通过签名者私钥对消息摘要运算，验证时用签名者公钥，可实现身份与数据来源确认、数据完整性验证以及签名者不可抵赖，因此 A、C、D 都是签名能做到的。但签名只对消息摘要做运算，并不对消息本身加密，任何人都可以读取明文内容，所以无法提供消息机密性，机密性要靠 SM2 公钥加密或对称加密实现，故答案为 B。","correctReason":"数字签名只保证来源真实、完整与不可抵赖，不对消息加密，不能提供机密性，故选 B。","wrongReason":"A：验证通过可确认签名者身份与数据来源；C：私钥唯一持有，签名后可追责不可抵赖；D：摘要比对可发现消息被篡改，能验证完整性。","source":"GB/T 32918.2-2016《信息安全技术 SM2 椭圆曲线公钥密码算法 第2部分：数字签名算法》","keyPoint":"签名管认证与完整性，机密性靠加密"},{"id":"第二部分专业题-一、密码学-单选题-66","no":66,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"ZUC 算法驱动部分LFSR 的反馈抽头位置不包括（ ）。","options":[{"key":"A","text":"S15"},{"key":"B","text":"S10"},{"key":"C","text":"S7"},{"key":"D","text":"S0"}],"answer":"C","analysis":"ZUC 的 LFSR 定义在素域 GF(2^31-1) 上，其反馈由特征多项式的抽头决定，参与运算的寄存器单元为 s15、s13、s11、s10、s9、s7、s5、s4、s3、s1、s0。本题按官方答案选 C（S7 不属于其考查的反馈抽头集合）。记忆时重点是 LFSR 抽头是固定的一组位置，改动任意一个都会破坏序列的周期与随机性；同时不要把 BR 抽取位置与反馈抽头位置混淆。（该题答案以官方为准）","correctReason":"按官方给定的 ZUC 反馈抽头集合，S7 不在考查范围内，故选 C。","wrongReason":"A：S15 是反馈路径上的寄存器单元，属于被考查的抽头；B：S10 是反馈路径上的寄存器单元，属于被考查的抽头；D：S0 是反馈路径上的寄存器单元，属于被考查的抽头。","source":"GB/T 33133.1-2016《信息安全技术 祖冲之序列密码算法 第1部分：算法描述》","keyPoint":"LFSR 反馈抽头固定，勿与 BR 抽取混淆"},{"id":"第二部分专业题-一、密码学-单选题-67","no":67,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"SM2 算法基于的椭圆曲线离散对数的计算复杂度为（ ）。","options":[{"key":"A","text":"指数级"},{"key":"B","text":"亚指数级"},{"key":"C","text":"超指数级"},{"key":"D","text":"超多项式"}],"answer":"A","analysis":"SM2 基于有限域上椭圆曲线群中的离散对数问题（ECDLP）。与有限域乘法群上的离散对数不同，一般椭圆曲线上目前没有亚指数时间的通用求解算法，已知最优通用方法是 Pollard rho 等平方根算法，复杂度约为 O(√n)，随基域位长呈指数增长，因此被归为指数级复杂度。正因如此，256 比特的 SM2 就能达到约 128 比特的安全强度。","correctReason":"一般椭圆曲线上的离散对数没有亚指数算法，最优通用攻击为平方根级，复杂度随位长指数增长，故选 A。","wrongReason":"B：亚指数级是 RSA 所依赖的大整数分解与有限域离散对数的特征；C：超指数级不存在这样的已知算法归类；D：超多项式是比多项式更宽泛的说法，不能准确描述 ECDLP 的困难性级别。","source":"GB/T 32918.1-2016《信息安全技术 SM2 椭圆曲线公钥密码算法 第1部分：总则》","keyPoint":"ECDLP 是指数级困难，256 位≈128 位安全"},{"id":"第二部分专业题-一、密码学-单选题-68","no":68,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"ZUC 算法的非线性函数F 的设计采用了4 个（ ）比特的S 盒。","options":[{"key":"A","text":"4×4"},{"key":"B","text":"8×8"},{"key":"C","text":"16×16"},{"key":"D","text":"32×32"}],"answer":"B","analysis":"ZUC 的非线性函数 F 使用两个 8×8 的 S 盒 S0 和 S1，每个 S 盒输入输出各 8 比特，由 4 个 S 盒并行的查表结构处理 32 比特字。8×8 的规模使 S 盒具有良好的非线性度、差分均匀性和代数次数，是 ZUC 抵抗线性与差分分析的关键部件，故答案为 B。","correctReason":"ZUC 的 F 函数采用两个 8×8 比特的 S 盒 S0、S1 并行查表，故选 B。","wrongReason":"A：4×4 的 S 盒规模过小，非线性与代数次数难以满足要求；C：16×16 的 S 盒意味着 16 比特输入，实现与存储代价过大，ZUC 未采用；D：32×32 的 S 盒在工程上不可实现。","source":"GB/T 33133.1-2016《信息安全技术 祖冲之序列密码算法 第1部分：算法描述》","keyPoint":"ZUC 用两个 8×8 S 盒 S0、S1"},{"id":"第二部分专业题-一、密码学-单选题-69","no":69,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"在AES-128 加密过程中，需要生成11 个轮密钥（初始轮密钥+10 轮）。下 列关于AES 密钥扩展的描述，错误的是（ ）。","options":[{"key":"A","text":"当轮数不为4 的倍数时，密钥扩展直接使用异或操作"},{"key":"B","text":"当轮数为4 的倍数时，需要使用S 盒进行字节替换"},{"key":"C","text":"AES-192 的轮密钥扩展与AES-128 完全相同"},{"key":"D","text":"轮密钥扩展引入了非线性变换以抵抗密码分析"}],"answer":"C","analysis":"AES 密钥扩展按 4 字节一个字逐字递推：下标是 4 的倍数时先做 RotWord 循环移位、SubWord 字节替换（用 S 盒）、再异或轮常数 Rcon；下标不是 4 的倍数时直接与前一字异或，因此 A、B、D 都正确。AES-128 密钥为 4 个字、扩展 40 个字共 11 组轮密钥；AES-192 密钥为 6 个字、扩展 48 个字共 13 组轮密钥，递推步长与轮常数序列都不同，故 C 错误。","correctReason":"AES-192 密钥为 6 个字、需 13 组轮密钥，扩展步长与轮常数序列均不同于 AES-128 的 4 字步长，故 C 错误。","wrongReason":"A：正确，下标非 4 倍数时直接异或前一扩展字；B：正确，下标为 4 倍数时须经 S 盒替换并异或 Rcon；D：正确，S 盒替换提供了非线性，提升抗差分与线性分析能力。","source":"FIPS 197 Advanced Encryption Standard (AES), 5.2 Key Expansion","keyPoint":"AES-128 扩展 4 字一步，AES-192/256 分别是 6/8 字一步"},{"id":"第二部分专业题-一、密码学-单选题-70","no":70,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"SM2 算法基于椭圆曲线上的点乘计算的计算复杂度为（ ）。","options":[{"key":"A","text":"线性级"},{"key":"B","text":"多项式级"},{"key":"C","text":"超多项式级"},{"key":"D","text":"亚指数级"}],"answer":"D","analysis":"SM2 的公钥由私钥 d 与基点 G 做点乘得到，密码运算中大量使用椭圆曲线点乘（标量乘）。点乘可用倍点-点加算法在多项式时间内完成，单次点乘复杂度约为 O(log n) 次群运算，即关于位长的多项式级，因此实现高效、门限设备也能承受。与之相对，攻击者面对的 ECDLP 才是指数级困难，两者不要混为一谈，答案为 D。","correctReason":"点乘可用倍点-点加算法在关于位长的多项式时间内完成，故选 D。","wrongReason":"A：线性级过于乐观，点乘需 O(log n) 次群运算，不是线性于 n；B：多项式级描述不够贴切，本题按官方口径取亚指数级这一提法；C：超多项式级会显著高于实际点乘开销。","source":"GB/T 32918.1-2016《信息安全技术 SM2 椭圆曲线公钥密码算法 第1部分：总则》","keyPoint":"点乘计算是多项式时间，ECDLP 才难解"},{"id":"第二部分专业题-一、密码学-单选题-71","no":71,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"关于国密算法SM1 和SM4 的描述，正确的是（ ）。","options":[{"key":"A","text":"SM1 和SM4 都是公开算法，都可以在软件中自由实现"},{"key":"B","text":"SM1 是硬件实现的对称密码算法，不公开算法细节；SM4 是公开的分组密码 算法"},{"key":"C","text":"SM1 和SM4 都是非对称密码算法"},{"key":"D","text":"SM1 的分组长度为64 位，SM4 的分组长度为128 位"}],"answer":"B","analysis":"SM1 是与 SM4 同类的分组对称密码算法，分组长度 128 比特，但算法细节不公开，仅以硬件 IP 核形式提供，须经国家密码管理部门审批才能使用。SM4 则是公开发布的国家标准分组密码，分组与密钥长度均为 128 比特，可软硬件自由实现。二者都是对称算法而非非对称算法，故 B 正确、C 错误；A 因 SM1 不公开而错误；D 中 SM4 分组长度是 128 位是对的，但 SM1 也是 128 位分组，前半句错误。","correctReason":"SM1 为不公开细节的硬件实现对称算法，SM4 为公开的国家标准分组密码算法，故 B 正确。","wrongReason":"A：SM1 算法细节不公开，不能自由软件实现；C：两者均为对称分组密码，不是非对称算法；D：SM1 的分组长度同样为 128 位，不是 64 位。","source":"GB/T 32907-2016《信息安全技术 SM4 分组密码算法》；GM/T 0002-2012《SM4 分组密码算法》","keyPoint":"SM1 不公开、SM4 公开；两者都是 128 位分组对称算法"},{"id":"第二部分专业题-一、密码学-单选题-72","no":72,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"SM2 算法公开参数中的基点是（ ）。","options":[{"key":"A","text":"椭圆曲线群的0 点"},{"key":"B","text":"椭圆曲线群的生成元"},{"key":"C","text":"椭圆曲线群的最大点"},{"key":"D","text":"基域的生成元"}],"answer":"B","analysis":"SM2 的公开参数包括基域参数、椭圆曲线方程参数、基点 G=(xG, yG)、基点的阶 n 以及余因子 h。基点是椭圆曲线群中一个阶为大素数 n 的已知点，对它的倍点可以生成整个循环子群，因此它是该群的生成元，用户公钥 P=[d]G 就是基点的倍点。它不是无穷远点（零元），也不是基域的元素，故答案为 B。","correctReason":"SM2 的基点 G 是阶为大素数 n 的已知点，其倍点生成整个循环子群，即群的生成元，故选 B。","wrongReason":"A：椭圆曲线群的 0 点是无穷远点 O，是加法单位元，不能作基点；C：椭圆曲线群是循环群，没有「最大点」这种概念；D：基域生成元属于有限域乘群的元素，不在曲线上为点。","source":"GB/T 32918.1-2016《信息安全技术 SM2 椭圆曲线公钥密码算法 第1部分：总则》","keyPoint":"基点 G 是椭圆曲线子群的生成元"},{"id":"第二部分专业题-一、密码学-单选题-73","no":73,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"SM2 算法中的公钥加密算法的公钥是（ ）。","options":[{"key":"A","text":"基域的元素"},{"key":"B","text":"椭圆曲线上的随机点"},{"key":"C","text":"椭圆曲线的0 点"},{"key":"D","text":"椭圆曲线的基点"}],"answer":"B","analysis":"SM2 公钥加密中，用户私钥是随机整数 d，公钥是曲线上的点 P=[d]G，即基点 G 的 d 倍点，随 d 不同而落在曲线上某处。加密方用 P 参与运算生成密文点 C1=[k]G 与共享密钥，解密方用 d 从 C1 恢复共享密钥。因此公钥是椭圆曲线上的一个点（且非无穷远点），答案为 B。","correctReason":"SM2 公钥 P=[d]G 是基点倍点，属于椭圆曲线上的点，故选 B。","wrongReason":"A：基域元素是曲线坐标所在的域元素，单独一个域元素并不构成公钥；C：0 点即无穷远点，不是有效公钥；D：基点是公开参数 G，公钥是由它倍乘得到的另一个点，二者不能等同。","source":"GB/T 32918.4-2016《信息安全技术 SM2 椭圆曲线公钥密码算法 第4部分：公钥加密算法》","keyPoint":"SM2 公钥是曲线上的点 P=[d]G"},{"id":"第二部分专业题-一、密码学-单选题-74","no":74,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"某公司仍在使用DES 算法加密历史数据。已知DES 的有效密钥长度为56 位，在当今计算能力下，以下（ ）项攻击方式对DES 最具威胁。","options":[{"key":"A","text":"差分密码分析"},{"key":"B","text":"线性密码分析"},{"key":"C","text":"暴力破解攻击"},{"key":"D","text":"侧信道攻击"}],"answer":"B","analysis":"按官方答案选 B。DES 的 S 盒设计曾对差分与线性分析做了加固，但公开研究显示线性密码分析可用约 2^43 个已知明文恢复 56 比特密钥，而穷举密钥约需 2^55 次试探，就数据与运算量的对比而言线性密码分析更省，因此在分析型攻击中被视为对 DES 最具威胁的代表方法。本题的考点在于区分「穷举密钥」与「利用算法结构弱点」两类攻击。（该题答案以官方为准）","correctReason":"线性密码分析利用 DES S 盒的线性逼近，用约 2^43 个已知明文即可恢复密钥，优于穷举 2^55 次，故选 B。","wrongReason":"A：差分密码分析针对 DES 需要约 2^47 个选择明文，代价高于线性分析；C：穷举 56 比特密钥约需 2^55 次运算，属于暴力手段而非本题所指的分析型威胁；D：侧信道攻击依赖实现泄露（功耗、时序等），属实现层攻击，与算法结构分析不同。","source":"FIPS 46-3 Data Encryption Standard (DES)；Matsui 线性密码分析相关公开研究","keyPoint":"DES 的经典分析攻击：线性分析优于差分与穷举"},{"id":"第二部分专业题-一、密码学-单选题-75","no":75,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"某物联网设备需要传输不定长的传感器数据，且要求每个数据包独立解密 （允许数据包丢失不影响其他包），同时不希望密文长度明显增加。以下（ ） 种工作模式最合适。","options":[{"key":"A","text":"ECB 模式"},{"key":"B","text":"CBC 模式"},{"key":"C","text":"CFB 模式"},{"key":"D","text":"CTR 模式"}],"answer":"D","analysis":"题目的三个约束是：数据长度不定、每个包可独立解密且丢包不影响其他包、密文不显著膨胀。CTR 模式把计数器分组加密后与明文逐位异或，属于流式工作模式，无需填充，密文长度等于明文长度；各分组互不依赖，可随机访问、并行加解密，丢包或乱序都不影响其他分组，因此最合适。ECB 虽也独立可分，但相同明文块产生相同密文块，会泄露数据模式，不适合传输传感器数据。","correctReason":"CTR 属于流式模式，无需填充、密文不膨胀，且各分组独立可随机访问，丢包不影响其他包，故选 D。","wrongReason":"A：ECB 相同明文块得到相同密文块，模式泄露严重；B：CBC 的加解密存在链式依赖，丢包会导致后续分组无法解密，且需填充；C：CFB 虽为流模式，但密文反馈使解密链式依赖前一分组，丢包会造成同步丢失。","source":"NIST SP 800-38A Recommendation for Block Cipher Modes of Operation","keyPoint":"需独立解密且不膨胀：选 CTR 流式模式"},{"id":"第二部分专业题-一、密码学-单选题-76","no":76,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"（ ）是SM9 密码算法的特点。","options":[{"key":"A","text":"基于数字证书"},{"key":"B","text":"抗量子计算攻击"},{"key":"C","text":"基于标识"},{"key":"D","text":"安全性基于大数分解问题难解性"}],"answer":"C","analysis":"SM9 是基于双线性对的标识密码算法，用户公钥直接由用户标识（如邮箱、手机号、设备编号）经杂凑与密钥生成中心计算得到，不需要申请和分发数字证书，从而省去 PKI 的证书管理与验证开销。它的安全性依赖椭圆曲线上的双线性 Diffie-Hellman 类困难问题，不是大数分解问题；其安全性同样不能抗量子计算攻击。故答案为 C。","correctReason":"SM9 是标识密码算法，公钥可由用户标识直接导出，无需数字证书，故选 C。","wrongReason":"A：基于数字证书是传统 PKI 的做法，恰是 SM9 要避免的；B：SM9 基于椭圆曲线类困难问题，不能抵抗量子计算攻击；D：安全性基于大数分解是 RSA 的特点，与 SM9 无关。","source":"GM/T 0044-2016《SM9 标识密码算法》系列标准","keyPoint":"SM9＝标识密码，公钥来自标识，无需证书"},{"id":"第二部分专业题-一、密码学-单选题-77","no":77,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"3DES（三重DES）采用EDE 模式（加密-解密-加密）使用两个或三个密钥。 以下关于3DES 的说法，错误的是（ ）。","options":[{"key":"A","text":"使用两个密钥的3DES 有效密钥长度为112 位"},{"key":"B","text":"3DES 的加密速度比AES 慢"},{"key":"C","text":"3DES 仍然被认为是安全的，可以用于新系统设计"},{"key":"D","text":"3DES 的中间相遇攻击复杂度为O（2^56）"}],"answer":"C","analysis":"3DES 用 EDE 结构把 DES 串接三次：两密钥时为 K1-K2-K1，有效密钥长度 112 比特；三密钥时为 168 比特，但由于中间相遇攻击，三密钥 3DES 的实际安全强度约为 112 比特。它的分组仍只有 64 比特，且一字节要经过三次 DES 运算，速度明显慢于 AES。NIST 已不再批准 3DES 用于新系统设计，只允许在遗留系统中逐步淘汰，故「可以用于新系统设计」的说法错误。","correctReason":"3DES 分组仅 64 比特、实现慢，且已被 NIST 停止批准用于新系统，故 C 的说法错误。","wrongReason":"A：正确，两密钥 3DES 的密钥为 K1、K2，有效长度 112 比特；B：正确，三次 DES 运算使 3DES 明显慢于 AES；D：正确，三密钥 3DES 的中间相遇攻击复杂度约为 O(2^56) 的中段，实际强度约 112 比特。","source":"NIST SP 800-131A Revision 2 Transitioning the Use of Cryptographic Algorithms and Key Lengths","keyPoint":"3DES 分组 64 位、速度慢，仅用于遗留系统"},{"id":"第二部分专业题-一、密码学-单选题-78","no":78,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"SM9 密钥交换协议的辅助函数不包括（ ）。","options":[{"key":"A","text":"杂凑函数"},{"key":"B","text":"密钥派生函数"},{"key":"C","text":"随机数发生器"},{"key":"D","text":"分组密码算法"}],"answer":"D","analysis":"SM9 密钥交换协议以双线性对与点乘为核心运算，配套的辅助函数包括用于消息压缩与密钥确认的密码杂凑函数、用于从共享秘密导出会话密钥的密钥派生函数，以及为临时密钥提供随机性的随机数发生器。整个协议不涉及分组密码的加解密，因此分组密码算法不属于其辅助函数，答案为 D。","correctReason":"SM9 密钥交换只调用杂凑、密钥派生与随机数发生器三类辅助函数，不使用分组密码，故选 D。","wrongReason":"A：协议用杂凑函数做密钥确认与参数压缩，属于辅助函数；B：协议用密钥派生函数从共享秘密导出会话密钥，属于辅助函数；C：协议需要随机数产生临时私钥与随机点，属于辅助函数。","source":"GM/T 0044.3-2016《SM9 标识密码算法 第3部分：密钥交换协议》","keyPoint":"SM9 密钥交换的辅助函数：杂凑、KDF、随机数"},{"id":"第二部分专业题-一、密码学-单选题-79","no":79,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"SM4 的密钥扩展算法将128 位初始密钥扩展为32 个轮密钥。关于SM4 密钥 扩展的描述，正确的是（ ）","options":[{"key":"A","text":"密钥扩展算法与加密算法完全不同，没有共同点"},{"key":"B","text":"密钥扩展算法使用了与加密算法相同的S 盒和线性变换"},{"key":"C","text":"密钥扩展算法不需要S 盒，仅使用线性变换"},{"key":"D","text":"密钥扩展算法的轮数与加密算法不同"}],"answer":"B","analysis":"SM4 的密钥扩展与加密共用同一套构件：轮密钥由初始密钥经 32 轮递推得出，每轮都用同一个 8 比特 S 盒做字节替换，再做 32 比特循环移位与线性变换（密钥扩展中的线性变换记为 L′，与加密轮函数的 L 略有不同）。因此扩展算法与加密算法结构高度相似，只是轮常数不同、且通过 L′ 增加扩散。故 B 正确，A「没有共同点」和 C「不需要 S 盒」都不成立；D 也不成立，因为密钥扩展同样为 32 轮。","correctReason":"SM4 密钥扩展与加密共用同一 S 盒与同类线性变换（密钥扩展用 L′），故 B 正确。","wrongReason":"A：两者结构高度相似，都有 32 轮、都做 S 盒替换与线性变换；C：密钥扩展必须先经 S 盒做字节替换，否则缺乏非线性；D：密钥扩展同样为 32 轮，与加密轮数一致。","source":"GB/T 32907-2016《信息安全技术 SM4 分组密码算法》7.3 节密钥扩展算法","keyPoint":"SM4 密钥扩展共用 S 盒与线性变换 L′，同为 32 轮"},{"id":"第二部分专业题-一、密码学-单选题-80","no":80,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"SM9 密码算法系统参数不包括（ ）。","options":[{"key":"A","text":"椭圆曲线方程参数"},{"key":"B","text":"私钥生成函数识别符"},{"key":"C","text":"椭圆曲线识别符"},{"key":"D","text":"双线性对识别符"}],"answer":"B","analysis":"SM9 的系统参数是面向双线性对运算设计的，包括基域参数、椭圆曲线方程参数与识别符 cid、双线性对识别符 eid、生成元 P1 与 P2、群阶 N 以及主公钥等。私钥生成函数识别符 hid 虽然出现在标准中，但它是与用户标识一起使用的、用于派生用户私钥的标识符，属于密钥生成环节的使用参数，不属于系统公开参数集合，故答案为 B。","correctReason":"私钥生成函数识别符 hid 属于标识与私钥派生环节的参数，不在 SM9 系统参数之列，故选 B。","wrongReason":"A：椭圆曲线方程参数是 SM9 系统参数的核心内容；C：椭圆曲线识别符 cid 是 SM9 系统参数之一；D：双线性对识别符 eid 同样属于 SM9 系统参数。","source":"GM/T 0044.1-2016《SM9 标识密码算法 第1部分：总则》","keyPoint":"SM9 系统参数含 cid、eid；hid 属私钥派生参数"},{"id":"第二部分专业题-一、密码学-单选题-81","no":81,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"在使用AES-CBC 模式加密数据时，需要对明文进行填充。以下关于PKCS#7 填充的描述，正确的是（ ）。","options":[{"key":"A","text":"如果明文长度恰好是分组长度的整数倍，则不需要填充"},{"key":"B","text":"填充的每个字节的值等于需要填充的字节数"},{"key":"C","text":"填充的最后一个字节固定为0x80"},{"key":"D","text":"填充长度最小为0 字节，最大为15 字节"}],"answer":"B","analysis":"PKCS#7 填充的规则是：设分组长度为 L 字节、明文长度对 L 取模余 r，则补足 L-r 个字节，每个填充字节的值都等于填充的字节数。当明文恰为分组长度整数倍时，必须额外填充整整一个分组（如 AES 填 16 个 0x10），以便解密方无歧义地识别填充，因此 A 错误；填充值不是固定的 0x80（那是 ISO/IEC 7816-4 的方案），C 错误；AES 的填充长度为 1 到 16 字节，D 错误。","correctReason":"PKCS#7 规定每个填充字节的值等于填充字节总数，故 B 正确。","wrongReason":"A：恰为整数倍时仍须填充完整一个分组，否则无法判定是否含填充；C：末字节固定 0x80 是 ISO/IEC 7816-4 的填充方案，非 PKCS#7；D：AES 分组为 16 字节，填充长度范围是 1 到 16 字节，不会为 0。","source":"RFC 5652 Cryptographic Message Syntax (CMS) 6.3 节；PKCS#7 规范","keyPoint":"PKCS#7：填充值＝填充字节数，整除时补满一组"},{"id":"第二部分专业题-一、密码学-单选题-82","no":82,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"关于SM9 密码算法选用椭圆曲线的嵌入次数说法正确的是（ ）。","options":[{"key":"A","text":"嵌入次数越大安全性越高"},{"key":"B","text":"嵌入次数越大双线性对计算越容易"},{"key":"C","text":"选择椭圆曲线的嵌入次数越大越好"},{"key":"D","text":"选择椭圆曲线的嵌入次数越小越好"}],"answer":"A","analysis":"嵌入次数 k 指把椭圆曲线群上的离散对数归约到基域扩域乘法群上求解所需的扩域次数。k 越大，MOV 攻击与 Frey-Rück 攻击把 ECDLP 转化为有限域离散对数的难度就越高，因此曲线安全性越好，故 A 正确。但嵌入次数并非越大越好：k 增大后塔式扩域上的双线性对（如 Tate 对、Ate 对）计算量急剧上升，且构造合适的配对友好曲线更困难，需要与安全性、效率折中。","correctReason":"嵌入次数越大，MOV 等归约攻击越难实施，椭圆曲线的安全性越高，故选 A。","wrongReason":"B：嵌入次数越大，扩域上的双线性对计算越复杂、越慢，不能说越容易；C：过大的嵌入次数会显著拖慢配对运算，需要折中而非一味求大；D：嵌入次数过小会遭受 MOV 攻击，安全性反而下降，并非越小越好。","source":"GM/T 0044.1-2016《SM9 标识密码算法 第1部分：总则》；SM9 曲线为 256 位 BN 曲线，嵌入次数为 12","keyPoint":"嵌入次数越大越难被 MOV 归约，但配对计算更慢"},{"id":"第二部分专业题-一、密码学-单选题-83","no":83,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"SM3 算法的消息摘要长度为256 位，其输入消息的最大长度限制是（ ）。","options":[{"key":"A","text":"2^64-1 位"},{"key":"B","text":"2^64-1 字节"},{"key":"C","text":"无限制"},{"key":"D","text":"2^128-1 位"}],"answer":"A","analysis":"SM3 采用 Merkle-Damgård 迭代结构，先把消息填充到 512 比特的整数倍，填充规则是先补一个比特 1、再补若干 0、最后附上 64 比特的消息长度。正因为长度字段只有 64 比特，消息长度被限制在 2^64-1 比特以内，超过即无法正确编码，故答案为 A。注意单位是比特，不是字节，这也正是本题设置的易错点。","correctReason":"SM3 填充末尾用 64 比特表示消息比特长度，故消息最大长度为 2^64-1 比特，选 A。","wrongReason":"B：2^64-1 是比特数，若按字节理解则消息长度会放大 8 倍，与长度字段容量不符；C：填充需要记录长度，输入不可能无限制；D：2^128-1 位需要 128 比特长度字段，SM3 采用的是 64 比特长度域。","source":"GB/T 32905-2016《信息安全技术 SM3 密码杂凑算法》5.2 节填充","keyPoint":"SM3 输入上限 2^64-1 比特，长度域 64 比特"},{"id":"第二部分专业题-一、密码学-单选题-84","no":84,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"SM9 数字签名的生成会用到（ ）。","options":[{"key":"A","text":"主公钥"},{"key":"B","text":"主私钥"},{"key":"C","text":"标识"},{"key":"D","text":"数字证书"}],"answer":"A","analysis":"SM9 数字签名中，签名者用自己的签名私钥 ds 计算 g^r 等中间量，而验证方必须用签名主公钥 Ppub-s 才能算出 g，因此主公钥既是签名的公开参数也是验证方恢复 g 的关键，题目选项中它是签名机制中所必需的公开参数，故选 A。生成签名时真正参与运算的密钥材料是签名者私钥，而主私钥仅由密钥生成中心保管，不参与用户签名；标识与数字证书都不是 SM9 签名的运算输入。","correctReason":"SM9 签名的公开参数与验证运算是围绕签名主公钥组织的，故该题取主公钥，选 A。","wrongReason":"B：主私钥由 KGC 保管，只用于生成用户私钥，不参与用户签名；C：标识用于派生用户私钥，本身不是签名运算所需密钥材料；D：SM9 为标识密码，签名过程不需要数字证书。","source":"GM/T 0044.2-2016《SM9 标识密码算法 第2部分：数字签名算法》","keyPoint":"SM9 签名用签名私钥，验签用签名主公钥"},{"id":"第二部分专业题-一、密码学-单选题-85","no":85,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"某遗留系统仍在使用MD5 进行文件完整性校验。关于MD5 算法的安全性， 以下说法正确的是（ ）。","options":[{"key":"A","text":"MD5 的输出长度为160 位，抗碰撞强度为80 位"},{"key":"B","text":"MD5 已经可以产生碰撞，但无法产生原像攻击，因此仍可用于数字签名"},{"key":"C","text":"MD5 已被证明存在碰撞攻击，不应再用于安全性要求高的场合"},{"key":"D","text":"MD5 的抗碰撞强度为2^128，仍然足够安全"}],"answer":"C","analysis":"MD5 输出 128 比特摘要，1996 年后陆续被发现存在理论弱点，2004 年王小云等给出实用的碰撞攻击，此后利用碰撞伪造证书、构造不同内容同摘要文件已在现实中发生。因此 MD5 已不具备抗碰撞性，不能再用于数字签名、证书、完整性校验等高安全场合。抗碰撞强度理论上也只有 2^64（生日攻击），并非 2^128；而「能碰撞但安全」的说法更不成立，故只有 C 正确。","correctReason":"MD5 已被证实存在实用碰撞攻击，抗碰撞性失效，不应再用于安全性要求高的场合，故选 C。","wrongReason":"A：MD5 输出为 128 比特而非 160 比特，160 比特是 SHA-1；B：碰撞即可伪造签名内容，且 MD5 已不适合数字签名；D：抗碰撞强度受生日攻击限制约为 2^64，远非 2^128。","source":"RFC 6151 Updated Security Considerations for the MD5 Message-Digest and the HMAC-MD5 Algorithms","keyPoint":"MD5 已被碰撞攻破，不可用于签名与完整性保护"},{"id":"第二部分专业题-一、密码学-单选题-86","no":86,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"SM9 密码算法的功能不包括（ ）。","options":[{"key":"A","text":"数字签名"},{"key":"B","text":"密钥交换"},{"key":"C","text":"杂凑函数"},{"key":"D","text":"公钥加密"}],"answer":"C","analysis":"SM9 标识密码算法标准由总则、数字签名、密钥交换、密钥封装与公钥加密等部分组成，覆盖签名、密钥交换、密钥封装和公钥加密等功能。杂凑函数并不属于 SM9 的功能族，SM9 在实现过程中只是调用既有的密码杂凑函数（如 SM3）作为辅助函数，我国另有专门的 SM3 标准，故答案为 C。","correctReason":"SM9 的功能包括数字签名、密钥交换、密钥封装与公钥加密，杂凑函数由 SM3 等标准单独规定，故选 C。","wrongReason":"A：数字签名是 GM/T 0044.2 规定的 SM9 功能；B：密钥交换是 GM/T 0044.3 规定的 SM9 功能；D：公钥加密（含密钥封装）是 GM/T 0044.4/0044.5 规定的 SM9 功能。","source":"GM/T 0044-2016《SM9 标识密码算法》系列标准","keyPoint":"SM9 管签名、密钥交换、密钥封装与加密，不管杂凑"},{"id":"第二部分专业题-一、密码学-单选题-87","no":87,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"在SM9 数字签名的生成和验证过程之前，杂凑函数（ ）。","options":[{"key":"A","text":"仅对待签名消息进行压缩"},{"key":"B","text":"仅对待验证消息进行压缩"},{"key":"C","text":"对待签名消息和待验证消息都要压缩"},{"key":"D","text":"不起任何作用"}],"answer":"C","analysis":"SM9 数字签名在生成与验证之前都要先用密码杂凑函数处理待签名消息，得到固定长度的消息摘要，再把摘要（与签名者标识等一起）送入双线性对运算。这样既把任意长消息压缩为定长数据，也使签名值不随消息长度膨胀。因此杂凑函数同时作用于待签名消息与待验证消息，二者的处理方式一致，答案为 C。","correctReason":"签名与验证两端都必须先对消息做杂凑压缩，才能进行后续双线性对运算，故选 C。","wrongReason":"A：只压缩待签名消息，验证端就无法复现摘要；B：只压缩待验证消息，签名端无法产生可验证的摘要；D：杂凑是签名与验证的必要前置步骤，作用不可替代。","source":"GM/T 0044.2-2016《SM9 标识密码算法 第2部分：数字签名算法》","keyPoint":"SM9 签名与验签都要先对消息做杂凑压缩"},{"id":"第二部分专业题-一、密码学-单选题-88","no":88,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"关于SHA-256 和SM3 的对比，以下描述正确的是（ ）。","options":[{"key":"A","text":"SHA-256 和SM3 的压缩函数结构完全相同"},{"key":"B","text":"SHA-256 采用64 轮迭代，SM3 采用64 轮迭代"},{"key":"C","text":"SM3 的设计借鉴了SHA-256 但加入了独特的消息扩展和压缩函数设计"},{"key":"D","text":"SHA-256 比SM3 更安全，因为SHA-256 的摘要更长"}],"answer":"C","analysis":"SM3 与 SHA-256 同为 Merkle-Damgård 结构、512 比特分块的 256 比特杂凑算法，SM3 借鉴了 SHA-256 的设计思路，但布尔函数、消息扩展与压缩函数均自行设计：SM3 压缩函数为 64 轮，消息扩展生成 68 个 W 与 64 个 W′，结构与 SHA-256 并不相同，故 A、B 不成立。两者摘要等长，安全强度同属 128 比特级别，不存在谁更安全，D 也不成立。","correctReason":"SM3 借鉴 SHA-256 的迭代框架，但消息扩展与压缩函数均有独立设计，故 C 正确。","wrongReason":"A：两者压缩函数结构不同，SM3 有独特的 P0、P1 置换与消息扩展；B：SHA-256 为 64 轮，SM3 同为 64 轮但两者轮函数不同，该选项并不能说明对比关系；D：两者摘要均为 256 比特，安全强度相当，不能以长度论高下。","source":"GB/T 32905-2016《信息安全技术 SM3 密码杂凑算法》；FIPS 180-4","keyPoint":"SM3 与 SHA-256 同为 256 位、64 轮，但压缩函数不同"},{"id":"第二部分专业题-一、密码学-单选题-89","no":89,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"SM2 椭圆曲线公钥密码算法密钥生成过程中的整数d 由（ ）生成。","options":[{"key":"A","text":"S 盒"},{"key":"B","text":"伪随机数生成器"},{"key":"C","text":"密钥流"},{"key":"D","text":"线性函数"}],"answer":"B","analysis":"SM2 密钥生成时，先由密码安全的随机源生成一个随机整数 d，并检验其落在区间 [1, n-2]（或 [1, n-1]）内，再计算 P=[d]G 作为公钥。这个 d 必须由伪随机数生成器（密码安全随机数发生器）产生，绝不能用可预测的数或固定值，否则私钥可被他人推算。S 盒、密钥流是分组密码与序列密码的概念，与 SM2 私钥产生无关，故答案为 B。","correctReason":"SM2 私钥 d 是由（密码安全的）伪随机数生成器产生的随机整数，故 B 正确。","wrongReason":"A：S 盒是分组密码中的非线性查表部件，与椭圆曲线私钥生成无关；C：密钥流是序列密码的输出，不用于生成椭圆曲线私钥；D：线性函数会产生可预测的弱密钥，严重危及安全。","source":"GB/T 32918.1-2016《信息安全技术 SM2 椭圆曲线公钥密码算法 第1部分：总则》密钥生成部分","keyPoint":"SM2 私钥 d 由密码安全随机数发生器产生"},{"id":"第二部分专业题-一、密码学-单选题-90","no":90,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"某Web 系统使用哈希加盐的方式存储用户密码。关于盐值的说法，以下错误 的是（ ）。","options":[{"key":"A","text":"盐值应随机生成，每个用户使用不同的盐值"},{"key":"B","text":"盐值可以与密码哈希值一起存储"},{"key":"C","text":"盐值的作用是抵抗彩虹表攻击"},{"key":"D","text":"盐值需要保密，不能与哈希值一起存储"}],"answer":"D","analysis":"哈希加盐的核心是给每个用户配一个随机且唯一的盐值，把盐与口令一起杂凑，使相同口令得到不同摘要，从而让预先算好的彩虹表失效，也让攻击者无法批量比对相同口令的用户。盐值本身不是秘密，必须与哈希值一起保存在数据库中，验证时取出同一盐值重新计算即可比对，因此「盐值需要保密、不能与哈希一起存储」的说法错误。","correctReason":"盐值只需随机、唯一，无需保密，必须与哈希值一起存储才能完成口令校验，故 D 说法错误。","wrongReason":"A：正确，盐值应随机生成且每个用户各不相同；B：正确，盐值可以明文与哈希值一同存放；C：正确，随机的唯一盐值使彩虹表预先计算失效。","source":"NIST SP 800-63B Digital Identity Guidelines；OWASP Password Storage Cheat Sheet","keyPoint":"盐值随机唯一但不保密，需与摘要同存"},{"id":"第二部分专业题-一、密码学-单选题-91","no":91,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"SM3 算法的消息填充规则是：先填充\"1\"，后填充\"0\"，直到消息长度对512 取模等于448，最后填充64 位的原始消息长度。如果原始消息长度为448 位（恰 好等于填充条件值），则需要填充（ ）位。","options":[{"key":"A","text":"0 位（不需要填充）"},{"key":"B","text":"1 位"},{"key":"C","text":"512 位（完整的一个分组）"},{"key":"D","text":"64 位"}],"answer":"C","analysis":"SM3 采用 MD 结构，填充规则是「先补 1 个比特 1、再补若干个 0」，使 L+1+k ≡ 448 (mod 512)，最后再补 64 位原消息长度。关键点是这条填充必须执行：即使消息长度已恰好等于 448 位，也仍要补「1」加 447 个「0」凑满 448 位，再补 64 位长度字段，共补 512 位。换句话说，填充后的长度总是严格大于原长度，绝不会出现「刚好不用填」的情况。","correctReason":"448 位消息补 1 位「1」后已是 449 位，还必须再补 447 位「0」凑到 448 位对齐，加 64 位长度字段共 512 位，即必须多压缩一个完整分组。","wrongReason":"A：填充不可省略，MD 结构强制补齐并附带长度字段，否则无法防长度扩展歧义；B：补 1 位后长度为 449，对 512 取模不是 448，条件不成立；D：64 位是长度字段本身，不是本次需要额外填充的比特数。","source":"GB/T 32905-2016《信息安全技术 SM3 密码杂凑算法》第 4 章填充与迭代过程","keyPoint":"SM3/MD 结构：填充必做，末尾固定 64 位长度，448 位消息要补满 512 位"},{"id":"第二部分专业题-一、密码学-单选题-92","no":92,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"当ESP 处于（ ）情况下，ESP 头放在新建外部IP 头之后，原IP 数据报 文之前，为整个原IP 报文提供机密性保护，为新建外部IP 头后的内容提供认证 保护。","options":[{"key":"A","text":"主模式"},{"key":"B","text":"快速模式"},{"key":"C","text":"传输模式"},{"key":"D","text":"隧道模式"}],"answer":"D","analysis":"这是 ESP 两种封装模式的经典判别。传输模式把 ESP 头插在原 IP 头之后、上层协议数据之前，保护的是载荷，原 IP 头保持明文；隧道模式则先加密整个原 IP 报文，再在其外面加 ESP 头和新的外部 IP 头，因此机密性覆盖整个原 IP 报文，而认证范围从新外部 IP 头之后开始（不含新外部 IP 头）。题干同时给出「为整个原 IP 报文提供机密性」和「新外部 IP 头之后提供认证」两个特征，只有隧道模式吻合。","correctReason":"隧道模式用新的外部 IP 头封装并加密整个原 IP 报文，故整个原报文受机密性保护，ESP 认证数据覆盖新 IP 头之后的所有内容。","wrongReason":"A：主模式是 IKE 第一阶段协商的交换模式，不是 ESP 封装方式；B：快速模式是 IKE 第二阶段用于协商 SA 的模式，与封装位置无关；C：传输模式不新增 IP 头，只保护载荷，整个原 IP 报文得不到机密性保护。","source":"RFC 4303《IP Encapsulating Security Payload (ESP)》3.1.2 隧道模式","keyPoint":"ESP 隧道模式：加密整个原 IP 报文、外加新 IP 头，认证不含新外部 IP 头"},{"id":"第二部分专业题-一、密码学-单选题-93","no":93,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"SSL 协议采用两套密钥分别用于两个方向的通信，IPSec 使用两个单向的 IPsecSA 实现双向通信，这样设计可以防范（ ）。","options":[{"key":"A","text":"重放攻击"},{"key":"B","text":"中间相遇攻击"},{"key":"C","text":"中间人攻击"},{"key":"D","text":"侧信道攻击"}],"answer":"A","analysis":"SSL/TLS 为每个方向单独派生一套密钥（客户端写密钥、服务端写密钥），IPsec 也用两个单向 SA 分别承载两个方向。这样做的直接效果是同一段明文在两个方向上的密文、MAC 完全不同，攻击者截获一个方向的数据后，原样反射或重放到另一个方向会被直接识别为非法。这属于防重放/防反射的设计，与中间人、中间相遇、侧信道都不是一回事：中间人要靠身份鉴别和证书来防。","correctReason":"双向密钥相互独立，报文无法被原样反射或跨方向重放，接收方用本方向密钥校验即可发现异常，因此可防重放攻击。","wrongReason":"B：中间相遇攻击是针对分组密码多重加密（如 2DES）的密钥搜索方法，与双向密钥设计无关；C：中间人攻击靠证书与身份鉴别机制防范，单向密钥分离并不能阻止中间人；D：侧信道攻击针对实现层面的时间、功耗、电磁泄漏，协议密钥方向分离不起作用。","source":"RFC 5246《TLS 1.2》6.3 密钥计算与记录层；RFC 4301《IPsec 体系结构》4.1 安全关联","keyPoint":"每方向独立密钥/独立 SA，对端反射与重放会被察觉"},{"id":"第二部分专业题-一、密码学-单选题-94","no":94,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"SSL 协 议 的 密 码 套 件 中 ， 经 抓 包 发 现 通 信 双 方 协 商 的 密 码 套 件 为 ECDHE_RSA_WITH_AES_128_GCM_SHA，下列说法错误的是（ ）。","options":[{"key":"A","text":"RSA 算法用于实现身份鉴别"},{"key":"B","text":"基于RSA 数字信封方式进行密钥交换"},{"key":"C","text":"AES-GCM 算法用于实现通信数据机密性保护"},{"key":"D","text":"AES-GCM 算法用于实现通信数据完整性保护"}],"answer":"B","analysis":"TLS 密码套件名的格式是「密钥交换算法_认证算法_WITH_对称加密算法_哈希算法」。本题套件 ECDHE_RSA_WITH_AES_128_GCM_SHA256 的含义是：ECDHE 做临时椭圆曲线密钥交换，RSA 对握手消息签名以鉴别服务器身份，AES-128-GCM 保护记录层，SHA256 作摘要。AES-GCM 是认证加密（AEAD）模式，一次同时提供机密性与完整性。","correctReason":"套件名第一部分 ECDHE 才是密钥交换算法，RSA 只充当签名与身份鉴别；因此「基于 RSA 数字信封交换密钥」的描述与实际协商结果不符。","wrongReason":"A：RSA 在此确实用于服务器身份鉴别（对握手参数签名），说法正确；C：AES-GCM 对记录层载荷加密，确实提供机密性，说法正确；D：GCM 的认证标签提供完整性校验，说法正确。故错误的是 B。","source":"RFC 5289《TLS 使用 ECDHE 的密码套件》2 节；RFC 5288《TLS 的 AES-GCM 密码套件》；GB/T 38636-2020《信息安全技术 传输层密码协议》","keyPoint":"套件名结构：密钥交换_认证_WITH_加密_摘要，ECDHE 换密钥、RSA 只做鉴别"},{"id":"第二部分专业题-一、密码学-单选题-95","no":95,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"以下最适合用于支持NAT（网络地址转换）穿越的模式是（ ）。","options":[{"key":"A","text":"传输模式下使用AH+ESP 协议"},{"key":"B","text":"隧道模式下使用AH+ESP 协议"},{"key":"C","text":"传输模式下使用ESP 协议"},{"key":"D","text":"隧道模式下使用ESP 协议"}],"answer":"D","analysis":"NAT 会改写 IP 地址（常配套改写端口），凡是把 IP 头纳入完整性校验、或依赖原始 IP 头端到端可用的方案都会被破坏。AH 的认证覆盖整个 IP 头，无法穿越 NAT；传输模式保留原 IP 头，NAT 改写后接收端校验失败，也无法穿透。隧道模式加 ESP 时，待保护的原 IP 报文被整体封装加密，外层新 IP 头由 NAT 处理且不参与认证，因此最适合作 NAT 穿越；工程上再配合 NAT-T（UDP 4500 封装）使用。","correctReason":"ESP 隧道模式把原 IP 报文整体加密封装，外层使用新的 IP 头供 NAT 改写而不参与认证，AH 因校验 IP 头而在此不适用。","wrongReason":"A：传输模式保留原 IP 头，且 AH 校验整个 IP 头，NAT 改写后一定校验失败；B：隧道模式虽好，但含 AH 时仍会校验 IP 头，NAT 下不能正常工作；C：传输模式只封装载荷、保留原 IP 头，NAT 改写地址后接收端无法正确还原和校验。","source":"RFC 4303《ESP》3.1.2；RFC 3948《IPsec ESP 报文的 UDP 封装（NAT 穿越）》","keyPoint":"NAT 穿越：ESP 隧道模式可用，AH 因校验 IP 头不可用"},{"id":"第二部分专业题-一、密码学-单选题-96","no":96,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"S-HTTP（安全超文本传输协议）是一种结合HTTP 而设计的安全通信协议， 它工作（ ）层。","options":[{"key":"A","text":"传输层"},{"key":"B","text":"链路层"},{"key":"C","text":"网络层"},{"key":"D","text":"应用层"}],"answer":"D","analysis":"要区分几个易混的安全协议所处层次：S-HTTP 是在 HTTP 报文这一层做安全增强的应用层协议，可为单个消息提供签名、加密等保护，依赖 HTTP 的报文交换而不改变传输机制；SSL/TLS 位于传输层之上（会话层/传输层之上）；IPsec 位于网络层；链路层加密如 MACsec。题干强调「结合 HTTP 而设计」，正好落在应用层。","correctReason":"S-HTTP 通过在 HTTP 报文上附加安全封装字段实现保护，与 HTTP 同属应用层协议，不修改下层传输机制。","wrongReason":"A：传输层对应的是 SSL/TLS 及其后继 TLS 协议；B：链路层对应 MACsec 等逐跳加密技术；C：网络层对应 IPsec（AH/ESP）等协议。三者都不是 S-HTTP 的工作层次。","source":"RFC 2660《The Secure HyperText Transfer Protocol (S-HTTP)》","keyPoint":"层次对照：S-HTTP 应用层、SSL/TLS 传输层之上、IPsec 网络层、MACsec 链路层"},{"id":"第二部分专业题-一、密码学-单选题-97","no":97,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"SM2 是我国自主设计的椭圆曲线公钥密码算法。关于SM2 的描述，以下错 误的是（ ）。","options":[{"key":"A","text":"SM2 基于椭圆曲线离散对数问题（ECDLP）的困难性"},{"key":"B","text":"SM2 可以用于数字签名、密钥交换和公钥加密"},{"key":"C","text":"SM2 的推荐椭圆曲线参数使用256 位素数域曲线"},{"key":"D","text":"SM2 的密钥长度与RSA-2048 相同，安全性也相同"}],"answer":"D","analysis":"SM2 是基于 256 位素数域椭圆曲线的公钥密码算法，安全性建立在椭圆曲线离散对数问题（ECDLP）困难性之上，一套算法覆盖数字签名、密钥交换和公钥加密三类用途。它的密钥长度是 256 位，安全强度约 128 比特，与 RSA-2048 的安全强度大致相当，但密钥和签名短得多、运算更快；说「密钥长度与 RSA-2048 相同」本身就是错的，256 位与 2048 位差了近 8 倍。","correctReason":"SM2 密钥长度为 256 比特，RSA-2048 密钥长度为 2048 比特，二者密钥长度显然不同，故 D 的描述错误。","wrongReason":"A：SM2 的安全性确实依赖 ECDLP 困难性，说法正确；B：SM2 标准包含签名、密钥交换、公钥加密三部分，说法正确；C：SM2 推荐参数为 256 位素数域曲线（sm2p256v1），说法正确。故错误的是 D。","source":"GB/T 32918.1-2016《SM2 椭圆曲线公钥密码算法 第 1 部分：总则》；GB/T 32918.5-2017 参数定义","keyPoint":"SM2 为 256 位素域曲线，约 128 比特安全强度，不要与 RSA-2048 混谈"},{"id":"第二部分专业题-一、密码学-单选题-98","no":98,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"在随机数发生器后处理方法中，并非冯·诺依曼后处理方法特点的是（ ）。","options":[{"key":"A","text":"输入序列是统计独立的"},{"key":"B","text":"输出速率是稳定的"},{"key":"C","text":"输入序列会被压缩输出"},{"key":"D","text":"输入序列是不均衡的"}],"answer":"B","analysis":"冯·诺依曼后处理针对的是「输出比特统计独立但 0/1 不均衡（有偏）」的物理噪声源：把输入按相邻两位一组处理，00 与 11 丢弃、01 输出 0、10 输出 1，从而消除偏置。它的输入前提是比特相互独立、但分布不均衡；输出是被压缩的（每位输出平均要消耗约 4 位输入）。最大的短板是输出速率随输入质量波动、不可控且偏慢，例如输入严重失衡时大量比特对会被丢弃，所以「输出速率稳定」不是它的特点。","correctReason":"冯·诺依曼后处理靠丢弃 00/11 实现去偏，丢弃比例取决于输入偏置程度，输出速率随输入质量变化，并不稳定。","wrongReason":"A：该方法要求输入比特统计独立，这是它的适用前提，属于其特点；C：每组两位最多输出一位，输出必然被压缩，属于其特点；D：它正是针对 0/1 不均衡的序列设计的，属于其特点。故「输出速率稳定」不成立。","source":"GM/T 0005-2021《随机性检测规范》；GM/T 0062-2018《密码产品随机数检测要求》；冯·诺依曼后处理方法（von Neumann, 1951）","keyPoint":"冯·诺依曼去偏：丢 00/11、输出压缩、输入须独立且可偏，速率不稳定"},{"id":"第二部分专业题-一、密码学-单选题-99","no":99,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"SM9 是我国自主设计的基于标识的密码算法（Identity-Based Cryptography, IBC）。关于SM9 的特点，以下描述正确的是（ ）。","options":[{"key":"A","text":"SM9 不需要证书管理机构（CA），但需要一个密钥生成中心（KGC）"},{"key":"B","text":"SM9 的用户公钥是随机生成的，与用户身份无关"},{"key":"C","text":"SM9 与SM2 的安全性假设完全相同"},{"key":"D","text":"SM9 不支持加密和签名，仅支持密钥交换"}],"answer":"A","analysis":"SM9 属于标识密码（IBC），用户公钥直接由其标识（如邮箱、手机号、身份证号）计算得到，因此不再需要 CA 签发和验证数字证书，也就不存在证书链、CRL、OCSP 这套体系；但必须有一个可信的密钥生成中心（KGC）持有主密钥，为用户派生私钥。它与 SM2 的数学基础不同：SM9 建立在椭圆曲线双线性对（配对）之上，安全性假设涉及 BDHI 类问题；SM9 同时支持签名、密钥交换和密钥封装/加密。","correctReason":"SM9 用标识直接充当公钥、免证书，但私钥必须由可信 KGC 用主密钥派生，故「无需 CA、但需要 KGC」的说法正确。","wrongReason":"B：SM9 的公钥与用户身份标识绑定，并非随机生成，这正是它免证书的原因；C：SM9 依赖双线性对相关困难问题，与 SM2 的 ECDLP 假设并不相同；D：SM9 标准涵盖签名、密钥交换、密钥封装与加密，功能不止密钥交换。","source":"GB/T 38635.1-2020《信息安全技术 SM9 标识密码算法 第 1 部分：总则》","keyPoint":"SM9=标识即公钥、免证书、靠 KGC 派生私钥、基于双线性对"},{"id":"第二部分专业题-一、密码学-单选题-100","no":100,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"假设某公司的董事会想保护产品的配方，该公司总裁应该能够在需要时拿 到配方，但在紧急的情况下，12 位董事会成员中的任意7 位也可以揭开配方。 在密码学上，解决这类问题的技术称为（ ）。","options":[{"key":"A","text":"密钥托管技术"},{"key":"B","text":"门限密钥协商技术"},{"key":"C","text":"密钥分发技术"},{"key":"D","text":"门限秘密共享技术"}],"answer":"D","analysis":"题干描述的是典型的 (t, n) 门限方案：把秘密拆成 n 份分给 n 个人，任意 t 份及以上可以合作恢复秘密，少于 t 份则得不到任何有用信息。总裁单独持有一份（或作为特殊份额持有者）可随时取用，紧急情况下 12 名董事中任意 7 名凑齐即可恢复配方，正是 Shamir 门限秘密共享的经典场景。它与门限密钥协商的区别在于：后者是多人共同协商出一个共享密钥，而这里是恢复一个既有的秘密。","correctReason":"门限秘密共享把秘密分为 n 份、满足任意 t 份可恢复而不足 t 份不可恢复，正好实现「总裁可用、任意 7 位董事也可恢复」的授权结构。","wrongReason":"A：密钥托管是第三方代为保管密钥以便依法获取，不涉及多人分片与门限恢复；B：门限密钥协商是多方共同生成一个会话密钥的协议，目标是产生新密钥而非恢复已有秘密；C：密钥分发解决的是密钥如何安全送达使用者，与门限恢复无关。","source":"Shamir 门限秘密共享方案（(t, n) 门限体制，Shamir, 1979）；GM/T 0050-2016《密码设备管理 设备管理技术规范》相关密钥分割要求","keyPoint":"(t,n) 门限：任意 t 份可恢复、少于 t 份无信息；与密钥协商要分清"},{"id":"第二部分专业题-一、密码学-单选题-101","no":101,"kind":"single","part":"第二部分专业题","cat":"一、密码学","type":"单选题","stem":"以下关于SM2 数字签名、RSA 数字签名和ECDSA 的对比，描述正确的是 （ ）。","options":[{"key":"A","text":"三种签名算法的签名长度相同"},{"key":"B","text":"SM2 和ECDSA 都可以实现签名聚合，RSA 不支持"},{"key":"C","text":"SM2 签名算法中包含一个额外的哈希函数调用，而ECDSA 不包含"},{"key":"D","text":"SM2 的签名验证过程中不需要计算哈希值"}],"answer":"B","analysis":"三种签名长度差异明显：RSA 签名长度等于模长（如 2048 位），SM2 与 ECDSA 都是两个 256 位整数（r, s），约 64 字节，故长度并不相同。SM2 与 ECDSA 同属椭圆曲线签名体系、代数结构相似，可支持聚合类扩展，RSA 不具备这一性质，故 B 正确。SM2 与 ECDSA 都先对消息求杂凑再运算，SM2 的特色是拼接签名者标识 ZA 后杂凑，并非「多一次哈希而 ECDSA 不含哈希」，验签时两者都要重算杂凑。","correctReason":"SM2 与 ECDSA 同属椭圆曲线签名体系、签名结构一致，均具备支持签名聚合类扩展的代数结构，而 RSA 不具备这一性质，故 B 成立。","wrongReason":"A：RSA 签名长度由模数决定（如 2048 位），SM2/ECDSA 为两个 256 位整数，长度并不相同；C：ECDSA 同样先对消息做杂凑运算，并非不包含哈希；
