":52,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"目前全球已形成五大主流抗量子密码技术路线，其中综合表现最优、成为国 际标准优先选用技术路线的是（ ）","options":[{"key":"A","text":"基于编码的密码"},{"key":"B","text":"基于哈希函数的密码"},{"key":"C","text":"基于格的密码"},{"key":"D","text":"基于同源的密码"}],"answer":"C","analysis":"五大主流路线为基于格、基于编码、基于哈希、多变量与同源。格密码在安全归约（LWE/SIS 等最坏情况困难性）、密钥与密文尺寸、运算速度、软硬件实现友好度之间平衡最好，且能同时构造加密/密钥封装与签名，因此在 NIST 标准化中被优先选用，ML-KEM、ML-DSA 乃至 FN-DSA 都属格密码。编码类公钥尺寸过大，哈希类签名尺寸大、性能差，同源方案 SIKE 已被有效攻击攻破。","correctReason":"基于格的密码综合安全性与实用性最优，NIST 首批标准 ML-KEM、ML-DSA（及 FN-DSA）均建立在格困难问题之上，故选 C。","wrongReason":"A：基于编码的密码（如 McEliece）安全性久经考验，但公钥尺寸过大，实用性受限；B：基于哈希的密码（如 SPHINCS+）稳健保守，但签名与公钥尺寸大、性能差，多作签名备选；D：基于同源的方案曾进入终选，但 SIKE 已被经典计算机上的有效攻击攻破。","source":"NIST FIPS 203（ML-KEM）、FIPS 204（ML-DSA）的算法基础与 NIST PQC 遴选结论","keyPoint":"五大路线中格密码综合最优，NIST 首批标准以格为主"},{"id":"第二部分专业题-二、密码前沿技术-单选题-53","no":53,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"美国国家标准与技术研究院（NIST）首批发布的抗量子密码标准中，用于密 钥封装的算法是（ ）","options":[{"key":"A","text":"ML-DSA"},{"key":"B","text":"FN-DSA"},{"key":"C","text":"ML-KEM"},{"key":"D","text":"SHA-256"}],"answer":"C","analysis":"NIST 于 2024 年 8 月发布首批三项抗量子标准：FIPS 203 是 ML-KEM（源自 KYBER），用于密钥封装；FIPS 204 的 ML-DSA 与 FIPS 205 的 SLH-DSA 都是数字签名算法。所以用于密钥封装的是 ML-KEM。A 的 ML-DSA、B 的 FN-DSA（源自 Falcon）同为签名算法，D 的 SHA-256 是杂凑函数，不提供密钥封装。","correctReason":"ML-KEM（FIPS 203，源自 KYBER）是 NIST 首批抗量子密码标准中用于密钥封装的算法，故选 C。","wrongReason":"A：ML-DSA 是数字签名标准（FIPS 204），不用于密钥封装；B：FN-DSA 源自 Falcon，属签名算法（当时仍处草案阶段）；D：SHA-256 是杂凑函数，本身不提供密钥封装功能。","source":"NIST FIPS 203《Module-Lattice-Based Key-Encapsulation Mechanism Standard》（2024 年 8 月）","keyPoint":"ML-KEM 管密钥封装，ML-DSA 与 SLH-DSA 管签名"},{"id":"第二部分专业题-二、密码前沿技术-单选题-54","no":54,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"以下有关云计算的表达，不恰当的是（ ）。","options":[{"key":"A","text":"云计算是一种按使用量付费的模式"},{"key":"B","text":"这种模式提供可用的、便捷的、按需的网络访问"},{"key":"C","text":"云计算的可配置计算资源共享池包括网络、服务器、存储、应用软件、服务等 资源"},{"key":"D","text":"云计算服务是通过卫星进行的数据服务"}],"answer":"D","analysis":"按 NIST SP 800-145 的定义，云计算是一种按使用量付费的模式，可通过网络以便捷、按需的方式访问可配置的共享计算资源池（网络、服务器、存储、应用与服务），资源能快速弹性伸缩。它与是否经由卫星毫无关系，D 属明显不恰当的表述。A、B、C 分别对应定义中的按量付费、按需网络访问与资源共享池三个要点。","correctReason":"云计算是按需网络访问共享资源池并按使用量付费的服务模式，与“通过卫星进行的数据服务”无关，故 D 表述不恰当。","wrongReason":"A：按使用量付费是云计算的基本特征，表述恰当；B：可用的、便捷的、按需的网络访问符合定义，表述恰当；C：共享资源池确含网络、服务器、存储、应用与服务，表述恰当。","source":"NIST SP 800-145《The NIST Definition of Cloud Computing》；GB/T 31167《信息安全技术 云计算服务安全指南》","keyPoint":"云计算＝按需网络访问共享资源池并按量付费，与卫星无关"},{"id":"第二部分专业题-二、密码前沿技术-单选题-55","no":55,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"根据相关预测，能够破解RSA 和椭圆曲线加密（ECC）的量子计算机可能在 多长时间内出现？（ ）","options":[{"key":"A","text":"已经出现"},{"key":"B","text":"五年内"},{"key":"C","text":"五十年后"},{"key":"D","text":"永远不会出现"}],"answer":"B","analysis":"本题问的是“根据相关预测”量子破解机可能出现的时间，官方依据的是部分机构与专家给出的较激进估计，即可能在未来五年左右出现能威胁 RSA/ECC 的量子计算机，故选“五年内”。需要说明的是，业界对时间判断分歧很大，也有十年、十五年以上的估计；但“先存储、后解密”意味着长周期敏感数据当下就有风险，各国都要求提前启动抗量子迁移，而不是等真机出现。（该题答案以官方为准）","correctReason":"按题干所引预测口径，能破解 RSA 与椭圆曲线加密（ECC）的量子计算机被估计可能在五年内出现，故选“五年内”。","wrongReason":"A：目前尚无能破解 RSA/ECC 的实用化量子计算机，“已经出现”不符合事实；C：五十年后过于悲观，与题干所引预测口径不符；D：量子计算技术持续取得进展，“永远不会出现”明显不成立。","source":"NIST IR 8547《Transition to Post-Quantum Cryptography Standards》及业界关于量子威胁时间线的预测（各方估计差异较大）","keyPoint":"量子威胁时间预测分歧大，但迁移必须提前启动"},{"id":"第二部分专业题-二、密码前沿技术-单选题-56","no":56,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"关于NIST 抗量子密码标准化进程，以下说法正确的是（ ）","options":[{"key":"A","text":"NIST 已完成全部标准化工作，不再有新算法进入评审"},{"key":"B","text":"2026 年5 月，NIST 从第二轮评审中选出了9 个候选算法进入第三轮"},{"key":"C","text":"NIST 只评审基于格的密码算法"},{"key":"D","text":"NIST 的抗量子密码标准化工作与量子计算机无关"}],"answer":"B","analysis":"NIST 的抗量子标准化是分轮次滚动推进的：2026 年 5 月 14 日，NIST 依据内部报告 IR 8610 宣布从第二轮评审中选出 9 个候选签名算法（UOV、MAYO、SQIsign 等）进入第三轮，第三阶段评审预计还要约两年。可见 A 错在“已完成全部标准化、不再有新算法评审”；C 错在称评审只限格密码，候选实际覆盖多变量、编码、哈希、同源等多条路线；D 错在称其与量子计算机无关。","correctReason":"2026 年 5 月，NIST 通过内部报告 IR 8610 宣布从第二轮评审中选出 9 个候选算法进入第三轮（附加数字签名方向），故选 B。","wrongReason":"A：标准化仍在进行，附加签名方案刚进入第三轮，还有新算法在评审；C：NIST 评审范围覆盖格、编码、哈希、多变量、同源等多条路线，并非只有格密码；D：该标准化工作正是为应对量子计算机对现有公钥密码的威胁而开展。","source":"NIST IR 8610《Status Report on the Second Round of the Additional Digital Signature Schemes for the NIST PQC Standardization Process》（2026 年 5 月）","keyPoint":"2026 年 5 月 NIST 选出 9 个候选签名算法进入第三轮"},{"id":"第二部分专业题-二、密码前沿技术-单选题-57","no":57,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"风险管理是一个系统的过程，旨在识别、评估和控制可能影响企业目标实现 的不确定性和潜在威胁。风险管理的最佳战略是（ ）。","options":[{"key":"A","text":"实现风险与组织目的之间的平衡"},{"key":"B","text":"将风险降至可接受水平"},{"key":"C","text":"确保政策的制定正确考虑了组织风险"},{"key":"D","text":"确保管理层接受所有未经缓解的风险"}],"answer":"B","analysis":"风险管理的目标不是消灭全部风险，而是把风险控制到组织可接受的水平：识别与评估之后选择降低、规避、转移或接受等处置方式，使剩余风险落在可接受范围内，并与组织目标、成本效益相平衡。A 说的“风险与组织目的相平衡”是应把握的原则，B 的“降至可接受水平”才是风险管理工作追求的落点，故 B 最恰当。C 只限于政策制定环节，覆盖过窄；D 不加缓解地接受所有风险，违背风险管理的基本要求。","correctReason":"风险管理的最佳状态是把风险降至组织可接受的水平，既不过度防护也不放任风险，故选 B。","wrongReason":"A：风险与组织目的相平衡属应遵循的原则，作为“最佳战略”表述不够准确；C：仅强调政策制定考虑组织风险，覆盖范围过窄；D：不加缓解地接受所有未经处理的风险，违背风险管理基本要求。","source":"GB/T 24353-2022《风险管理 指南》（对应 ISO 31000）；GB/T 20984-2022《信息安全技术 信息安全风险评估方法》","keyPoint":"风险管理最优目标：把风险降到组织可接受的水平"},{"id":"第二部分专业题-二、密码前沿技术-单选题-58","no":58,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"当前，后量子密码迁移普遍被业界建议视为（ ）","options":[{"key":"A","text":"一次性的“大切换”，应在短期内完成"},{"key":"B","text":"持续数年甚至十年的渐进工程"},{"key":"C","text":"仅在金融行业实施的专项工程"},{"key":"D","text":"可以无限期推迟的非紧急事项"}],"answer":"B","analysis":"后量子迁移涉及密码资产清点、算法与协议改造、证书与信任链重建、设备固件升级、互操作测试与合规验证，新旧算法还要长期并存、分阶段切换，因此业界普遍把它看作持续数年甚至十年的渐进工程，而非一次性的“大切换”。A 的短期完成不现实；C 把它限定在金融行业，实际电信、政务、能源、车联网等都要做；D 认为可无限期推迟，忽视了“先存储、后解密”的现实威胁。","correctReason":"迁移需要新旧算法长期并存、分阶段切换，业界普遍将其视为持续数年乃至十年的渐进工程，故选 B。","wrongReason":"A：涉及全栈改造与互操作，短期内一次性切换不可行；C：迁移是跨行业普遍要求，并非金融行业的专项工程；D：面对“先存储、后解密”，无限期推迟会使当下产生的敏感数据在未来被解密。","source":"NIST IR 8547《Transition to Post-Quantum Cryptography Standards》；NIST NCCoE 密码迁移相关指南","keyPoint":"PQC 迁移是持续数年乃至十年的渐进工程，不是一次性切换"},{"id":"第二部分专业题-二、密码前沿技术-单选题-59","no":59,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"数字水印技术是一种用于在多媒体数据中嵌入特定信息的技术，可以根据其 功能、特性和应用领域进行分类。通常用于数字化图像、视频、音频或电子文档 的版权保护的是（ ）。","options":[{"key":"A","text":"鲁棒水印"},{"key":"B","text":"易损水印"},{"key":"C","text":"标注水印"},{"key":"D","text":"动态水印"}],"answer":"A","analysis":"数字水印按鲁棒性分为鲁棒水印与易损（脆弱）水印。鲁棒水印要求在压缩、裁剪、加噪、格式转换等常规处理后仍能提取出嵌入信息，作品被转载、编辑、传播后依然可以主张版权、追踪来源，因此用于版权保护。易损水印恰好相反，任何改动都会破坏水印，用于完整性认证与篡改定位。“标注水印”“动态水印”都不是按鲁棒性划分的标准类别。","correctReason":"鲁棒水印能抵抗压缩、裁剪、加噪等常规处理，载体被传播编辑后仍可提取，适合数字图像、视频、音频与电子文档的版权保护，故选 A。","wrongReason":"B：易损（脆弱）水印一改就坏，用于检测篡改、验证完整性，不用于版权保护；C：标注水印不是数字水印按鲁棒性划分的标准类别；D：动态水印多指随用户或时间变化的溯源水印（如屏幕水印），不属题干所问的分类项。","source":"数字水印技术通行分类（按鲁棒性分为鲁棒水印与易损水印）及数字水印相关国家标准","keyPoint":"抗常规处理的鲁棒水印护版权；易损水印管完整性认证"},{"id":"第二部分专业题-二、密码前沿技术-单选题-60","no":60,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"量子计算机对传统公钥密码体系的威胁主要来自（ ）","options":[{"key":"A","text":"Grover 算法"},{"key":"B","text":"Shor 算法"},{"key":"C","text":"Deutsch-Jozsa 算法"},{"key":"D","text":"Simon 算法"}],"answer":"B","analysis":"Shor 算法利用量子傅里叶变换，可在多项式时间内求解大整数分解与离散对数问题，直接击穿 RSA、DH、ECC/SM2 等公钥密码的安全基础。Grover 算法只是把无序搜索从 N 次降到约根号 N 次，对分组密码与杂凑仅构成平方级加速，并不威胁公钥体制；Deutsch-Jozsa 算法用于判断函数是否恒定或平衡，属理论算法；Simon 算法是 Shor 算法的重要前导，本身并不直接用于破解 RSA/ECC。","correctReason":"Shor 算法可多项式时间求解大整数分解与离散对数问题，直接威胁 RSA、ECC 等传统公钥密码体系，故选 B。","wrongReason":"A：Grover 算法只带来平方级加速，主要影响对称密码与杂凑，不是公钥体制的主要威胁；C：Deutsch-Jozsa 算法用于判定函数恒定或平衡，属量子计算理论算法；D：Simon 算法是 Shor 算法的重要理论基础，本身并不用于破解 RSA/ECC。","source":"Shor 算法（P. Shor，1994）；NIST PQC 标准化项目背景说明","keyPoint":"Shor 破公钥（RSA/ECC），Grover 只让对称与杂凑强度开平方"},{"id":"第二部分专业题-二、密码前沿技术-单选题-61","no":61,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"为了有效防范网络安全漏洞，多种技术被开发和应用，常见的网络安全漏洞 利用防范技术主要有地址空间随机化技术、数据执行阻止、堆栈保护、虚拟补丁 等。那么，Web 应用防火墙属于（ ）。","options":[{"key":"A","text":"地址空间随机化技术"},{"key":"B","text":"数据执行阻止"},{"key":"C","text":"堆栈保护"},{"key":"D","text":"虚拟补丁"}],"answer":"D","analysis":"虚拟补丁的思路是不改动存在漏洞的应用代码，而在其前面或外围（WAF、IPS、RASP 等）部署规则拦截针对该漏洞的攻击流量，相当于在外部打上“补丁”，为正式修复争取时间，Web 应用防火墙正是典型实现。地址空间随机化（ASLR）通过打乱栈、堆与库的加载基址提高利用难度；数据执行阻止（DEP）禁止在数据页执行代码；堆栈保护（Stack Canary）在栈帧放置哨兵值以检测溢出，三者都是针对内存破坏类漏洞的缓解机制。","correctReason":"WAF 通过外部规则拦截针对已知漏洞的攻击流量、无需改动应用代码，正是虚拟补丁的典型实现，故选 D。","wrongReason":"A：地址空间随机化是把内存布局随机化，使攻击者难以定位代码，与 WAF 无关；B：数据执行阻止是把内存页标记为不可执行，阻止 shellcode 运行；C：堆栈保护靠栈帧中的哨兵值检测栈溢出，属编译期/运行期缓解手段。","source":"OWASP 关于 Web 应用防火墙（WAF）与虚拟补丁的说明；PCI DSS 将 WAF 作为补丁管理的补偿控制","keyPoint":"WAF 不改代码、在外围拦截攻击流量＝虚拟补丁"},{"id":"第二部分专业题-二、密码前沿技术-单选题-62","no":62,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"构建云计算安全等级保护框架时，遵循“一个中心，三重防护”的原则是关键。 其中一个中心是指安全管理中心，三重防护为计算环境安全、区域边界安全和通 信网络安全。以下安全机制属于计算环境安全的是（ ）。","options":[{"key":"A","text":"安全事件监测"},{"key":"B","text":"应用安全"},{"key":"C","text":"网络隔离"},{"key":"D","text":"抗DDoS 攻击"}],"answer":"B","analysis":"等保2.0对云计算的安全扩展要求采用“一个中心、三重防护”框架：安全管理中心统筹，计算环境安全、区域边界安全、通信网络安全三层防护。计算环境安全落在主机、操作系统、数据库、中间件和应用这一层，应用安全属于该范畴。网络隔离、抗DDoS针对的是通信网络与区域边界，安全事件监测则属于安全管理中心的管理与审计职能。判断时先定位机制作用的层面，再对号入座即可。","correctReason":"应用安全作用于主机与应用这一层，属于计算环境安全的组成部分。","wrongReason":"A：安全事件监测属于安全管理中心（管理与审计层面），不是计算环境；C：网络隔离作用于通信网络；D：抗DDoS攻击属于区域边界安全。","source":"GB/T 22239-2019《信息安全技术 网络安全等级保护基本要求》云计算安全扩展要求","keyPoint":"一个中心（安全管理中心）＋三重防护：计算环境、区域边界、通信网络。"},{"id":"第二部分专业题-二、密码前沿技术-单选题-63","no":63,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"Shor 算法在理论上能够高效破解的传统密码算法类型是（ ）","options":[{"key":"A","text":"仅对称加密算法如AES"},{"key":"B","text":"仅哈希算法如SHA-256"},{"key":"C","text":"基于大整数分解和离散对数难题的公钥密码算法如RSA 和ECC"},{"key":"D","text":"所有类型的密码算法"}],"answer":"C","analysis":"Shor算法用量子傅里叶变换把大整数分解和离散对数求解降到多项式时间，因此以这两类难题为安全根基的RSA、ECC（含有限域与椭圆曲线离散对数）会被彻底攻破。它并不通用地破所有密码：对AES这类对称算法没有直接的多项式时间攻击，对SHA系列杂凑也只通过Grover带来平方根级加速。所以“仅对称”“仅哈希”“所有算法”都是对Shor能力范围的误读。注意区分Shor与Grover的分工是本题关键。","correctReason":"Shor算法能高效求解大整数分解与离散对数，故直接威胁RSA、ECC等基于该类难题的公钥算法。","wrongReason":"A：Shor不直接破解AES等对称加密，量子对对称密码主要是Grover带来的强度折半；B：对SHA-256等杂凑无多项式时间攻击；D：并非所有密码算法，对称密码与杂凑并不被Shor高效破解。","source":"Shor算法（1994）及GB/T 32918系列SM2椭圆曲线公钥密码算法","keyPoint":"Shor破公钥（分解/离散对数），Grover削对称（强度折半）。"},{"id":"第二部分专业题-二、密码前沿技术-单选题-64","no":64,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"在路由器配置时，使用（ ）命令可以将口令以加密（密文）的形式保存， 在网络设备配置中这是常用的一种安全措施，确保即使配置文件被未经授权的人 员查看，口令也不会轻易暴露。","options":[{"key":"A","text":"enablesecret"},{"key":"B","text":"secureboot-image"},{"key":"C","text":"loginlocal"},{"key":"D","text":"cryptokeygenerate"}],"answer":"A","analysis":"思科等网络设备中，特权口令用明文写配置的命令是enable password，而enable secret把口令经不可逆的哈希变换后再写入配置文件，别人看到配置也拿不到原始口令。secure boot-image是做镜像签名校验防止固件被替换，login local是启用本地用户名口令认证，crypto key generate是生成密钥对。三者都不解决“配置文件中口令以密文保存”这个诉求。","correctReason":"enable secret将特权EXEC口令以加密（哈希）形式存储于配置，查看配置无法还原明文口令。","wrongReason":"B：secure boot-image用于镜像完整性/签名校验，防护固件被篡改；C：login local是启用本地认证，口令仍可能明文保存；D：crypto key generate用于生成密钥对，不用于口令加密。","source":"网络设备安全配置实践（Cisco IOS命令参考：enable secret / enable password）","keyPoint":"配置中口令密文保存用enable secret。"},{"id":"第二部分专业题-二、密码前沿技术-单选题-65","no":65,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"量子计算机成熟后，以下哪些领域的数据安全将首当其冲面临威胁？（ ）","options":[{"key":"A","text":"仅个人社交媒体数据"},{"key":"B","text":"金融交易、政府通讯、云端资料及关键基础设施"},{"key":"C","text":"仅公开的学术研究数据"},{"key":"D","text":"仅娱乐媒体内容"}],"answer":"B","analysis":"成熟量子计算机的威胁是全域性的，只要安全依赖公钥密码，都首当其冲：金融交易、政府机要通信、云端存储资料、电力与交通等关键基础设施的加密与身份体系都会被Shor算法动摇。像“仅社交媒体”“仅公开学术数据”“仅娱乐内容”这类限定都不成立，公开数据的机密性诉求反而最低。答题要点是抓住“凡用公钥密码保护机密性与真实性之处皆受威胁”。","correctReason":"金融、政府通信、云端资料和关键基础设施均依赖公钥密码体制，量子成熟后其机密性与真实性同时受威胁。","wrongReason":"A：不是仅限社交媒体，个人隐私同样受损但范围远不止于此；C：公开学术数据的机密性需求最低，恰恰不是首要冲击对象；D：娱乐媒体内容同样不是“首当其冲”的核心领域。","source":"NIST IR 8547《Transition to Post-Quantum Cryptography Standards》等后量子迁移文件","keyPoint":"量子威胁看“依赖公钥密码的领域”，金融/政务/云/关基首当其冲。"},{"id":"第二部分专业题-二、密码前沿技术-单选题-66","no":66,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"中标麒麟可信操作系统结构包括管理子系统、安全子系统、可信子系统和应 用开发环境四个部分，其中身份鉴别功能属于系统安全的重要组成部分，主要用 于验证用户或系统的身份，属于（ ）。","options":[{"key":"A","text":"管理子系统"},{"key":"B","text":"应用开发环境"},{"key":"C","text":"可信子系统"},{"key":"D","text":"安全子系统"}],"answer":"D","analysis":"中标麒麟可信操作系统由管理子系统、安全子系统、可信子系统和应用开发环境四部分组成。其中安全子系统承担身份鉴别、访问控制、安全审计、客体重用等经典安全功能，是系统安全的核心。可信子系统侧重可信根、可信度量与信任链传递，管理子系统负责配置与管理，应用开发环境提供开发接口与工具。身份鉴别的归属因此落在安全子系统。","correctReason":"身份鉴别属于操作系统安全功能，由中标麒麟的安全子系统实现。","wrongReason":"A：管理子系统负责系统配置与管理，不做身份鉴别；B：应用开发环境提供开发工具与接口；C：可信子系统负责可信根、完整性度量与信任链传递。","source":"中标麒麟可信操作系统安全技术架构（GB/T 20272-2019《信息安全技术 操作系统安全技术要求》）","keyPoint":"身份鉴别、访问控制、安全审计归“安全子系统”。"},{"id":"第二部分专业题-二、密码前沿技术-单选题-67","no":67,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"计算机病毒通常附加在正常软件或文档中，一旦触发执行，就会潜入受害用 户的计算机。以下计算机病毒以Word 文档为隐蔽载体是（ ）。","options":[{"key":"A","text":"CIH 病毒"},{"key":"B","text":"Nimda 病毒"},{"key":"C","text":"Melissa 病毒"},{"key":"D","text":"Sasser 病毒"}],"answer":"C","analysis":"Melissa病毒（1999年）以Word文档为载体，通过邮件附件传播，打开文档后宏代码触发，既群发邮件又感染后续文档，是最典型的宏病毒。CIH攻击Windows PE可执行文件并能破坏主板BIOS；Nimda是综合型蠕虫，靠邮件、共享目录和网页多途径传播；Sasser利用Windows LSASS漏洞在网络中自动扩散。只有Melissa的隐蔽载体是Word文档。","correctReason":"Melissa是宏病毒，寄生于Word文档的宏中并在打开文档时执行。","wrongReason":"A：CIH感染可执行文件并可能破坏BIOS，载体不是Word文档；B：Nimda是复合型蠕虫，主要通过邮件与网络共享传播；D：Sasser利用系统漏洞自动传播，与Word文档无关。","source":"计算机病毒分类与典型病毒案例（宏病毒类：Melissa，1999）","keyPoint":"Word文档载体＝宏病毒，代表即Melissa。"},{"id":"第二部分专业题-二、密码前沿技术-单选题-68","no":68,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"ARP 病毒利用了ARP 协议本身的弱点，通过（ ），对网络通信安全构成 了严重威胁。","options":[{"key":"A","text":"SYN 泛红占用大量网络带宽导致网络拥塞"},{"key":"B","text":"加密网络流量使其无法被正常解析"},{"key":"C","text":"拦截和篡改IP 数据包"},{"key":"D","text":"伪造ARP 请求或应答来欺骗网络中的设备"}],"answer":"D","analysis":"ARP协议本身无认证，主机收到ARP应答就更新缓存。ARP病毒正是伪造ARP请求或应答，把网关或目标主机的IP与攻击者MAC绑定，造成中间人、断网或流量劫持。SYN泛洪是TCP层DoS，加密流量与ARP欺骗无关，拦截篡改IP数据包是IP层攻击的描述而非ARP的工作方式。抓住“ARP欺骗＝伪造IP与MAC映射”即可。","correctReason":"ARP病毒通过伪造ARP请求/应答污染ARP缓存，实现IP与MAC的欺骗性映射。","wrongReason":"A：SYN泛洪是TCP层拒绝服务攻击，不属于ARP机制；B：ARP攻击不加密流量，而是靠无认证的地址解析欺骗；C：拦截篡改IP数据包属IP层攻击描述，不是ARP利用方式。","source":"TCP/IP协议安全（ARP地址解析协议无认证缺陷，RFC 826）","keyPoint":"ARP攻击＝伪造ARP报文污染缓存，做中间人/断网。"},{"id":"第二部分专业题-二、密码前沿技术-单选题-69","no":69,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"Grover 算法对对称密码安全强度的影响是（ ）","options":[{"key":"A","text":"使对称密码完全失效"},{"key":"B","text":"使对称密码的有效密钥长度减半"},{"key":"C","text":"对对称密码没有任何影响"},{"key":"D","text":"使对称密码的有效密钥长度加倍"}],"answer":"B","analysis":"Grover算法对密钥穷举实现平方级加速，把2的n次方次搜索降为约2的n/2次方，等价于把对称密钥的有效长度砍掉一半。所以AES-128的量子安全强度相当于64位，实际部署常建议AES-256来维持128位安全。它不会让对称密码“完全失效”，也不是毫无影响，更不会让密钥长度加倍。本题是量子威胁中与Shor题配套的必考点。","correctReason":"Grover将密钥搜索复杂度由O(2^n)降为O(2^(n/2))，等效于有效密钥长度减半。","wrongReason":"A：并非完全失效，只是安全强度平方根级下降，加长密钥仍可安全；C：有明确影响，不能忽略；D：是减半而非加倍，加倍方向说反了。","source":"Grover算法（1996）及NIST后量子密码迁移相关评估文件","keyPoint":"Grover＝平方根加速，对称密钥有效长度减半。"},{"id":"第二部分专业题-二、密码前沿技术-单选题-70","no":70,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"在量子通信领域，为了实现信息的绝对安全传输，通常采用（ ）。","options":[{"key":"A","text":"量子隐形状态，无需物理介质，通过量子纠缠实现"},{"key":"B","text":"单个光子，通过超低损耗的单模光纤传输"},{"key":"C","text":"经典电磁波，通过光纤传输"},{"key":"D","text":"纠缠态量子比特，通过自由空间（如大气层）传输"}],"answer":"A","analysis":"本题从“绝对安全传输”这一表述出发，指向量子隐形传态：借助预先分发的量子纠缠对，把未知量子态的信息传递到远处，传输过程不依赖传递实物量子载体本身。常规QKD工程实现多用单光子经低损耗光纤或自由空间传输，但那属于量子密钥分发链路，与题干“无需物理介质、通过量子纠缠实现”的描述相比不是最贴合项。B、D描述的是具体实现手段，C则是经典通信，不具量子安全性。","correctReason":"量子隐形传态利用量子纠缠实现量子态传输，不发送实物载体，与题干“无需物理介质”的描述相符。","wrongReason":"B：单光子光纤传输是QKD的工程实现方式，仍需物理信道传输光子；C：经典电磁波通信不具备量子力学保障的安全性；D：纠缠态自由空间传输是具体信道方案，仍属有介质传输。","source":"量子信息基础（量子隐形传态，Bennett等1993；量子不可克隆定理）","keyPoint":"隐形传态＝借纠缠传量子态，不传实物载体。"},{"id":"第二部分专业题-二、密码前沿技术-单选题-71","no":71,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"2026 年3 月，谷歌发布的白皮书指出，破解256 位椭圆曲线离散对数问题所 需的物理量子比特数量约为（ ）","options":[{"key":"A","text":"53 个"},{"key":"B","text":"50 万个"},{"key":"C","text":"100 万个"},{"key":"D","text":"1000 个"}],"answer":"C","analysis":"谷歌在2026年3月发布的量子计算白皮书中给出资源估算：破解256位椭圆曲线离散对数问题所需的物理量子比特量级在百万级，即约100万个物理量子比特，同时还需要相应的运行时间与纠错开销。50万、53、1000都明显低于该量级。这道题考的是对量子威胁“何时到来”的数量级直觉：资源门槛极高，但已从科幻走向工程评估。","correctReason":"谷歌2026年3月白皮书的资源估算给出的量级为约100万个物理量子比特。","wrongReason":"A：53个是量子比特数量的极小值，与破解ECDLP所需规模相差多个数量级；B：50万低于白皮书给出的估算量级；D：1000个远不足以支撑256位ECDLP的量子攻击。","source":"Google 2026年3月量子计算白皮书关于破解256位椭圆曲线离散对数的资源估算","keyPoint":"破解256位ECC：谷歌白皮书估算约需百万级物理量子比特。"},{"id":"第二部分专业题-二、密码前沿技术-单选题-72","no":72,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"网络监控工具对于确保组织网络的稳定性、安全性和高效性至关重要。以下 哪一项是网络监控工具在网络故障管理中的作用？（ ）","options":[{"key":"A","text":"预防网络攻击"},{"key":"B","text":"自动修复网络故障"},{"key":"C","text":"限制网络流量"},{"key":"D","text":"检测和报告网络问题"}],"answer":"D","analysis":"网络监控工具的本职是采集流量、设备状态与日志，通过阈值和告警把异常暴露出来，帮助运维定位与处置，因此“检测和报告网络问题”最贴合故障管理定位。它本身不是防护设备，不能预防网络攻击；多数工具不具备自动修复能力，修复仍靠人或自动化运维平台；限流是策略执行功能，不是监控工具的故障管理职责。所以故障管理看的是“发现与报告”，而非阻断与修复。","correctReason":"网络监控工具的核心价值在于发现问题并告警报告，为故障处置提供依据。","wrongReason":"A：预防网络攻击是防火墙、IPS等防护设备的功能；B：自动修复通常需配合自动化运维或编排工具，监控工具本身只报警；C：限制网络流量属于流量策略控制，不是故障管理作用。","source":"网络管理与运维实践（网络监控/网管系统功能定位）","keyPoint":"监控工具＝发现并告警，不负责防御与自动修复。"},{"id":"第二部分专业题-二、密码前沿技术-单选题-73","no":73,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"在网络安全体系模型WPDRRC（预警、防护、检测、响应、恢复、反击）中， （ ）使用的技术包括安全套接层（SSL）流量分析、日志分析和审计等。","options":[{"key":"A","text":"预警"},{"key":"B","text":"防护"},{"key":"C","text":"检测"},{"key":"D","text":"响应"}],"answer":"C","analysis":"WPDRRC模型把安全能力分为预警、防护、检测、响应、恢复、反击六个环节。SSL流量分析、日志分析与审计都是通过采集和分析信息来发现异常行为，属于“检测”环节。预警侧重威胁情报与趋势预判，防护侧重加密、访问控制、防火墙等阻断手段，响应侧重处置与隔离。区分点在于：先发现、后处置，发现归检测。","correctReason":"SSL流量分析、日志分析与审计均用于发现异常，属于WPDRRC中的检测环节。","wrongReason":"A：预警依赖威胁情报与风险评估做前瞻判断，不含流量与日志审计手段；B：防护是加密、访问控制、边界防护等阻断性措施；D：响应是事件处置、隔离与恢复动作，发生在检测之后。","source":"WPDRRC网络安全体系模型（预警、防护、检测、响应、恢复、反击）","keyPoint":"流量分析＋日志审计＝WPDRRC的“检测”环节。"},{"id":"第二部分专业题-二、密码前沿技术-单选题-74","no":74,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"大数据技术架构主要包含大数据获取技术、分布式数据处理技术和大数据管 理技术，以及大数据应用和服务技术。那么，（ ）主要关注大数据存储、大 数据协同和安全隐私等方面。","options":[{"key":"A","text":"大数据获取技术"},{"key":"B","text":"分布式数据处理技术"},{"key":"C","text":"大数据管理技术"},{"key":"D","text":"大数据应用和服务技术"}],"answer":"C","analysis":"大数据技术架构中，大数据获取技术解决数据采集与接入，分布式数据处理技术解决计算与作业调度，大数据应用和服务技术面向业务提供分析与服务。而大数据存储、数据协同以及安全隐私保护属于数据全生命周期治理，是“大数据管理技术”的职责范围。抓住“存储＋协同＋安全隐私”这组关键词即可锁定管理技术。","correctReason":"大数据存储、协同与安全隐私保护属于数据治理范畴，归大数据管理技术。","wrongReason":"A：大数据获取技术解决数据采集与汇聚；B：分布式数据处理技术解决并行计算与作业调度；D：大数据应用和服务技术面向业务分析与服务交付。","source":"大数据技术架构（获取、分布式处理、管理、应用与服务四分法）","keyPoint":"存储＋协同＋安全隐私＝大数据管理技术。"},{"id":"第二部分专业题-二、密码前沿技术-单选题-75","no":75,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"在由安全机制、OSI 网络参考模型、安全服务三个轴构成的信息安全系统三 维空间中，安全机制轴涵盖了用于实现信息安全的各种技术手段和方法，包括基 础设施安全、平台安全、数据安全、应用安全等，其中操作系统漏洞检测与修复 属于（ ）。","options":[{"key":"A","text":"基础设施安全"},{"key":"B","text":"平台安全"},{"key":"C","text":"数据安全"},{"key":"D","text":"应用安全"}],"answer":"B","analysis":"信息安全系统三维空间把安全机制分为基础设施安全、平台安全、数据安全、应用安全等层面。平台安全落在操作系统、数据库、中间件等支撑软件上，操作系统漏洞的检测与修复正属于平台安全范畴。基础设施安全指机房、网络链路与硬件环境；数据安全关注数据本身的保密、完整与可用；应用安全面向业务应用系统。按“机制作用于哪一层”定位即可。","correctReason":"操作系统属于支撑平台软件，其漏洞检测与修复归入平台安全。","wrongReason":"A：基础设施安全针对物理环境、网络与硬件设施；C：数据安全针对数据的存储、传输与使用保护；D：应用安全针对业务应用系统的安全设计与防护。","source":"信息安全系统三维空间模型（安全机制／OSI参考模型／安全服务）","keyPoint":"操作系统、数据库、中间件层的安全＝平台安全。"},{"id":"第二部分专业题-二、密码前沿技术-单选题-76","no":76,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"关于量子计算对数据安全的影响，以下说法错误的是（ ）","options":[{"key":"A","text":"量子计算机可能使RSA 等传统公钥加密算法失效"},{"key":"B","text":"“先存储、后解密”策略使长期敏感数据面临现实安全风险"},{"key":"C","text":"对称加密算法（如AES）完全不受量子计算影响"},{"key":"D","text":"部署抗量子密码是守护数字安全的必然选择"}],"answer":"C","analysis":"本题选“错误”的说法。Shor算法确实可能使RSA等公钥体制失效，“先存储、后解密”让今天被截获的长期敏感数据在未来被回溯破解，部署抗量子密码也是公认方向，这三项都成立。真正错误的是“AES完全不受量子计算影响”：Grover算法带来平方根级加速，AES-128的量子强度降到约64位，需靠加长密钥应对。","correctReason":"对称加密并非完全不受影响，Grover算法使其有效安全强度平方根级下降，故该表述错误。","wrongReason":"A：该说法正确，Shor算法确实能破解RSA等公钥算法，不是本题要选的错误项；B：该说法正确，“先存储、后解密”是真实存在的长期数据风险；D：该说法正确，抗量子密码迁移是业界共识方向。","source":"Shor/Grover算法结论及NIST后量子密码迁移评估文件","keyPoint":"“对称密码完全不受量子影响”是错的：Grover使其强度折半。"},{"id":"第二部分专业题-二、密码前沿技术-单选题-77","no":77,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"可信计算的安全机制旨在通过硬件和软件的结合，提供一个安全的基础环境， 确保计算机系统的安全性、数据的完整性和用户的隐私。以下关于可信计算的安 全机制的描述，正确的是（ ）。","options":[{"key":"A","text":"可信计算可增强身份验证和攻击防御能力，但对物联网设备的安全性没有帮助"},{"key":"B","text":"可信计算的安全机制主要依赖于软件实现，硬件部分并不重要"},{"key":"C","text":"可信计算的安全机制包括高速固态硬盘，以提高数据读写速度和安全性"},{"key":"D","text":"平台配置寄存器用于存储系统组件的完整性度量值，便于后续验证系统状态"}],"answer":"D","analysis":"可信计算的核心是可信根与信任链：以TPM/TCM等硬件安全模块为根，逐级度量并扩展存储到平台配置寄存器（PCR），形成可验证的系统状态，因此“PCR存储完整性度量值供后续验证”表述正确。可信计算恰恰依赖硬件根，不是纯软件；它可延伸到物联网、工控等场景；固态硬盘是存储性能部件，与可信安全机制不是一回事。判断这类题就看是否围绕可信根、度量与验证展开。","correctReason":"平台配置寄存器（PCR）用于保存系统组件的完整性度量值，是可信计算验证系统状态的基础。","wrongReason":"A：可信计算同样可增强物联网设备安全，说“没有帮助”不成立；B：可信计算依赖TPM/TCM等硬件可信根，硬件恰恰是关键；C：高速固态硬盘属于存储部件，不属于可信计算安全机制。","source":"可信计算技术规范（TPM/TCM平台配置寄存器PCR机制，GB/T 29829系列）","keyPoint":"PCR存完整性度量值，信任链由可信根逐级度量。"},{"id":"第二部分专业题-二、密码前沿技术-单选题-78","no":78,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"在对信息安全风险进行分析和评估之后，还必须思考如何应对风险，应对风 险的方式通常可分为风险规避、风险降低、风险转移、风险持有四种方式，以下 方式属于风险转移的是（ ）。","options":[{"key":"A","text":"安装杀毒软件"},{"key":"B","text":"决定接受由于使用老旧但稳定的系统而带来的潜在安全威胁"},{"key":"C","text":"购买网络安全保险以覆盖数据泄露的潜在损失"},{"key":"D","text":"停止使用某项存在高安全风险的技术或服务"}],"answer":"C","analysis":"风险处置四方式中，风险转移是把损失后果转由第三方承担，购买网络安全保险、外包安全服务都属此类。安装杀毒软件属于降低风险发生概率与影响，即风险降低；接受老旧系统的潜在威胁是风险持有（接受）；停用高风险技术或服务则是风险规避。本题只需把选项与四种处置方式一一对上。","correctReason":"购买网络安全保险把数据泄露的损失后果转由保险公司承担，属风险转移。","wrongReason":"A：安装杀毒软件是降低风险的措施，属风险降低；B：明知威胁仍接受属于风险持有；D：停用高风险技术或服务属于风险规避。","source":"信息安全风险管理（GB/T 24364-2009《信息安全技术 信息安全风险管理指南》风险处置方式）","keyPoint":"买保险＝风险转移；杀毒＝降低；接受＝持有；停用＝规避。"},{"id":"第二部分专业题-二、密码前沿技术-单选题-79","no":79,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"量子计算机成熟后，以下哪类加密算法被认为最可能首先失去防护能力？ （ ）","options":[{"key":"A","text":"AES 对称加密算法"},{"key":"B","text":"RSA 和ECC 等传统公钥加密算法"},{"key":"C","text":"哈希算法"},{"key":"D","text":"流密码算法"}],"answer":"B","analysis":"量子计算机对公钥密码的打击是结构性的：Shor算法可多项式时间求解大整数分解和离散对数，RSA、ECC、DH这类体制会被直接攻破，因此最先失去防护能力。对称的AES和流密码只承受Grover带来的平方根级削弱，加长密钥即可维持安全；杂凑算法同样只是强度折半。分清“被攻破”和“被削弱”是本题的核心。","correctReason":"RSA、ECC的安全性建立在大整数分解与离散对数难题上，恰为Shor算法可高效求解的问题。","wrongReason":"A：AES属对称加密，仅受Grover平方根级削弱，加长密钥仍安全；C：哈希算法受量子影响有限，且不存在被直接攻破的情形；D：流密码同属对称密码，可通过加长密钥维持安全强度。","source":"Shor算法对公钥密码的威胁分析及NIST后量子密码标准化文件","keyPoint":"公钥（RSA/ECC）被Shor攻破，对称与杂凑只是被削弱。"},{"id":"第二部分专业题-二、密码前沿技术-单选题-80","no":80,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"关于区块链的“51%攻击”，以下哪项描述是正确的？ （ ）","options":[{"key":"A","text":"攻击者需要控制全网超过51%的算力，才能双花攻击或阻止交易确认"},{"key":"B","text":"攻击者需要控制全网超过51%的节点数量，才能篡改已确认的历史区块"},{"key":"C","text":"51%攻击成功后，攻击者可以随意修改其他用户的私钥和资产余额"},{"key":"D","text":"51%攻击在PoS（权益证明）机制中完全不存在，因为PoS 不依赖算力"}],"answer":"A","analysis":"51%攻击的前提是掌握超过全网一半的算力，攻击者可据此抢先出块，实现双花或压制交易确认；但受限于不能伪造签名，他无法盗取他人资产，也无法随意改写久远历史。用节点数量占比描述是概念混淆，那是Sybil攻击的语境。PoS机制下对应概念是持有超过半数权益（如51%质押），威胁并未消失，只是资源形式从算力变为权益。","correctReason":"掌握超过51%算力者可主导最长链，从而实施双花或阻止交易确认。","wrongReason":"B：51%指算力（或权益）占比，不是节点数量占比；C：攻击者无法伪造私钥签名，不能修改他人资产余额；D：PoS中同样存在51%权益攻击（如长程攻击），并非完全不存在。","source":"区块链共识安全（PoW最长链原则与51%算力攻击）","keyPoint":"51%＝算力过半→双花/压制确认，但改不了他人私钥。"},{"id":"第二部分专业题-二、密码前沿技术-单选题-81","no":81,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"某大型金融机构的首席信息安全官正在评估量子计算对现有密码体系的威 胁。他在内部报告中指出：“量子计算对非对称密码和对称密码的威胁机制完全 不同。”以下关于量子计算对不同类型密码算法威胁的描述中，正确的是（ ）","options":[{"key":"A","text":"Shor 算法可破解RSA 和ECC，但对AES 等对称密码无任何影响"},{"key":"B","text":"Grover 算法可将对称密码的密钥搜索复杂度从O（2ⁿ）降为O（2ⁿ/²），使有效密 钥长度减半"},{"key":"C","text":"Shor 算法和Grover 算法均可破解非对称密码，但对对称密码均无效"},{"key":"D","text":"Grover 算法可破解RSA 和ECC，Shor 算法可削弱AES 的安全性"}],"answer":"B","analysis":"两类密码面对的是不同的量子算法：Shor算法求大整数分解与离散对数，直接瓦解RSA、ECC等非对称体制；Grover算法是通用搜索的平方根加速，把对称密码密钥穷举从O(2^n)降到O(2^(n/2))，相当于有效密钥长度减半，靠AES-256等长密钥应对。A项说“无任何影响”过于绝对，C项把两种算法作用对象混淆，D项把两者分工完全说反。记忆口诀是：Shor管公钥、Grover管对称。","correctReason":"Grover算法将对称密钥搜索复杂度由O(2^n)降为O(2^(n/2))，等效使有效密钥长度减半。","wrongReason":"A：Grover对AES仍有削弱作用，说“无任何影响”不准确；C：Shor破非对称、Grover削对称，并非两者都只针对非对称；D：作用对象说反了，Grover不破RSA/ECC，Shor也不直接破AES。","source":"Shor算法（1994）与Grover算法（1996）的威胁模型对比","keyPoint":"Shor→非对称；Grover→对称减半。两者分工不可混淆。"},{"id":"第二部分专业题-二、密码前沿技术-单选题-82","no":82,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"区块链网络中，以下哪种攻击利用的是“交易延展性”漏洞？ （ ）","options":[{"key":"A","text":"Sybil 攻击"},{"key":"B","text":"粉尘攻击"},{"key":"C","text":"交易ID 篡改攻击（如早期比特币中的交易延展性攻击）"},{"key":"D","text":"重放攻击"}],"answer":"C","analysis":"交易延展性指攻击者不改动交易实质内容，却能改变交易ID（早期比特币中通过修改签名脚本编码即可做到），导致按原交易ID追踪的确认失效，常被用于欺骗交易所重复提币。Sybil攻击靠伪造大量身份影响网络，粉尘攻击靠小额转账做地址关联分析，重放攻击是把一条链上的有效交易拿到另一条链上再次生效。三者与延展性漏洞成因不同。","correctReason":"交易ID篡改攻击正是利用签名与交易ID可被重新编码的延展性缺陷。","wrongReason":"A：Sybil攻击是伪造大量节点身份影响共识或网络；B：粉尘攻击靠小额转账进行地址聚类与隐私分析；D：重放攻击是跨链或跨环境重复提交同一笔有效交易。","source":"区块链安全（比特币交易延展性漏洞与BIP 62/隔离见证修复）","keyPoint":"延展性＝改交易ID不改实质，对应交易ID篡改攻击。"},{"id":"第二部分专业题-二、密码前沿技术-单选题-83","no":83,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"某政务云平台计划将核心业务系统从RSA-2048 证书迁移至抗量子密码算法。 安全团队在技术选型会议上讨论：“Shor 算法对经典公钥密码构成了根本性威胁， 其核心能力在于高效求解哪类数学问题？”以下选项正确的是（ ）","options":[{"key":"A","text":"大整数分解和离散对数问题"},{"key":"B","text":"格上的最短向量问题"},{"key":"C","text":"随机线性码的译码问题"},{"key":"D","text":"多变量二次方程求解问题"}],"answer":"A","analysis":"Shor算法的核心是量子傅里叶变换，能在多项式时间内求解大整数分解与离散对数问题，所以它能同时威胁RSA（分解）和ECC、DH（离散对数），这也是政务云把RSA-2048证书迁移到抗量子算法的直接动因。格上最短向量问题、随机线性码译码问题、多变量二次方程求解问题都是后量子密码所依赖的困难问题，恰恰是“用来抵抗Shor”的那一侧。迁移抗量子算法，正是为了换掉被Shor威胁的这两类困难问题。","correctReason":"Shor算法可高效求解大整数分解与离散对数问题，这是RSA和ECC的安全性根基。","wrongReason":"B：格上最短向量问题是格基后量子密码的困难基础，Shor算法不能高效求解；C：随机线性码译码问题是码基后量子密码的基础；D：多变量二次方程求解问题是多变量后量子密码的基础。","source":"Shor算法（1994）及后量子密码困难问题分类（NIST PQC标准化文件）","keyPoint":"Shor解两类难题：大整数分解＋离散对数。"},{"id":"第二部分专业题-二、密码前沿技术-单选题-84","no":84,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"智能合约安全中，“重入攻击”（Reentrancy）的典型防御措施是？（ ）","options":[{"key":"A","text":"使用require 检查调用者余额"},{"key":"B","text":"先更新合约内部状态，再调用外部合约"},{"key":"C","text":"使用assert 确保交易Gas 充足"},{"key":"D","text":"限制合约调用的次数上限"}],"answer":"B","analysis":"重入攻击的成因是合约在完成内部状态更新之前就调用了外部合约，攻击者在回调中再次进入同一函数，反复执行提款逻辑。经典防御是遵循“检查—生效—交互”顺序：先校验条件、再更新内部状态（如把余额清零），最后才进行外部转账调用。require检查余额只是条件校验，assert与Gas相关，限制调用次数并不能阻止递归重入。","correctReason":"先更新内部状态再调用外部合约，可使重入时的余额判断已失效，从而阻断重入链条。","wrongReason":"A：require检查余额只是常规校验，无法阻止同一函数被递归重入；C：assert用于断言与Gas检查，与重入防护无关；D：限制调用次数并不能消除重入路径，也不适用于正常业务。","source":"智能合约安全（重入攻击与Checks-Effects-Interactions模式，以太坊Solidity安全最佳实践）","keyPoint":"防重入：先改状态，后做外部调用（CEI顺序）。"},{"id":"第二部分专业题-二、密码前沿技术-单选题-85","no":85,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"关于区块链节点之间的P2P 网络，以下哪种安全威胁最为直接相关？（ ）","options":[{"key":"A","text":"SQL 注入"},{"key":"B","text":"Eclipse 攻击（日蚀攻击）"},{"key":"C","text":"XSS 跨站脚本攻击"},{"key":"D","text":"缓冲区溢出"}],"answer":"B","analysis":"Eclipse攻击（日蚀攻击）正是针对P2P层的威胁：攻击者用大量恶意节点占满目标的连接槽，把受害节点与诚实网络隔离，使其看到的是攻击者伪造的视图，从而实施双花、分叉或算力浪费。SQL注入、XSS、缓冲区溢出都属于应用层或系统层的经典漏洞，与P2P网络拓扑隔离这一威胁场景不对应。P2P层的防御重点是连接管理与节点多样性。","correctReason":"Eclipse攻击通过占满节点连接、隔离目标与真实网络的通信，直接作用于P2P网络层。","wrongReason":"A：SQL注入是Web应用与数据库层漏洞；C：XSS是浏览器端脚本注入漏洞；D：缓冲区溢出是程序与系统层内存安全漏洞，均与P2P拓扑无关。","source":"区块链P2P网络安全（Eclipse Attack研究，Heilman等2015）","keyPoint":"P2P层最直接威胁＝Eclipse（日蚀）攻击，隔离节点视野。"},{"id":"第二部分专业题-二、密码前沿技术-单选题-86","no":86,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"某密码学会议上，一位专家在报告中指出：“量子保密通信的安全性保障机制 与经典密码完全不同。”以下关于量子保密通信（量子密钥分发，QKD）安全性 来源的描述中，正确的是（ ）","options":[{"key":"A","text":"其安全性基于大整数分解的计算复杂性"},{"key":"B","text":"其安全性基于离散对数的计算困难性"},{"key":"C","text":"其安全性基于量子力学基本原理，如未知量子态不可克隆定理和海森堡不确 定性原理"},{"key":"D","text":"其安全性基于格上最短向量问题的求解困难性"}],"answer":"C","analysis":"QKD的安全性不建立在任何计算难题之上，而由量子力学基本原理保证：未知量子态不可克隆定理让窃听者无法完美复制密钥载体，海森堡不确定性原理使任何测量都会扰动量子态，从而在误码率上留下痕迹并被合法双方发现。A、B、D分别指向大整数分解、离散对数和格上最短向量问题，都是经典或后量子密码的计算困难假设，与QKD的安全根基无关。抓住“安全性来自物理原理而非计算假设”即可排除三项。","correctReason":"QKD依靠不可克隆定理与不确定性原理等量子力学基本原理保证窃听可被发现，而非计算复杂性。","wrongReason":"A：大整数分解是RSA类经典公钥密码的安全基础；B：离散对数是ECC/DH类密码的基础；D：格上最短向量问题是格基后量子密码的困难假设。","source":"量子密钥分发原理（BB84协议，Bennett与Brassard 1984；不可克隆定理）","keyPoint":"QKD安全来自量子力学原理，不靠计算困难性。"},{"id":"第二部分专业题-二、密码前沿技术-单选题-87","no":87,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"某区块链网络要求每笔交易必须经过哈希计算、数字签名和共识验证。用户A 向用户B 转账时，攻击者截获交易数据并修改了转账金额，但交易最终被网络 拒绝。已知该区块链采用SHA256 哈希算法和椭圆曲线数字签名（ECDSA）。 以 下哪一环节直接导致攻击者的篡改行为失效？ （ ）","options":[{"key":"A","text":"哈希值校验失败，因修改金额后原哈希值不匹配"},{"key":"B","text":"数字签名验证失败，因私钥未泄露，签名无法伪造"},{"key":"C","text":"共识节点发现交易哈希与区块内容不一致"},{"key":"D","text":"网络层加密传输阻止了中间人攻击"}],"answer":"B","analysis":"攻击者改动转账金额后，交易内容已与原签名所绑定的数据不一致，其他节点用A的公钥验签必然失败，而攻击者没有A的私钥，无法为新内容生成有效签名，所以交易被拒。这就是数字签名“不可伪造＋绑定内容”的作用：它不只发现改动，更从机制上杜绝了改动后的重新授权。哈希校验只能发现不一致，共识与传输加密都不解决签名伪造问题，因此直接导致篡改失效的是签名验证。","correctReason":"ECDSA签名与交易内容绑定，内容被改则验签失败，且攻击者无私钥无法伪造新签名。","wrongReason":"A：哈希校验能发现不一致，但哈希本身可被重算，不是防伪造的根本环节；C：共识节点发现不一致是结果而非直接失效原因；D：加密传输只防止链路窃听，攻击者已获得数据后不再起作用。","source":"GB/T 32918《SM2椭圆曲线公钥密码算法》数字签名机制（同类ECDSA签名原理）","keyPoint":"篡改交易失效的直接原因是签名验证失败（私钥不可伪造）。"},{"id":"第二部分专业题-二、密码前沿技术-单选题-88","no":88,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"区块链概念可以理解为是以（ ）为基础，使用共识机制、点对点网络、智 能合约等技术结合而成的一种分布式存储数据库技术。","options":[{"key":"A","text":"量子加密算法"},{"key":"B","text":"非对称加密算法"},{"key":"C","text":"对称密码算法"},{"key":"D","text":"哈希算法"}],"answer":"B","analysis":"区块链用非对称密码实现账户体系与交易授权：私钥签名、公钥（地址）验签，解决“谁有权动用这笔资产”的问题；哈希算法用于区块链接与数据完整性，共识机制、P2P网络、智能合约则在非对称密码提供的信任基础上协同工作。因此其密码学基础是非对称加密算法，而不是量子加密、对称密码或单纯的哈希。做题时可从“账户与授权靠什么”这一角度切入。","correctReason":"区块链的账户、签名与交易授权均基于非对称加密算法构建。","wrongReason":"A：量子加密尚非区块链的基础技术；C：对称密码用于部分加密场景，但不构成账户与签名体系基础；D：哈希算法负责链接与完整性，不是题干所述整体基础。","source":"区块链技术基础（非对称密码实现数字签名与账户体系）","keyPoint":"区块链密码基石＝非对称加密（私钥签名、公钥验签）。"},{"id":"第二部分专业题-二、密码前沿技术-单选题-89","no":89,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"区块链技术通过其去中心化、不可篡改性和透明性等特性，为网络安全提供 了新的解决方案。以下关于区块链技术特性的描述，正确的是（ ）。","options":[{"key":"A","text":"透明性使得区块链上的所有用户信息都是公开可见的"},{"key":"B","text":"区块链的去中心化特性使得它比传统系统更慢"},{"key":"C","text":"不可篡改性保证了区块链上的数据绝对安全"},{"key":"D","text":"去中心化使得区块链网络不易受到单点故障的影响"}],"answer":"D","analysis":"去中心化意味着数据与服务由众多节点共同维护，没有唯一中心，因此单个节点或机房故障不会导致全网瘫痪，抗单点故障能力显著增强，D正确。透明性指交易记录对参与者可查，但用户身份是化名而非实名公开，说“所有用户信息都公开可见”是夸大；去中心化确实常带来性能开销，但把它定义为“比传统系统更慢”不严谨；不可篡改是极难篡改而非绝对安全。本题用“绝对”“所有”“更慢”这类绝对化表述即可快速排除三项。","correctReason":"数据由多节点冗余维护，不存在单一失效点，故去中心化使网络不易受单点故障影响。","wrongReason":"A：透明性是交易可查、可验证，用户身份并非全部公开；B：效率与共识设计相关，不能一概断言比传统系统更慢；C：不可篡改性只保证极难篡改，不等于数据绝对安全（私钥泄露、合约漏洞仍会致损）。","source":"区块链技术特性（去中心化、不可篡改、透明性与单点故障抗性）","keyPoint":"去中心化→无单点故障；不可篡改≠绝对安全。"},{"id":"第二部分专业题-二、密码前沿技术-单选题-90","no":90,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"公有链与私有链的主要区别是（ ）。","options":[{"key":"A","text":"公有链使用智能合约，而私有链不使用智能合约"},{"key":"B","text":"公有链更安全，而私有链更高效"},{"key":"C","text":"公有链使用密码学加密算法，而私有链不使用加密算法"},{"key":"D","text":"公有链可以被任何人参与，而私有链仅限于特定的参与者"}],"answer":"D","analysis":"公有链与私有链的根本分野在准入：公有链任何人无需许可即可加入、读取、发起交易并参与共识；私有链的记账与访问权限限定在特定组织或联盟成员内部，属于许可链。两者都可能使用智能合约，也都要用密码算法保证安全，区别不在“用不用”，而在参与范围与准入控制。“公有链更安全、私有链更高效”只是常见倾向，不能作为定义性区别。","correctReason":"主要区别在于参与权限：公有链开放给任何人，私有链仅限特定参与者。","wrongReason":"A：私有链同样可以部署智能合约；B：安全性高低取决于实现，不是定义性区别；C：私有链同样使用密码学与加密算法，并非不用加密。","source":"区块链分类标准（公有链、联盟链、私有链的准入机制区别）","keyPoint":"公有链与私有链的分水岭＝准入权限是否开放。"},{"id":"第二部分专业题-二、密码前沿技术-单选题-91","no":91,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"区块链中的零知识证明（ZeroKnowledgeProof）用于解决什么问题（ ）。","options":[{"key":"A","text":"隐私保护"},{"key":"B","text":"数据完整性验证"},{"key":"C","text":"交易速度优化"},{"key":"D","text":"分布式网络安全"}],"answer":"A","analysis":"零知识证明让证明者在不泄露任何额外信息的前提下向验证者证明自己知道某个秘密或某命题为真，落到区块链上就是把交易金额、账户余额、参与方身份等敏感信息隐藏起来仍能被网络验证，从而解决隐私保护问题。数据完整性更多由哈希与共识保障，交易速度优化靠扩容与二层方案，分布式网络安全靠P2P与共识机制，都不是零知识证明的主要用途。在区块链隐私场景中，它常与zk-SNARKs、zk-STARKs等方案配套使用。","correctReason":"零知识证明在不泄露秘密的前提下完成验证，用于隐藏交易细节、保护链上隐私。","wrongReason":"B：数据完整性验证主要由哈希算法和共识机制实现；C：交易速度优化依赖扩容、分片与二层网络等技术；D：分布式网络安全由P2P网络与共识机制保障，与零知识证明无关。","source":"零知识证明原理（Goldwasser、Micali、Rackoff 1985）及区块链隐私保护应用（如zk-SNARKs）","keyPoint":"零知识证明用于链上隐私保护：可验证但不泄露信息。"},{"id":"第二部分专业题-二、密码前沿技术-单选题-92","no":92,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"区块链浏览器就是区块链技术的可视化，专门为用户提供（ ）。","options":[{"key":"A","text":"加入区块链网络的入口"},{"key":"B","text":"区块链技术介绍"},{"key":"C","text":"查询用户身份信息"},{"key":"D","text":"查询区块链上信息"}],"answer":"D","analysis":"区块链浏览器把链上数据做成可读的网页界面，核心功能是按地址、交易哈希、区块高度等条件检索浏览链上公开记录，因此它提供的是\"查询区块链上信息\"。链上数据本身对所有节点公开可查，浏览器只是做了可视化呈现与检索索引，并不承担准入或身份核验职责。","correctReason":"区块链浏览器的定位就是链上数据的可视化查询工具，向用户提供交易、区块、地址等链上信息的检索与展示。","wrongReason":"A：接入区块链网络靠客户端节点同步与钱包配置，浏览器不是入网入口；B：介绍技术原理属于科普文档或教程，不是浏览器的功能定位；C：用户身份信息并不上链公开，浏览器也无从查询身份信息。","source":"区块链基础概念（无对应法条）","keyPoint":"区块链浏览器＝链上信息公开查询与可视化检索工具"},{"id":"第二部分专业题-二、密码前沿技术-单选题-93","no":93,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"BB84 协议是最早的量子密钥分发协议之一，由Bennett 和Brassard 于哪一年 提出，其信息编码载体是什么？（ ）","options":[{"key":"A","text":"1994 年，利用光子的相位编码信息"},{"key":"B","text":"1984 年，利用光子的偏振状态编码信息"},{"key":"C","text":"1996 年，利用量子纠缠编码信息"},{"key":"D","text":"2016 年，利用量子比特的叠加态编码信息"}],"answer":"B","analysis":"BB84 由 Bennett 与 Brassard 在 1984 年提出，名字里的 84 正是年份。它用单光子的偏振态（如水平/垂直、+45°/−45° 两组共轭基）承载比特，接收方随机选基测量，事后比对基序列筛出原始密钥，再通过误码率估计发现窃听。这一协议奠定了量子密钥分发（QKD）的基本范式。","correctReason":"BB84 于 1984 年提出，采用单光子偏振状态编码信息，靠量子不可克隆与测量扰动保证窃听可被发现。","wrongReason":"A：1994 年是 Shor 算法提出的年份，且相位编码是后续协议（如 B92 的变体、相位编码 QKD 方案）的思路；C：1996 年不对应 BB84，量子纠缠编码属于 E91 等纠缠类协议；D：2016 年不对应 BB84，且叠加态是量子比特的一般描述，并非该协议的编码方式。","source":"量子密钥分发 BB84 协议（Bennett & Brassard, 1984）","keyPoint":"BB84＝1984 年＋单光子偏振态编码，窃听必留痕"},{"id":"第二部分专业题-二、密码前沿技术-单选题-94","no":94,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"依据《生成式人工智能服务管理暂行办法》，推动生成式人工智能基础设施 和公共训练数据资源平台建设，鼓励采用（ ）的芯片、软件、工具、算力和 数据资源。","options":[{"key":"A","text":"高性能"},{"key":"B","text":"自主研发"},{"key":"C","text":"高能耗效率"},{"key":"D","text":"安全可信"}],"answer":"D","analysis":"本题考查《生成式人工智能服务管理暂行办法》关于产业发展的鼓励性条款。该条在推动基础设施与公共训练数据资源平台建设、促进算力协同共享之后，明确鼓励采用\"安全可信\"的芯片、软件、工具、算力和数据资源。立法用意是让产业链上下游优先选择通过检测认证、来源可靠、风险可控的基础软硬件。","correctReason":"该办法明确鼓励采用安全可信的芯片、软件、工具、算力和数据资源，与选项表述完全一致。","wrongReason":"A：\"高性能\"是性能指标，法条强调的落脚点是安全可信而非性能；B：法条另有条款鼓励算法、框架、芯片及配套软件平台等基础技术自主创新，本句并未用\"自主研发\"限定；C：\"高能耗效率\"不是法条用语，属于无关指标。","source":"《生成式人工智能服务管理暂行办法》第六条","keyPoint":"生成式AI基础软硬件导向：安全可信优先"},{"id":"第二部分专业题-二、密码前沿技术-单选题-95","no":95,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"依据《网络安全标准实践指南——OpenClaw 类智能体部署使用安全指引》， 个人使用者在部署OpenClaw 类智能体时，建议优先选择哪种部署环境？（ ）","options":[{"key":"A","text":"日常使用的终端环境"},{"key":"B","text":"云环境"},{"key":"C","text":"移动设备环境"},{"key":"D","text":"离线环境"}],"answer":"B","analysis":"该类智能体拥有指令执行、文件读写、API 调用等高权限，一旦被攻破可直接接管主机。指引因此建议个人使用者优先把实例放在云端（如云服务器）运行，本地只做远程访问，从而与个人终端和办公环境隔离；确需本地部署时也应用专用设备、虚拟机或容器，并做好网络隔离与最小权限配置。","correctReason":"指引建议个人使用者优先在云环境部署、本地仅远程访问，以便与个人终端和办公环境隔离，降低被攻陷后的影响面。","wrongReason":"A：日常使用终端存有账号、密钥、工作资料，最易被波及，指引明确不宜在此安装运行；C：移动设备同样承载隐私数据且隔离能力弱，不是推荐环境；D：该指引强调的是隔离与远程访问，并非要求断网离线运行，离线并不能替代环境隔离与权限控制。","source":"《网络安全标准实践指南——OpenClaw 类智能体部署使用安全指引》","keyPoint":"智能体部署原则：环境隔离、云端运行、本地只远程访问"},{"id":"第二部分专业题-二、密码前沿技术-单选题-96","no":96,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题（连线）","stem":"随着人工智能技术的快速发展和广泛应用，为企业和个人带来便利的同时， 也为网络安全领域带来了新挑战。请将左侧的AI 技术原理与右侧可能引发的网 络安全威胁进行正确匹配：（ ） 技术原理 安全威胁","options":[{"key":"A","text":"1-A；2-C；3-D；4-B"},{"key":"B","text":"1-B；2-D；3-A；4-C"},{"key":"C","text":"1-C；2-A；3-B；4-D"},{"key":"D","text":"1-D；2-B；3-C；4-A"}],"answer":"A","analysis":"本题考 AI 技术原理与由其衍生的安全威胁之间的对应关系。梯度反向传播会暴露模型参数和置信度信息，攻击者据此可反推网络结构与权重，形成模型窃取；NLP 预训练模型文本生成能力强，会被用于批量炮制高仿真钓鱼邮件；强化学习策略可解释性低、决策过程不透明，对应黑盒决策不可控；GAN 靠生成器与判别器对抗，能合成逼真音视频，直接支撑深度伪造。易混点是分清生成类（NLP、GAN）与信息泄露类（梯度反传、强化学习黑盒）。","correctReason":"1—A、2—C、3—D、4—B 分别对应梯度反传泄露模型信息导致模型窃取、NLP 强文本生成导致自动化钓鱼邮件、强化学习不可解释导致黑盒决策不可控、GAN 生成逼真音视频导致深度伪造，选项 A 的匹配全部成立。","wrongReason":"B：1—B、2—D、3—A、4—C，把深度伪造配给梯度反向传播、黑盒不可控配给 NLP、模型窃取配给强化学习、钓鱼邮件配给 GAN，生成类与信息泄露类整体颠倒；C：1—C、2—A、3—B、4—D，梯度反传配钓鱼邮件、NLP 配模型窃取、强化学习配深度伪造、GAN 配黑盒不可控，四项全错；D：1—D、2—B、3—C、4—A，同样把四组对应全部打乱，无一成立。","source":"技术类题目无直接法条依据；威胁归类可参考全国网络安全标准化技术委员会《人工智能安全治理框架》（2024）及《互联网信息服务深度合成管理规定》","keyPoint":"梯度反传—模型窃取、NLP—钓鱼邮件、强化学习—黑盒不可控、GAN—深度伪造。","pairs":["1.神经网络梯度反向传播 —— A.模型窃取攻击（ModelStealing）","2.自然语言处理（NLP）预训练 —— B.深度伪造（Deepfake）音频生成","3.强化学习的策略可解释性低 —— C.自动化钓鱼邮件生成","4.生成对抗网络（GAN） —— D.黑盒模型决策过程不可控"]},{"id":"第二部分专业题-二、密码前沿技术-单选题-97","no":97,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"某医疗机构的AI 诊断系统被曝存在模型逆向攻击风险，攻击者可通过多次查 询API 重构训练数据。以下哪种技术组合能最优解决该问题？（ ）","options":[{"key":"A","text":"联邦学习+同态加密"},{"key":"B","text":"差分隐私+API 调用频率限制"},{"key":"C","text":"模型蒸馏+输入数据模糊化"},{"key":"D","text":"生成对抗网络（GAN）+自动渗透测试"}],"answer":"B","analysis":"模型逆向（成员推断/训练数据重构）利用的是\"查询—输出\"这一侧信道：攻击者反复调接口、观察输出差异，逐步反推训练数据。差分隐私在训练环节注入噪声，从数学上限制单条样本对模型输出的影响，使重构出的信息不可归因到个人；调用频率限制则抬高查询成本、压缩可用查询量。两者一内一外配合，正好对症。","correctReason":"差分隐私从训练环节抑制个体信息泄露，频率限制从接口侧削减可用查询次数，组合起来才能有效遏制基于多次查询的数据重构。","wrongReason":"A：联邦学习与同态加密保护的是训练数据不出域和计算隐私，模型照旧提供 API 查询，逆向风险不减；C：模型蒸馏改变的是模型形态，输入模糊化会损害诊断准确率且不构成隐私保证；D：GAN 与渗透测试用于增强攻击面和发现漏洞，与防护数据重构无关。","source":"模型逆向攻击与差分隐私防护技术原理","keyPoint":"防模型逆向：训练侧差分隐私＋接口侧查询限制"},{"id":"第二部分专业题-二、密码前沿技术-单选题-98","no":98,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"某短视频平台上线了一款AI 生成特效工具，用户可用其生成虚拟场景并导出 为视频。根据《人工智能生成合成内容标识办法》，以下哪一做法符合规定？（ ）","options":[{"key":"A","text":"仅在视频末尾添加文字提示“AI 生成”"},{"key":"B","text":"在视频起始画面添加动态水印标识，并在文件元数据中记录平台编码"},{"key":"C","text":"用户导出视频时自动去除所有显式标识以提升观感"},{"key":"D","text":"仅在文件元数据中添加隐式标识，不设置显式标识"}],"answer":"B","analysis":"该办法把标识分为显式与隐式两类：显式标识须以文字、声音、图形等方式呈现且能被用户明显感知，对视频要求在起始画面和播放周边适当位置添加显著提示；隐式标识则在文件元数据的文件数据中添加，包含生成合成属性、服务提供者名称或编码、内容编号等制作要素。合规做法是两类标识同时落实。","correctReason":"在视频起始画面加显著显式标识、在文件元数据写入平台编码等隐式标识，同时满足显式与隐式标识要求。","wrongReason":"A：视频显式标识应在起始画面和播放周边适当位置添加，只在末尾提示不符合要求；C：任何组织和个人不得恶意删除、篡改、伪造、隐匿标识，导出功能还须确保文件含合规显式标识；D：隐式标识是元数据要求，不能替代显式标识，只做隐式同样不合规。","source":"《人工智能生成合成内容标识办法》第四条、第五条、第十条","keyPoint":"标识双轨：显式可感知＋隐式入元数据，二者都要做"},{"id":"第二部分专业题-二、密码前沿技术-单选题-99","no":99,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"某高校实验室研发了一款生成式人工智能模型，仅用于内部学术研究，未向 公众开放服务。根据《生成式人工智能服务管理暂行办法》，该实验室的研发活 动是否适用本办法？（ ）","options":[{"key":"A","text":"适用，因为涉及生成式人工智能技术"},{"key":"B","text":"适用，但可以豁免部分条款"},{"key":"C","text":"不适用，因其未向境内公众提供服务"},{"key":"D","text":"不适用，但需向主管部门备案"}],"answer":"C","analysis":"该办法第二条先界定适用对象为\"利用生成式人工智能技术向中华人民共和国境内公众提供生成文本、图片、音频、视频等内容的服务\"，随后明确行业组织、企业、教育和科研机构、公共文化机构、有关专业机构等研发、应用生成式人工智能技术，未向境内公众提供服务的，不适用本办法。纯内部学术研究不在规制范围内。","correctReason":"该办法适用于向境内公众提供生成式人工智能服务的情形，实验室仅内部研究、未向公众提供服务，故不适用。","wrongReason":"A：判断适用与否看是否向境内公众提供服务，而不只是看是否使用该技术；B：办法没有为内部研究设置\"适用但部分豁免\"的安排，豁免方式是整体不适用；D：备案义务针对提供具有舆论属性或社会动员能力的服务等情形，与本办法是否适用无关。","source":"《生成式人工智能服务管理暂行办法》第二条","keyPoint":"生成式AI办法只管\"向境内公众提供服务\""},{"id":"第二部分专业题-二、密码前沿技术-单选题-100","no":100,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"人工智能（AI）作为一项前沿技术，在提升网络安全防御能力方面展现了巨 大潜力。以下哪项不是AI 在增强网络安全防护中的典型应用场景？（ ）","options":[{"key":"A","text":"恶意软件检测"},{"key":"B","text":"入侵行为分析"},{"key":"C","text":"自动化漏洞扫描"},{"key":"D","text":"电源管理优化"}],"answer":"D","analysis":"AI 在网络安全防护中的典型落点是威胁检测与响应：依托样本学习识别恶意软件变种、通过行为基线发现入侵与横向移动、用自动化扫描与模糊测试提高漏洞发现效率。电源管理优化属于能耗与系统调度领域，虽然可用 AI 优化，但与网络安全防护无关，因此不是该场景下的应用。","correctReason":"恶意软件检测、入侵行为分析、自动化漏洞扫描都是 AI 赋能安全防护的典型场景，电源管理优化不属于网络安全范畴。","wrongReason":"A：恶意软件检测是 AI 模式识别最成熟的安全应用之一；B：入侵行为分析依托异常检测与行为建模，是典型 AI 安全应用；C：自动化漏洞扫描与智能模糊测试显著提升漏洞发现效率，同样属于安全防护场景。","source":"人工智能网络安全应用（通用技术知识）","keyPoint":"AI安全应用＝检测、分析、扫描，不含能耗管理"},{"id":"第二部分专业题-二、密码前沿技术-单选题-101","no":101,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"在反垃圾邮件系统中，AI 通过分析邮件内容语义特征（如钓鱼链接模式、恶 意附件行为、垃圾关键词变体）实现高精度拦截，其最核心的技术基础是（ ）。","options":[{"key":"A","text":"文本分类"},{"key":"B","text":"特征哈希"},{"key":"C","text":"数据脱敏"},{"key":"D","text":"协议过滤"}],"answer":"A","analysis":"反垃圾邮件本质上是一个二分类问题：把邮件文本语义、链接特征、附件行为等抽取成特征向量，训练分类模型输出\"正常/垃圾\"判断，再按阈值拦截，这正是文本分类（含垃圾文本识别）的典型应用。深度学习模型只是在特征表达与分类精度上做了增强，核心任务归属不变。","correctReason":"对邮件内容语义特征作判别并归类为垃圾或正常，本质就是文本分类任务，分类模型是拦截能力的核心基础。","wrongReason":"B：特征哈希只是把高维特征映射到定长向量的降维/存储优化手段，本身不产生判别能力；C：数据脱敏用于保护隐私，与识别垃圾邮件无关；D：协议过滤基于发信协议或端口层面的规则匹配，识别不了语义化的垃圾内容与钓鱼话术。","source":"文本分类与垃圾信息识别技术原理","keyPoint":"反垃圾邮件＝以文本分类为核心的判别任务"},{"id":"第二部分专业题-二、密码前沿技术-单选题-102","no":102,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"依据《网络安全标准实践指南——OpenClaw 类智能体部署使用安全指引》， 未经组织审批、部署、监控与管理，由员工个人在组织终端、服务器或办公环境 中自行安装、运行的智能体实例被称为？（ ）","options":[{"key":"A","text":"独立智能体"},{"key":"B","text":"影子智能体"},{"key":"C","text":"私有智能体"},{"key":"D","text":"临时智能体"}],"answer":"B","analysis":"该指引沿用了业界\"影子IT\"的思路，把员工绕过组织审批，在组织终端、服务器或办公环境中自行安装运行的智能体实例称为影子智能体。这类实例脱离资产台账与安全监控，既有高权限运行、数据外泄风险，也容易成为供应链攻击入口，因此指引要求组织排查、纳管并明确使用红线。","correctReason":"未经审批、监控与管理而由员工个人自行安装运行的智能体实例，指引称为影子智能体。","wrongReason":"A：独立智能体不是该指引的术语，且未体现\"绕过组织管控\"这一核心特征；C：私有智能体强调的是部署归属与数据边界，与是否违规自装无关；D：临时智能体描述的是生命周期长短，不能体现脱离管理的实质。","source":"《网络安全标准实践指南——OpenClaw 类智能体部署使用安全指引》","keyPoint":"影子智能体＝绕过审批私自部署、脱离监控的智能体"},{"id":"第二部分专业题-二、密码前沿技术-单选题-103","no":103,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"根据《智能体规范应用与创新发展实施意见》，智能体被定义为具备自主感 知、记忆、决策、交互与执行能力的智能系统。以下哪项不属于《实施意见》明 确的智能体发展基本原则（ ）","options":[{"key":"A","text":"安全可控"},{"key":"B","text":"规范有序"},{"key":"C","text":"效率优先"},{"key":"D","text":"应用牵引"}],"answer":"C","analysis":"这份《实施意见》在\"基本原则\"部分明确列出四条：坚持安全可控、坚持规范有序、坚持创新驱动、坚持应用牵引。\"效率优先\"并未出现，因为政策取向是安全底线与规范治理先行，在守住安全的前提下鼓励创新和应用落地，而不是单纯以效率为最高准则。","correctReason":"《实施意见》明确的基本原则为安全可控、规范有序、创新驱动、应用牵引，不包含效率优先。","wrongReason":"A：安全可控是首要基本原则，要求把安全可信贯穿研发部署全过程；B：规范有序要求构建与现行法规衔接、底线红线清晰的治理体系；D：应用牵引强调围绕实际需求以典型场景示范带动落地，三者均为文件明列原则。","source":"《智能体规范应用与创新发展实施意见》一、基本原则","keyPoint":"智能体四原则：安全可控、规范有序、创新驱动、应用牵引"},{"id":"第二部分专业题-二、密码前沿技术-单选题-104","no":104,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"AI 具有强大的模式识别和数据分析能力，能够帮助安全系统实现智能化、自 动化的威胁检测与响应。在以下选项中，哪一项是人工智能在网络安全中用于“自 动识别”的典型应用场景？（ ）","options":[{"key":"A","text":"电脑硬件型号"},{"key":"B","text":"异常登录行为"},{"key":"C","text":"软件版本号"},{"key":"D","text":"IP 地址归属地"}],"answer":"B","analysis":"\"自动识别\"指的是从海量行为与日志数据中自动发现偏离正常基线的模式。异常登录行为（异地登录、非常用时段、短时间高频失败后成功等）正是典型的可建模、可告警的行为异常，AI 通过用户与实体行为分析（UEBA）自动识别并触发处置。其余选项属于静态属性查询。","correctReason":"异常登录行为需要从行为数据中自动发现偏离基线的模式，是 AI 用于自动识别的典型安全场景。","wrongReason":"A：硬件型号是设备静态信息，读取即可获得，无需智能识别；C：软件版本号同样是可枚举的静态属性，靠清单比对即可；D：IP 归属地属于数据库查询类信息，与 AI 模式识别无关。","source":"AI 用户与实体行为分析（UEBA）应用场景","keyPoint":"AI自动识别看\"行为异常\"，不看静态属性查询"},{"id":"第二部分专业题-二、密码前沿技术-单选题-105","no":105,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"《智能体规范应用与创新发展实施意见》提出要构建分类分级治理框架。对 于敏感领域及重点行业，由网信部门联合行业主管部门实行备案、检测、问题产 品召回等管理措施；对于部分生活娱乐、日常办公等低风险领域，则主要通过以 下哪种方式实现高效治理（ ）","options":[{"key":"A","text":"事前行政审批"},{"key":"B","text":"全面禁止，待技术成熟后再开放"},{"key":"C","text":"合规自测、信息报告、分发平台管理、行业自律"},{"key":"D","text":"全部交由市场自主调节，无需任何监管"}],"answer":"C","analysis":"《实施意见》提出构建分类分级治理框架：敏感领域和重点行业由网信部门联合行业主管部门确定开放场景，按法律法规与安全防护标准实行备案、检测、问题产品召回等管理；对生活娱乐、日常办公等低风险领域，则通过完善评估测试工具，用合规自测、信息报告、分发平台管理、行业自律等方式实现高效治理。","correctReason":"低风险领域依靠合规自测、信息报告、分发平台管理、行业自律等轻量方式治理，与文件表述一致。","wrongReason":"A：事前行政审批属于强监管手段，只用于敏感领域和重点行业，低风险领域不设事前审批；B：文件强调审慎稳妥、有序推进，不是全面禁止等技术成熟；D：行业自律与平台管理本身就是监管安排，\"无需任何监管\"不符合分类分级治理思路。","source":"《智能体规范应用与创新发展实施意见》三、（三）11.构建分类分级治理框架","keyPoint":"高风险严管（备案检测召回），低风险自律（自测报告平台自律）"},{"id":"第二部分专业题-二、密码前沿技术-单选题-106","no":106,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"为防范智能体安全风险，《智能体规范应用与创新发展实施意见》强调要 提升内生安全能力、加强供应链安全并化解应用衍生风险。以下哪项属于《实施 意见》中提到的防范应用衍生风险的具体措施（ ）","options":[{"key":"A","text":"强制所有智能体必须接入国家统一身份认证平台"},{"key":"B","text":"完善常态化风险识别、预警及干预机制，强化人机协同审核与拦截阻断"},{"key":"C","text":"禁止智能体在公共场所使用，以杜绝潜在风险"},{"key":"D","text":"要求所有智能体开发者将源代码交由监管部门托管"}],"answer":"B","analysis":"《实施意见》在\"防范安全风险\"中对应用衍生风险给出的措施是：完善智能体常态化风险识别、预警及干预机制，强化人机协同审核、拦截阻断等风险处置能力，并避免智能体被用于自动化攻击、隐私侵犯、虚假信息生成传播、网络诈骗等违法活动。其思路是全程监测＋人工把关＋可阻断。","correctReason":"完善常态化风险识别、预警及干预机制，强化人机协同审核与拦截阻断，正是文件针对应用衍生风险列出的措施。","wrongReason":"A：文件未要求所有智能体强制接入国家统一身份认证平台，仅提出探索智能体注册平台、数字身份管理等方向；C：文件规范智能体在公共场所、隐私场所、专门场所的行为合法合规，并非一律禁止使用；D：文件强调供应链安全信息共享与预警，没有源代码强制托管的要求。","source":"《智能体规范应用与创新发展实施意见》三、（二）10.化解应用衍生风险","keyPoint":"化解衍生风险＝常态化识别预警干预＋人机协同审核拦截"},{"id":"第二部分专业题-二、密码前沿技术-单选题-107","no":107,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"某密码学课程讨论量子计算对经典密码体系的威胁程度。以下关于量子计算 威胁的表述中，最准确的是（ ）","options":[{"key":"A","text":"量子计算机将破解所有现有密码，整个互联网安全体系将彻底崩塌"},{"key":"B","text":"量子计算主要威胁RSA.ECC 等非对称密码，对对称密码的威胁相对有限且可 通过增大密钥长度应对"},{"key":"C","text":"量子计算只威胁对称密码，不威胁非对称密码"},{"key":"D","text":"量子计算对密码体系没有任何实质性威胁，只是理论上的担忧"}],"answer":"B","analysis":"Shor 算法能在多项式时间内求解大整数分解与离散对数，因此对 RSA、ECC、DH 等非对称密码构成根本性威胁；Grover 算法对无结构搜索只提供平方根级加速，相当于把对称密钥的有效强度减半、把杂凑的抗碰撞强度降到原来的约三分之二，通过把密钥和摘要长度加倍即可从容应对。所以量子威胁的主战场是非对称密码。","correctReason":"Shor 算法攻破 RSA、ECC 等依赖分解与离散对数的非对称密码，而 Grover 对对称密码只有平方根加速，增大密钥长度即可有效应对。","wrongReason":"A：量子计算并非万能，对称密码与杂凑可存活，\"整个体系彻底崩塌\"属于夸大；C：把威胁方向说反了，受致命威胁的恰恰是非对称密码；D：忽视威胁也不成立，非对称密码确实面临现实风险，各国已在推进抗量子迁移。","source":"Shor 算法与 Grover 算法的密码学影响（通用技术知识）","keyPoint":"Shor 打非对称，Grover 减半对称强度，加长密钥可解"},{"id":"第二部分专业题-二、密码前沿技术-单选题-108","no":108,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"某安全公司正在开发抗量子密码产品，需要为不同安全级别的应用场景选择 合适的算法参数。NIST 标准化的抗量子密码算法都提供了多组不同的参数选项。 以下关于这一设计的理解中，正确的是（ ）","options":[{"key":"A","text":"不同参数可达到不同的安全级别，使用者可根据应用需求选择"},{"key":"B","text":"不同参数仅影响算法运行速度，不影响安全性"},{"key":"C","text":"所有参数的安全性完全相同，只是密钥格式不同"},{"key":"D","text":"参数选择由NIST 强制指定，使用者无权选择"}],"answer":"A","analysis":"NIST 后量子密码标准化项目为同一算法族给出多组参数集，每组对应不同的 NIST 安全强度（如 1、3、5 类，大致对标 AES-128/192/256 的经典安全水平），密钥与密文/签名尺寸、运算开销也随之变化。使用者应按数据的保密期限、设备算力与带宽等约束自行选定参数，标准并不强制唯一取值。","correctReason":"不同参数对应不同安全级别，使用者可按应用的安全需求与性能约束自主选择合适参数集。","wrongReason":"B：参数直接决定安全强度，绝非只影响速度；C：各参数集的安全级别明确不同，并非安全性相同只换密钥格式；D：标准给出可选参数集供选择，不存在由 NIST 强制指定唯一参数的情况。","source":"NIST 后量子密码标准化项目（FIPS 203/204/205 参数集设计）","keyPoint":"PQC 参数集＝多档安全级别，按需选型"},{"id":"第二部分专业题-二、密码前沿技术-单选题-109","no":109,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"某大型企业的安全团队正在评估“迁移到抗量子密码的时间窗口”。团队需要 向管理层解释：为什么不能等到量子计算机真正具备破解能力再开始迁移。以下 关于迁移紧迫性的解释中，正确的是（ ）","options":[{"key":"A","text":"因为量子计算机将在明年就具备破解能力"},{"key":"B","text":"因为向后量子密码学过渡需要数年时间，且“先存储、后解密”已构成现实风 险"},{"key":"C","text":"因为经典密码算法将在明年全部失效"},{"key":"D","text":"因为抗量子密码算法的部署只需要一天时间"}],"answer":"B","analysis":"一是迁移本身是长周期工程：算法替换会牵动协议、证书体系、硬件密码模块、业务系统与互操作测试，通常以数年计。二是\"先存储、后解密\"已是现实威胁：对手今天就可以截获并留存加密数据，等量子计算能力成熟后再回头解密。对于保密期限长达数十年的数据，今天加密今天就可能被收集，因此必须提前启动迁移。","correctReason":"向抗量子密码迁移需要数年时间，而\"先存储、后解密\"意味着今天被截获的密文未来可能被量子计算机解开，所以不能等。","wrongReason":"A：没有任何依据表明量子计算机明年就具备破解能力，属于夸张表述；C：经典密码算法不会在明年全部失效，这种说法同样失真；D：算法迁移涉及协议、证书、硬件与业务改造，绝非一天可完成，与迁移紧迫性的逻辑也相反。","source":"后量子密码迁移与\"先存储、后解密\"威胁模型","keyPoint":"迁移要趁早：怕的是今天被截获、未来被量子解密"},{"id":"第二部分专业题-二、密码前沿技术-单选题-110","no":110,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"某跨国企业的安全架构师正在制定从经典密码向抗量子密码迁移的路线图。 该企业拥有庞大的PKI 基础设施，无法在短期内完成全面替换。以下关于抗量 子密码迁移策略的描述中，正确的是（ ）","options":[{"key":"A","text":"应等到量子计算机真正具备破解能力后再开始迁移"},{"key":"B","text":"抗量子密码的部署只需要升级软件，不需要更换硬件"},{"key":"C","text":"迁移只需替换非对称密码算法，对称密码无需任何调整"},{"key":"D","text":"可采用“传统密码+抗量子密码”混合模式，实现平滑过渡"}],"answer":"D","analysis":"大规模 PKI 无法一次性替换，务实做法是混合模式：在密钥协商中同时叠加经典算法与抗量子算法，或在证书链、签名中并行使用两套算法，只要其中一套仍安全，整体通信就安全。这样既能抵御当下的经典攻击，也能提前获得抗量子能力，并可随标准与产品成熟逐步剥离经典算法，实现平滑过渡。","correctReason":"采用\"传统密码＋抗量子密码\"混合模式，可兼顾现有兼容性与抗量子能力，是 PKI 渐进迁移的稳妥路径。","wrongReason":"A：等到量子计算机真正具备破解能力再迁移，届时已被\"先存储、后解密\"击穿，为时已晚；B：抗量子算法运算开销与密钥尺寸更大，常需更强的硬件与密码模块支撑，并非只升软件；C：对称密码虽可加长密钥应对 Grover，但整体迁移仍要评估其强度与协议适配，不能说无需任何调整。","source":"后量子密码迁移策略与混合密钥交换工程实践","keyPoint":"PQC 迁移走混合模式：新旧算法并行，逐步替换"},{"id":"第二部分专业题-二、密码前沿技术-单选题-111","no":111,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"某安全研究员在分析量子计算对密码体系的威胁时，需要区分不同量子算法 的攻击目标。以下关于Shor 算法与Grover 算法攻击目标的配对中，正确的是 （ ）","options":[{"key":"A","text":"Shor 算法→对称密码，Grover 算法→非对称密码"},{"key":"B","text":"Shor 算法→非对称密码，Grover 算法→对称密码"},{"key":"C","text":"Shor 算法→哈希函数，Grover 算法→数字签名"},{"key":"D","text":"Shor 算法→密钥分发，Grover 算法→公钥加密"}],"answer":"B","analysis":"两类量子算法目标分明：Shor 算法利用量子傅里叶变换求解周期问题，能多项式时间解决大整数分解与离散对数，直接攻破 RSA、ECC、DH 等非对称密码；Grover 算法是量子搜索，对无结构穷举只带来平方根加速，主要冲击对称密码与杂凑的密钥长度和摘要长度，因此配对为\"Shor→非对称，Grover→对称\"。","correctReason":"Shor 算法破解依赖分解与离散对数难题的非对称密码，Grover 算法以平方根加速削弱对称密码与杂凑的强度。","wrongReason":"A：目标恰好对调；C：哈希与数字签名分属杂凑与非对称密码功能，与两种算法的攻击目标不匹配；D：密钥分发与公钥加密本质都建立在非对称密码之上，都属 Shor 算法的攻击范围，Grover 并不针对公钥加密。","source":"Shor 算法与 Grover 算法的攻击目标（通用技术知识）","keyPoint":"Shor→非对称密码，Grover→对称密码与杂凑"},{"id":"第二部分专业题-二、密码前沿技术-单选题-112","no":112,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"某公司的密码学团队在研究格密码的原理。他们需要理解格密码的核心数学 困难问题。以下关于格密码所依赖的困难问题的描述中，正确的是（ ）","options":[{"key":"A","text":"格密码的主要数学基础是格的最短向量问题（SVP）和最近向量问题（CVP）"},{"key":"B","text":"格密码仅依赖于大整数分解问题"},{"key":"C","text":"格密码依赖于椭圆曲线上的离散对数问题"},{"key":"D","text":"格密码依赖于随机线性码的译码问题"}],"answer":"A","analysis":"格密码的安全性建立在格上困难问题之上，最核心的是最短向量问题（SVP，在格中找出最短非零向量）和最近向量问题（CVP，给定目标点求格中最近向量），其近似变体（如 SVPγ、带误差学习 LWE、短整数解 SIS）构成现代格密码方案的基石。这些问题目前未发现量子多项式时间算法，因此被视为抗量子路线。","correctReason":"格密码主要依赖格的最短向量问题（SVP）与最近向量问题（CVP）及其近似变体的困难性。","wrongReason":"B：大整数分解是 RSA 的基础，不属于格密码；C：椭圆曲线离散对数是 ECC 的基础，会被 Shor 算法攻破；D：随机线性码的译码问题是基于编码的密码（如 McEliece）的基础，与格困难问题不同。","source":"格密码困难问题（SVP/CVP 与 LWE、SIS）","keyPoint":"格密码根基＝SVP 与 CVP，量子算法暂无多项式解法"},{"id":"第二部分专业题-二、密码前沿技术-单选题-113","no":113,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"某密码学教材中写道：“格密码是抗量子密码中最有前景的技术路线之一。” 以下关于格密码优势的描述中，不正确的是（ ）","options":[{"key":"A","text":"格密码可以实现加密、数字签名、密钥交换等多种密码功能"},{"key":"B","text":"格密码的安全性依赖于求解格中问题的困难性"},{"key":"C","text":"格密码的密钥尺寸在所有抗量子密码路线中都是最小的"},{"key":"D","text":"格密码在安全性、公私钥大小和计算速度上可达到较好的平衡"}],"answer":"C","analysis":"格密码的优势在于功能齐全（可构造加密、签名、密钥封装与密钥交换）、安全性有较扎实的归约证明，并且在安全强度、公私钥/密文尺寸与运算速度之间平衡较好。但它的密钥与密文尺寸偏大，通常明显大于基于编码或基于哈希的同类方案，因此\"密钥尺寸在所有抗量子路线中最小\"的说法不成立。","correctReason":"格密码的密钥与密文体积通常较大，并非所有抗量子路线中最小，故该描述不正确。","wrongReason":"A：格密码可支撑加密、数字签名、密钥交换等多种功能，描述正确；B：其安全性确实归约到格上困难问题，描述正确；D：格密码在安全性、尺寸与速度之间平衡较好，这也是其被 NIST 选为标准路线的原因，描述正确。","source":"格密码方案特点比较（NIST PQC 标准算法分析）","keyPoint":"格密码强在均衡，弱在密钥与密文偏大"},{"id":"第二部分专业题-二、密码前沿技术-单选题-114","no":114,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"某密码学研究人员在论文中写道：“基于哈希的签名方案是抗量子密码中理 论安全性最强的一类。”以下关于基于哈希的签名方案特点的描述中，正确的是 （ ）","options":[{"key":"A","text":"基于哈希的签名方案可以实现公钥加密和密钥封装功能"},{"key":"B","text":"基于哈希的签名方案的安全性依赖于哈希函数的单向性等性质，如果哈希函 数被攻破可以替换"},{"key":"C","text":"基于哈希的签名方案签名体积小，适合资源受限设备"},{"key":"D","text":"基于哈希的签名方案均为无状态方案，易于部署"}],"answer":"B","analysis":"基于哈希的签名（如 SPHINCS+、XMSS/LMS）安全性完全归约到哈希函数的单向性与抗碰撞等性质，结构简单、假设最弱，因此被认为理论安全性最强；一旦所用哈希函数被攻破，可在不改变方案结构的前提下换成更强哈希（如 SHA-2 换 SHA-3）继续使用。其代价是签名体积大、签名生成较慢。","correctReason":"该方案的安全性仅依赖哈希函数的单向性等性质，哈希被攻破时可通过替换哈希函数来修复，这是其突出特点。","wrongReason":"A：基于哈希的构造主要用于数字签名，不能实现公钥加密与密钥封装；C：其签名体积恰恰很大（可达数十 KB），不适合资源受限设备；D：存在有状态方案（如 XMSS、LMS，需维护一次性密钥状态），并非全部无状态，且状态管理正是部署难点。","source":"基于哈希的签名方案（SPHINCS+、XMSS/LMS）特性","keyPoint":"哈希签名：假设最弱易替换，但签名大且有状态之分"},{"id":"第二部分专业题-二、密码前沿技术-单选题-115","no":115,"kind":"single","part":"第二部分专业题","cat":"二、密码前沿技术","type":"单选题","stem":"某政府部门需要存储一批保密期限为30 年的核心涉密数据。安全专家建议： “考虑到量子计算的远期威胁，即使现在使用RSA-2048 加密存储也不足够安全。” 以下关于这一建议理由的解释中，正确的是（ ）","options":[{"key":"A","text":"RSA-2048 现在已经被经典计算机破解"},{"key":"B","text":"“先存储、后解密”攻击方式下，攻击者可先存储加密数据，待量子计算机成熟 后再解密"},{"key":"C","text":"RSA-2048 的密钥太短，经典计算机可在几年内暴力破解"},{"key":"D","text":"量子计算机现在已经能够破解RSA-2048"}],"answer":"B","analysis":"核心是保密期限与威胁时间的错配：RSA-2048 今天仍未被破解，但攻击者可以现在就把加密数据抓走存起来，等量子计算机成熟后用 Shor 算法回溯解密。数据要保密 30 年，而量子破解能力可能在这段窗口内出现，\"先存储、后解密\"让今天的加密失去长期保障，因此应尽早改用抗量子密码或混合加密。","correctReason":"在\"先存储、后解密\"模式下，对手可先截存密文，待量子计算能力成熟后再解密，30 年保密期的数据因此存在现实风险。","wrongReason":"A：RSA-2048 目前并未被经典计算机实际破解；C：RSA-2048 的密钥长度对经典暴力破解仍足够安全，威胁来自量子算法而非密钥太短；D：量子计算机目前尚不具备破解 RSA-2048 的能力，这正是需要前瞻迁移而非事后补救的原因。","source":"\"先存储、后解密\"威胁模型与后量子密码迁移要求","keyPoint":"长保密期数据怕\"先存后解\"，须提前迁抗量子密码"},{"id":"第二部分专业题-二、密码前沿技术-多选题-1","no":1,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"Android 是一个开源的移动终端操作系统，共分成Linux 内核层、系统运行 库层、应用程序框架层和应用程序层四个部分。那么以下属于应用程序层的是 （ ）。","options":[{"key":"A","text":"浏览器"},{"key":"B","text":"资源管理器"},{"key":"C","text":"显示驱动"},{"key":"D","text":"主屏"}],"answer":"AD","analysis":"本题考查 Android 系统分层架构与应用程序的归属判断。Android 自下而上分为 Linux 内核层、系统运行库层、应用程序框架层和应用程序层，直接面向用户、可用图标启动的才属于应用程序层。浏览器、主屏都是随系统提供的用户级应用；而显示驱动属于内核层的硬件抽象与驱动部分，资源管理器属于应用程序框架层提供的系统服务。","correctReason":"浏览器与主屏都是直接面向用户的可启动应用，属于应用程序层。","wrongReason":"B：资源管理器是应用程序框架层提供的系统服务；C：显示驱动属于 Linux 内核层的硬件驱动，均不在应用程序层。","source":"Android 官方分层架构说明（Linux 内核层、系统运行库层、应用程序框架层、应用程序层）","keyPoint":"Android 四层：内核→运行库→框架→应用，驱动在内核、服务在框架。"},{"id":"第二部分专业题-二、密码前沿技术-多选题-2","no":2,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"网络信息安全事件可以根据其性质和影响范围分为多个类别，包括恶意程序 事件、网络攻击事件、信息内容安全事件等。以下网络安全事件中属于信息内容 安全事件的是（ ）。","options":[{"key":"A","text":"有意或无意地删除重要数据，导致业务中断或损失"},{"key":"B","text":"制造和散布虚假新闻或谣言，误导公众舆论"},{"key":"C","text":"通过网络传播法律法规禁止的信息，炒作敏感问题"},{"key":"D","text":"员工或合作伙伴违反公司政策，泄露敏感信息或滥用权限"}],"answer":"BC","analysis":"本题考查网络安全事件分类中“信息内容安全事件”的界定。信息内容安全事件指利用网络制作、复制、发布、传播法律禁止的信息，或制造散布谣言扰乱社会秩序、影响公众舆论。B、C 都是围绕信息内容本身违法有害展开；A 属于数据被破坏导致业务中断的可用性事件，D 属于内部人员违规泄露数据的失泄密事件，二者均不以信息内容违法为特征。","correctReason":"B、C 的特征都是通过互联网传播违法有害或虚假信息、扰乱舆论秩序，符合信息内容安全事件定义。","wrongReason":"A：删除重要数据致业务中断属数据安全/可用性事件；D：员工或伙伴泄密、滥用权限属内部违规与失泄密事件。","source":"《国家网络安全事件应急预案》事件分类（恶意程序、网络攻击、信息内容安全、数据安全等事件类别）","keyPoint":"信息内容安全事件看“传播什么内容、是否违法有害”，不看系统受损。"},{"id":"第二部分专业题-二、密码前沿技术-多选题-3","no":3,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"“互联网+”时代，足不出户即可享受美食、打车不再需要路边招手......，各类 App 的出现改变了人们生活的同时也带来了安全隐患。对于“餐饮外卖类App”， 以下（ ）是不属于该类App 所规定收集的必要个人信息。","options":[{"key":"A","text":"收货人真实姓名"},{"key":"B","text":"注册用户移动电话号码"},{"key":"C","text":"收货人性别"},{"key":"D","text":"收货人详细门牌号码"}],"answer":"ACD","analysis":"本题考查《常见类型移动互联网应用程序必要个人信息范围规定》中餐饮外卖类的必要个人信息范围。该类 App 的必要信息只有注册用户的移动电话号码，用于账号注册与联系；收货地址、姓名、性别等虽常被收集，但并非业务必需。本题问“不属于必要”的项，故选 A、C、D，核心是最小必要原则。","correctReason":"只有注册用户移动电话号码属于餐饮外卖类 App 的必要个人信息，其余均为非必要收集项。","wrongReason":"A：收货人真实姓名不在必要范围内；C：收货人性别与配送履约无关；D：精确到门牌号的详细地址过度收集，配送只需必要地址信息。","source":"《常见类型移动互联网应用程序必要个人信息范围规定》（餐饮外卖类 App 必要个人信息为注册用户移动电话号码）","keyPoint":"餐饮外卖类必要信息只有手机号，地址姓名性别都不算。"},{"id":"第二部分专业题-二、密码前沿技术-多选题-4","no":4,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"网络安全漏洞是网络安全管理工作的重要内容，网络信息系统的漏洞主要来 自两个方面：非技术性安全漏洞和技术性安全漏洞。以下属于非技术性安全漏洞 主要来源的是（ ）。","options":[{"key":"A","text":"网络安全责任主体不明确"},{"key":"B","text":"配置错误"},{"key":"C","text":"缓冲区溢出"},{"key":"D","text":"网络安全监督缺失"}],"answer":"AD","analysis":"本题考查漏洞来源的两分法：非技术性安全漏洞源于组织管理、制度与责任落实，技术性安全漏洞源于系统自身实现与配置缺陷。责任主体不明确、安全监督缺失都属管理层面的缺失，与人的组织行为有关；配置错误和缓冲区溢出则是典型的技术性缺陷，属于产品实现与运维配置范畴。","correctReason":"责任主体不明确与安全监督缺失都源于组织管理不到位，属于非技术性安全漏洞。","wrongReason":"B：配置错误是运维层面的技术性漏洞；C：缓冲区溢出是程序实现层面的技术性漏洞。","source":"《信息安全技术 信息安全风险评估方法》（GB/T 20984）脆弱性识别与安全措施识别章节","keyPoint":"非技术性漏洞看管理和制度，配置错误、缓冲区溢出都是技术性漏洞。"},{"id":"第二部分专业题-二、密码前沿技术-多选题-5","no":5,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"量子技术的三大核心概念包括（ ）","options":[{"key":"A","text":"叠加"},{"key":"B","text":"纠缠"},{"key":"C","text":"测量"},{"key":"D","text":"退相干"}],"answer":"ABC","analysis":"本题考查量子信息的基本概念。量子技术的三个核心概念是叠加、纠缠和测量：叠加让量子态可同时处于多个本征态的组合；纠缠使多个量子比特形成不可分割的整体关联；测量则把量子态投影为确定结果并破坏原有叠加。退相干是量子系统与环境耦合导致量子特性衰减的物理过程，是要克服的干扰效应，不属于核心概念。","correctReason":"叠加、纠缠、测量构成量子技术三大核心概念，是量子计算与量子通信的共同基础。","wrongReason":"D：退相干是量子比特丧失量子特性的干扰效应，属于需要抑制的物理现象，不是三大核心概念之一。","source":"量子信息基础理论（叠加、纠缠、测量三大核心概念）","keyPoint":"量子三核心：叠加、纠缠、测量；退相干是要克服的干扰。"},{"id":"第二部分专业题-二、密码前沿技术-多选题-6","no":6,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"5G 网络作为第五代移动通信技术，带来了许多新的特性和改进。以下关于 5G 网络的描述，正确的是（ ）。","options":[{"key":"A","text":"5G 网络能够提供比4G 快10 到100 倍的数据传输速率"},{"key":"B","text":"5G 显著降低了数据传输的延迟时间，最低可至1 毫秒"},{"key":"C","text":"5G 支持每平方公里内多达100 万台设备的连接"},{"key":"D","text":"5G 基站的覆盖范围较大，尤其是在使用高频段时，信号穿透力强"}],"answer":"ABC","analysis":"本题考查 5G 的关键性能指标。5G 三大应用场景对应峰值速率提升约 10~100 倍、低时延（uRLLC 可低至 1 毫秒）和高连接密度（每平方公里百万级连接），A、B、C 均与标准指标一致。D 的表述恰好说反：高频段（毫米波）带宽大但覆盖小、穿透力弱，覆盖范围大恰恰是低频段的优势。","correctReason":"5G 的峰值速率、低时延、高连接密度指标与 A、B、C 的描述一致。","wrongReason":"D：高频段信号穿透力弱、覆盖范围小，“覆盖范围大、穿透力强”与 5G 高频特性相反。","source":"IMT-2020（5G）愿景与关键性能指标：峰值速率、1ms 级时延、百万级连接密度","keyPoint":"5G 三指标：速率十倍以上、时延低至 1ms、百万连接/km²；高频穿透差。"},{"id":"第二部分专业题-二、密码前沿技术-多选题-7","no":7,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"某医院需保护患者隐私数据，以下哪些措施属于数据安全中的“数据脱敏”和 “数据备份”技术？（ ）","options":[{"key":"A","text":"将患者姓名替换为随机生成的假名（静态脱敏）"},{"key":"B","text":"每周执行差异备份并存储于异地机房"},{"key":"C","text":"在查询时实时隐藏患者身份证号后四位（动态脱敏）"},{"key":"D","text":"使用RAID1 技术实现磁盘镜像"}],"answer":"ABC","analysis":"本题考查数据脱敏与数据备份两类技术的识别。静态脱敏是把真实数据用假名、虚构值在落地存储前替换；动态脱敏是在查询或展示环节按权限实时遮蔽敏感字段；备份则强调副本与异地存放。RAID1 虽然做了磁盘镜像，但属于存储容错与高可用技术，无法抵御误删除、勒索软件和机房级灾难，不能替代备份。","correctReason":"A、C 分别是静态与动态脱敏，B 是异地差异备份，均属题干所指的两类技术。","wrongReason":"D：RAID1 是磁盘镜像容错，只能防单盘故障，不具备历史副本恢复能力，不算数据备份技术。","source":"《信息安全技术 个人信息安全规范》（GB/T 35273）个人信息去标识化与展示限制要求；数据备份与容灾基本原则","keyPoint":"脱敏分静态（落库前替换）与动态（查询时遮蔽）；RAID 不是备份。"},{"id":"第二部分专业题-二、密码前沿技术-多选题-8","no":8,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"某单位服务器遭受入侵后，取证人员首先对内存进行镜像备份，随后提取防 火墙日志，最后将关键数据包存入写保护设备。此流程主要违反了（ ）？","options":[{"key":"A","text":"证据完整性原则"},{"key":"B","text":"证据及时性原则"},{"key":"C","text":"取证流程顺序错误"},{"key":"D","text":"数据加密存储要求"}],"answer":"C","analysis":"本题考查电子数据取证的基本原则与操作顺序。取证讲究“先易失后非易失、先内存后磁盘、先固定后分析、先提取后检验”，网络数据包和会话状态属易失证据，必须在内存之后立即固定。本题流程把最易失的数据包放到最后才存入写保护设备，违反的是取证流程顺序。官方答案只选 C，属单选题式设问。","correctReason":"题干描述的问题本质是易失性证据取证顺序被颠倒，故答 C（该题答案以官方为准）。","wrongReason":"A：内存先做镜像、最终也存入写保护设备，未体现证据被污染，故本项不选；B：取证启动及时，未违反及时性原则。","source":"《信息安全技术 电子数据取证 产品安全技术要求》（GA/T 1177 等）及电子数据取证“先易失后非易失”原则","keyPoint":"取证顺序：内存等易失证据先固定，日志与磁盘后取；顺序错就是流程错。","conflict":"原卷归入多选题，但答案为『C』（单选格式），已按原卷答案保留。"},{"id":"第二部分专业题-二、密码前沿技术-多选题-9","no":9,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"某智能家居系统因未实施设备与云端之间的双向身份认证，导致攻击者通过 中间人攻击（MITM）拦截并篡改通信数据。在此场景下，以下哪些安全事件最 可能发生？（ ）","options":[{"key":"A","text":"攻击者伪造指令远程操控智能门锁，触发异常开锁行为"},{"key":"B","text":"设备因固件版本过低，被攻击者利用漏洞强制刷入恶意固件"},{"key":"C","text":"用户隐私数据（如摄像头监控画面、语音记录）被攻击者实时窃取并出售"},{"key":"D","text":"家庭Wi-Fi 因设备过多导致网速变慢，影响视频通话流畅度"}],"answer":"AC","analysis":"本题考查缺少双向身份认证时段中间人攻击的后果。设备与云端不做双向认证，攻击者就能冒充双方插入通信链路，既可伪造控制指令触发误开锁，也能旁路窃取摄像头画面、语音等隐私数据。固件被刷写的原因是版本过低、升级未验签，与是否做双向认证并非同一因果；网速变慢是带宽与干扰问题，与安全无关。","correctReason":"MITM 可篡改指令与窃取通信内容，故 A（伪造开锁指令）、C（隐私数据被窃取）最可能发生。","wrongReason":"B：成因是固件版本低、升级未校验签名，而非缺少双向认证；D：网速慢属性能与干扰问题，不是安全事件。","source":"《信息安全技术 物联网感知终端应用安全技术要求》（GB/T 38628）等 IoT 安全标准中双向身份鉴别与通信加密要求","keyPoint":"无双向认证→可被冒充与篡改；防 MITM 靠证书校验、会话密钥和消息完整性。"},{"id":"第二部分专业题-二、密码前沿技术-多选题-10","no":10,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"随着全球进入数字化时代，网络风险呈指数级增长，网络安全威胁趋向智能， 网络安全人才缺口大，现有网络安全工具存在局限性。而人工智能可为网络安全 带来变革，以下说法正确的是（ ）。","options":[{"key":"A","text":"人工智能可以检测和预测新兴的未知威胁"},{"key":"B","text":"人工智能使组织能够更快地对网络威胁做出响应"},{"key":"C","text":"人工智能能以高重复性减少人为错误"},{"key":"D","text":"人工智能提高了专业技能要求"}],"answer":"ABC","analysis":"本题考查人工智能给网络安全带来的能力提升。基于机器学习的异常检测与行为基线可以发现未知威胁并做趋势预测；自动化编排能压缩检测到响应的时间；机器执行重复任务的一致性可减少人为操作失误。D 之所以不选，是因为 AI 反而降低了安全工具的运维门槛，并不必然提高对人员专业技能的要求。","correctReason":"A、B、C 分别对应 AI 在威胁预测、响应提速、降低人为差错三方面的真实增益。","wrongReason":"D：AI 自动化降低了使用门槛，并未提高专业技能要求，表述不成立。","source":"人工智能在网络安全中的应用共识（威胁检测预测、自动化响应、减少人为差错）","keyPoint":"AI 三大增益：发现未知威胁、快速响应、减少人为错误。"},{"id":"第二部分专业题-二、密码前沿技术-多选题-11","no":11,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"以下关于量子比特特性的描述中，正确的有（ ）","options":[{"key":"A","text":"一个量子比特可以同时处于0 和1 的叠加状态"},{"key":"B","text":"N 个量子比特可以同时表征2 的N 次方个基态的组合状态"},{"key":"C","text":"量子比特在被测量时会“坍缩”到某一个确定的结果"},{"key":"D","text":"量子比特的物理状态与经典比特完全相同"}],"answer":"ABC","analysis":"本题考查量子比特的基本特性。量子比特可处于 |0> 与 |1> 的叠加，N 个量子比特的复合态可同时表征 2^N 个基态组合，这是量子并行性的来源；测量会使态坍缩到某个确定结果并丢失叠加信息，这也正是量子密钥分发能发现窃听的原因。D 说反了，量子比特的物理实现（超导、离子阱、光子等）与经典比特完全不同。","correctReason":"叠加、2^N 基态组合表征、测量坍缩都是量子比特的固有特性。","wrongReason":"D：量子比特依赖量子态物理实现，可叠加、可纠缠、测量即坍缩，与经典比特的二值电平完全不同。","source":"量子计算基础理论（量子比特叠加态、量子并行性与测量坍缩公设）","keyPoint":"量子比特：可叠加、N 位表征 2^N 态、一测就坍缩。"},{"id":"第二部分专业题-二、密码前沿技术-多选题-12","no":12,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"汽车产业发展快速，涉及国家经济、交通运输、生产生活等诸多领域，但同 时暴露出的汽车数据安全问题和风险隐患也日益突出。国家鼓励汽车数据依法合 理有效利用，倡导汽车数据处理者在开展汽车数据处理活动中坚持（ ）。","options":[{"key":"A","text":"车内处理原则"},{"key":"B","text":"默认不收集原则"},{"key":"C","text":"精度适用范围原则"},{"key":"D","text":"脱敏处理原则"}],"answer":"ABCD","analysis":"本题考查汽车数据处理应坚持的原则。《汽车数据安全管理若干规定（试行）》明确倡导汽车数据处理者坚持车内处理、默认不收集、精度范围适用、脱敏处理等原则，目的就是减少数据出境与过度收集风险。A、B、C、D 恰好对应这四项原则，题干问的是应坚持的原则，故四项全选，属于“全对”型多选题。","correctReason":"车内处理、默认不收集、精度适用范围、脱敏处理都是规定明确倡导的汽车数据处理原则。","wrongReason":"本题为全对型多选题，四项均为规定倡导的原则，无错误选项，失分多在漏选与误判：A：车内处理要求数据尽量在车端处理，易被误认为过于苛刻而排除；B：默认不收集是指除驾驶人自主设定的情形外默认不收集，易被误读为“完全不收集”而当作错误项；C：规定的规范表述为“精度范围适用”，与题干的“精度适用范围”语序不同，易被当成编造项；D：脱敏处理属原则而非单纯技术手段，常被漏选。","source":"《汽车数据安全管理若干规定（试行）》（倡导车内处理、默认不收集、精度范围适用、脱敏处理等原则）","keyPoint":"汽车数据四原则：车内处理、默认不收集、精度适用、脱敏处理。"},{"id":"第二部分专业题-二、密码前沿技术-多选题-13","no":13,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"以下关于量子纠缠的描述中，正确的有（ ）","options":[{"key":"A","text":"两个纠缠的量子比特无论相隔多远，对其中一个的测量会瞬间影响另一个的 状态"},{"key":"B","text":"量子纠缠是量子通信实现超远距离传输的核心基础"},{"key":"C","text":"量子纠缠效应受光速限制"},{"key":"D","text":"量子纠缠已被实验证实"}],"answer":"ABD","analysis":"本题考查量子纠缠的性质。纠缠态中两个量子比特构成不可分割的整体，对其中一个测量会瞬时确定另一个的关联结果；这种关联是量子通信和量子隐形传态实现超远距离密钥分发与态传输的物理基础；从贝尔不等式检验到 2022 年诺贝尔物理学奖，纠缠早已被大量实验证实。但纠缠关联虽瞬时却无法传递可控信息，仍需经典信道配合，因此并不突破光速限制。","correctReason":"A、B、D 分别描述纠缠的瞬时关联、通信基础地位和实验确证性，均成立。","wrongReason":"C：纠缠关联不能传递可控信息，必须辅以经典信道，不存在超光速通信，因而不受（也不违背）光速限制的说法不成立。","source":"量子信息理论中的纠缠与非定域性（贝尔不等式检验实验及 2022 年诺贝尔物理学奖成果）","keyPoint":"纠缠关联瞬时但不能传信息，仍受光速约束，已被实验证实。"},{"id":"第二部分专业题-二、密码前沿技术-多选题-14","no":14,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"面对量子计算对数据安全的威胁，企业和组织应采取的措施包括（ ）","options":[{"key":"A","text":"建立完整的加密资产盘点机制"},{"key":"B","text":"导入具备加密敏捷性的架构"},{"key":"C","text":"优先针对高敏感数据进行PQC 防护验证"},{"key":"D","text":"等待量子计算机真正出现后再采取行动"}],"answer":"ABC","analysis":"本题考查应对量子计算威胁的迁移策略。先做完整的加密资产盘点，才能知道哪些系统、哪些数据用了 RSA/ECC；采用加密敏捷性架构，便于算法被替换时快速切换；对长期敏感数据优先做后量子密码（PQC）防护验证，可对冲“先存储、后解密”风险。D 是消极等待，等量子计算机成熟再迁移，历史密文早已被截获，风险不可逆。","correctReason":"盘点资产、加密敏捷架构、高敏感数据优先 PQC 验证，都是当前可行的主动防护措施。","wrongReason":"D：消极等待会错失迁移窗口，“先存储、后解密”使已截获的长期敏感数据永久失密，做法错误。","source":"后量子密码迁移实践共识（NIST PQC 迁移指南与加密敏捷性要求）","keyPoint":"抗量子要现在动手：盘资产、上敏捷架构、高敏数据先做 PQC 验证。"},{"id":"第二部分专业题-二、密码前沿技术-多选题-15","no":15,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"量子计算对数据安全构成的威胁主要体现在（ ）","options":[{"key":"A","text":"Shor 算法可高效破解RSA 和ECC 等公钥密码"},{"key":"B","text":"Grover 算法可使对称密码的有效密钥长度减半"},{"key":"C","text":"“先存储、后解密”策略使长期敏感数据面临泄密风险"},{"key":"D","text":"量子计算机可以破解所有类型的加密算法"}],"answer":"BCD","analysis":"本题考查量子计算威胁的具体表现形式。Grover 算法对对称密码做平方根加速，等价于有效密钥长度减半，故需加倍密钥；攻击者今天截获密文、等量子计算机成熟后再解密，使长期敏感数据现在就面临泄密风险。按官方答案只选 B、C、D，A 虽描述了 Shor 算法的能力，但本题的判定口径不将其列为正确项（该题答案以官方为准）。","correctReason":"B 的对称密钥长度减半、C 的“先存储、后解密”、D 的量子威胁真实存在，符合官方判定。","wrongReason":"A：Shor 算法破解 RSA/ECC 的表述虽为通行技术原理，但按本题官方口径不作为威胁体现项。","source":"Shor 算法与 Grover 算法的量子攻击模型（NIST PQC 相关背景说明）","keyPoint":"量子威胁：Grover 令对称密钥长度减半，先存后解密威胁长期数据。"},{"id":"第二部分专业题-二、密码前沿技术-多选题-16","no":16,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"车联网是新一代网络通信技术与汽车、电子、道路交通运输等领域深度融合 的新兴产业形态。以下关于加强车联网网络安全和数据安全管理工作的措施，叙 述正确的是（ ）。","options":[{"key":"A","text":"各相关企业要建立网络安全和数据安全管理制度，明确负责人和管理机构"},{"key":"B","text":"加强车载信息交互系统、汽车网关、电子控制单元等关键设备和部件安全防护 和安全检测"},{"key":"C","text":"鼓励相关企业、机构接入工业和信息化部车联网安全信任根管理平台，协同推 动跨车型、跨设施、跨企业互联互认互通"},{"key":"D","text":"对智能网联汽车、车联网服务平台及联网系统开展网络安全相关监测，及时 发现网络安全事件或异常行为，并按照规定留存相关的网络日志不少于3 个月"}],"answer":"ABC","analysis":"本题考查车联网网络安全与数据安全管理要求。企业要建立制度、明确负责人和管理机构；要加强车载信息交互系统、网关、电子控制单元等关键部件防护与检测；鼓励接入工信部车联网安全信任根管理平台，推动互联互认互通。D 的错误在日志留存期限：按规定网络日志应留存不少于 6 个月，写成 3 个月属于常见数字陷阱。","correctReason":"A、B、C 与车联网安全管理制度建设、关键部件防护、安全信任根平台的要求一致。","wrongReason":"D：相关网络日志留存期限为不少于 6 个月，“不少于 3 个月”不符合规定。","source":"《网络安全法》第二十一条（网络日志留存不少于六个月）；《关于加强车联网网络安全和数据安全工作的通知》","keyPoint":"日志留存记牢 6 个月；车联网要建制度、护部件、接入信任根平台。"},{"id":"第二部分专业题-二、密码前沿技术-多选题-17","no":17,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"工业互联网安全是工业生产运行过程中（ ）的统称，涉及工业互联网领 域各个环节，其核心任务就是要通过监测预警、应急响应、检测评估、功能测试 等手段确保工业互联网健康有序发展。","options":[{"key":"A","text":"信息安全"},{"key":"B","text":"制度安全"},{"key":"C","text":"功能安全"},{"key":"D","text":"物理安全"}],"answer":"ACD","analysis":"本题考查工业互联网安全的构成。工业互联网安全是工业生产运行过程中信息安全、功能安全和物理安全的统称：信息安全保障数据与系统不被非授权访问和篡改；功能安全关注设备或系统失效时仍能保持安全状态，是工业场景特有要求；物理安全保护设备与环境实体。B 的制度安全不在该分类体系内，制度属于管理手段而非安全分类维度。","correctReason":"工业互联网安全由信息安全、功能安全、物理安全三者构成。","wrongReason":"B：制度安全并非工业互联网安全的构成维度，制度属于安全管理措施，不参与该分类。","source":"工业互联网安全相关标准与政策文件对信息安全、功能安全、物理安全的界定","keyPoint":"工业互联网安全＝信息安全＋功能安全＋物理安全，无制度安全。"},{"id":"第二部分专业题-二、密码前沿技术-多选题-18","no":18,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"等级保护基本要求作为指导开展等级保护的建设整改、等级测评和监督检查 等工作的重要标准，其在等级保护技术体系中具有核心地位。以下关于等保2.0 基本要求的说法，正确的是（ ）。","options":[{"key":"A","text":"现标准名为GB/T22239-2019《信息安全技术 网络安全等级保护基本要求》"},{"key":"B","text":"在等保2.0 基本要求附录A 中，增加安全控制措施控制点的标注及使用说明"},{"key":"C","text":"从一级到四级均在“安全通信网络”、“安全区域边界”和“安全计算环境”中增加 了“可信验证”控制点"},{"key":"D","text":"从三级以上开始增加了“安全管理中心”要求"}],"answer":"ABC","analysis":"本题考查等保 2.0 基本要求的变化。标准名称已由旧版调整为《信息安全技术 网络安全等级保护基本要求》，现行版本为 GB/T 22239-2019；等保 2.0 在附录 A 中增加了安全控制措施控制点的标注及使用说明；并把可信验证控制点下沉到一到四级的安全通信网络、安全区域边界和安全计算环境中。D 容易误判：安全管理中心自三级开始要求，表述本身与标准一致，但本题官方未将其列为正确项（该题答案以官方为准）。","correctReason":"A、B、C 分别对应标准名称更新、附录 A 控制点标注说明、可信验证控制点的普遍设置。","wrongReason":"D：有关安全管理中心起始级别的表述按本题官方口径不作为正确项。","source":"GB/T 22239-2019《信息安全技术 网络安全等级保护基本要求》（含附录 A 控制点标注及使用说明、可信验证控制点）","keyPoint":"等保 2.0 记三点：GB/T 22239-2019、附录 A 控制点说明、一到四级加可信验证。"},{"id":"第二部分专业题-二、密码前沿技术-多选题-19","no":19,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"以下属于NIST 已发布或正在推进的抗量子密码标准/候选算法的有（ ）","options":[{"key":"A","text":"ML-KEM"},{"key":"B","text":"ML-DSA"},{"key":"C","text":"FN-DSA"},{"key":"D","text":"FAEST、HAWK、MAYO 等"}],"answer":"ABCD","analysis":"本题考查 NIST 抗量子密码标准化成果与算法别名。NIST 已把 CRYSTALS-Kyber 定为 ML-KEM（FIPS 203）、CRYSTALS-Dilithium 定为 ML-DSA（FIPS 204）、FALCON 对应 FN-DSA（FIPS 206），三者都已发布正式标准；此外还从额外签名方案中选出 FAEST、HAWK、MAYO 等推进后续标准化。四项都是 NIST 已发布或正在推进的标准/候选算法。","correctReason":"ML-KEM、ML-DSA 已是 NIST 正式发布的标准，FN-DSA 以及 FAEST、HAWK、MAYO 等仍处于标准制定推进过程中。","wrongReason":"本题四项均属 NIST 已发布或正在推进的抗量子密码标准/候选算法，无错误选项，易错在漏选：A：ML-KEM 由 CRYSTALS-Kyber 更名而来，易因不熟悉别名而排除；B：ML-DSA 由 CRYSTALS-Dilithium 更名而来，同属已发布标准；C：FN-DSA 即 FALCON，其标准仍在制定推进中，易因“尚未正式发布”被误判为错误项；D：FAEST、HAWK、MAYO 是 NIST 额外数字签名方案遴选中入选的候选算法，易被误认为与 NIST 标准化无关。","source":"NIST FIPS 203（ML-KEM）、FIPS 204（ML-DSA）、FIPS 206（FN-DSA）及 NIST 额外数字签名方案遴选公告","keyPoint":"记住别名：Kyber→ML-KEM、Dilithium→ML-DSA、FALCON→FN-DSA。"},{"id":"第二部分专业题-二、密码前沿技术-多选题-20","no":20,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"大数据平台涉及物理环境、网络通信、操作系统、数据库、应用系统、数据 存储等安全保护，以下安全技术可用于保护大数据平台的是（ ）。","options":[{"key":"A","text":"安全分区"},{"key":"B","text":"防火墙"},{"key":"C","text":"系统安全加固"},{"key":"D","text":"数据防泄漏"}],"answer":"ABCD","analysis":"本题考查大数据平台的分层安全防护技术。大数据平台覆盖物理环境、网络通信、操作系统、数据库、应用系统和数据存储等多层面，需要技术手段配套对应：安全分区做区域隔离与访问控制，防火墙控制网络边界流量，系统安全加固修补操作系统与数据库缺陷，数据防泄漏保护数据本体的外发与流转。四者分处不同层面，均属可用技术。","correctReason":"安全分区、防火墙、系统安全加固、数据防泄漏分别对应网络、边界、主机和数据层面的防护，均适用。","wrongReason":"本题四项都是大数据平台可用的安全技术，无错误选项，失分多在漏选：A：安全分区属区域隔离与访问控制措施，易被误认为只适用于传统网络架构而排除；B：防火墙不仅守网络边界，也用于平台内部的东西向微隔离，易被误认为“边界技术不适用于平台内部”；C：系统安全加固针对操作系统、数据库等基础组件，是平台防护必需项，易被当作“与大数据无关”而漏选；D：数据防泄漏针对数据本体流转，恰是大数据平台最贴合的核心防护手段，易被误认为只面向办公终端。","source":"GB/T 37973《信息安全技术 大数据安全管理指南》及 GB/T 22239-2019 分层安全防护要求","keyPoint":"大数据平台防护＝分区隔离＋边界防火墙＋主机加固＋数据防泄漏。"},{"id":"第二部分专业题-二、密码前沿技术-多选题-21","no":21,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"以下属于五大抗量子密码技术路线的有（ ）","options":[{"key":"A","text":"基于格的密码"},{"key":"B","text":"基于编码的密码"},{"key":"C","text":"基于哈希函数的密码"},{"key":"D","text":"基于量子密钥分发的密码"}],"answer":"ABC","analysis":"本题考查抗量子密码的技术路线划分。国际公认的五大路线为基于格的密码、基于编码的密码、基于哈希函数的密码、多变量密码和基于同源的密码，其共同点是安全性建立在经典计算难题之上。量子密钥分发（QKD）利用量子不可克隆定理做密钥协商，属于量子保密通信手段，不是抗量子密码算法路线，故不选。","correctReason":"基于格、基于编码、基于哈希函数均属五大抗量子密码技术路线。","wrongReason":"D：QKD 是基于物理原理的密钥分发技术，不属于抗量子密码（PQC）算法路线。","source":"NIST 后量子密码标准化所划分的算法族（格、编码、哈希、多变量、同源）","keyPoint":"五大路线：格、编码、哈希、多变量、同源；QKD 不算 PQC 路线。"},{"id":"第二部分专业题-二、密码前沿技术-多选题-22","no":22,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"结合区块链基础设施运行模式和技术架构，从区块链核心技术功能角度可将 区块链基础设施划分为存储层、网络层和扩展层。以下区块链基础设施可能面临 的典型安全风险中，属于扩展层安全风险的是（ ）。","options":[{"key":"A","text":"存储设备安全风险"},{"key":"B","text":"网络流量威胁"},{"key":"C","text":"合约开发漏洞和后门"},{"key":"D","text":"合约运行安全风险"}],"answer":"CD","analysis":"本题考查区块链基础设施分层与安全风险的对应关系。按存储层、网络层、扩展层划分，扩展层承载智能合约与上层业务逻辑，因此合约开发漏洞与后门、合约运行期安全问题都归入扩展层风险；存储设备安全属存储层，网络流量威胁属网络层。层级归属题关键是先把风险定位到所在功能层，再判断是否落在扩展层。","correctReason":"合约开发漏洞和后门、合约运行安全风险都发生在扩展层的智能合约层面。","wrongReason":"A：存储设备安全风险属于存储层；B：网络流量威胁属于网络层。","source":"区块链基础设施安全相关标准与研究报告对存储层、网络层、扩展层的风险划分","keyPoint":"扩展层＝合约相关风险；存储层管设备、网络层管流量。"},{"id":"第二部分专业题-二、密码前沿技术-多选题-23","no":23,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"密钥管理对于保证密钥全生命周期的安全性是至关重要的。密钥可以是随机 产生、协商产生等不同的方式产生，产生的同时可在密码产品中记录密钥关联信 息，其中包括（ ）。","options":[{"key":"A","text":"密钥长度"},{"key":"B","text":"密钥种类"},{"key":"C","text":"密钥拥有者"},{"key":"D","text":"密钥使用起始、终止时间"}],"answer":"ABCD","analysis":"本题考查密钥产生环节应记录的关联信息。密钥可由随机产生或协商产生，产生时密码产品需同步记录用于全生命周期管理的元数据：密钥长度决定安全强度，密钥种类（如加密密钥、签名密钥、会话密钥）决定用途，密钥拥有者明确归属与责任，使用起始与终止时间落实有效期控制。四项都属于应记录的关联信息。","correctReason":"密钥长度、密钥种类、密钥拥有者、密钥使用起止时间都是密钥产生时需登记的关联信息。","wrongReason":"本题四项均为密钥产生环节应记录的关联信息，无错误选项，易错在漏选：A：密钥长度决定安全强度，易被误认为属算法参数而非密钥关联信息；B：密钥种类决定用途与使用限制（如加密、签名、会话密钥），易被忽略；C：密钥拥有者用于明确归属与责任，易因“属管理信息、非技术属性”而被排除；D：使用起始、终止时间用于落实有效期控制，易被误认为属于密钥使用阶段而非产生时的登记内容。","source":"GB/T 39786-2021《信息安全技术 信息系统密码应用基本要求》密钥全生命周期管理要求","keyPoint":"密钥关联信息记四样：长度、种类、拥有者、起止时间。"},{"id":"第二部分专业题-二、密码前沿技术-多选题-24","no":24,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"后量子密码迁移过程中，企业面临的主要挑战包括（ ）","options":[{"key":"A","text":"系统相依性的确认"},{"key":"B","text":"应用相容性的验证"},{"key":"C","text":"凭证链和设备支援度的评估"},{"key":"D","text":"运维流程与合规要求的适配"}],"answer":"ABCD","analysis":"本题考查后量子密码迁移的工程难点。迁移不只是换算法：先要确认系统相依性，理清哪些模块、协议和证书依赖现有公钥算法；再做应用相容性验证，确保性能、带宽和报文长度变化不影响业务；还要评估凭证链与设备支援度，因为证书链、根 CA 和大量 IoT 终端未必支持新算法；最后是运维流程与合规要求的适配，包括密钥管理、审计与监管报备。","correctReason":"系统相依性、应用相容性、凭证链与设备支援度、运维与合规适配都是迁移必须解决的问题。","wrongReason":"本题四项均为后量子密码迁移中企业必须应对的挑战，无错误选项，失分多在漏选：A：系统相依性确认是迁移第一步，需理清模块、协议与证书对现有公钥算法的依赖，易被当作非技术工作而排除；B：应用相容性验证涉及新算法带来的密钥与签名长度膨胀、性能和带宽变化，易被低估；C：凭证链与设备支援度评估常被忽视，证书链、根 CA 及大量老旧 IoT 终端未必支持新算法，易被误认为“不在企业可控范围”而漏选；D：运维流程与合规适配涵盖密钥管理、审计与监管报备，易被误认为与迁移技术无关。","source":"后量子密码迁移实践指南（NIST PQC 迁移与加密敏捷性相关要求）","keyPoint":"PQC 迁移四难：系统相依、应用相容、凭证链与设备、运维合规。"},{"id":"第二部分专业题-二、密码前沿技术-多选题-25","no":25,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"一段时期以来，部分商业网站平台及“自媒体”账号屡屡发生歪曲解读经济政 策、造谣传谣等行为，国家网信办决定开展违规采编发布财经类信息专项整治。 其中，以下行为描述中，（ ）属于重点打击的违规问题。","options":[{"key":"A","text":"胡评妄议、歪曲解读我国财经方针政策、宏观经济数据"},{"key":"B","text":"散布“小道消息”，以所谓“揭秘”“独家爆料”等为名进行渲染炒作"},{"key":"C","text":"转载合规稿源财经新闻信息时，恶意篡改、片面曲解等“标题党”行为"},{"key":"D","text":"充当金融“黑嘴”，恶意唱空或哄抬个股价格，炒作区域楼市波动"}],"answer":"ABCD","analysis":"本题考查国家网信办违规采编发布财经类信息专项整治的重点打击对象。重点包括胡评妄议、歪曲解读财经方针政策与宏观经济数据；以“揭秘”“独家爆料”为名散布小道消息渲染炒作；转载合规稿源时恶意篡改、片面曲解搞“标题党”；以及充当金融“黑嘴”恶意唱空或哄抬股价、炒作区域楼市波动。四类都是该项整治明确点名的违规行为。","correctReason":"A、B、C、D 分别对应歪曲解读政策、散布小道消息、篡改稿源标题党、金融黑嘴操纵预期，均属重点打击的违规问题。","wrongReason":"本题四项均属专项整治重点打击的违规行为，无错误选项，易错在漏选与轻视：A：胡评妄议、歪曲解读财经方针政策与宏观经济数据，易被误认为“只是观点表达”而排除；B：以“揭秘”“独家爆料”为名散布小道消息并渲染炒作，易被误认为属正常信息发布；C：转载合规稿源时恶意篡改、片面曲解等“标题党”行为同样违规，易因“稿源本身合规”而被误判为无害；D：充当金融“黑嘴”恶意唱空或哄抬个股价格、炒作区域楼市波动，属明确打击对象，易被误认为一般市场评论。","source":"国家网信办关于开展违规采编发布财经类信息专项整治的通知（重点打击四类违规问题）","keyPoint":"财经信息整治四打：歪曲解读、小道消息、标题党篡改、金融黑嘴。"},{"id":"第二部分专业题-二、密码前沿技术-多选题-26","no":26,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"网络安全事件应急预案应当按照事件发生后的（ ）等因素对网络安全事 件进行分级，并规定相应的应急处置措施。","options":[{"key":"A","text":"危害程度"},{"key":"B","text":"影响范围"},{"key":"C","text":"系统等级"},{"key":"D","text":"关注程度"}],"answer":"AB","analysis":"本题考查网络安全事件应急预案的分级依据。事件分级要按事件发生后的危害程度和影响范围来确定，再据此规定相应的应急处置措施，例如《国家网络安全事件应急预案》就依此设置特别重大、重大、较大、一般四级。系统等级是定级备案的结果、关注程度是舆论关注，都不作为事件分级依据。","correctReason":"危害程度和影响范围是网络安全事件分级的法定依据，也是启动相应处置措施的前提。","wrongReason":"C：系统等级反映定级保护级别，不是事件分级因素；D：关注程度属舆论层面指标，不能作为分级依据。","source":"《网络安全法》及《国家网络安全事件应急预案》（按危害程度、影响范围对事件分级）","keyPoint":"事件分级只看两点：危害程度＋影响范围。"},{"id":"第二部分专业题-二、密码前沿技术-多选题-27","no":27,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"关于量子密钥分发（QKD）的特性，以下说法正确的有（ ）","options":[{"key":"A","text":"基于量子不可克隆定理，光子无法被完整复制"},{"key":"B","text":"窃听行为会引入可观测的误码率，可被通信双方察觉"},{"key":"C","text":"QKD 的安全性建立在物理定律之上"},{"key":"D","text":"QKD 可以完全替代所有传统加密方法"}],"answer":"ABC","analysis":"本题考查量子密钥分发（QKD）的安全特性。量子不可克隆定理保证未知量子态无法被完美复制，窃听者不能留存副本；任何测量或拦截都会扰动量子态，表现为误码率升高，从而被通信双方通过误码估计发现；其安全性来自量子力学物理定律而非计算复杂性假设。但 QKD 只解决密钥分发问题，不提供身份认证与数据完整性，无法完全替代传统加密，通常需与对称密码配合使用。","correctReason":"不可克隆、窃听必留痕（误码率可观测）、安全性基于物理定律，都是 QKD 的真实特性。","wrongReason":"D：QKD 仅完成密钥分发，需配合对称加密和身份认证使用，不能替代全部传统加密方法。","source":"BB84 等量子密钥分发协议与量子不可克隆定理（QKD 安全性基于物理定律）","keyPoint":"QKD 三特性：不可克隆、窃听留误码、安全性基于物理定律；不能包打天下。"},{"id":"第二部分专业题-二、密码前沿技术-多选题-28","no":28,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"我国在抗量子密码与数据安全领域取得的重要进展包括（ ）","options":[{"key":"A","text":"基于国产抗量子芯片完成了AI 多智能体可信通信试验"},{"key":"B","text":"发布了国密+抗量子密码“双保险”混合架构的平滑迁移方案"},{"key":"C","text":"在“本源悟空”量子计算机上搭载了抗量子攻击密码防护体系"},{"key":"D","text":"已完成全球所有抗量子密码标准的制定"}],"answer":"ABC","analysis":"本题考查我国在抗量子密码与数据安全方向的进展。国内团队基于国产抗量子芯片完成了 AI 多智能体可信通信试验；业界发布了“国密＋抗量子密码”双保险混合架构的平滑迁移方案，兼顾兼容性与合规；本源悟空量子计算机上也搭载了抗量子攻击密码防护体系。D 夸大其词，全球抗量子密码标准仍在分批制定推进中，远未全部完成。","correctReason":"A、B、C 都对应国内可查的抗量子密码芯片试验、混合架构迁移方案和量子计算平台防护实践。","wrongReason":"D：全球抗量子密码标准尚在分批制定与推进中，“已全部完成”与事实不符。","source":"国内抗量子密码与数据安全公开进展报道（NIST PQC 标准分阶段推进现状）","keyPoint":"国产进展：抗量子芯片试验、国密＋PQC 混合迁移、本源悟空防护；标准未全定。"},{"id":"第二部分专业题-二、密码前沿技术-多选题-29","no":29,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"在信息安全风险评估已有安全措施识别过程中，安全措施可以分为预防性安 全措施和保护性安全措施两种。以下关于安全措施的描述，正确的有（ ）。","options":[{"key":"A","text":"预防性安全措施可减少安全事件发生后对组织或系统造成的影响"},{"key":"B","text":"保护性安全措施可降低威胁利用脆弱性导致安全事件发生的可能性"},{"key":"C","text":"在识别脆弱性的同时，评估人员应对已采取的安全措施的有效性进行确认"},{"key":"D","text":"安全措施的确认应评估其有效性，即是否真正地降低了系统的脆弱性，抵御了 威胁"}],"answer":"CD","analysis":"本题考查风险评估中两类安全措施的区分。预防性安全措施作用于事前，降低威胁利用脆弱性导致安全事件发生的可能性（如访问控制、加密、加固）；保护性安全措施作用于事后，减轻安全事件造成的影响（如备份、容灾、应急响应）。A、B 恰好把两者定义说反了，故不选；C、D 强调识别脆弱性时要同步确认已采取措施的有效性，即是否真正降低脆弱性、抵御威胁，是正确的评估要求（该题答案以官方为准）。","correctReason":"C、D 说明安全措施确认的必要性与有效性判定标准，符合风险评估的规范做法。","wrongReason":"A：预防性措施降低的是事件发生可能性，不是事后影响；B：保护性措施减轻的是事件影响，不是发生可能性，两项定义颠倒。","source":"GB/T 20984《信息安全技术 信息安全风险评估方法》安全措施识别与有效性确认要求","keyPoint":"预防性管“少出事”（降可能性），保护性管“出事少损失”（降影响）。"},{"id":"第二部分专业题-二、密码前沿技术-多选题-30","no":30,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"信息安全系统工程是确保信息系统在其生命周期内具备安全性的一系列过 程、方法和技术的集合。它不仅涉及技术层面，还包括管理、政策和人员等多个 方面。关于信息安全系统工程，以下描述正确的是（ ）。","options":[{"key":"A","text":"随着业务需求的变化，信息安全系统也需要不断更新和完善"},{"key":"B","text":"信息安全系统的建设是在OSI 网络参考模型的各个层面进行的"},{"key":"C","text":"信息安全系统可以脱离业务应用信息系统独立存在"},{"key":"D","text":"识别和评估安全风险是信息安全系统工程的基础工作"}],"answer":"ABD","analysis":"本题考查信息安全系统工程的理念。信息安全系统必须随业务需求变化持续更新完善，不存在一劳永逸；其建设贯穿 OSI 参考模型各层，从物理层到应用层都要部署相应安全机制；识别和评估安全风险是整个工程的基础工作，风险不明就无法确定保护需求。C 错误在于把安全系统当成可以脱离业务的独立存在，实际它是业务应用信息系统的支撑与保障部分。","correctReason":"持续更新、贯穿 OSI 各层、以风险识别评估为基础，都是信息安全系统工程的正确认识。","wrongReason":"C：信息安全系统服务于业务应用信息系统，脱离业务便失去保护对象和存在意义，不能独立存在。","source":"信息安全系统工程（ISSE）基本理念与 GB/T 20274 信息系统安全保障评估框架","keyPoint":"安全系统依附业务、随需演进、覆盖 OSI 各层，且以风险评估为基础。"},{"id":"第二部分专业题-二、密码前沿技术-多选题-31","no":31,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"以下哪些是区块链共识机制中可能面临的安全风险或攻击？（ ）","options":[{"key":"A","text":"Nothing-at-Stake（无利害关系）问题"},{"key":"B","text":"长程攻击（Long-RangeAttack）"},{"key":"C","text":"短程重组攻击（Short-RangeReorg）"},{"key":"D","text":"预映像攻击（PreimageAttack）"}],"answer":"ABC","analysis":"本题考区块链共识机制自身的安全风险边界。权益证明下验证者可对多条分叉同时下注而无额外成本，形成无利害关系问题；长程攻击指攻击者从很早的历史区块开始构造更长链，多见于PoS；短程重组攻击则是通过短时间算力或权益优势回滚最近若干区块以双花。这三者都属于共识层的典型威胁。预映像攻击针对的是杂凑函数求原像困难性，属于密码原语攻击，不是共识机制面临的风险，故排除D。","correctReason":"A、B、C均是共识层（尤其PoS及其变体）公认的攻击模型：无利害关系、长程攻击、短程重组都直接针对共识的出块与投票规则。","wrongReason":"D：预映像攻击是求杂凑函数原像的攻击，针对SM3、SHA-256等杂凑算法本身，与共识机制的出块/投票规则无关，不属于共识机制的安全风险。","source":"区块链共识安全通用知识（PoS攻击模型：Nothing-at-Stake、Long-Range、Short-Range Reorg）；预映像攻击属杂凑函数原像攻击范畴","keyPoint":"共识风险属出块/投票规则；预映像是杂凑原语攻击，不属共识层"},{"id":"第二部分专业题-二、密码前沿技术-多选题-32","no":32,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"区块链中的跨链技术（Cross-chain）解决不了什么问题？（ ）","options":[{"key":"A","text":"区块链的数据隐私保护"},{"key":"B","text":"区块链节点的身份验证"},{"key":"C","text":"不同区块链之间的数据互通"},{"key":"D","text":"区块链的共识算法优化"}],"answer":"ABD","analysis":"本题是反向设问，问跨链技术“解决不了”什么。跨链的核心目标是打通不同链之间的资产与消息流转，因此C是它能解决的，不能选。它无法解决链上数据的隐私泄露（需零知识证明、机密计算等），无法替代节点身份认证（需PKI、去中心化身份DID等），也无法改进单链共识算法的性能与安全（需共识层自身优化）。","correctReason":"跨链只负责异构链之间的互操作；隐私保护、身份认证、共识算法优化分别属于隐私计算、身份管理、共识层优化范畴，跨链技术并不具备这些能力。","wrongReason":"C：不同区块链之间的数据互通正是跨链技术要解决的核心问题（如中继、公证人、哈希锁定等方案），与题干“解决不了”的要求相反。","source":"区块链跨链互操作通用技术知识；隐私与身份类需求可参见 GB/T 35273-2020、GB/T 39786-2021","keyPoint":"跨链只解决“互通”，不解决隐私、身份、共识优化"},{"id":"第二部分专业题-二、密码前沿技术-多选题-33","no":33,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"区块链技术因其独特的特性，在网络安全领域有着广泛的应用和潜在的优 势，下列选项中，哪些是区块链技术在提升网络安全方面的具体应用或优势？ （ ）","options":[{"key":"A","text":"区块链可以通过增加数据冗余来显著提高数据传输速度"},{"key":"B","text":"智能合约能够自动执行预设规则，减少人为错误和欺诈行为"},{"key":"C","text":"可以通过高级加密技术（如零知识证明）来保护隐私"},{"key":"D","text":"去中心化特性使得区块链网络不易成为DDoS 攻击的目标"}],"answer":"BCD","analysis":"本题考查区块链在网络安全中的真实价值点。智能合约把规则写成代码自动执行，减少人工干预带来的错误与舞弊；零知识证明等高级密码技术可在不暴露原始数据的前提下完成验证，保护隐私；多节点分布式账本没有单点汇聚，攻击者难以通过打瘫一个中心使全网不可用，因而降低了DDoS实效。而区块链的冗余是为了一致性与防篡改，代价恰恰是吞吐低、确认慢，不可能提高传输速度。","correctReason":"B、C、D都是区块链在安全领域的实际应用或优势：合约自动化减少人为风险、零知识证明保护隐私、去中心化削弱DDoS单点打击效果。","wrongReason":"A：区块链靠多副本共识换安全与防篡改，冗余带来的是吞吐与延迟的代价，不会提升数据传输速度，属于方向性错误。","source":"区块链安全应用通用知识；零知识证明可参见 GB/T 39786-2021 密码技术应用相关要求","keyPoint":"区块链靠冗余换防篡改，反而牺牲性能；提速是伪优势"},{"id":"第二部分专业题-二、密码前沿技术-多选题-34","no":34,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"区块链信息服务提供者对违反法律、行政法规规定和服务协议的区块链信息 服务使用者，可以采取以下哪些措施？（ ）","options":[{"key":"A","text":"依法依约采取警示"},{"key":"B","text":"限制功能使用"},{"key":"C","text":"关闭账号"},{"key":"D","text":"没收账号内的资产"}],"answer":"ABC","analysis":"本题考《区块链信息服务管理规定》中对违规使用者的处置手段。该规定要求服务提供者落实信息内容安全管理责任，对违反法律、行政法规规定和服务协议的使用者，依法依约采取警示、限制功能、关闭账号等处置措施，并及时保存记录、向主管部门报告。处置措施必须于法有据、于约有据，平台并非执法机关，无权处分用户财产。","correctReason":"警示、限制功能使用、关闭账号都是该规定明确列举的、可依法依约采取的处置措施，属于平台自治与合规管理的常规手段。","wrongReason":"D：没收账号内资产属于财产性强制措施，只能由法定机关依照法定程序实施，区块链信息服务提供者无权没收用户资产。","source":"《区块链信息服务管理规定》（国家互联网信息办公室令第3号）关于服务提供者处置违规使用者、保存记录并报告的规定","keyPoint":"平台只能警示、限功能、关账号；没收资产无权"},{"id":"第二部分专业题-二、密码前沿技术-多选题-35","no":35,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"针对区块链钱包的网络安全防护，以下哪些措施是有效的？（ ）","options":[{"key":"A","text":"使用硬件钱包（冷钱包）存储大额私钥"},{"key":"B","text":"定期备份助记词，并存储在云端加密保险箱"},{"key":"C","text":"在交易签名前，对交易内容进行二次确认（如显示完整接收地址）"},{"key":"D","text":"避免使用同一地址多次接收转账，以增强隐私保护"}],"answer":"ACD","analysis":"本题考查钱包私钥与交易安全的防护要点。大额私钥放进硬件冷钱包，使私钥始终不触网，能有效抵御木马与远程窃取；签名前核对完整接收地址和金额，可防地址替换型恶意软件与钓鱼；避免地址复用，可降低链上分析把多笔交易关联到同一主体的可能。助记词是私钥的等价物，一旦上云就等于把资产控制权交给了云服务商与账号体系，云端“加密保险箱”被攻破、账号被盗或服务商跑路的案例屡见不鲜，业界通行做法是离线多点备份。","correctReason":"A、C、D分别从私钥隔离存储、交易内容二次确认、地址不复用三个层面降低了私钥泄露、交易被篡改与隐私泄露的风险，是公认有效做法。","wrongReason":"B：助记词等同私钥，上传云端会显著扩大攻击面（账号被盗、云服务被攻破、内部人员窃取），正确做法是离线介质多点备份并妥善保管。","source":"区块链钱包安全通用实践；密钥与敏感数据保护可参见 GB/T 39786-2021 关于密钥全生命周期的要求","keyPoint":"助记词=私钥，严禁联网存储；冷钱包+地址核对是硬要求"},{"id":"第二部分专业题-二、密码前沿技术-多选题-36","no":36,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"某大型金融机构计划在2030 年前将其公钥基础设施（PKI）迁移至抗量子密 码体系。安全总监查阅了Shor 算法的最新工程实现文献。关于Shor 算法对现行 密码体制的实际威胁，以下描述正确的有（ ）。","options":[{"key":"A","text":"破解2048 位RSA 密钥，在理想逻辑量子比特下约需数千万次量子门操作， 且所需逻辑量子比特数约为密钥长度的两倍（约4096 个）。"},{"key":"B","text":"Shor 算法在量子计算模型下解决整数分解问题的时间复杂度相对于密钥长度 是亚指数级的，因此其威胁远大于经典计算下的指数级攻击。"},{"key":"C","text":"攻击同等安全强度（128bit 安全）的椭圆曲线密码（ECC-256）时，Shor 算 法所需的逻辑量子比特数通常少于攻击RSA-2048 所需的数目。"},{"key":"D","text":"Shor 算法的核心数学变换依赖于量子傅里叶变换（QFT）来寻找周期，该周 期寻找能力对离散对数问题同样有效，因此对DSA 和ECDSA 签名体制构成同 等威胁。"}],"answer":"ACD","analysis":"本题考查Shor算法威胁的正确量级判断。Shor算法用量子傅里叶变换找周期，对整数分解与离散对数同样有效，因此RSA、DSA、ECDSA、DH等体制一并失效，D正确；其量子线路的比特数与门数随模数规模增长，破解RSA-2048需要数千个逻辑量子比特与数千万至上亿次量子门操作，A的量级描述与主流工程估计一致；同等128比特安全强度下，ECC-256的群运算规模小得多，所需逻辑量子比特数明显少于RSA-2048，C正确。","correctReason":"A、C、D在威胁机制、资源量级和受影响体制三方面都与Shor算法的公认结论一致；B错在时间复杂度定性错误。","wrongReason":"B：Shor算法在量子计算模型下对整数分解是多项式时间（密钥长度多项式），并非亚指数级；且经典最优攻击（数域筛法）才是亚指数级，表述完全颠倒。","source":"Shor量子算法与后量子密码迁移通用知识；迁移要求可参见 GB/T 39786-2021、GM/T 0133-2023 相关安全要求","keyPoint":"Shor是多项式时间，RSA/DSA/ECC全危；ECC所需比特数更少"},{"id":"第二部分专业题-二、密码前沿技术-多选题-37","no":37,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"某科研机构正在评估容错量子计算机（FTQC）的工程可行性。工程师指出， 现有的超导量子比特退相干时间极短。关于量子纠错码（QECC）与表面码 （SurfaceCode）的特性，下列说法正确的有（ ）。","options":[{"key":"A","text":"表面码的容错阈值约为1%，这意味着物理量子比特的错误率必须低于该阈 值，增加码距（Distance）可同时提升纠错能力和降低逻辑错误率。"},{"key":"B","text":"在表面码中，逻辑量子比特的数量远远大于物理量子比特的数量（即Overhead <1），因此工程上容易实现大规模量子计算。"},{"key":"C","text":"量子纠错面临“错误简并”问题（不同的Pauli 错误导致相同的测量症状）， 这是经典纠错中不存在的独特挑战。"},{"key":"D","text":"为运行Shor 算法分解2048 位RSA，若物理量子比特门保真度为99.9%，通
