本题网站首页被非法篡改，虽未泄露数据，但系统完整性、页面真实性被破坏，仍属网络攻击事件。信息内容安全事件强调的是信息内容本身违法违规传播，与本题“页面被攻击篡改”的着眼点不同，注意区分。","correctReason":"网页被篡改是利用网络攻击手段破坏系统完整性的典型表现，应按网络攻击事件归类（本题答案以官方为准）。","wrongReason":"B：信息内容安全事件指违法有害信息内容本身的制作、传播，本题落点是网页被篡改的攻击行为；C：数据安全事件以数据泄露、被窃取或破坏为核心，题干已说明未泄露数据；D：违规操作事件指内部人员不按规定操作，本题是外部攻击。","source":"GB/T 20986-2023《信息安全技术 网络安全事件分类分级指南》事件分类","keyPoint":"网页篡改归网络攻击事件，看行为成因不看内容后果"},{"id":"第二部分专业题-三、标准题-单选题-64","no":64,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"依据GM/T0009-2023《SM2 密码算法使用规范》，使用SM2 密码算法对数 据进行加密的过程中调用了（ ）密码算法。","options":[{"key":"A","text":"SM1"},{"key":"B","text":"SM3"},{"key":"C","text":"SM4"},{"key":"D","text":"ZUC"}],"answer":"B","analysis":"SM2公钥加密的数据处理分三步：先取随机数k计算椭圆曲线点C1；再计算共享点并用KDF导出密钥，KDF内部就是对共享点坐标做SM3杂凑迭代；最后用该密钥流异或明文并用SM3生成C3校验值。所以整个加密过程反复调用了SM3杂凑算法，SM2的实际实现离不开杂凑。","correctReason":"SM2加密的密钥派生（KDF）和完整性校验值C3均基于SM3杂凑算法，故调用了SM3。","wrongReason":"A：SM1是对称分组密码，SM2加密流程中不使用；C：SM4也是对称分组密码，与SM2公钥加密机制无关；D：ZUC是序列密码，用于机密性与完整性算法（如128-EEA3/128-EIA3），不参与SM2加密。","source":"GM/T 0009-2023《SM2密码算法使用规范》数据加密处理流程","keyPoint":"SM2加密=曲线点+SM3派生密钥+SM3算C3"},{"id":"第二部分专业题-三、标准题-单选题-65","no":65,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"依据GM/T0009-2023《SM2 密码算法使用规范》，若n 为SM2 椭圆曲线的 阶，下列选项中（ ）属于合规的私钥取值。","options":[{"key":"A","text":"n"},{"key":"B","text":"2n"},{"key":"C","text":"n-1"},{"key":"D","text":"n-2"}],"answer":"D","analysis":"SM2签名与加密的私钥d必须满足1≤d≤n-2，即取值落在正整数区间且比阶n小2以上。n、2n都远大于或等于n，n-1超出上限，只有n-2恰好在允许范围内。记住这个上界是因为算法推导中需要保证r+k与n的关系成立，避免出现退化情况。","correctReason":"SM2要求私钥d∈[1,n-2]，四项中只有n-2满足该区间。","wrongReason":"A：d=n会使私钥等价于0，公开点dG为无穷远点，非法；B：d=2n超出阶的整数范围，非法；C：d=n-1超出标准规定的上限n-2，非法。","source":"GM/T 0009-2023《SM2密码算法使用规范》密钥取值要求","keyPoint":"SM2私钥区间1≤d≤n-2，上限是n-2不是n-1"},{"id":"第二部分专业题-三、标准题-单选题-66","no":66,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"依据GM/T0133-2024《关键信息基础设施密码应用要求》，下列关于密钥管 理要求描述不正确的是（ ）。","options":[{"key":"A","text":"应保证密钥数据生命周期的安全性，确保公钥及其他密钥不被非授权访问、使 用、泄露、修改和替换"},{"key":"B","text":"应根据密钥管理策略进行密钥使用，保证不同业务应用、不同类型和级别的数 据使用不同的密钥"},{"key":"C","text":"应根据密钥管理策略执行密钥更新"},{"key":"D","text":"应根据密钥管理策略执行密钥备份，保证密钥的可用性"}],"answer":"A","analysis":"密钥管理的核心是使用、更新、备份、销毁等全生命周期受控：要按业务应用、数据类型和级别分隔密钥，按策略更新与备份以保证可用性。A项把“保密性保护”硬套到密钥上并要求公钥不被非授权访问，表述明显失当——公钥本就需要公开分发，其保护重点是真实性和防篡改、防替换，而不是防访问、防泄露。","correctReason":"A项要求公钥不被非授权访问、泄露，与公钥可公开分发的性质相矛盾，属描述不正确。","wrongReason":"B：按业务应用、数据类型和级别使用不同密钥是密钥分隔的基本策略；C：按策略执行密钥更新是标准明确要求；D：按策略备份密钥以保证可用性同样是标准要求。","source":"GM/T 0133-2024《关键信息基础设施密码应用要求》密钥管理要求","keyPoint":"公钥公开、私钥保密，密钥要分隔、更新、备份"},{"id":"第二部分专业题-三、标准题-单选题-67","no":67,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"GM/T0133-2024《关键信息基础设施密码应用要求》中明确了攻防对抗演习 具体内容，包括但不限于分析识别密码应用脆弱性，开展验证或模拟攻击和防御， 下列选项中不属于密码应用脆弱性问题的是（ ）。","options":[{"key":"A","text":"密码功能被旁路问题"},{"key":"B","text":"密码设备冗余部署问题"},{"key":"C","text":"密码产品和服务错误配置问题"},{"key":"D","text":"用户非法操作导致的问题"}],"answer":"B","analysis":"密码应用脆弱性指容易被攻击者利用的薄弱环节，典型表现是密码功能被旁路绕过、密码产品和服务的错误配置、用户非法操作导致密码保护失效等。密码设备的冗余部署（如双机热备、多机冗余）是提高可靠性和容错能力的增强措施，属于保护手段而非可被利用的弱点。","correctReason":"冗余部署提升的是可靠性与容错能力，不会因冗余而形成可被利用的薄弱点，故不属于脆弱性问题。","wrongReason":"A：密码功能被旁路会使保护形同虚设，是典型脆弱性；C：密码产品和服务错误配置是标准列举的高发脆弱性；D：用户非法操作导致的问题同样属于脆弱性来源。","source":"GM/T 0133-2024《关键信息基础设施密码应用要求》攻防对抗演习相关要求","keyPoint":"冗余部署是容错增强，不是脆弱性"},{"id":"第二部分专业题-三、标准题-单选题-68","no":68,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"GM/T0014-2023《数字证书认证系统密码协议规范》描述了CA.KMC.LDAP 等公钥基础设施（PKI）之间的连接。PKI 主要用于解决什么问题（ ）。","options":[{"key":"A","text":"私钥的机密保护"},{"key":"B","text":"公钥属于谁"},{"key":"C","text":"非对称密码算法的实现"},{"key":"D","text":"公钥的机密性保护"}],"answer":"B","analysis":"PKI通过可信第三方CA签发数字证书，把公钥与持有者身份、属性绑定起来，并可逐级验证信任链，解决“这个公钥到底属于谁”的问题，从而支撑加密与验签。私钥的保护靠持有者自身的密码设备和管理措施，公钥本身不需要保密，PKI也不负责非对称算法本身的实现。","correctReason":"数字证书把公钥与身份绑定，PKI要解决的就是公钥与持有者身份的对应关系问题。","wrongReason":"A：私钥机密保护由密钥载体和使用者管理措施解决，不是PKI的目标；C：非对称算法的实现属于密码产品/算法层面，与PKI职能无关；D：公钥本身公开，无需机密性保护。","source":"GM/T 0014-2023《数字证书认证系统密码协议规范》","keyPoint":"PKI解决“公钥属于谁”，靠证书绑定身份"},{"id":"第二部分专业题-三、标准题-单选题-69","no":69,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"某电商平台在处理用户订单信息时，使用 SM3 算法生成摘要。依据 GM/T 0004-2012《SM3 密码杂凑算法》，SM3 算法生成的消息摘要长度是多少？（ ）","options":[{"key":"A","text":"128 位"},{"key":"B","text":"256 位"},{"key":"C","text":"512 位"},{"key":"D","text":"1024 位"}],"answer":"B","analysis":"SM3是我国自主设计的密码杂凑算法，输入任意长度消息，输出固定256比特（32字节）的杂凑值，抗碰撞强度约128比特，与SHA-256同级。分组长度为512比特，因此512、1024是国家标准里“分组”的数值，不是摘要长度，极易混淆。","correctReason":"GM/T 0004-2012规定SM3的输出（消息摘要）为256比特。","wrongReason":"A：128位是SM3抗碰撞强度的量级，不是摘要长度；C：512比特是SM3处理的消息分组长度；D：1024比特不是SM3的任何输出参数。","source":"GM/T 0004-2012《SM3密码杂凑算法》","keyPoint":"SM3：摘出256位、分组512位"},{"id":"第二部分专业题-三、标准题-单选题-70","no":70,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"某互联网公司需要向电子认证服务使用密码许可单位采购数字证书，用于部 署站点证书。根据GM/T0014-2023《数字证书认证系统密码协议规范》，在数 字证书认证系统协议流程中，下列关于CA 的说法错误的是（ ）。","options":[{"key":"A","text":"向KM 申请加密密钥对"},{"key":"B","text":"签发签名证书"},{"key":"C","text":"签发加密证书"},{"key":"D","text":"自己生成加密密钥对"}],"answer":"D","analysis":"数字证书认证系统普遍采用双证书机制，签名密钥对由用户端生成（私钥不出设备），加密密钥对则由密钥管理机构（KM/KMC）生成并安全下发，以保证加密私钥的合规托管与恢复能力。因此CA在协议流程中向KM申请加密密钥对，而不会自己生成加密密钥对。","correctReason":"加密密钥对由密钥管理机构（KM）生成和管理，CA只能向KM申请，故D项“自己生成加密密钥对”错误。","wrongReason":"A：CA按协议向KM申请加密密钥对，说法正确；B：签发签名证书是CA的基本职能，说法正确；C：签发加密证书同样是CA的职能，说法正确。","source":"GM/T 0014-2023《数字证书认证系统密码协议规范》","keyPoint":"签名密钥用户自生成，加密密钥由KM生成"},{"id":"第二部分专业题-三、标准题-单选题-71","no":71,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"管理员为新采购的一批未激活令牌进行启用操作，过程中验证了令牌生成的 动态口令，操作完成后令牌状态变为 “就绪”。依据GM/T0021-2023《动态口 令密码应用技术规范》，该操作属于（ ）。","options":[{"key":"A","text":"锁定"},{"key":"B","text":"激活"},{"key":"C","text":"挂起"},{"key":"D","text":"废止"}],"answer":"B","analysis":"动态口令令牌的生命周期通常包括未初始化（未激活）、激活（就绪/可用）、挂起、锁定、废止等状态。激活是指把新令牌从初始状态转为可用状态，过程中需要用令牌当前产生的动态口令完成校验，确认令牌与系统种子一致；本题描述与该操作完全吻合。","correctReason":"校验令牌生成的动态口令后使令牌转为“就绪”，符合激活操作的定义。","wrongReason":"A：锁定是令牌因多次认证失败等原因被停止使用；C：挂起是临时停用，可恢复但不可认证；D：废止是永久停用并销毁令牌。","source":"GM/T 0021-2023《动态口令密码应用技术规范》令牌状态与操作","keyPoint":"令牌状态：未激活→激活就绪→挂起/锁定→废止"},{"id":"第二部分专业题-三、标准题-单选题-72","no":72,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"依据GM/T0001.3-2012《祖冲之序列密码算法 第3 部分：基于祖冲之算法的 完整性算法》，在128-EIA3 完整性算法中，消息认证码（MAC）的长度被定义 为32 比特。若某条信令消息的长度为1000 比特，为计算其MAC 值，ZUC 算法 需要产生的密钥字总数L 是多少？（ ）","options":[{"key":"A","text":"32"},{"key":"B","text":"33"},{"key":"C","text":"34"},{"key":"D","text":"35"}],"answer":"C","analysis":"128-EIA3先按规则对消息补齐（先补一个1比特，再补若干0比特）后以其比特长度计算所需密钥字个数，还要额外产生用于MAC计算的字，故公式为L=ceil((消息长度+1)/32)+1。消息长1000比特时，ceil(1001/32)=32，再加1字共34个密钥字。按官方答案选34。","correctReason":"标准算法在生成密钥流后还额外产生MAC所需的密钥字，L=⌈(1000+1)/32⌉+1=34。","wrongReason":"A：32只够消息最长前缀按字补齐的数量（⌈1000/32⌉），未含补齐与MAC所需字；B：33漏算了末尾额外产生的密钥字；D：35多算一个字，结果偏大。","source":"GM/T 0001.3-2012《祖冲之序列密码算法 第3部分：基于祖冲之算法的完整性算法》","keyPoint":"128-EIA3：L=⌈(长度+1)/32⌉+1"},{"id":"第二部分专业题-三、标准题-单选题-73","no":73,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"根据GM/T0003.2-2012《SM2 椭圆曲线公钥密码算法 第2 部分：数字签名算 法》，在SM2 签名生成过程中，若计算出的r=0 或r+k=n，应如何处理？（ ）","options":[{"key":"A","text":"直接输出签名"},{"key":"B","text":"重新生成随机数k"},{"key":"C","text":"更换私钥"},{"key":"D","text":"更换公钥"}],"answer":"B","analysis":"SM2签名先取随机数k，算出r=(e+x1) mod n，再求s；标准明确规定，若r=0或r+k=n，说明本轮计算结果无效，必须重新生成随机数k重新计算，而不能在此基础上强行出签名。私钥和公钥与单次签名失败无关，更不可能因此更换。","correctReason":"标准规定r=0或r+k=n时本轮签名值不合法，须重新取随机数k重算。","wrongReason":"A：此时r或s不合法，直接输出会破坏签名安全性；C：与单次签名计算失败无关，私钥不应更换；D：更换公钥更无依据。","source":"GM/T 0003.2-2012《SM2椭圆曲线公钥密码算法 第2部分：数字签名算法》签名生成流程","keyPoint":"SM2签名r=0或r+k=n，重取k重算"},{"id":"第二部分专业题-三、标准题-单选题-74","no":74,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"依据GM/T0001.1-2012《祖冲之序列密码算法 第1 部分：算法描述》，ZUC 算法中，线性反馈移位寄存器（LFSR）的每个寄存器单元的长度是多少比特？ （ ）","options":[{"key":"A","text":"16 比特"},{"key":"B","text":"31 比特"},{"key":"C","text":"32 比特"},{"key":"D","text":"128 比特"}],"answer":"B","analysis":"ZUC由三层构成：31比特字构成的线性反馈移位寄存器（LFSR）、比特重组（BR）和非线性函数F。LFSR共16个寄存器单元s0~s15，每个单元是定义在素域GF(2^31-1)上的31比特字，其本原多项式也决定了大周期。16、32、128都不是单个单元的长度。","correctReason":"ZUC的LFSR由16个31比特寄存器单元组成，每个单元长度为31比特。","wrongReason":"A：16比特是分组密码常见单元长度，不是ZUC的LFSR单元；C：32比特是密钥字/输出字的长度而非寄存器单元长度；D：128比特是密钥和IV的总长度。","source":"GM/T 0001.1-2012《祖冲之序列密码算法 第1部分：算法描述》","keyPoint":"ZUC：16个31比特LFSR单元，密钥与IV各128位"},{"id":"第二部分专业题-三、标准题-单选题-75","no":75,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"依据GM/T0001.2-2012《祖冲之序列密码算法 第2 部分：基于祖冲之算法的 机密性算法》，机密性算法需要生成一定长度的密钥流来对明文进行加解密。若 需要加密一段长度为253 比特的明文消息流（IBS），则至少需要生成多少个32 比特的密钥字？（ ）","options":[{"key":"A","text":"7 个"},{"key":"B","text":"8 个"},{"key":"C","text":"9 个"},{"key":"D","text":"10 个"}],"answer":"B","analysis":"机密性算法用密钥流逐比特异或明文，密钥字为32比特，消息末尾不足一个字的部分只需丢弃多余的密钥流比特即可。253比特消息需要⌈253/32⌉=8个密钥字（8×32=256比特）才能完全覆盖，故至少生成8个。","correctReason":"按32比特向上取整：⌈253/32⌉=8，8个密钥字共256比特足以覆盖253比特明文。","wrongReason":"A：7个字仅224比特，覆盖不了253比特；C：9个字虽够用但已超出“至少”的需求；D：10个字明显多于所需密钥字。","source":"GM/T 0001.2-2012《祖冲之序列密码算法 第2部分：基于祖冲之算法的机密性算法》","keyPoint":"密钥字数=⌈明文比特数/32⌉，末尾多余比特丢弃"},{"id":"第二部分专业题-三、标准题-单选题-76","no":76,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"依据GM/T0001.2-2012《祖冲之序列密码算法 第2 部分：基于祖冲之算法的 机密性算法》，机密性算法的输出OBS 是如何得到的？（ ）","options":[{"key":"A","text":"OBS=IBS ⊕KEY"},{"key":"B","text":"OBS=IBS ⊕IV"},{"key":"C","text":"OBS=IBS ⊕ 密钥流k"},{"key":"D","text":"OBS=IBS ⊕COUNT"}],"answer":"C","analysis":"基于祖冲之算法的机密性算法属于序列密码：算法产生与消息等长的密钥流k，加密时密文OBS=明文IBS⊕密钥流k，解密时明文=密文⊕同一密钥流，天然对称。KEY和IV只是算法的初始密钥与初始向量，COUNT是计数输入，它们参与初始化而不能直接与明文异或。","correctReason":"序列密码的输出是明文与密钥流逐比特异或，OBS=IBS⊕密钥流k。","wrongReason":"A：KEY是算法输入密钥，不直接与明文异或；B：IV只参与初始化产生密钥流；D：COUNT是计数输入，也不是直接参与异或的密钥流。","source":"GM/T 0001.2-2012《祖冲之序列密码算法 第2部分：基于祖冲之算法的机密性算法》","keyPoint":"序列密码=明文⊕密钥流，加解密同一操作"},{"id":"第二部分专业题-三、标准题-单选题-77","no":77,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"依据GM/T0001.4-2024《祖冲之序列密码算法 第4 部分鉴别式加密机制》， ZUC-GXM 机制中，要求初始向量IV 具备什么特性？（ ）","options":[{"key":"A","text":"可重复使用"},{"key":"B","text":"必须为全0"},{"key":"C","text":"不应重复使用"},{"key":"D","text":"必须为随机数"}],"answer":"C","analysis":"ZUC-GXM是鉴别式加密机制，同一密钥下若IV重复，密钥流就会重复，攻击者可利用两次密文的异或消去密钥流、还原明文，认证能力也会被削弱。因此标准要求IV不应重复使用；IV可以是全0或随机值，但必须保证不重复，随机并不等于安全。","correctReason":"标准要求在同一密钥下IV不应重复，以避免密钥流重复导致机密性与完整性失效。","wrongReason":"A：可重复使用会直接导致密钥流复用，是严重误用；B：IV无需限定为全0，全0只影响初始化的取值形式；D：IV只要是合法取值且不重复即可，并非必须是随机数。","source":"GM/T 0001.4-2024《祖冲之序列密码算法 第4部分：鉴别式加密机制》","keyPoint":"同一密钥下IV/Nonce绝不重复"},{"id":"第二部分专业题-三、标准题-单选题-78","no":78,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"我国商用密码标准中的密码杂凑算法是SM3 算法，目前已被广泛被使用于各 个领域。依据GM/T0004-2012《SM3 密码杂凑算法》，SM3 的压缩函数每次处 理的消息分组长度是多少？（ ）","options":[{"key":"A","text":"512 比特"},{"key":"B","text":"256 比特"},{"key":"C","text":"1024 比特"},{"key":"D","text":"128 比特"}],"answer":"A","analysis":"SM3采用Merkle-Damgård迭代结构，先把消息填充到512比特的整数倍，压缩函数每轮处理一个512比特的分组，用8个32比特寄存器（共256比特）迭代更新，最终输出256比特杂凑值。本题问的是“每次处理的消息分组长度”，因此是512比特，不要与输出长度256比特混淆。","correctReason":"SM3的压缩函数每次处理一个512比特消息分组，故答案为512比特。","wrongReason":"B：256比特是SM3的摘要输出长度，不是分组长度；C：1024比特是SHA-512等算法的分组长度；D：128比特是MD5的摘要长度，与SM3无关。","source":"GM/T 0004-2012《SM3密码杂凑算法》","keyPoint":"SM3分组512位、输出256位、迭代64轮"},{"id":"第二部分专业题-三、标准题-单选题-79","no":79,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"SM4 算法的轮函数F 的结构中，根据GM/T0002-2012《SM4 分组密码算法》， 哪一步是合成置换T 的作用？（ ）","options":[{"key":"A","text":"异或轮密钥"},{"key":"B","text":"循环左移"},{"key":"C","text":"S 盒替换"},{"key":"D","text":"线性变换 L"}],"answer":"D","analysis":"SM4轮函数F由三部分串联：先做异或轮密钥的密钥加，再做合成置换T。合成置换T又由非线性变换τ和线性变换L复合而成，τ对4个字节并行做S盒替换，L再做循环移位与异或扩散。所以整体上T对应“S盒替换＋线性变换L”，而“循环左移”只是L内部的一步，不是T的整体作用。","correctReason":"T=τ（S盒替换）后接线性变换L，其作用是把S盒替换与线性扩散合成为一步置换。","wrongReason":"A：异或轮密钥发生在T之前，不属于T；B：循环左移只是线性变换L内部的具体步骤，单独说“循环左移”不完整；C：S盒替换只是T中的非线性变换τ，缺少线性变换L。","source":"GM/T 0002-2012《SM4分组密码算法》轮函数与合成置换T","keyPoint":"SM4轮函数：轮密钥加→S盒替换→线性变换L"},{"id":"第二部分专业题-三、标准题-单选题-80","no":80,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"依据GM/T0003.4-2012《SM2 椭圆曲线公钥密码算法 第4 部分：公钥加密算 法》，密文C 的格式为以下哪三种数据的拼接？（ ）","options":[{"key":"A","text":"C1||C2||C3"},{"key":"B","text":"C1||C3||C2"},{"key":"C","text":"C2||C1||C3"},{"key":"D","text":"C3||C1||C2"}],"answer":"B","analysis":"SM2公钥加密输出的密文由三部分组成：C1是椭圆曲线点（随机数k与基点G的乘积），C3是用于完整性校验的杂凑值，C2是明文异或派生密钥后的密文数据。按现行标准，密文的拼接顺序是C1||C3||C2，与早期规范中的C1||C2||C3顺序不同。","correctReason":"GM/T 0003.4-2012规定的密文格式为C1||C3||C2。","wrongReason":"A：C1||C2||C3是早期使用的顺序，不符合本题依据的现行标准；C、D：把C2或C3放在最前面的排列均与标准规定的拼接顺序不符。","source":"GM/T 0003.4-2012《SM2椭圆曲线公钥密码算法 第4部分：公钥加密算法》","keyPoint":"现行SM2密文顺序C1||C3||C2"},{"id":"第二部分专业题-三、标准题-单选题-81","no":81,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"依据GM/T0003.5-2012《SM2 椭圆曲线公钥密码算法 第5 部分：参数定义》 SM2 推荐使用的椭圆曲线是定义在什么域上的？（ ）","options":[{"key":"A","text":"二进制域"},{"key":"B","text":"素数域"},{"key":"C","text":"扩展域"},{"key":"D","text":"复合域"}],"answer":"B","analysis":"SM2推荐曲线定义在256比特的素数域Fp上，其中p=FFFFFFFE FFFFFFFF FFFFFFFF FFFFFFFF FFFFFFFF 00000000 FFFFFFFF FFFFFFFF，因而可以使用高效的模约减运算。二进制域（GF(2^m)）虽也是常见的椭圆曲线平台，但并非SM2的推荐选择，扩展域、复合域更不是。","correctReason":"GM/T 0003.5-2012给出的SM2推荐曲线参数定义在256位素数域上。","wrongReason":"A：二进制域是部分椭圆曲线密码的实现平台，不是SM2推荐域；C、D：扩展域、复合域是密码学中的域扩张概念，与SM2参数定义无关。","source":"GM/T 0003.5-2012《SM2椭圆曲线公钥密码算法 第5部分：参数定义》","keyPoint":"SM2曲线在256位素数域Fp上，p为SM2推荐素域参数"},{"id":"第二部分专业题-三、标准题-单选题-82","no":82,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"某科技公司计划对其生产的密码产品依据GM/T0028-2024《密码模块安全技 术要求》进行评级。其中，（ ）级的密码模块密码边界内的所有软件和固件应 当使用核准的数字签名进行保护。","options":[{"key":"A","text":"1 和2"},{"key":"B","text":"2 和4"},{"key":"C","text":"2 和3"},{"key":"D","text":"3 和4"}],"answer":"D","analysis":"GM/T 0028-2024按安全一级到四级递进提出要求，其中对密码边界内软件和固件的完整性保护，等级越高越严格：三级和四级要求所有软件、固件都必须用核准的数字签名保护，以便模块启动或加载时验证真伪；一级、二级不做此强制要求或要求较弱。","correctReason":"标准规定三级和四级模块密码边界内的所有软件和固件应当使用核准的数字签名进行保护。","wrongReason":"A、C：一级和二级模块没有“所有软件固件必须签名保护”的强制要求；B：组合中混入了二级，不符合标准规定的等级范围。","source":"GM/T 0028-2024《密码模块安全技术要求》软件/固件完整性保护要求","keyPoint":"软件固件签名保护是三级、四级的强制要求"},{"id":"第二部分专业题-三、标准题-单选题-83","no":83,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"依据GM/T0039-2024《密码模块安全检测要求》，密码模块在哪种状态下应 禁止通过“数据输出接口”输出数据？（ ）","options":[{"key":"A","text":"正常运行状态"},{"key":"B","text":"自测试通过后"},{"key":"C","text":"执行手动输入或处于错误状态时"},{"key":"D","text":"密码主管角色登录时"}],"answer":"C","analysis":"密码模块只有在完成运行前自测试并处于正常状态时才允许对外输出数据。当模块处于执行手动输入（如人工按键输入密钥分量）或错误状态时，说明工作流程未完成或已发生故障，此时必须禁止通过数据输出接口输出数据，防止未经验证或被旁路的数据被使用。","correctReason":"标准规定执行手动输入或处于错误状态时应禁止数据输出接口输出数据。","wrongReason":"A：正常运行状态允许按接口规定输出数据；B：自测试通过后模块状态正常，可以输出；D：密码主管登录属于正常操作状态，不构成禁止输出的条件。","source":"GM/T 0039-2024《密码模块安全检测要求》数据输出接口与状态要求","keyPoint":"手动输入中或错误状态下禁止数据输出"},{"id":"第二部分专业题-三、标准题-单选题-84","no":84,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"根据GM/T0039-2024《密码模块安全检测要求》，密码模块的可信信道必须 具备哪种特性？（ ）","options":[{"key":"A","text":"允许通过公共网络传输明文密钥分量"},{"key":"B","text":"所使用的物理端口应与其他物理端口实现物理隔离"},{"key":"C","text":"传输速度必须高于其他数据接口"},{"key":"D","text":"只能用于传输加密后的敏感安全参数"}],"answer":"B","analysis":"可信信道用于在模块与外部实体之间安全传递密钥等敏感安全参数，为防止通用数据端口上的访问和篡改，标准要求其使用的物理端口与其他物理端口实现物理隔离。可信信道本身还要提供保密性和完整性保护，绝不允许在公共网络上明文传输密钥分量。","correctReason":"标准要求可信信道所使用的物理端口与其他物理端口实现物理隔离。","wrongReason":"A：通过公共网络明文传输密钥分量正是可信信道要禁止的行为；C：可信信道关注的是隔离与安全，不以传输速率作为特性要求；D：仅传输密文并非充分条件，可信信道还须与其他端口物理隔离并保证完整性。","source":"GM/T 0039-2024《密码模块安全检测要求》可信信道要求","keyPoint":"可信信道＝专用物理隔离端口＋保密性与完整性"},{"id":"第二部分专业题-三、标准题-单选题-85","no":85,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"根据GM/T0039-2024《密码模块安全检测要求》，密码模块的运行前自测试 必须在何时完成？（ ）","options":[{"key":"A","text":"在操作员发出自测试命令后"},{"key":"B","text":"在密码模块提供任何数据输出之前"},{"key":"C","text":"在密码模块进入错误状态后"},{"key":"D","text":"在每日定时维护时段内"}],"answer":"B","analysis":"运行前自测试的目的是在模块投入服务前确认软硬件完好、算法实现正确，因此必须在模块提供任何数据输出之前完成。只有这样，外部实体拿到的第一个输出才是自测试通过后的可信结果；而自测试命令触发、错误状态恢复、定时维护时段都不是允许把自测留到输出之后的理由。","correctReason":"标准要求运行前自测试在密码模块提供任何数据输出之前完成。","wrongReason":"A：自测试是运行前的强制动作，不能等操作员下命令才做；C：进入错误状态说明已偏离正常流程，不能以此作为自测时机；D：定时维护时段与运行前自测试的时序要求无关。","source":"GM/T 0039-2024《密码模块安全检测要求》运行前自测试要求","keyPoint":"先自测试、后输出：任何数据输出之前完成"},{"id":"第二部分专业题-三、标准题-单选题-86","no":86,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"关于密码模块中敏感安全参数的置零，依据GM/T0039-2024《密码模块安全 检测要求》，下列哪项描述是正确的？（ ）","options":[{"key":"A","text":"可以使用另一个未受保护的敏感安全参数进行覆盖"},{"key":"B","text":"置零操作可以被高级用户中断"},{"key":"C","text":"置零应确保参数无法被恢复和重用"},{"key":"D","text":"仅需对明文形式的敏感安全参数进行置零"}],"answer":"C","analysis":"敏感安全参数（密钥、种子、口令等）在销毁或替换时必须彻底置零，标准要求覆盖或清除后参数无法被恢复、无法被重用。被覆盖的值不能是另一个未受保护的敏感参数，置零过程也不允许被用户中断，且无论是明文形式还是密文、中间值形式的相关数据都应按要求处理。","correctReason":"置零的目的是使参数不可恢复、不可重用，这是标准对敏感安全参数清除的核心要求。","wrongReason":"A：用另一个未受保护的敏感参数覆盖等于把秘密留在模块内，不合规；B：置零过程被中断会留下可恢复的残留数据；D：仅处理明文形式不充分，密文和中间值同样需要保护与清除。","source":"GM/T 0039-2024《密码模块安全检测要求》敏感安全参数置零要求","keyPoint":"置零要彻底、不可中断、不可恢复重用"},{"id":"第二部分专业题-三、标准题-单选题-87","no":87,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"依据GM/T0134-2024《密码模块安全设计指南》，（ ）必须使用可信信道 传输敏感信息。","options":[{"key":"A","text":"安全一级模块"},{"key":"B","text":"安全二级模块"},{"key":"C","text":"安全三级及以上模块"},{"key":"D","text":"所有模块均需使用"}],"answer":"C","analysis":"可信信道通过物理隔离的专用端口传递密钥等敏感信息，实现成本和管理要求都较高，因此标准按安全等级差异化要求：安全三级及以上模块必须使用可信信道传输敏感信息；一级、二级模块不做这一强制要求。记忆时抓住“等级越高、要求越严”这条主线即可。","correctReason":"标准规定安全三级及以上模块必须使用可信信道传输敏感信息。","wrongReason":"A、B：一级、二级模块没有使用可信信道的强制要求；D：并非所有模块都必须使用可信信道，与等级化要求不符。","source":"GM/T 0134-2024《密码模块安全设计指南》可信信道设计要求","keyPoint":"可信信道是三级及以上的强制要求"},{"id":"第二部分专业题-三、标准题-单选题-88","no":88,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"依据GM/T0134-2024《密码模块安全设计指南》，密码模块的运行前自测试 不包括以下哪项内容？（ ）","options":[{"key":"A","text":"软件/固件完整性测试"},{"key":"B","text":"旁路测试"},{"key":"C","text":"密码算法性能测试"},{"key":"D","text":"关键功能测试"}],"answer":"C","analysis":"密码模块的运行前自测试关注“是否完好、是否正确”，内容包括软件/固件完整性测试、旁路测试和关键功能测试（算法已知答案测试等）。密码算法性能测试衡量的是运算速度与吞吐，属于性能评价范畴，不是自测试要求的内容。","correctReason":"性能测试考察速度指标，不属于运行前自测试的测试项。","wrongReason":"A：软件/固件完整性测试是自测试的必测项；B：旁路测试用于检查关键功能是否可被绕过，属自测试内容；D：关键功能测试（如算法已知答案测试）同样是自测试内容。","source":"GM/T 0134-2024《密码模块安全设计指南》自测试设计要求","keyPoint":"自测试查完整性与正确性，不查性能"},{"id":"第二部分专业题-三、标准题-单选题-89","no":89,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"在GM/T0139-2024《信息系统密码应用安全管理体系》中，密码应用安全管 理体系遵循的管理循环是（ ）。","options":[{"key":"A","text":"SDLC"},{"key":"B","text":"PDCA"},{"key":"C","text":"DevOps"},{"key":"D","text":"Agile"}],"answer":"B","analysis":"密码应用安全管理体系借鉴成熟的管理方法论，采用PDCA（策划—实施—检查—改进）循环组织各项管理活动，使密码应用策略、制度、人员与运行管理不断迭代优化。SDLC、DevOps、Agile都是软件研发过程模型，不是该标准规定的管理体系循环。","correctReason":"标准明确密码应用安全管理体系遵循PDCA管理循环。","wrongReason":"A：SDLC是软件开发生命周期模型；C：DevOps是开发运维一体化实践；D：Agile是敏捷开发方法，三者均非管理体系循环。","source":"GM/T 0139-2024《信息系统密码应用安全管理体系》","keyPoint":"密码应用安全管理体系＝PDCA循环"},{"id":"第二部分专业题-三、标准题-单选题-90","no":90,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"GM/T0139-2024《信息系统密码应用安全管理体系》规定，密钥管理员与以 下哪个岗位不能兼任？（ ）","options":[{"key":"A","text":"密码操作员"},{"key":"B","text":"系统管理员"},{"key":"C","text":"密码安全审计员"},{"key":"D","text":"网络管理员"}],"answer":"C","analysis":"岗位职责分离是密码应用安全管理的基本要求：密钥管理员负责密钥的生成、分发、更新、销毁等操作，密码安全审计员负责对包括密钥操作在内的行为进行独立审计与监督。二者若由同一人担任，审计就失去独立性，因此明确规定密钥管理员不得兼任密码安全审计员。","correctReason":"为保证审计独立性，密钥管理员与密码安全审计员必须岗位分离、不得兼任。","wrongReason":"A：密码操作员与密钥管理员同属操作类岗位，标准未将其列为禁止兼任的对应关系；B：系统管理员不属于审计角色，不是本题指向的兼任禁忌岗位；D：网络管理员同样不是审计角色。","source":"GM/T 0139-2024《信息系统密码应用安全管理体系》岗位与职责要求","keyPoint":"密钥管理员≠密码安全审计员，审计必须独立"},{"id":"第二部分专业题-三、标准题-多选题-1","no":1,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"GB/T33560-2017《信息安全技术 密码应用标识规范》定义的标识中，包括 （ ）。","options":[{"key":"A","text":"算法标识"},{"key":"B","text":"密钥标识"},{"key":"C","text":"设备标识"},{"key":"D","text":"协议标识"}],"answer":"AD","analysis":"本题考查GB/T 33560-2017《信息安全技术 密码应用标识规范》所定义的标识体系。该标准围绕密码应用中的“用什么算法、按什么协议用”给出统一标识，因此算法标识（A）和协议标识（D）在规范范围之内。密钥标识、设备标识属于密码设备与密钥管理类标准（如GM/T 0006等）约定或另行规定的内容，不在本标准列举的密码应用标识之列。做题时注意区分“密码应用标识”与“密码设备/密钥标识”，不要凡是带“标识”二字的都选。","correctReason":"GB/T 33560-2017规范的密码应用标识只包括算法标识与协议标识两类。","wrongReason":"B：密钥标识属于密钥管理范畴，由相关密码标准另行规定，不在本标准标识之列；C：设备标识属于密码设备管理范畴，不是本标准规定的密码应用标识。","source":"GB/T 33560-2017《信息安全技术 密码应用标识规范》","keyPoint":"密码应用标识＝算法标识＋协议标识，密钥/设备标识不在此列。"},{"id":"第二部分专业题-三、标准题-多选题-2","no":2,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"某部门在部署基于SM2 密码算法的证书认证系统时，依据GM/T0034-2014 《基于SM2 密码算法的证书认证系统密码及其相关安全技术规范》，关于系统 中的安全管理，以下说法正确的有（ ）","options":[{"key":"A","text":"要设置不同级别的管理员，明确各自权限"},{"key":"B","text":"对管理员的操作要进行审计记录"},{"key":"C","text":"无需对系统进行安全漏洞检测"},{"key":"D","text":"定期对系统的安全策略进行评估和更新"}],"answer":"ABD","analysis":"本题考查GM/T 0034-2014对基于SM2的证书认证系统的安全管理要求。证书认证系统属于核心密码基础设施，其管理的关键是“分权制衡＋全程留痕＋持续改进”，即设置不同级别的管理员并明确权限、对管理员操作进行审计记录、定期评估并更新安全策略。选项C称“无需对系统进行安全漏洞检测”，明显与安全管理中持续检测与评估的原则相悖，属于典型的绝对化错误表述。","correctReason":"标准要求管理员分级授权、操作可审计，并定期对安全策略进行评估更新，故A、B、D成立。","wrongReason":"C：证书认证系统必须持续开展安全检测与风险评估，发现漏洞并及时修补，“无需检测”的表述错误。","source":"GM/T 0034-2014《基于SM2密码算法的证书认证系统密码及其相关安全技术规范》","keyPoint":"安全管理三件套：分级授权、操作审计、策略定期评估更新。"},{"id":"第二部分专业题-三、标准题-多选题-3","no":3,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"GB/T33560-2017《信息安全技术 密码应用标识规范》中，包括（ ）密钥操 作标识。","options":[{"key":"A","text":"密钥生成"},{"key":"B","text":"密钥分发"},{"key":"C","text":"密钥导入"},{"key":"D","text":"密钥销毁"}],"answer":"ABCD","analysis":"本题考查GB/T 33560-2017中密钥操作标识的覆盖范围。密钥全生命周期中的各类操作都需要被标识区分：产生环节有密钥生成，分发环节有密钥分发，从外部引入环节有密钥导入，生命周期结束时还有密钥销毁，四者都属于标准规定的密钥操作标识。因此本题四项全选。复习时要牢记密钥生命周期的完整链条：生成—存储—分发/导入—使用—更新—归档—销毁。","correctReason":"密钥生成、分发、导入、销毁均属密钥全生命周期中的操作环节，都被标准作为密钥操作标识加以定义。","wrongReason":"本题四项均为正确选项，无错误项；若把密钥销毁、密钥导入当成非标识内容而漏选，就会失分。","source":"GB/T 33560-2017《信息安全技术 密码应用标识规范》","keyPoint":"密钥操作标识覆盖生成、分发、导入、销毁等全生命周期操作。"},{"id":"第二部分专业题-三、标准题-多选题-4","no":4,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"GM/T0010-2023《SM2 密码算法加密签名消息语法规范》中规范了使用SM2 密码算法时相关的（ ）。","options":[{"key":"A","text":"加密和签名消息语法"},{"key":"B","text":"加密和签名操作结果的标准化封装"},{"key":"C","text":"对象标识符"},{"key":"D","text":"椭圆曲线参数语法"}],"answer":"ABCD","analysis":"本题考查GM/T 0010-2023《SM2密码算法加密签名消息语法规范》的内容范围。该标准把SM2的加密与签名操作结果统一封装成规范的消息语法，便于不同厂商设备互联互通，因此加密和签名消息语法、操作结果的标准化封装均在规范之内。为标识语法结构中的各个对象，标准还定义了相应的对象标识符（OID），并给出椭圆曲线参数语法。四者都是标准正文规定的内容，故全选。","correctReason":"该标准既规定SM2加密/签名消息语法与结果的标准化封装，也规定相关对象标识符和椭圆曲线参数语法。","wrongReason":"本题四项均为正确选项，无错误项；容易误判的是C、D，对象标识符与椭圆曲线参数语法同样是该标准规定的内容。","source":"GM/T 0010-2023《SM2密码算法加密签名消息语法规范》","keyPoint":"SM2消息语法标准＝语法＋封装＋OID＋曲线参数语法。"},{"id":"第二部分专业题-三、标准题-多选题-5","no":5,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"在GM/T0019-2023《通用密码服务接口规范》中，可用于信息机密性保护的 函数有（ ）。","options":[{"key":"A","text":"计算会话密钥"},{"key":"B","text":"单块加密运算"},{"key":"C","text":"结束解密运算"},{"key":"D","text":"多组数据消息鉴别码运算"}],"answer":"AB","analysis":"本题考查GM/T 0019-2023《通用密码服务接口规范》中用于机密性保护的函数。机密性靠“加密”实现，因此计算会话密钥（为对称加密提供密钥）和单块加密运算属于机密性保护函数。结束解密运算属于解密流程的收尾操作，对应的是数据还原而非机密性保护；多组数据消息鉴别码运算保障的是完整性，不是机密性。做题要建立“机密性—加密类函数，完整性—MAC/杂凑类函数”的对应关系。","correctReason":"会话密钥计算为加密提供密钥，单块加密运算直接实现数据加密，二者服务于信息机密性保护。","wrongReason":"C：结束解密运算属于解密过程的结束操作，是解密的收尾而非机密性保护的加密功能；D：多组数据消息鉴别码运算用于完整性校验与身份鉴别，不提供机密性。","source":"GM/T 0019-2023《通用密码服务接口规范》","keyPoint":"机密性靠加密函数，完整性靠MAC/杂凑，别混淆。"},{"id":"第二部分专业题-三、标准题-多选题-6","no":6,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"依据GB/T20984-2022《信息安全技术 信息安全风险评估方法》中关于风险 评估基本要素之间的关系，描述正确的是（ ）。","options":[{"key":"A","text":"风险要素的核心是资产，而资产存在脆弱性"},{"key":"B","text":"安全措施的实施通过降低资产脆弱性被利用难易程度，抵御外部威胁"},{"key":"C","text":"脆弱性通过利用资产存在的威胁导致风险"},{"key":"D","text":"风险转化成安全事件后，会对资产的运行状态产生影响"}],"answer":"ABD","analysis":"本题考查GB/T 20984-2022中风险评估基本要素的相互关系。标准的核心逻辑是：资产是风险要素的核心，资产本身存在脆弱性；威胁利用脆弱性才能得逞，而安全措施通过降低脆弱性被利用的难易程度来抵御威胁；风险一旦转化为安全事件，就会影响资产的运行状态。选项C把关系说反了，正确的表述是“威胁利用资产的脆弱性导致风险”，而非“脆弱性利用威胁”。区分“威胁利用脆弱性”的方向是本题的关键易混点。","correctReason":"标准明确资产处于核心地位并具有脆弱性，安全措施降低脆弱性被利用的难易程度以抵御威胁，风险转化为事件后影响资产运行状态。","wrongReason":"C：要素关系表述颠倒，应为威胁利用资产的脆弱性导致风险，而不是脆弱性利用威胁。","source":"GB/T 20984-2022《信息安全技术 信息安全风险评估方法》","keyPoint":"资产是核心，威胁利用脆弱性致风险，安全措施降脆弱性。"},{"id":"第二部分专业题-三、标准题-多选题-7","no":7,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"参照GM/T0024-2023《SSLVPN 技术规范》实现的SSL 协议，以下说法正确 的是（ ）。","options":[{"key":"A","text":"Hello 消息中，双方交换的随机数用于派生出主密钥"},{"key":"B","text":"对服务端进行身份鉴别时采用数字签名方式，若密钥交换方式为ECDHE，则 签名数据中包含有服务端密钥交换参数"},{"key":"C","text":"IBC_SM4_SM3 密码套件中采用SM9 算法实现身份鉴别"},{"key":"D","text":"生成密钥的PRF 算法可用SM3 实现"}],"answer":"ABCD","analysis":"本题考查GM/T 0024-2023《SSLVPN技术规范》中SSL协议的关键机制。握手Hello消息中双方交换的随机数参与主密钥派生；服务端身份鉴别用数字签名实现，以ECDHE为密钥交换方式时，被签名的数据中会包含服务端密钥交换参数，从而绑定本次会话、防中间人重放；IBC_SM4_SM3套件中用SM9标识密码算法完成身份鉴别；生成密钥的PRF可由SM3实现。四项均符合规范规定。","correctReason":"标准规定Hello随机数用于派生主密钥，ECDHE下签名覆盖服务端密钥交换参数，IBC套件用SM9做身份鉴别，PRF可由SM3实现。","wrongReason":"本题四项均为正确选项，无错误项；最易误判的是B和C，需牢记ECDHE下签名数据包含服务端密钥交换参数、IBC套件基于SM9实现身份鉴别。","source":"GM/T 0024-2023《SSLVPN技术规范》","keyPoint":"SM9做标识鉴别、SM3可作PRF、签名绑定密钥交换参数。"},{"id":"第二部分专业题-三、标准题-多选题-8","no":8,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"根据GM/T0005-2021《随机性检测规范》，若指定样本数量是1000，以下通 过测试的组是（ ）。","options":[{"key":"A","text":"通过样本数量是970"},{"key":"B","text":"通过样本数量是975"},{"key":"C","text":"通过样本数量是981"},{"key":"D","text":"通过样本数量是985"}],"answer":"CD","analysis":"本题考查GM/T 0005-2021《随机性检测规范》中多样本检测的通过判定准则。样本数量1000时，各样本P值服从均匀分布，理论期望通过数约为981，并允许一定的偏差范围，因此通过数量在981及以上（如981、985）判为通过。970和975明显低于期望值，偏差过大，说明被测序列存在非随机性，判为不通过。记忆要点：多样本通过数应在期望值附近，偏低即失败。","correctReason":"样本数1000时理论期望通过数约为981，达到或接近该水平的组（981、985）判为通过。","wrongReason":"A、B：970与975明显低于期望通过数981，偏离过大，表明序列随机性不足，判为不通过。","source":"GM/T 0005-2021《随机性检测规范》","keyPoint":"1000样本期望通过约981，低于该水平即判不通过。"},{"id":"第二部分专业题-三、标准题-多选题-9","no":9,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"在GM/T0027-2014《智能密码钥匙技术规范》中规定了智能密码钥匙的功能 要求、硬件要求等，还规定了哪些要求（ ）。","options":[{"key":"A","text":"软件要求"},{"key":"B","text":"性能要求"},{"key":"C","text":"环境适应性要求"},{"key":"D","text":"可靠性要求"}],"answer":"ABCD","analysis":"本题考查GM/T 0027-2014《智能密码钥匙技术规范》的章节构成。除功能要求、硬件要求外，标准还规定了软件要求、性能要求、环境适应性要求和可靠性要求。软件要求约束设备内软件与接口实现，性能要求规定算法运算与读写效率，环境适应性覆盖温湿度等使用环境，可靠性则涉及寿命与故障率。四个选项均属标准规定的要求类别。","correctReason":"该标准在功能、硬件要求之外，还规定了软件、性能、环境适应性和可靠性要求。","wrongReason":"本题四项均为正确选项，无错误项；易错点是把“环境适应性”“可靠性”误当作产品说明而非标准要求而漏选。","source":"GM/T 0027-2014《智能密码钥匙技术规范》","keyPoint":"智能密码钥匙要求：功能、硬件、软件、性能、环境适应性、可靠性。"},{"id":"第二部分专业题-三、标准题-多选题-10","no":10,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"根据GM/T0027-2014《智能密码钥匙技术规范》，智能密码钥匙的硬件要求 包括哪些方面（ ）。","options":[{"key":"A","text":"接口"},{"key":"B","text":"芯片"},{"key":"C","text":"线路传输"},{"key":"D","text":"密钥安全"}],"answer":"ABC","analysis":"本题考查GM/T 0027-2014中智能密码钥匙硬件要求的构成。硬件要求针对设备实体的物理与电气层面，包括接口（USB等对外接口形式与电气特性）、芯片（安全芯片的选型与封装要求）、线路传输（线路上的信号传输要求）。密钥安全属于安全要求的范畴，规范的是密钥的生成、存储、使用与销毁等安全机制，不属于硬件要求，故不选。","correctReason":"标准中硬件要求涵盖接口、芯片和线路传输三个方面。","wrongReason":"D：密钥安全属于安全要求的内容，规范密钥全生命周期保护，不属于硬件要求的范围。","source":"GM/T 0027-2014《智能密码钥匙技术规范》","keyPoint":"硬件要求＝接口＋芯片＋线路传输；密钥安全归安全要求。"},{"id":"第二部分专业题-三、标准题-多选题-11","no":11,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"根据GM/T0027-2014《智能密码钥匙技术规范》，智能密码钥匙的安全要求 包括设备软件安全防护等，还有哪些部分的安全要求（ ）。","options":[{"key":"A","text":"密码算法"},{"key":"B","text":"密钥管理"},{"key":"C","text":"多应用安全"},{"key":"D","text":"线路传输安全"}],"answer":"ABCD","analysis":"本题考查GM/T 0027-2014中智能密码钥匙安全要求的组成部分。除设备软件安全防护外，安全要求还包括密码算法（算法实现正确、符合国家密码管理要求）、密钥管理（密钥产生、存储、使用、销毁的安全）、多应用安全（多个应用之间的隔离与访问控制）以及线路传输安全（接口线路上的数据保护）。四个方面共同构成设备的整体安全要求，故四项全选。","correctReason":"标准的安全要求由设备软件安全防护、密码算法、密钥管理、多应用安全和线路传输安全共同组成。","wrongReason":"本题四项均为正确选项，无错误项；常见漏选点是只记住密钥管理和算法安全，忽略了多应用安全与线路传输安全。","source":"GM/T 0027-2014《智能密码钥匙技术规范》","keyPoint":"安全要求五项：软件防护、算法、密钥管理、多应用、线路传输。"},{"id":"第二部分专业题-三、标准题-多选题-12","no":12,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"在GM/T0016-2023《智能密码钥匙密码应用接口规范》中，个人身份识别码 包括哪些类型（ ）。","options":[{"key":"A","text":"管理员PIN"},{"key":"B","text":"用户PIN"},{"key":"C","text":"设备验证密钥"},{"key":"D","text":"报文鉴别码MAC"}],"answer":"AB","analysis":"本题考查GM/T 0016-2023中个人身份识别码（PIN）的类型划分。标准中的PIN用于对使用者身份进行识别并控制权限，按权限层级分为管理员PIN和用户PIN两种：管理员PIN用于设备与应用的管理类操作，用户PIN用于日常密码运算与数据访问。设备验证密钥属于设备与主机之间的鉴别密钥，报文鉴别码MAC属于完整性校验机制，二者都不是个人身份识别码。","correctReason":"标准规定个人身份识别码包括管理员PIN和用户PIN两类。","wrongReason":"C：设备验证密钥用于设备与主机间的身份验证，不是个人身份识别码；D：报文鉴别码MAC是数据完整性鉴别机制，与PIN无关。","source":"GM/T 0016-2023《智能密码钥匙密码应用接口规范》","keyPoint":"PIN只有两种：管理员PIN和用户PIN。"},{"id":"第二部分专业题-三、标准题-多选题-13","no":13,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"在GM/T0016-2023《智能密码钥匙密码应用接口规范》中，关于智能密码钥 匙中应用的说法正确的是（ ）","options":[{"key":"A","text":"一个设备中可以存在多个应用"},{"key":"B","text":"不同的应用之间可以共享数据"},{"key":"C","text":"应用由管理员PIN、用户PIN、文件和容器组成"},{"key":"D","text":"每个应用维护各自的与管理员PIN 和用户PIN 相关的权限状态"}],"answer":"ACD","analysis":"本题考查GM/T 0016-2023中智能密码钥匙“应用”的组织方式。一个设备可以承载多个应用，每个应用由管理员PIN、用户PIN、文件和容器组成，并各自维护与管理员PIN、用户PIN相对应的权限状态，从而保证应用之间的隔离。正因强调隔离，不同应用之间不能随意共享数据，选项B的“可以共享数据”与多应用安全隔离原则相违背。","correctReason":"标准规定一设备可含多个应用，应用由管理员PIN、用户PIN、文件和容器组成，且各自维护PIN权限状态。","wrongReason":"B：为保证多应用安全隔离，不同应用之间的数据相互独立、不可共享。","source":"GM/T 0016-2023《智能密码钥匙密码应用接口规范》","keyPoint":"一设备多应用，应用＝管理员PIN＋用户PIN＋文件＋容器，应用间隔离。"},{"id":"第二部分专业题-三、标准题-多选题-14","no":14,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"在GM/T0017-2023《智能密码钥匙密码应用接口数据格式规范》中，命令报 文和响应报文可能出现的情况有（ ）。","options":[{"key":"A","text":"命令报文无数据，响应报文无数据"},{"key":"B","text":"命令报文无数据，响应报文有数据"},{"key":"C","text":"命令报文有数据，响应报文无数据"},{"key":"D","text":"命令报文有数据，响应报文有数据"}],"answer":"ABCD","analysis":"本题考查GM/T 0017-2023中命令报文与响应报文的数据域组合情形。命令报文的数据域可以没有数据（如取随机数、读取状态类命令），也可以带数据（如写文件、加密运算类命令）；响应报文同样可以无数据（仅返回状态字）或有数据（返回运算结果或读取内容）。两类报文的数据有无可以自由组合，共四种情形，故四项均可能出现。","correctReason":"命令报文与响应报文的数据域各自都可以有数据或无数据，二者的组合共四种情形。","wrongReason":"本题四项均为正确选项，无错误项；易错点是误以为命令报文必须带数据或响应报文必须带数据，从而漏选A、B。","source":"GM/T 0017-2023《智能密码钥匙密码应用接口数据格式规范》","keyPoint":"命令与响应报文数据域有无可自由组合，四种情形都合法。"},{"id":"第二部分专业题-三、标准题-多选题-15","no":15,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"在GM/T0048-2016《智能密码钥匙密码检测规范》中，性能检测项包括以下 哪些内容（ ）。","options":[{"key":"A","text":"文件读写性能"},{"key":"B","text":"对称算法性能"},{"key":"C","text":"非对称算法性能"},{"key":"D","text":"杂凑算法性能"}],"answer":"ABCD","analysis":"本题考查GM/T 0048-2016《智能密码钥匙密码检测规范》的性能检测项目。性能检测衡量的是文件操作和密码算法运算的效率，具体包括文件读写性能、对称算法性能、非对称算法性能和杂凑算法性能。四种项目分别对应设备存储访问速度与三类算法的运算速率，构成完整的性能检测范围，故四项全选。","correctReason":"标准将文件读写性能、对称算法性能、非对称算法性能和杂凑算法性能均列为性能检测项。","wrongReason":"本题四项均为正确选项，无错误项；注意对称、非对称、杂凑三类算法性能都要检测，缺一项即漏选。","source":"GM/T 0048-2016《智能密码钥匙密码检测规范》","keyPoint":"性能检测＝文件读写＋对称＋非对称＋杂凑四类。"},{"id":"第二部分专业题-三、标准题-多选题-16","no":16,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"在GM/T0048-2016《智能密码钥匙密码检测规范》中，对称加密/解密功能 检测要求至少检测哪几种加密模式（ ）。","options":[{"key":"A","text":"ECB 模式"},{"key":"B","text":"CBC 模式"},{"key":"C","text":"CFB 模式"},{"key":"D","text":"CTR 模式"}],"answer":"AB","analysis":"本题考查GM/T 0048-2016对对称加密/解密功能检测的最低要求。标准要求检测至少覆盖ECB和CBC两种基本工作模式：ECB用于验证算法本身的正确性，CBC通过链接与初始化向量体现分组密码的常用工作方式。CFB（密文反馈）和CTR（计数器）虽属常见工作模式，但不属于本标准规定的最低检测范围，故不选。","correctReason":"标准规定对称加解密功能检测至少检测ECB模式和CBC模式。","wrongReason":"C、D：CFB与CTR虽为分组密码工作模式，但不属于本标准要求至少检测的模式范围。","source":"GM/T 0048-2016《智能密码钥匙密码检测规范》","keyPoint":"对称加解密功能检测最少覆盖ECB和CBC两种模式。"},{"id":"第二部分专业题-三、标准题-多选题-17","no":17,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"根据GM/T0048-2016《智能密码钥匙密码检测规范》，智能密码钥匙性能检 测的目的是检测智能密码钥匙文件操作和密码算法运算的效率。以下选项中属于 性能检测项的是（ ）","options":[{"key":"A","text":"文件读写性能"},{"key":"B","text":"应用初始化性能"},{"key":"C","text":"非对称算法性能"},{"key":"D","text":"杂凑算法性能"}],"answer":"ACD","analysis":"本题考查GM/T 0048-2016性能检测项的具体范围。性能检测的目的是衡量文件操作与密码算法运算的效率，因此文件读写性能、非对称算法性能和杂凑算法性能都在其列。“应用初始化性能”属于功能或应用管理层面的检测内容，衡量的是应用建立流程能否正确完成，而不是文件操作与算法运算的效率，故不属于性能检测项。","correctReason":"文件读写性能、非对称算法性能、杂凑算法性能直接对应文件操作与密码算法运算效率的检测。","wrongReason":"B：应用初始化考察的是应用创建与管理功能是否正确，属功能检测范畴，不是衡量运算效率的性能检测项。","source":"GM/T 0048-2016《智能密码钥匙密码检测规范》","keyPoint":"性能检测只测读写效率与算法运算效率，应用初始化属功能检测。"},{"id":"第二部分专业题-三、标准题-多选题-18","no":18,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"在GM/T0063-2018《智能密码钥匙应用接口检测规范》中，所涉及到的设备、 容器、应用、文件和证书的包含关系描述正确的是哪几项（ ）。（-->表示包 含）","options":[{"key":"A","text":"设备-->应用-->容器-->证书"},{"key":"B","text":"设备-->应用-->文件"},{"key":"C","text":"设备-->容器-->应用-->证书-->文件"},{"key":"D","text":"设备-->容器-->应用-->证书"}],"answer":"AB","analysis":"本题考查GM/T 0063-2018中设备、容器、应用、文件和证书的包含关系。智能密码钥匙的逻辑层次是：设备下可建多个应用，应用下包含文件和容器，容器中存放证书与密钥，因此“设备→应用→容器→证书”和“设备→应用→文件”都成立。C、D把容器放在应用之前，颠倒了层次顺序，因为容器是应用内部的对象，不可能包含应用。","correctReason":"设备包含应用，应用包含容器和文件，容器内可存放证书，故“设备→应用→容器→证书”与“设备→应用→文件”成立。","wrongReason":"C、D：层次颠倒，容器隶属于应用、由应用管理，不能反过来包含应用或位于应用之上。","source":"GM/T 0063-2018《智能密码钥匙应用接口检测规范》","keyPoint":"层次由大到小：设备→应用→（容器/文件）→证书、密钥。"},{"id":"第二部分专业题-三、标准题-多选题-19","no":19,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"在GM/T0063-2018《智能密码钥匙应用接口检测规范》中，ECC 密钥协商 过程中，发起方需要调用哪些接口建立会话密钥（ ）。","options":[{"key":"A","text":"ECC 生成密钥协商参数并输出"},{"key":"B","text":"ECC 产生密钥协商数据并导出会话密钥"},{"key":"C","text":"ECC 计算会话密钥"},{"key":"D","text":"ECC 签名"}],"answer":"ABC","analysis":"本题考查GM/T 0063-2018中ECC密钥协商的接口调用流程。发起方建立会话密钥需要依次调用：生成密钥协商参数并输出（产生本方临时参数）、产生密钥协商数据并导出会话密钥（用对方参数与本方私钥计算并导出会话密钥）以及计算会话密钥。ECC签名接口用于身份鉴别和签名验签，不参与会话密钥的协商计算，故不属于本题所问的接口。","correctReason":"发起方通过生成协商参数、产生协商数据并导出会话密钥、计算会话密钥三个接口完成会话密钥建立。","wrongReason":"D：ECC签名用于身份鉴别与数据签名，不参与密钥协商过程中会话密钥的生成。","source":"GM/T 0063-2018《智能密码钥匙应用接口检测规范》","keyPoint":"ECC密钥协商三接口：产生参数、产生协商数据导出密钥、计算会话密钥。"},{"id":"第二部分专业题-三、标准题-多选题-20","no":20,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"在GM/T0018-2023《密码设备应用接口规范》中，RSA 公钥数据结构定义 中的字段包括（ ）。","options":[{"key":"A","text":"模长"},{"key":"B","text":"模N"},{"key":"C","text":"公钥指数"},{"key":"D","text":"素数p 和q"}],"answer":"ABC","analysis":"本题考查GM/T 0018-2023中RSA公钥数据结构的字段构成。RSA公钥对外只需要公开模数N和公开指数e，因此结构中含有模长（比特长度）、模N和公钥指数三个字段。素数p、q属于私钥知识，一旦泄露即可由N分解出私钥，因此绝不能出现在公钥数据结构中。记住“公钥只含N和e，私钥才有p、q、d”这条界线即可。","correctReason":"RSA公钥数据结构由模长、模N和公钥指数组成，这三项即可完整描述一个RSA公钥。","wrongReason":"D：素数p、q是大数分解的私钥知识，属于私钥范畴，不能出现在公钥数据结构中。","source":"GM/T 0018-2023《密码设备应用接口规范》","keyPoint":"RSA公钥＝模长＋N＋公钥指数e；p、q绝不公开。"},{"id":"第二部分专业题-三、标准题-多选题-21","no":21,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"根据GM/T0018-2023《密码设备应用接口规范》，以下哪些属于密码设备的 基本功能（ ）。","options":[{"key":"A","text":"密钥管理"},{"key":"B","text":"数据加密"},{"key":"C","text":"应用管理"},{"key":"D","text":"随机数生成"}],"answer":"ABD","analysis":"本题考查GM/T 0018-2023对密码设备基本功能的界定。密码设备的核心使命是提供密码服务，其基本功能包括密钥管理（密钥产生、存储、更新、销毁等）、数据加密（对称与非对称加解密）以及随机数生成（为密钥与算法提供随机源）。应用管理是智能密码钥匙一类设备对内部应用生命周期的管理能力，不属于密码设备接口规范界定的基本功能，故不选。","correctReason":"密钥管理、数据加密和随机数生成构成密码设备提供密码服务的基本功能。","wrongReason":"C：应用管理是智能密码钥匙等设备对内部应用的管理功能，不属于密码设备接口规范规定的基本密码功能。","source":"GM/T 0018-2023《密码设备应用接口规范》","keyPoint":"密码设备基本功能：密钥管理、数据加密、随机数生成。"},{"id":"第二部分专业题-三、标准题-多选题-22","no":22,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"在GM/T0121-2022《密码卡检测规范》中，密码卡检测项目可包括（ ）。","options":[{"key":"A","text":"功能检测"},{"key":"B","text":"性能检测"},{"key":"C","text":"安全性检测"},{"key":"D","text":"虚拟化检测"}],"answer":"ABCD","analysis":"本题考查GM/T 0121-2022《密码卡检测规范》的检测项目分类。密码卡检测从多个维度展开：功能检测验证接口与密码运算功能是否按规范实现，性能检测衡量吞吐与时延等指标，安全性检测关注密钥保护、防攻击与物理安全，虚拟化检测则针对虚拟机场景下的密码卡使用能力。四类检测共同构成完整的检测项目体系，故全选。","correctReason":"标准规定的密码卡检测项目包括功能检测、性能检测、安全性检测和虚拟化检测。","wrongReason":"本题四项均为正确选项，无错误项；虚拟化检测容易被忽略，但它是密码卡在云与虚拟化场景下的必备检测项。","source":"GM/T 0121-2022《密码卡检测规范》","keyPoint":"密码卡四类检测：功能、性能、安全性、虚拟化。"},{"id":"第二部分专业题-三、标准题-多选题-23","no":23,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"在GM/T0121-2022《密码卡检测规范》中，在就绪状态下，密码卡不能执行 （ ）操作。","options":[{"key":"A","text":"满足权限时，能够提供用户密钥管理和密码运算等功能"},{"key":"B","text":"通过删除操作员操作使密码卡进入初始状态"},{"key":"C","text":"生成设备密钥对和保护密钥的生成操作"},{"key":"D","text":"恢复设备密钥对和保护密钥的操作"}],"answer":"BCD","analysis":"本题考查GM/T 0121-2022中密码卡状态与操作的对应关系。在就绪状态下，密码卡已正常初始化完毕，在权限满足时可以执行用户密钥管理、密码运算以及生成设备密钥对和保护密钥等操作。而“通过删除操作员操作使密码卡进入初始状态”属于状态回退管理操作，恢复设备密钥对和保护密钥也受到状态与权限的严格限制，均不能在普通就绪状态下执行，故B、C、D为不能执行项。","correctReason":"就绪状态下密码卡可提供受权限控制的密钥管理与密码运算功能，但不得执行状态回退与密钥恢复类操作。","wrongReason":"B：删除操作员使密码卡回到初始状态属于状态回退管理操作，就绪状态下不允许执行；C：生成设备密钥对和保护密钥需在规定的初始状态与管理权限下进行，就绪状态下不可执行；D：恢复设备密钥对和保护密钥属于密钥恢复类管理操作，就绪状态下不可执行。","source":"GM/T 0121-2022《密码卡检测规范》","keyPoint":"就绪状态只做正常密码服务，不做删除操作员、密钥恢复等管理操作。"},{"id":"第二部分专业题-三、标准题-多选题-24","no":24,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"在GM/T0121-2022《密码卡检测规范》中，下列关于密码卡驱动程序检测要 求描述正确的包括（ ）。","options":[{"key":"A","text":"在指定的操作系统中应能够正确地安装和卸载"},{"key":"B","text":"宜支持多个密码卡设备同时使用和操作的基本要求"},{"key":"C","text":"宜与密码卡具备安全绑定机制"},{"key":"D","text":"不可支持多个密码卡设备同时使用和操作"}],"answer":"ABC","analysis":"本题考查GM/T 0121-2022对密码卡驱动程序的检测要求。驱动程序是主机与密码卡之间的桥梁，检测要求其能在指定操作系统中正确安装和卸载，宜支持多块密码卡同时使用和操作，并宜与密码卡之间具备安全绑定机制，防止驱动被替换或卡片被冒用。选项D称“不可支持多个密码卡设备同时使用和操作”，与标准要求的宜支持多卡并用直接矛盾。","correctReason":"驱动应能在指定操作系统正确安装卸载，宜支持多卡同时使用，并宜与密码卡建立安全绑定机制。","wrongReason":"D：标准要求驱动程序宜支持多个密码卡设备同时使用和操作，该表述与之相反。","source":"GM/T 0121-2022《密码卡检测规范》","keyPoint":"驱动检测三点：装得上卸得掉、支持多卡、与卡安全绑定。"},{"id":"第二部分专业题-三、标准题-多选题-25","no":25,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"在GM/T0022-2023《IPSecVPN 技术规范》中，IPSecVPN 需要使用（ ） 类型的密钥。","options":[{"key":"A","text":"设备密钥"},{"key":"B","text":"工作密钥"},{"key":"C","text":"会话密钥"},{"key":"D","text":"存储密钥"}],"answer":"ABC","analysis":"本题考查GM/T 0022-2023《IPSecVPN技术规范》中的密钥类型划分。IPSecVPN中设备密钥用于设备身份鉴别和IKE协商中的身份认证，工作密钥用于保护IKE协商报文本身，会话密钥用于保护实际的数据报文，三者各司其职、层次分明。存储密钥一般用于数据存储加密场景，不是IPSecVPN规范规定的密钥类型，故不选。","correctReason":"IPSecVPN需要使用设备密钥进行身份鉴别、工作密钥保护协商报文、会话密钥保护数据报文。","wrongReason":"D：存储密钥用于数据存储加密场景，不属于IPSecVPN规范规定的密钥类型。","source":"GM/T 0022-2023《IPSecVPN技术规范》","keyPoint":"IPSecVPN三类密钥：设备密钥、工作密钥、会话密钥。"},{"id":"第二部分专业题-三、标准题-多选题-26","no":26,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"根据GM/T0023-2023《IPSecVPN 网关产品规范》，以下对于IPSecVPN 中 的密钥说法错误的是（ ）。","options":[{"key":"A","text":"设备密钥可以明文导出"},{"key":"B","text":"工作密钥应存储于非易失性存储区"},{"key":"C","text":"设备证书可以明文发送"},{"key":"D","text":"设备密钥应在断电时销毁"}],"answer":"ABD","analysis":"本题考查GM/T 0023-2023中关于密钥与证书保护的错误说法。设备密钥是设备的身份凭据，必须受硬件保护、不得明文导出，也不是断电即销毁的对象；工作密钥是协商产生的临时密钥，只存在于运行内存中，断电即失效，不应存入非易失性存储区。设备证书是公开信息，可以明文发送。因此A、B、D均为错误说法，只有C正确。","correctReason":"设备证书属公开信息可明文发送，故C为正确表述；本题要求选出错误说法，因此答案为A、B、D。","wrongReason":"A：设备密钥必须受保护，不允许明文导出；B：工作密钥是临时会话密钥，应存放于易失性存储区、断电即销毁，不应存入非易失性存储区；D：设备密钥需长期保存用于身份鉴别，不应在断电时销毁。","source":"GM/T 0023-2023《IPSecVPN网关产品规范》","keyPoint":"设备密钥不外导、不断电毁；工作密钥只在内存、断电即失。"},{"id":"第二部分专业题-三、标准题-多选题-27","no":27,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"根据GM/T0023-2023《IPSecVPN 网关产品规范》，以下哪些属于IPSecVPN 产品性能参数（ ）。","options":[{"key":"A","text":"加解密吞吐"},{"key":"B","text":"加解密时延"},{"key":"C","text":"每秒新建隧道数"},{"key":"D","text":"最大并发隧道数"}],"answer":"ABCD","analysis":"本题考查GM/T 0023-2023中IPSecVPN产品的性能参数。加解密吞吐反映设备的数据处理能力，加解密时延反映单包处理的响应速度，每秒新建隧道数反映设备的并发建立能力，最大并发隧道数反映设备的容量上限。这四项覆盖“速率、时延、建立能力、容量”四个维度，均属规范规定的性能参数，故全选。","correctReason":"加解密吞吐、加解密时延、每秒新建隧道数和最大并发隧道数都是标准规定的IPSecVPN产品性能参数。","wrongReason":"本题四项均为正确选项，无错误项；易错点是把“每秒新建隧道数”与“最大并发隧道数”混为一谈，二者分别衡量建立能力与容量上限，均须检测。","source":"GM/T 0023-2023《IPSecVPN网关产品规范》","keyPoint":"VPN性能四指标：吞吐、时延、新建隧道速率、并发隧道数。"},{"id":"第二部分专业题-三、标准题-多选题-28","no":28,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"根据GM/T0024-2023《SSLVPN 技术规范》， SSLVPN 中非对称密码算 法用于（ ）。","options":[{"key":"A","text":"身份鉴别"},{"key":"B","text":"数字签名"},{"key":"C","text":"密钥交换"},{"key":"D","text":"数据报文加密"}],"answer":"ABC","analysis":"本题考查GM/T 0024-2023中SSLVPN非对称密码算法的用途。非对称算法运算开销大，主要用于身份鉴别、数字签名和密钥交换这三类“量小但要求安全强度高”的场景；而真正承载业务数据的数据报文加密采用对称算法（如SM4），因为对称算法速度快、适合大流量加密。选项D混淆了两类算法的分工，故不选。","correctReason":"标准规定非对称密码算法用于身份鉴别、数字签名和密钥交换，数据报文加密由对称算法完成。","wrongReason":"D：数据报文加密应采用SM4等对称密码算法，非对称算法运算慢，不用于大批量数据加密。","source":"GM/T 0024-2023《SSLVPN技术规范》","keyPoint":"非对称管鉴别/签名/密钥交换，对称管数据加密。"},{"id":"第二部分专业题-三、标准题-多选题-29","no":29,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"根据GM/T0024-2023《SSLVPN 技术规范》，下列哪些是标准规定的密码 套件（ ）。","options":[{"key":"A","text":"ECC_SM4_SM3"},{"key":"B","text":"IBC_SM4_SM3"},{"key":"C","text":"ECDHE_SM4_SM3"},{"key":"D","text":"RSA_SM4_SM3"}],"answer":"ABCD","analysis":"本题考查GM/T 0024-2023规定的密码套件名称。标准给出了多个基于国产算法的套件，按身份鉴别与密钥交换机制分为ECC（基于椭圆曲线证书）、IBC（基于SM9标识密码）、ECDHE（基于椭圆曲线的临时密钥交换）以及RSA等类别，其后统一以SM4作为对称加密算法、SM3作为杂凑算法。故ECC_SM4_SM3、IBC_SM4_SM3、ECDHE_SM4_SM3、RSA_SM4_SM3均在标准套件之列。","correctReason":"标准规定的密码套件包括ECC_SM4_SM3、IBC_SM4_SM3、ECDHE_SM4_SM3和RSA_SM4_SM3等。","wrongReason":"本题四项均为正确选项，无错误项；易错点在于把国密套件想当然地限定为ECC和IBC两种，忽略了标准同样规定了ECDHE与RSA套件。","source":"GM/T 0024-2023《SSLVPN技术规范》","keyPoint":"套件命名法：鉴别/密钥交换机制＋SM4＋SM3。"},{"id":"第二部分专业题-三、标准题-多选题-30","no":30,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"在GM/T0024-2023《SSLVPN 技术规范》中，工作密钥包括（ ）。","options":[{"key":"A","text":"签名密钥对"},{"key":"B","text":"加密密钥对"},{"key":"C","text":"数据加密密钥"},{"key":"D","text":"校验密钥"}],"answer":"CD","analysis":"本题考查GM/T 0024-2023中工作密钥的构成。工作密钥是协议运行中由密钥交换派生、直接用于保护本次会话数据的临时密钥，包括数据加密密钥（保护报文机密性）和校验密钥（生成MAC保护报文完整性）。签名密钥对和加密密钥对属于设备长期使用的证书密钥，用于身份鉴别与密钥交换，不随会话更换，因此不属于工作密钥。","correctReason":"工作密钥是保护会话数据的临时密钥，由数据加密密钥和校验密钥组成。","wrongReason":"A、B：签名密钥对和加密密钥对属于设备长期使用的证书密钥，用于身份鉴别和密钥交换，不属于临时的工作密钥。","source":"GM/T 0024-2023《SSLVPN技术规范》","keyPoint":"工作密钥＝数据加密密钥＋校验密钥，设备密钥对不算。"},{"id":"第二部分专业题-三、标准题-多选题-31","no":31,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"根据GM/T0025-2014《SSLVPN 网关产品规范》，SSLVPN 产品应采用分 权管理的机制，涉及的管理员角色包括（ ）。","options":[{"key":"A","text":"超级管理员"},{"key":"B","text":"系统管理员"},{"key":"C","text":"安全管理员"},{"key":"D","text":"系统审计员"}],"answer":"BCD","analysis":"该题考的是GM/T0025-2014对SSLVPN网关管理权限的划分要求。标准明确产品应实行分权管理，设置系统管理员、安全管理员、系统审计员三类角色，也就是常说的三员分立：系统管理员管设备运行，安全管理员管安全策略与密钥，系统审计员只负责审计且不参与业务操作，三者互相制约、不能由一人兼任。「超级管理员」看似权力更大，但标准并未设置这一角色，一个统管全部权限的超级管理员恰恰违背了分权管理的初衷。答案以官方为准。","correctReason":"分权管理要求三员分立、职责分离，标准中列出的管理员角色为系统管理员、安全管理员、系统审计员。","wrongReason":"A：标准未设置超级管理员角色，其权限集中与分权制约的设计原则相冲突。","source":"GM/T 0025-2014《SSL VPN网关产品规范》管理要求（管理员角色）","keyPoint":"三员分立：系统管理员、安全管理员、系统审计员，无超级管理员"},{"id":"第二部分专业题-三、标准题-多选题-32","no":32,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"根据GM/T0025-2014《SSLVPN 网关产品规范》，SSLVPN 网关产品应提 供日志记录、查看和导出功能，日志内容包括（ ）。","options":[{"key":"A","text":"管理员操作行为，包括用户管理、登录认证、系统配置、密钥管理操作"},{"key":"B","text":"用户访问行为，包括用户、时间、访问资源、结果"},{"key":"C","text":"异常事件，包括认证失败、非法访问异常事件的记录"},{"key":"D","text":"系统运行期间的输出，包括数据接收、数据处理、数据回执的处理信息"}],"answer":"ABC","analysis":"该题考SSLVPN网关日志记录的内容范围。标准把日志分为三大类：管理员操作行为（用户管理、登录认证、系统配置、密钥管理）、用户访问行为（用户、时间、访问资源、结果）和异常事件（认证失败、非法访问）。三者分别对应「谁动了设备」「谁访问了什么」「出了什么问题」，是审计追溯的基本要素。选项D描述的数据接收、数据处理、数据回执属于业务流处理信息，不在标准要求的日志内容之列。答案以官方为准。","correctReason":"标准规定的日志内容为管理员操作行为、用户访问行为和异常事件三类。","wrongReason":"D：数据接收、数据处理、数据回执等系统运行时输出属于业务处理信息，不是标准要求记录的日志内容。","source":"GM/T 0025-2014《SSL VPN网关产品规范》日志功能要求","keyPoint":"日志三类：管理员操作、用户访问、异常事件"},{"id":"第二部分专业题-三、标准题-多选题-33","no":33,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"根据GM/T0026-2014《安全认证网关产品规范》，安全认证网关应确保设备 密钥得到安全保护，工作密钥和会话密钥不存放在（ ）中。","options":[{"key":"A","text":"硬盘"},{"key":"B","text":"内存"},{"key":"C","text":"易失性存储介质"},{"key":"D","text":"非易失性存储介质"}],"answer":"AD","analysis":"该题考密钥在设备中的存放介质。工作密钥和会话密钥属于动态使用、随用随生成、生命周期很短的密钥，标准要求它们只能保存在易失性存储介质（如内存）中，断电即消失，这样即使设备被断电搬走也难以提取密钥。反过来说，硬盘属于非易失性存储介质，掉电后数据仍在，把工作密钥或会话密钥写进去就会留下可被读取的密钥残留，因此被明令禁止。做题的关键是分清易失与非易失，而不是选项字面是否像存储设备。答案以官方为准。","correctReason":"工作密钥和会话密钥不得存放在硬盘等非易失性存储介质中，只能存在于内存等易失性介质。","wrongReason":"B：内存属于易失性存储介质，是密钥运行期正常的存放位置；C：易失性存储介质同样是允许的存放位置，与题意相反。","source":"GM/T 0026-2014《安全认证网关产品规范》设备密钥安全保护要求","keyPoint":"工作密钥、会话密钥只进内存，不进硬盘等非易失介质"},{"id":"第二部分专业题-三、标准题-多选题-34","no":34,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"在GM/T0026-2023《安全认证网关产品规范》中，安全认证网关的哪些初始 化操作应由用户完成（ ）。","options":[{"key":"A","text":"安全策略的配置"},{"key":"B","text":"密钥的生成"},{"key":"C","text":"管理员的产生"},{"key":"D","text":"设备零部件的组装"}],"answer":"ABC","analysis":"该题考安全认证网关初始化阶段厂商与用户的责任边界。标准要求安全策略配置、密钥生成和管理员产生这三项由用户自己完成：密钥必须由用户掌控而非出厂预置，管理员账号由用户建立才能保证账户主权，安全策略由用户按自身业务设定才能贴合实际安全需求。设备零部件的组装属于生产制造环节，由厂商在出厂前完成，用户拿到的是整机，不可能也不应该参与组装。这体现了「密码产品交付后由用户接管安全控制权」的基本思路。答案以官方为准。","correctReason":"安全策略配置、密钥生成、管理员产生这三项初始化操作标准要求由用户完成。","wrongReason":"D：设备零部件的组装由生产厂商在制造阶段完成，不属于用户应完成的初始化操作。","source":"GM/T 0026-2023《安全认证网关产品规范》初始化要求","keyPoint":"用户负责：安全策略、密钥生成、管理员产生"},{"id":"第二部分专业题-三、标准题-多选题-35","no":35,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"在GM/T0049-2016《密码键盘密码检测规范》规定的安全功能检测中，下面 哪些检测项目是安全3 级的检测要求（ ）。","options":[{"key":"A","text":"检测密码键盘是否存在通风孔或缝，若不存在则继续检测"},{"key":"B","text":"通过安全2 级的检测"},{"key":"C","text":"检测密码键盘是否具有EFP 特性或经过 EFT。如果是则继续检测"},{"key":"D","text":"检测密码键盘在温度超出运行，存放和分发的预期温度范围时，外壳是否维持 强度或硬度特征。如果是则继续检测"}],"answer":"ABCD","analysis":"该题考密码键盘安全3级在安全功能检测上的具体要求。标准的安全等级是逐级累加的，因此3级必须建立在通过2级检测的基础上；同时3级要检查键盘上是否存在通风孔或缝隙（防止通过孔缝探测内部），要求具有防拆检测EFP特性或经过EFT处理，还要求在温度超出运行、存放和分发预期范围时外壳仍能维持强度或硬度。四项都属于3级安全功能检测的构成条件，缺一不可。这类题不要按「哪个听起来更高级」去排除，而要看是否属于该级的检测链条。答案以官方为准。","correctReason":"安全等级逐级累加，3级要求包含通过2级检测，并叠加防通风孔缝、EFP/EFT、温度超限时外壳强度等检测项。","wrongReason":"A：并非错误项，检测是否存在通风孔或缝隙是3级安全功能检测的组成内容；B：并非错误项，逐级累加决定3级必须首先通过2级检测。","source":"GM/T 0049-2016《密码键盘密码检测规范》安全功能检测（安全3级）","keyPoint":"3级＝过2级＋无通风孔缝＋EFP/EFT＋温变外壳强度"},{"id":"第二部分专业题-三、标准题-多选题-36","no":36,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"根据GM/T0049-2016《密码键盘密码检测规范》，能达到安全4 级，最低的 要求应包括（ ）。","options":[{"key":"A","text":"基本测试项目全部通过"},{"key":"B","text":"基本测试项目没有通过（某些可选测试项可以不测）"},{"key":"C","text":"安全要求检测项目全部通过4 级检测。"},{"key":"D","text":"安全要求中的非关键要求可不通过4 级检测"}],"answer":"AC","analysis":"该题考密码键盘达到安全4级的最低门槛。标准要求等级越高覆盖越全，因此4级首先必须让基本测试项目全部通过，不存在「基本项可以不过」的余地；其次安全要求检测项目也要全部通过4级检测，不能用「非关键要求」作为豁免。选项B把「基本测试项目没有通过」写成条件，正好与基本项全通过的要求相反；选项D把非关键要求排除在4级之外，同样降低了等级门槛，与「全部通过4级检测」矛盾。选项A与C合起来才是4级的完整最低要求。答案以官方为准。","correctReason":"安全4级的最低要求是基本测试项目全部通过，且安全要求检测项目全部通过4级检测。","wrongReason":"B：基本测试项目必须全部通过，不存在「没有通过」仍可达4级的情形；D：标准未允许非关键要求豁免4级检测，安全要求检测项目须全部通过。","source":"GM/T 0049-2016《密码键盘密码检测规范》安全等级判定要求","keyPoint":"4级：基本测试全过＋安全要求检测项全过4级"},{"id":"第二部分专业题-三、标准题-多选题-37","no":37,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"根据GM/T0045-2016《金融数据密码机技术规范》，金融数据密码机采用分 层密码机制，分别为（ ）。","options":[{"key":"A","text":"主密钥"},{"key":"B","text":"次主密钥"},{"key":"C","text":"数据密钥"},{"key":"D","text":"设备密钥"}],"answer":"ABC","analysis":"该题考金融数据密码机的密钥层次。GM/T0045-2016规定其采用分层密码机制，自上而下为主密钥、次主密钥、数据密钥三层：主密钥处于最顶层，用于保护次主密钥；次主密钥用于保护数据密钥或直接参与金融交易密钥的派生；数据密钥位于最底层，直接用于PIN加密、MAC计算、数据加解密等具体业务运算。分层的好处是底层密钥频繁更换也不会影响顶层密钥安全。选项中的设备密钥不在这一分层序列里，属于容易混淆的干扰概念。答案以官方为准。","correctReason":"标准规定的分层密码机制为主密钥、次主密钥、数据密钥三层结构。","wrongReason":"D：设备密钥是设备自身的安全凭证概念，不属于标准规定的三层分层密码机制。","source":"GM/T 0045-2016《金融数据密码机技术规范》分层密码机制","keyPoint":"三层密钥：主密钥→次主密钥→数据密钥"},{"id":"第二部分专业题-三、标准题-多选题-38","no":38,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"根据GM/T0046《金融数据密码机检测规范》，金融数据密码机初始化应支 持（ ）。","options":[{"key":"A","text":"未初始化状态指示"},{"key":"B","text":"管理员生成"},{"key":"C","text":"服务端口配置"},{"key":"D","text":"管理端口配置"}],"answer":"ABCD","analysis":"该题考金融数据密码机初始化阶段应具备的能力。检测规范要求初始化至少支持四件事：未初始化状态指示（让使用者能判断设备是否已初始化，避免误用未配置设备）、管理员生成（建立管理身份和权限）、服务端口配置（面向业务的服务通道）、管理端口配置（面向管理的维护通道）。两个端口分别对应业务面和管理面，是密码机常见的双通道设计。四项都是初始化应支持的内容，不是互相排斥的选项。答案以官方为准。","correctReason":"标准要求初始化应支持未初始化状态指示、管理员生成及服务端口、管理端口的配置。","wrongReason":"A：并非错误项，未初始化状态指示是初始化应支持的功能之一；B：并非错误项，管理员生成属于初始化阶段应支持的操作。","source":"GM/T 0046-2016《金融数据密码机检测规范》初始化检测要求","keyPoint":"初始化四件事：状态指示、管理员生成、服务端口、管理端口"},{"id":"第二部分专业题-三、标准题-多选题-39","no":39,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"根据GM/T0030-2014《服务器密码机技术规范》，服务器密码机的远程管理 功能只能用于远程监控，包括（ ）。","options":[{"key":"A","text":"参数查询"},{"key":"B","text":"密钥备份"},{"key":"C","text":"状态查询"},{"key":"D","text":"密钥恢复"}],"answer":"AC","analysis":"该题考服务器密码机远程管理功能的边界。标准明确规定远程管理只能用于远程监控，也就是只读性质的操作，具体包括参数查询和状态查询。密钥备份和密钥恢复涉及密钥材料的导出与导入，属于高敏感的密钥管理动作，必须通过本地受控方式完成，绝不能借助远程通道进行，否则密钥在传输途中被截获的风险无法控制。因此要把「监控类」与「密钥操作类」严格分开记忆。答案以官方为准。","correctReason":"远程管理仅限远程监控，即参数查询和状态查询这类只读操作。","wrongReason":"B：密钥备份属于密钥材料导出，须本地受控执行，不能通过远程管理完成；D：密钥恢复属于密钥材料导入，同样不属于远程监控范围。","source":"GM/T 0030-2014《服务器密码机技术规范》远程管理要求","keyPoint":"远程管理只读：参数查询、状态查询；密钥备份恢复必须本地"},{"id":"第二部分专业题-三、标准题-多选题-40","no":40,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"根据GM/T0030-2014《服务器密码机技术规范》，服务器密码机在密钥管理 方面，应满足以下哪些要求（ ）。","options":[{"key":"A","text":"管理密钥的使用可以对应用系统开放"},{"key":"B","text":"除公钥外，所有密钥均不能以明文形式出现在服务器密码机外"},{"key":"C","text":"服务器密码机内部存储的密钥应具备防止解剖、探测和非法读取有效的密钥保 护机制"},{"key":"D","text":"服务器密码机内部存储的密钥应具备防止非法使用和导出的权限控制机制"}],"answer":"BCD","analysis":"该题考服务器密码机的密钥保护要求。标准规定除公钥外所有密钥都不能以明文形式出现在密码机之外，这是最基本的一条；设备内部存储的密钥要具备防解剖、防探测、防非法读取的保护机制，防止物理攻击提取密钥；还要有防非法使用和导出的权限控制机制，从逻辑上限制密钥的调用与外流。选项A与这些要求相反：管理密钥用于设备自身的安全管理，若对应用系统开放，应用侧就可能越权调用，密钥权限边界随之失效。答案以官方为准。","correctReason":"标准要求除公钥外密钥不得明文出机，并具备防解剖探测读取的物理保护和防非法使用导出的权限控制。","wrongReason":"A：管理密钥属于设备自身管理用途，不得对应用系统开放，否则会破坏权限隔离。","source":"GM/T 0030-2014《服务器密码机技术规范》密钥管理要求","keyPoint":"除公钥外不明文出机；防解剖探测、防非法使用导出"},{"id":"第二部分专业题-三、标准题-多选题-41","no":41,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"根据GM/T0059-2018《服务器密码机检测规范》，服务器密码机的日志内容 可以包括（ ）。","options":[{"key":"A","text":"管理员操作行为，包括登录认证、系统配置、密钥管理等操作"},{"key":"B","text":"异常事件，包括认证失败、非法访问等异常事件的记录"},{"key":"C","text":"如与设备管理中心连接，则对相应操作进行记录"},{"key":"D","text":"对应用接口中密钥管理相关调用记录日志"}],"answer":"ABCD","analysis":"该题考服务器密码机日志内容的范围。检测规范允许日志包含四类信息：管理员操作行为（登录认证、系统配置、密钥管理等）、异常事件（认证失败、非法访问）、与设备管理中心连接时的相应操作记录，以及应用接口中密钥管理相关调用的日志。前三类与多数密码设备一致，第四类体现密码机特色——业务系统通过API调密钥这件事本身就需要留痕，便于事后核查密钥是否被滥用。题干的「可以包括」意味着范围较宽，四类都在其中。答案以官方为准。","correctReason":"标准将管理员操作、异常事件、与管理中心交互操作及密钥管理接口调用记录均纳入日志范围。","wrongReason":"A：并非错误项，管理员操作行为属于日志应记录的内容；B：并非错误项，认证失败、非法访问等异常事件属于日志内容。","source":"GM/T 0059-2018《服务器密码机检测规范》日志检测要求","keyPoint":"日志含管理员操作、异常事件、管理中心交互、密钥管理接口调用"},{"id":"第二部分专业题-三、标准题-多选题-42","no":42,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"依据GB/T31168-2023《信息安全技术 云计算服务安全能力要求》，根据资 源使用情况对提供给云服务客户的云服务功能进行分类，主要分为（ ）。","options":[{"key":"A","text":"应用能力类型"},{"key":"B","text":"基础设施能力类型"},{"key":"C","text":"平台能力类型"},{"key":"D","text":"业务能力类型"}],"answer":"ABC","analysis":"该题考云计算服务按资源使用情况的分类。GB/T31168-2023沿用业界通行的服务模式划分，将云服务功能分为基础设施能力类型、平台能力类型和应用能力类型，分别对应只提供计算存储网络资源、提供开发运行平台、直接提供可用软件服务三种形态。选项D的「业务能力类型」并不在标准的分类体系中，属于套用「业务」二字编造的干扰项。记忆时可直接对应IaaS、PaaS、SaaS三种模式。答案以官方为准。","correctReason":"标准按资源使用情况将云服务功能分为基础设施能力类型、平台能力类型和应用能力类型。","wrongReason":"D：标准分类中没有业务能力类型，该表述属于编造的分类名称。","source":"GB/T 31168-2023《信息安全技术 云计算服务安全能力要求》云服务功能分类","keyPoint":"云服务三类：基础设施、平台、应用（IaaS/PaaS/SaaS）"},{"id":"第二部分专业题-三、标准题-多选题-43","no":43,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"根据GM/T0059-2018《服务器密码机检测规范》，服务器密码机的 API 接 口检测应包括以下哪几类（ ）。","options":[{"key":"A","text":"设备管理类函数"},{"key":"B","text":"对称算法运算类函数"},{"key":"C","text":"用户文件操作类函数"},{"key":"D","text":"杂凑运算类函数"}],"answer":"ABCD","analysis":"该题考服务器密码机API接口检测的覆盖类别。检测范围包括设备管理类函数（初始化、密钥管理、设备状态）、对称算法运算类函数（加解密、MAC）、杂凑运算类函数以及用户文件操作类函数（密钥与用户数据的存取）。四类基本覆盖了密码机对外接口的全部能力，检测时要逐类验证功能与接口一致性。凡遇到「密码机接口检测包括哪些」这类题，按设备管理、算法运算、杂凑、文件操作四类去记即可。答案以官方为准。","correctReason":"标准规定API接口检测应覆盖设备管理类、对称算法运算类、杂凑运算类和用户文件操作类函数。","wrongReason":"A：并非错误项，设备管理类函数属于API接口检测范围；C：并非错误项，用户文件操作类函数同样在检测范围内。","source":"GM/T 0059-2018《服务器密码机检测规范》API接口检测","keyPoint":"接口四类：设备管理、对称运算、杂凑运算、文件操作"},{"id":"第二部分专业题-三、标准题-多选题-44","no":44,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"根据GM/T0029-2014《签名验签服务器技术规范》，签名验签服务器的自检 包括密码设备的自检和自身的自检，对（ ）进行检查。在检查不通过时应报警 并停止工作。","options":[{"key":"A","text":"密码运算功能"},{"key":"B","text":"随机数发生器"},{"key":"C","text":"存储的敏感信息"},{"key":"D","text":"管理功能"}],"answer":"ABC","analysis":"该题考签名验签服务器的自检对象。标准要求自检既覆盖密码设备的自检也覆盖服务器自身的自检，检查内容包括密码运算功能是否正确、随机数发生器是否正常、存储的敏感信息是否完好，任一检查不通过就要报警并停止工作，防止在密码功能失效的状态下继续对外提供签名验签服务。选项D的管理功能是权限与配置层面的能力，不属于密码功能自检的检查对象，属于顺带一提式的干扰项。答案以官方为准。","correctReason":"自检针对密码运算功能、随机数发生器和存储的敏感信息，检查不通过应报警并停止工作。","wrongReason":"D：管理功能属于权限与配置管理范畴，不是自检所检查的密码功能对象。","source":"GM/T 0029-2014《签名验签服务器技术规范》设备自检要求","keyPoint":"自检三查：密码运算、随机数发生器、存储的敏感信息"},{"id":"第二部分专业题-三、标准题-多选题-45","no":45,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"根据GM/T0029-2014《签名验签服务器技术规范》，关于签名验签服务器的 身份鉴别机制，可以通过（ ）与口令相结合的方式实现身份鉴别。","options":[{"key":"A","text":"智能密码钥匙"},{"key":"B","text":"智能IC 卡"},{"key":"C","text":"口令"},{"key":"D","text":"证书链"}],"answer":"AB","analysis":"该题考签名验签服务器的管理员身份鉴别方式。标准要求采用双因素思路，即把持有式凭证与口令结合：智能密码钥匙和智能IC卡都是能安全存放密钥与证书、并完成密码运算的硬件载体，用它们与口令组合即可实现「你知道什么＋你持有什么」的双因子鉴别。选项C的口令正是题干中已经提到的那个因素，不能自己与自己结合；选项D的证书链用于验证证书路径的有效性，是鉴别过程中的校验材料，不是与口令并列的持有式凭证。答案以官方为准。","correctReason":"标准规定可通过智能密码钥匙、智能IC卡与口令相结合的方式实现身份鉴别。","wrongReason":"C：口令是题干中已给出的组成因素，不能再与自身相结合；D：证书链是验证证书有效性的手段，不是与口令配对的持有式鉴别凭证。","source":"GM/T 0029-2014《签名验签服务器技术规范》身份鉴别要求","keyPoint":"双因子鉴别：智能密码钥匙/智能IC卡＋口令"},{"id":"第二部分专业题-三、标准题-多选题-46","no":46,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"在GM/T0033-2023《时间戳接口规范》中，提及的时间戳响应消息体部分有 （ ）。","options":[{"key":"A","text":"时间戳信息摘要值"},{"key":"B","text":"时间戳证书序列号"},{"key":"C","text":"时间戳签名值"},{"key":"D","text":"时间戳签名算法标识符"}],"answer":"ABCD","analysis":"该题考时间戳响应消息体的组成部分。一次完整的时间戳响应要能让验证方独立验签，因此消息体中必须包含时间戳信息摘要值、时间戳证书序列号、时间戳签名值和签名算法标识符四项。它们分工清晰：摘要值是被签名数据经杂凑后的结果，序列号用于定位并获取对应的时间戳证书，签名值是核心的证明数据，算法标识符告诉验证方该用哪种算法验签。缺任何一项都无法完成验证，四项共同构成可验证的时间戳证据。答案以官方为准。","correctReason":"标准规定时间戳响应消息体包含时间戳信息摘要值、时间戳证书序列号、时间戳签名值和签名算法标识符。","wrongReason":"B：并非错误项，时间戳证书序列号是响应消息体用于定位验证证书的必要字段；C：并非错误项，时间戳签名值是响应消息体的核心内容。","source":"GM/T 0033-2023《时间戳接口规范》时间戳响应消息体","keyPoint":"响应四要素：摘要值、证书序列号、签名值、算法标识"},{"id":"第二部分专业题-三、标准题-多选题-47","no":47,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"在GM/T0123-2022《时间戳服务器密码检测规范》中，设备自检包括（ ）。","options":[{"key":"A","text":"上电自检"},{"key":"B","text":"周期自检"},{"key":"C","text":"复位自检"},{"key":"D","text":"接收指令后自检"}],"answer":"ABCD","analysis":"该题考时间戳服务器设备自检的触发时机。检测规范把自检分为上电自检（开机时对关键部件做一遍检查）、周期自检（运行中按设定周期自动检查）、复位自检（复位后重新校验）和接收指令后自检（收到特定指令时按要求执行检查）四类。四种时机共同覆盖了设备从开机、运行、复位到受控触发的全生命周期，目的是及时发现密码功能异常，避免输出不可信的时间戳。凡是自检类题目，先想「什么时候检」，再想「检什么」。答案以官方为准。","correctReason":"标准规定设备自检包括上电自检、周期自检、复位自检和接收指令后自检四类。","wrongReason":"C：并非错误项，复位自检是标准规定的自检类型之一；D：并非错误项，接收指令后自检同样属于规定的自检类型。","source":"GM/T 0123-2022《时间戳服务器密码检测规范》设备自检","keyPoint":"自检四时机：上电、周期、复位、接收指令后"},{"id":"第二部分专业题-三、标准题-多选题-48","no":48,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"在GM/T0123-2022《时间戳服务器密码检测规范》中，应至少支持用户通过 的通信方式包括（ ）发送时间戳申请。","options":[{"key":"A","text":"电子邮件"},{"key":"B","text":"文件"},{"key":"C","text":"HTTP"},{"key":"D","text":"SOAP"}],"answer":"ABCD","analysis":"该题考时间戳服务器受理申请时可用的通信方式。标准要求设备至少支持用户通过电子邮件、文件、HTTP和SOAP四种方式提交时间戳申请。前两种适合批量、离线的盖章场景，后两种适合应用系统在线实时调用，这种多协议支持体现了时间戳服务既要适配传统业务流程、又要适配程序化调用的定位。四种方式都属于「至少应支持」的范围，不存在超纲的干扰项。答案以官方为准。","correctReason":"标准要求至少支持电子邮件、文件、HTTP和SOAP四种方式发送时间戳申请。","wrongReason":"A：并非错误项，电子邮件是标准规定的申请方式之一；D：并非错误项，SOAP同样是标准要求支持的申请方式。","source":"GM/T 0123-2022《时间戳服务器密码检测规范》通信方式要求","keyPoint":"申请四通道：电子邮件、文件、HTTP、SOAP"},{"id":"第二部分专业题-三、标准题-多选题-49","no":49,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"在GM/T0036-2014《采用非接触卡的门禁系统密码应用技术指南》中，密钥 管理与发卡系统的功能包括（ ）。","options":[{"key":"A","text":"生成密钥"},{"key":"B","text":"注入密钥"},{"key":"C","text":"刷卡开门"},{"key":"D","text":"密钥分散"}],"answer":"ABD","analysis":"该题考门禁系统中密钥管理与发卡系统的功能范围。该系统的职责围绕密钥和卡片展开：生成密钥（产生系统所需的各级密钥）、注入密钥（把密钥写入卡片或终端设备）、密钥分散（按卡号或扇区派生出各级工作密钥，实现一卡一密）。而刷卡开门是门禁终端在现场的使用功能，属于业务应用环节，与发卡系统的密钥管理职责无关。区分「密钥侧」和「使用侧」是解这类题的关键。答案以官方为准。","correctReason":"密钥管理与发卡系统的功能包括生成密钥、注入密钥和密钥分散。","wrongReason":"C：刷卡开门是门禁终端的现场使用功能，不属于密钥管理与发卡系统的职责。","source":"GM/T 0036-2014《采用非接触卡的门禁系统密码应用技术指南》密钥管理与发卡系统","keyPoint":"发卡系统管密钥：生成、注入、分散；刷卡开门属使用侧"},{"id":"第二部分专业题-三、标准题-多选题-50","no":50,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"GM/T0036-2014《采用非接触卡的门禁系统密码应用技术指南》，可使用的 算法有（ ）。","options":[{"key":"A","text":"SM4"},{"key":"B","text":"SM1"},{"key":"C","text":"DES"},{"key":"D","text":"SM7"}],"answer":"ABD","analysis":"该题考门禁指南中允许使用的密码算法。指南推荐采用国产商用密码算法，即SM1、SM4和SM7：SM4是公开的分组密码算法，常用于数据加密与密钥分散；SM1是分组密码算法，以硬件实现为主，用于对称加解密；SM7是非接触卡专用的分组密码算法，正好契合非接触卡门禁场景。选项中的DES属于早期的国际算法，已不具备足够安全强度，不在该指南允许使用之列。答案以官方为准。","correctReason":"指南允许使用的算法为SM1、SM4、SM7等国密算法，DES不在其中。","wrongReason":"C：DES密钥长度偏短、安全强度不足，不属于该指南允许使用的算法。","source":"GM/T 0036-2014《采用非接触卡的门禁系统密码应用技术指南》密码算法要求","keyPoint":"门禁可用SM1、SM4、SM7，不用DES"},{"id":"第二部分专业题-三、标准题-多选题-51","no":51,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"某公司采购了一批动态口令令牌，用于其OA 系统对登录用户的身份鉴别。 这批动态口令令牌处于出厂状态，依据GM/T0021-2023《动态口令密码应用技 术规范》，以下说法正确的是（ ）。","options":[{"key":"A","text":"此时令牌处于未激活状态，此时不对该令牌的口令进行鉴别"},{"key":"B","text":"令牌激活后令牌处于就绪状态，此时令牌用于口令鉴别"},{"key":"C","text":"连续输入多次PIN 码错误后，令牌进入作废状态，此时不对该令牌的口令进行 鉴别"},{"key":"D","text":"令牌被挂起后处于挂起状态，此时不对该令牌的口令进行鉴别"}],"answer":"ABD","analysis":"该题考动态口令令牌的状态机以及各状态下能否进行口令鉴别。出厂状态下令牌处于未激活状态，系统不对该令牌的口令进行鉴别；激活后进入就绪状态，此时令牌才正式用于口令鉴别；被挂起后处于挂起状态，同样不参与口令鉴别。选项C的错误在于把触发条件与结果对应错了：连续多次PIN码错误导致的是令牌作废而非挂起，挂起一般由管理侧的主动操作产生。因此状态名称、触发条件、能否鉴别这三者要一一对应记忆。答案以官方为准。","correctReason":"未激活、挂起状态下均不对令牌口令进行鉴别，激活后的就绪状态才用于口令鉴别。","wrongReason":"C：连续多次输入PIN码错误导致的是令牌作废（而非挂起），该选项把触发条件与状态对应错了。","source":"GM/T 0021-2023《动态口令密码应用技术规范》令牌状态管理","keyPoint":"未激活/挂起不鉴别；激活后就绪可鉴别；多次PIN错→作废"},{"id":"第二部分专业题-三、标准题-多选题-52","no":52,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"某省厅OA 系统通过基于动态口令对用户进行身份鉴别，对于动态口令系统 来说种子密钥管理系统的安全防护至关重要。以下属于GM/T0021-2023《动态 口令密码应用技术规范》中种子密钥管理系统的种子密钥存储的合规方式有 （ ）。","options":[{"key":"A","text":"储在密码设备内"},{"key":"B","text":"加密后存储在密码设备以外的位置（例如数据库）,且加密所使用的密钥加密密 钥存储在密码设备内"},{"key":"C","text":"明文存储于数据库中"},{"key":"D","text":"通过哈希算法处理后存储于数据库中"}],"answer":"AB","analysis":"该题考种子密钥存储的合规方式。种子密钥是动态口令生成算法的根，一旦泄露即可推算出任意时刻的口令，所以规范只认可两条路径：直接存储在密码设备内部；或加密后存储在设备之外的数据库等位置，且加密所用的密钥加密密钥必须保存在密码设备内。选项C明文入库等于直接暴露种子密钥；选项D也站不住——种子密钥需要能取出参与口令运算，只做哈希无法还原，哈希仅适用于口令校验值。答案以官方为准。","correctReason":"种子密钥只能存于密码设备内，或加密存于设备外且密钥加密密钥保存在密码设备内。","wrongReason":"C：明文存储于数据库会直接泄露种子密钥，口令可被任意推算；D：哈希不可逆，无法还原出用于生成口令的种子密钥，不满足使用要求。","source":"GM/T 0021-2023《动态口令密码应用技术规范》种子密钥存储要求","keyPoint":"种子密钥：设备内，或设备外加密＋KEK在设备内"},{"id":"第二部分专业题-三、标准题-多选题-53","no":53,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"GM/T0031-2014《安全电子签章密码技术规范》中规定（ ）原因导致的签 章人证书有效性验证失败，可直接退出验证流程。","options":[{"key":"A","text":"证书有效期过期错误"},{"key":"B","text":"密钥用法不正确"},{"key":"C","text":"证书信任链验证失败"},{"key":"D","text":"证书状态已吊销"}],"answer":"BC","analysis":"该题考电子签章验证中证书有效性失败的处置逻辑。密钥用法不正确意味着该证书本身就不具备签名用途，证书信任链验证失败意味着签发路径不可信，这两类属于证书结构性、根本性的硬错误，验完就已经可以下结论，无需再查状态，可以直接退出验证流程。而证书有效期过期与证书状态已吊销属于证书状态类信息，验证流程需要按规范继续获取和判定状态信息后才能给出最终结论。因此本题要把握「结构性错误可直退、状态类问题需继续」这条分界。答案以官方为准。","correctReason":"密钥用法不正确、证书信任链验证失败属于证书根本性错误，标准规定可直接退出验证流程。","wrongReason":"A：证书有效期过期属于状态类问题，仍需按流程继续处理和判定；D：证书状态已吊销同样属于状态信息，不能据此直接退出验证流程。","source":"GM/T 0031-2014《安全电子签章密码技术规范》签章验证流程","keyPoint":"密钥用法错／信任链失败可直接退出；过期、吊销属状态待判"},{"id":"第二部分专业题-三、标准题-多选题-54","no":54,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"GM/T0031-2014《安全电子签章密码技术规范》通过使用安全电子签章技术， 可以确保文档的（ ）。","options":[{"key":"A","text":"机密性"},{"key":"B","text":"完整性"},{"key":"C","text":"来源的真实性"},{"key":"D","text":"不可否认性"}],"answer":"BCD","analysis":"该题考电子签章能提供的安全属性。签章的本质是对文档做杂凑后用签章人私钥签名，验签即可发现文档是否被改动、确认签名者身份，并由私钥独占性形成不可否认的证据链，因此完整性、来源真实性和不可否认性都能得到保障。选项A的机密性做不到，因为签章后的文档内容通常仍是明文，谁拿到都能看，机密性必须依靠加密来提供。命题人正是利用「签名与加密都叫密码技术」这一点设置易混点，做题时要牢记签名解决的是真伪与责任问题，不解决保密问题。答案以官方为准。","correctReason":"电子签章通过杂凑加签名保障文档完整性、来源真实性和不可否认性。","wrongReason":"A：签章不改变文档明文的可见性，文档内容仍是明文，机密性需靠加密而非签名实现。","source":"GM/T 0031-2014《安全电子签章密码技术规范》安全电子签章功能","keyPoint":"签章给完整性、真实性、不可否认性，不给机密性"},{"id":"第二部分专业题-三、标准题-多选题-55","no":55,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"在GM/T0071-2019《电子文件密码应用指南》中，电子文件的文件内容完整 性保护，进行签名操作步骤包括（ ）。","options":[{"key":"A","text":"获取签名算法、杂凑算法标识"},{"key":"B","text":"调用杂凑算法服务对文件内容明文计算摘要"},{"key":"C","text":"使用业务操作者或应用系统的签名私钥对摘要值进行签名"},{"key":"D","text":"将签名值、算法标识和签名证书按顺序填充至安全属性中"}],"answer":"ABCD","analysis":"该题考电子文件内容完整性保护的签名操作步骤。规范流程是：获取签名算法与杂凑算法标识，调用杂凑算法服务对文件内容明文计算摘要，用业务操作者或应用系统的签名私钥对摘要值签名，再把签名值、算法标识和签名证书按顺序填充至安全属性。前三步是标准的「先杂凑、后签名」结构，先算摘要而非直签全文，是因为摘要长度固定、效率高且覆盖全文。第四步保证验证方能拿到算法标识和证书，独立复现验签。答案以官方为准。","correctReason":"标准规定的步骤为获取算法标识、计算文件内容摘要、用签名私钥签名、将签名值算法标识与签名证书填入安全属性。","wrongReason":"A：并非错误项，获取签名算法与杂凑算法标识是签名流程的第一步；D：并非错误项，将签名值、算法标识和签名证书按顺序填充至安全属性是规定的收尾步骤。","source":"GM/T 0071-2019《电子文件密码应用指南》文件内容完整性保护","keyPoint":"先杂凑后签名，再把签名值＋算法标识＋证书写入安全属性"},{"id":"第二部分专业题-三、标准题-多选题-56","no":56,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"在GM/T0011-2023《可信计算 可信密码支撑平台功能与接口规范》中，以 下（ ）是SM2 引擎的功能。","options":[{"key":"A","text":"产生SM2 密钥对"},{"key":"B","text":"执行SM2 加/解密"},{"key":"C","text":"执行SM2 签名运算"},{"key":"D","text":"杂凑运算"}],"answer":"ABC","analysis":"该题考可信密码支撑平台中SM2引擎的功能划分。SM2引擎负责的是基于椭圆曲线的非对称运算，包括产生SM2密钥对、执行SM2加解密、执行SM2签名运算，这三项都属于SM2密码体制的本职能力。选项D的杂凑运算由SM3引擎承担，属于另一类引擎的功能，虽然签名过程中会调用杂凑算法，但那是调用关系，不代表SM2引擎自身具备杂凑功能。做题时把引擎与算法一一对应，就能快速排除跨算法的干扰项。答案以官方为准。","correctReason":"SM2引擎的功能为产生SM2密钥对、执行SM2加解密和执行SM2签名运算。","wrongReason":"D：杂凑运算由SM3引擎负责，不属于SM2引擎的功能范围。","source":"GM/T 0011-2023《可信计算 可信密码支撑平台功能与接口规范》SM2引擎","keyPoint":"SM2引擎管密钥对、加解密、签名；杂凑归SM3引擎"},{"id":"第二部分专业题-三、标准题-多选题-57","no":57,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"在GM/T0011-2023《可信计算 可信密码支撑平台功能与接口规范》中，外 部实体可以向平台请求验证平台的完整性。平台报告其完整性包括（ ）。","options":[{"key":"A","text":"平台启动后，外部实体向平台发送完整性度量报告的请求"},{"key":"B","text":"可信密码模块收集 PCR 的值，使用平台身份密钥（PIK）对 PCR 的值进行签 名"},{"key":"C","text":"平台将PCR 的值， PIK 对PCR 值的签名和PIK 证书发送给验证者"},{"key":"D","text":"可信密码模块将PCR 的值进行加密"}],"answer":"ABC","analysis":"该题考平台向外部实体报告完整性的流程。平台启动后，外部实体先向平台发送完整性度量报告的请求；可信密码模块随后收集PCR的值，并用平台身份密钥PIK对这些值签名；最后平台把PCR的值、PIK对PCR值的签名以及PIK证书一并发送给验证者。验证者用证书验证签名，从而判断PCR所反映的平台状态是否可信。选项D不对：完整性报告的目的是让验证者核对度量值，PCR的值需要明文可见才可核对，加密只会让验证者无法比对，标准也未要求加密。答案以官方为准。","correctReason":"平台报告完整性的流程为接收请求、可信密码模块收集PCR值并用PIK签名、将PCR值与签名及PIK证书发送给验证者。","wrongReason":"D：PCR的值需以明文提交供验证者比对，报告过程并不对PCR值做加密。","source":"GM/T 0011-2023《可信计算 可信密码支撑平台功能与接口规范》平台完整性报告","keyPoint":"完整性报告：PIK签PCR值＋证书送验证者，PCR不加密"},{"id":"第二部分专业题-三、标准题-多选题-58","no":58,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"GM/T0037-2014《证书认证系统检测规范》中，证书注册系统对申请信息的 录入需要检测的内容包括（ ）。","options":[{"key":"A","text":"应能提供录入和修改证书申请信息的界面"},{"key":"B","text":"应能选择所申请数字证书的密钥类型及长度"},{"key":"C","text":"应支持批量证书申请信息的导入"},{"key":"D","text":"应能自动使操作员对其操作行为进行签名"}],"answer":"ABD","analysis":"该题考证书注册系统在申请信息录入环节的检测点。规范要求系统应能提供录入和修改证书申请信息的界面（保证信息可维护）、应能选择所申请数字证书的密钥类型及长度（保证密钥参数符合应用需要）、应能自动使操作员对其操作行为进行签名（保证录入行为可追溯、不可抵赖）。选项C的批量导入属于受理方式与效率层面的功能，不在申请信息录入的检测内容之列。做题时要注意「录入」强调的是界面、参数和操作留痕三件事。答案以官方为准。","correctReason":"申请信息录入的检测内容包括提供录入修改界面、可选择密钥类型及长度、操作员操作行为自动签名。","wrongReason":"C：批量证书申请信息的导入不属于申请信息录入的检测内容。","source":"GM/T 0037-2014《证书认证系统检测规范》证书注册系统检测","keyPoint":"录入检测三查：界面可改、密钥类型长度可选、操作自动签名"},{"id":"第二部分专业题-三、标准题-多选题-59","no":59,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"GM/T0037-2014《证书认证系统检测规范》中，证书认证系统产品包括下列 选项中的（ ）。","options":[{"key":"A","text":"签发系统服务器"},{"key":"B","text":"注册系统服务器"},{"key":"C","text":"LDAP 服务器"},{"key":"D","text":"OCSP 服务器"}],"answer":"ABCD","analysis":"该题考证书认证系统的产品组成。一套完整的证书认证系统由多个服务器协同工作：签发系统服务器负责证书的实际签发与CRL生成，注册系统服务器负责受理申请、审核身份并录入信息，LDAP服务器对外发布证书与证书撤销列表供查询下载，OCSP服务器提供在线证书状态查询服务。四者分别承担「签发、注册、发布、状态查询」职能，缺一不可，因此四个选项都属于证书认证系统的组成部分。答案以官方为准。","correctReason":"证书认证系统由签发系统服务器、注册系统服务器、LDAP服务器和OCSP服务器等共同组成。","wrongReason":"B：并非错误项，注册系统服务器是受理与审核证书申请的必要部件；D：并非错误项，OCSP服务器提供在线证书状态查询，属于系统组成部分。","source":"GM/T 0037-2014《证书认证系统检测规范》系统组成","keyPoint":"CA四件套：签发、注册、LDAP、OCSP"},{"id":"第二部分专业题-三、标准题-多选题-60","no":60,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"以下密码设备可被GM/T0051-2016《密码设备管理 对称密钥管理技术规范》 管理的是（ ）。","options":[{"key":"A","text":"密码机"},{"key":"B","text":"密码卡"},{"key":"C","text":"智能IC 卡"},{"key":"D","text":"智能密码钥匙"}],"answer":"AB","analysis":"该题考对称密钥管理技术规范的适用设备范围。GM/T0051-2016面向的是具备密码运算与管理能力的密码设备，如密码机和密码卡，它们可以通过设备管理中心统一完成对称密钥的产生、分发、更新、备份与销毁等生命周期管理。智能IC卡和智能密码钥匙属于面向终端用户的密钥载体，其密钥管理与卡片个人化流程由相应的卡片类规范约束，不在本标准的管理设备范围内。记准「管理对象是密码机与密码卡」这个定位，此题即可秒选。答案以官方为准。","correctReason":"标准管理的对象为密码机、密码卡等密码设备。","wrongReason":"C：智能IC卡属于用户侧密钥载体，不在该规范管理的密码设备范围内；D：智能密码钥匙同属载体类设备，与本规范的适用对象不同。","source":"GM/T 0051-2016《密码设备管理 对称密钥管理技术规范》适用范围","keyPoint":"对称密钥管理对象：密码机、密码卡（非卡片类载体）"},{"id":"第二部分专业题-三、标准题-多选题-61","no":61,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"在GM/T0051-2016《密码设备管理 对称密钥管理技术规范》中，被管密码 设备的技术要求包括（ ）。","options":[{"key":"A","text":"由设备管理代理接收密钥管理指令，由密钥管理代理处理密钥管理操作"},{"key":"B","text":"与设备管理结合，根据密钥状态支持密钥申请主动上报"},{"key":"C","text":"支持标准密钥管理协议，将标准密钥封装解析为密码设备可识别的原子密钥"},{"key":"D","text":"对于存量密码设 备，支持将标准密钥管理协议适配转换为存量设备专用密钥 管理指令"}],"answer":"ABCD","analysis":"本题考被管密码设备应满足的技术要求。标准要求设备内由设备管理代理接收管理指令、由密钥管理代理处理密钥操作，实现管理与密钥操作分离；要与设备管理结合，按密钥状态支持密钥申请主动上报；还要支持标准密钥管理协议，把标准密钥封装解析成设备可识别的原子密钥，并对存量设备做协议适配。四个选项分别对应代理分工、状态上报、标准协议解析和存量设备适配，均为必备能力，故选ABCD。易混点是「主动上报」不只为监控系统服务，密钥状态变化也要主动通知管理系统。","correctReason":"标准对密码设备提出的技术要求同时覆盖代理职责划分、密钥状态主动上报、标准密钥管理协议的解析，以及对存量设备的协议适配转换，四项均有要求，故全选。","wrongReason":"四项均为标准要求的被管密码设备技术要求，无错误选项。易错在于把B的密钥状态主动上报误当成仅面向监控的功能、把D的存量设备适配当成可选项而漏选。","source":"GM/T 0051-2016《密码设备管理 对称密钥管理技术规范》被管密码设备技术要求","keyPoint":"被管设备：双代理分工＋状态主动上报＋标准协议解析＋存量设备适配"},{"id":"第二部分专业题-三、标准题-多选题-62","no":62,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"在GM/T0051-2016《密码设备管理 对称密钥管理技术规范》中，以下选项 属于密钥管理审计内容的是（ ）。","options":[{"key":"A","text":"对密钥生成、存储、分发等密钥管理事件，以及策略管理、身份认证等系统管 理事件进行审计"},{"key":"B","text":"对用户主动操作的管理事件进行审计"},{"key":"C","text":"记录服务器状态"},{"key":"D","text":"对服务器状态进行审计"}],"answer":"ABC","analysis":"本题考密钥管理系统的审计范围。审计要覆盖密钥生成、存储、分发等密钥管理事件和策略管理、身份认证等系统管理事件，也要覆盖用户主动操作的管理事件，做到关键操作可追溯。选项C只是「记录服务器状态」，属于设备运行监控与日志记录，不等于审计；选项D虽然提到审计服务器状态，但标准并未把服务器状态审计列入密钥管理审计内容，因此不选。注意区分「记录（监控）」与「审计」两个层次。","correctReason":"A、B分别对应密钥管理事件与系统管理事件、用户主动操作的管理事件，均属于标准规定的审计内容；服务器状态属于监控记录范围，不在其列。","wrongReason":"C：只记录服务器状态属于设备运行监控，不属于密钥管理审计内容；D：标准未把服务器状态审计列为密钥管理审计内容。","source":"GM/T 0051-2016《密码设备管理 对称密钥管理技术规范》密钥管理审计要求","keyPoint":"审计对象=密钥管理事件＋系统管理事件＋用户主动操作"},{"id":"第二部分专业题-三、标准题-多选题-63","no":63,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"GM/T0008-2012《安全芯片密码检测准则》中，下列内容属于安全等级2 对 故障攻击的要求的是（ ）。","options":[{"key":"A","text":"当安全芯片工作条件中的电压、频率、温度等可导致故障的工作参数的改变使 安全芯片处于易受攻击状态时，安全芯片应能够发现这些工作条件的改变，并采 取相应的防护措施保护密钥和敏感信息不泄露"},{"key":"B","text":"送检单位必须通过文档或其他方式对相应的防护措施及其有效性进行描述和 说明"},{"key":"C","text":"防护措施的有效性必须通过检测"},{"key":"D","text":"安全芯片须具有对光攻击的抵抗能 力，并能够采取相应的防护措施保护密钥 和敏感信息不泄露。"}],"answer":"ABC","analysis":"本题考安全等级2对故障攻击的要求。等级2要求芯片能发现电压、频率、温度等工作参数的异常改变，并采取防护措施保护密钥和敏感信息；同时要求送检单位以文档等方式描述和说明防护措施及其有效性，且有效性必须通过检测验证。选项D的光攻击抵抗能力属于更高级别（等级3及以上）对物理攻击的要求，等级2不要求，故不选。记忆要点是等级2「能发现异常＋有措施＋有文档＋能检测」，与更高级别的光攻击、版图遮蔽等要求分层。","correctReason":"等级2围绕工作参数异常发现、防护措施文档说明、防护有效性检测三方面提出故障攻击要求，故A、B、C正确。","wrongReason":"D：对光攻击的抵抗能力属于更高安全等级的要求，不是等级2对故障攻击的要求。","source":"GM/T 0008-2012《安全芯片密码检测准则》安全等级2故障攻击要求","keyPoint":"等级2故障攻击=发现参数异常＋防护措施＋文档说明＋检测验证"},{"id":"第二部分专业题-三、标准题-多选题-64","no":64,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"根据GM/T0035.2-2014《射频识别系统密码应用技术要求第2 部分：电子标 签芯片密码应用技术要求》，电子标签的密码安全要素包括（ ）、身份鉴别、 访问控制、审计记录、密码配置和其它安全措施。","options":[{"key":"A","text":"机密性"},{"key":"B","text":"完整性"},{"key":"C","text":"防冲突"},{"key":"D","text":"抗抵赖"}],"answer":"ABD","analysis":"本题考电子标签芯片的密码安全要素构成。标准把电子标签的密码安全要素分为机密性、完整性、抗抵赖、身份鉴别、访问控制、审计记录、密码配置及其它安全措施，题干已给出后五项，空缺的三项正是机密性、完整性和抗抵赖。防冲突是RFID空中接口为多标签同时应答而设计的通信机制，属于通信协议功能，不是密码安全要素，所以排除C。做题时抓住「密码」二字筛选项即可。","correctReason":"按标准列举，电子标签密码安全要素包括机密性、完整性、抗抵赖、身份鉴别、访问控制、审计记录、密码配置等，故补机密性、完整性、抗抵赖。","wrongReason":"C：防冲突解决的是多标签同时应答的通信冲突问题，属于RFID通信机制，不是密码安全要素。","source":"GM/T 0035.2-2014《射频识别系统密码应用技术要求 第2部分：电子标签芯片密码应用技术要求》密码安全要素","keyPoint":"标签密码要素：机密性·完整性·抗抵赖·鉴别·访问控制·审计·配置"},{"id":"第二部分专业题-三、标准题-多选题-65","no":65,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"GM/T0107-2021《智能IC 卡密钥管理系统基本技术要求》中，智能IC 卡业 务密钥中的对称密钥按照用途可分为（ ）。","options":[{"key":"A","text":"管理类密钥"},{"key":"B","text":"交易类密钥"},{"key":"C","text":"发卡机构公钥"},{"key":"D","text":"发卡机构私钥"}],"answer":"AB","analysis":"本题考智能IC卡业务密钥中对称密钥的用途分类。标准把业务密钥分为管理类密钥和交易类密钥两大类：管理类用于发卡、应用管理、权限控制等管理流程，交易类用于交易过程中的认证、加密与校验。发卡机构公钥和发卡机构私钥属于非对称密钥（证书体系），题干限定的是对称密钥，故C、D不选。做题关键是先看限制语「对称密钥」，再判断选项的密钥形态。","correctReason":"标准按用途把智能IC卡业务对称密钥划分为管理类密钥和交易类密钥，故A、B正确。","wrongReason":"C：发卡机构公钥属于非对称密钥；D：发卡机构私钥同样是非对称密钥，均不属于对称密钥的用途分类。","source":"GM/T 0107-2021《智能IC卡密钥管理系统基本技术要求》业务密钥分类","keyPoint":"IC卡业务对称密钥两类：管理类＋交易类，公私钥不属对称密钥"},{"id":"第二部分专业题-三、标准题-多选题-66","no":66,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"GM/T0107-2021《智能IC 卡密钥管理系统基本技术要求》中，以下对已归 档密钥的使用要求，说法正确的是（ ）。","options":[{"key":"A","text":"已归档的密钥只能用于证明在归档前进行的交易的合法性"},{"key":"B","text":"已归档的密钥不应返回到操作使用中"},{"key":"C","text":"已归档密钥不能影响在用的密钥的安全"},{"key":"D","text":"已归档的密钥可以重新恢复并加以使用"}],"answer":"ABC","analysis":"本题考已归档密钥的使用约束。密钥归档后只能用于验证归档之前发生的交易的合法性，不得再返回到操作使用中，也不能因其存在而影响在用密钥的安全，这是密钥全生命周期管理的基本要求。选项D主张已归档密钥可以重新恢复使用，恰恰违背了「归档即退出使用」的原则，会导致历史交易被伪造或密钥被滥用，故不选。复习时把归档与销毁区分开：归档是保留但不使用，销毁是不可恢复。","correctReason":"归档密钥仅可用于证明归档前交易的合法性，不得回到在用状态，且不得影响在用密钥安全，故A、B、C正确。","wrongReason":"D：已归档密钥不应返回到操作使用中，重新恢复使用违反密钥生命周期管理要求。","source":"GM/T 0107-2021《智能IC卡密钥管理系统基本技术要求》密钥归档要求","keyPoint":"归档密钥：仅证旧交易、不返用、不影响在用密钥安全"},{"id":"第二部分专业题-三、标准题-多选题-67","no":67,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"根据GM/T0104-2021《云服务器密码机技术规范》，关于云服务器密码机的 虚拟密码机镜像安全，下列描述正确的是（ ）。","options":[{"key":"A","text":"虚拟密码机的镜像文件应进行签名保护"},{"key":"B","text":"云服务器密码机应禁止签名验证不通过的虚拟密码机镜像在云服务器密码机 中运行"},{"key":"C","text":"虚拟密码机的镜像文件无需进行签名保护"},{"key":"D","text":"云服务器密码机不需要对虚拟密码机镜像进行验证"}],"answer":"AB","analysis":"本题考云服务器密码机中虚拟密码机镜像的安全要求。虚拟密码机以镜像形式在云服务器密码机内运行，为防止镜像被篡改或植入恶意代码，镜像文件必须做签名保护，云服务器密码机在加载前要验证签名，签名验证不通过的镜像禁止运行。选项C、D直接否定签名与验证的必要性，与要求相反。记忆点：镜像＝可信启动的根，必须「签名＋验签＋验不过不跑」。","correctReason":"标准要求虚拟密码机镜像文件进行签名保护，并禁止签名验证不通过的镜像在云服务器密码机中运行，故A、B正确。","wrongReason":"C：镜像必须做签名保护，说「无需签名」与要求相反；D：加载前必须验证镜像，说「不需要验证」错误。","source":"GM/T 0104-2021《云服务器密码机技术规范》虚拟密码机镜像安全要求","keyPoint":"虚拟密码机镜像：必须签名、必须验签、验不过不得运行"},{"id":"第二部分专业题-三、标准题-多选题-68","no":68,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"GM/T0104-2021《云服务器密码机技术规范》中要求虚拟密码机应当至少支 持下列密码算法中的（ ）。","options":[{"key":"A","text":"SM1"},{"key":"B","text":"SM2"},{"key":"C","text":"SM3"},{"key":"D","text":"SM4"}],"answer":"BCD","analysis":"本题考虚拟密码机至少应支持的密码算法。标准要求虚拟密码机支持SM2、SM3、SM4等公开的商用密码算法，以保证数字签名/密钥交换、杂凑、对称加解密等基本密码功能可用。SM1是分组密码算法，但其算法实现不公开、以硬件或授权方式提供，不属于标准要求虚拟密码机至少支持的算法集合，故不选A。做题时记住「公开算法必备，SM1不在此列」。","correctReason":"标准列出的至少支持算法为SM2、SM3、SM4等公开商用密码算法，故B、C、D正确。","wrongReason":"A：SM1算法实现不公开，标准未将SM1列入虚拟密码机至少应支持的算法范围。","source":"GM/T 0104-2021《云服务器密码机技术规范》虚拟密码机算法支持要求","keyPoint":"虚拟密码机至少支持SM2/SM3/SM4等公开算法，SM1不在其列"},{"id":"第二部分专业题-三、标准题-多选题-69","no":69,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"GM/T0104-2021《云服务器密码机技术规范》规定设备的管理检测包括（ ）。","options":[{"key":"A","text":"管理操作检测"},{"key":"B","text":"管理登录检测"},{"key":"C","text":"管理接口检测"},{"key":"D","text":"日志审计检测"}],"answer":"ABCD","analysis":"本题考云服务器密码机的管理检测项目。标准把管理检测划分为管理操作检测、管理登录检测、管理接口检测和日志审计检测等内容，分别核查管理操作是否受控、登录认证是否严格、管理接口是否合规、日志是否完整可审计。四个选项正好覆盖这四个方面，故选ABCD。复习时记住管理安全「四查」：查操作、查登录、查接口、查日志。","correctReason":"标准规定的管理检测包括管理操作检测、管理登录检测、管理接口检测和日志审计检测，四项齐全。","wrongReason":"四项均属标准规定的管理检测内容，无错误选项。易错是只记住管理操作检测与管理登录检测，漏掉管理接口检测和日志审计检测。","source":"GM/T 0104-2021《云服务器密码机技术规范》管理检测要求","keyPoint":"管理检测四查：操作、登录、接口、日志审计"},{"id":"第二部分专业题-三、标准题-多选题-70","no":70,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"GM/T0088-2020《云服务器密码机管理接口规范》中规定云服务器密码机管 理接口API 可以使用下列通信协议中的（ ）。","options":[{"key":"A","text":"HTTP"},{"key":"B","text":"TCP"},{"key":"C","text":"UDP"},{"key":"D","text":"TLCP 协议"}],"answer":"AD","analysis":"本题考云服务器密码机管理接口支持哪些通信协议。规范给出的管理接口API传输方式基于HTTP（HTTPS）协议，并要求采用TLCP等国密安全协议保障传输安全，因此协议层面只涉及HTTP与TLCP。TCP、UDP属于底层传输层协议，管理接口规范并不把它们作为可选的应用通信协议列出，故不选。记忆点：管理接口走「HTTP之上加TLCP」，不是裸TCP/UDP。","correctReason":"规范规定管理接口API可使用HTTP协议承载，并采用TLCP协议保障通信安全，故A、D正确。","wrongReason":"B：TCP是传输层协议，不是规范列出的管理接口应用通信协议；C：UDP无连接、不可靠，规范未将其作为管理接口通信协议。","source":"GM/T 0088-2020《云服务器密码机管理接口规范》管理接口通信协议要求","keyPoint":"管理接口=HTTP承载＋TLCP国密传输，裸TCP/UDP不算"},{"id":"第二部分专业题-三、标准题-多选题-71","no":71,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"根据GM/T0088-2020《云服务器密码机管理接口规范》，云服务器密码机管 理接口API 中，每个接口的输出中都返回的参数包括下列选项中的（ ）。","options":[{"key":"A","text":"requestId 请求ID"},{"key":"B","text":"status 状态码"},{"key":"C","text":"message 状态描述"},{"key":"D","text":"timestamp 服务器响应时间"}],"answer":"ABCD","analysis":"本题考管理接口API输出的公共返回参数。规范要求每个接口的输出都包含请求ID、状态码、状态描述和服务器响应时间等公共字段：requestId用于请求追踪，status表示成功或错误，message给出状态说明，timestamp记录响应时间，便于运维与问题定位。四个选项都属于接口输出的公共参数，故选ABCD。易错点是只记得status和message，忽略了requestId与timestamp也是必返字段。","correctReason":"规范规定所有管理接口的输出均统一返回requestId、status、message和timestamp等公共字段，故四项全选。","wrongReason":"四项均为各接口输出中必返的公共参数，无错误选项。易错是只记得status和message，漏掉同样必返的requestId和timestamp。","source":"GM/T 0088-2020《云服务器密码机管理接口规范》接口输出公共参数","keyPoint":"接口公共返回：请求ID＋状态码＋状态描述＋响应时间"},{"id":"第二部分专业题-三、标准题-多选题-72","no":72,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"GM/T0103-2021《随机数发生器总体框架》中，用于产生随机数的量子随机 过程一般包括（ ）。","options":[{"key":"A","text":"单光子路径选择"},{"key":"B","text":"相邻光子间时间间隔"},{"key":"C","text":"激光相位噪声"},{"key":"D","text":"放大自发辐射噪声"}],"answer":"ABCD","analysis":"本题考量子的随机过程有哪些。标准列举的量子随机过程包括单光子路径选择、相邻光子间时间间隔、激光相位噪声、放大自发辐射噪声等，这些过程的输出由量子力学固有的不确定性决定，理论上不可预测、不可复制，是量子随机数发生器的物理基础。四个选项均属于标准列举的量子随机过程，故选ABCD。复习时注意与经典热噪声、振荡器抖动等非量子熵源区分。","correctReason":"标准列举的量子随机过程涵盖单光子路径选择、相邻光子间时间间隔、激光相位噪声和放大自发辐射噪声，四项均属其列。","wrongReason":"四项均属标准列举的量子随机过程，无错误选项。易错是把激光相位噪声、放大自发辐射噪声误当作经典热噪声类熵源而排除。","source":"GM/T 0103-2021《随机数发生器总体框架》量子随机过程","keyPoint":"量子熵源：单光子路径、光子时间间隔、激光相位噪声、自发辐射噪声"},{"id":"第二部分专业题-三、标准题-多选题-73","no":73,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"以下属于GM/T0105-2021《软件随机数发生器设计指南》列举的通用熵源类 型的是（ ）。","options":[{"key":"A","text":"系统时间"},{"key":"B","text":"特定的系统中断事件"},{"key":"C","text":"磁盘状态"},{"key":"D","text":"人机交互输入事件"}],"answer":"ABCD","analysis":"本题考软件随机数发生器的通用熵源类型。指南列举的通用熵源包括系统时间、特定的系统中断事件、磁盘状态、人机交互输入事件等操作系统可采集的非确定性事件，它们都带有不可控的时间或状态抖动，可作为软件熵源采集。四个选项均属列举的通用熵源，故选ABCD。需要注意的是这些熵源的熵率低且可能被预测或观测，实际使用时要评估并在必要时做条件化处理。","correctReason":"指南列举的通用熵源包含系统时间、特定系统中断事件、磁盘状态和人机交互输入事件，四项均属通用熵源类型。","wrongReason":"四项均属指南列举的通用熵源类型，无错误选项。易错是低估系统时间、磁盘状态等低熵事件源的可采集性而漏选。","source":"GM/T 0105-2021《软件随机数发生器设计指南》通用熵源类型","keyPoint":"软件通用熵源：系统时间·中断事件·磁盘状态·人机交互输入"},{"id":"第二部分专业题-三、标准题-多选题-74","no":74,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"GM/T0105-2021《软件随机数发生器设计指南》中建议，除熵输入外，DRNG 输入还可以包括（ ）","options":[{"key":"A","text":"个性化字符串"},{"key":"B","text":"额外输入"},{"key":"C","text":"Nonce"},{"key":"D","text":"设备序列号"}],"answer":"ABC","analysis":"本题考DRNG的输入除了熵输入还有哪些。指南建议DRNG的输入包括熵输入、个性化字符串、额外输入以及Nonce：个性化字符串用于区分不同设备或不同应用实例，额外输入（如与时间、计数器相关的数据）用于增强前向安全与不可预测性，Nonce保证同一熵源在不同使用时结果不同。设备序列号不属于标准建议的DRNG输入项，且它可预测、可能泄露设备标识，故不选D。","correctReason":"指南把个性化字符串、额外输入和Nonce列为熵输入之外的DRNG输入，故A、B、C正确。","wrongReason":"D：设备序列号不属于标准建议的DRNG输入，其取值可预测、易泄露设备标识，不能作为随机性来源。","source":"GM/T 0105-2021《软件随机数发生器设计指南》DRNG输入要求","keyPoint":"DRNG输入=熵输入＋个性化字符串＋额外输入＋Nonce"},{"id":"第二部分专业题-三、标准题-多选题-75","no":75,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"GM/T0105-2021《软件随机数发生器设计指南》规定的健康测试包括（ ）。","options":[{"key":"A","text":"随意健康测试"},{"key":"B","text":"连续健康测试"},{"key":"C","text":"按需健康测试"},{"key":"D","text":"上电健康测试"}],"answer":"BCD","analysis":"本题考软件随机数发生器的健康测试种类。指南规定的健康测试包括上电健康测试、连续健康测试和按需健康测试：上电时检查熵源是否正常，运行中连续监测输出是否出现异常（如连续相同比特），按需测试则在调用时或指定条件下触发检查。选项A的「随意健康测试」不是标准术语，标准中的测试都有明确的触发条件与判据，不存在「随意」发起的测试类别，故不选。","correctReason":"标准规定的健康测试为上电健康测试、连续健康测试和按需健康测试三类，故B、C、D正确。","wrongReason":"A：标准中没有「随意健康测试」这一类别，健康测试均由明确的触发条件与判据定义。","source":"GM/T 0105-2021《软件随机数发生器设计指南》健康测试要求","keyPoint":"健康测试三类：上电、连续、按需；没有「随意」测试"},{"id":"第二部分专业题-三、标准题-多选题-76","no":76,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"根据GM/T0078-2020《密码随机数生成模块设计指南》，基于相位抖原理的 物理随机源的输出的随机比特序列质量受（ ）的影响。","options":[{"key":"A","text":"采样时钟的频率"},{"key":"B","text":"振荡源输出信号的抖动的标准差"},{"key":"C","text":"振荡源的振荡时钟频率"},{"key":"D","text":"采样时钟信号的抖动的标准差"}],"answer":"ABCD","analysis":"本题考基于相位抖原理的物理随机源输出质量受哪些因素影响。这类随机源利用振荡源输出信号相对于采样时钟的相位抖动来采样，输出比特序列的随机性取决于采样时钟频率、振荡源的振荡时钟频率、振荡源输出信号抖动的标准差以及采样时钟信号抖动的标准差等参数：频率决定采样节拍，抖动标准差决定每次采样落在「0」区或「1」区的概率偏差。四个参数都会影响输出质量，故选ABCD。","correctReason":"相位抖随机源的序列质量由采样时钟频率、振荡时钟频率、振荡源抖动标准差和采样时钟抖动标准差共同决定，故四项全选。","wrongReason":"四项都会影响基于相位抖原理的物理随机源输出序列质量，无错误选项。易错是只关注两项抖动标准差，忽视采样时钟频率与振荡时钟频率的作用。","source":"GM/T 0078-2020《密码随机数生成模块设计指南》基于相位抖原理的物理随机源","keyPoint":"相位抖随机源看四个量：两频率＋两抖动标准差"},{"id":"第二部分专业题-三、标准题-多选题-77","no":77,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"GM/T0078-2020《密码随机数生成模块设计指南》中，基于异或链的后处理 方法，下列说法正确的是（ ）。","options":[{"key":"A","text":"异或链方法通过将物理随机源输出序列经过多级触发器组合得到内部输出序 列"},{"key":"B","text":"该方法需要异或链的级数与物理随机源序列偏差大小正相关"},{"key":"C","text":"异或链级数越多，产生随机数效率越低"},{"key":"D","text":"在实际应用中，至少8 级以上的异或链才能清除随机源序列的偏差"}],"answer":"ABCD","analysis":"本题考异或链后处理方法。异或链把物理随机源输出序列经多级触发器异或组合得到内部输出序列（A）；级数要与物理随机源序列的偏差大小正相关，偏差越大需要越多级数（B）；级数越多，每产生一位输出需要消耗更多输入位，效率越低（C）；实际应用中通常需要至少8级以上的异或链才能把随机源序列的偏差清除到可接受水平（D）。可见异或链是拿效率换均匀性的经典后处理手段，四项均正确。","correctReason":"标准对异或链的原理、级数与偏差的正相关、级数与效率的负相关，以及至少8级以上的工程经验值均有明确描述，故四项全选。","wrongReason":"四项均与异或链后处理方法相符，无错误选项。易错是误以为级数越多越好（忽略效率随之下降），或不认可至少8级以上的工程经验值。","source":"GM/T 0078-2020《密码随机数生成模块设计指南》基于异或链的后处理方法","keyPoint":"异或链：级数随偏差增大、效率随级数下降、工程上至少8级"},{"id":"第二部分专业题-三、标准题-多选题-78","no":78,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"在GM/T0013-2021《可信计算可信密码模块符合性检测规范》中，基于TCM 厂商和评估者的不同能力，本标准建议采取联合（ ）的方式对TCM 进行测试","options":[{"key":"A","text":"测试常量"},{"key":"B","text":"变量"},{"key":"C","text":"压力测试"},{"key":"D","text":"集成测试"}],"answer":"AB","analysis":"本题考可信密码模块符合性检测的组织方式。考虑到TCM厂商与评估者的能力差异和信息不对称，标准建议采取联合「测试常量＋变量」的方式对TCM进行测试：常量部分使用标准规定的固定测试向量，保证结果可比；变量部分由厂商或评估者另行构造随机化、差异化的测试数据，防止只针对固定向量做过拟合，从而更真实地反映模块实现水平。压力测试与集成测试属于别的测试类型，不在本标准建议的联合方式之列。","correctReason":"标准建议采取联合测试常量与变量的方式对TCM进行测试，以兼顾结果可比性和防针对性拟合，故A、B正确。","wrongReason":"C：压力测试考查极限负载下的稳定性，不是本标准建议的联合测试方式；D：集成测试考查模块间协同，同样不属于此处所指的联合方式。","source":"GM/T 0013-2021《可信计算 可信密码模块符合性检测规范》测试方式","keyPoint":"TCM符合性检测：联合「测试常量＋变量」防针对性拟合"},{"id":"第二部分专业题-三、标准题-多选题-79","no":79,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"在GM/T0012-2020《可信计算 可信密码模块接口规范》中，非对称算法引 擎的是（ ）的单元。","options":[{"key":"A","text":"产生非对称密钥"},{"key":"B","text":"执行非对称加/解密"},{"key":"C","text":"执行签名运算"},{"key":"D","text":"执行验签运算"}],"answer":"ABCD","analysis":"本题考非对称算法引擎的职责范围。非对称算法引擎是TCM中承担非对称密码运算的功能单元，负责产生非对称密钥、执行非对称加/解密、执行签名运算和执行验签运算，四项都在其职责内，故选ABCD。理解要点是把「非对称」当作筛选条件：凡是涉及非对称密钥的产生、加解密、签名、验签的运算都归它，而对称加解密、杂凑等由对称算法引擎和杂凑算法引擎承担。","correctReason":"标准规定非对称算法引擎负责产生非对称密钥、执行非对称加/解密、签名运算和验签运算，四项均属其职责。","wrongReason":"四项均属非对称算法引擎的职能，无错误选项。易错是把签名运算、验签运算误归给杂凑算法引擎或对称算法引擎而漏选。","source":"GM/T 0012-2020《可信计算 可信密码模块接口规范》非对称算法引擎要求","keyPoint":"非对称引擎四职能：产生密钥、加解密、签名、验签"},{"id":"第二部分专业题-三、标准题-多选题-80","no":80,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"在GM/T0082-2020《可信密码模块保护轮廓》中，安全威胁冒名的目的包括 （ ）。","options":[{"key":"A","text":"身份标识"},{"key":"B","text":"安全角色"},{"key":"C","text":"受保护的功能"},{"key":"D","text":"安全导入"}],"answer":"ABD","analysis":"本题考安全威胁「冒名」的目的。标准中冒名威胁的目的是让攻击者取得身份标识、取得安全角色，以及完成安全导入（把数据或密钥导入到本不该由他操作的环境中），从而以合法身份进行未授权操作。选项C「受保护的功能」是被攻击对象或保护目标，不是冒名所追求的目的，故不选。做题时区分「威胁想得到什么」（身份标识、安全角色、安全导入）与「威胁想破坏什么」（受保护的功能）。","correctReason":"标准列出的冒名目的为获取身份标识、获取安全角色和实现安全导入，故A、B、D正确。","wrongReason":"C：受保护的功能是攻击企图破坏或滥用的对象，不属于冒名威胁的目的。","source":"GM/T 0082-2020《可信密码模块保护轮廓》安全威胁冒名","keyPoint":"冒名三目的：身份标识、安全角色、安全导入"},{"id":"第二部分专业题-三、标准题-多选题-81","no":81,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"根据GM/T0122-2022《区块链密码检测规范》，区块链中的交易记录包含（ ） 等信息。","options":[{"key":"A","text":"交易发起者"},{"key":"B","text":"交易内容"},{"key":"C","text":"交易接收者"},{"key":"D","text":"交易发起者的用户签名"}],"answer":"ABCD","analysis":"本题考区块链交易记录的构成。规范所述交易记录包含交易发起者、交易接收者、交易内容和交易发起者的用户签名等信息：前后两个字段标明交易的参与方，交易内容描述资产的转移或业务数据，用户签名则提供身份认证与抗抵赖，且签名使交易一旦入链就难以被篡改。四个选项均属交易记录的组成部分，故选ABCD。","correctReason":"规范列出的交易记录信息包括交易发起者、交易内容、交易接收者和交易发起者的用户签名，四项齐全。","wrongReason":"四项均属交易记录的组成部分，无错误选项。易错是只选交易发起者与交易内容，漏掉交易接收者和交易发起者的用户签名。","source":"GM/T 0122-2022《区块链密码检测规范》交易记录内容","keyPoint":"交易记录=发起者＋接收者＋内容＋发起者用户签名"},{"id":"第二部分专业题-三、标准题-多选题-82","no":82,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"根据GM/T0122-2022《区块链密码检测规范》，区块链通信可在（ ）配置 安全通道，以保证数据通信的安全。","options":[{"key":"A","text":"各个节点之间"},{"key":"B","text":"各个区块之间"},{"key":"C","text":"应用端与区块之间"},{"key":"D","text":"应用端与节点之间"}],"answer":"AD","analysis":"本题考区块链中安全通道的配置位置。规范要求在节点与节点之间、应用端与节点之间配置安全通道，以保证数据通信的机密性与完整性：节点间通道保护共识与同步数据，应用端与节点间的通道保护用户提交的交易与查询请求。区块是链上的数据结构，不是通信实体，谈不上在「区块之间」配置安全通道；应用端也不会直接与区块通信，故B、C不选。","correctReason":"规范规定可在各个节点之间以及应用端与节点之间配置安全通道，故A、D正确。","wrongReason":"B：区块是链上数据结构而非通信实体，不存在区块之间的安全通道；C：应用端不直接与区块通信，而是在应用端与节点之间建立通道。","source":"GM/T 0122-2022《区块链密码检测规范》通信安全要求","keyPoint":"安全通道两处：节点↔节点、应用端↔节点"},{"id":"第二部分专业题-三、标准题-多选题-83","no":83,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","stem":"GM/T0087-2020《浏览器密码应用接口规范 》中SM4 算法不包括（ ）应 用接口。","options":[{"key":"A","text":"加密"},{"key":"B","text":"解密"},{"key":"C","text":"签名"},{"key":"D","text":"验签"}],"answer":"CD","analysis":"本题是反向设问，问SM4算法不包括哪些应用接口。SM4是对称分组密码算法，接口规范只为它规定加密和解密两类应用接口，用于数据的对称加解密。签名与验签属于非对称密码算法的功能（如SM2），对称算法本身不具备签名能力，因此C、D正是SM4不包括的接口。做题时先看清「不包括」三个字，再按算法类型判断：对称无签名。","correctReason":"SM4是对称分组密码算法，接口规范只为其定义加密、解密接口，签名与验签属于非对称算法能力，故不包括的是C、D。","wrongReason":"A：加密是SM4的基本应用接口，属于包括的内容，不符合「不包括」的设问；B：解密同样是SM4的基本应用接口，属于包括的内容。","source":"GM/T 0087-2020《浏览器密码应用接口规范》SM4算法接口","keyPoint":"SM4只有加解密接口；签名验签属SM2等非对称算法"},{"id":"第二部分专业题-三、标准题-多选题-84","no":84,"kind":"multi","part":"第二部分专业题","cat":"三、标准题","type":"多选题","s
