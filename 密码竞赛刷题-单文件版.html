常估计需要数百万物理量子比特，主要原因就是纠错开销（Overhead）。"}],"answer":"ACD","analysis":"本题考查量子纠错与表面码的基本结论。表面码是当前最主流的量子纠错码，其容错阈值约在1%量级，物理错误率低于阈值时增大码距可指数级压低逻辑错误率，A正确；纠错代价是成千上万个物理量子比特编码一个逻辑量子比特，开销远大于1，B把逻辑与物理比特的关系说反了；量子纠错的症状测量会把不同Pauli错误映射到同一症状，即错误简并，这是经典纠错没有的挑战，C正确；因此即便门保真度99.9%，分解RSA-2048仍普遍估计需数百万物理量子比特，D正确。","correctReason":"A、C、D分别对应表面码阈值与码距特性、错误简并特性、纠错开销量级，均为量子纠错领域的公认结论。","wrongReason":"B：表面码中物理量子比特数远大于逻辑量子比特数（开销通常达10³量级以上），逻辑比特多于物理比特的说法与事实相反，工程上恰恰难在开销过大。","source":"量子纠错与表面码通用理论（容错阈值定理、错误简并）；量子安全影响见 GM/T 0133-2023 相关背景","keyPoint":"表面码阈值约1%，码距↑逻辑错误率↓；物理比特远多于逻辑比特"},{"id":"第二部分专业题-二、密码前沿技术-多选题-38","no":38,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"某政务系统需采用抗量子数字签名算法，评估了ML-DSA（原Dilithium）。 密码分析师指出，Dilithium 使用了“拒绝采样”（RejectionSampling）技术。关 于ML-DSA 的设计原理，正确的是（ ）。","options":[{"key":"A","text":"ML-DSA 的安全性基于 M-SIS（ModuleShortIntegerSolution） 和 MLWE 问 题的困难性，属于格基数字签名算法。"},{"key":"B","text":"拒绝采样技术的主要作用是消除私钥和随机盲化因子在签名输出中留下的正 态分布尾部信息，防止通过大量签名样本反推出私钥（侧信道/统计攻击）。"},{"key":"C","text":"Dilithium 采用了“Flat-ShamirwithAborts”范式，即先构造非交互式零知识证 明（NIZK），若生成的签名多项式系数过大则丢弃重试，以保证输出服从均匀 分布。"},{"key":"D","text":"ML-DSA 的签名长度和公钥尺寸均明显小于基于哈希的SPHINCS+，但其安 全性依赖于量子计算机无法解决的格归约问题，属于有状态签名算法。"}],"answer":"ABC","analysis":"本题考查格签名ML-DSA（Dilithium）的设计机理。其安全性建立在模格上的M-SIS与MLWE问题困难性之上，属格基签名，A正确；签名形如z=y+c·s，若y服从过宽分布，多个签名样本会泄露私钥信息，拒绝采样正是为了切除分布尾部、让输出分布不依赖私钥，B正确；其范式是Fiat-Shamir with Aborts，先构造非交互零知识证明，系数超界即丢弃重试，C正确。而ML-DSA是无状态方案，不依赖任何状态计数器。","correctReason":"A、B、C准确描述了ML-DSA的困难问题基础、拒绝采样的作用与Fiat-Shamir with Aborts的构造范式。","wrongReason":"D：ML-DSA是标准的无状态签名算法，无需维护每次签名的状态计数器，题中“属于有状态签名算法”表述错误（有状态的是XMSS、LMS等基于哈希的签名）。","source":"NIST FIPS 204（ML-DSA）算法设计；后量子签名通用知识","keyPoint":"ML-DSA基于M-SIS/MLWE，拒绝采样，且为无状态"},{"id":"第二部分专业题-二、密码前沿技术-多选题-39","no":39,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"某物联网公司无法在设备上保存每次签名的状态计数器，因此排除了基于哈 希的有状态签名，转而关注 SLH-DSA（原SPHINCS+）。关于SLH-DSA 的设 计特点，正确的有（ ）。","options":[{"key":"A","text":"SLH-DSA 是一种无状态（Stateless） 的基于哈希函数的数字签名方案，其安 全性仅依赖于哈希函数的抗碰撞（CollisionResistance）性和抗原像性，与数论 难题无关。"},{"key":"B","text":"SLH-DSA 使用Merkle 树来聚合大量一次性签名（OTS）公钥，并利用WOTS+ （WinternitzOTS+） 来缩短签名长度，但在每次签名时仍需生成新的OTS 密钥 对。"},{"key":"C","text":"由于SLH-DSA 不涉及大整数运算和格点运算，其签名和验签速度极快，且 公钥和私钥尺寸极小，适合资源受限的微控制器。"},{"key":"D","text":"SLH-DSA 虽然提供了极高的量子安全性（保守），但其签名长度（通常几十 KB）远大于ML-DSA 和Falcon，这是其主要性能短板。"}],"answer":"ABD","analysis":"本题考查SLH-DSA（SPHINCS+）的定位。它是无状态哈希签名，安全性只归结为哈希函数的抗碰撞与抗原像性质，不依赖数论或格难题，A正确；其结构用Merkle树聚合大量一次性签名公钥，并用WOTS+压缩单次签名长度，每次签名仍要现场生成新的OTS密钥对，B正确；代价是签名体积大，通常几十KB，远大于ML-DSA和Falcon，D正确。C的方向恰好相反。","correctReason":"A、B、D准确描述了SLH-DSA的安全假设、Merkle树+WOTS+结构和签名长度短板这一核心性能瓶颈。","wrongReason":"C：SLH-DSA虽无大整数与格运算，但要完成大量哈希链计算，签名与验签速度并不“极快”，公钥和私钥尺寸也不小（公钥约几十字节但签名几十KB），并不适合资源受限微控制器。","source":"NIST FIPS 205（SLH-DSA）算法说明；基于哈希签名通用知识","keyPoint":"SLH-DSA无状态、只依赖哈希、签名几十KB是最大短板"},{"id":"第二部分专业题-二、密码前沿技术-多选题-40","no":40,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"某备份系统拟采用基于编码的McEliece 密码体制作为长期归档数据的加密 方案，以应对远期量子威胁。关于McEliece 体制（ClassicMcEliece）的特点， 正确的有（ ）。","options":[{"key":"A","text":"McEliece 的安全性建立在一般线性码的译码问题（SyndromeDecoding） 的 NP 困难性上，该问题在量子计算下缺乏有效的多项式时间解法。"},{"key":"B","text":"ClassicMcEliece 使用不可约二元Goppa 码作为陷门，通过随机置换生成码字， 攻击者由于不知道置换和生成矩阵结构，无法有效译码。"},{"key":"C","text":"McEliece 方案的公钥尺寸极大（通常数百KB 至1MB 以上），这是其未被广 泛应用的主要原因之一，但其加密和解密速度极快，优于基于格的KEM。"},{"key":"D","text":"McEliece 方案存在极低的解密失败率（DFR，DecryptionFailureRate），在标 准参数下 DFR 不为零，这在密钥封装中可能被利用进行适应性选择密文攻击 （CCA）。"}],"answer":"ABC","analysis":"本题考查McEliece/ClassicMcEliece体制的特点。其安全性归约到一般线性码的伴随式译码问题，该问题是NP困难的，且至今没有量子多项式算法，属于保守型后量子方案，A正确；它以不可约二元Goppa码为陷门，再经随机置换打乱码结构，攻击者不知置换与生成矩阵结构便难以译码，B正确；它的最大短板正是公钥极大（数百KB至1MB以上），因而工程部署受限，但加解密运算极快，C正确。D的描述与事实相反。","correctReason":"A、B、C分别准确描述了其困难问题基础、Goppa码加随机置换的陷门构造，以及公钥巨大但加解密高效这一典型特征。","wrongReason":"D：ClassicMcEliece在标准参数下解密失败率可做到零（或极低并被显式处理），并非存在“极低但非零的DFR”，且该题设不成立；DFR被用于CCA攻击的典型是部分格基KEM（如早期Kyber分析）。","source":"Classic McEliece（基于编码的后量子KEM）算法说明；后量子密码通用知识","keyPoint":"McEliece=Goppa码+置换，公钥巨大、速度快、DFR可为零"},{"id":"第二部分专业题-二、密码前沿技术-多选题-41","no":41,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"为防止AI 训练数据、模型参数或用户隐私等信息在处理、存储和传输过程 中被非法获取或泄露，采取有效的安全防护措施至关重要。以下哪几项是防止 AI 数据泄露的可行方法？（ ）","options":[{"key":"A","text":"数据脱敏"},{"key":"B","text":"访问权限控制"},{"key":"C","text":"加密存储"},{"key":"D","text":"增加显示器亮度"}],"answer":"ABC","analysis":"本题考查防止AI数据泄露的常规控制措施。数据脱敏通过去标识化、泛化等手段降低数据敏感度；访问权限控制按最小权限与职责分离限制“谁能看什么”；加密存储保证即使介质或数据库被拖走，攻击者也无法直接读取明文。这三者分别对应数据内容、访问主体、存储载体三个维度的防护，是落地可行的手段。D与数据泄露防护毫无关系，属于明显的干扰项。","correctReason":"A、B、C分别从降低数据敏感度、限制访问主体、保护存储介质三个层面构成防护链条，是公认有效且可实施的防泄露措施。","wrongReason":"D：显示器亮度属于显示设备物理参数，与数据是否被非法获取或泄露无任何因果关系（若指防肩窥也应表述为防窥屏），不能作为防泄露方法。","source":"《中华人民共和国数据安全法》关于数据处理者安全保护义务的规定；GB/T 35273-2020 个人信息安全规范","keyPoint":"防泄露三件套：脱敏、权限控制、加密存储"},{"id":"第二部分专业题-二、密码前沿技术-多选题-42","no":42,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"依据《网络安全标准实践指南——OpenClaw 类智能体部署使用安全指引》， 个人使用者在配置OpenClaw 类智能体时，以下哪些安全措施是建议采取的？ （ ）","options":[{"key":"A","text":"配置非公网暴露的端口，防止未授权调用"},{"key":"B","text":"从官方仓库或可信来源获取Skills"},{"key":"C","text":"建立白名单机制，仅允许白名单中的Skills、插件、MCP 等被调用"},{"key":"D","text":"为高风险操作增加人工确认机制"}],"answer":"ABCD","analysis":"本题考查《网络安全标准实践指南——OpenClaw类智能体部署使用安全指引》中对个人使用者的建议。核心思路是收敛暴露面、管住供应链、限制可调用能力、给高风险动作加人工闸门：把服务端口配置为非公网暴露可防未授权调用；只从官方仓库或可信来源获取Skills可防投毒与后门；建立白名单仅允许受信的Skills、插件、MCP被调用，能阻断越权工具链；对涉及资金、删除、外发等高风险操作增加人工确认，保证人类最终控制权。四项均属该指引建议。","correctReason":"A、B、C、D分别对应网络暴露面收敛、供应链来源可信、能力调用白名单、高风险操作人工确认，都是该类智能体部署的推荐安全措施。","wrongReason":"无错误选项：A：配置非公网暴露的端口，可防止未授权调用，属暴露面收敛建议；B：从官方仓库或可信来源获取Skills，可防供应链投毒与后门，属来源可信建议；C：建立白名单机制，仅允许白名单中的Skills、插件、MCP被调用，属能力调用管控建议；D：为高风险操作增加人工确认机制，保证人类最终控制权，属人工闸门建议。四项均属该指引建议，易错点是漏选D，误以为人工确认只是服务提供方的责任。","source":"《网络安全标准实践指南——OpenClaw类智能体部署使用安全指引》（全国网络安全标准化技术委员会）","keyPoint":"智能体安全四招：不暴露端口、官方源、白名单、人工确认"},{"id":"第二部分专业题-二、密码前沿技术-多选题-43","no":43,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"为了促进生成式人工智能健康发展和规范应用，我国制定了《生成式人工智 能服务管理暂行办法》。根据办法内容，以下说法正确的是（ ）。","options":[{"key":"A","text":"办法自2023 年8 月15 日起施行"},{"key":"B","text":"规定生成式人工智能服务提供者应当依法承担网络信息内容生产者责任，履行 网络信息安全义务"},{"key":"C","text":"生成式人工智能服务提供者应当按照《互联网信息服务深度合成管理规定》对 图片、视频等生成内容进行标识"},{"key":"D","text":"生成式人工智能服务使用者，是指使用生成式人工智能服务生成内容的个人"}],"answer":"ABC","analysis":"本题考查《生成式人工智能服务管理暂行办法》的基本内容。该办法于2023年7月公布、自2023年8月15日起施行，A正确；办法要求提供者依法承担网络信息内容生产者责任，履行网络信息安全义务，B正确；并要求提供者按照《互联网信息服务深度合成管理规定》对图片、视频等生成内容进行标识，C正确。使用者范围则包括组织和个人。","correctReason":"A、B、C分别对应办法的施行日期、提供者责任定位和生成内容标识义务，均与办法原文一致。","wrongReason":"D：办法所称生成式人工智能服务使用者，是指使用生成式人工智能服务生成内容的组织和个人，并不仅限于个人，主体范围被不当缩小。","source":"《生成式人工智能服务管理暂行办法》","keyPoint":"2023-08-15施行；提供者担内容生产者责任；生成内容要标识"},{"id":"第二部分专业题-二、密码前沿技术-多选题-44","no":44,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"国家坚持发展和安全并重、促进创新和依法治理相结合的原则，采取有效措 施鼓励生成式人工智能创新发展，依据《生成式人工智能服务管理暂行办法》， 对生成式人工智能服务实行（ ）。","options":[{"key":"A","text":"开放管理"},{"key":"B","text":"包容审慎"},{"key":"C","text":"分类分级监管"},{"key":"D","text":"分地域限制"}],"answer":"BC","analysis":"本题考《生成式人工智能服务管理暂行办法》确立的监管原则。该办法明确国家坚持发展和安全并重、促进创新和依法治理相结合，对生成式人工智能服务实行包容审慎和分类分级监管：包容审慎体现对新业态留出试错与创新空间，分类分级则按服务类型、用户规模、影响范围等实施差异化监管，二者是并列出现的固定表述。A、D均非办法用语。","correctReason":"办法原文明确对生成式人工智能服务实行包容审慎、分类分级监管，故B、C为正确答案。","wrongReason":"A：办法并未规定“开放管理”，与发展和安全并重、依法治理相结合的原则不符；D：“分地域限制”不是办法确立的监管方式，生成式人工智能服务管理不存在按地域限制的制度安排。","source":"《生成式人工智能服务管理暂行办法》关于包容审慎、分类分级监管的规定","keyPoint":"生成式AI监管八字原则：包容审慎、分类分级"},{"id":"第二部分专业题-二、密码前沿技术-多选题-45","no":45,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"人工智能技术在网络安全领域的应用非常广泛，能够显著提高网络安全防护 的效率和效果。以下关于人工智能在网络安全中的应用描述，正确的是（ ）。","options":[{"key":"A","text":"利用深度学习技术分析电子邮件以防止垃圾邮件和网络钓鱼"},{"key":"B","text":"采用自然语言处理技术来自动阅读和理解安全报告"},{"key":"C","text":"利用人工智能技术进行用户和实体行为分析，以识别可疑活动"},{"key":"D","text":"人工智能技术可用来增加网络带宽，提高数据传输速率"}],"answer":"ABC","analysis":"本题考查AI在网络安全中的落地场景。用深度学习对邮件做特征与语义分析，是反垃圾邮件与反钓鱼的成熟应用；用自然语言处理自动阅读安全报告、告警与情报，可显著降低安全运营的信息处理负担；用户与实体行为分析（UEBA）通过建模识别偏离基线的可疑操作，是内网威胁检测的常用手段。这三项都改变了安全工作的效率与检出能力。D把AI当成了通信资源扩容工具。","correctReason":"A、B、C分别对应检测类（邮件反钓鱼）、分析类（安全报告理解）与行为分析类（UEBA）的典型AI安全应用，均为真实可落地的场景。","wrongReason":"D：网络带宽由物理链路、传输介质与网络设备能力决定，AI只能做流量调度与优化，无法增加带宽或提高物理传输速率。","source":"人工智能在网络安全中的应用通用知识；GB/T 42453-2023 信息安全技术 网络安全态势感知通用技术要求","keyPoint":"AI管“识别与分析”，不管“加带宽”"},{"id":"第二部分专业题-二、密码前沿技术-多选题-46","no":46,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"“AI+安全”范式是指在信息安全领域中应用人工智能技术来增强系统的安 全性、检测和预防各种安全威胁。随着其广泛实践应用，网络安全产业将迎来较 大变化。以下“AI+安全”范式的应用场景中，描述正确的是（ ）。","options":[{"key":"A","text":"AI 可以用来识别和过滤钓鱼邮件和其他形式的社会工程攻击"},{"key":"B","text":"使用AI 算法对发现的所有漏洞进行快速修复"},{"key":"C","text":"通过AI 监控整个组织的安全状态，实时更新安全策略"},{"key":"D","text":"结合AI 技术的防火墙可以根据流量模式动态调整规则"}],"answer":"ACD","analysis":"本题考“AI+安全”范式的合理边界。AI在邮件与社工攻击识别上有成熟实践；可通过持续监控资产、日志与流量，感知整体安全态势并动态调整策略；结合AI的防火墙能依据流量模式自适应地调整规则，提升响应速度。但AI只是辅助决策工具，漏洞修复涉及补丁验证、业务兼容与变更审批，不可能对“所有漏洞”自动快速修复。","correctReason":"A、C、D描述的都是AI能增强安全能力且已有实践的场景：攻击识别、态势监控与策略动态调整、防火墙规则自适应。","wrongReason":"B：漏洞修复受补丁可用性、业务连续性、变更管理与回归验证约束，AI无法代替人工决策，更做不到对“所有漏洞”快速自动修复，属于夸大表述。","source":"人工智能安全应用通用知识；GB/T 42453-2023、GB/T 20984-2022 风险评估相关要求","keyPoint":"AI能做识别、监控、自适应；不能包办漏洞修复"},{"id":"第二部分专业题-二、密码前沿技术-多选题-47","no":47,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"某金融公司部署了基于深度学习的欺诈交易检测系统，但近期发现有攻击者 利用生成对抗样本的方法成功绕过了该系统的检测机制。以下哪些技术或措施能 有效提升模型对抗此类攻击的鲁棒性？（ ）","options":[{"key":"A","text":"在训练集中注入少量对抗样本进行对抗训练"},{"key":"B","text":"使用梯度掩码隐藏模型敏感参数"},{"key":"C","text":"部署输入数据归一化与异常值过滤机制"},{"key":"D","text":"在服务器端部署传统防火墙阻断异常IP 请求"}],"answer":"AC","analysis":"本题考查对抗样本防御的正确手段。对抗训练把对抗样本注入训练集，让模型在决策边界附近学到更稳健的特征，是公认最有效的防御之一；对输入做归一化与异常值过滤，可在数据进入模型前剔除明显偏离分布的扰动样本，从源头削弱扰动效果。而梯度掩码只是让攻击者难以直接取到梯度，属于“混淆式”防御，会被迁移攻击与梯度近似绕过；传统防火墙基于IP与端口，管不到模型输入层。","correctReason":"A、C在模型训练阶段与输入预处理阶段分别提升了模型对扰动的鲁棒性，是有理论依据且经验有效的措施。","wrongReason":"B：梯度掩码不改变模型本身的脆弱性，攻击者可通过替代模型迁移、有限差分近似等手段恢复梯度，属于已被证明不可靠的防御；D：传统防火墙在服务器端按IP/端口阻断，而对抗样本通常来自正常IP，无法识别样本层面的微小扰动，对提升模型鲁棒性无实质作用。","source":"机器学习对抗攻击与防御通用知识；GB/T 42453-2023、人工智能安全治理相关标准","keyPoint":"对抗训练+输入净化才有效；梯度掩码是伪防御"},{"id":"第二部分专业题-二、密码前沿技术-多选题-48","no":48,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"《智能体规范应用与创新发展实施意见》围绕智能体创新发展部署了多项重 点工作，以体系化推动智能体技术突破和生态建设。以下属于《实施意见》提出 的夯实发展基础具体举措的有（ ）。","options":[{"key":"A","text":"强化基础技术研发，加强智能体任务理解、任务规划、工具使用等技术攻关"},{"key":"B","text":"建立智能体标准体系，加快制定智能体与软件工具、应用服务等接口标准"},{"key":"C","text":"布局发展智能互联网，探索建立智能体注册平台，提供数字身份管理服务"},{"key":"D","text":"明确仅限用户本人决策、需授权决策和自主决策的合理边界，确保用户最终 决策权"}],"answer":"ABC","analysis":"本题考《智能体规范应用与创新发展实施意见》中“夯实发展基础”这一板块的具体举措。该板块聚焦技术、标准与基础设施：强化基础技术研发，攻关任务理解、任务规划、工具使用等关键能力；建立智能体标准体系，优先制定智能体与软件工具、应用服务的接口标准；布局发展智能互联网，探索智能体注册平台与数字身份管理服务。而明确决策边界属于安全保障类要求，不属于“夯实发展基础”。","correctReason":"A、B、C分别对应技术攻关、标准体系建设、基础设施布局，正属于《实施意见》“夯实发展基础”提出的具体举措。","wrongReason":"D：明确仅限用户本人决策、需授权决策与自主决策的合理边界、确保用户最终决策权，属于安全保障与治理规范类举措，归入“夯实发展基础”不正确。","source":"《智能体规范应用与创新发展实施意见》关于夯实发展基础、强化应用牵引及安全保障的部署","keyPoint":"夯实基础=技术攻关+标准体系+智能互联网；决策边界属安全"},{"id":"第二部分专业题-二、密码前沿技术-多选题-49","no":49,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"《智能体规范应用与创新发展实施意见》提出了“强化应用牵引”的举措， 旨在通过典型场景应用牵引技术迭代。下列选项中，属于《实施意见》明确的智 能体典型应用方向包括（ ）。","options":[{"key":"A","text":"智能制造：研发生产管理智能体，优化生产排程和资源分配"},{"key":"B","text":"医疗健康：探索药品管理、手术排程、病历管理等智能体，提升医疗服务效 率"},{"key":"C","text":"金融服务：研发金融风控智能体，提升信贷审批、交易监控等环节风险识别 能力"},{"key":"D","text":"教育教学：依托智能体开展个性化学习方案制定，完善智能导学与答疑辅导 功能"}],"answer":"ABCD","analysis":"本题考《智能体规范应用与创新发展实施意见》“强化应用牵引”明确的典型应用方向。该部分以场景牵引技术迭代，覆盖智能制造（生产管理智能体，优化排程与资源分配）、医疗健康（药品管理、手术排程、病历管理等智能体）、金融服务（金融风控智能体，提升信贷审批与交易监控的风险识别能力）、教育教学（个性化学习方案、智能导学与答疑辅导）。四个方向均属文件列举场景。","correctReason":"A、B、C、D分别对应智能制造、医疗健康、金融服务、教育教学四个领域，都是《实施意见》以应用牵引方式明确的智能体典型应用方向。","wrongReason":"无错误选项：A：智能制造方向，研发生产管理智能体以优化生产排程和资源分配；B：医疗健康方向，探索药品管理、手术排程、病历管理等智能体；C：金融服务方向，研发金融风控智能体以提升信贷审批、交易监控等环节风险识别能力；D：教育教学方向，依托智能体制定个性化学习方案、完善智能导学与答疑辅导。四项均属《实施意见》强化应用牵引明确的典型应用方向，易错点是只记住制造、金融两类场景而漏选B、D。","source":"《智能体规范应用与创新发展实施意见》强化应用牵引部分关于典型应用场景的部署","keyPoint":"应用牵引四场景：制造、医疗、金融、教育"},{"id":"第二部分专业题-二、密码前沿技术-多选题-50","no":50,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"根据《人工智能应用伦理安全指引1.0》，关于人工智能应用伦理安全原则， 以下表述正确的有（ ）","options":[{"key":"A","text":"增进人类福祉原则要求人工智能应用应以促进社会公平正义和可持续发展为 宗旨。"},{"key":"B","text":"确保可控可信原则要求确保人工智能的运行始终处于人类控制之下，防范其 脱离人类监督。"},{"key":"C","text":"保护隐私安全原则仅要求在人工智能数据采集阶段做好隐私保护，不涉及数 据使用和存储环节。"},{"key":"D","text":"坚持公平公正原则要求人工智能应用应避免对特定群体产生歧视性影响，保 障机会均等。"}],"answer":"ABD","analysis":"本题考《人工智能应用伦理安全指引1.0》中的伦理安全原则内涵。增进人类福祉原则要求AI应用以促进社会公平正义和可持续发展为宗旨；确保可控可信原则要求AI运行始终处于人类控制之下，防止脱离人类监督；坚持公平公正原则要求避免对特定群体产生歧视性影响、保障机会均等。而隐私保护必须贯穿数据采集、使用、存储、传输、销毁全生命周期，不可能只覆盖采集环节。","correctReason":"A、B、D分别准确表述了增进人类福祉、确保可控可信、坚持公平公正三项原则的核心要求，与指引的精神一致。","wrongReason":"C：隐私保护原则绝不限于采集阶段，数据使用、存储、传输、共享、销毁等环节同样需要采取去标识化、加密、访问控制等措施，“仅要求采集阶段”属于典型的以偏概全。","source":"《人工智能应用伦理安全指引1.0》关于增进人类福祉、确保可控可信、保护隐私安全、坚持公平公正等原则","keyPoint":"隐私保护是数据全生命周期要求，不能只盯采集"},{"id":"第二部分专业题-二、密码前沿技术-多选题-51","no":51,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"某金融科技公司近期上线了客户信用评分系统，系统需实时调取央行征信、 社保、电商消费等多源数据。数据安全官在制定数据分级策略时，应遵循哪些基 本原则（ ）","options":[{"key":"A","text":"按数据破坏后的影响对象（个人、企业、公共利益）划分等级"},{"key":"B","text":"仅依据数据量大小确定安全级别，数据量越大级别越高"},{"key":"C","text":"结合数据生命周期各阶段（采集、存储、使用、销毁）动态调整级别"},{"key":"D","text":"分级结果应报监管部门审批后方可生效"}],"answer":"AC","analysis":"本题考数据分级的基本原则。数据分类分级通常以数据遭到篡改、破坏、泄露或非法获取后对影响对象（个人、组织/企业、社会公共利益、国家安全）和影响程度为依据确定级别，因此按影响对象划分等级正确；同时数据敏感度会随生命周期阶段变化，如汇聚后敏感度上升、脱敏后可降级，故需按采集、存储、使用、销毁等阶段动态调整。数据量大小不是分级依据，分级结果也属企业自主安全管理事项，无需监管审批。","correctReason":"A、C分别对应数据分级的两条核心原则：以受影响对象和影响程度定级、随数据生命周期动态调整级别。","wrongReason":"B：分级依据是数据重要程度与泄露后的影响，而非数据量大小，量大不代表级别高；D：数据分类分级是数据处理者的法定自主义务，分级结果按要求备案或报告即可，并非须经监管部门审批后才生效。","source":"《中华人民共和国数据安全法》关于数据分类分级保护制度的规定；GB/T 43697-2024 数据安全技术 数据分类分级规则","keyPoint":"分级看影响对象与程度，且随生命周期动态调整"},{"id":"第二部分专业题-二、密码前沿技术-多选题-52","no":52,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"某跨国零售企业在中国境内运营，其数据中心位于新加坡，但涉及中国公民 的会员消费记录、人脸支付特征。该企业数据保护官在判断法律适用时，哪些说 法正确？","options":[{"key":"A","text":"因数据中心在境外，可不适用中国《中华人民共和国数据安全法》"},{"key":"B","text":"处理中国境内自然人个人信息，适用《中华人民共和国个人信息保护法》"},{"key":"C","text":"重要数据出境需通过国家网信部门组织的安全评估"},{"key":"D","text":"人脸特征属于敏感个人信息，出境需单独取得个人单独同意"}],"answer":"BCD","analysis":"本题考跨境场景下的法律适用与出境合规。A的逻辑是“服务器在境外就不受中国法管辖”，这是错误的：中国数据安全法对境内开展的数据处理活动具有管辖效力，并设有域外适用条款，关键看处理行为与主体是否与境内相关。处理中国境内自然人个人信息，当然适用个人信息保护法，B正确；重要数据出境须经国家网信部门组织的安全评估，C正确；人脸支付特征属生物识别信息，是敏感个人信息，出境处理须取得单独同意，D正确。","correctReason":"B、C、D分别对应个人信息保护法的适用与域外效力、重要数据出境安全评估制度、敏感个人信息出境须单独同意三项真实制度内容。","wrongReason":"A：数据安全法对在中华人民共和国境内开展数据处理活动及其安全监管适用，并规定了针对境外主体的域外适用情形，数据中心位于境外并不当然排除中国法适用。","source":"《中华人民共和国数据安全法》关于域外适用与数据出境安全管理的规定；《中华人民共和国个人信息保护法》关于域外适用、敏感个人信息及单独同意的规定","keyPoint":"境内外服务器不决定管辖；人脸属敏感信息，出境需单独同意"},{"id":"第二部分专业题-二、密码前沿技术-多选题-53","no":53,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"某数据中台项目采用差分隐私技术对用户行为数据进行加噪发布，以支持宏 观统计。关于差分隐私的应用，以下理解正确的是（ ）。","options":[{"key":"A","text":"加噪后数据无法反推个体，因此可任意公开无需脱敏"},{"key":"B","text":"差分隐私通过添加拉普拉斯或高斯噪声实现隐私保护"},{"key":"C","text":"隐私预算ε越小，保护强度越高但数据可用性越低"},{"key":"D","text":"差分隐私能完全抵御差分攻击，达到绝对安全"}],"answer":"BC","analysis":"本题考差分隐私的机理与边界。差分隐私通过向查询结果或统计量加入拉普拉斯噪声（数值型）或高斯噪声（配合相应机制）来掩盖单个记录的影响；隐私预算ε衡量隐私损失，ε越小噪声越大、保护越强，但统计结果的可用性随之下降，这是其核心权衡。需要注意的是，加噪只提供可证明的隐私保证，并不等于数据绝对安全，也不能解除其他合规义务。","correctReason":"B、C分别准确指出了差分隐私的噪声实现方式和ε与隐私强度/数据可用性的反向权衡关系。","wrongReason":"A：加噪后仍可能存在残余风险（如小样本、多次查询组合推断），且数据仍属个人信息，公开前仍须脱敏与合法性评估，不能“任意公开无需脱敏”；D：差分隐私是可证明的概率性保护，不能抵御所有攻击，例如隐私预算耗尽后的组合攻击与辅助信息攻击，达不到“绝对安全”。","source":"差分隐私技术原理通用知识；GB/T 37964-2019 信息安全技术 个人信息去标识化指南","keyPoint":"差分隐私=加噪+隐私预算ε；ε越小越安全越不好用，非绝对安全"},{"id":"第二部分专业题-二、密码前沿技术-多选题-54","no":54,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"某政府大数据平台遭受勒索软件攻击，攻击者加密了备份数据并索要赎金。 事后复盘发现备份策略存在缺陷。关于数据备份与恢复的合规技术措施，正确的 是（ ）。","options":[{"key":"A","text":"备份数据应与生产数据存储在同一阵列，以提高恢复速度"},{"key":"B","text":"应定期进行备份数据恢复演练，验证可用性"},{"key":"C","text":"采用“3-2-1”备份原则（3 份副本、2 种介质、1 份异地）"},{"key":"D","text":"备份数据可长期保留在同一物理位置，便于管理"}],"answer":"BC","analysis":"本题考备份与恢复的合规技术措施。勒索软件的首要目标就是加密备份，因此备份必须具备独立性与隔离性：定期做恢复演练，才能验证备份真的可恢复、可用，避免“有备份但恢复不了”；3-2-1原则要求至少3份副本、2种不同介质、1份异地存放，能抵御介质损坏、单点灾害与勒索加密。反过来，与生产数据同阵列、长期同地存放，恰恰是这次事故暴露出的缺陷。","correctReason":"B、C分别对应备份可用性验证与备份架构的隔离容灾要求，是防范勒索软件加密备份的关键措施。","wrongReason":"A：备份与生产数据放在同一阵列，勒索软件加密生产数据时会同时波及备份，失去备份的意义，正确做法是异地或离线隔离存储；D：备份长期保留在同一物理位置，无法抵御火灾、水灾、盗窃及勒索加密等本地风险，不满足异地容灾要求。","source":"《中华人民共和国数据安全法》关于数据安全保护义务与备份、恢复要求的规定；GB/T 20984-2022 信息安全风险评估方法","keyPoint":"备份要能恢复、要隔离：3-2-1原则+定期恢复演练"},{"id":"第二部分专业题-二、密码前沿技术-多选题-55","no":55,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"某云服务商向客户提供数据库加密功能，客户可选择应用层加密或透明数据 加密（TDE）。关于两种方式的比较，正确的是（ ）","options":[{"key":"A","text":"TDE 对应用透明，无需修改代码，适用于业务改造受限场景"},{"key":"B","text":"应用层加密可对字段级细粒度控制，但密钥管理复杂度高"},{"key":"C","text":"TDE 加密后的备份文件和日志文件也自动被加密"},{"key":"D","text":"应用层加密无法防御具备数据库管理员权限的内部攻击"}],"answer":"ABC","analysis":"本题考应用层加密与TDE的适用差异。TDE在数据库引擎层完成加解密，对上层应用透明、无需改代码，适合改造受限的存量系统；应用层加密由业务系统自行加解密，可做到字段级细粒度控制，但密钥分发、轮换与托管全由应用侧负责，复杂度显著上升；主流TDE在加密数据文件的同时也会对备份文件和事务日志加密，防止通过备份旁路读取数据。而应用层加密的密钥不在DBA手里，恰恰能有效防御DBA越权访问。","correctReason":"A、B、C分别准确描述了TDE对应用透明、应用层加密细粒度但密钥管理复杂、TDE覆盖备份与日志这三项事实。","wrongReason":"D：应用层加密由应用侧掌握密钥，数据库管理员只能接触到密文，无法解密字段内容，恰恰是抵御拥有DBA权限的内部人员越权读取的有效手段，该项表述与事实相反。","source":"数据库加密技术通用知识；GB/T 39786-2021 信息安全技术 信息系统密码应用基本要求","keyPoint":"TDE透明但粗；应用层细粒度但要自己管密钥，还能防DBA"},{"id":"第二部分专业题-二、密码前沿技术-多选题-56","no":56,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"某企业实行数据安全岗位责任制，任命了数据安全负责人、数据保护官 （DPO）及各部门数据安全专员。关于岗位职责划分，正确的是（ ）","options":[{"key":"A","text":"DPO 应独立于业务部门，直接向最高管理层汇报"},{"key":"B","text":"数据安全负责人负责制定整体策略，DPO 负责监督合规"},{"key":"C","text":"数据安全专员由业务部门兼任，无需接受专业培训"},{"key":"D","text":"发生数据泄露时，DPO 需在法定时限内向监管机构报告"}],"answer":"ABD","analysis":"本题考数据安全治理岗位的职责划分。数据保护官（DPO）承担独立监督职能，应独立于业务部门并直接向最高管理层汇报，以避免利益冲突；数据安全负责人偏重统筹，负责制定整体策略与制度，DPO偏重监督合规落地，两者职责互补；发生个人信息泄露等安全事件时，DPO需推动按法定时限向监管机构报告。而数据安全专员即使由业务部门人员兼任，也必须经过专业培训并具备相应能力。","correctReason":"A、B、D分别对应DPO的独立性、负责人与DPO的职责分工、安全事件报告职责，符合数据安全治理的通行岗位设计。","wrongReason":"C：数据安全专员可由业务部门人员兼任，但兼任不等于免除要求，其必须接受数据安全与个人信息保护专业培训、明确职责并纳入考核，“无需接受专业培训”表述错误。","source":"《中华人民共和国个人信息保护法》关于个人信息保护负责人及安全事件通知的规定；《中华人民共和国数据安全法》关于数据安全负责人和管理机构的规定","keyPoint":"DPO要独立汇报；专员可兼任但必须培训"},{"id":"第二部分专业题-二、密码前沿技术-多选题-57","no":57,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"某AI 训练平台使用Web 爬虫抓取公开网页上的用户评论数据，用于情感分 析模型。关于爬取公开数据的合规边界，以下说法正确的有（ ）","options":[{"key":"A","text":"公开数据可随意爬取，不受《中华人民共和国个人信息保护法》约束"},{"key":"B","text":"即使数据公开，若包含个人信息，仍需评估处理合法性基础"},{"key":"C","text":"应遵守网站的robots.txt 协议，避免过度请求"},{"key":"D","text":"爬取的数据可用于任何商业目的，不受限制"}],"answer":"BC","analysis":"本题考爬取公开数据的合规边界。用户评论中往往含昵称、头像、位置、联系方式等个人信息，“公开”只意味着获取难度低，不等于可以任意处理，仍须评估告知同意、合理目的、最小必要等合法性基础，B正确；抓取行为应遵守robots.txt等网站声明，控制频率与并发，避免影响网站正常运行，C正确。把公开数据视为法外之地或可无限商用，都是对个人信息保护制度的误解。","correctReason":"B、C分别指出公开数据中含个人信息时仍须评估处理合法性基础，以及爬取应遵守robots.txt、避免过度请求的行为边界。","wrongReason":"A：公开个人信息仍受《中华人民共和国个人信息保护法》约束，在合理范围内处理已公开个人信息虽有豁免情形，但超出合理范围或违反个人明确拒绝的仍属违法；D：爬取数据的使用须受处理目的、授权范围与合同约束，用于原目的之外的商业用途需另行取得合法性基础，还可能侵犯著作权与商业秘密。","source":"《中华人民共和国个人信息保护法》关于处理已公开个人信息、告知同意与最小必要原则的规定；《中华人民共和国数据安全法》相关规定","keyPoint":"公开≠可任意用；看合法性基础，守robots.txt"},{"id":"第二部分专业题-二、密码前沿技术-多选题-58","no":58,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"某公司采购了一套数据防泄漏（DLP）系统，部署在网络出口和终端。关于 DLP 系统有效配置的策略，正确的有（ ）。","options":[{"key":"A","text":"基于正则表达式匹配身份证、银行卡等模式，阻断外发"},{"key":"B","text":"对加密压缩包无法检测，因此不需要监控压缩文件"},{"key":"C","text":"应结合内容指纹和上下文（如文件密级）综合判断"},{"key":"D","text":"可对内部邮件、即时消息、云盘上传等通道进行监控"}],"answer":"ACD","analysis":"本题考DLP系统的有效配置思路。用正则表达式识别身份证号、银行卡号等结构化敏感数据并阻断外发，是DLP最基础也最常用的检测手段；单靠关键字容易漏报误报，应结合文档指纹（精确匹配）、机器学习与文件密级、接收方、通道等上下文综合判定；DLP需覆盖邮件、即时消息、U盘、云盘上传等主要外发通道才能形成闭环。而加密压缩包恰恰是绕行DLP的常见手法。","correctReason":"A、C、D分别对应结构化数据模式匹配、内容指纹与上下文联合判定、多外发通道全覆盖，是DLP有效配置的核心策略。","wrongReason":"B：加密压缩包正是数据外泄的常见规避通道，DLP可通过禁止加密文件外发、要求解密检查、引用内容指纹与沙箱还原等手段管控，“不需要监控压缩文件”的做法会留下明显缺口。","source":"《中华人民共和国数据安全法》关于数据安全技术措施的要求；GB/T 35273-2020 个人信息安全规范","keyPoint":"DLP要模式+指纹+上下文并用，且覆盖压缩包等绕行通道"},{"id":"第二部分专业题-二、密码前沿技术-多选题-59","no":59,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"某金融机构计划将客户风险评级模型外包给第三方科技公司开发，模型需使 用脱敏后的客户交易数据。关于第三方数据委托处理的安全要求，正确的是 （ ）。","options":[{"key":"A","text":"双方应签订数据处理协议，明确处理目的、期限、方式"},{"key":"B","text":"委托方对受托方的数据处理活动负有监督责任"},{"key":"C","text":"受托方可直接将数据转委托给其子公司，无需告知委托方"},{"key":"D","text":"模型开发完成后，受托方应按照约定删除或返还所有数据"}],"answer":"ABD","analysis":"本题考个人信息委托处理（受托处理）的合规要求。委托方与受托方应约定处理目的、期限、处理方式、保护措施及双方权利义务，并对受托方的处理活动进行监督；受托方应按约定处理，不得超出约定目的和方式，且委托关系解除后应删除或返还数据。转委托是高风险动作，必须事先取得委托方同意。脱敏数据虽降低了敏感度，但并不免除委托处理的合规义务。","correctReason":"A、B、D分别对应委托处理协议必备内容、委托方的监督责任、受托方在委托结束后的删除或返还义务，均为个人信息委托处理的法定要求。","wrongReason":"C：受托方如需转委托他人处理，应当事先取得委托方同意，未经告知直接转委托给子公司违反个人信息保护法关于委托处理与转委托的规定，且会切断委托方的监督链条。","source":"《中华人民共和国个人信息保护法》关于委托处理、受托方义务及转委托需取得同意的规定","keyPoint":"委托处理：签协议、受监督、结束后删除；转委托须先同意"},{"id":"第二部分专业题-二、密码前沿技术-多选题-60","no":60,"kind":"multi","part":"第二部分专业题","cat":"二、密码前沿技术","type":"多选题","stem":"某电商平台发生内部员工越权导出大量用户订单信息，并售卖至黑市。事后 审计发现权限管理存在漏洞。关于权限管理与访问控制，正确的有（ ）","options":[{"key":"A","text":"应采用最小权限原则，仅授予岗位必需的最小数据访问范围"},{"key":"B","text":"应定期复审员工权限，离职人员需及时回收"},{"key":"C","text":"高敏感数据操作应启用双人授权或二次审批流程"},{"key":"D","text":"所有员工默认拥有查看全部数据的权限，再根据违规行为单独回收"}],"answer":"ABC","analysis":"本题考权限管理与访问控制原则。最小权限要求只授予岗位必需的最小数据范围，是防内部越权的第一道闸门；权限具有时效性，须定期复审并即时回收离职、转岗人员权限，防止“僵尸账号”被滥用；对批量导出、敏感数据访问等高风险操作，应设置双人授权或二次审批，形成制衡。而“默认全量授权、出事后回收”恰好是本案例中越权导出的根因。","correctReason":"A、B、C分别对应最小权限原则、权限定期复审与及时回收、高风险操作双人授权/二次审批，都是防内部人员越权导出的有效控制措施。","wrongReason":"D：默认授予全体员工查看全部数据的权限，违背最小权限与职责分离原则，一旦发生滥用已造成既成泄露，事后回收无法挽回，是本案事故的直接诱因。","source":"《中华人民共和国数据安全法》《中华人民共和国个人信息保护法》关于访问控制与最小必要、安全技术措施的要求；GB/T 35273-2020","keyPoint":"最小权限+定期复审+高风险双人授权，杜绝默认全量授权"},{"id":"第二部分专业题-二、密码前沿技术-判断题-1","no":1,"kind":"judge","part":"第二部分专业题","cat":"二、密码前沿技术","type":"判断题","stem":"区块链的不可篡改性意味着一旦交易上链，就绝对不可能被撤销或修改。","options":[],"answer":"错","analysis":"区块链的不可篡改性来自哈希链式结构、共识机制与最长链规则，它保证的是已确认数据被悄悄改写的成本极高，而不等于“写上去就动不了”。实际中可通过51%算力攻击、分叉回滚、交易所或项目方回滚、智能合约升级与治理投票等方式使交易失效。可撤销、可更正被普遍视为联盟链与许可链的合规能力。因此该表述把“极难篡改”绝对化为“绝对不可能”，判断为错。","correctReason":"不可篡改性只表示改写代价极高、需全网共识，并非技术上绝对不可撤销，分叉回滚与治理干预都能推翻已上链交易。","wrongReason":"","source":"区块链共识与分叉机制原理（无对应法条）","keyPoint":"不可篡改＝改写成本极高，不等于绝对不可撤销"},{"id":"第二部分专业题-二、密码前沿技术-判断题-2","no":2,"kind":"judge","part":"第二部分专业题","cat":"二、密码前沿技术","type":"判断题","stem":"在区块链网络中，使用TLS/HTTPS 加密节点之间的通信可以完全防止中间 人攻击和Sybil 攻击。","options":[],"answer":"错","analysis":"TLS/HTTPS 只为通信提供机密性与完整性，并借助证书完成服务端（必要时双向）身份认证，能防住窃听和路上篡改。但中间人攻击的根源是身份认证失效，证书被伪造、私钥泄露或客户端不校验证书时照样可被利用。Sybil 攻击是攻击者批量伪造身份节点、占据网络多数，属于身份与共识层问题，传输加密对它毫无作用。故该表述为错。","correctReason":"传输层加密只能防窃听与传输篡改，既不能根除依赖身份认证的中间人风险，也不解决伪造大量节点身份的 Sybil 攻击。","wrongReason":"","source":"TLS 协议与区块链 P2P 网络安全原理（无对应法条）","keyPoint":"TLS 管传输安全，管不了身份伪造与女巫攻击"},{"id":"第二部分专业题-二、密码前沿技术-判断题-3","no":3,"kind":"judge","part":"第二部分专业题","cat":"二、密码前沿技术","type":"判断题","stem":"书面形式的涉密载体，应在封面或者首页做出国家秘密标志，汇编涉密文件、 资料或摘录、引用属于国家秘密内容的应按照其中最低密级和最长保密期限标 注。","options":[],"answer":"错","analysis":"国家秘密标志要做到密级、保密期限（或解密条件）、知悉范围三要素齐全，这一点没错。但本题错在后半句：汇编涉密文件、资料，或摘录、引用属于国家秘密的内容时，应当按其中最高密级和最长保密期限标注，也就是“就高不就长”，从严管理。题干写成“最低密级和最长保密期限”，属于降格标注，会造成密级失控，故判断为错。","correctReason":"涉密载体汇编、摘录、引用应按其中最高密级和最长保密期限做出国家秘密标志，题干写成“最低密级”不成立。","wrongReason":"","source":"《中华人民共和国保守国家秘密法》及国家秘密标志管理有关规定","keyPoint":"汇编摘录按最高密级、最长保密期限标注"},{"id":"第二部分专业题-二、密码前沿技术-判断题-4","no":4,"kind":"judge","part":"第二部分专业题","cat":"二、密码前沿技术","type":"判断题","stem":"通过伪基站接收附近手机发送的数据，是数据窃密者使用的一种隐蔽的窃密 手段。","options":[],"answer":"对","analysis":"伪基站本质是非法设置的移动通信基站设备，它以更强信号和相同或近似的网络标识诱导周围手机接入，从而截获、转发甚至伪造短信与位置等数据。因此“通过伪基站接收附近手机发送的数据”确属数据窃密手段，且因其伪装成合法网络、用户无感知而相当隐蔽。这类行为也属于干扰公用电信网络、非法获取数据的违法犯罪行为。表述成立。","correctReason":"伪基站通过伪装网络标识诱骗手机注册并传输数据，能够在用户无感知下截获信息，构成隐蔽的数据窃密手段。","wrongReason":"","source":"《中华人民共和国无线电管理条例》对擅自设置使用无线电台（站）的禁止性规定","keyPoint":"伪基站＝假基站诱骗手机接入，隐蔽窃密"},{"id":"第二部分专业题-二、密码前沿技术-判断题-5","no":5,"kind":"judge","part":"第二部分专业题","cat":"二、密码前沿技术","type":"判断题","stem":"信息安全事件分为有害程序事件等7 个基本类，蠕虫事件、僵尸网络事件、 后门攻击事件均属于有害程序事件的子类。","options":[],"answer":"错","analysis":"GB/Z 20986 把信息安全事件按基本分类划分为有害程序事件、网络攻击事件、信息破坏事件、信息内容安全事件、设备设施故障、灾害性事件和其他事件，蠕虫事件、僵尸网络事件、后门攻击事件确实都归入有害程序事件。但题干把基本类数写成“7 个”，只是单纯数量出错，因为该类划分并非 7 个基本类，故整句判断为错。复习时以标准原文的分类数量与名称为准。","correctReason":"蠕虫、僵尸网络、后门攻击属于有害程序事件没错，但信息安全事件的基本分类数量并非题干所称的 7 个，故整句不成立。","wrongReason":"","source":"GB/Z 20986-2007《信息安全技术 信息安全事件分类分级指南》","keyPoint":"事件分类数量与名称以标准原文为准，别记错基本类数"},{"id":"第二部分专业题-二、密码前沿技术-判断题-6","no":6,"kind":"judge","part":"第二部分专业题","cat":"二、密码前沿技术","type":"判断题","stem":"依据《网络安全标准实践指南——OpenClaw 类智能体部署使用安全指引》， 卸载OpenClaw 类智能体后，无需对残留数据、密钥、凭证等进行清理，因为卸 载程序会自动完成所有清理工作。","options":[],"answer":"错","analysis":"卸载智能体程序时，卸载器通常只清理自身安装目录与注册项，而运行期产生的会话缓存、记忆文件、日志、模型与插件配置、访问密钥和托管凭证往往散落在用户目录、环境变量与第三方平台中，不会被自动清除。依照该安全指引，卸载后应主动清理残留数据、密钥与凭证，并对相关平台侧的授权做撤销。因此“无需清理”说法错误。","correctReason":"卸载程序不会代劳清理全部数据，卸载后必须人工排查并清理残留数据、密钥和凭证，故该表述不成立。","wrongReason":"","source":"《网络安全标准实践指南——OpenClaw 类智能体部署使用安全指引》","keyPoint":"卸载≠清理，残留数据与密钥须手动清除并撤销授权"},{"id":"第二部分专业题-二、密码前沿技术-判断题-7","no":7,"kind":"judge","part":"第二部分专业题","cat":"二、密码前沿技术","type":"判断题","stem":"电子取证是证据的获取活动和过程，是信息安全保障反击环节的重要内容， 其中拷贝是电子取证的核心过程。","options":[],"answer":"错","analysis":"电子取证指依法对电子数据进行获取、固定、分析并出具结论的完整活动，属于信息安全保障中事后追责与反击的环节，这半句正确。但核心过程不是“拷贝”：单纯拷贝既不能保证证据未被污染，也无法证明来源同一。真正的核心是通过写阻断、镜像哈希校验、证据链记录等手段完成证据固定与完整性保障，进而开展分析鉴定。故表述错误。","correctReason":"电子取证的核心是证据固定与完整性保障（原始性、同一性），拷贝只是其中一个环节，不能称为核心。","wrongReason":"","source":"电子数据取证基本原则（证据固定与完整性校验）","keyPoint":"取证核心是固定与完整性保障，而非简单拷贝"},{"id":"第二部分专业题-二、密码前沿技术-判断题-8","no":8,"kind":"judge","part":"第二部分专业题","cat":"二、密码前沿技术","type":"判断题","stem":"网络蠕虫是恶意代码的一种类型，具有自我复制和传播能力，四个功能模块 包括探测模块、扫描模块、负载模块、蠕虫引擎模块。","options":[],"answer":"错","analysis":"网络蠕虫确实是具有自我复制与自动传播能力的恶意代码，但题干给出的四个模块不对。通行的功能划分是探测模块、扫描模块、攻击模块（有的教材叫感染模块）和传播模块，其中“负载模块”“蠕虫引擎模块”并非蠕虫的四个功能模块，而是病毒或某些恶意代码里常见的组件叫法。把模块名称张冠李戴，故判断为错。","correctReason":"蠕虫的功能模块通行划分为探测、扫描、攻击、传播等，题干把模块名称写成负载模块、蠕虫引擎模块，故表述不成立。","wrongReason":"","source":"恶意代码（网络蠕虫）功能模块划分的通说","keyPoint":"蠕虫模块＝探测、扫描、攻击、传播"},{"id":"第二部分专业题-二、密码前沿技术-判断题-9","no":9,"kind":"judge","part":"第二部分专业题","cat":"二、密码前沿技术","type":"判断题","stem":"在威胁狩猎中，AI 算法的主要作用是主动分析网络行为，发现隐藏的高级持 续性威胁（APT）。","options":[],"answer":"对","analysis":"威胁狩猎强调的是不等告警、主动出击，通过假设攻击者已潜入来搜寻痕迹。AI 算法可以从海量日志、流量与终端行为数据中持续学习正常基线，自动关联多源事件、发现偏离基线的异常链条，从而把潜伏期长、单点特征弱的 APT 活动挖掘出来。人工分析易被数据量与告警噪声淹没，AI 恰好补上这一环，因此该表述成立。","correctReason":"AI 能对海量多源数据进行基线学习与关联分析，主动发现单点特征弱、潜伏期长的 APT 痕迹，符合威胁狩猎的主动分析定位。","wrongReason":"","source":"威胁狩猎与 AI 安全分析原理（无对应法条）","keyPoint":"威胁狩猎靠主动假设＋AI 异常关联揪出 APT"},{"id":"第二部分专业题-二、密码前沿技术-判断题-10","no":10,"kind":"judge","part":"第二部分专业题","cat":"二、密码前沿技术","type":"判断题","stem":"可信计算是增强信息系统安全的有效手段，它基于一个硬件安全模块，通过 逐级校验建立可信链，进而建立可信计算环境。","options":[],"answer":"对","analysis":"可信计算的思路是以一个物理上难以篡改的硬件安全模块作为信任根，先度量并验证该模块自身，再依次度量固件、引导程序、操作系统直至应用，每一级信任都由上一级校验后传递下去，形成信任链。链条逐级延伸，最终构成可信计算环境，从而把安全能力从软件层下沉到硬件层。这就是可信计算增强信息系统安全的有效路径，表述正确。","correctReason":"可信计算以硬件安全模块为信任根，通过逐级度量校验传递信任、建立信任链，最终形成可信计算环境。","wrongReason":"","source":"可信计算信任根与信任链模型（参见 GB/T 22239-2019 可信验证要求）","keyPoint":"硬件信任根→逐级校验→信任链→可信环境"},{"id":"第二部分专业题-二、密码前沿技术-判断题-11","no":11,"kind":"judge","part":"第二部分专业题","cat":"二、密码前沿技术","type":"判断题","stem":"互联网信息服务，是指通过互联网向上网用户提供信息的服务活动，分为盈 利性、非盈利性两类。","options":[],"answer":"错","analysis":"互联网信息服务指通过互联网向上网用户提供信息的服务活动，这一句定义没错。但按《互联网信息服务管理办法》，其分类是经营性和非经营性两类：经营性指向上网用户有偿提供信息或网页制作等服务，非经营性指无偿提供具有公开性、共享性的信息。题干把“经营性”写成“盈利性”，用词不准确，故判断为错。","correctReason":"法定分类为经营性互联网信息服务和非经营性互联网信息服务，“盈利性”不是规范表述，故该表述不成立。","wrongReason":"","source":"《互联网信息服务管理办法》关于经营性、非经营性互联网信息服务的划分","keyPoint":"互联网信息服务分经营性、非经营性两类"},{"id":"第二部分专业题-二、密码前沿技术-判断题-12","no":12,"kind":"judge","part":"第二部分专业题","cat":"二、密码前沿技术","type":"判断题","stem":"隔离是将两个环境的边界分开的一种手段。目前实施网络隔离的技术路线主 要有三种：网络开关、实时交换和单向连接。","options":[],"answer":"对","analysis":"网络隔离的目标是切断两个环境之间可直接利用的通信路径，只允许可控的数据交换。主流技术路线正是网络开关（开关式交换，分时通断）、实时交换（经协议剥离与内容检查的实时数据交换）和单向连接（单向导入/导出，物理上只允许一个方向传输）。三种路线在方向控制与实时性上各有取舍，但都属于隔离设施的实现方式，因此表述成立。","correctReason":"网络隔离的三种主要技术路线确为网络开关、实时交换和单向连接，分别以分时通断、受控实时交换、单向传输实现边界隔离。","wrongReason":"","source":"网络隔离与安全交换技术路线（无对应法条）","keyPoint":"隔离三路线：网络开关、实时交换、单向连接"},{"id":"第二部分专业题-二、密码前沿技术-判断题-13","no":13,"kind":"judge","part":"第二部分专业题","cat":"二、密码前沿技术","type":"判断题","stem":"依据《网络安全标准实践指南——OpenClaw 类智能体部署使用安全指引》， 卸载OpenClaw 类智能体后，无需对残留数据、密钥、凭证等进行清理，因为卸 载程序会自动完成所有清理工作。","options":[],"answer":"错","analysis":"本题考查智能体卸载环节的数据安全责任。程序卸载一般只删除安装目录和注册项，运行期生成的会话记录、记忆与缓存文件、日志、插件配置以及访问密钥、托管凭证常常残留在用户目录、环境变量或第三方平台授权中。该安全指引要求卸载后对残留数据、密钥、凭证进行清理，并撤销相应授权，所以“卸载程序会自动完成所有清理、无需处理”的说法错误。","correctReason":"卸载程序不会自动清除全部残留，卸载后仍须清理残留数据、密钥和凭证并撤销授权，故该表述不成立。","wrongReason":"","source":"《网络安全标准实践指南——OpenClaw 类智能体部署使用安全指引》","keyPoint":"卸载后必须清理残留数据、密钥、凭证并撤销授权"},{"id":"第二部分专业题-二、密码前沿技术-判断题-14","no":14,"kind":"judge","part":"第二部分专业题","cat":"二、密码前沿技术","type":"判断题","stem":"根据《人工智能应用伦理安全指引1.0》，人工智能应用可能带来“人类主 导权影响”，即人工智能行为超出人类所预设、理解和可控的范围，可能冲击人 类在社会运行和治理过程中的主导地位。","options":[],"answer":"对","analysis":"该指引在分析人工智能应用风险时提出，“人类主导权影响”指人工智能的行为一旦超出人类预设、理解和可控的范围，就可能在运行与治理过程中冲击人类的主导地位。题干对这一风险的界定与该指引的表述一致，属于伦理安全层面的重要风险类型。故该判断成立。","correctReason":"该指引确实把“人类主导权影响”界定为 AI 行为超出人类预设、理解与可控范围，进而冲击人类主导地位的风险。","wrongReason":"","source":"《人工智能应用伦理安全指引 1.0》","keyPoint":"人类主导权影响＝AI 行为超出人类预设与可控范围"},{"id":"第二部分专业题-二、密码前沿技术-判断题-15","no":15,"kind":"judge","part":"第二部分专业题","cat":"二、密码前沿技术","type":"判断题","stem":"根据《智能体规范应用与创新发展实施意见》，对于部分生活娱乐、日常办 公等低风险领域的智能体应用，应采取与敏感领域和重点行业相同的管理措施， 即实行备案、检测、问题产品召回等严格管理方式。","options":[],"answer":"错","analysis":"分类分级、包容审慎是智能体治理的基本思路。对生活娱乐、日常办公等低风险领域，该实施意见要求营造宽松环境、鼓励创新应用，采取与风险相称的轻量管理；备案、检测、问题产品召回这类严格管理措施，是针对敏感领域和重点行业的高风险应用。因此把低风险领域等同敏感领域管理，混淆了分级管理原则，表述错误。","correctReason":"低风险领域应实行分类分级、包容审慎的差异化措施，与敏感领域、重点行业适用的备案、检测、召回等严格管理并不相同。","wrongReason":"","source":"《智能体规范应用与创新发展实施意见》","keyPoint":"智能体分级管理：低风险宽松，敏感领域从严"},{"id":"第二部分专业题-二、密码前沿技术-判断题-16","no":16,"kind":"judge","part":"第二部分专业题","cat":"二、密码前沿技术","type":"判断题","stem":"一个好的扫描器能对它得到的数据进行分析，帮助我们查找目标主机的漏 洞。","options":[],"answer":"对","analysis":"漏洞扫描器的工作流程是先探测存活主机与开放端口、识别服务与版本，再把采集到的响应数据与漏洞特征库、版本比对规则进行匹配分析，从而定位目标主机存在的已知漏洞并给出报告。扫描器的价值恰恰在于“采数据＋做分析”，只扫不析的工具给不出可用结论。因此该表述成立。","correctReason":"扫描器的核心能力就是对采集到的响应与指纹数据做特征匹配和分析，据此发现目标主机的已知漏洞。","wrongReason":"","source":"漏洞扫描与安全评估原理（无对应法条）","keyPoint":"扫描器＝采集数据＋特征匹配分析，找出主机漏洞"},{"id":"第二部分专业题-二、密码前沿技术-判断题-17","no":17,"kind":"judge","part":"第二部分专业题","cat":"二、密码前沿技术","type":"判断题","stem":"网络平台不安全，平台所承载的数据就不安全；网络数据不安全，数据所承 载的信息就不安全。","options":[],"answer":"对","analysis":"这句话描述的是安全性的层层承载关系：数据依托网络平台存储和流转，平台自身存在漏洞、配置错误或权限失控，平台上的数据就随时可能被窃取或篡改；而数据是信息的载体，数据的机密性、完整性被破坏，数据所表达的信息自然失去保障。因此平台安全、数据安全、信息安全构成从下到上的依赖链，表述成立。","correctReason":"平台承载数据、数据承载信息，下层安全被突破则上层安全无从保障，故该层层依赖的表述成立。","wrongReason":"","source":"信息安全层级依赖关系（无对应法条）","keyPoint":"平台→数据→信息，下层失守则上层不保"},{"id":"第二部分专业题-二、密码前沿技术-判断题-18","no":18,"kind":"judge","part":"第二部分专业题","cat":"二、密码前沿技术","type":"判断题","stem":"零信任架构（ZeroTrust）依赖AI 实现动态访问决策，无需预设信任区域。 （ ）","options":[],"answer":"对","analysis":"零信任的核心是“永不信任、始终验证”，取消内网默认可信的假设，不再划分天然可信的信任区域。访问决策由策略引擎结合身份、设备、环境等上下文持续动态评估后授权。题目把这种持续、动态的判定表述为“依赖 AI 实现动态访问决策、无需预设信任区域”，落点在取消预设信任区这一零信任本质特征上，故按命题口径判断为对。","correctReason":"零信任不预设任何默认可信的信任区域，访问授权由策略引擎按上下文持续动态评估给出，题干表述与此相符。","wrongReason":"","source":"零信任架构核心理念（永不信任、始终验证）","keyPoint":"零信任：不预设信任区，动态持续评估授权"},{"id":"第二部分专业题-二、密码前沿技术-判断题-19","no":19,"kind":"judge","part":"第二部分专业题","cat":"二、密码前沿技术","type":"判断题","stem":"AI 在日志分析中仅能处理结构化数据，无法解析非结构化文本。（ ）","options":[],"answer":"错","analysis":"“仅能处理结构化数据”这个限定是错的。日志形态多种多样，除 JSON、数据库记录等结构化日志外，还有大量纯文本、syslog 报文、堆栈信息、告警描述等非结构化内容。借助自然语言处理、正则与模板抽取、日志解析（如日志模板挖掘）等技术，AI 完全可以解析非结构化文本并做聚类、异常检测与根因定位。故该表述不成立。","correctReason":"借助 NLP 与日志模板解析等技术，AI 能够处理非结构化文本日志，题干“仅能处理结构化数据”的绝对化限定不成立。","wrongReason":"","source":"日志分析与自然语言处理技术原理（无对应法条）","keyPoint":"AI 日志分析能处理结构化与非结构化两类数据"},{"id":"第二部分专业题-二、密码前沿技术-判断题-20","no":20,"kind":"judge","part":"第二部分专业题","cat":"二、密码前沿技术","type":"判断题","stem":"AI 可通过分析用户登录时间和地理位置模式，实时识别账户劫持行为。（ ）","options":[],"answer":"对","analysis":"账户劫持往往表现为登录行为偏离本人习惯：在异常时间、异地或不可能短时间内跨越的地理位置登录，或使用陌生设备与 IP。AI 可对每个账户建立登录时间、地点、设备等行为基线，实时比对并给出风险评分，一旦偏离就触发二次认证或阻断。这种基于行为模式的实时识别是账号安全防护的常见能力，表述成立。","correctReason":"AI 可对账户登录时间、地理位置等建立行为基线并实时比对，偏离基线即提示账户劫持风险，故该表述成立。","wrongReason":"","source":"用户行为分析（UEBA）与账号安全防护原理（无对应法条）","keyPoint":"AI 建行为基线，登录时空异常即预警账号劫持"},{"id":"第二部分专业题-三、标准题-单选题-1","no":1,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"GM/T0111-2021《区块链密码应用技术要求》的适用范围是以下哪一项 （ ）","options":[{"key":"A","text":"公有区块链的密码应用技术要求"},{"key":"B","text":"私有区块链的密码应用技术要求"},{"key":"C","text":"联盟区块链的密码应用技术要求"},{"key":"D","text":"所有类型区块链的密码应用技术要求"}],"answer":"C","analysis":"本题考查标准适用范围这一常见命题点。GM/T 0111-2021《区块链密码应用技术要求》面向的是联盟区块链，即在多机构间按准入规则共同维护的链，标准围绕其密码应用提出技术要求。公有链无准入、参与者完全开放，私有链由单一机构内部掌控，二者均不在该标准规定的范围之内；选项D把范围扩大到“所有类型”属于典型扩大化陷阱。记忆时抓住“联盟链＝多机构准入＋标准适用对象”这一对应关系。","correctReason":"该标准的适用范围明确限定为联盟区块链的密码应用技术要求。","wrongReason":"A：公有区块链不属于该标准适用范围；B：私有区块链不属于该标准适用范围；D：标准并非覆盖所有类型区块链，范围被扩大化。","source":"GM/T 0111-2021《区块链密码应用技术要求》第1章 范围","keyPoint":"GM/T 0111-2021 只管联盟链的密码应用"},{"id":"第二部分专业题-三、标准题-单选题-2","no":2,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"GM/T0129-2023《SSH 密码协议规范》规定的SSH 密码协议由哪三个子协议 构成？ （ ）","options":[{"key":"A","text":"传输层协议、鉴别协议、连接协议"},{"key":"B","text":"传输层协议、会话协议、管理协议"},{"key":"C","text":"密钥交换协议、加密协议、认证协议"},{"key":"D","text":"握手协议、记录协议、警报协议"}],"answer":"A","analysis":"SSH 协议采用三层结构：传输层协议负责算法协商、密钥交换和服务端鉴别，并提供机密性与完整性；鉴别协议运行在传输层之上，用于服务端鉴别客户端用户身份；连接协议再把已加密的通道复用成多条逻辑信道。三者自下而上依次叠加，缺一不可。易混点在于选项D，握手/记录/警报协议是 TLS 的分层，不是 SSH；选项B、C中的会话协议、管理协议、密钥交换协议均不是 SSH 的子协议名称。","correctReason":"SSH 密码协议由传输层协议、鉴别协议、连接协议三个子协议自下而上构成。","wrongReason":"B：会话协议、管理协议不是 SSH 的子协议；C：密钥交换、加密、认证只是各层的功能，不是子协议划分；D：握手协议、记录协议、警报协议是 TLS 协议的分层结构。","source":"GM/T 0129-2023《SSH密码协议规范》协议结构章节","keyPoint":"SSH 三层：传输层＋鉴别＋连接，别与 TLS 混淆"},{"id":"第二部分专业题-三、标准题-单选题-3","no":3,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"根据GM/T0129-2023《SSH 密码协议规范》，以下关于该标准中密码算法要 求，说法正确的是？ （ ）","options":[{"key":"A","text":"非对称密码算法必须采用RSA 算法，SM2 为可选"},{"key":"B","text":"SM4-CBC 模式是必选的对称加密模式，SM4-GCM 为可选"},{"key":"C","text":"完整性校验使用SHA-256 算法，SM3 为可选"},{"key":"D","text":"所有密码算法均为可选，由用户自行决定"}],"answer":"B","analysis":"该标准要求以国密算法为基础：非对称算法采用 SM2 用于身份鉴别和密钥交换，对称算法采用 SM4 加密密钥交换数据与报文数据，杂凑采用 SM3 做完整性校验。在 SM4 的多种工作模式中，SM4-CBC 为必选模式，SM4-GCM 等其他模式为可选，故B正确。命题人常用“把国密换成 RSA/SHA-256”或“把必选说成可选”来设置陷阱，凡出现 RSA、SHA-256 为主导的表述基本可判错。","correctReason":"标准规定 SM4 的多种工作模式中 SM4-CBC 为必选模式，SM4-GCM 等为可选模式。","wrongReason":"A：非对称算法采用 SM2，RSA 并非必选；C：完整性校验使用 SM3 杂凑算法，SHA-256 不是必选算法；D：密码算法有必选与可选之分，并非全部由用户自定。","source":"GM/T 0129-2023《SSH密码协议规范》密码算法要求","keyPoint":"SSH 国密：SM2 鉴别/密钥交换，SM4-CBC 必选，SM3 校验"},{"id":"第二部分专业题-三、标准题-单选题-4","no":4,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"GB/T17964-2021《信息安全技术 分组密码算法的工作模式》描述的九种工作 模式，其主要用途是 （ ）","options":[{"key":"A","text":"保护数据的完整性和机密性"},{"key":"B","text":"保护数据的机密性"},{"key":"C","text":"保护数据的完整性和可用性"},{"key":"D","text":"保护数据的不可否认性"}],"answer":"B","analysis":"GB/T 17964-2021 在范围中明确写道：本文件描述的工作模式仅适用于保护数据的机密性，不适用于保护数据的完整性。分组密码工作模式解决的是“如何用同一密钥把任意长明文迭代加密”，其安全目标就是机密性。完整性和不可否认性要靠杂凑函数、消息鉴别码、数字签名去实现，加解密模式本身提供不了。这是信息安全“机密性、完整性、可用性、不可否认性”四要素分工的典型考点，选B。","correctReason":"标准范围明确说明九种工作模式仅用于保护数据的机密性。","wrongReason":"A：标准明确不用于保护完整性，完整性需杂凑或鉴别码机制；C：可用性由系统与服务保障，与工作模式无关；D：不可否认性依赖数字签名，工作模式不提供。","source":"GB/T 17964-2021《信息安全技术 分组密码算法的工作模式》第1章 范围","keyPoint":"分组密码工作模式只保机密性，不管完整性"},{"id":"第二部分专业题-三、标准题-单选题-5","no":5,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"以下哪种分组密码工作模式存在“相同明文分组加密后得到相同密文分组” 的特性，因而不推荐单独使用 （ ）","options":[{"key":"A","text":"CBC（密文分组链接模式）"},{"key":"B","text":"ECB（电码本模式）"},{"key":"C","text":"CTR（计数器模式）"},{"key":"D","text":"CFB（密文反馈模式）"}],"answer":"B","analysis":"ECB 模式把每个明文分组独立加密，同一密钥下相同明文分组必然得到相同密文分组，因此密文会保留明文的重复结构，攻击者可据此进行分组重排、篡改或统计分析，所以标准中虽保留 ECB 但不推荐单独使用。CBC 通过前一组密文参与异或实现链接、CFB/OFB 采用反馈、CTR 采用逐块递增的计数器，同一明文分组在不同位置或不同计数器下得到的密文都不同。抓住“确定性加密＝结构泄露”即可锁定答案。","correctReason":"ECB 对每个分组独立加密，相同明文分组必然产生相同密文分组。","wrongReason":"A：CBC 用前一密文分组链接，相同明文出现在不同位置密文不同；C：CTR 每次用不同计数值加密，密文各不相同；D：CFB 依赖密文反馈，输出随位置变化，不会出现固定映射。","source":"GB/T 17964-2021《信息安全技术 分组密码算法的工作模式》电码本（ECB）工作模式","keyPoint":"ECB 确定性加密，暴露明文结构，不单独使用"},{"id":"第二部分专业题-三、标准题-单选题-6","no":6,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"根据GB/T17964-2021《信息安全技术 分组密码算法的工作模式》，该标准 正文中描述了九种分组密码工作模式。以下哪项是标准中不包含的工作模式 （ ）","options":[{"key":"A","text":"XTS（带密文挪用的XEX 可调分组密码模式）"},{"key":"B","text":"HCTR（带泛杂凑函数的计数器模式）"},{"key":"C","text":"GCM（伽罗瓦计数器模式）"},{"key":"D","text":"OFBNLF（带非线性函数的输出反馈模式）"}],"answer":"C","analysis":"GB/T 17964-2021 正文描述的九种模式为：ECB、CBC、CFB、OFB、CTR、XTS（带密文挪用的XEX可调分组密码）、HCTR（带泛杂凑函数的计数器）、BC（分组链接）、OFBNLF（带非线性函数的输出反馈）。GCM（伽罗瓦计数器模式）属于带认证的加密模式，在我国密码标准体系中由 GM/T 0080《SM4 密码算法使用规范》等其他标准规范，不在本标准的九种模式清单内，故选C。可记作“五种经典＋四种扩展”，后者即 XTS、HCTR、BC、OFBNLF。","correctReason":"九种模式为 ECB、CBC、CFB、OFB、CTR、XTS、HCTR、BC、OFBNLF，不含 GCM。","wrongReason":"A：XTS 属于标准中的扩展模式之一；B：HCTR 属于标准中的扩展模式之一；D：OFBNLF 属于标准中的扩展模式之一。","source":"GB/T 17964-2021《信息安全技术 分组密码算法的工作模式》正文工作模式条款","keyPoint":"九种模式：ECB/CBC/CFB/OFB/CTR＋XTS/HCTR/BC/OFBNLF"},{"id":"第二部分专业题-三、标准题-单选题-7","no":7,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"根据GM/T0021—2023《动态口令密码应用技术规范》，关于种子密钥（Seed Key）的管理，以下哪项说法是正确的 （ ）","options":[{"key":"A","text":"种子密钥可由制造方生成，并直接安装在动态口令令牌中，密钥管理中心仅 负责存储备份"},{"key":"B","text":"种子密钥的生命周期包含“产生、待激活、可用、过期、销毁”五个阶段， 其有效期应不大于15 年（180 个月）"},{"key":"C","text":"种子密钥的长度应不小于128 比特，应使用符合要求的随机数发生器生成"},{"key":"D","text":"种子密钥管理系统可设置在制造方，以便于令牌生产时直接写入种子密钥"}],"answer":"C","analysis":"该标准要求种子密钥由符合要求的随机数发生器产生，长度不小于 128 比特，这是口令生成算法安全强度的根基，故C正确。种子密钥不能由制造方自行生成并直接写入令牌，其生成、传输、存储、销毁应由密钥管理中心统一负责，制造方只能作为受托方按流程操作，故A、D错误。种子密钥虽有全生命周期管理要求，但有效期不超过 5 年，选项B写“不大于15年（180个月）”与标准不符，属于把数字放大的典型干扰项。","correctReason":"标准要求种子密钥长度不小于 128 比特，并应使用符合要求的随机数发生器生成。","wrongReason":"A：制造方不能自行生成并直接安装种子密钥，密钥管理中心负责生成与全生命周期管理；B：有效期数值错误，不是15年（180个月）；D：种子密钥管理系统不应设置在制造方，写入须受控且密钥管理中心统一管理。","source":"GM/T 0021-2023《动态口令密码应用技术规范》种子密钥管理要求","keyPoint":"种子密钥≥128 比特、真随机生成、密钥管理中心统管"},{"id":"第二部分专业题-三、标准题-单选题-8","no":8,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"根据GB/T45654-2025《网络安全技术 生成式人工智能服务安全基本要求》， 数据来源选择时，经评估数据内容中含违法不良信息情况超过多少比例的，不应 对该数据来源进行采集？（ ）","options":[{"key":"A","text":"3%"},{"key":"B","text":"5%"},{"key":"C","text":"10%"},{"key":"D","text":"15%"}],"answer":"B","analysis":"该标准在训练数据来源安全中设置了“5%红线”：面向拟采集的数据来源进行随机抽样安全评估，经评估数据内容中含违法不良信息超过 5% 的，不应对该数据来源进行采集；采集后核验同样以 5% 为界，超过则不得用作训练数据。3%、10%、15% 都是把这条红线改小或改大的干扰项。复习时把 GB/T 45654-2025 的几个关键数字串起来记：来源评估 5%、训练数据合格率 96%、生成内容合格率 90%、拒答率 95%。","correctReason":"标准规定数据来源抽样评估中违法不良信息超过 5% 的，不应采集该来源数据。","wrongReason":"A：3% 不是标准规定的红线比例；C：10% 不是标准规定的红线比例；D：15% 不是标准规定的红线比例。","source":"GB/T 45654-2025《网络安全技术 生成式人工智能服务安全基本要求》训练数据来源安全要求","keyPoint":"数据来源违法不良信息超 5% 不采集"},{"id":"第二部分专业题-三、标准题-单选题-9","no":9,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"根据GB/T45654-2025《网络安全技术 生成式人工智能服务安全基本要求》， 生成内容安全性方面，应保证模型生成内容合格率不低于多少？（ ）","options":[{"key":"A","text":"80%"},{"key":"B","text":"85%"},{"key":"C","text":"90%"},{"key":"D","text":"95%"}],"answer":"C","analysis":"标准在模型安全要求中提出应保证模型生成内容合格率不低于 90%，合格率的判定口径是抽样中不包含附录A所列安全风险（共31种）的样本占比。该指标与训练数据合格率不低于 96%、应拒答测试题拒答率不低于 95%、非拒答测试题拒答率不高于 5% 配套使用，构成绩效可测的指标体系。80%、85%、95% 都是把数字调低或与拒答率混淆的干扰项，注意区分“训练数据合格率 96%”和“生成内容合格率 90%”。","correctReason":"标准要求模型生成内容合格率不低于 90%。","wrongReason":"A：80% 低于标准要求；B：85% 低于标准要求；D：95% 是应拒答测试题拒答率的要求，不是生成内容合格率。","source":"GB/T 45654-2025《网络安全技术 生成式人工智能服务安全基本要求》模型生成内容安全要求","keyPoint":"生成内容合格率≥90%，训练数据合格率≥96%"},{"id":"第二部分专业题-三、标准题-单选题-10","no":10,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"根据GB/T46800-2025《生成式人工智能技术应用社会影响评估指南》，社 会影响评估框架不包括以下哪个方面？（ ）","options":[{"key":"A","text":"对个体与群体的影响"},{"key":"B","text":"对组织与行业的影响"},{"key":"C","text":"对经济社会系统的影响"},{"key":"D","text":"对技术性能的影响"}],"answer":"D","analysis":"社会影响评估关注的是生成式人工智能应用落地后对社会各方造成的后果，评估框架按影响对象层层展开：对个体与群体的影响、对组织与行业的影响、对经济社会系统的影响。技术性能（准确率、时延、鲁棒性等）属于技术评价与产品测评范畴，不是社会影响评估的维度，故选D。这类题的通用判断方法是看选项说的是“对人和社会的后果”还是“对系统本身的好坏”，后者一律不属于社会影响。","correctReason":"社会影响评估框架从个体与群体、组织与行业、经济社会系统三个层面展开，不含技术性能。","wrongReason":"A：对个体与群体的影响是评估框架的组成部分；B：对组织与行业的影响是评估框架的组成部分；C：对经济社会系统的影响是评估框架的组成部分。","source":"GB/T 46800-2025《生成式人工智能技术应用社会影响评估指南》评估框架条款","keyPoint":"社会影响评人群与系统，不评技术性能"},{"id":"第二部分专业题-三、标准题-单选题-11","no":11,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"根据GB/T17901.3-2021《信息技术 安全技术 密钥管理 第3 部分：采用非 对称技术的机制》，在公钥传递机制中，实体A 的公钥传递方式应符合以下哪 项描述？（ ）","options":[{"key":"A","text":"实体A 的公钥必须加密后传给其它实体"},{"key":"B","text":"实体A 的公钥经鉴别后传给其它实体，但不需保密"},{"key":"C","text":"实体A 的公钥不经鉴别直接公开广播"},{"key":"D","text":"实体A 的公钥通过对称加密方式传给实体B"}],"answer":"B","analysis":"公钥可以公开，其安全性不依赖保密，而依赖真实性与完整性，因此公钥传递的关键是“鉴别”：必须通过可信途径（如证书、可信第三方、带鉴别的分发协议）确认该公钥确实属于实体A，然后即可明文传递，故B正确。公钥加密传输既不必要也会带来密钥管理负担；不经鉴别直接广播会为中间人替换公钥留下后门；用对称加密传递公钥同样解决不了来源真实性问题。记住口诀：公钥传递要“鉴别＋完整”，不要“保密”。","correctReason":"公钥无需保密，但必须经鉴别后传递，以确保公钥与实体身份的真实绑定。","wrongReason":"A：公钥不需要加密传输，保密性不是公钥传递的安全目标；C：不经鉴别直接广播无法防中间人替换公钥；D：用对称加密传递公钥仍不能证明公钥归属，解决不了鉴别问题。","source":"GB/T 17901.3-2021《信息技术 安全技术 密钥管理 第3部分：采用非对称技术的机制》公钥传递机制","keyPoint":"公钥传递重在鉴别，不在保密"},{"id":"第二部分专业题-三、标准题-单选题-12","no":12,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"根据GB/T17901.1-2020《信息技术 安全技术 密钥管理 第1 部分：框架》， 以下哪项内容不属于该标准所包含的范围？（ ）","options":[{"key":"A","text":"建立密钥管理机制的通用模型"},{"key":"B","text":"定义对GB/T17901 通用的密钥管理基本概念"},{"key":"C","text":"规定具体密码算法的实现细节"},{"key":"D","text":"规定对密钥在其生存周期内进行管理的通用原则"}],"answer":"C","analysis":"GB/T 17901.1 是密钥管理的框架性标准，其内容是为整个 GB/T 17901 系列建立密钥管理机制的通用模型、统一基本概念，并给出密钥在生存周期内（生成、分发、存储、使用、更新、销毁等）管理的通用原则，因此A、B、D都属于标准范围。具体密码算法的实现细节（如 SM4 的轮函数、SM2 的签名流程）由 GB/T 32907、GB/T 32918 等算法标准规定，框架标准不作规定，故选C。","correctReason":"该标准只规定密钥管理的框架、概念与通用原则，不规定具体密码算法的实现细节。","wrongReason":"A：建立密钥管理机制的通用模型属于该标准范围；B：定义 GB/T 17901 通用的密钥管理基本概念属于该标准范围；D：规定密钥生存周期内的通用管理原则属于该标准范围。","source":"GB/T 17901.1-2020《信息技术 安全技术 密钥管理 第1部分：框架》第1章 范围","keyPoint":"密钥管理框架管模型与原则，不管算法实现细节"},{"id":"第二部分专业题-三、标准题-单选题-13","no":13,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"根据GM/T0074—2019《网上银行密码应用技术要求》，该标准所规定的密 码技术在网上银行业务中应用的相关要求，不包含以下哪一项？（ ）","options":[{"key":"A","text":"密码算法"},{"key":"B","text":"证书管理"},{"key":"C","text":"密钥管理"},{"key":"D","text":"密码模块物理防护等级"}],"answer":"D","analysis":"GM/T 0074-2019 针对网上银行业务的密码应用，从密码算法、证书管理、密钥管理等方面提出要求，例如应采用经认可的国密算法、证书的申请与撤销流程、密钥的生成存储与更新等。密码模块的物理防护等级划归密码模块自身的产品标准，如 GM/T 0028《密码模块安全技术要求》（对应 GB/T 37092）规定安全一级至四级，不属于本标准的规范内容，故选D。答题思路：标准只管“业务怎么用密码”，不管“设备做得有多硬”。","correctReason":"密码模块物理防护等级由密码模块安全标准规定，不属于网银密码应用技术要求的内容。","wrongReason":"A：密码算法是标准规定的核心内容之一；B：证书管理是标准规定的核心内容之一；C：密钥管理是标准规定的核心内容之一。","source":"GM/T 0074-2019《网上银行密码应用技术要求》第1章 范围","keyPoint":"网银标准管算法/证书/密钥，不管模块物理等级"},{"id":"第二部分专业题-三、标准题-单选题-14","no":14,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"根据GM/T0074—2019《网上银行密码应用技术要求》，在密码功能要求中， 为保证客户与网银系统双方交易活动的抗抵赖性，应对活动信息进行以下哪项处 理？（ ）","options":[{"key":"A","text":"加密传输"},{"key":"B","text":"数字签名"},{"key":"C","text":"杂凑运算"},{"key":"D","text":"消息鉴别码计算"}],"answer":"B","analysis":"抗抵赖性要求活动信息事后不可否认，实现手段是数字签名：客户用私钥对交易信息签名，银行验签；银行用私钥对回执签名，客户验签。由于私钥唯一且签名与数据绑定，签名者无法否认自己的行为，故B正确。加密传输解决机密性、杂凑运算只产生摘要不绑定身份、消息鉴别码在通信双方共享密钥的对称体制下双方都能伪造因而无法区分是谁发的，都不具备抗抵赖能力。","correctReason":"数字签名用私钥对活动信息签名，可防止交易双方事后否认，实现抗抵赖。","wrongReason":"A：加密传输只保证机密性；C：杂凑运算只保证数据完整性，且不绑定签名者身份；D：消息鉴别码基于共享密钥，双方均能生成，无法区分责任。","source":"GM/T 0074-2019《网上银行密码应用技术要求》密码功能要求","keyPoint":"抗抵赖靠数字签名，靠的是私钥唯一性"},{"id":"第二部分专业题-三、标准题-单选题-15","no":15,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"根据GM/T0074—2019《网上银行密码应用技术要求》，以下哪项业务类型 中，对公客户和个人客户均不需要密码技术提供抗抵赖性保护？（ ）","options":[{"key":"A","text":"查询业务"},{"key":"B","text":"资金变动业务"},{"key":"C","text":"签约业务"},{"key":"D","text":"其他业务"}],"answer":"A","analysis":"查询业务只读取账户余额、交易明细等信息，不改变资金状态和客户权益，发生纠纷的风险低，因此对公客户和个人客户在该类业务中都无需密码技术提供抗抵赖保护，故A正确。资金变动业务涉及转账、支付，签约业务涉及开通服务与协议确认，均直接产生法律与资金后果，需要数字签名保证不可否认；“其他业务”作为兜底条款，标准对其提出了相应要求，也不能选。","correctReason":"查询业务不改变资金与权益状态，对公和个人客户均不要求抗抵赖保护。","wrongReason":"B：资金变动业务直接涉及资金转移，需要抗抵赖保护；C：签约业务需确认客户意愿，需要抗抵赖保护；D：“其他业务”作为兜底项仍提出了相应密码要求。","source":"GM/T 0074-2019《网上银行密码应用技术要求》业务类型密码应用要求","keyPoint":"查询业务不抗抵赖，资金变动与签约必须抗抵赖"},{"id":"第二部分专业题-三、标准题-单选题-16","no":16,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"根据GM/T0025—2023《SSLVPN 网关产品规范》，关于设备自检要求，以 下哪项属于必选项？","options":[{"key":"A","text":"CPU、内存等物理部件检查"},{"key":"B","text":"硬件功能模块正确性检测"},{"key":"C","text":"算法正确性、密钥完整性、随机数可靠性检测"},{"key":"D","text":"网络接口功能检测"}],"answer":"C","analysis":"设备自检的必选项聚焦“密码功能是否正确、密钥是否完好、随机数是否可靠”这三件根本大事：算法正确性检测保证密码运算结果符合标准，密钥完整性检测保证密钥未被篡改或损坏，随机数可靠性检测保证密钥与随机因子质量，故C正确。CPU、内存等物理部件检查、硬件功能模块正确性检测、网络接口功能检测属于整机或硬件层面的检查项，不是该标准规定的必选自检内容，属于用“看起来也像自检”的表述设置的干扰项。","correctReason":"该标准把算法正确性、密钥完整性、随机数可靠性检测列为设备自检的必选项。","wrongReason":"A：CPU、内存等物理部件检查不属于标准规定的必选自检项；B：硬件功能模块正确性检测不属于标准规定的必选自检项；D：网络接口功能检测不属于标准规定的必选自检项。","source":"GM/T 0025-2023《SSL VPN网关产品规范》设备自检要求","keyPoint":"自检必选：算法、密钥完整性、随机数可靠性"},{"id":"第二部分专业题-三、标准题-单选题-17","no":17,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"根据GM/T0025—2023《SSLVPN 网关产品规范》，关于SSLVPN 网关产品 的可靠性要求，平均无故障工作时间应不低于多少小时？","options":[{"key":"A","text":"5000 小时"},{"key":"B","text":"8000 小时"},{"key":"C","text":"10000 小时"},{"key":"D","text":"15000 小时"}],"answer":"C","analysis":"SSL VPN 网关作为边界安全设备，长期在线运行，标准对可靠性提出量化指标，要求平均无故障工作时间（MTBF）不低于 10000 小时，故C正确。5000、8000、15000 三个数值是围绕该指标设置的干扰项，其中 15000 属于把门槛抬高，5000 和 8000 属于压低指标，均不符合标准。记忆方法：商用密码网络安全产品的 MTBF 多在“万小时”量级，记住“1 万小时”这个基准即可。","correctReason":"该标准要求 SSL VPN 网关产品的平均无故障工作时间不低于 10000 小时。","wrongReason":"A：5000 小时低于标准要求；B：8000 小时低于标准要求；D：15000 小时高于标准规定值，不是标准要求的下限。","source":"GM/T 0025-2023《SSL VPN网关产品规范》可靠性要求","keyPoint":"SSL VPN 网关 MTBF≥10000 小时"},{"id":"第二部分专业题-三、标准题-单选题-18","no":18,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"根据GM/T0108—2021《诱骗态BB84 量子密钥分配产品技术规范》，该标准 基于以下哪种协议对量子密钥分配产品的技术实现进行规范？","options":[{"key":"A","text":"基于纠缠态的E91 协议"},{"key":"B","text":"基于连续变量的CV-QKD 协议"},{"key":"C","text":"采用弱相干态光源的诱骗态BB84 协议"},{"key":"D","text":"采用单光子源的BB84 协议"}],"answer":"C","analysis":"BB84 是首个量子密钥分配协议，工程实现中理想的单光子源难以制造，实际采用弱相干态激光源，其光子数服从泊松分布，存在多光子脉冲而被光子数分离（PNS）攻击的风险；诱骗态方法通过随机发送不同强度的光脉冲来探测窃听、估算单光子计数率，从而在弱相干态光源下也能保证安全性。因此标准规范的是“采用弱相干态光源的诱骗态 BB84 协议”，故选C。E91 基于纠缠态，CV-QKD 基于连续变量，单光子源是理想化方案，三者都不符合。","correctReason":"该标准基于采用弱相干态光源的诱骗态 BB84 协议规范量子密钥分配产品。","wrongReason":"A：E91 基于纠缠态，不是本标准所依据的协议；B：CV-QKD 基于连续变量，与本标准无关；D：理想单光子源在实际产品中难以实现，标准面向的是弱相干态光源。","source":"GM/T 0108-2021《诱骗态BB84量子密钥分配产品技术规范》第1章 范围","keyPoint":"实用化 QKD：弱相干态光源＋诱骗态 BB84"},{"id":"第二部分专业题-三、标准题-单选题-19","no":19,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"根据GM/T0032—2014《基于角色的授权管理与访问控制技术规范》，该标 准中负责对访问请求做出判定功能的部件是？","options":[{"key":"A","text":"访问控制执行部件（AEF）"},{"key":"B","text":"访问控制决策部件（ADF）"},{"key":"C","text":"属性管理系统"},{"key":"D","text":"权限管理中心"}],"answer":"B","analysis":"在授权管理与访问控制的功能模型中，访问控制执行部件（AEF）负责在具体资源访问点上拦截请求并执行判定结果，访问控制决策部件（ADF）负责依据授权信息与访问控制策略对请求作出允许或拒绝的判定，两者是“决策—执行”分离的关系，故B正确。属性管理系统负责收集、维护主体与客体的属性信息，权限管理中心负责角色与权限的分配管理，二者都是为判定提供数据与策略支撑，不做单次访问请求的裁定。","correctReason":"访问控制决策部件（ADF）负责结合授权信息和访问控制策略对访问请求作出判定。","wrongReason":"A：AEF 是执行部件，负责拦截请求并执行判定结果，不做判定；C：属性管理系统负责维护属性信息，不作出访问判定；D：权限管理中心负责权限与角色的管理，不裁决单次访问请求。","source":"GM/T 0032-2014《基于角色的授权管理与访问控制技术规范》功能部件条款","keyPoint":"ADF 决策、AEF 执行，决策与执行分离"},{"id":"第二部分专业题-三、标准题-单选题-20","no":20,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"某应用系统开发商正在为客户开发一套基于角色的授权管理功能。客户的人 力资源部门需要定义公司员工（主体）与各业务角色（如财务主管、人事专员等） 之间的分配关系。开发人员需要明确这种分配关系的描述语言应由谁来负责实现 根据GM/T0032—2014《基于角色的授权管理与访问控制技术规范》，授权策略 描述语言（定义主体与角色间的分配关系）应由以下哪方实现？","options":[{"key":"A","text":"应用系统开发商"},{"key":"B","text":"访问控制产品开发商"},{"key":"C","text":"用户单位的权限主管部门（如人力资源部门）"},{"key":"D","text":"密码设备制造商"}],"answer":"C","analysis":"该标准在功能部件与职责划分上明确了各方的分工：访问控制产品开发商负责实现访问控制机制与判定功能，应用系统开发商负责在业务系统中集成调用，而“主体与角色之间的分配关系”属于业务管理范畴的具体授权策略，其描述语言应由用户单位的权限主管部门（如人力资源部门）负责实现和维护，因为只有他们才掌握员工与岗位对应关系的真实信息，故选C。密码设备制造商只提供密码运算与密钥保护能力，不涉及角色分配。","correctReason":"主体与角色分配关系的授权策略描述语言属于业务管理策略，应由用户单位的权限主管部门实现。","wrongReason":"A：应用系统开发商负责系统集成，不负责定义业务角色分配策略；B：访问控制产品开发商负责实现访问控制机制与接口，不负责具体业务授权策略；D：密码设备制造商只提供密码运算和密钥保护功能，与授权策略定义无关。","source":"GM/T 0032-2014《基于角色的授权管理与访问控制技术规范》授权策略描述语言相关条款","keyPoint":"业务角色分配由用户单位权限主管部门定，产品方提供机制"},{"id":"第二部分专业题-三、标准题-单选题-21","no":21,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"某大型企业部署了基于角色的授权与访问控制系统，系统包含多种功能部件。 其中，访问控制决策部件（ADF）收到一个来自某员工的访问请求后，结合该员 工的授权信息和资源的访问控制策略进行评估，最终做出是否允许访问的判定。 根据GM/T0032—2014《基于角色的授权管理与访问控制技术规范》，ADF 的 判定结果包括以下哪两种？","options":[{"key":"A","text":"允许和待确认"},{"key":"B","text":"允许和拒绝"},{"key":"C","text":"通过和驳回"},{"key":"D","text":"授权和禁止"}],"answer":"B","analysis":"ADF 的判定是二值的：允许或拒绝。它接收来自 AEF 的访问请求，结合主体的授权信息（角色、权限）和客体资源的访问控制策略进行判定，再把结果返回给 AEF 执行。选项中“待确认”意味着存在人工审批环节、“通过和驳回”是审批用词、“授权和禁止”混用了权限分配与访问裁决的概念，都不属于该标准定义的判定结果。抓住“决策部件只做允许/拒绝二分判断”这一要点即可。","correctReason":"ADF 依据授权信息与访问控制策略作出的判定结果为允许和拒绝两种。","wrongReason":"A：“待确认”不是标准定义的判定结果；C：“通过和驳回”是审批环节用语，不是访问控制判定的取值；D：“授权和禁止”混淆了权限分配与访问裁决的概念。","source":"GM/T 0032-2014《基于角色的授权管理与访问控制技术规范》访问控制决策部件条款","keyPoint":"ADF 判定只有两种结果：允许／拒绝"},{"id":"第二部分专业题-三、标准题-单选题-22","no":22,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"某电子政务系统采用基于标识的密码技术（IBC）实现用户身份鉴别。系统在 设计中需要明确标识（identity）的定义，以便统一用户身份数据的格式。根据 GM/T0057—2018《基于IBC 技术的身份鉴别规范》，以下关于“标识”的表述， 正确的是哪一项？","options":[{"key":"A","text":"标识必须是用户的电子邮箱地址"},{"key":"B","text":"标识必须是用户的手机号码"},{"key":"C","text":"标识是能够确定一个对象身份的唯一信息，例如电子邮箱地址、手机号码、 指纹数据等"},{"key":"D","text":"标识是指用户的姓名和身份证号码"}],"answer":"C","analysis":"在 IBC 体系中，标识就是用户的公钥，因此它必须是能确定一个对象身份的唯一信息，标准列举的形态包括电子邮箱地址、手机号码、指纹数据等，并不限定为某一种具体形式，故C正确。A、B、D都把标识窄化为单一类型（邮箱、手机号、身份证号加姓名），既不符合“唯一标识对象身份”的定义，也排除了生物特征等合法形态。答题关键：IBC 的标识是“可用于公钥的身份串”，强调唯一性而非固定格式。","correctReason":"标识是能够确定一个对象身份的唯一信息，可以是电子邮箱地址、手机号码、指纹数据等。","wrongReason":"A：标识并非必须是电子邮箱地址，标准未作此限定；B：标识并非必须是手机号码；D：标识不限于姓名加身份证号，且该组合未必构成唯一标识。","source":"GM/T 0057-2018《基于IBC技术的身份鉴别规范》术语与定义","keyPoint":"IBC 标识＝能唯一确定对象身份的信息，形式不限"},{"id":"第二部分专业题-三、标准题-单选题-23","no":23,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"某应用系统正在开发身份鉴别功能。系统开发人员需要查阅GM/T0057 标准 的相关技术要求。根据GM/T0057—2018《基于IBC 技术的身份鉴别规范》， 该标准依托于以下哪项算法？","options":[{"key":"A","text":"SM2 椭圆曲线公钥密码算法"},{"key":"B","text":"SM3 杂凑算法"},{"key":"C","text":"SM4 分组密码算法"},{"key":"D","text":"SM9 标识密码算法"}],"answer":"D","analysis":"IBC（基于标识的密码）用用户的身份标识直接作为公钥，由密钥生成中心用主密钥为用户生成对应私钥，无需数字证书，这一体制对应我国的 SM9 标识密码算法（GM/T 0044），因此该标准依托的是 SM9，故选D。SM2 是基于椭圆曲线的公钥算法，需要证书体系支撑；SM3 是杂凑算法，用于摘要与完整性；SM4 是对称分组算法。四者的定位各不相同，务必按“签名加密、标识密码、杂凑、对称加密”四类分清。","correctReason":"GM/T 0057-2018 基于标识密码（IBC）技术，依托 SM9 标识密码算法实现。","wrongReason":"A：SM2 是椭圆曲线公钥密码算法，属于证书体制，不是 IBC 的依托算法；B：SM3 是杂凑算法，只提供摘要与完整性功能；C：SM4 是对称分组密码算法，用于数据加密，不承担标识鉴别功能。","source":"GM/T 0057-2018《基于IBC技术的身份鉴别规范》算法依托相关条款","keyPoint":"IBC 身份鉴别依托 SM9 标识密码算法"},{"id":"第二部分专业题-三、标准题-单选题-24","no":24,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"某系统采用基于IBC 技术的身份鉴别机制，需要搭建公开参数服务（PPS）供 各方查询公开参数和标识状态信息。根据GM/T0057—2018《基于IBC 技术的 身份鉴别规范》，以下关于公开参数服务（PPS）的描述，正确的是哪一项？","options":[{"key":"A","text":"PPS 仅用于发布IBC 公开参数，不涉及用户标识信息"},{"key":"B","text":"PPS 用于发布IBC 公开参数、私钥生成策略、用户标识信息和状态等数据"},{"key":"C","text":"PPS 仅用于查询用户标识状态，不涉及公开参数"},{"key":"D","text":"PPS 由应用系统开发商自行定义，无需遵循标准规范"}],"answer":"B","analysis":"在 IBC 体系中，由于用户标识即公钥，各方都需要一个可信渠道获取系统公开参数、私钥生成策略以及用户标识和其状态（有效、撤销等）信息，公开参数服务（PPS）正是承担这一发布职能的部件，故B正确。A、C都把它窄化成只管参数或只管标识状态，遗漏了另一半；D说由应用系统开发商自行定义、无需遵循标准，违背了标准化的初衷，因为参数与状态信息必须统一格式才能互通互认。","correctReason":"PPS 用于发布 IBC 公开参数、私钥生成策略以及用户标识信息和状态等数据。","wrongReason":"A：PPS 不只是发布公开参数，还涉及用户标识信息与状态；C：PPS 不只是查询标识状态，也包括公开参数等数据发布；D：PPS 的接口与数据格式应遵循标准规范，不能由开发商自行定义。","source":"GM/T 0057-2018《基于IBC技术的身份鉴别规范》公开参数服务（PPS）条款","keyPoint":"PPS 统一发布公开参数、私钥生成策略与标识状态"},{"id":"第二部分专业题-三、标准题-单选题-25","no":25,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"某软件公司正在开发一款支持PDF 文档密码应用的软件，需要明确该标准的 适用范围，以确定其功能设计边界。根据GM/T0112—2021《PDF 格式文档的密 码应用技术要求》，该标准规定了采用密码算法对PDF 格式文档进行哪些操作 的技术要求？","options":[{"key":"A","text":"仅数字签名和电子签章"},{"key":"B","text":"仅加密和解密"},{"key":"C","text":"数字签名、电子签章以及加解密"},{"key":"D","text":"仅数字签名和加解密"}],"answer":"C","analysis":"GM/T 0112-2021 覆盖 PDF 文档密码应用的三类操作：数字签名、电子签章以及加解密，三者共同构成该标准的技术要求范围。选项A只留签名与签章、B只留加解密、D缺少电子签章，都属于范围被截断的干扰项。复习要点：电子签章是在数字签名基础上叠加可视化印章与文档完整性保护，与纯数字签名并列出现在标准范围中，不能漏掉。","correctReason":"该标准规定了采用密码算法对 PDF 文档进行数字签名、电子签章以及加解密的技术要求。","wrongReason":"A：范围不止数字签名和电子签章，还包括加解密；B：范围不止加密和解密，还包括数字签名与电子签章；D：遗漏了电子签章这一标准明确规定的操作。","source":"GM/T 0112-2021《PDF格式文档的密码应用技术要求》第1章 范围","keyPoint":"PDF 密码应用三件套：数字签名＋电子签章＋加解密"},{"id":"第二部分专业题-三、标准题-单选题-26","no":26,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"某单位开发PDF 加密功能，需要确定PDF 文档的加密方式。根据GM/T0112 —2021《PDF 格式文档的密码应用技术要求》，该标准规定的PDF 加解密机制 包括以下哪几种方式？","options":[{"key":"A","text":"仅基于口令的加密"},{"key":"B","text":"仅基于数字证书的加密"},{"key":"C","text":"基于口令的加密和基于数字证书的加密"},{"key":"D","text":"仅基于对称密钥的加密"}],"answer":"C","analysis":"该标准为 PDF 文档规定了两种加解密机制：一是基于口令的加密，用户以口令派生密钥对文档加密，适合个人文件的简单保护；二是基于数字证书的加密，用接收者公钥（证书）加密文档密钥，可精确控制访问对象，适合公文流转场景，故C正确。A、B都只说了一种，D所说的“基于对称密钥的加密”实际包含在上述两种机制的密钥保护环节中，并非独立的第三种方式。","correctReason":"该标准规定的 PDF 加解密机制包括基于口令的加密和基于数字证书的加密两种方式。","wrongReason":"A：遗漏了基于数字证书的加密方式；B：遗漏了基于口令的加密方式；D：基于对称密钥的加密不是标准单列的第三种机制，其密钥正是由口令或数字证书保护的。","source":"GM/T 0112-2021《PDF格式文档的密码应用技术要求》加解密机制条款","keyPoint":"PDF 加密两种方式：口令加密、数字证书加密"},{"id":"第二部分专业题-三、标准题-单选题-27","no":27,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"某单位在PDF 电子签章开发过程中，需要确定签章保护范围（ByteRange）的 设置方式及签名算法的要求。根据GM/T0112—2021《PDF 格式文档的密码应用 技术要求》，以下关于PDF 电子签章ByteRange 和签名算法要求的说法中，正 确的有（ ）","options":[{"key":"A","text":"ByteRange 范围包含电子签章值（Contents 条目）本身"},{"key":"B","text":"ByteRange 范围是除电子签章值本身之外的整个文件"},{"key":"C","text":"对PDF 文档的任何一个字节的变动都会造成签章验证失败"},{"key":"D","text":"SM2 签名算法应遵循GM/T0003"}],"answer":"BC","analysis":"本题实为多选题（题干误标为单选），官方答案为 BC。电子签章的签名值存放于 Contents 条目，ByteRange 只覆盖除签章值本身之外的整个文件范围，这样签名值才能在不破坏已有签名的前提下写入，故B正确、A错误。文档内容一旦被改动即验证失败，体现完整性保护，故C正确。D的错误在于签名算法所依据的标准是 GM/T 0003.2《SM2 椭圆曲线公钥密码算法 第2部分：数字签名算法》，只写GM/T 0003 不准确、不完整。","correctReason":"ByteRange 覆盖除电子签章值本身之外的整个文件；文档内容变动会导致签章验证失败。","wrongReason":"A：ByteRange 不包含存放签章值的 Contents 条目本身；D：SM2 签名算法应遵循 GM/T 0003.2，仅写 GM/T 0003 指代不准确、不完整。","source":"GM/T 0112-2021《PDF格式文档的密码应用技术要求》电子签章条款","keyPoint":"ByteRange 不含签章值；SM2 签名依 GM/T 0003.2","conflict":"原卷归入单选题，但答案为『BC』（多选格式），已按原卷答案保留。"},{"id":"第二部分专业题-三、标准题-单选题-28","no":28,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"根据 GM/T0095—2020《电子招投标密码应用技术要求》，电子招投标系统 中用于数据完整性校验与数字签名杂凑运算的国密算法是（）","options":[{"key":"A","text":"SM1"},{"key":"B","text":"SM2"},{"key":"C","text":"SM3"},{"key":"D","text":"SM4"}],"answer":"C","analysis":"数据完整性校验与数字签名中的杂凑运算，对应的是杂凑算法，国密体系中即 SM3，输出 256 比特摘要，故C正确。SM1 是分组密码算法且算法未公开，只以硬件形式提供；SM2 是非对称公钥算法，用于签名、加密和密钥交换，其签名计算过程中确实会调用 SM3，但题目问的是“用于杂凑运算的算法”；SM4 是分组密码算法，用于数据加解密。四类算法的功能边界要分清。","correctReason":"SM3 是我国密码杂凑算法标准，用于数据完整性校验与签名中的杂凑运算。","wrongReason":"A：SM1 是分组密码算法，且算法不公开、以硬件实现，不用于杂凑；B：SM2 是非对称公钥算法，本身不做杂凑运算；D：SM4 是分组密码算法，用于加解密而非杂凑。","source":"GM/T 0095-2020《电子招投标密码应用技术要求》密码算法应用要求","keyPoint":"完整性校验与签名杂凑用 SM3"},{"id":"第二部分专业题-三、标准题-单选题-29","no":29,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"依据 GM/T0095—2020《电子招投标密码应用技术要求》，电子招投标投标 文件加密应优先采用的国密对称加密算法为（）","options":[{"key":"A","text":"SM2"},{"key":"B","text":"SM3"},{"key":"C","text":"SM4"},{"key":"D","text":"SM9"}],"answer":"C","analysis":"投标文件数据量大，需要用对称加密算法处理，国密体系中即 SM4 分组密码算法（分组与密钥长度均为 128 比特），故C正确。SM2 是非对称算法，运算速度慢，通常只用来加密对称密钥或做签名，不用于大批量数据加密；SM3 是杂凑算法，只能产生摘要，不能加密数据；SM9 是标识密码算法，同属非对称体制。答题要点：批量数据加密必用对称算法。","correctReason":"SM4 是对称分组密码算法，适合对投标文件这类大批量数据进行加密。","wrongReason":"A：SM2 是非对称算法，一般只用于加密会话密钥或数字签名，不用于大数据量加密；B：SM3 是杂凑算法，不具备加密功能；D：SM9 是标识密码算法，属非对称体制，不适合批量数据加密。","source":"GM/T 0095-2020《电子招投标密码应用技术要求》密码算法应用要求","keyPoint":"批量数据加密用对称算法 SM4"},{"id":"第二部分专业题-三、标准题-单选题-30","no":30,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"GM/T0095—2020《电子招投标密码应用技术要求》规定，电子招投标系统客 户端身份认证与本地签名解密应使用的密码设备是（）","options":[{"key":"A","text":"服务器密码机"},{"key":"B","text":"智能密码钥匙"},{"key":"C","text":"安全网关"},{"key":"D","text":"密钥管理系统"}],"answer":"B","analysis":"客户端侧的身份认证与本地签名、解密操作需要私钥始终不出设备，这类“贴身”密码运算由智能密码钥匙（USB Key 等）承担，它是客户端密码模块的典型形态，故B正确。服务器密码机部署在服务端，负责服务端密钥管理和批量密码运算，客户端无法随身使用；安全网关侧重网络层访问控制与加密隧道；密钥管理系统负责密钥的产生、存储、分发与销毁，都不直接承担客户端的本地签名解密功能。","correctReason":"智能密码钥匙是客户端密码模块，可安全保存用户私钥并完成身份认证、签名与解密运算。","wrongReason":"A：服务器密码机部署在服务端，不用于客户端本地签名与解密；C：安全网关主要提供网络边界防护与加密隧道，不具备客户端证书与私钥载体功能；D：密钥管理系统负责密钥全生命周期管理，不做客户端侧的签名解密运算。","source":"GM/T 0095-2020《电子招投标密码应用技术要求》客户端密码设备要求","keyPoint":"客户端认证与本地签名解密用智能密码钥匙"},{"id":"第二部分专业题-三、标准题-单选题-31","no":31,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"按照 GM/T0095—2020《电子招投标密码应用技术要求》，电子招投标密码 应用日志记录保存期限应不少于（）","options":[{"key":"A","text":"3 个月"},{"key":"B","text":"6 个月"},{"key":"C","text":"12 个月"},{"key":"D","text":"24 个月"}],"answer":"B","analysis":"本题考查电子招投标系统密码应用中对密码操作日志的留存要求。密码应用日志记录了签名验签、加解密、密钥使用等关键操作，是事后审计与责任追溯的依据，留存期限太短无法覆盖招投标质疑投诉周期。该标准要求日志保存期限不少于6个月，故B正确。3个月、12个月、24个月均不是标准给出的下限值，容易与其他行业日志留存年限混淆。","correctReason":"GM/T 0095-2020 规定电子招投标密码应用日志记录保存期限应不少于6个月，B项与之完全一致。","wrongReason":"A：3个月短于标准要求的留存下限，无法满足事后审计追溯需要；C：12个月与标准规定的下限不符；D：24个月同样不是标准规定的保存期限。","source":"GM/T 0095-2020《电子招投标密码应用技术要求》","keyPoint":"电子招投标密码应用日志至少保存6个月。"},{"id":"第二部分专业题-三、标准题-单选题-32","no":32,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"根据GM/T0070—2019《电子保单密码应用技术要求》标准，电子保单投保 环节中，保险业务系统客户端应采集签名者的手写签名笔迹信息、声音、影像等 数据，形成投保行为证据链，并利用以下哪项完成电子投保申请的数字签名？（ ）","options":[{"key":"A","text":"保险公司的企业数字证书私钥"},{"key":"B","text":"CA 颁发的投保人数字证书私钥"},{"key":"C","text":"保险代理人的注册账户数字证书"},{"key":"D","text":"时间戳服务机构的数字证书"}],"answer":"B","analysis":"本题考查电子保单投保环节的签名主体问题。投保申请是投保人本人的意思表示，只有用投保人自己的私钥签名，才能把行为证据链与投保人身份唯一绑定，事后可验证、不可抵赖。CA签发的投保人数字证书私钥只有投保人本人掌握，因此B正确。其余选项分别是公司、代理人、时间戳机构的密钥，签名主体与行为主体不一致，不能证明投保人本人的意愿。","correctReason":"电子投保申请应由投保人本人完成数字签名，故须使用CA颁发的投保人数字证书私钥。","wrongReason":"A：企业证书私钥代表保险公司法人行为，不能表达投保人意愿；C：代理人账户证书代表代理人操作，无法证明投保人本人确认；D：时间戳机构证书只用于时间证明，不能用于投保人签名。","source":"GM/T 0070-2019《电子保单密码应用技术要求》","keyPoint":"投保申请由投保人本人数字证书私钥签名。"},{"id":"第二部分专业题-三、标准题-单选题-33","no":33,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"根据GM/T0070—2019《电子保单密码应用技术要求》标准，电子保单的签 发环节中，电子保单系统应按照投保人填写的投保资料，根据险种的不同结合相 应的保单内容模板，自动生成格式化保单数据，并进行以下哪项操作？（ ）","options":[{"key":"A","text":"在电子保单的投保人签章位置进行电子签章操作"},{"key":"B","text":"在电子保单的保险公司签章位置进行电子签章操作"},{"key":"C","text":"在电子保单的受益人签章位置进行电子签章操作"},{"key":"D","text":"在电子保单的所有页面进行电子签章操作"}],"answer":"B","analysis":"本题考查电子保单签发环节的签章位置与签章主体。保单格式化和出具是保险人的行为，系统按险种模板生成格式化保单数据后，要在保险公司的签章位置加盖电子签章，表示保险公司对保单内容的认可并承担保险责任。投保人的签章在投保环节已经完成，受益人并非签章主体，也没有必要对保单所有页面逐页签章。","correctReason":"签发环节由保险公司出具保单，应在电子保单的保险公司签章位置进行电子签章。","wrongReason":"A：投保人的签章属于投保环节，不是签发环节的操作；C：受益人不是保单签发主体，无签章位置要求；D：对全部页面签章并非标准规定，且成本高、无必要。","source":"GM/T 0070-2019《电子保单密码应用技术要求》","keyPoint":"签发环节在保险公司签章位置加盖电子签章。"},{"id":"第二部分专业题-三、标准题-单选题-34","no":34,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"根据GM/T0124—2022《安全隔离与信息交换产品密码检测规范》标准，安 全隔离与信息交换产品的安全等级划分为哪两个级别？（ ）","options":[{"key":"A","text":"一级和二级"},{"key":"B","text":"基本级和增强级"},{"key":"C","text":"标准级和高级"},{"key":"D","text":"A 级和B 级"}],"answer":"B","analysis":"本题考查安全隔离与信息交换产品的安全等级划分。该类产品在实现网络隔离的同时要保证受控的数据交换，等级划分体现的是密码功能与安全强度的差异。GM/T 0124-2022 将其安全等级划分为基本级和增强级两个级别，故B正确。一级二级、标准级高级、A级B级都不是该标准使用的等级名称，属于不同标准的等级表述干扰。","correctReason":"该标准明确安全隔离与信息交换产品的安全等级划分为基本级和增强级。","wrongReason":"A：一级和二级是等级保护等体系的分级用语，不是本标准的等级划分；C：标准级和高级并非本标准用语；D：A级和B级是常见干扰项，本标准未采用。","source":"GM/T 0124-2022《安全隔离与信息交换产品密码检测规范》","keyPoint":"安全隔离与信息交换产品分基本级、增强级。"},{"id":"第二部分专业题-三、标准题-单选题-35","no":35,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"根据GM/T0124—2022《安全隔离与信息交换产品密码检测规范》标准，安 全隔离与信息交换产品定义中的核心特征是（ ）","options":[{"key":"A","text":"能够实现网络之间的高速数据交换"},{"key":"B","text":"能够在实现网络隔离的同时，通过网络协议终止基础上的安全通道进行安全 数据交换"},{"key":"C","text":"仅能实现网络的物理隔离"},{"key":"D","text":"能够实现完全无限制的数据互通"}],"answer":"B","analysis":"本题考查安全隔离与信息交换产品的定义特征。这类产品的核心不是简单物理断开，也不是无限制互通，而是在协议终止的基础上，通过安全通道实现受控的数据交换，从而既阻断网络层攻击通路，又满足业务数据摆渡需求。B项同时包含网络隔离、协议终止和安全通道三个要素，是该产品的核心特征。","correctReason":"定义强调实现网络隔离的同时，通过协议终止基础上的安全通道进行安全数据交换。","wrongReason":"A：只强调高速交换，忽略隔离与安全通道，不是定义特征；C：仅物理隔离无法完成受控数据交换，削弱了产品价值；D：完全无限制互通与隔离要求直接冲突。","source":"GM/T 0124-2022《安全隔离与信息交换产品密码检测规范》","keyPoint":"隔离＋协议终止＋安全通道＝安全数据交换。"},{"id":"第二部分专业题-三、标准题-单选题-36","no":36,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"在区块链系统中，为了确保账本数据的不可篡改和前后链接，依据 GM/T 0111-2021《区块链密码应用技术要求》标准，在区块链账本中通常通过区块头 的哪一项来识别区块并用于链接相邻区块？（ ）","options":[{"key":"A","text":"签名值"},{"key":"B","text":"权限值"},{"key":"C","text":"杂凑值"},{"key":"D","text":"时间戳"}],"answer":"C","analysis":"本题考查区块链账本中区块头用于链接相邻区块的字段。区块头中的前一区块杂凑值是对前一块区块头做杂凑运算得到的定长摘要，任一历史区块被改动都会导致后续所有杂凑值对不上，从而实现链式防篡改。签名值用于确认交易或区块来源，权限值用于权限控制，时间戳只标记生成时间，三者都不具备把区块前后链接起来的作用。","correctReason":"区块头通过前一区块的杂凑值实现区块识别与链式链接，杂凑运算具有抗碰撞与雪崩效应。","wrongReason":"A：签名值解决身份认证和不可否认，不能链接区块；B：权限值用于权限控制，与链式结构无关；D：时间戳只表明区块产生时间，可被伪造也不能连锁。","source":"GM/T 0111-2021《区块链密码应用技术要求》","keyPoint":"区块靠前一区块杂凑值（哈希）链式防篡改。"},{"id":"第二部分专业题-三、标准题-单选题-37","no":37,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"依据GM/T0119-2022《PLC 控制系统及 PLC 控制器密码应用技术规范》标 准，PLC 控制系统中各组成设备的密码应用需满足特定要求。其中，负责运行逻 辑组态软件、实现用户逻辑组态编辑打包和下装的“工程师站”，在进行双向身 份认证时主要采用的密码算法是？（ ）","options":[{"key":"A","text":"SM4/SM3"},{"key":"B","text":"SM2/SM9"},{"key":"C","text":"SM3/SM4"},{"key":"D","text":"SM2/SM4"}],"answer":"B","analysis":"本题考查PLC控制系统中工程师站的密码算法选用。工程师站承担逻辑组态编辑、打包和下装，若被冒充就可能把恶意组态写入控制器，因此双向身份认证必须使用公钥密码算法。SM2是国产椭圆曲线公钥算法，SM9是基于标识的公钥算法，二者都可用于身份鉴别与密钥协商，故B正确。SM3是杂凑算法、SM4是对称分组算法，单靠它们无法完成具有不可否认性的双向认证。","correctReason":"双向身份认证需要公钥密码体制支持，工程师站采用SM2/SM9算法完成身份鉴别。","wrongReason":"A：SM4是对称算法、SM3是杂凑算法，组合后无法直接实现公钥鉴别；C：与A相同，均为对称与杂凑算法组合；D：SM4为对称算法，不能提供公钥认证能力。","source":"GM/T 0119-2022《PLC控制系统及PLC控制器密码应用技术规范》","keyPoint":"双向身份认证用公钥算法：SM2/SM9。"},{"id":"第二部分专业题-三、标准题-单选题-38","no":38,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"在数字证书格式符合性检测中，为了解决时间溢出问题并确保证书有效期编 码的规范性，GM/T0043-2024《数字证书互操作检测规范》对终端实体证书的有 效期编码规则做出了明确要求。以下关于该编码规则的描述，正确的是？（ ）","options":[{"key":"A","text":"2049 年前采用GeneralizedTime 类型，2050 年后采用UTCTime 类型"},{"key":"B","text":"所有年份统一采用UTCTime 类型"},{"key":"C","text":"2049 年前采用UTCTime 类型，2050 年后必须使用GeneralizedTime 类型"},{"key":"D","text":"所有年份统一采用GeneralizedTime 类型"}],"answer":"C","analysis":"本题考查数字证书有效期的编码规则。UTCTime只用两位表示年份，常以1950—2049为解释区间，跨过2049年后两位年份会产生歧义，即所谓时间溢出问题。因此规则是2049年及以前使用UTCTime，2050年起必须改用四位年份的GeneralizedTime，C正确。A把两种类型说反，B和D搞一刀切，都不符合实际编码要求。","correctReason":"2049年前用UTCTime（两位年），2050年后必须用GeneralizedTime（四位年）以避免年份歧义。","wrongReason":"A：把UTCTime与GeneralizedTime的适用区间完全颠倒；B：全部用UTCTime在2050年后会出现年份歧义；D：全部用GeneralizedTime不是标准规定的编码方式。","source":"GM/T 0043-2024《数字证书互操作检测规范》","keyPoint":"证书有效期：2049前UTCTime，2050起GeneralizedTime。"},{"id":"第二部分专业题-三、标准题-单选题-39","no":39,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"依据GM/T0043-2024《数字证书互操作检测规范》，在进行数字证书互操作 检测时，判定规则采用了“关键项一票否决”机制。对于提供OCSP 服务的系统， 其所有检测项的判定级别是如何规定的？（ ）","options":[{"key":"A","text":"仅包含关键项"},{"key":"B","text":"仅包含一般项"},{"key":"C","text":"关键项占50%，一般项占50%"},{"key":"D","text":"所有检测项均为关键项"}],"answer":"D","analysis":"本题考查数字证书互操作检测中的判定级别设置。该规范采用关键项一票否决机制，检测项按重要程度分为关键项和一般项。对于提供OCSP服务的系统，其在线证书状态查询能力直接决定证书吊销信息能否被及时获取，一旦失效将影响整个信任链判断，因此标准将其所有检测项均设为关键项，任一不通过即判不合格，故D正确。","correctReason":"对提供OCSP服务的系统，标准规定其所有检测项均为关键项，实行一票否决。","wrongReason":"A：并非只含关键项而排除一般项的表述逻辑；B：仅含一般项与一票否决要求相悖；C：按比例划分关键项与一般项不符合标准规定。","source":"GM/T 0043-2024《数字证书互操作检测规范》","keyPoint":"OCSP服务系统检测项全部为关键项。"},{"id":"第二部分专业题-三、标准题-单选题-40","no":40,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"根据GM/T0106—2021《银行卡终端产品密码应用技术要求》，该标准主要 规定了银行卡终端产品上密码应用相关的技术要求。以下哪项不属于该标准规定 的内容？（ ）","options":[{"key":"A","text":"终端基本安全要求"},{"key":"B","text":"终端密钥管理要求"},{"key":"C","text":"终端数据安全要求"},{"key":"D","text":"终端硬件物理防破坏要求"}],"answer":"D","analysis":"本题考查银行卡终端产品密码应用技术要求的内容范围。该标准围绕终端上的密码应用，规定终端基本安全要求、密钥管理要求和数据安全要求等密码相关技术要求。终端硬件物理防破坏属于产品硬件防护范畴，不在该标准的密码应用技术要求之列，故D为不属于项。答题时要抓住标准标题中的“密码应用”，凡纯物理防护类要求一般不属于范围。","correctReason":"终端硬件物理防破坏要求不属于GM/T 0106-2021规定的密码应用技术要求内容。","wrongReason":"A：终端基本安全要求是该标准规定的密码应用基础内容；B：终端密钥管理要求是标准的核心内容之一；C：终端数据安全要求（如敏感数据加解密与完整性）同样在标准规定范围内。","source":"GM/T 0106-2021《银行卡终端产品密码应用技术要求》","keyPoint":"银行卡终端标准管密码应用，不管硬件物理防破坏。"},{"id":"第二部分专业题-三、标准题-单选题-41","no":41,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"GM/Z4001-2013《密码术语》中，由IETF 制定的密钥协商协议，定义了通信 双方进行身份鉴别、协商加密算法以及生成共享会话密钥的一种方法称为（ ）。","options":[{"key":"A","text":"lKE 协议"},{"key":"B","text":"IPSec 协议"},{"key":"C","text":"ISAKMP 协议"},{"key":"D","text":"SSL 协议"}],"answer":"A","analysis":"本题考查密码术语中IKE协议的定义。IKE（Internet密钥交换）由IETF制定，用于通信双方相互身份鉴别、协商加密与认证算法并生成共享会话密钥，是IPSec体系中负责密钥协商的组件。IPSec是安全协议体系而非单纯的密钥协商方法，ISAKMP只提供协商框架和报文格式，SSL/TLS面向应用层安全通道，故A正确。","correctReason":"IKE协议由IETF制定，定义通信双方身份鉴别、算法协商与共享会话密钥生成的方法。","wrongReason":"B：IPSec是网络层安全协议体系，密钥协商由其中的IKE完成；C：ISAKMP只规定协商框架与报文格式，不直接完成密钥生成；D：SSL是面向应用的安全通道协议，不是密钥协商协议术语。","source":"GM/Z 4001-2013《密码术语》","keyPoint":"IKE＝IETF的密钥协商协议。"},{"id":"第二部分专业题-三、标准题-单选题-42","no":42,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"GM/Z4001-2013《密码术语》中，控制密码算法运算的关键信息或参数称为 （ ）。","options":[{"key":"A","text":"密钥"},{"key":"B","text":"密文"},{"key":"C","text":"密码"},{"key":"D","text":"算法"}],"answer":"A","analysis":"本题考查密钥的基本定义。密钥是参与密码算法运算、控制加解密或认证结果的关键信息或参数，算法可以公开而密钥必须保密，这正是柯克霍夫原则的体现。密文是加密的输出结果，密码在术语中指整体技术或口令，算法是公开的运算规则，都不是“控制运算的关键参数”。","correctReason":"密钥是控制密码算法运算的关键信息或参数，算法公开、密钥保密。","wrongReason":"B：密文是加密变换的输出，属于运算结果而非控制参数；C：密码指密码技术或口令，不是算法控制参数；D：算法是公开的运算规则，其本身不决定具体运算结果。","source":"GM/Z 4001-2013《密码术语》","keyPoint":"密钥＝控制算法运算的关键参数，必须保密。"},{"id":"第二部分专业题-三、标准题-单选题-43","no":43,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"GM/Z4001-2013《密码术语》中，加密和解密使用相同密钥的密码算法称为 （ ）。","options":[{"key":"A","text":"公钥密码算法"},{"key":"B","text":"对称密码算法"},{"key":"C","text":"密码杂凑算法"},{"key":"D","text":"非对称密码算法"}],"answer":"B","analysis":"本题考查对称密码算法的定义。加密和解密使用同一密钥（或可互相简单推导的密钥）的算法称为对称密码算法，SM1、SM4、AES属于此类，优点是速度快、适合大数据量加密，难点在于密钥分发与管理。公钥或非对称算法加解密使用一对不同的密钥，杂凑算法则根本不用密钥、不可逆，故B正确。","correctReason":"加解密使用相同密钥是典型的对称密码算法特征。","wrongReason":"A：公钥算法加解密使用公钥和私钥一对不同密钥；C：密码杂凑算法不使用密钥，输出定长摘要且不可逆；D：非对称算法与公钥算法同类，与“相同密钥”不符。","source":"GM/Z 4001-2013《密码术语》","keyPoint":"同一密钥加解密＝对称密码算法。"},{"id":"第二部分专业题-三、标准题-单选题-44","no":44,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"GM/T0034-2014《基于SM2 密码算法的证书认证系统密码及其相关安全技术 规范》中，关于密钥安全基本要求的叙述不正确的是（ ）。","options":[{"key":"A","text":"存在于硬件密码设备之外的所有密钥应加密"},{"key":"B","text":"对密码设备操作应由多个业务管理员实施"},{"key":"C","text":"密钥应有安全可靠的备份恢复机制"},{"key":"D","text":"密钥的生成和使用应在硬件密码设备中完成"}],"answer":"B","analysis":"本题考查证书认证系统的密钥安全基本要求。标准要求存在于硬件密码设备之外的密钥都必须加密保存，密钥的生成与使用应在硬件密码设备中完成，并具备安全可靠的备份恢复机制，故A、C、D都是正确表述。B项错在“多个业务管理员”：密码设备的操作应实行权限分离和最小授权，由授权的特定管理员按规定操作，而非笼统地要求多人在场或多人实施。","correctReason":"密钥安全基本要求为密钥出设备即加密、生成使用在硬件密码设备内、具备备份恢复机制，B项不属于其中要求。","wrongReason":"A：属于标准要求的正确表述，设备外密钥必须加密；C：属于标准要求的正确表述，密钥须有安全可靠的备份恢复机制；D：属于标准要求的正确表述，密钥生成和使用应在硬件密码设备中完成。","source":"GM/T 0034-2014《基于SM2密码算法的证书认证系统密码及其相关安全技术规范》","keyPoint":"设备外密钥必加密、密钥在硬件设备内生成使用。"},{"id":"第二部分专业题-三、标准题-单选题-45","no":45,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"根据GB/T39786-2021《信息安全技术 信息系统密码应用基本要求》中，以 下不是设备和计算安全层面的测评对象的是（ ）。","options":[{"key":"A","text":"数据库管理系统"},{"key":"B","text":"虚拟设备"},{"key":"C","text":"OA 办公系统"},{"key":"D","text":"电子签章系统"}],"answer":"C","analysis":"本题考查询问设备和计算安全层面的测评对象范围。该层面针对各类设备及其上的系统软件、支撑软件，数据库管理系统、虚拟设备（如虚拟机、虚拟化平台组件）以及电子签章系统这类部署在设备上的密码应用系统都属于此层面。OA办公系统属于具体业务应用，应归入应用和数据安全层面，故C为不属于项。","correctReason":"OA办公系统属于业务应用，测评时归入应用和数据安全层面，不是设备和计算安全层面的对象。","wrongReason":"A：数据库管理系统属于设备和计算安全层面的系统软件对象；B：虚拟设备属于设备和计算安全层面的测评对象；D：电子签章系统作为设备上部署的密码应用系统，属于该层面对象。","source":"GB/T 39786-2021《信息安全技术 信息系统密码应用基本要求》","keyPoint":"设备和计算层面测设备与系统软件，业务系统归应用和数据层面。"},{"id":"第二部分专业题-三、标准题-单选题-46","no":46,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"在GM/T0011-2023《可信计算 可信密码支撑平台功能与接口规范》中，计算 度量值的过程应是执行（ ）的过程。","options":[{"key":"A","text":"加密"},{"key":"B","text":"解密"},{"key":"C","text":"杂凑"},{"key":"D","text":"签名"}],"answer":"C","analysis":"本题考查可信计算中计算度量值的实现原理。度量就是把被度量对象的内容做杂凑运算，得到定长摘要作为度量值，再通过扩展运算写入平台配置寄存器，从而能灵敏反映对象是否被改动。杂凑算法不可逆、抗碰撞，SM3是我国可信密码支撑平台采用的核心算法，故C正确；加密解密会改变内容且需要密钥，签名需要私钥、主要用于身份与不可否认，都不用于生成度量值。","correctReason":"计算度量值本质是对被度量数据作杂凑运算，得到定长摘要值。","wrongReason":"A：加密会改变数据形态且需密钥管理，不是度量方式；B：解密更与度量无关；D：签名用于身份认证与不可否认，不产生度量值。","source":"GM/T 0011-2023《可信计算 可信密码支撑平台功能与接口规范》","keyPoint":"度量值＝杂凑（SM3）运算结果。"},{"id":"第二部分专业题-三、标准题-单选题-47","no":47,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"依据GB/T20984-2022《信息安全技术 信息安全风险评估方法》要求，应在 风险识别基础上开展风险分析，以下关于风险分析的描述，错误的是（ ）。","options":[{"key":"A","text":"根据威胁频率，以及脆弱性被利用难易程度，计算安全事件发生的可能性"},{"key":"B","text":"根据安全事件造成的影响程度和资产价值，计算安全事件发生后对评估对象造 成的损失"},{"key":"C","text":"根据安全事件发生的可能性以及安全事件发生后造成的损失，计算系统资产面 临的风险值"},{"key":"D","text":"根据业务所涵盖的系统资产风险值综合计算得出业务风险值"}],"answer":"A","analysis":"本题考查风险评估中风险分析的算法模型。标准模型中，安全事件发生的可能性由威胁频率和脆弱性被利用的难易程度共同决定，而脆弱性被利用难易程度本身已综合了脆弱性严重程度与现有安全措施有效性，因此表述时不能再写成“以及脆弱性被利用难易程度”这种并列重复的算法，A为错误项。B是影响（损失）计算，C是风险值计算，D是业务风险综合计算，均与标准一致。","correctReason":"可能性计算须考虑威胁频率与脆弱性被利用难易程度并纳入已有安全措施，A项表述不符合标准给出的计算方法。","wrongReason":"B：根据影响程度与资产价值计算损失，符合标准的风险分析过程；C：风险值由可能性与损失共同确定，表述正确；D：业务风险由其所涵盖的系统资产风险综合得出，表述正确。","source":"GB/T 20984-2022《信息安全技术 信息安全风险评估方法》","keyPoint":"风险＝可能性×损失；可能性看威胁频率＋脆弱性难易度。"},{"id":"第二部分专业题-三、标准题-单选题-48","no":48,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"在GM/T0018-2023《密码设备应用接口规范》中，以下（ ）函数不是对称 算法类函数。","options":[{"key":"A","text":"对称加密"},{"key":"B","text":"对称解密"},{"key":"C","text":"计算MAC"},{"key":"D","text":"产生随机数"}],"answer":"D","analysis":"本题考查密码设备应用接口规范中函数的分类。该规范的接口按算法类别组织，对称算法类包括对称加密、对称解密以及基于对称算法的计算MAC（消息鉴别码）等函数；产生随机数属于随机数类接口，用于生成密钥、初始向量等，与对称算法并列而不属于其子集，故D正确。","correctReason":"产生随机数是独立的随机数类接口函数，不属于对称算法类函数。","wrongReason":"A：对称加密是对称算法类的核心函数；B：对称解密同样属于对称算法类函数；C：计算MAC基于对称算法实现，属于对称算法类函数。","source":"GM/T 0018-2023《密码设备应用接口规范》","keyPoint":"随机数生成是独立接口类，不属对称算法类。"},{"id":"第二部分专业题-三、标准题-单选题-49","no":49,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"根据GM/T0116-2023《信息系统密码应用测评过程指南》，以下关于测评方 对信息系统开展密码应用安全性评估时，应遵循的原则，其中错误的是（ ）。","options":[{"key":"A","text":"可重复性和可再现性原则"},{"key":"B","text":"经济性原则"},{"key":"C","text":"客观公正性原则"},{"key":"D","text":"结果完善性原则"}],"answer":"B","analysis":"本题考查密码应用安全性评估应遵循的基本原则。测评过程指南要求测评做到可重复、可再现，保持客观公正，并保证测评结果完善（覆盖应测内容、结论有依据），A、C、D都属于标准列出的原则。经济性原则不是密码应用安全性评估的原则，密评是合规性与安全性验证，不能因成本考虑而简化或取舍测评内容，故B为错误项。","correctReason":"密评原则为可重复性与可再现性、客观公正性、结果完善性，经济性不属于测评原则。","wrongReason":"A：可重复性和可再现性是标准明确要求的原则；C：客观公正性是测评机构必须遵循的原则；D：结果完善性同样是标准规定的测评原则。","source":"GM/T 0116-2023《信息系统密码应用测评过程指南》","keyPoint":"密评原则：可重复再现、客观公正、结果完善。"},{"id":"第二部分专业题-三、标准题-单选题-50","no":50,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"根据GM/T0029-2014《签名验签服务器技术规范》，签名验签服务器的初始 化主要包括（ ）、生成管理员等。使设备处于正常的工作状态。","options":[{"key":"A","text":"系统配置"},{"key":"B","text":"证书导入"},{"key":"C","text":"密钥导入"},{"key":"D","text":"日志记录"}],"answer":"A","analysis":"本题考查签名验签服务器的初始化内容。初始化是使设备从出厂状态进入正常工作状态的过程，主要包括系统配置（网络参数、时间、服务参数等）、生成管理员账号与权限，以及设备自检、密钥与证书的准备等。题目给出的空缺处对应系统配置，故选A。证书导入、密钥导入属于后续的密钥与证书管理操作，日志记录是运行期的审计行为，都不是初始化的首要组成部分。","correctReason":"签名验签服务器初始化主要包括系统配置、生成管理员等，使设备进入正常工作状态。","wrongReason":"B：证书导入属于设备投用后的证书管理操作，不是初始化内容；C：密钥导入属于密钥管理环节，不是初始化内容；D：日志记录是运行过程中的审计功能，与初始化无关。","source":"GM/T 0029-2014《签名验签服务器技术规范》","keyPoint":"签名验签服务器初始化＝系统配置＋生成管理员。"},{"id":"第二部分专业题-三、标准题-单选题-51","no":51,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"在GM/T0123-2022《时间戳服务器密码检测规范》中，SM2 签名算法使用的 对象标识符为（ ）","options":[{"key":"A","text":"SM2-1 数字签名算法1.2.156.10197.1.301.1"},{"key":"B","text":"公钥密码算法1.2.156.10197.1.300"},{"key":"C","text":"基于SM2 算法和SM3 算法的签名1.2.156.10197.1.501"},{"key":"D","text":"《SM2 椭圆曲线公钥密码算法》1.2.156.10197.6.1.1.3"}],"answer":"A","analysis":"本题考查SM2签名算法的对象标识符。密码检测需按OID准确区分算法与用途，SM2-1数字签名算法的OID为1.2.156.10197.1.301.1，故A正确。1.2.156.10197.1.300是SM2公钥密码算法总类标识，1.2.156.10197.1.501是基于SM2和SM3的签名应用标识，1.2.156.10197.6.1.1.3是SM2标准的文献标识，都不是签名算法本身的OID。","correctReason":"时间戳服务器使用SM2签名算法时的对象标识符为1.2.156.10197.1.301.1（SM2-1数字签名算法）。","wrongReason":"B：1.2.156.10197.1.300是SM2公钥密码算法的总类OID；C：1.2.156.10197.1.501对应基于SM2与SM3的签名应用标识；D：1.2.156.10197.6.1.1.3是SM2标准的文档标识，非算法OID。","source":"GM/T 0123-2022《时间戳服务器密码检测规范》","keyPoint":"SM2-1数字签名算法OID：1.2.156.10197.1.301.1。"},{"id":"第二部分专业题-三、标准题-单选题-52","no":52,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"在GM/T0123-2022《时间戳服务器密码检测规范》中，时间戳服务器应使用 （ ）进行管理员身份验证","options":[{"key":"A","text":"生物特征识别"},{"key":"B","text":"登录口令"},{"key":"C","text":"基于数字证书的数字签名"},{"key":"D","text":"验证码"}],"answer":"C","analysis":"本题考查时间戳服务器管理员身份验证的方式。时间戳服务器属于重要密码设备，管理员权限一旦被冒用就可能伪造时间戳，因此标准要求采用基于数字证书的数字签名进行管理员身份验证，通过私钥持有证明身份并具备抗抵赖性。登录口令、验证码属于弱认证手段，生物特征识别虽可用于增强认证，但不是该标准规定的验证方式，故C正确。","correctReason":"标准要求时间戳服务器使用基于数字证书的数字签名进行管理员身份验证。","wrongReason":"A：生物特征识别不是该标准规定的管理员验证方式；B：登录口令易被猜测、重放，安全强度不足；D：验证码只用于防自动化的辅助校验，不能证明管理员身份。","source":"GM/T 0123-2022《时间戳服务器密码检测规范》","keyPoint":"时间戳服务器管理员用数字证书签名验证身份。"},{"id":"第二部分专业题-三、标准题-单选题-53","no":53,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"GM/T0036-2014《采用非接触卡的门禁系统密码应用技术指南》附录中，采 用基于SM1/SM4 算法的非接触CPU 卡的方案方式与基于SM7 算法的非接触式 逻辑加密卡所采用的方案类似，主要不同点有（ ）。","options":[{"key":"A","text":"安全模块只需支持SM1/SM4 算法"},{"key":"B","text":"门禁卡需要实现一卡一密"},{"key":"C","text":"门禁卡与非接触读卡器间需要进行身份鉴别"},{"key":"D","text":"门禁卡与非接触读卡器间需要进行数据加密通讯"}],"answer":"A","analysis":"本题考查非接触卡门禁系统两种实施方案的差异。基于SM7算法的逻辑加密卡方案中，安全模块要同时支持SM7等算法以完成卡片认证；而改用基于SM1/SM4算法的非接触CPU卡后，卡内可自行完成密码运算，安全模块只需支持SM1/SM4算法即可，这是两方案最主要的实现差别，故A正确。一卡一密、卡与读卡器双向身份鉴别、通讯数据加密是两种方案共同要求的安全措施，并非差异点。","correctReason":"非接触CPU卡方案中密码运算在卡内完成，安全模块只需支持SM1/SM4算法，这是与SM7逻辑加密卡方案的主要不同点。","wrongReason":"B：一卡一密是两种方案都要求的安全措施，不是差异；C：卡与读卡器间身份鉴别两方案均需实现；D：数据加密通讯同样为两方案共同要求。","source":"GM/T 0036-2014《采用非接触卡的门禁系统密码应用技术指南》","keyPoint":"CPU卡方案安全模块只支持SM1/SM4，逻辑加密卡方案需SM7。"},{"id":"第二部分专业题-三、标准题-单选题-54","no":54,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"GM/T0031-2014《安全电子签章密码技术规范》中对制章人的描述正确的是 （ ）。","options":[{"key":"A","text":"制章人只能是单位证书"},{"key":"B","text":"制章人是电子印章系统中对文档进行签章操作的最终用户"},{"key":"C","text":"制章人即电子印章系统中具有签署和管理电子印章信息权限的管理员"},{"key":"D","text":"电子印章数据结构包括制章人信息即可，可以不包含制章人签名信息"}],"answer":"C","analysis":"本题考查电子印章系统中制章人的定义。制章人是电子印章系统中具有签署和管理电子印章信息权限的管理员，负责印章的制作、授权与维护。A项把制章人限定为单位证书过于绝对，个人证书也可作为身份载体；B项混淆了制章人与签章人，签章操作的最终用户是签章人；D项错误，电子印章数据结构必须包含制章人签名信息，否则无法验证印章来源与合法性，故C正确。","correctReason":"制章人是电子印章系统中对电子印章信息具有签署和管理权限的管理员，故C表述正确。","wrongReason":"A：制章人身份载体不限于单位证书，个人证书同样可用；B：对文档进行签章操作的最终用户是签章人，不是制章人；D：电子印章数据结构必须包含制章人签名信息，不能省略。","source":"GM/T 0031-2014《安全电子签章密码技术规范》","keyPoint":"制章人＝印章的制作管理者，签章人＝文档签章用户。"},{"id":"第二部分专业题-三、标准题-单选题-55","no":55,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"根据GB/T39786-2021《信息安全技术 信息系统密码应用基本要求》，以下 可用于应用和数据安全层面身份鉴别保护的密码产品是（）。","options":[{"key":"A","text":"IPSecVPN 设备"},{"key":"B","text":"智能密码钥匙"},{"key":"C","text":"电子文件密码应用系统"},{"key":"D","text":"电子门禁系统"}],"answer":"B","analysis":"本题考查各层面可用的密码产品对应关系。应用和数据安全层面的身份鉴别要求对登录用户进行身份真实性保护，需要能存储用户私钥并完成密码运算的终端密码产品，智能密码钥匙（USB Key）正是用于该层面的身份鉴别保护产品，故B正确。IPSec VPN设备属于网络和通信安全层面，电子文件密码应用系统用于数据保密性与完整性保护，电子门禁系统属于物理和环境安全层面。","correctReason":"智能密码钥匙是可用于应用和数据安全层面身份鉴别保护的密码产品。","wrongReason":"A：IPSec VPN设备用于网络和通信安全层面的通信加密与鉴别；C：电子文件密码应用系统用于数据保密性、完整性保护；D：电子门禁系统用于物理和环境安全层面的出入控制。","source":"GB/T 39786-2021《信息安全技术 信息系统密码应用基本要求》","keyPoint":"应用和数据层面身份鉴别用智能密码钥匙（USB Key）。"},{"id":"第二部分专业题-三、标准题-单选题-56","no":56,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"在依据GBT43206-2023《信息安全技术 信息系统密码应用测评要求》，在对 应用和数据安全中的“重要数据存储完整性”指标测评时，采用以下（ ）密码技 术无法被判定为符合。","options":[{"key":"A","text":"采用SM3-HMAC 算法计算消息鉴别码"},{"key":"B","text":"仅采用SM3 算法计算杂凑值"},{"key":"C","text":"使用SM4-CBC 模式生成消息鉴别码，其中初始向量为全0,消息长度为约定 好的固定长度"},{"key":"D","text":"使用SM3 和SM2 算法计算签名值"}],"answer":"B","analysis":"本题考查重要数据存储完整性的测评判定。完整性保护必须引入密钥，使验证值不能被攻击者随意重算。B项仅用SM3计算杂凑值，无密钥参与，任何人篡改数据后都能重新算出杂凑值，因此不能判定为符合。A项的SM3-HMAC、C项用SM4-CBC（初始向量全0、消息长度固定，避免长度扩展和IV可控问题）生成消息鉴别码、D项用SM3与SM2计算签名值，均有密钥保护，属于可接受的完整性机制。","correctReason":"仅计算SM3杂凑值无密钥参与，不具备抗篡改能力，无法判定为符合重要数据存储完整性要求。","wrongReason":"A：SM3-HMAC使用密钥，可提供完整性保护，可判定符合；C：SM4-CBC生成消息鉴别码且IV与长度受控，属于带密钥的完整性机制；D：SM3与SM2签名基于私钥，可提供完整性与不可否认性，可判定符合。","source":"GB/T 43206-2023《信息安全技术 信息系统密码应用测评要求》","keyPoint":"完整性必须有密钥：无密钥的裸杂凑不算符合。"},{"id":"第二部分专业题-三、标准题-单选题-57","no":57,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"在GM/T0034-2014《基于SM2 密码算法的证书认证系统密码及其相关安全技 术规范》中，关于安全操作与维护，以下说法不正确的是（ ）。","options":[{"key":"A","text":"改变系统的配置如无上级主管批准，操作时应有双人在场"},{"key":"B","text":"系统出现故障时，应由系统管理人员检查处理，其它人员未经批准不得处理"},{"key":"C","text":"对CA 系统的每次操作都应记录"},{"key":"D","text":"未经批准不得在服务器上安装任何软件"}],"answer":"A","analysis":"本题考查CA系统的安全操作与维护要求。标准要求改变系统配置须经上级主管批准，且操作时应由双人在场，但A项把“双人在场”写成了“如无上级主管批准”这一条件句下的动作，表述与标准原意不符，属不正确项。系统故障应由系统管理人员检查处理、他人未经批准不得处理，每次操作都要记录，未经批准不得在服务器上安装任何软件，B、C、D均为标准要求的正确表述。","correctReason":"标准要求改变系统配置须经批准并由双人在场，A项条件与要求表述不符，为不正确说法。","wrongReason":"B：系统故障由系统管理人员检查处理、他人未经批准不得处理，符合标准；C：对CA系统的每次操作都应记录，符合标准；D：未经批准不得在服务器上安装任何软件，符合标准。","source":"GM/T 0034-2014《基于SM2密码算法的证书认证系统密码及其相关安全技术规范》","keyPoint":"CA系统配置变更须审批＋双人在场，操作全程记录。"},{"id":"第二部分专业题-三、标准题-单选题-58","no":58,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"依据GM/T0037-2014《证书认证系统检测规范》，对于证书认证系统的审计 功能的检测，下列选项描述不正确的是（ ）。","options":[{"key":"A","text":"审计数据只能被审计员修改"},{"key":"B","text":"审计过的记录应有明显标记"},{"key":"C","text":"审计应能验证记录的签名"},{"key":"D","text":"应能够对事件发生的时间、事件操作者、操作类型、操作结果等信息进行审计"}],"answer":"A","analysis":"本题考查证书认证系统审计功能的检测要求。审计的核心价值在于记录不可被篡改，因此标准要求审计数据任何人均无权修改，只允许审计员查阅，A项“只能被审计员修改”本身就给修改留了口子，属不正确描述。审计过的记录应有明显标记、能验证记录签名、并对事件时间、操作者、操作类型、操作结果等进行审计，B、C、D均为正确要求。","correctReason":"审计数据应不可修改，只可由审计员查看，A项允许审计员修改审计数据不符合要求。","wrongReason":"B：审计过的记录应有明显标记，属正确要求；C：审计应能验证记录的签名，属正确要求；D：审计内容应覆盖时间、操作者、操作类型、操作结果，属正确要求。","source":"GM/T 0037-2014《证书认证系统检测规范》","keyPoint":"审计数据只可查、不可改，任何角色都不能修改。"},{"id":"第二部分专业题-三、标准题-单选题-59","no":59,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"依据GM/T0037-2014《证书认证系统检测规范》，以下描述不正确的是（ ）。","options":[{"key":"A","text":"RA 应能提供证书下载"},{"key":"B","text":"日志应能按操作者进行查询"},{"key":"C","text":"审计数据仅能由审计员更改"},{"key":"D","text":"证书认证系统应能通过密钥管理中心为已经注册的用户提供密钥恢复服务"}],"answer":"C","analysis":"本题考查证书认证系统检测规范中的相关描述判断。审计数据必须保证完整性与不可否认性，任何人员包括审计员都不得更改，C项“仅能由审计员更改”仍然允许修改，属不正确描述。RA应能提供证书下载，日志应能按操作者等条件查询，证书认证系统应能通过密钥管理中心为已注册用户提供密钥恢复服务，A、B、D均为规范中的正确要求。","correctReason":"审计数据任何人不得更改，C项允许审计员更改与审计数据的不可篡改要求相矛盾。","wrongReason":"A：RA应能提供证书下载，属规范的正确描述；B：日志应能按操作者进行查询，属规范的正确描述；D：应能通过密钥管理中心为已注册用户提供密钥恢复服务，属规范的正确描述。","source":"GM/T 0037-2014《证书认证系统检测规范》","keyPoint":"审计数据不可更改；RA可下载证书，KMC提供密钥恢复。"},{"id":"第二部分专业题-三、标准题-单选题-60","no":60,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"依据GM/T0003.3-2012《SM2 椭圆曲线公钥密码算法 第3 部分：密钥交换协 议》，在密钥交换协议中，若响应方B 计算出的椭圆曲线点V 为无穷远点，应 如何处理？（ ）","options":[{"key":"A","text":"重新生成随机数r_B"},{"key":"B","text":"终止协商并报错"},{"key":"C","text":"使用备用曲线参数"},{"key":"D","text":"忽略该点继续计算"}],"answer":"B","analysis":"本题考查SM2密钥交换协议中的异常处理。协议在B方计算得到椭圆曲线点V后，必须检验V是否为无穷远点，若是则说明随机数或公钥异常、计算结果落入无效状态，此时应终止协商并报错，绝不能继续计算或使用该点导出共享密钥，否则可能泄露密钥信息。重新生成随机数、使用备用曲线参数、忽略该点继续计算都不符合标准规定的处理方式，故B正确。","correctReason":"SM2密钥交换协议规定，若响应方B计算出的点V为无穷远点，应终止协商并报错。","wrongReason":"A：重新生成随机数属于自行变更协议流程，标准要求先终止；C：使用备用曲线参数会破坏双方参数一致性，协议不允许；D：忽略无穷远点继续计算会产生无效共享密钥，存在安全风险。","source":"GM/T 0003.3-2012《SM2椭圆曲线公钥密码算法 第3部分：密钥交换协议》","keyPoint":"密钥交换出现无穷远点：终止协商并报错。"},{"id":"第二部分专业题-三、标准题-单选题-61","no":61,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"依据GM/T0037-2014《证书认证系统检测规范》，关于RA 对申请信息的审 核，以下各项描述中不正确的是（ ）。","options":[{"key":"A","text":"应能提供对申请信息审核的界面"},{"key":"B","text":"应能将审核不通过的信息返回到录入界面"},{"key":"C","text":"应能自动使操作员对其操作行为进行签名"},{"key":"D","text":"应能自动批量对申请信息进行审核"}],"answer":"D","analysis":"本题考查RA（注册审核机构）对证书申请信息的审核功能要求。申请信息必须经人工核验身份与授权后逐条审核，审核不通过的要退回录入界面修改，且操作员的审核行为要用签名保证可追溯。系统并不要求具备“自动批量审核”能力，那样等于跳过人工核验，与标准的审核要求相悖。","correctReason":"D项“自动批量对申请信息进行审核”缺少人工核验环节，不符合RA审核功能要求，故为不正确项。","wrongReason":"A：标准要求提供审核界面，属正确要求；B：审核不通过退回录入界面是标准要求，属正确要求；C：操作行为签名用于保证审核可追溯，属正确要求。","source":"GM/T 0037-2014《证书认证系统检测规范》RA功能与审核要求","keyPoint":"RA审核须人工逐条核验，不得自动批量通过"},{"id":"第二部分专业题-三、标准题-单选题-62","no":62,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"依据GB/T43207-2023《信息安全技术 信息系统密码应用设计指南》，下列 关于密码支撑平台方案的设计内容描述错误的是（ ）。","options":[{"key":"A","text":"密码服务机构的确定、接入方式和服务策略"},{"key":"B","text":"提供的密码支撑方式（如租密码机方式、租密码服务器方式）"},{"key":"C","text":"接口和功能遵循的标准"},{"key":"D","text":"根据审计策略，为日志记录设计密码保护机制"}],"answer":"D","analysis":"密码支撑平台的设计内容主要围绕“由谁提供密码服务、怎么接入、服务策略如何、采用哪种支撑方式、接口和功能遵循哪些标准”展开，是密码资源与服务层面的规划。而为日志记录设计密码保护机制属于审计策略层面的安全设计，应放在日志与审计相关章节，不属于密码支撑平台方案的内容。","correctReason":"D项“根据审计策略，为日志记录设计密码保护机制”属于日志审计设计内容，不是密码支撑平台方案的设计内容。","wrongReason":"A：密码服务机构、接入方式与服务策略是支撑平台方案的核心内容；B：租密码机、租密码服务器等支撑方式是标准列举的设计内容；C：接口和功能遵循的标准也是支撑平台方案必须明确的内容。","source":"GB/T 43207-2023《信息安全技术 信息系统密码应用设计指南》密码支撑平台方案设计要求","keyPoint":"支撑平台管“服务怎么来怎么用”，日志保护属审计设计"},{"id":"第二部分专业题-三、标准题-单选题-63","no":63,"kind":"single","part":"第二部分专业题","cat":"三、标准题","type":"单选题","stem":"某政府网站首页被篡改为含有违法内容的页面，虽未造成数据泄露，但引发 社会广泛关注。根据GB/T20986-2023《信息安全技术 网络安全事件分类分级指 南》，该事件应归类为（ ）。","options":[{"key":"A","text":"网络攻击事件"},{"key":"B","text":"信息内容安全事件"},{"key":"C","text":"数据安全事件"},{"key":"D","text":"违规操作事件"}],"answer":"A","analysis":"GB/T 20986-2023按事件成因和表现形式分类，把利用网络技术手段对系统实施破坏的行为归入网络攻击事件，网页篡改是其典型形式。
